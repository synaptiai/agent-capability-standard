[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-agency"
version = "0.1.0"
description = "Claude Agent SDK integration for Grounded Agency capability standard"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Grounded Agency Team" },
]
keywords = [
    "ai",
    "agents",
    "claude",
    "sdk",
    "safety",
    "capabilities",
    "ontology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
sdk = [
    # Floor is the oldest release whose API this package actually uses; every
    # symbol imported here exists in 0.1.25. Do not raise it to whatever is
    # newest -- that excludes working installs for no reason.
    "claude-agent-sdk>=0.1.25,<0.3",
]
# Upper bounds are set to the major this repo is verified against, not to the
# next unreleased major. `mypy>=1.0,<3` would have admitted mypy 2.x, which is
# the upgrade the bound is meant to make deliberate rather than automatic.
# These caps say "the major CI has actually run" -- raising one means running
# the suite on it first. Exact versions live in constraints.txt.
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.21,<1",
    "mypy>=1.0,<2",
    # Formatting is not covered by semver: any ruff release may reformat code
    # or extend `ruff format` to new file types, turning a green CI red with no
    # source change -- 0.16.5 began formatting Python blocks inside Markdown
    # and broke CI on a commit touching only .gitignore. The exact version is
    # pinned in constraints.txt rather than here, so installing this package
    # does not conflict with a consumer's own ruff.
    "ruff>=0.16,<0.17",
    "types-PyYAML>=6.0,<7",
    "hypothesis>=6.0,<7",
    "jsonschema>=4.0,<5",
    "claude-agent-sdk>=0.1.25,<0.3",
]
all = [
    "grounded-agency[sdk,dev]",
]

[project.scripts]
acs = "tools.scaffold:main"

[project.urls]
Homepage = "https://github.com/synaptiai/agent-capability-standard"
Documentation = "https://github.com/synaptiai/agent-capability-standard/blob/main/docs/integrations/claude_agent_sdk.md"
Repository = "https://github.com/synaptiai/agent-capability-standard"

[tool.hatch.build.targets.wheel]
packages = ["grounded_agency"]

[tool.hatch.build.targets.sdist]
include = [
    "/grounded_agency",
    "/schemas",
    "/skills",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
asyncio_mode = "auto"
# Set explicitly: pytest-asyncio warns when it is unset, and the warning is a
# deprecation notice that the default will change. Naming it keeps behaviour
# stable across the supported pytest-asyncio range.
asyncio_default_fixture_loop_scope = "function"
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "^.venv/",
    "^_archive/",
]

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["grounded_agency"]
