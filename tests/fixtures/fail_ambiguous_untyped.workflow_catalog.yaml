# Standard version: 1.1.0
# A typed consumer reads an array whose item type the producer's schema
# leaves open, with no annotation to settle it: B204.
ambiguous_untyped:
  goal: Search, then compare the results.
  risk: low
  steps:
  - capability: search
    purpose: Find related code.
    store_as: search_out
    input_bindings:
      query: "status"
  - capability: compare
    purpose: Compare what the search found.
    store_as: compare_out
    input_bindings:
      options: "${search_out.results}"
