# Standard version: 1.1.0
# Negative fixture (STANDARD v1.1 §5.8): `in` needs a list or a map on the
# right; a boolean is a type error. B206.
membership_type:
  goal: Reject membership in a boolean.
  risk: low
  steps:
  - capability: verify
    purpose: Verify.
    store_as: verify_out
    input_bindings:
      conditions: []
  - capability: explain
    purpose: Explain.
    store_as: explain_out
    condition: '"x" in ${verify_out.passed}'
    input_bindings:
      conclusion: done
  success:
  - Never valid
