# Standard version: 1.2.0
# Positive fixture (STANDARD v1.2 §5.14, §5.17): in a workflow that targets
# 1.2, an approver that requires attested, authenticated approvers of given
# trust classes. No diagnostic.
approver_identity:
  goal: Apply a release change approved by two authenticated release managers.
  risk: high
  spec_version: "1.2"
  workflow_extensions:
    requires: [approval@1, identity@1]
  steps:
  - capability: checkpoint
    purpose: Save a restore point before the change.
    store_as: cp
    input_bindings:
      scope: release
  - capability: constrain
    purpose: Check the change against the release policy.
    store_as: policy
    input_bindings:
      target: release
      constraints: [release-policy]
  - capability: mutate
    purpose: Apply the release change.
    store_as: applied
    input_bindings:
      target: release
      operation: {promote: candidate}
    approval:
      approver:
        kind: human
        role: release-manager
        min_approvers: 2
        sender_check: [directory_id]
        accept_trust_classes: [decision_person]
  success:
  - The change is applied with two authenticated approvals
