# Standard version: 1.1.0
# The workflow field agents needs a workflow that targets 1.2 (STANDARD v1.2
# §5.15.2): S303, not W616.
review:
  goal: Have a reviewer critique the draft.
  risk: low
  agents: [reviewer-a]
  steps:
  - capability: delegate
    purpose: Ask the reviewer.
    store_as: review_a
    input_bindings:
      agent: reviewer-a
      task: {draft: d}
