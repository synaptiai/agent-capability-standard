# Standard version: 1.1.0
# A reference names a path the producer's output schema does not have: B201.
bad_binding_path:
  goal: Search, then compare the results.
  risk: low
  steps:
  - capability: search
    purpose: Find related code.
    store_as: search_out
    input_bindings:
      query: "status"
  - capability: compare
    purpose: Compare what the search found.
    store_as: compare_out
    input_bindings:
      options: "${search_out.no_such_field}"
