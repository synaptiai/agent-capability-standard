# Standard version: 1.1.0
# A workflow that targets 1.1 but gives an approver accept_trust_classes,
# new in 1.2, is W616 at its step (STANDARD v1.2 §5.14, §5.17, §11.5); as in
# 1.1, the member is unknown there (W604) and nothing applies it. Declaring
# 1.2 clears both.
trust_classes_in_1_1:
  goal: Apply a change approved by a decision maker, written for 1.1.
  risk: high
  workflow_extensions:
    requires: [approval@1]
  steps:
  - capability: checkpoint
    purpose: Save a restore point before the change.
    store_as: cp
    input_bindings:
      scope: release
  - capability: constrain
    purpose: Check the change against the release policy.
    store_as: policy
    input_bindings:
      target: release
      constraints: [release-policy]
  - capability: mutate
    purpose: Apply the release change.
    store_as: applied
    input_bindings:
      target: release
      operation: {promote: candidate}
    approval:
      approver:
        kind: human
        accept_trust_classes: [decision_person]
  success:
  - The change is applied once a decision maker approves
