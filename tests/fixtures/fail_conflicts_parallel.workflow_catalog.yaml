# Standard version: 1.1.0
# 'mutate conflicts_with rollback': the two may not share a parallel_group
# (F504).
mutate_and_rollback_concurrently:
  goal: Mutate and roll back at the same time.
  risk: high
  steps:
  - capability: plan
    purpose: Plan the change.
    store_as: plan_out
    input_bindings:
      goal: "resolve the request"
  - capability: constrain
    purpose: Check the change against policy.
    store_as: policy_out
    input_bindings:
      target: "the change"
      constraints: ["change policy"]
  - capability: checkpoint
    purpose: Save a restore point.
    store_as: checkpoint_out
    input_bindings:
      scope: "workspace"
  - capability: mutate
    purpose: Apply the change.
    store_as: mutate_out
    input_bindings:
      target: "system"
      operation: {"set": true}
    parallel_group: apply
  - capability: rollback
    purpose: Restore the checkpoint.
    store_as: rollback_out
    input_bindings:
      checkpoint_id: "${checkpoint_out.checkpoint_id}"
    parallel_group: apply
