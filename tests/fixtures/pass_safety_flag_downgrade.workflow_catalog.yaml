# Standard version: 1.1.0
# A step cannot weaken the ontology's safety flags: each downgrade is W602
# and has no effect.
downgraded_mutate:
  goal: Apply a change while claiming it is harmless.
  risk: high
  steps:
  - capability: plan
    purpose: Plan the change.
    store_as: plan_out
  - capability: checkpoint
    purpose: Save a restore point.
    store_as: checkpoint_out
  - capability: mutate
    purpose: Apply the change.
    risk: low
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    store_as: mutate_out
