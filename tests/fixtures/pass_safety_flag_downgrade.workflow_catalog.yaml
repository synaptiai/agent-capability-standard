# Standard version: 1.1.0
# A step cannot weaken the ontology's safety flags: each downgrade is W602
# and has no effect.
downgraded_mutate:
  goal: Apply a change while claiming it is harmless.
  risk: high
  steps:
  - capability: plan
    purpose: Plan the change.
    store_as: plan_out
    input_bindings:
      goal: "resolve the request"
  - capability: constrain
    purpose: Check the change against policy.
    store_as: policy_out
    input_bindings:
      target: "the change"
      constraints: ["change policy"]
  - capability: checkpoint
    purpose: Save a restore point.
    store_as: checkpoint_out
    input_bindings:
      scope: "workspace"
  - capability: mutate
    purpose: Apply the change.
    risk: low
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    store_as: mutate_out
    input_bindings:
      target: "system"
      operation: {"set": true}
