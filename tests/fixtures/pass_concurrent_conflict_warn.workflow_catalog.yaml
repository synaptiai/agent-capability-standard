# Standard version: 1.1.0
# A schedule that lets runs overlap on a workflow that persists and rolls
# back (STANDARD v1.2 §4.3): W623.
nightly:
  goal: Persist the state and roll back on demand.
  risk: medium
  workflow_extensions:
    requires: [triggers@1]
  triggers:
  - kind: schedule
    schedule: {every: 1h, overlap: allow_all}
  steps:
  - capability: checkpoint
    purpose: Save the state.
    store_as: cp
    input_bindings: {scope: state}
  - capability: persist
    purpose: Persist the summary.
    store_as: saved
    input_bindings: {data: summary}
  - capability: rollback
    purpose: Restore the state.
    store_as: restored
    input_bindings: {checkpoint_id: "${cp.checkpoint_id}"}
