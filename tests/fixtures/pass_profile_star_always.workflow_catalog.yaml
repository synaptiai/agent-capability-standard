# Standard version: 1.1.0
# Validated with tests/fixtures/profiles/star_always.profile.yaml: "*" covers
# every step but the checkpoint steps, which need no checkpoint before them
# (Standard v1.2 §5.21.3), and every other step has one before it.
gather:
  goal: Gather and reshape data, then gather more.
  risk: low
  steps:
  - capability: checkpoint
    purpose: Save a restore point.
    store_as: cp1
    input_bindings:
      scope: workspace
  - capability: retrieve
    purpose: Read the source.
    store_as: first
    input_bindings:
      target: source-a
  - capability: transform
    purpose: Reshape it.
    store_as: shaped
    input_bindings:
      input: "${first.data: object}"
      target_format: summary
  - capability: checkpoint
    purpose: Save another restore point.
    store_as: cp2
    input_bindings:
      scope: workspace
  - capability: retrieve
    purpose: Read the second source.
    store_as: second
    input_bindings:
      target: source-b
