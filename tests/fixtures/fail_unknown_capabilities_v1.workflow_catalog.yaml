# Standard version: 1.0.0
# Capability names from the 99-capability v1 model are not in the
# 36-capability ontology: V101 for each.
v1_names:
  goal: Diagnose a regression with v1 capability names.
  risk: low
  steps:
  - capability: inspect
    purpose: Observe failing behavior.
    store_as: inspect_out
  - capability: detect-anomaly
    purpose: Find the anomaly in what was observed.
    store_as: anomaly_out
  - capability: estimate-risk
    purpose: Estimate the risk of the anomaly.
    store_as: risk_out
