# Standard version: 1.2.0
# A delegation that continues an earlier one (STANDARD v1.2 §5.15.3):
# continues is in the contract, and task_id is a valid path.
review:
  goal: Review the draft, then continue the review.
  risk: low
  agents: [reviewer-a]
  steps:
  - capability: delegate
    purpose: Ask the reviewer.
    store_as: review_a
    input_bindings:
      agent: reviewer-a
      task: {draft: d}
  - capability: delegate
    purpose: Continue the reviewer's work.
    store_as: review_b
    input_bindings:
      agent: reviewer-a
      task: {draft: d}
      continues: "${review_a.task_id}"
