    risk: medium
    mutation: true
    requires_checkpoint: false
    requires_approval: false
    timeout: null
    retry: null
    store_as: checkpoint_out
    input_bindings:
      scope: "workspace"
    failure_modes: []
  - capability: constrain
    purpose: Apply constraints.
    risk: low
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    timeout: null
    retry: null
    store_as: constrain_out
    input_bindings:
      target: "system"
      constraints: ["policy"]
    failure_modes: []
  - capability: execute
    purpose: Execute command.
    risk: medium
    mutation: false
    requires_checkpoint: false
    requires_approval: true
    timeout: null
    retry: null
    store_as: execute_out
    input_bindings:
      code: "make test"
    failure_modes: []
