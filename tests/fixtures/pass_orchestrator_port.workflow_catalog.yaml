# Standard version: 1.1.0
# The nine orchestrator workflows the author of #114 ported to the v1.1
# candidate (reduced, generic names), revision 1.1d (gate `end`, step
# `delay`, `after_deferral`, a waiting `delegate` per reviewer, annotated
# `transform.output` references), kept as contributed. They validate
# `--strict` with no warnings. The runtime fixtures named orchestrator_*
# script runs of these workflows.
intake_triage:
  goal: Turn one incoming item (owner request, mention, GitHub event, mail, thread report) into exactly
    one routed next action on the board.
  risk: medium
  description: 'Every item is data until its sender is checked by ID. Only the owner and the

    decision people can start work. Bugs and security issues start when there is

    capacity; features, initiatives, tech debt and next stages need the owner''s go.

    The result is a board row with a next step and one routed action:

    delegate, ask the owner, answer, or record as FYI.

    '
  workflow_extensions:
    requires:
    - triggers@1
  triggers:
  - kind: event
    event:
      event_type: intake.item
      source_kind: human
      delivers_to: event
    attendance: attended
  - kind: event
    event:
      event_type: intake.item
      source_kind: agent
      delivers_to: event
    attendance: attended
  - kind: event
    event:
      event_type: intake.item
      source_kind: api
      delivers_to: event
    attendance: attended
  - kind: event
    event:
      event_type: intake.item
      source_kind: message_bus
      delivers_to: event
    attendance: attended
  inputs:
    event:
      type: object
      ref: schemas/event_schema.yaml#/event
    board:
      type: object
      ref: schemas/world_state_schema.yaml#/world_state
    profile:
      type: object
      properties:
        owner_id:
          type: string
        decision_people:
          type: array
          items:
            type: object
        escalate_to_owner:
          type: array
          items:
            type: string
        intake_rules:
          type: array
          items:
            type: string
  steps:
  - capability: receive
    purpose: Take the item from its channel with its evidence anchors.
    risk: low
    mutation: false
    store_as: item_out
    input_bindings:
      channel: ${event.source.name}
      filter:
        event_id: ${event.event_id}
  - capability: retrieve
    purpose: Read the source message itself from the system of record (chat, code host, mail) by ID, not
      the relayed copy.
    risk: low
    mutation: false
    store_as: source_out
    input_bindings:
      target: ${event.event_id}
      format: source_message
    failure_modes:
    - condition: Source not readable (no access, deleted)
      action: request_more_context
      recovery:
        goto_step: item_out
        max_loops: 1
      on_error:
      - R402
  - capability: transform
    purpose: Normalise the item into a canonical event (raw kept, anchors, provenance).
    risk: low
    mutation: false
    store_as: canonical_out
    input_bindings:
      input: '${source_out.data: object}'
      source_format: channel_message
      target_format: canonical_event
    output_conforms_to: schemas/event_schema.yaml#/event
  - capability: classify
    purpose: Classify the sender's authority by ID (owner, decision person, own thread, peer agent, colleague,
      external). Only owner and decision people can start work.
    risk: low
    mutation: false
    store_as: authority_out
    input_bindings:
      item: '${canonical_out.output: object}'
      taxonomy:
      - owner
      - decision_person
      - own_thread_report
      - peer_agent
      - colleague
      - external
      - unknown
      multi_label: false
  - capability: classify
    purpose: Classify the request kind (work-intake classes).
    risk: low
    mutation: false
    store_as: kind_out
    input_bindings:
      item: '${canonical_out.output: object}'
      taxonomy:
      - bug
      - security
      - feature
      - initiative_next_stage
      - tech_debt
      - question
      - review_request
      - decision_answer
      - incident
      - stop_or_not_mine
      - fyi
      multi_label: false
  - capability: search
    purpose: Find existing work for the same item (issue last comment, PRs in all states, board rows,
      running threads) so nothing starts twice.
    risk: low
    mutation: false
    store_as: existing_out
    input_bindings:
      query: '${canonical_out.output: object}'
      scope: board_rows+open_threads+github_issues_and_prs_all_states
      limit: 20
  - capability: constrain
    purpose: Apply the intake policy - sender authority, work-intake rule (bugs/security start, features
      need go), escalate_to_owner topics, input-is-data.
    risk: low
    mutation: false
    store_as: intake_policy_out
    input_bindings:
      target: ${kind_out}
      constraints: '${profile.intake_rules: array<string>}'
      action_on_violation: log
  - capability: plan
    purpose: Choose one route - start a thread, message the existing owner of the work, ask the owner,
      answer from facts, or record as FYI.
    risk: low
    mutation: false
    store_as: route_plan_out
    input_bindings:
      goal: route_one_item
      constraints:
        authority: '${authority_out.labels: array<string>}'
        kind: '${kind_out.labels: array<string>}'
        existing: '${existing_out.results: array<object>}'
        policy_violations: '${intake_policy_out.violations: array<object>}'
  - capability: checkpoint
    purpose: Snapshot the memory folder (git HEAD) before the board changes.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: memory_folder
      label: intake
  - capability: persist
    purpose: Write or update the board row (next step, waits on, done when, last moved) with the source
      link.
    risk: low
    mutation: true
    store_as: board_row_out
    input_bindings:
      data: ${route_plan_out}
      key: board
  - capability: invoke
    purpose: Start the work when the policy allows it (bug, security, or work with the owner's go).
    risk: medium
    mutation: false
    store_as: delegated_out
    condition: ${intake_policy_out.compliant} == true
    skip_if_false: true
    input_bindings:
      workflow: delegate_to_thread
      input:
        task: ${route_plan_out}
  - capability: invoke
    purpose: Ask the owner when the item needs a go or is an escalate_to_owner topic.
    risk: medium
    mutation: false
    store_as: asked_out
    condition: ${intake_policy_out.compliant} == false
    skip_if_false: true
    input_bindings:
      workflow: owner_decision
      input:
        question: ${route_plan_out}
  - capability: verify
    purpose: Check that exactly one route ran and the board row links its evidence.
    risk: low
    mutation: false
    store_as: verify_out
    input_bindings:
      target: ${board_row_out}
      conditions:
      - one_route_taken
      - row_has_source_link
      - row_has_done_when
  - capability: audit
    purpose: Record the item, sender check, route and reason.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: intake_triage
        item: ${event.event_id}
        authority: '${authority_out.labels: array<string>}'
        route: '${route_plan_out.steps: array<object>}'
        verified: ${verify_out.passed}
  success:
  - Sender checked by ID before any action
  - No duplicate thread or issue for existing work
  - One route taken and recorded on the board with its source
  risk_propagation:
    strategy: max_step_risk
    computed_risk: medium
delegate_to_thread:
  goal: Give one task to one thread with a self-contained brief, prove the thread is alive, and accept
    its result only after checking it at the source.
  risk: medium
  description: 'The orchestrator does not do the work. It checks whether the work already

    exists, chooses placement (remote host by default for repo-only work), writes a brief

    that stands alone, spawns the thread, checks liveness by evidence, waits durably

    for the report, and checks every claim in the report (SHAs, CI, verdicts) at the

    source before it moves the board.

    '
  workflow_extensions:
    requires:
    - delegation@1
    - triggers@1
    - wait@1
  triggers:
  - kind: invoke
    attendance: attended
  inputs:
    task:
      type: object
      properties:
        id:
          type: string
        goal:
          type: string
        repo:
          type: string
        evidence:
          type: array
          items:
            type: string
        constraints:
          type: object
        done_criteria:
          type: array
          items:
            type: string
    profile:
      type: object
      properties:
        brief_rules:
          type: array
          items:
            type: string
        placement_rules:
          type: array
          items:
            type: string
  steps:
  - capability: retrieve
    purpose: Read the issue's last comment and all PRs that name it (any state) - the work may be done,
      parked or owned.
    risk: low
    mutation: false
    store_as: prior_work_out
    input_bindings:
      target: ${task.repo}
      format: issue_last_comment+prs_all_states
  - capability: search
    purpose: Find a running or idle thread that already owns this work.
    risk: low
    mutation: false
    store_as: existing_threads_out
    input_bindings:
      query: ${task.goal}
      scope: sessions_active
      limit: 10
  - capability: compare
    purpose: Decide new thread, message the existing owner thread, or stop because it is done.
    risk: low
    mutation: false
    store_as: route_out
    input_bindings:
      options:
      - new_thread
      - message_existing_thread
      - already_done
      criteria:
      - prior_work
      - thread_liveness
      - scope_fit
  - capability: decompose
    purpose: Split the goal only when parts are independent; otherwise one thread per complete feature.
    risk: low
    mutation: false
    store_as: parts_out
    input_bindings:
      problem: ${task.goal}
      max_depth: 1
      strategy: one_complete_feature_per_thread
  - capability: plan
    purpose: Choose agent, project and worktree, placement (remote host default; local for UI, keychain,
      AWS, browser, notes), pipeline (review pipeline) and the first check-in time.
    risk: low
    mutation: false
    store_as: plan_out
    input_bindings:
      goal: ${task.goal}
      constraints:
        placement_rules: '${profile.placement_rules: array<string>}'
        parts: '${parts_out.subproblems: array<object>}'
        route: ${route_out.recommendation}
  - capability: constrain
    purpose: Set the brief rules before drafting - repo, evidence (file:line, logs, links), constraints,
      done criteria, GH_HOST, "report back with send_message when done or blocked".
    risk: low
    mutation: false
    store_as: brief_policy_out
    input_bindings:
      target: ${plan_out}
      constraints: '${profile.brief_rules: array<string>}'
  - capability: generate
    purpose: Write the brief. It must stand alone; the thread cannot see this conversation.
    risk: low
    mutation: false
    store_as: brief_out
    input_bindings:
      specification:
        task: ${task}
        plan: '${plan_out.steps: array<object>}'
      format: thread_brief
    gates:
    - when: ${route_out.recommendation} == "already_done"
      action: stop
      message: The work exists or is done. Update the board instead of starting a thread.
    - when: ${brief_policy_out.compliant} == false
      action: stop
      message: The plan breaks a brief rule (placement, agent, scope). Plan again.
  - capability: constrain
    purpose: Check the written brief against the brief rules (each rule present, no secret, no <classification
      label> quote).
    risk: low
    mutation: false
    store_as: brief_check_out
    input_bindings:
      target: '${brief_out.content: object}'
      constraints: '${profile.brief_rules: array<string>}'
      action_on_violation: block
  - capability: checkpoint
    purpose: Record the in-flight state before the spawn (profile before_delegation always).
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: state.json
      label: delegate
  - capability: delegate
    purpose: Spawn the thread with the brief.
    risk: medium
    mutation: false
    store_as: delegate_out
    input_bindings:
      task:
        brief: '${brief_out.content: object}'
        task_id: ${task.id}
      agent: author-agent
      constraints:
        placement: '${plan_out.steps: array<object>}'
      fresh_context: true
      role: author
    gates:
    - when: ${brief_check_out.compliant} == false
      action: stop
      message: The brief breaks a brief rule. Fix the brief first.
    - when: ${delegate_out.task_id} == null
      phase: after
      action: stop
      message: The host returned no task id, so no report can be matched to this thread. Do not record
        or wait.
    failure_modes:
    - condition: remote host start fails (capacity or unavailable)
      action: request_more_context
      recovery:
        goto_step: plan_out
        inject_context:
          failure: remote_start_failed
        max_loops: 1
      on_error:
      - R402
  - capability: persist
    purpose: Add the thread to state.json items (thread id, brief summary, check-in time).
    risk: low
    mutation: true
    store_as: inflight_out
    input_bindings:
      data: ${delegate_out}
      key: state.json
  - capability: observe
    purpose: Liveness check about a minute after the spawn - running true, or entry count grows, or a
      pending tool_use. Never report "working" before this.
    risk: low
    mutation: false
    store_as: liveness_out
    input_bindings:
      target: ${delegate_out.task_id}
      aspects:
      - running
      - entry_count
      - last_entry_kind
  - capability: receive
    purpose: Read the thread's report from the mailbox; accept it only from the thread's own session id.
    risk: low
    mutation: false
    store_as: report_out
    input_bindings:
      channel: mailbox
      filter:
        from_session: ${delegate_out.task_id}
      accept_from:
      - ${delegate_out.task_id}
    timeout: 4h
    wait:
      event_type: thread.turn_end
      source_kind: agent
      correlate:
        task_id: ${delegate_out.task_id}
      liveness:
        mode: probe
        interval: 10m
        failure_threshold: 3
    failure_modes:
    - condition: No liveness signal for 30 min (R406). Check the evidence again, then wait again. A report
        that is late past the timeout (R401) is not handled here and ends the run; the scheduled sweep
        finds it.
      on_error:
      - R406
      action: pause_and_checkpoint
      recovery:
        goto_step: liveness_out
        max_loops: 2
  - capability: ground
    purpose: Check each claim in the report at the source (PR head SHA, CI conclusions, posted verdicts,
      merged state). A thread report is a derived claim, not evidence.
    risk: low
    mutation: false
    store_as: ground_out
    input_bindings:
      claim: ${task.goal}
      sources:
      - '${report_out.data: array<object>}'
      - '${prior_work_out.evidence_anchors: array<object>}'
      - '${liveness_out.evidence_anchors: array<object>}'
      required_strength: strong
  - capability: verify
    purpose: Check the done criteria against the grounded evidence.
    risk: low
    mutation: false
    store_as: done_out
    input_bindings:
      target: ${ground_out}
      conditions: ${task.done_criteria}
      strict: true
    failure_modes:
    - condition: Done criteria not met or a claim not grounded
      action: request_more_context
      recovery:
        goto_step: report_out
        inject_context:
          gaps: ${ground_out.gaps}
        max_loops: 2
      when: ${done_out.passed} == false
  - capability: persist
    purpose: Move the board row and the in-flight item with the evidence link.
    risk: low
    mutation: true
    store_as: board_out
    input_bindings:
      data: ${done_out}
      key: board
  - capability: audit
    purpose: Record the delegation, liveness evidence, report and the checks.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: delegate_to_thread
        task_id: ${task.id}
        thread: ${delegate_out.task_id}
        grounded: ${ground_out.grounded}
        done: ${done_out.passed}
  success:
  - No thread starts for work that exists or is done
  - The brief passes every brief rule
  - Liveness proven by evidence before any "working" claim
  - Every relayed claim was read at its source
  risk_propagation:
    strategy: max_step_risk
    computed_risk: medium
review_gate:
  goal: Get two independent BLESSED verdicts on the final head SHA of a change, posted where the merger
    reads them, or stop after three failed rounds with the open blockers handed to a decider.
  risk: high
  description: 'The same gate serves code (code reviewers, BLESSED/RETHINK) and documents

    (the checker, CONFIRMED/WRONG/PARTLY/UNVERIFIABLE) through the verdict

    contract. Reviewers are read-only threads with a fresh context. Reviewer B never

    sees earlier rounds (quorum.forbidden_inputs, per reviewer); one passing verdict must have scope full
    (quorum.min_full). The runner (the author thread in the review pipeline, or the

    orchestrator for an existing PR) owns every fix; reviewers own the judgement.

    Pre-send checks are `constrain` steps and post-send checks are `verify` steps,

    because the ontology orders constrain -> send -> verify -> audit.

    '
  workflow_extensions:
    requires:
    - approval@1
    - delegation@1
    - quorum@1
    - recovery@1
    - triggers@1
    - wait@1
  triggers:
  - kind: invoke
    attendance: attended
  inputs:
    change:
      type: object
      properties:
        repo:
          type: string
        number:
          type: string
        head_sha:
          type: string
        last_reviewed_sha:
          type: string
        base:
          type: string
        worktree:
          type: string
        critical:
          type: boolean
        requirement_ref:
          type: string
    round:
      type: object
      properties:
        index:
          type: number
        prior_findings:
          type: array
          items:
            type: object
    policy:
      type: object
      properties:
        independence_rules:
          type: array
          items:
            type: string
        post_rules:
          type: array
          items:
            type: string
  steps:
  - capability: observe
    purpose: Read the change at the source - full head SHA, draft state, CI state.
    risk: low
    mutation: false
    store_as: change_state_out
    input_bindings:
      target: ${change.number}
      aspects:
      - head_sha
      - is_draft
      - ci_checks
      - mergeable
  - capability: retrieve
    purpose: Get the delta since the last reviewed head (git diff last_reviewed_sha..head_sha, patch-id).
    risk: low
    mutation: false
    store_as: delta_out
    input_bindings:
      target: ${change.head_sha}
      format: diff_since_last_reviewed
  - capability: classify
    purpose: Size the round from the delta - body only, text only, tests only, production code, identical
      patch-id rebase.
    risk: low
    mutation: false
    store_as: delta_class_out
    input_bindings:
      item: '${delta_out.data: object}'
      taxonomy:
      - body_only
      - text_only
      - tests_only
      - production
      - identical_patch_id
      - first_round
      multi_label: false
  - capability: plan
    purpose: Decide the reviewers for this round - none (body only, identical patch-id), one narrow delta
      reviewer (text or tests only), or a pair A+B (production or first round); reviewer-b for B when
      critical.
    risk: low
    mutation: false
    store_as: round_plan_out
    input_bindings:
      goal: review_round
      constraints:
        delta_class: '${delta_class_out.labels: array<string>}'
        critical: ${change.critical}
        round_index: '${round.index: number}'
  - capability: constrain
    purpose: Fix the independence rules before any brief is written (fresh context, read-only, no earlier
      verdicts in B, verdict file written early).
    risk: low
    mutation: false
    store_as: independence_out
    input_bindings:
      target: ${round_plan_out}
      constraints: '${policy.independence_rules: array<string>}'
  - capability: generate
    purpose: Brief for reviewer A (fix verifier) with the "Prior rounds" section.
    risk: low
    mutation: false
    store_as: brief_a_out
    input_bindings:
      specification:
        template: reviewer_template
        head_sha: ${change.head_sha}
        prior_findings: ${round.prior_findings}
      format: reviewer_brief
  - capability: generate
    purpose: Brief for reviewer B (full sweep) - repo, change, head SHA and requirement only.
    risk: low
    mutation: false
    store_as: brief_b_out
    input_bindings:
      specification:
        template: reviewer_template
        head_sha: ${change.head_sha}
        requirement: ${change.requirement_ref}
      format: reviewer_brief
  - capability: constrain
    purpose: Check brief B text - it must not contain RETHINK, BLESSED, round, earlier findings or a review-history
      section.
    risk: low
    mutation: false
    store_as: brief_b_check_out
    input_bindings:
      target: '${brief_b_out.content: object}'
      constraints: '${policy.independence_rules: array<string>}'
      action_on_violation: block
  - capability: checkpoint
    purpose: Record the author worktree state (git rev-parse HEAD, git status --porcelain) to prove later
      that review did not change it.
    risk: low
    mutation: true
    store_as: worktree_ckpt_out
    input_bindings:
      scope: ${change.worktree}
      label: pre_review
  - capability: delegate
    purpose: Reviewer A, fresh thread, read-only, runs tests and sabotage in its own scratch worktree;
      the step waits for A's own verdict. A silent or late A is replaced alone.
    risk: medium
    mutation: false
    store_as: reviewer_a_out
    gates:
    - when: ${independence_out.compliant} == false
      action: stop
      message: The round plan breaks an independence rule. Do not start reviewers.
    parallel_group: reviewers
    join: all_complete
    input_bindings:
      task: '${brief_a_out.content: object}'
      agent: reviewer-a
      fresh_context: true
      model_family: family_a
      role: reviewer
      read_only: true
      accept_from:
      - reviewer-a
    timeout: 45m
    retry:
      max: 1
      backoff: none
    wait:
      event_type: thread.turn_end
      source_kind: agent
      correlate:
        head_sha: ${change.head_sha}
      liveness:
        mode: probe
        interval: 10m
        failure_threshold: 3
    failure_modes:
    - condition: Reviewer A went silent (R406) or did not finish in time (R401), also after one replacement
        (the retry replaces only this reviewer). Hand to the decider.
      on_error:
      - R401
      - R406
      action: escalate
      recovery:
        goto_step: round_cap_out
  - capability: delegate
    purpose: Reviewer B, fresh thread, read-only, full sweep without review history; second model family
      on critical changes. The step waits for B's own verdict.
    risk: medium
    mutation: false
    store_as: reviewer_b_out
    parallel_group: reviewers
    join: all_complete
    input_bindings:
      task: '${brief_b_out.content: object}'
      agent: reviewer-b
      fresh_context: true
      model_family: family_b
      role: reviewer
      read_only: true
      accept_from:
      - reviewer-b
    gates:
    - when: ${brief_b_check_out.compliant} == false
      action: stop
      message: Brief B leaks review history. It is not a full sweep. Rewrite it.
    timeout: 45m
    retry:
      max: 1
      backoff: none
    wait:
      event_type: thread.turn_end
      source_kind: agent
      correlate:
        head_sha: ${change.head_sha}
      liveness:
        mode: probe
        interval: 10m
        failure_threshold: 3
    failure_modes:
    - condition: Reviewer B went silent (R406) or did not finish in time (R401), also after one replacement
        (the retry replaces only this reviewer). Hand to the decider.
      on_error:
      - R401
      - R406
      action: escalate
      recovery:
        goto_step: round_cap_out
  - capability: classify
    purpose: Read each verdict against the contract - BLESSED or RETHINK stated once, for the full head
      SHA; anything else is NO_VERDICT.
    risk: low
    mutation: false
    store_as: verdict_class_out
    input_bindings:
      item: &id001
      - '${reviewer_a_out.result: object}'
      - '${reviewer_b_out.result: object}'
      taxonomy:
      - BLESSED
      - RETHINK
      - NO_VERDICT
      multi_label: false
  - capability: critique
    purpose: Check each finding before acting on it - a finding can be wrong; accept with a fix, or challenge
      with file:line or test evidence.
    risk: low
    mutation: false
    store_as: finding_check_out
    input_bindings:
      target: *id001
      criteria:
      - trigger_reproducible
      - file_line_evidence
      - blocker_definition_met
      severity_threshold: blocker
  - capability: constrain
    purpose: Check the verdict post before it goes out - first line "Reviewed <full sha>", lines meant
      for the orchestrator cut, length within the limit (post-script rules).
    risk: low
    mutation: false
    store_as: post_check_out
    input_bindings:
      target: *id001
      constraints: '${policy.post_rules: array<string>}'
      action_on_violation: block
  - capability: checkpoint
    purpose: Checkpoint after the wait, before the verdict post (a checkpoint taken before a wait no longer
      authorises the send).
    risk: low
    mutation: true
    store_as: post_ckpt_out
    input_bindings:
      scope: verdict_post
      label: pre_post
  - capability: send
    purpose: Post every verdict, BLESSED or RETHINK, on the change as a comment pinned to the reviewed
      SHA.
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: post_out
    input_bindings:
      destination: ${change.number}
      payload: *id001
      protocol: github_pr_review_comment
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: mandates
      shows:
      - ${reviewer_a_out.result}
      - ${reviewer_b_out.result}
      - ${change.head_sha}
      binds_to: digest
      recheck:
        source: ${change_state_out}
        compare: digest
        on_change: reask
    gates:
    - when: ${post_check_out.compliant} == false
      action: stop
      message: Verdict post breaks the post rules.
  - capability: verify
    purpose: Read back the posted reviews (commit_id equals the reviewed SHA) and check the author worktree
      is unchanged against the checkpoint.
    risk: low
    mutation: false
    store_as: readback_out
    input_bindings:
      target: ${post_out}
      conditions:
      - posted_commit_id_equals_head
      - worktree_head_unchanged
      - worktree_status_unchanged
      strict: true
  - capability: constrain
    purpose: Apply the quorum - two BLESSED on the final head SHA from two model families, no RETHINK.
    risk: low
    mutation: false
    store_as: quorum_out
    input_bindings:
      target: *id001
      constraints:
      - two_independent_blessed_on_head
      action_on_violation: block
    quorum:
      verdicts: *id001
      reviewers:
      - reviewer_a_out
      - reviewer_b_out
      vocabulary:
      - BLESSED
      - RETHINK
      pass_values:
      - BLESSED
      blocking_values:
      - RETHINK
      min_pass: 2
      pinned_to: ${change.head_sha}
      forbidden_inputs:
        reviewer_b_out:
        - round
        - brief_a_out
      min_full: 1
      require_fresh_context: true
      require_model_families:
      - family_a
      - family_b
      require_read_only: true
    failure_modes:
    - condition: Any RETHINK, missing or unpinned verdict (F504).
      on_error:
      - F504
      action: request_more_context
      recovery:
        goto_step: change_state_out
        inject_context:
          findings: ${finding_check_out.issues}
          note: The author lands one fix pass for both reviewers and pushes; a fresh pair or delta reviewer
            follows (never the same reviewer).
        max_loops: 3
        on_exhausted:
          goto_step: round_cap_out
  - capability: audit
    purpose: Record the round - reviewers, SHAs, verdict links, findings and their dispositions; on RETHINK
      add one line per finding to review_escapes.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: review_gate
        change: ${change.number}
        head_sha: ${change.head_sha}
        verdicts: '${verdict_class_out.labels: array<string>}'
        quorum: ${quorum_out.compliant}
        posted_read_back: ${readback_out.passed}
  - capability: invoke
    purpose: 'Escalation handler: run owner_decision and end the run as escalated.'
    risk: medium
    mutation: false
    store_as: round_cap_out
    handler: true
    workflow_id: owner_decision
    input_bindings:
      workflow: owner_decision
      input:
        question:
          topic: review_round_cap
  success:
  - Two BLESSED verdicts on the final head SHA, posted and read back
  - Reviewer B saw no review history
  - Author worktree unchanged by the review
  - At most three failed rounds; then a decider has the open blockers
  risk_propagation:
    strategy: max_step_risk
    computed_risk: high
merge_ship:
  goal: Bring one reviewed change onto its base only when every written gate holds on the final head SHA,
    by the merger the owner's policy names, and call it done only when post-merge CI is green.
  risk: high
  description: 'Two exits share one gate check. When the policy names the orchestrator as

    merger, it merges with --match-head-commit. When the policy names a human or

    another orchestrator (for example the maintainer of another repository), it

    sends one READY line with the evidence and does not merge. A merge cannot be

    undone by restoring a checkpoint, so the recovery for a red base is a fix thread

    and a BLOCKED notice, not `rollback`. (The ontology allows a rollback after a

    mutate; conflicts_with only keeps the two out of one parallel group.)

    A squash merge makes a new commit: post-merge CI is matched on that commit.

    '
  workflow_extensions:
    requires:
    - approval@1
    - recovery@1
    - triggers@1
    - wait@1
  triggers:
  - kind: invoke
    attendance: attended
  inputs:
    change:
      type: object
      properties:
        repo:
          type: string
        number:
          type: string
        head_sha:
          type: string
        base:
          type: string
        merger:
          type: string
          enum:
          - self
          - other
        merger_channel:
          type: string
        stacked_children:
          type: array
          items:
            type: string
    policy:
      type: object
      properties:
        merge_gates:
          type: array
          items:
            type: string
        critical_classes:
          type: array
          items:
            type: string
  steps:
  - capability: observe
    purpose: Read the change at the source - head SHA, draft, mergeable, unresolved threads, requested
      reviewers.
    risk: low
    mutation: false
    store_as: change_out
    input_bindings:
      target: ${change.number}
      aspects:
      - head_sha
      - is_draft
      - mergeable
      - review_threads
      - requested_reviewers
  - capability: retrieve
    purpose: Read the posted reviews and their commit_id (gate 1, gate 2).
    risk: low
    mutation: false
    store_as: reviews_out
    input_bindings:
      target: ${change.number}
      format: pr_reviews_with_commit_id
  - capability: retrieve
    purpose: Read every check run on the head SHA (gate 3, including non-required checks and the security
      workflow).
    risk: low
    mutation: false
    store_as: ci_out
    input_bindings:
      target: ${change.head_sha}
      format: check_runs
  - capability: retrieve
    purpose: Read holds and human objections - the full channel since the request, not only replies (gate
      0, gate 6).
    risk: low
    mutation: false
    store_as: holds_out
    input_bindings:
      target: ${change.merger_channel}
      format: channel_history_since_request
  - capability: classify
    purpose: Classify the change - critical (security, auth, sandbox, approvals, guardrails, IAM, release,
      data formats) or not; adds a user-visible limitation (gate 0) or not.
    risk: low
    mutation: false
    store_as: class_out
    input_bindings:
      item: ${change_out.observation}
      taxonomy: '${policy.critical_classes: array<string>}'
      multi_label: true
  - capability: plan
    purpose: Plan the merge - order of companion and stacked PRs, retarget children before delete-branch,
      the merge path (a, b or c), merger (self or other).
    risk: low
    mutation: false
    store_as: merge_plan_out
    input_bindings:
      goal: merge_one_change
      constraints:
        merger: ${change.merger}
        children: ${change.stacked_children}
        classes: '${class_out.labels: array<string>}'
  - capability: constrain
    purpose: Check gates 0-6 on the final head - limitation yes from the decider, second set of eyes,
      BLESSED on head, CI all green, clean, order, not held and not a release step.
    risk: low
    mutation: false
    store_as: gates_out
    input_bindings:
      target:
        reviews: '${reviews_out.data: object}'
        ci: '${ci_out.data: object}'
        holds: '${holds_out.data: object}'
        plan: ${merge_plan_out}
      constraints: '${policy.merge_gates: array<string>}'
      action_on_violation: block
  - capability: execute
    purpose: Gate 4 - git merge-tree --write-tree origin/base head, then build and vet the merged tree
      in a scratch worktree.
    risk: medium
    mutation: false
    requires_approval: true
    store_as: merged_tree_out
    timeout: PT15M
    input_bindings:
      code: merge_tree_build_check
      language: shell
      environment:
        base: ${change.base}
        head: ${change.head_sha}
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: mandates
      shows:
      - ${change.head_sha}
      - ${change.base}
      binds_to: digest
    gates:
    - when: ${gates_out.compliant} == false
      action: stop
      message: A merge gate fails on the final head. Do not build or merge.
  - capability: checkpoint
    purpose: Record base SHA, head SHA and the gate evidence before the irreversible step.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: merge_record
      label: pre_merge
  - capability: mutate
    purpose: Merge with gh pr merge --squash --match-head-commit (never --admin on path a) when the orchestrator
      is the merger. The host returns the merge commit in new_state.merge_sha; post-merge CI is matched
      on it, not on the head SHA.
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: merge_out
    condition: ${change.merger} == "self"
    skip_if_false: true
    input_bindings:
      target: ${change.number}
      operation:
        method: squash
        match_head_commit: ${change.head_sha}
      checkpoint_id: ${checkpoint_out.checkpoint_id}
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: merge_gates
      shows:
      - ${change.head_sha}
      binds_to: digest
      recheck:
        source: ${change_out}
        compare: digest
        on_change: reask
      when_unattended: skip
    gates:
    - when: ${checkpoint_out.checkpoint_id} == null
      action: stop
      message: No checkpoint. Do not merge.
    - when: '${merged_tree_out.exit_code: number} != 0'
      action: stop
      message: The merged tree does not build.
  - capability: send
    purpose: When another party merges, send one READY line with PR, head SHA and verdict links to the
      merger channel.
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: ready_out
    condition: ${change.merger} == "other"
    skip_if_false: true
    input_bindings:
      destination: ${change.merger_channel}
      payload:
        verb: READY
        change: ${change.number}
        head_sha: ${change.head_sha}
      protocol: chat_protocol_line
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: mandates
      shows:
      - ${change.merger_channel}
      - ${change.number}
      - ${change.head_sha}
      binds_to: digest
      recheck:
        source: ${change_out}
        compare: digest
        on_change: reask
      when_unattended: defer_to_queue
  - capability: verify
    purpose: Confirm the result at the source - state MERGED with a merge SHA, or the READY line visible
      in the channel.
    risk: low
    mutation: false
    store_as: merged_out
    input_bindings:
      target: ${change.number}
      conditions:
      - merged_with_merge_sha_or_ready_visible
  - capability: receive
    purpose: Wait until the runs on the merge commit finish (the 270 s poll rule is a host rule).
    risk: low
    mutation: false
    store_as: ci_wait_out
    condition: ${change.merger} == "self"
    skip_if_false: true
    timeout: 2h
    input_bindings:
      channel: github_events
    wait:
      event_type: ci.complete
      source_kind: api
      correlate:
        sha: '${merge_out.new_state.merge_sha: string}'
  - capability: observe
    purpose: Watch every workflow run on the merge commit on the base until none is pending (check at
      most every 270 s).
    risk: low
    mutation: false
    store_as: postci_out
    condition: ${change.merger} == "self"
    skip_if_false: true
    input_bindings:
      target: ${change.base}
      aspects:
      - runs_on_merge_commit
  - capability: verify
    purpose: Gate 8 - all post-merge runs green. A merge is done only then.
    risk: low
    mutation: false
    store_as: postci_verify_out
    condition: ${change.merger} == "self"
    skip_if_false: true
    input_bindings:
      target: ${postci_out.observation}
      conditions:
      - no_failed_run
      - no_pending_run
      strict: true
    failure_modes:
    - condition: A post-merge run fails or times out
      action: stop
      recovery:
        goto_step: ci_wait_out
        max_loops: 1
        on_exhausted:
          goto_step: base_red_out
      when: ${postci_verify_out.passed} == false
  - capability: synchronize
    purpose: Tell threads whose branches depend on this one that the base moved; archive the thread whose
      change merged.
    risk: medium
    mutation: false
    store_as: dependents_out
    input_bindings:
      agents: ${change.stacked_children}
      state:
        base_moved: ${change.base}
  - capability: persist
    purpose: Move the board row to done with the merge SHA and post-merge CI evidence.
    risk: low
    mutation: true
    store_as: board_out
    input_bindings:
      data: ${merged_out}
      key: board
  - capability: audit
    purpose: Write the merge record - gate evidence, path, "path (c) not critical because ...", merger.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: merge_ship
        change: ${change.number}
        head_sha: ${change.head_sha}
        gates_ok: ${gates_out.compliant}
        merged: ${merged_out.passed}
        post_merge_green: '${postci_verify_out.passed: nullable<boolean>}'
  - capability: invoke
    purpose: 'Escalation handler: run incident_triage and end the run as escalated.'
    risk: medium
    mutation: false
    store_as: base_red_out
    handler: true
    workflow_id: incident_triage
    input_bindings:
      workflow: incident_triage
      input:
        signal:
          kind: base_branch_red
  success:
  - Every gate holds on the final head SHA before the merge or READY line
  - The merger is the one the policy names
  - Post-merge CI green before "done"
  risk_propagation:
    strategy: max_step_risk
    computed_risk: high
outbound_message:
  goal: Send one message that the owner would send - right channel, right people, grounded text, signed
    - through the owner's approval path, then prove it arrived and log it.
  risk: high
  description: 'Order follows the ontology: constrain (policy) -> generate (draft) -> constrain

    (text check) -> checkpoint -> send -> verify (read back) -> audit. An unattended

    run never sends: approval defers the send to an ActionRecord with status planned, and

    the next brief or digest shows it at the top. Before a deferred send, the source

    is read again; if it changed, the message is planned again.

    '
  workflow_extensions:
    requires:
    - approval@1
    - triggers@1
  triggers:
  - kind: invoke
    attendance: attended
  inputs:
    request:
      type: object
      properties:
        intent:
          type: string
        channel:
          type: string
          enum:
          - teams
          - mail
          - chat
          - pr_comment
          - ticket_comment
          - wiki_comment
        place_of_ask:
          type: string
        recipients:
          type: array
          items:
            type: object
        source_refs:
          type: array
          items:
            type: string
    profile:
      type: object
      properties:
        outbound_rules:
          type: array
          items:
            type: string
        text_rules:
          type: array
          items:
            type: string
        style_key:
          type: string
  steps:
  - capability: retrieve
    purpose: Read the place of the ask and its recent history (the thread plus the last 2 h of the channel);
      never repeat or contradict what others already said.
    risk: low
    mutation: false
    store_as: context_out
    input_bindings:
      target: ${request.place_of_ask}
      format: thread_and_last_2h
  - capability: search
    purpose: Find earlier messages to the same people today, and any "stop" or "not mine" reply (one reminder
      per person per day; honour opt-outs).
    risk: low
    mutation: false
    store_as: prior_sends_out
    input_bindings:
      query: '${request.recipients: array<object>}'
      scope: sent_items_today+opt_out_replies
      limit: 20
  - capability: recall
    purpose: Load the owner's style and signature rules.
    risk: low
    mutation: false
    store_as: style_out
    input_bindings:
      key: ${profile.style_key}
  - capability: constrain
    purpose: Policy before drafting - channel in {channels}; recipients by ID and inside @example.com;
      not on the Never list; no chat writes for new users; reminder cap; opt-outs.
    risk: low
    mutation: false
    store_as: policy_out
    input_bindings:
      target: ${request}
      constraints: '${profile.outbound_rules: array<string>}'
      action_on_violation: block
  - capability: plan
    purpose: Plan the message - what, to whom, where, why now, and the approval path (card now, or the
      needs-approval queue when unattended).
    risk: low
    mutation: false
    store_as: plan_out
    input_bindings:
      goal: ${request.intent}
      constraints:
        policy_violations: '${policy_out.violations: array<object>}'
  - capability: generate
    purpose: Draft the text - signed "<assistant> (<agent>), on behalf of <owner>" where the channel needs
      it; at most 3 lines in a DM; links, not quotes, for confidential content.
    risk: low
    mutation: false
    store_as: draft_out
    input_bindings:
      specification:
        plan: '${plan_out.steps: array<object>}'
        context: '${context_out.data: object}'
        style: '${style_out.data: object}'
      format: ${request.channel}
    gates:
    - when: ${policy_out.compliant} == false
      action: stop
      message: The message breaks an outbound rule. Tell the owner why; do not draft.
  - capability: critique
    purpose: Review the draft for tone, one clear ask, and claims that need a source.
    risk: low
    mutation: false
    store_as: critique_out
    input_bindings:
      target: '${draft_out.content: object}'
      criteria:
      - one_clear_ask
      - tone_fits_recipient
      - claims_need_sources
  - capability: ground
    purpose: Ground every factual claim in the draft in a source the orchestrator read itself.
    risk: low
    mutation: false
    store_as: ground_out
    input_bindings:
      claim: '${draft_out.content: string}'
      sources: ${request.source_refs}
      required_strength: strong
  - capability: constrain
    purpose: Check the exact text - signature, line cap, and the outbound data check floor (national identity
      numbers, account numbers MOD11, card numbers Luhn, classification labels; <classification label>
      blocks).
    risk: low
    mutation: false
    store_as: text_check_out
    input_bindings:
      target: '${draft_out.content: object}'
      constraints: '${profile.text_rules: array<string>}'
      action_on_violation: block
  - capability: checkpoint
    purpose: Save the exact text, recipients and sources before the irreversible step, so a failed or
      deferred send can be retried or planned again.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: state.json
      label: outbound
  - capability: persist
    purpose: Write the ActionRecord (status planned; needs-approval when unattended) with text, recipients
      and source links.
    risk: low
    mutation: true
    store_as: action_record_out
    input_bindings:
      data:
        status: planned
        draft: '${draft_out.content: object}'
        checkpoint_id: ${checkpoint_out.checkpoint_id}
      key: state.json
  - capability: retrieve
    purpose: Read the source again just before sending.
    risk: low
    mutation: false
    store_as: recheck_out
    input_bindings:
      target: ${request.place_of_ask}
      format: thread_and_last_2h
  - capability: compare
    purpose: Compare the source now with the source at drafting time; if it moved (answered elsewhere,
      stop reply, new facts), plan again.
    risk: low
    mutation: false
    store_as: drift_out
    input_bindings:
      options:
      - '${context_out.data: object}'
      - '${recheck_out.data: object}'
      criteria:
      - already_answered
      - opt_out_received
      - facts_changed
  - capability: send
    purpose: Send the message through the owner's account and approval path.
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: send_out
    input_bindings:
      destination: ${request.place_of_ask}
      payload: '${draft_out.content: object}'
      protocol: ${request.channel}
    approval:
      approver:
        kind: human
        role: owner
      mode: in_session
      shows:
      - ${draft_out.content}
      - ${request.recipients}
      - ${request.channel}
      - ${request.source_refs}
      binds_to: digest
      recheck:
        source: ${recheck_out}
        compare: digest
        on_change: replan
      expires: 3d
      when_unattended: defer_to_queue
    gates:
    - when: ${text_check_out.compliant} == false
      action: stop
      message: The text fails the outbound check.
    - when: ${ground_out.grounded} == false
      action: stop
      message: A claim in the draft has no source the orchestrator read. Fix the draft.
    - when: '${critique_out.severity.blocking: number} != null && ${critique_out.severity.blocking: number}
        > 0'
      action: stop
      message: The critique found a blocking issue (no clear ask, wrong tone, unsourced claim). Fix the
        draft.
    - when: ${drift_out.recommendation} == "replan"
      action: stop
      message: The source changed since drafting. Plan the message again.
    failure_modes:
    - condition: Delivery failed (tool error, no message ID)
      action: pause_and_checkpoint
      recovery:
        goto_step: recheck_out
        max_loops: 1
      on_error:
      - R402
  - capability: verify
    purpose: Read back - the message exists at the destination with its ID (Sent Items, thread, PR comment),
      text and signature as approved.
    risk: low
    mutation: false
    store_as: readback_out
    condition: ${send_out.sent} == true
    skip_if_false: true
    input_bindings:
      target: ${send_out}
      conditions:
      - message_id_present
      - text_matches_approved
      - signature_present
      strict: true
  - capability: persist
    purpose: Update the ActionRecord to executed and add the log line. In an unattended run this step
      is deferred with the send; the executor's planned record holds the queued send.
    risk: low
    mutation: true
    store_as: log_out
    input_bindings:
      data:
        sent: '${send_out.sent: nullable<boolean>}'
        readback: '${readback_out.passed: nullable<boolean>}'
      key: state.json
  - capability: audit
    purpose: Record what was sent, where, when, the approval, and the read-back.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: outbound_message
        channel: ${request.channel}
        sent: '${send_out.sent: nullable<boolean>}'
        readback: '${readback_out.passed: nullable<boolean>}'
        action_record: ${action_record_out.key}
  success:
  - No message without policy check, grounded text and the owner's approval path
  - Unattended runs end with a planned ActionRecord and no message sent
  - Every sent message read back at its destination and logged
  risk_propagation:
    strategy: max_step_risk
    computed_risk: high
owner_decision:
  goal: Settle one open question - decide it when the owner's rules cover it, otherwise ask the owner
    one question with three researched options (recommended first), take only the owner's answer, and
    apply it.
  risk: medium
  description: 'A question to the owner is `inquire` then `receive`, not `send`: it goes to the

    owner''s own session as a ask_card card, so it is not a message in the owner''s

    name (ontology: inquire soft_requires receive). Questions outside

    escalate_to_owner are decided by the orchestrator and logged in unknowns.

    An interrupt outside the brief and digest needs the interrupt policy.

    '
  workflow_extensions:
    requires:
    - delegation@1
    - triggers@1
    - wait@1
  triggers:
  - kind: invoke
    attendance: attended
  inputs:
    question:
      type: object
      properties:
        topic:
          type: string
        context:
          type: object
        evidence:
          type: array
          items:
            type: string
        deadline:
          type: string
        blocking_ref:
          type: string
    profile:
      type: object
      properties:
        escalate_to_owner:
          type: array
          items:
            type: string
        question_rules:
          type: array
          items:
            type: string
        interrupt_rules:
          type: array
          items:
            type: string
  steps:
  - capability: classify
    purpose: Route the topic - owner only (product taste, compliance, access, prod release, go for a feature
      or initiative, personal or social), another decision person, or decide self.
    risk: low
    mutation: false
    store_as: route_out
    input_bindings:
      item: ${question}
      taxonomy:
      - owner_only
      - other_decision_person
      - decide_self
      multi_label: false
  - capability: search
    purpose: Explore first - the codebase, docs, board history and earlier decisions may answer it.
    risk: low
    mutation: false
    store_as: evidence_out
    input_bindings:
      query: ${question.topic}
      scope: code+docs+board_history+decision_log
      limit: 20
  - capability: retrieve
    purpose: Read what the other orchestrators and team already said on the topic (ask them first when
      the answer needs them).
    risk: low
    mutation: false
    store_as: peers_out
    input_bindings:
      target: ${question.topic}
      format: agent_channel_and_threads
  - capability: plan
    purpose: Build three researched options, each with its concrete consequence.
    risk: low
    mutation: false
    store_as: options_out
    input_bindings:
      goal: ${question.topic}
      constraints:
        evidence: '${evidence_out.results: array<object>}'
        peers: '${peers_out.data: object}'
        question: ${question}
  - capability: critique
    purpose: Check the question and its options - one decision, no hidden second question, facts complete,
      not answered already, each option researched with a real consequence.
    risk: low
    mutation: false
    store_as: question_check_out
    input_bindings:
      target: ${options_out}
      criteria:
      - one_decision
      - facts_complete
      - not_answered_already
      - options_researched
  - capability: compare
    purpose: Rank the options by consequence, cost, reversibility and user impact; the best one becomes
      the recommendation.
    risk: low
    mutation: false
    store_as: ranking_out
    input_bindings:
      options: '${options_out.steps: array<object>}'
      criteria:
      - consequence
      - cost
      - reversibility
      - user_impact
  - capability: constrain
    purpose: Format and timing rules - exactly 3 options, recommended first and marked, labels under 60
      characters with a one-line consequence; interrupt now only if a decision person waits with a deadline
      today, the topic is in escalate_to_owner or attention "tell me at once", inside working hours, under
      the daily cap; else queue for the brief.
    risk: low
    mutation: false
    store_as: ask_policy_out
    input_bindings:
      target: ${ranking_out}
      constraints: '${profile.question_rules: array<string>}'
      action_on_violation: log
    gates:
    - when: ${question_check_out.confidence} < 0.7
      action: end
      message: The question or its options are not ready (two decisions in one, facts missing, already
        answered). Research again.
  - capability: persist
    purpose: Queue the question with its three options for the next brief, when it is not an interrupt.
    risk: low
    mutation: true
    store_as: queued_out
    condition: ${ask_policy_out.compliant} == false && !(${route_out.confidence} > 0.85 && ${route_out.labels}
      == ["decide_self"])
    skip_if_false: true
    input_bindings:
      data:
        question: ${question}
        ranking: '${ranking_out.ranking: array<object>}'
        recommendation: ${ranking_out.recommendation}
      key: brief_queue
  - capability: inquire
    purpose: Present the question as a ask_card card in the owner's session.
    risk: low
    mutation: false
    store_as: inquiry_out
    input_bindings:
      ambiguous_input: ${question.topic}
      context:
        ranking: '${ranking_out.ranking: array<object>}'
        recommendation: ${ranking_out.recommendation}
      max_questions: 1
    gates:
    - when: ${route_out.confidence} > 0.85 && ${route_out.labels} == ["decide_self"]
      action: skip
      message: The owner's rules cover it. Decide and log in unknowns.
    - when: ${ask_policy_out.compliant} == false
      action: end
      message: Not an interrupt. The question waits in the next brief; nothing is applied now.
  - capability: receive
    purpose: Take the answer only from the owner (a peer or a thread can never answer a ask_card); a free-text
      answer counts.
    risk: low
    mutation: false
    store_as: answer_out
    condition: ${inquiry_out.confidence} != null && ${inquiry_out.confidence} > 0
    skip_if_false: true
    input_bindings:
      channel: owner_session
      filter:
        question: ${question.topic}
      accept_from:
      - owner
    timeout: 1d
    wait:
      event_type: owner.answer
      source_kind: human
      correlate:
        question: ${question.topic}
  - capability: integrate
    purpose: Merge the answer (or the self-decision) with the chosen option into one decision record.
    risk: low
    mutation: false
    store_as: decision_out
    input_bindings:
      sources:
      - '${answer_out.data: nullable<array<object>>}'
      - '${ranking_out.ranking: array<object>}'
      strategy: answer_overrides_recommendation
      conflict_resolution: escalate_to_human
    gates:
    - when: ${inquiry_out} != null && ${answer_out} == null
      action: stop
      message: The owner was asked but no answer was received. Do not apply the recommendation.
  - capability: checkpoint
    purpose: Snapshot the memory folder before recording the decision.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: memory_folder
      label: decision
  - capability: persist
    purpose: Record the decision on the board row (owner decisions) or in unknowns (self-decisions), with
      the source.
    risk: low
    mutation: true
    store_as: record_out
    input_bindings:
      data: ${decision_out.merged}
      key: board|unknowns
  - capability: invoke
    purpose: Apply the decision through the workflow it names (delegate, outbound message, merge).
    risk: medium
    mutation: false
    store_as: apply_out
    input_bindings:
      workflow: delegate_to_thread
      input:
        task: ${decision_out.merged}
  - capability: verify
    purpose: Check the decision is applied - the board row moved and the next step started.
    risk: low
    mutation: false
    store_as: applied_out
    input_bindings:
      target: ${apply_out.result}
      conditions:
      - row_moved
      - next_step_started
  - capability: audit
    purpose: Record question, options, recommendation, who decided, and the result.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: owner_decision
        topic: ${question.topic}
        recommendation: ${ranking_out.recommendation}
        applied: ${applied_out.passed}
  success:
  - The owner is asked only about escalate_to_owner topics, once, with 3 options
  - Only the owner's answer is accepted
  - The decision is recorded and applied
  risk_propagation:
    strategy: max_step_risk
    computed_risk: medium
checkin_recovery:
  goal: On a schedule, prove the state of every in-flight thread and board row, restart what failed, chase
    what waits, and hand the owner what has not moved in two working days.
  risk: high
  description: 'Liveness is evidence, not trust: running true, a growing entry count across two

    samples a minute apart, or a pending tool_use. Detect then classify then

    attribute (the ontology orders observe -> detect -> classify and

    detect -> attribute). Recovery reuses the other workflows through invoke, so a

    restarted thread gets the same brief rules and a reminder goes through the

    outbound gate. The next check-in is a schedule, which is a change to the

    owner''s assistant state, so it is a `mutate` behind a checkpoint.

    '
  workflow_extensions:
    requires:
    - approval@1
    - triggers@1
    - wait@1
  triggers:
  - kind: schedule
    schedule:
      cron: 15 9 * * MON-FRI
      timezone: UTC
      overlap: skip
    attendance: unattended
  - kind: schedule
    schedule:
      cron: 30 13 * * MON-FRI
      timezone: UTC
      overlap: skip
    attendance: unattended
  inputs:
    board:
      type: object
      ref: schemas/world_state_schema.yaml#/world_state
    profile:
      type: object
      properties:
        recovery_rules:
          type: array
          items:
            type: string
        working_hours:
          type: string
  steps:
  - capability: recall
    purpose: Load state.json (threads, lanes, planned ActionRecords) from the memory folder.
    risk: low
    mutation: false
    store_as: inflight_out
    input_bindings:
      key: state.json
  - capability: observe
    purpose: First liveness sample of every in-flight thread - running, status, entry count, last entry
      kind, updated_at.
    risk: low
    mutation: false
    store_as: sample_a_out
    input_bindings:
      target: in_flight_threads
      aspects:
      - running
      - status
      - entry_count
      - last_entry_kind
      - updated_at
  - capability: observe
    purpose: Second sample one minute after the first (delay); the delta is the evidence.
    risk: low
    mutation: false
    store_as: sample_b_out
    input_bindings:
      target: in_flight_threads
      aspects:
      - running
      - status
      - entry_count
      - last_entry_kind
      - updated_at
    delay: 1m
  - capability: detect
    purpose: Detect threads that are cancelled, failed, stalled on an approval, hung (no update for 30
      min), idle with unfinished work, or that never reported.
    risk: low
    mutation: false
    store_as: stalls_out
    input_bindings:
      data:
        before: ${sample_a_out.observation}
        after: ${sample_b_out.observation}
      pattern:
      - cancelled
      - failed
      - stalled_on_approval
      - hung_30m
      - idle_unfinished
      - no_report
  - capability: classify
    purpose: Classify each board row - moved, not moved for 2 working days, waits on the owner, waits
      on a person, waits on a thread, done awaiting the owner's yes.
    risk: low
    mutation: false
    store_as: rows_out
    input_bindings:
      item: ${board.entities}
      taxonomy:
      - moved
      - stale_2_working_days
      - waits_owner
      - waits_person
      - waits_thread
      - done_awaiting_yes
      multi_label: false
  - capability: attribute
    purpose: Find the cause of each failure (remote host capacity or rollout, disk full, model connection,
      approval card nobody sees) so the restart does not repeat it.
    risk: low
    mutation: false
    store_as: cause_out
    input_bindings:
      effect: '${stalls_out.matches: array<object>}'
      candidates:
      - remote_capacity
      - remote_rollout
      - disk_full
      - model_connection
      - hidden_approval
      - brief_defect
  - capability: plan
    purpose: One recovery per item - restart with the same brief (fresh thread), message the thread, replace
      a hung reviewer, remind a person (one per day, in the place of the ask), ask the owner, or wait.
    risk: low
    mutation: false
    store_as: recovery_plan_out
    input_bindings:
      goal: recover_and_move_every_row
      constraints:
        stalls: '${stalls_out.matches: array<object>}'
        rows: '${rows_out.labels: array<string>}'
        causes: '${cause_out.causes: array<object>}'
  - capability: constrain
    purpose: Recovery rules - restart only cancelled or failed work, never parked work; kill only own
      PIDs, never by pattern; hold back only on real machine pressure (swapouts grow over 30 s); no reminders
      outside working hours.
    risk: low
    mutation: false
    store_as: recovery_policy_out
    input_bindings:
      target: ${recovery_plan_out}
      constraints: '${profile.recovery_rules: array<string>}'
      action_on_violation: warn
  - capability: checkpoint
    purpose: Snapshot state.json and the board before changes.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: memory_folder
      label: sweep
  - capability: invoke
    purpose: Restart failed or cancelled threads through the delegate workflow (same brief rules, liveness
      proof).
    risk: medium
    mutation: false
    store_as: restarts_out
    condition: ${recovery_policy_out.compliant} == true
    skip_if_false: true
    input_bindings:
      workflow: delegate_to_thread
      input:
        task: ${recovery_plan_out}
  - capability: invoke
    purpose: Send due reminders through the outbound workflow (in an unattended run they become planned
      ActionRecords).
    risk: medium
    mutation: false
    store_as: reminders_out
    input_bindings:
      workflow: outbound_message
      input:
        request: ${recovery_plan_out}
  - capability: invoke
    purpose: 'Hand rows that have not moved for 2 working days, or that wait on the owner, to the owner
      decision workflow. Runs after a deferred reminder (after_deferral: run): The owner is asked whether
      or not a reminder went out.'
    risk: medium
    mutation: false
    store_as: escalations_out
    input_bindings:
      workflow: owner_decision
      input:
        question:
          topic: checkin_stalled_rows
          context: ${rows_out}
    after_deferral: run
  - capability: mutate
    purpose: 'Schedule the next check-in for work still running (schedule), instead of waiting passively.
      Runs after a deferred reminder (after_deferral: run): The next check-in is due whether or not a
      reminder went out.'
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: next_checkin_out
    input_bindings:
      target: assistant_schedules
      operation:
        kind: schedule
        plan: '${recovery_plan_out.steps: array<object>}'
      checkpoint_id: ${checkpoint_out.checkpoint_id}
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: mandates
      binds_to: digest
      when_unattended: skip
    after_deferral: run
  - capability: verify
    purpose: 'Prove each restarted thread is alive (same liveness evidence) and each row moved one step
      or has a recorded reason. Runs after a deferred reminder (after_deferral: run): It checks the restarts
      and the rows, not the queued reminders.'
    risk: low
    mutation: false
    store_as: verify_out
    input_bindings:
      target: '${restarts_out.result: nullable<object>}'
      conditions:
      - restarted_threads_live
      - every_row_moved_or_reason
    after_deferral: run
  - capability: persist
    purpose: Write last moved, causes and the log line to the board and state.json.
    risk: low
    mutation: true
    store_as: board_out
    input_bindings:
      data: ${verify_out}
      key: board
  - capability: audit
    purpose: 'Record the sweep - samples, detected stalls, causes, recoveries, escalations. Runs after
      a deferred reminder (after_deferral: run): The sweep is recorded; the terminal action lists the
      queued reminders.'
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: checkin_recovery
        stalls: '${stalls_out.matches: array<object>}'
        recovered: ${verify_out.passed}
    after_deferral: run
  success:
  - Every thread state is backed by two samples
  - Failed and cancelled work restarted with its cause addressed
  - Every row moved one step, or went to the owner after 2 working days
  risk_propagation:
    strategy: max_step_risk
    computed_risk: high
incident_triage:
  goal: When a shared environment breaks (CI on the base branch, remote host, a staging deploy, the shared
    workstation), find out what is true, contain it on own resources only, get the cause fixed by the
    right owner, and tell the people who depend on it.
  risk: high
  description: 'The orchestrator owns its own threads, caches and processes. It does not own

    other people''s environments: there it reports with evidence and waits for the

    owner of the area. Containment on own resources is a `mutate`; recovery from a

    bad containment step is the failure action `rollback` to the checkpoint, which

    ties the rollback to the step that failed. (The ontology allows a rollback after

    a mutate; conflicts_with only keeps the two out of one parallel group.)

    In prod the notice goes out first, then the run ends as completed: report and ask.

    '
  workflow_extensions:
    requires:
    - approval@1
    - recovery@1
    - triggers@1
  triggers:
  - kind: event
    event:
      event_type: incident.signal
      source_kind: api
      delivers_to: signal
    attendance: attended
  - kind: event
    event:
      event_type: incident.signal
      source_kind: agent
      delivers_to: signal
    attendance: attended
  - kind: event
    event:
      event_type: incident.signal
      source_kind: human
      delivers_to: signal
    attendance: attended
  - kind: invoke
    attendance: attended
  inputs:
    signal:
      type: object
      ref: schemas/event_schema.yaml#/event
    environment:
      type: object
      properties:
        name:
          type: string
        area_owner:
          type: string
        own_resource:
          type: boolean
        is_prod:
          type: boolean
        notify_channel:
          type: string
    profile:
      type: object
      properties:
        incident_rules:
          type: array
          items:
            type: string
  steps:
  - capability: receive
    purpose: Take the signal with its anchors (failed run, thread error, alert, human report).
    risk: low
    mutation: false
    store_as: signal_out
    input_bindings:
      channel: ${signal.source.name}
      filter:
        event_id: ${signal.event_id}
  - capability: observe
    purpose: Look at the real environment now (disk free, runs on the base branch, host state, remote
      host task failures) - never claim prod state without checking.
    risk: low
    mutation: false
    store_as: env_out
    input_bindings:
      target: ${environment.name}
      aspects:
      - health
      - recent_failures
      - capacity
      - deploy_state
  - capability: detect
    purpose: Detect the anomaly and its blast radius (which threads, PRs, users).
    risk: low
    mutation: false
    store_as: anomaly_out
    input_bindings:
      data: ${env_out.observation}
      pattern: shared_environment_failure
  - capability: classify
    purpose: Classify severity and ownership - own resource, another owner's area (for example the remote
      host runtime), prod or not.
    risk: low
    mutation: false
    store_as: class_out
    input_bindings:
      item: ${anomaly_out}
      taxonomy:
      - own_resource
      - other_owner_area
      - prod
      - non_prod
      - sev_blocking
      - sev_degraded
      multi_label: true
  - capability: search
    purpose: Check what is already known - recent posts by the area owner, open issues, threads on it
      - so nothing is repeated or contradicted.
    risk: low
    mutation: false
    store_as: known_out
    input_bindings:
      query: ${environment.name}
      scope: channel_last_2h+open_issues+threads
      limit: 20
  - capability: attribute
    purpose: Find the cause (for example a full disk from a build cache, a host on an old release, a missing
      credential).
    risk: low
    mutation: false
    store_as: cause_out
    input_bindings:
      effect: ${anomaly_out}
      candidates: '${known_out.results: array<object>}'
  - capability: ground
    purpose: Ground the cause in evidence the orchestrator read itself; mark the rest as not verified.
    risk: low
    mutation: false
    store_as: ground_out
    input_bindings:
      claim: ${cause_out.mechanism}
      sources:
      - '${env_out.evidence_anchors: array<object>}'
      - '${known_out.evidence_anchors: array<object>}'
      required_strength: strong
  - capability: plan
    purpose: Plan containment, cause fix and notices - cause first, guard second; hold merges into a red
      base; ask threads to rerun failures after the fix.
    risk: low
    mutation: false
    store_as: plan_out
    input_bindings:
      goal: restore_shared_environment
      constraints:
        ownership: '${class_out.labels: array<string>}'
        cause: ${cause_out.mechanism}
  - capability: constrain
    purpose: Incident rules - act only on own resources; kill only own PIDs; no prod change and no security
      weakening without the owner's go; another owner's area gets a report, not a fix.
    risk: low
    mutation: false
    store_as: policy_out
    input_bindings:
      target: ${plan_out}
      constraints: '${profile.incident_rules: array<string>}'
      action_on_violation: block
  - capability: invoke
    purpose: Post the BLOCKED notice or the evidence to the area owner through the outbound workflow.
    risk: medium
    mutation: false
    store_as: notice_out
    input_bindings:
      workflow: outbound_message
      input:
        request:
          intent: incident_notice
          place_of_ask: ${environment.notify_channel}
  - capability: checkpoint
    purpose: Record the environment state before containment.
    risk: low
    mutation: true
    store_as: checkpoint_out
    input_bindings:
      scope: ${environment.name}
      label: pre_containment
    gates:
    - when: ${environment.is_prod} == true
      action: end
      message: Prod - report and ask; do not act. The notice has gone to the area owner.
  - capability: mutate
    purpose: Contain on own resources only (free own caches, stop own processes by PID, hold own merges).
    risk: high
    mutation: true
    requires_checkpoint: true
    requires_approval: true
    store_as: contain_out
    condition: ${environment.own_resource} == true
    skip_if_false: true
    input_bindings:
      target: ${environment.name}
      operation:
        plan: '${plan_out.steps: array<object>}'
      checkpoint_id: ${checkpoint_out.checkpoint_id}
    approval:
      approver:
        kind: standing_mandate
        mandate_ref: mandates
      shows:
      - ${plan_out.steps}
      - ${environment.name}
      binds_to: digest
      when_unattended: skip
    gates:
    - when: ${policy_out.compliant} == false
      action: stop
      message: Not an own resource, or the step needs the owner's go.
    failure_modes:
    - condition: Containment made it worse
      action: rollback
      recovery:
        goto_step: plan_out
        max_loops: 1
      on_error:
      - R402
  - capability: invoke
    purpose: Start a fix thread for the cause when it is in our code or our resources.
    risk: medium
    mutation: false
    store_as: fix_out
    input_bindings:
      workflow: delegate_to_thread
      input:
        task: ${plan_out}
  - capability: synchronize
    purpose: Tell affected threads what happened and what to do (rerun after the fix, end the turn before
      a rollout window).
    risk: medium
    mutation: false
    store_as: threads_out
    input_bindings:
      agents: '${anomaly_out.matches: array<string>}'
      state:
        incident: ${environment.name}
        action: '${plan_out.steps: array<object>}'
  - capability: verify
    purpose: Check the environment is healthy again at the source (green run, free disk, task starts).
    risk: low
    mutation: false
    store_as: verify_out
    input_bindings:
      target: ${environment.name}
      conditions:
      - environment_healthy
      - no_new_failures
      strict: true
    failure_modes:
    - condition: Still broken after the fix
      action: pause_and_checkpoint
      recovery:
        goto_step: env_out
        max_loops: 2
        on_exhausted:
          goto_step: unresolved_out
      when: ${verify_out.passed} == false
  - capability: persist
    purpose: Record the incident on the board and in state.json (HOLD lifted or kept).
    risk: low
    mutation: true
    store_as: board_out
    input_bindings:
      data: ${verify_out}
      key: board
  - capability: audit
    purpose: Record signal, evidence, cause, actions, notices and the result.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: incident_triage
        environment: ${environment.name}
        cause_grounded: ${ground_out.grounded}
        healthy: ${verify_out.passed}
  - capability: invoke
    purpose: 'Escalation handler: run owner_decision and end the run as escalated.'
    risk: medium
    mutation: false
    store_as: unresolved_out
    handler: true
    workflow_id: owner_decision
    input_bindings:
      workflow: owner_decision
      input:
        question:
          topic: incident_unresolved
  success:
  - The cause is grounded or marked not verified
  - Only own resources were changed
  - The area owner and affected threads were told
  - Healthy state proven at the source
  risk_propagation:
    strategy: max_step_risk
    computed_risk: high
daily_digest:
  goal: Give the owner a short, true picture - what moved, what waits on them (approvals first), what
    is at risk - where every line names its source or says not verified.
  risk: low
  description: 'One workflow, two kinds: the 16:30 digest and the brief at the end of the

    morning sweep. The result goes only to the owner''s own assistant session, so it is

    the workflow''s output, not a `send`. System-of-record state wins over memory

    (integrate with prefer_authoritative_sources). Unattended: it never sends

    anything outward; planned ActionRecords are listed for approval.

    '
  workflow_extensions:
    requires:
    - triggers@1
  triggers:
  - kind: schedule
    schedule:
      cron: 30 16 * * MON-FRI
      timezone: UTC
      overlap: skip
    attendance: unattended
  inputs:
    board:
      type: object
      ref: schemas/world_state_schema.yaml#/world_state
    report:
      type: object
      properties:
        kind:
          type: string
          enum:
          - digest
          - brief
        since:
          type: string
        max_lines:
          type: number
    profile:
      type: object
      properties:
        format_rules:
          type: array
          items:
            type: string
        calendar_ref:
          type: string
  steps:
  - capability: recall
    purpose: Load the board, state.json and new lines in unknowns since the last report.
    risk: low
    mutation: false
    store_as: memory_out
    input_bindings:
      key: board+state.json+unknowns
  - capability: retrieve
    purpose: Read the systems of record for the period - merged PRs, closed issues, sent items, posted
      verdicts.
    risk: low
    mutation: false
    store_as: records_out
    input_bindings:
      target: ${report.since}
      format: merged_prs+closed_issues+sent_items+reviews
  - capability: retrieve
    purpose: Brief only - today's meetings that need preparation or have a conflict.
    risk: low
    mutation: false
    store_as: calendar_out
    condition: ${report.kind} == "brief"
    skip_if_false: true
    input_bindings:
      target: ${profile.calendar_ref}
      format: today_events
  - capability: search
    purpose: List planned ActionRecords (approvals that wait) and rows waiting for the owner's "yes".
    risk: low
    mutation: false
    store_as: approvals_out
    input_bindings:
      query:
        status: planned
      scope: state.json+board
  - capability: integrate
    purpose: Merge memory with the systems of record; the system of record wins, conflicts are listed.
    risk: low
    mutation: false
    store_as: merged_out
    input_bindings:
      sources:
      - '${memory_out.data: object}'
      - '${records_out.data: object}'
      - '${approvals_out.results: array<object>}'
      strategy: by_board_row
      conflict_resolution: prefer_authoritative_sources
  - capability: classify
    purpose: Sort items into approvals waiting, needs you today, moved, done awaiting yes, risks, stale.
    risk: low
    mutation: false
    store_as: items_out
    input_bindings:
      item: ${merged_out.merged}
      taxonomy:
      - approval_waiting
      - needs_owner
      - moved
      - done_awaiting_yes
      - risk
      - stale
      multi_label: false
  - capability: measure
    purpose: Count interrupts today and rows waiting on the owner; recompute each count with a second
      method.
    risk: low
    mutation: false
    store_as: counts_out
    input_bindings:
      target: ${items_out}
      metric: interrupts_today
  - capability: constrain
    purpose: Format rules before writing - at most max_lines; approvals first; links, not quotes, for
      <classification label>; work items, not people (no per-person metrics).
    risk: low
    mutation: false
    store_as: format_policy_out
    input_bindings:
      target: ${report}
      constraints: '${profile.format_rules: array<string>}'
  - capability: generate
    purpose: Write the digest or brief (done / needs you / risks), each line with its source.
    risk: low
    mutation: false
    store_as: text_out
    gates:
    - when: ${format_policy_out.compliant} == false
      action: stop
      message: The report request breaks a format rule (line cap, classification). Fix the request.
    input_bindings:
      specification:
        items: '${items_out.labels: array<string>}'
        provenance: '${merged_out.provenance: object}'
        counts: '${counts_out.value: number}'
        calendar: '${calendar_out.data: nullable<object>}'
      format: ${report.kind}
  - capability: ground
    purpose: Check the written text line by line against the sources; a line without a source must say
      "not verified".
    risk: low
    mutation: false
    store_as: ground_out
    input_bindings:
      claim: '${text_out.content: string}'
      sources:
      - '${merged_out.provenance: object}'
      - '${records_out.evidence_anchors: array<object>}'
      required_strength: strong
  - capability: constrain
    purpose: Check the written text against the format rules and that no line lacks a source or a "not
      verified" mark.
    risk: low
    mutation: false
    store_as: text_check_out
    input_bindings:
      target: '${text_out.content: object}'
      constraints: '${profile.format_rules: array<string>}'
      action_on_violation: block
  - capability: verify
    purpose: Spot-check claims against the source (the checker sample uses the same check).
    risk: low
    mutation: false
    store_as: verify_out
    input_bindings:
      target: '${text_out.content: object}'
      conditions:
      - every_line_sourced_or_marked
      - counts_recomputed
      - approvals_first
      strict: true
    gates:
    - when: ${text_check_out.compliant} == false
      action: stop
      message: The text breaks a format rule. Rewrite before delivery.
    - when: ${ground_out.grounded} == false
      action: stop
      message: A line has no source and no "not verified" mark. Rewrite before delivery.
  - capability: persist
    purpose: Save the delivered text and the time of the last report.
    risk: low
    mutation: true
    store_as: saved_out
    input_bindings:
      data: '${text_out.content: object}'
      key: reports/last
  - capability: audit
    purpose: Record the report, its sources and the counts.
    risk: low
    mutation: true
    store_as: audit_out
    input_bindings:
      event:
        type: daily_digest
        kind: ${report.kind}
        verified: ${verify_out.passed}
  success:
  - Approvals that wait come first
  - Every line has a source or says not verified
  - Within the line limit, with recomputed counts
  risk_propagation:
    strategy: max_step_risk
    computed_risk: low
