# Standard version: 1.1.0
# Recovery targets must resolve (STANDARD v1.1 §5.12): an unknown step and a
# step after the failing one are V107.
bad_targets:
  goal: Loop to places that do not exist or come later.
  risk: low
  steps:
  - capability: verify
    purpose: Verify.
    store_as: verify_out
    input_bindings: {target: x, conditions: [c]}
    failure_modes:
    - condition: Failed.
      when: ${verify_out.passed} == false
      action: rollback
      recovery: {goto_step: no_such_step}
    - condition: Failed again.
      when: ${verify_out.passed} == false
      action: rollback
      recovery: {goto_step: plan_out}
  - capability: plan
    purpose: Plan.
    store_as: plan_out
