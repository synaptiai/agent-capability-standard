# Standard version: 1.1.0
# 'conflicts_with' forbids concurrency only: a rollback after a mutate in
# sequence is the normal recovery pattern.
mutate_then_rollback:
  goal: Apply a change, then restore the checkpoint.
  risk: high
  steps:
  - capability: plan
    purpose: Plan the change.
    store_as: plan_out
    input_bindings:
      goal: "resolve the request"
  - capability: constrain
    purpose: Check the change against policy.
    store_as: policy_out
    input_bindings:
      target: ${plan_out}
      constraints:
      - change_policy
  - capability: checkpoint
    purpose: Save a restore point.
    store_as: checkpoint_out
    input_bindings:
      scope: "workspace"
  - capability: mutate
    purpose: Apply the change.
    store_as: mutate_out
    input_bindings:
      target: "system"
      operation: {"set": true}
  - capability: rollback
    purpose: Restore the checkpoint.
    store_as: rollback_out
    input_bindings:
      checkpoint_id: "${checkpoint_out.checkpoint_id}"
