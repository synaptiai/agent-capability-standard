# Output schema for the delegate capability
# Source: schemas/capability_ontology.yaml
# Generated by: tools/sync_skill_schemas.py
# DO NOT EDIT — regenerate with: python tools/sync_skill_schemas.py
# Written in the ACS schema dialect (STANDARD v1.2 §4.1.2); its Draft 2020-12
# rendering is schemas/generated/capability_contracts.schema.json#/$defs/delegate.output.
---
capability: delegate
layer: COORDINATE
description: Assign task to another agent
output_schema:
  type: object
  required:
  - accepted
  - evidence_anchors
  properties:
    accepted:
      type: boolean
    task_id:
      type: string
      description: Delegated task ID
    agent:
      type: string
      description: Assigned agent
    effective:
      type: object
      description: The delegation settings actually used, as attested by the host
      properties:
        fresh_context:
          type: boolean
        model_family:
          type: string
          description: The family of the model the delegate ran on, as the host attests
            it, derived from the model's identifier (STANDARD v1.2 §5.15)
        model_id:
          type: string
          description: The provider's identifier of the model the delegate ran on,
            such as acme-large-2, as the host attests it (STANDARD v1.2 §5.15, §5.17)
        role:
          type: string
        read_only:
          type: boolean
        checkpointed:
          type: boolean
          description: The host attests that, before each change it makes, the delegate
            has a checkpoint valid in the scope where that change is checked (Standard
            v1.2 §5.15.4)
        identity:
          type: object
          description: The agent_identity of the party that took the delegation (identity@1);
            a waiting delegate keeps only its results
    result:
      type: object
      description: The delegate's result, when the step waits for it (wait@1, STANDARD
        v1.1 §5.13), with its sender (and, with identity@1, its sender_identity)
    evidence_anchors:
      type: array
      description: What the output is based on, as evidence anchors (Standard v1.2
        §6.5). An empty list grounds nothing, and the output is then marked inferred
        (§3.1).
      items:
        anyOf:
        - type: object
          description: An evidence anchor (Standard v1.2 §6.5), the item of a capability
            output's evidence_anchors, of an event's anchors and of world-state records'
            anchors. world_state_schema.yaml repeats this type. Other members may
            appear; a producer's own should start with x-.
          required:
          - ref
          - kind
          properties:
            ref:
              type: string
              description: Where the evidence is. A URI or <scheme>:<rest> with a
                scheme its producer documents (file:src/app.py#L10-L20, tool:Read:toolu_01).
                The scheme acs is reserved for workflow values (acs:search_out.results[0]).
            kind:
              type: string
              pattern: ^(file|url|tool|log|sensor|human_note|api|record|x-[a-z0-9][a-z0-9_.-]*)$
              description: file, url, tool (a tool call's result), log, sensor, human_note
                (written by a person), api (a service's API response), record (a record
                the agent system wrote or holds - an action or audit record, a checkpoint,
                a memory item, a workflow value), or a vendor kind starting with x-
            timestamp:
              type: string
              nullable: true
              description: ISO-8601 time at which the producer read or observed the
                evidence
            excerpt:
              type: string
              nullable: true
              description: A short quotation of the evidence as the producer read
                it; never a secret (Standard v1.2 §6.7)
            digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
              description: SHA-256 of the evidence's content as the producer read
                it - the bytes ref names or, for a JSON value, its RFC 8785 canonical
                JSON in UTF-8
        - type: string
          description: Deprecated legacy form (Standard v1.2 §6.5) - an anchor given
            by its ref alone, with no kind; accepted, never counted toward grounding,
            removed in 2.0
        - type: object
          description: Deprecated legacy form (Standard v1.2 §6.5) - an object that
            is not an evidence anchor (no kind, or a kind outside the vocabulary);
            accepted, never counted toward grounding, removed in 2.0
    confidence:
      type: number
      minimum: 0
      maximum: 1
      description: The producer's probability that the output's claim is correct,
        self-reported; given when the output is inferred (Standard v1.2 §3.1, §4.1.1)
    inference_method:
      type: string
      description: How the output was reached when it is not grounded in evidence;
        with confidence it marks the output inferred (Standard v1.2 §3.1, §4.1.1).
        A producer should use model_knowledge, deduction, induction, abduction, analogy,
        statistical, simulation, assumption or an x- vendor value; a grounding policy
        (§5.20) requires one of them.
    uncertainty:
      type: object
      required:
      - type
      - confidence
      properties:
        type:
          type: string
          enum:
          - epistemic
          - aleatoric
          - mixed
        confidence:
          type: number
          minimum: 0
          maximum: 1
        interval:
          type: object
          properties:
            low:
              type: number
            high:
              type: number
          nullable: true
        distribution:
          type: object
          nullable: true
          description: 'e.g. {name: normal, mean: x, stdev: y}'
        notes:
          type: string
          nullable: true
      description: The uncertainty of the output's principal value; its confidence
        equals the output's confidence (Standard v1.2 §4.1.1)
