schema:
  name: canonical_event
  version: 1.2.0
  generated_at: '2026-01-24T02:37:11.950296Z'
  description: Canonical event schema used by transform/integrate steps. Supports
    raw ingestion, normalization, and linkage to world_state.observations.
  principles:
  - Events are immutable and append-only.
  - Events carry evidence anchors and uncertainty.
  - Events can reference entities, state variables, and transitions.
  - Normalization preserves original payload (raw) + canonical form.
types:
  Anchor:
    type: object
    description: An evidence anchor (Standard v1.2 §6.5), the item of a capability
      output's evidence_anchors, of an event's anchors and of world-state records'
      anchors. world_state_schema.yaml repeats this type. Other members may appear;
      a producer's own should start with x-.
    required:
    - ref
    - kind
    properties:
      ref:
        type: string
        description: Where the evidence is. A URI or <scheme>:<rest> with a scheme
          its producer documents (file:src/app.py#L10-L20, tool:Read:toolu_01). The
          scheme acs is reserved for workflow values (acs:search_out.results[0]).
      kind:
        type: string
        pattern: ^(file|url|tool|log|sensor|human_note|api|record|x-[a-z0-9][a-z0-9_.-]*)$
        description: file, url, tool (a tool call's result), log, sensor, human_note
          (written by a person), api (a service's API response), record (a record
          the agent system wrote or holds - an action or audit record, a checkpoint,
          a memory item, a workflow value), or a vendor kind starting with x-
      timestamp:
        type: string
        nullable: true
        description: ISO-8601 time at which the producer read or observed the evidence
      excerpt:
        type: string
        nullable: true
        description: A short quotation of the evidence as the producer read it; never
          a secret (Standard v1.2 §6.7)
      digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
        description: SHA-256 of the evidence's content as the producer read it - the
          bytes ref names or, for a JSON value, its RFC 8785 canonical JSON in UTF-8
  Uncertainty:
    type: object
    required:
    - type
    - confidence
    properties:
      type:
        type: string
        enum:
        - epistemic
        - aleatoric
        - mixed
      confidence:
        type: number
        minimum: 0
        maximum: 1
      interval:
        type: object
        properties:
          low:
            type: number
          high:
            type: number
        nullable: true
      distribution:
        type: object
        nullable: true
        description: 'e.g. {name: normal, mean: x, stdev: y}'
      notes:
        type: string
        nullable: true
  EntityRef:
    type: object
    required:
    - entity_id
    properties:
      entity_id:
        type: string
      entity_type:
        type: string
        nullable: true
      alias:
        type: string
        nullable: true
event:
  type: object
  required:
  - event_id
  - timestamp
  - source
  - event_type
  - raw
  - canonical
  - anchors
  # STANDARD §6.2 lists provenance as MUST; it was declared but optional here
  # until issue #107.
  - provenance
  properties:
    event_id:
      type: string
    timestamp:
      type: string
      description: ISO-8601
    source:
      type: object
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          enum:
          - log
          - api
          - sensor
          - message_bus
          - human
          - agent
        name:
          type: string
        channel:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
    event_type:
      type: string
      description: normalized type
    severity:
      type: string
      enum:
      - debug
      - info
      - warn
      - error
      - critical
      nullable: true
    tags:
      type: array
      items:
        type: string
      nullable: true
    entity_refs:
      type: array
      items:
        $ref: '#/types/EntityRef'
      nullable: true
    metric:
      type: object
      nullable: true
      properties:
        name:
          type: string
        value:
          type: number
        unit:
          type: string
          nullable: true
        window:
          type: string
          nullable: true
    raw:
      type: object
      description: original payload, unchanged except that each secret is replaced
        by "[REDACTED]" (Standard v1.2 §6.7)
    canonical:
      type: object
      description: normalized fields for integration
    anchors:
      type: array
      items:
        $ref: '#/types/Anchor'
    uncertainty:
      $ref: '#/types/Uncertainty'
      nullable: true
    provenance:
      type: object
      nullable: true
      properties:
        transformer:
          type: string
        transform_version:
          type: string
        ruleset_id:
          type: string
          nullable: true
    redactions:
      type: array
      items:
        type: string
      nullable: true
      description: JSON pointers (RFC 6901), from the event, of the members in which
        a secret was replaced by "[REDACTED]" (Standard v1.2 §6.2, §6.7)
to_observation_event:
  description: Mapping constraints for converting canonical_event → world_state.observations[]
  required_fields:
  - event_id
  - timestamp
  - source
  - raw
  - anchors
  observation_payload_rule: world_state.observations.payload must embed canonical_event.canonical
