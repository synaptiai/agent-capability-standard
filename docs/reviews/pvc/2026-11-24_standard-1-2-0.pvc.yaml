target: "PR #132: Agent Capability Standard 1.2.0 (Candidate) and ontology 2.2.0, with the reference implementation and the safety-layer hardening"
context:
  domain: general
  deployment: customer-facing  # a public standard and a plugin others install
  risk_tier: high  # the change alters the layers that gate tool calls
stakeholders:
  - operator/on-call
  - end user
  - security
  - compliance/legal
  - product/engineering owners
assumptions:
  - "The report scores the artifacts at 5c28dcd (branch claude/gallant-hypatia-wbucn3, against origin/main 6b3e40b) in the areas the change touches, not the project's earlier history."
  - "Standard 1.2.0 is a Candidate Standard; these findings are inputs to its review, not defects in a final standard."
  - "The adversarial security review stopped at its five-round cap with medium-severity findings still appearing (tasks/todo.md); the hooks' and the Bash classifier's reading of shell text are treated as carrying residual risk."
  - "Each check was scored, then verified independently against the cited lines. All 15 checks were verified; verification lowered one score (CTRL-501, PASS to PARTIAL)."
  - "The review ran no full Python suite of its own (its environment's built extension was older than core/ at 5c28dcd); it cites single tests it ran, the Rust runtime fixtures replayed with cargo, and CI, which runs the whole suite on the pull request."
  - "Templates under docs/compliance/ are adopter templates: they count as guidance, not as an operational process for this project's own artifacts."
