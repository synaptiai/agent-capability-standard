      example with the shipped policy, and add call fixtures under tests/conformance/calls plus a hook test (a
      Write to ~/.ssh/authorized_keys gives F504 in default and bypassPermissions modes).
    artifact: policy
    owner: "maintainers"
  - id: "SEC-401-B"
    priority: P1
    fix: >-
      Do the design task the security loop left open (tasks/todo.md, 'Not converged'). Shrink the read-only Bash
      classification in grounded_agency/capabilities/mapper.py and the plugin hook to a small, fully specified
      grammar: one simple command, literal ASCII words, listed programs with listed options, and no expansions,
      redirections or PATH-relative programs. Give everything else the worst case. Add a differential test
      against the current classifier, then run further adversarial rounds until two in a row confirm no medium
      defect.
    artifact: hook
    owner: "security reviewers"
  - id: "SEC-402-A"
    priority: P1
    fix: >-
      Add a normative rule to the Standard (section 3 or 5.18) and to SECURITY.md that data is never
      instructions: tool results, retrieved, received or recalled content, capability outputs and repository
