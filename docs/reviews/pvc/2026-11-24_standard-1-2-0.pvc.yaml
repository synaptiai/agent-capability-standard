scorecard:
  HF-101: PARTIAL  # Recovery texts and restorable checkpoints are tested, but no joined incident view, no tabletop recipe, a generic section 6, and the plugin log has no checkpoint link.
  HF-102: PARTIAL  # Section 8.4 overrides are policy-bound and tested and a repo cannot loosen the layer (R407), but overrides need no permission and strict_mode=False is ungated.
  HF-103: PARTIAL  # explain must carry anchors and F505 checks citations (fixtures pass), but grounding is opt-in, unused for explain, per output only; the faithfulness benchmark is self-labelled.
  ORG-201: PARTIAL  # Versioning is met (section 11.6 MAJOR rule, profile version, recorded_by), but no owner, reviewer or rollback procedure is named for profiles, weights or hook defaults.
  GOV-202: PARTIAL  # The section 6.4 schema is validated for every writer, but the plugin log is thin (no capability, no refusals) and review is 'monitor for anomalies' with no owner or rule.
  ECON-301: PARTIAL  # Fail-closed time ceilings are set and tested (30 s hook, 5 s git), but no p50/p95 budget for the normal path and no retention or capture policy by risk level.
  ECON-302: PARTIAL  # Benchmarks map five failure classes with before/after metrics in CI, but classes are assumed, recovery is simulated, and no scenario covers the 1.2 safety-layer controls.
  SEC-401: PARTIAL  # Deny-by-default holds (unbound tools are the worst case, F502 when no one can be asked), but no allowed-capability set or path policy, and the Bash classifier did not converge.
  SEC-402: PARTIAL  # Person-only approval, destination policies and the always-ask mark are enforced and tested, but nothing separates data from instructions and grounding runs after the act.
  CTRL-501: PARTIAL  # Verification lowered the scorer's PASS: retries and loops are capped and tested, but goto_step loops have no cooldown, backoff is opt-in, and there is no run budget.
  ASSUR-601: PARTIAL  # Core claims have enforcement points, SL fixtures and audit fields, but nothing links claim to argument to evidence; plugin refusals leave no record; section 1.4 is unenforced.
  ASSUR-602: PARTIAL  # Call-time monitors fail closed and the log hook detects a cut log (tested), but nothing consumes refusal or record signals; anomaly detection is planned, not shipped.
  DG-701: PARTIAL  # Redaction is normative and tested on shared vectors and SDK stores are owner-only, but no retention by risk or sensitivity, and the plugin's audit log is created 0644.
  ETH-801: PARTIAL  # The override path is defined and tested, but no rationale or stakeholder review covers the default weights, profiles can lower a source, and there is no appeal path.
  ECO-901: PARTIAL  # Compatibility notes and version pins are met and CI replays the 1.1 fixtures, but the four staged adoption plans disagree and use validator levels as milestones.
actions:
  # P1. Where an action absorbs a duplicate from another check, its text names the merged id.
  - id: "HF-101-A"
    priority: P1
    fix: >-
      Define one canonical incident view: a documented schema plus a tool that emits it, for example a summary
      mode of tools/verify_audit_log.py or a new tools/incident_view.py (it can share its reader with
      ASSUR-602-A). For each gated plugin or SDK call it shows tool, call id, status, the checkpoint id and
      restore commit the call used, the exact restore command and any refusal code. For each executor run it is
      built from the action records, run record and trace, and shows the failing step, code and reason_code, the
      last checkpoint_id and its scope, the targets changed, the evidence anchors, the not_covered items and the
      next action (retry, rollback or escalate). Add a test that runs the tool on a fixture log and run.
    artifact: doc
    owner: "maintainers"
  - id: "HF-101-B"
    priority: P1
    fix: >-
      Make the plugin's audit line carry what the PreToolUse hook already knows. posttooluse_log_tool.sh adds
      details.checkpoint_id and details.commit from the marker filed under .claude/checkpoints/used/ for this
      call id, and the capability the hook classified the call as, so the log alone answers what changed, under
      which capability, and how to undo it. Document the used/<checkpoint_id>.<call_id> file name in
      hooks/README.md and add a test that pins the fields. (Merges the record part of ASSUR-602-A and of
      GOV-202-A.)
    artifact: hook
    owner: "maintainers"
  - id: "HF-101-C"
    priority: P1
    fix: >-
      Add a tabletop exercise recipe for at least one high-risk flow, for example an approved Write through the
      plugin that must be undone, or a send refused under a destination policy through the SDK adapter. Give the
      expected codes, what the operator looks at first and the recovery commands. Put it at
      docs/compliance/nist-ai-rmf/tabletop_exercise_template.md, the path the NIST profile already names for gap
      G-09, and script its steps as a test so it stays true.
    artifact: test
    owner: "maintainers"
  - id: "HF-101-D"
    priority: P1
    fix: >-
      Rewrite SECURITY.md section 6 for Standard 1.2 as a runbook keyed to concrete alerts: R407 lockout from
      project-settings env, F501 loops, F502 in bypassPermissions, dontAsk or auto modes, F504 records-guard
      refusals and bursts of F501/F502/F504, the log hook's 'no longer holds the entry its head records'
      message, a verify_audit_log chain, head or witness failure, a run that ends 'escalated' with a safety code,
      and an invariant-monitor violation (ASSUR-602-A). For each, give the symptom, the first place to look, the
      default response (halt the session, roll back to a recorded commit, rotate AUDIT_HMAC_KEY), the escalation
      role and the time limit. Replace the detection signal 'audit entries without corresponding checkpoints'
      with one the plugin and SDK records can compute, and link section 8.3's 'Audit logs are monitored' and
      'Incident response plan exists' items to the runbook. (Merges ASSUR-602-C.)
    artifact: doc
    owner: "maintainers and security reviewers"
  - id: "HF-102-A"
    priority: P1
    fix: >-
      Add permissions and attribution to section 8.4 overrides. In authority_trust_model.yaml overrides, add
      requires_actor_identity (default true) and an allowed-actor rule (allowed_actors or requires_person), with
      person-only as the default for high-risk domains. manual_override then refuses an override with
      actor_identity=None (today accepted and recorded as actor 'agent') and, where a person is required, one
      whose actor_identity.kind is not human. Update section 8.4, implement it in grounded_agency/trust.py and
      packages/acs-core (only the Python SDK implements section 8.4 today), and add pytest cases for each refusal
      and section 8.4 vectors in tests/conformance/trust/, which cover no override today. (Merges ETH-801-C.)
    artifact: policy
    owner: "maintainers and security reviewers"
  - id: "HF-102-B"
    priority: P1
    fix: >-
      Reword the F502 refusal for permission modes that ask no one (hooks/pretooluse_require_checkpoint.sh
      L1095). First direct the operator to a mode that asks (default, acceptEdits, plan). Then say that
      ACS_HOOK_APPROVAL=off hands every approval to Claude Code's rules, so in bypassPermissions nothing is
      asked. Emit an operator-visible notice (for example a SessionStart message) whenever approval is off.
    artifact: hook
    owner: "maintainers"
  - id: "HF-102-C"
    priority: P1
    fix: >-
      Treat strict_mode=False as an audited override and make its records truthful. Require an explicit
      acknowledgement flag, and write one dedicated audit record when an adapter starts with checkpoints
      unenforced. Write one record per call that goes ahead despite F501 or F503, as executed with the skipped
      diagnostic under details, instead of 'refused' entries followed by 'allowed' ones (today the PreToolUse
      hook and the permission callback write 4 refused and 2 allowed records for one call that ran). Remove
      'Solution 2' from the F501 troubleshooting in docs/integrations/claude_agent_sdk.md. Add a test.
      (Merges HF-101-E.)
    artifact: policy
    owner: "maintainers"
  - id: "HF-103-A"
    priority: P1
    fix: >-
      Measure explanation faithfulness. In benchmarks/scenarios/decision_audit.py, replace the self-labelled
      confabulated check in _evaluate_faithfulness with a comparison of the explanation's cited_criterion and
      detailed_reasons against actual_reasoning (criteria_values, scores). Add a scenario that takes real explain
      outputs (recorded or model-generated) and checks each premise and chain claim against a cited anchor's
      content and the run's action records and trace. Report the unsupported-claim and contradicted-claim rates,
      with a threshold that fails CI.
    artifact: benchmark
    owner: "maintainers"
  - id: "HF-103-B"
    priority: P1
    fix: >-
      Apply the existing grounding check to explain in shipped policy. Add explain to require_grounding in the
      high-risk profiles (healthcare, manufacturing, data_analysis). Declare grounding@1 with attested: true and
      require explain in the domain catalogs whose explain step binds grounded or audit outputs (for example
      healthcare_workflows.yaml L496, manufacturing_workflows.yaml L217). Update the explain skill's procedure so
      it cites those inputs as acs: record anchors (or the action or audit record ids) rather than free-text
      evidence strings.
    artifact: policy
    owner: "maintainers"
  - id: "ORG-201-A"
    priority: P1
    fix: >-
      Add a 'Policy ownership' section to spec/GOVERNANCE.md. For each policy surface, name the role that owns it
      and the reviewer it requires: the ontology safety flags and requires/precedes/conflicts_with edges;
      schemas/profiles/* (trust_weights, risk_thresholds, checkpoint_policy, evidence_policy); the defaults of
      the hooks and the adapter (ACS_HOOK_APPROVAL, ACS_CHECKPOINT_MAX_AGE, RateLimitConfig); and the Bash
      classifier lists (grounded_agency/capabilities/mapper.py and hooks/pretooluse_require_checkpoint.sh). Point
      deployers to the RACI in docs/compliance/iso42001/ai_policy_template.md section 5. Add a
      .github/CODEOWNERS that requires those reviewers for schemas/capability_ontology.yaml, schemas/profiles/,
      hooks/, grounded_agency/capabilities/mapper.py and spec/.
    artifact: policy
    owner: "maintainers"
  - id: "ORG-201-B"
    priority: P1
    fix: >-
      Write a rollback procedure for a bad policy update and link it from spec/SECURITY.md section 6.2 and
      docs/compliance/iso42001/nonconformity_procedure.md. It covers reverting a profile, an ontology change or a
      hook or adapter default to the previous released version; finding the affected calls and steps by
      recorded_by.version, config_sha256 and settings in the audit records; handling runs that keep the profiles
      they started with (sections 5.21.1, 5.19.4); and who declares the incident.
    artifact: doc
    owner: "maintainers and security reviewers"
  - id: "GOV-202-A"
    priority: P1
    fix: >-
      Make refusals observable in every layer. Have hooks/pretooluse_require_checkpoint.sh append each refusal it
      can (F501, F502, F504, R407) to the HMAC chain of .claude/audit.log under the log hook's lock and head, or
      to a chained sibling log, as an ActionRecord with status 'rejected', the code, the tool, call_id and
      recorded_by, as section 5.18.8 asks of a layer; add a test that an F501 refusal appears there and passes
      tools/verify_audit_log.py. Give the Standard Agents binding an onRefusal callback, and document the
      adapter's 'Refused:' WARNING on the grounded_agency.adapter logger and its 'rejected' records as its alert
      interface. If the plugin change is not wanted, correct SECURITY.md section 1.1 (L19) and section 6.1 (L663)
      to say the plugin's refusals reach only the model's stderr, and list it as a host gap in section 5.5.
      (Merges ASSUR-601-B and ASSUR-602-D.)
    artifact: hook
    owner: "maintainers and security reviewers"
  - id: "GOV-202-B"
    priority: P1
    fix: >-
      Add an audit review procedure to SECURITY.md sections 6 and 8.3. Name the owner and the cadence (for
      example verify_audit_log.py --witness at each session end and a weekly review). Define anomaly rules with
      thresholds over fields the records actually hold: refusal rate, gated calls with no used/ checkpoint
      marker, chain or head mismatch, recorded_by.settings.approval == 'off', a change of config_sha256, and gaps
      in action_id or seq. Give an escalation path that links the EU AI Act L1-L4 model. In the same change,
      correct the measurement sources in post_market_monitoring.md sections 3.1 and 5, including the
      checkpoint-enforcement and audit-completeness KPIs that cite a nonexistent 'CheckpointTracker validation
      log', to what the plugin log and the adapter's exported records contain.
    artifact: doc
    owner: "security reviewers"
  - id: "ECON-301-A"
    priority: P1
    fix: >-
      Add a hook latency benchmark (for example benchmarks/hooks_latency.py, run in a scratch git repo). Cover
      the pre hook by tool class (read-only tool, read-only Bash, git read, gated Write with and without a
      marker), the log hook, the take hook and the adapter's PreToolUse callback. Publish the p50/p95 results as
      a budget table in hooks/README.md and docs/integrations/claude_agent_sdk.md; a reference run gave about
      17/37/89/51 ms for the pre hook and about 190 ms for the log hook. Add a CI check against a generous
      ceiling so regressions are caught.
    artifact: benchmark
    owner: "maintainers"
  - id: "ECON-302-A"
    priority: P1
    fix: >-
      Extend the round-by-severity table in tasks/todo.md (L218-238) into a failure-class table in a public
      document (spec/SECURITY.md or a docs page). Sort the 130 confirmed defects into classes (shell-text reading
      and classification, trust in layer records, redaction coverage, composite and nesting checks, time bounds).
      For each class give counts per round and severity, and the capability or Standard section and the test
      suite that mitigates it. Rank the classes by residual trend, so that the open 'classify fewer forms' design
      task for shell reading, which still yields about 20 medium defects per round, comes first.
    artifact: doc
    owner: "security reviewers"
  - id: "ECON-302-B"
    priority: P1
    fix: >-
      Add benchmark scenarios for the 1.2.0 safety-layer mechanisms, each with a baseline metric and a layer
      metric in benchmarks/runner.py and the CI artifact: a send to a destination the policy does not allow
      (F504 destination policy), a secret reaching evidence or records (redaction), a gated tool call without a
      checkpoint (F501), and an ungrounded output (F505). Add test assertions for each like those at
      benchmarks/tests/test_scenarios.py L129 and L138.
    artifact: benchmark
    owner: "maintainers"
  - id: "ECON-302-C"
    priority: P1
    fix: >-
      Make the mutation_recovery scenario's layer path capture the file with the checkpoint and restore it with
      CheckpointTracker.restore_checkpoint (the snapshot store this change adds), not by writing
      self.original_content (mutation_recovery.py L135, L209), so the recovery and integrity metrics measure the
      shipped restore path. Assert on the returned Restore result.
    artifact: benchmark
    owner: "maintainers"
  - id: "SEC-401-A"
    priority: P1
    fix: >-
      Add a deployment-level resource policy for mutate, analogous to allowed_destinations for send: a profile
      and adapter member protected_paths, with a shipped default taken from the persist skill's list (~/.ssh,
      ~/.aws, ~/.config, ~/.claude, /etc, *.pem, *.key, .env), plus an optional allowed_paths. Apply it in
