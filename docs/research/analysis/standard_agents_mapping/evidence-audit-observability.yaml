    - '@standardagents/spec 0.45.10 index.d.ts lines 2035-2040, 2979-2980'
    quote: 'These are conventions, not requirements: consumers **MUST** tolerate their absence, and runtimes
      **MUST NOT** rely on them for routing correctness.'
  explanation: 'ACS expects the host to say who delivered each item and how the host authenticated and
    classified that party; the trust class then sets the evidence weight (0.7 for `own_subagent_report`).
    ACS leaves the method to the host (''the standard does not say how a party is authenticated or'' classified)
    and calls the identity the host''s attestation, not a credential. SA can identify a child instance
    (registry `reference`, the `subagent_id` message field, the SHOULD-level `metadata.subagent_id`) and
    the thread''s user, but states no authentication method or trust classification, and its provenance
    keys are explicitly optional. Ambiguities: a top-level `subagent_id` and a `metadata.subagent_id`
    with no statement of which is authoritative; `metadata.forwarded_from` is an ''origin thread or message''
    in the text and ''the source thread id'' in the published types. No rule was found that stops package
    code writing these keys, so they are labels, not attestations.'
  combined: 'Today, by binding policy rather than SA guarantee. Child reports: the origin is established
    by lookup, not by label. A `reference` taken from `state.children` (the registry is runtime-maintained)
    is resolved with `state.getChildThread(reference)` and the result is read from the child thread; then
    `{ principal: ''sa-subagent:'' + reference, kind: ''agent'', authenticated_by: ''x-acs.sa-child-thread'',
    trust_class: ''own_subagent_report'' }` describes a lookup the host made itself (the `x-` value is
    this document''s suggestion, allowed by the ACS vendor pattern). A report identified only by a message
    label gets no identity. Human messages through the generic route get none either: `state.user()` is
    the thread''s user, not the sender. ACS §5.17 then drops such items, or marks them always-ask, when
    the workflow binds the identity inputs. Only a packaged endpoint''s `auth.caller` is caller-authenticated
    (inbound-01).'
