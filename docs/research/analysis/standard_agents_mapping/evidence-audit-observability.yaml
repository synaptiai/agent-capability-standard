    concept: 'What later tools, the model and clients can see: `execution.messageHistory`, `getMessages`,
      `state.context`, the prompt options `includeChat` and `includePastTools`, request-context hooks,
      `message_data` frames'
    refs:
    - content/0.2.0/specification/threads/execution-state.md §2.2 Live execution history (lines 43-51)
    - content/0.2.0/specification/threads/messages.md §3.3 Same-execution visibility (lines 132-136; quote
      at line 134)
    - content/0.2.0/specification/threads.md §6.2 Per-Execution Context (lines 372-395), §6.3 Context
      Limitations (lines 397-404)
    - content/0.2.0/specification/prompts.md §1.2 Optional Properties (lines 26-27), §3.3 Sub-Prompt Tool
      Configuration (line 159)
    - content/0.2.0/specification/hooks.md §3.4 Stored history and the request context (lines 291-306)
    - content/0.2.0/specification/threads/client-api.md §11 Reading Messages (lines 302-332), §16.2 Delivery
      (line 449)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 21-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2593-2598 (ExecutionState.messageHistory)'
    quote: During an active execution, a successfully injected message **MUST** become observable to subsequent
      tools and hooks in that execution.
  explanation: 'ACS passes evidence forward explicitly: a later step binds an earlier step''s output,
    the validator type-checks the reference and the executor copies the value. SA has no step-to-step
    data flow; a later step sees the conversation. Later tools and hooks can read every persisted message
    with its `metadata` through `state.execution.messageHistory` or `state.getMessages()`; `state.context`
    is scratch for one execution (''Mutations are lost after execution ends''). Whether the model sees
    earlier tool results is a prompt setting: `includeChat` and `includePastTools` both default to `false`,
    and for a prompt used as a tool `includeToolCalls` decides whether its tool calls and results are
    serialised into the result string; `filter_messages` or `prefilter_llm_history` may trim further.
    An anchor reaches a later tool only as a model-written argument, which the model can alter or invent.
    Published types only: with a prompt''s `historyLimit`, `messageHistory` holds ''only its newest window''.'
  combined: 'Works today with stated preconditions. Anchors the model must cite go into the tool `result`
    JSON and reach later turns only when the prompt sets `includePastTools: true`. Anchors that code relies
    on go into the key-value store (store-01), not `messageHistory`. A tool that receives anchors or evidence
    ids as arguments resolves them against the evidence store and rejects unknown ones; it does not trust
    evidence text pasted by the model. `state.context` only correlates hooks within one execution (for
    example a map keyed by `toolCall.id`). Typed bindings between steps exist only when an ACS executor
    drives the run, which today means a Python process outside the SA runtime that a packed agent would
    have to declare as an external service.'
