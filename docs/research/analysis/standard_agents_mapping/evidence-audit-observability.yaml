    - content/0.2.0/specification/threads/runtime-streams.md §4 Neutral Example (line 82)
    - '@standardagents/spec 0.45.10 index.d.ts lines 230 (ToolResult.error_code), 3410 (`execution: ExecutionState
      | null`)'
    quote: '- Runtimes **MUST** persist the status with the thread so it survives restarts.'
  explanation: 'ACS''s reference executor produces an ordered decision trace (events `{seq, at, kind,
    frame, step, detail}`, with kinds such as `step_started`, `approval_requested`, `checkpoint_consumed`,
    `step_failed`), action records ''for every step that required'' approval, and a canonical, HMAC-signed
    snapshot. The trace is reference-executor output described in an informative guide and exercised by
    fixtures the standard calls informative; its format is not normative. SA persists what the model and
    tools did (messages, audit-05) and the last stop reason (''Runtimes **SHOULD** use these codes''),
    pushed to clients as `thread_status` frames, but no decision trace: nothing records hook failures,
    retries or why a turn went to a side. Error attribution exists (`ErrorOrigin`) but is routed to ''logs
    and operator interfaces''. Runtimes ''may persist synthesized status messages'' for lifecycle events,
    an optional channel. hooks.md §1.1 lists no hook for the start or end of a run.'
  combined: 'Today, a run that no ACS executor drives can be reconstructed only from hook records (audit-01),
    with `state.execution?.flowId` as the correlation id (the property is null at rest), and its outcome
    from `ThreadStatus`, whose `reason` codes are a SHOULD. Executor traces, action records and signed
    snapshots are available only from a Python executor process outside the runtime, which a packed agent
    would have to declare as an external service, and which packaging.md admits only ''as part of the
    agent''s purpose rather than as a replacement for a missing runtime capability'' (packaging-conformance-governance#pkg-07);
    an in-process build is future work (ROADMAP.md lists multi-language SDKs). One integration needs no
    executor in the runtime: hook records exported through an endpoint can be scored by ACS''s observe-only
    `WorkflowTracer` (Python). A failed run''s diagnostic code can be mapped into a tool''s `error` text
    and into `error_code`, which the published types declare and the text uses once, undefined, in an
    example.'
