- id: retention-01
  relation: acs_only
  acs:
    concept: Retention declarations (`audit` input `retention`; world-state `retention_policy`; the healthcare
      profile's `audit_retention_days`)
    refs:
    - schemas/capability_ontology.yaml audit.input_schema.retention (lines 1357-1359)
    - spec/STANDARD-v1.1.0.md §6.3 World State Requirements (line 1167)
    - schemas/world_state_schema.yaml retention_policy (lines 559-586)
    - schemas/profiles/healthcare.yaml compliance (lines 101-106)
