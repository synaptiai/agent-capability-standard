- id: prov-01
  relation: partial
  acs:
    concept: '`ProvenanceRecord` (`claim_id`, `created_at`, `agent`, `capability`, `anchors`, `transformations`,
      `assumptions`, optional `agent_identity`)'
    refs:
    - schemas/world_state_schema.yaml types.ProvenanceRecord (lines 151-188)
    - spec/STANDARD-v1.1.0.md §2 Terms, 'Provenance' (line 60)
    quote: '| **Provenance** | Traceability record for claims and transformations |'
  sa:
    concept: 'Message record fields that say where a message came from: `role`, `prompt`, `name`, `tool_call_id`,
      `parent_id`, `depth`, `created_at`, `subagent_*`'
    refs:
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 13-38; quote at line
      24), §4 Queueing Messages (lines 157-160)
    - content/0.2.0/specification/threads/client-api.md §3.3 Timestamps (lines 65-73), §12 Sending a Message
      (line 342)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (line 22)
    quote: '| `prompt` | `string \| null` | Name of the prompt that produced the message |'
  explanation: 'SA records for each persisted message where it came from in conversational terms: a perspective
    (`role`), a prompt, a tool call, a nesting level, a time and, for cross-thread traffic, a child. ACS
    provenance answers a different question: which evidence supports a claim, which capability produced
    it, what was transformed or assumed. SA has no field for a claim, a capability id, a transformation
    list or assumptions; ACS has no field for prompt, side, depth or model. Limits of the SA fields as
    provenance: `role` is the perspective a message was written to, chosen by whoever created it (a client
    may send `''assistant''` or `''system''`); the record has no agent field although ''The agent assigned
    to a thread can change over time''; the message names the prompt but not the model that ran; one assistant
    message can hold many claims.'
  combined: 'Works today: the record is derived at creation time in an `after_create_message` hook, which
    stores `state.agentId` and `message.prompt` then, because both can differ later. `claim_id = message.id`
    is used for tool-result messages only; claims inside an assistant message get their own ids when a
    `ground` tool extracts them. `created_at = new Date(message.created_at / 1000).toISOString()` (SA
    message timestamps are microseconds). `agent` names the agent and prompt, not the model, which cannot
    be read from the message. `capability` comes from the tool-to-capability mapping the package ships,
    `anchors` from the evidence store; `tool_call_id`, `parent_id` and `depth` are kept as extra fields.
    `ProvenanceRecord` is a schema type; STANDARD-v1.1.0.md does not require one per message.'
- id: prov-02
  relation: fits
  acs:
