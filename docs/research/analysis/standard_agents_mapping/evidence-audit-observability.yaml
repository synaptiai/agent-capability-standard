    quote: '- The turn is marked failed. The error **MUST** be surfaced on the runtime''s request/execution
      log as a runtime-origin failure — a throwing handler never silently swallows a message.'
  explanation: 'SA mandates a persisted, client-readable record of what the model and tools did: runtimes
    MUST persist assistant responses, tool results and tool errors as messages, with `tool_calls`, `tool_call_id`,
    `tool_status`, `created_at`, `prompt` and the model''s reasoning. That record is mutable and deletable
    (audit-02). Not found in SA 0.2.0: an audit log, a record of runtime decisions, or an API to read
    a log. `ThreadState` has no log member, although handlers.md §5 (a MUST), providers.md §7 and §9.5,
    threads.md §9.3, runtime.md §8.2 and draft users.md §6 presuppose runtime logs. ACS: the capability
    is normative, but ''audit log'', ''audit trail'' and ''audit record'' do not occur in STANDARD-v1.1.0.md;
    record formats exist only in implementations (the audit skill''s contract, the plugin hook''s HMAC-chained
    line, `CoordinationEvent`, `ActionRecord`, the executor trace). Searched (content/0.2.0 and index.d.ts):
    audit, trace, tracing, telemetry, observab, getLogs, listLogs, log.'
  combined: 'Works today, ACS supplying the semantics and SA the mechanics. (1) `audit` as a function
    tool whose `execute` appends a record and returns the capability''s contract (`recorded`, `audit_id`,
    `timestamp`, `evidence_anchors`) as JSON in `result`. The model decides whether to call it unless
    the agent makes it unavoidable, for example by binding it as `sessionStop` with `stopOnResponse: false`,
    or by calling it from a handler. (2) An ambient trail from three MUST-invoked hooks: `after_create_message`
    (on `role: ''tool''` messages, the as-stored record), `after_update_message` and `tool_call_done`,
    each writing an ACS `ActionRecord` (action-01) to the key-value store. `after_thread_created` and
    `after_subagent_created` have no behaviour section and are optional extras; `state.children` already
    holds the child link. Cannot be done: reading the runtime''s own log, or observing a message deletion
    or the end of a run from a hook.'
