- id: audit-02
  relation: acs_only
  acs:
    concept: Append-only, tamper-evident records (immutable events; HMAC-chained audit log; signed run
      snapshot)
    refs:
    - schemas/event_schema.yaml schema.principles (line 8)
    - spec/STANDARD-v1.1.0.md §2 Terms, 'Observation' (line 58)
    - hooks/posttooluse_log_tool.sh (lines 1-17)
