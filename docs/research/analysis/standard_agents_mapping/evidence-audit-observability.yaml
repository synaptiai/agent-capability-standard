    quote: '1. When a model returns reasoning with an assistant message, the runtime **MUST** persist
      it with that message: the reasoning text in `reasoning_content`, and any provider-specific reasoning
      data in `reasoning_details`.'
  explanation: 'ACS''s `audit` records what happened and why: the ontology links `explain` to `audit`
    (''Explanations become part of audit trail'') and the audit skill''s record has a `decision_rationale`
    field. SA has no rationale field, but it mandates the raw material: a runtime MUST persist each assistant
    response with its `tool_calls`, each tool result and tool error as a message, and the reasoning a
    model returns, and MUST carry that reasoning identically in message reads and `message_data` frames.
    This is the nearest SA counterpart of an activity record with reasons. Differences: the reasoning
    is the model''s own text, provider-specific in `reasoning_details`, and present only when the model
    returns it; it is not an `explain` output and carries no evidence anchors; and the record is mutable
    and deletable (audit-02).'
  combined: 'Works today: an `audit` tool or an `after_create_message` hook cites the assistant message
    that issued a tool call as the rationale source, with an anchor that names the thread and message
    id, instead of asking the model to restate its reasons. `reasoning_content` is copied into an audit
    record only after the redaction step of privacy-01, since reasoning can quote tool output. Persisted
    reasoning does not replace an `explain` step where an ACS workflow has one.'
