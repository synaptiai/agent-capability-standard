    - docs/guides/RUNNING_WORKFLOWS.md 'Driving a run yourself' (lines 270-271; informative guide)
    quote: Events are immutable and append-only.
  sa:
    concept: Mutable, deletable thread storage; no hook for a deletion and no stream frame for a message
      deletion; `instanceEnv` as a trust anchor
    refs:
    - content/0.2.0/specification/threads/messages.md §5 Updating Messages (lines 169-178), §6 Deleting
      Messages (lines 180-186)
    - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread (lines 292-298; quote at
      line 296), §13 Deleting a Message (line 381)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (line 76), §2.3 Environment Variable Resolution
      (lines 227-234)
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36)
    - content/0.2.0/specification/threads/code-execution.md line 54; content/0.2.0/specification/models.md
      line 284 (the unrelated 'append-only' and 'Retention' hits)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2616-2622 (abortSignal), 2940-2947 (instanceEnv)'
    quote: 5. The runtime **MUST** delete the messages, files, and stored values of every thread in the
      deletion set.
  explanation: 'Not found in SA 0.2.0: an append-only store, an integrity or hash primitive, or a retention
    rule for thread data. Everything a package writes can be changed by any code holding the `ThreadState`
    (`updateMessage`, `deleteMessage`, `unlinkFile`, `setValue(key, null)`), and deleting a thread destroys
    messages, files and values by MUST. No hook fires for a deletion. A message deletion has no stream
    frame (''This section defines no stream frame for a deletion.''); a thread deletion is visible to
    clients (streams closed with code `1000`, then 404) and, in the published types, to code in flight
    through the abort signal. No MUST on either side is contradicted (STANDARD-v1.1.0.md sets no tamper-evidence
    requirement), but a trail kept inside a thread is only as durable and trustworthy as the thread. Searched
    (content/0.2.0): append, immutable, tamper, integrity, hash, checksum, sha256, signature, retention;
    the hits are unrelated or say retention is runtime-defined.'
  combined: Partly today, and beyond what the ACS standard requires. Records can be chained in hook code
    (`prev_hmac`, `hmac`, as the ACS plugin hook does) with a key read through `state.instanceEnv?.('ACS_AUDIT_HMAC_KEY')`.
    A keyed chain detects edits and mid-chain removal by clients and by the model. It does not detect
    changes by other code in the runtime (every package on the instance can read the key), removal of
    the newest records unless the chain head is kept elsewhere, or thread deletion. Without `instanceEnv`,
    threads.md §2.3 says consumers that require the boundary 'must feature-detect the method and fail
    closed'; the binding either fails closed or labels the records as unchained, never as tamper-evident.
    Hashing comes from the host JavaScript environment, not from SA.
