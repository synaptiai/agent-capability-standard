  explanation: 'ACS requires a `provenance` member on every canonical event (STANDARD §6.2); the schema
    allows null and makes `transformer`, `transform_version` and `ruleset_id` optional, leaving the values
    to the producer. SA hands every thread hook a runtime-supplied statement of why it is running (prompt,
    agent or child relationship) and, for packed children, the package id, version, source and pack time;
    package provenance, when present, ''**MUST** identify the namespace from which the child hook was
    loaded''. That is host-supplied provenance for the record writer, which ACS cannot obtain on its own.
    Limits: `package` exists only on the `child` source and is optional there; a prompt- or agent-selected
    hook gets no package signature; the context does not carry the hook''s own id.'
  combined: 'Works today. An evidence or audit hook fills `provenance.transformer` with its own hook id
    (a constant in its module) plus `context.source.kind` and the prompt, agent or relationship name,
    and `provenance.transform_version` with `context.source.kind === ''child'' ? context.source.package?.version
    : undefined`, falling back to the binding package''s version constant. Reading `context.source.package`
    without narrowing to the `child` member does not compile against the published types. Using a hook
    id as `transformer` is this document''s convention, not an ACS rule.'
