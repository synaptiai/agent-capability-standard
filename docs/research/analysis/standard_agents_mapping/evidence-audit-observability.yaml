    quote: '| `retention_policy` | object | No | How long to retain |'
  sa:
    concept: Retention is runtime-defined and out of scope
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 14), §10 Deleting a Thread (line
      296)
    - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (line 235)
    - content/0.2.0/specification/subagents.md §4.1 Persistence Is Universal (line 124)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 21-25)
    - content/0.2.0/specification/users.md status line (line 3), §7.1 (lines 284-285); draft page
    - '@standardagents/spec 0.45.10 index.d.ts lines 3181-3192 (setUserValue)'
    quote: 6. Thread retention is runtime-defined.
  explanation: 'ACS carries retention declarations at three levels: the `audit` capability takes a `retention`
    input (''How long to retain''), world state has an optional `retention_policy` with `observations`,
    `audit_logs` and `snapshots`, and the healthcare profile sets `audit_retention_days: 2555` (a key
    profile_schema.yaml does not define) with `retention: 2555d` on its audit steps. No reference component
    reads them; they are declarations a host is expected to honour. SA 0.2.0 leaves retention to the runtime
    in three places and defines no retention field, archive or export, and a thread delete removes messages,
    files and stored values by MUST. A trail kept only inside a thread therefore cannot honour an ACS
    retention declaration on a conforming SA runtime. Searched: retention (content/0.2.0: client-api.md
    line 14, runtime.md line 235, subagents.md line 124, and the unrelated ''Zero Data Retention''; core/src
    and grounded_agency: only evidence-store eviction priority).'
  combined: A deployment that declares retention (for example with the healthcare profile) needs a sink
    outside the thread. The option that depends on no draft surface is an external service the package
    declares as part of its purpose (packaging.md 'Portability requirements'). The published types also
    offer user-scope values (`setUserValue`), which are account-wide and so outlive a thread delete (inference),
    but are absent from the 0.2.0 text, reject writes on threads without a user, and sit beside 'client-writable
    value routes' on the draft Users page; they suit a chain head or an index, not a tamper-resistant
    archive. The `retention` input is passed through to the sink; SA gives it no meaning.
