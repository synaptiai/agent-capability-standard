      at line 158), §6 Conversation Semantics (lines 200-210)
    - content/0.2.0/infrastructure/runtime.md §1.1 Decision Inference (lines 21-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1263-1282 (answer types), 1299-1302 (DecisionResult.model),
      1316-1323 (DecisionProviderFactory, DecideOptions)'
    quote: '- Probabilities and `confidence` values are numbers in **[0, 1]**. Confidence is provider-reported
      and is distinct from an individual outcome probability.'
  explanation: 'ACS says a confidence value must exist and where; §8.1 describes it as ''Self-reported
    confidence from source'' and gives no method. `inference_method` has no field in any ACS schema. SA
    offers a mechanism ACS lacks: a runtime MUST expose `decide()`, which evaluates caller-supplied context
    against boolean, choice or score questions and returns complete probability distributions; the result
    names the evaluating model. Two cautions. A boolean answer carries only `probability`, which is P(true);
    `confidence` is separate, optional and present only on choice and score answers. And `decide()` takes
    a `provider` factory from the caller: the runtime supplies no decision model, and the text names none.
    `decide()` reads and writes no messages, so an answer is persisted only if code stores it. Searched:
    inference_method (spec, schemas, core/src, grounded_agency, skills, docs/guides, hooks, templates,
    tools): only STANDARD §3.1, STANDARD-v1.0.0.md and SECURITY.md §1.3.'
  combined: Works where the package ships a decision-provider factory and credentials. `ground` and `verify`
    are function tools that load the evidence by anchor id from the store (not from model-written arguments)
    and call `state.decide(...)` with a `score` question whose `levels` are ACS's `required_strength`
    scale (weak, moderate, strong). `grounded` is set from the probability mass at or above the requested
    level; `confidence` from the answer's provider-reported `confidence` when present, otherwise from
    that mass, with a record of which was used and of `result.model` under a binding-specific key. That
    key is a binding extension, not §3.1's `inference_method`, which is for ungrounded claims. `evidence_policy.minimum_confidence`
    is read by no ACS reference component, so applying it is binding behaviour (policy-01). Without a
    decision provider the tool returns an error result.
  see_also:
  - tools-contracts#io-08
  - published-api-extension-points#decide-01
  - models-context-memory-security#ground-01
  - models-context-memory-security#profile-04
- id: trust-03
  relation: acs_only
  acs:
    concept: Grounded claims (§3.1) and the reserved diagnostic F505 PROVENANCE_MISSING
    refs:
    - spec/STANDARD-v1.1.0.md Status line (lines 4-8), §3.1 Grounded Claims (lines 76-77), §4.3 (line
      169), §9.6 Safety Errors (line 1325)
    - spec/CONFORMANCE.md coverage gaps (lines 107-110)
    - spec/SECURITY.md §1.3 Claims Must Be Grounded (lines 46-53)
    - schemas/profiles/profile_schema.yaml evidence_policy.require_grounding (lines 76-80)
    - schemas/capability_ontology.yaml `soft_requires` edges into `ground` (lines 1803-1839)
    quote: '| F505 | PROVENANCE_MISSING | Claim without provenance (§3.1). Reserved: the reference validator
      and executor do not check it yet |'
  sa:
    concept: No counterpart found; message lifecycle hooks, a second prompt-backed side and a handler-backed
      side are the available enforcement points
    refs:
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 15, 22), §1.3 Reasoning
      (lines 69-77)
    - content/0.2.0/specification/hooks.md §4.1 before_create_message (lines 320-322), §4.2 (lines 334-335)
    - content/0.2.0/specification/agents.md §9.2 Worker / Reviewer (line 221)
    - content/0.2.0/specification/handlers.md §3 Execution Model (lines 44-55), §6 Capabilities (lines
      79-88)
    quote: '- Implementations **MUST** call this hook before inserting any message, including every `injectMessage()`
      path'
  explanation: 'Not found in SA 0.2.0: any concept of a claim, a citation, or a requirement that model
    output be supported by tool results. An assistant message is free text plus optional reasoning. ACS
    states the requirement as a MUST in §3.1 (SECURITY.md words the output rule as SHOULD), but by its
    own status line the reference validator and executor do not check §3.1''s grounding, and F505 is reserved;
    the only grounding rule the reference validator applies is the `soft_requires` ordering into `ground`
    (warning W601), which concerns step order, not content. So neither project rejects an unanchored assistant
    message: ACS defines the obligation and the contracts (`ground`, `evidence_anchors`), SA provides
    places where a check can run. Searched (content/0.2.0): evidence, citation, cite, grounded, grounding,
    claim, hallucinat, source reference: no hit (the only `cite` matches are inside `AsyncIterable`).'
  combined: 'Works today as package-level policy. (a) Annotation: a `before_create_message` hook for assistant
    messages writes `metadata.acs.evidence_available` with the anchor ids recorded in the thread so far.
    It is named for what it shows (tools ran), never `grounded`; it does not block, because a hook failure
    is not a reliable gate (audit-04), and `state.execution` is null for at-rest injections. (b) Enforced
    gate: the reviewing side is backed by a handler. Code checks the worker''s message against the evidence
    store and either injects a rejection or calls `state.stopSession({ result })`. A prompt-backed reviewer
    is weaker: the model can call the `sessionStop` tool without calling `ground` or `verify`. Not possible:
    a runtime-enforced rule that rejects an assistant message without anchors.'
- id: policy-01
  relation: acs_only
  acs:
    concept: Domain-profile `evidence_policy` (`required_anchor_types`, `minimum_confidence`, `require_grounding`)
    refs:
    - schemas/profiles/profile_schema.yaml evidence_policy (lines 62-80; quote at line 70)
    - schemas/profiles/healthcare.yaml evidence_policy (lines 63-72)
    - tools/validate_profiles.py lines 216-258 (shape checks)
    quote: 'description: Types of evidence anchors expected in this domain'
  sa:
    concept: No counterpart found; layered `env` values and package constants are the available configuration
      slots
    refs:
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-225)
    - content/0.2.0/specification/agents.md §2.2 Optional (line 91; quote)
    quote: '| `env` | `Record<string, string>` | - | Agent-level default variable values |'
  explanation: 'An ACS domain profile declares which anchor types a domain expects, a minimum confidence
    ''for actions'' and which capabilities ''require explicit grounding''. Two limits on the ACS side:
    the anchor-type values (for example `clinical_data_point`, `guideline_reference`, `audit_trail` in
    the healthcare profile) match no `Anchor.kind` in either schema, and the three keys are checked for
    shape by tools/validate_profiles.py and read by nothing in core/src or grounded_agency. SA 0.2.0 has
    no notion of an evidence policy or a domain profile; the configuration it defines is layered `env`
    values (strings) resolved from thread, agent, prompt, user and instance. Searched: evidence, grounding,
    grounded (content/0.2.0): not found; required_anchor_types, minimum_confidence, require_grounding
    (core/src, grounded_agency): not found.'
  combined: 'A binding that applies a profile defines behaviour the ACS reference implementation does
    not have, and should say so. The profile ships as data inside the package (JSON or a TypeScript constant),
    is selected by `await state.instanceEnv?.(''ACS_PROFILE'')` with the bundled profile as the fallback,
    never by `state.env()` (models-context-memory-security#profile-01), and is applied in the tool wrappers:
    `require_grounding` as the list of capabilities whose wrapper rejects an output with empty `evidence_anchors`,
    and `minimum_confidence` as the threshold of trust-02. `required_anchor_types` cannot be checked mechanically
    until ACS relates its values to `Anchor.kind` (see ACS gaps).'
  see_also:
  - published-api-extension-points#thread-07
  - approval-human#approval-21
  - models-context-memory-security#profile-01
- id: transform-01
  relation: partial
  acs:
    concept: Auditable transforms (§3.2), `mapping_ref` transform steps and the canonical event's `raw`
      and `canonical` pair
    refs:
    - spec/STANDARD-v1.1.0.md §3.2 Auditable Transforms (lines 79-82; quote at line 82), §5.2 Step Definition
      (line 258), §6.2 Observation Requirements (lines 1136-1137)
    - schemas/event_schema.yaml event.properties.raw (lines 147-149), provenance (lines 160-170)
    - schemas/world_state_schema.yaml ProvenanceRecord.transformations (lines 179-183)
    - schemas/transforms/transform_coercion_registry.yaml principles (lines 6-10)
    quote: '- Documented with explicit loss (what information is discarded)'
  sa:
    concept: Result- and history-rewriting hooks (`after_tool_call_success`, `after_tool_call_failure`,
      `before_store_tool_result`, `before_create_message`, `filter_messages`, `prefilter_llm_history`)
    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-85), §3.2-§3.4 (lines 217-306),
      §4.1 (lines 310-322), §5.2 (lines 386-398), §5.3 (lines 400-412; quote at line 411), §8.7 (lines
      764-784, example)
    - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 161-163)
    - content/0.2.0/specification/threads/messages.md introductory Note (line 7)
    quote: '- If hook returns a result, it replaces the original'
  explanation: 'SA lets hooks rewrite what is stored (tool results, messages) and, separately, what the
    model sees (request context). It keeps no record that a rewrite happened or of the original value.
    ACS requires every transformation to be deterministic or to document what it discards, names a mapping
    file for a `transform` step (`mapping_ref`), states ''Never drop raw payload'' in its coercion registry,
    and requires a canonical event to keep `raw` (''Original unmodified data''). An SA rewriting hook
    corresponds to such a mapping. A redaction hook (hooks.md §8.7, an example) deliberately destroys
    the original. Ordering fixed by the text: child `before_parent` hooks, then the parent''s set, then
    child `after_parent` hooks; the order within one `hooks` array is not stated. messages.md line 7 calls
    `before_create_message` non-destructive, against hooks.md §4.1.'
  combined: 'Today: the rewriting hook''s rule set is named in the event''s `provenance.ruleset_id`, or
    the loss is recorded in a `ProvenanceRecord.transformations` entry (the canonical event''s `provenance`
    has no transformation list). Recording a redacted value as `raw` deviates from §6.2''s ''Original
    unmodified data'' until ACS decides otherwise (open question). For a digest of the original value
    the hook ships through `parentHooks` with `stage: ''before_parent''`; for the stored value, `after_parent`
    or the tool message in `after_create_message`. Stored history and request context differ by design,
    so an audit of what a decision was based on can also digest the final provider request in a `prefilter_llm_history`
    hook at `after_parent` (''The returned array **MUST** be the provider request history.'').'
  see_also:
  - tools-contracts#io-03
  - tools-contracts#io-06
  - published-api-extension-points#tools-04
  - safety-enforcement#hook-03
  - checkpoint-rollback-state#state-19
- id: events-01
  relation: partial
  acs:
    concept: Canonical event / observation (`event_id`, `timestamp`, `source`, `event_type`, `raw`, `canonical`,
      `anchors`, `provenance`)
    refs:
    - spec/STANDARD-v1.1.0.md §6.2 Observation Requirements (lines 1121-1143; quote at line 1133)
    - schemas/event_schema.yaml event (lines 69-170)
    quote: '| `timestamp` | string | Yes | ISO-8601 time of observation |'
  sa:
    concept: Thread events (`state.emit`) and the `event` stream frame; SA timestamp units
    refs:
    - content/0.2.0/specification/threads.md §5 Events (lines 324-348)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 9), §3.3 Timestamps (lines 65-73),
      §16.1 item 7 (line 442), §16.2 item 9 (line 455)
    - '@standardagents/spec 0.45.10 index.d.ts line 3115 (emit)'
    quote: 9. Delivery is at-most-once. The stream carries no history and no acknowledgements.
  explanation: 'Both are named, timestamped, JSON-carrying events, but they serve different ends. An ACS
    canonical event is a durable observation that must record its source, raw and normalised payload,
    anchors and provenance, and feeds world state. An SA thread event is a transient notification to whichever
    clients are connected: at most once, no history, no acknowledgement, ''Events **SHOULD NOT** contain
    sensitive information'', and nothing in threads.md §5 or client-api.md §16 says it is persisted. The
    durable SA counterpart of an ACS observation is a persisted message or a stored value, not an emitted
    event. Units differ: ACS timestamps are ISO-8601 strings; SA uses milliseconds on `event` frames,
    microseconds on messages and `ThreadStatus.since`, and seconds on thread list fields. The `event`
    frame is required only of runtimes that expose the Thread Client API, which is a SHOULD.'
  combined: 'Works today for live display only: after persisting a canonical event (store-01), code calls
    `state.emit(''acs_evidence_recorded'', { event_id, event_type, anchor_refs })`; clients receive `{
    type: ''event'', eventType: ''acs_evidence_recorded'', data, timestamp }` and fetch the full record
    from the packaged thread endpoint. The payload is kept to identifiers. The name follows threads.md
    §5.2 (lowercase with underscores). The stream is never the record.'
  see_also:
  - approval-human#event-01
- id: events-02
  relation: sa_only
  acs:
    concept: Real-time evidence events (roadmap items; not in the standard)
    refs:
    - spec/ROADMAP.md 'Runtime and ecosystem' (line 77), 'Under consideration' (line 101)
    quote: '- [Streaming events for real-time evidence collection](https://github.com/synaptiai/agent-capability-standard/issues/77)'
  sa:
    concept: 'Live tool and message stream: `tool_call_started` / `tool_call_done` hooks and thread events,
      `message_data`, `message_chunk`, `progressArgument`'
    refs:
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384), §5.5 tool_call_done
      (lines 430-444; quote at line 443)
    - content/0.2.0/specification/tools.md §7 Progress Reporting (lines 97-121)
    - content/0.2.0/specification/threads.md §5.1 Emitting Events (line 338)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 9), §16 Thread Stream (lines 415-420),
      §16.1 Server frames (lines 425-443), §16.2 Delivery (lines 445-462)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6297-6298, 6323-6325'
    quote: '- Runtimes **SHOULD** also broadcast a matching `tool_call_done` thread event to connected
      clients with `{ id, name, status }` at the same moment.'
  explanation: 'ACS 1.1.0 defines no streaming of evidence or tool progress; it is a roadmap item, with
    ''Runtime telemetry and observability hooks'' under consideration. SA specifies it: every message
    creation and update is pushed as a full `message_data` record (MUST, for runtimes that expose the
    Thread Client API), assistant content streams as `message_chunk`, and tool start and finish are hooks
    with SHOULD-level client events (the published type comments say ''Conforming runtimes also broadcast'');
    `progressArgument` lets a tool surface what it is about to do before its arguments finish streaming.
    Gap inside SA: the two tool-call thread events are named in hooks.md and tools.md, but the `ThreadStreamFrame`
    union has no member for them, so their wire shape is undefined (threads.md §5 suggests `event` frames;
    the text does not say). Searched: stream, progress (STANDARD-v1.1.0.md): not found.'
  combined: 'Works today without an extra channel on runtimes that expose the Thread Client API: a tool-result
    message is a persisted message, so its `message_data` frame already delivers anchors to clients when
    they are in `metadata.acs` or in the result content. Connections filter by `depth` (default 0) and
    `includeSilent`, so tool messages of nested prompts and silent messages are not delivered by default.
    Where a runtime sends them, `tool_call_done` thread events give a client the call id and status to
    key a ''sources consulted'' list.'
- id: events-03
  relation: sa_only
  acs:
    concept: No counterpart found
    refs:
    - 'spec/STANDARD-v1.1.0.md (searched for ''stream'': not found)'
    - schemas/event_schema.yaml types.Anchor.kind (lines 21-30); schemas/world_state_schema.yaml types.Anchor.kind
      (lines 71-79)
  sa:
    concept: 'Runtime streams (`ThreadState.runtimeStreams`): optional, live, opaque byte streams to an
      execution host'
    refs:
    - content/0.2.0/specification/threads/runtime-streams.md §2 Optional Capability (lines 43-51; quote
      at line 48), §3 Direction and Lifetime (lines 53-58), §5 Conformance (lines 115-122)
    - content/0.2.0/infrastructure/runtime.md §13 Runtime Streams (lines 245-250)
    quote: Capability names and metadata are opaque to this specification.
  explanation: 'Runtime streams are not an evidence or metadata channel. They are optional (''Existing
    runtimes may omit it and remain'' conformant), non-durable (''Streams are live, non-durable resources.''),
    carry opaque bytes, and the page says, in lowercase, that a runtime must not interpret the request
    `metadata` in a shared layer. ACS has nothing comparable. For grounding they matter only as a source:
    bytes read from a stream are an observation with no SA-provided identity, time or integrity. Searched:
    stream (STANDARD-v1.1.0.md): not found.'
  combined: 'A tool that reads from a runtime stream anchors what it read itself: an anchor of kind `sensor`
    (or `api`, a kind that exists in event_schema.yaml only) with its own timestamp and a digest of the
    bytes, recorded through the same evidence store as any other tool output. Nothing in the stream contract
    can carry or preserve ACS metadata.'
- id: inbound-01
  relation: partial
  acs:
    concept: Inbound items with provenance (`receive` output items carrying `sender` and `sender_identity`;
      an awaited event's `anchors`)
    refs:
    - schemas/capability_ontology.yaml receive.output_schema (lines 255-281; quote at line 268)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses', AwaitEvent row (line 90; informative guide)
    - spec/STANDARD-v1.1.0.md §5.17 Sender Identity (lines 1021-1061)
    quote: 'description: The host-authenticated principal that sent the item'
  sa:
    concept: 'Inbound messages: Thread Client API `SendMessageRequest`, `queueMessage`, `injectMessage`,
      thread endpoints'
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope (lines 11-12), §3.1 Authentication and
      access (line 46), §7 Listing Threads (line 209), §12 Sending a Message (lines 334-370; quote at
      line 368)
    - content/0.2.0/specification/threads/messages.md §3 Injecting Messages (lines 106-112), §4 Queueing
      Messages (lines 149-155)
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 89-105)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 99-100)
    - content/0.2.0/specification/agents.md §1.1 The Three Backings (line 19)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2101-2130 (InjectMessageInput, QueueMessageInput),
      5367-5371 (ThreadEndpointAuth)'
    quote: 7. The runtime **MUST** deliver the accepted message with the semantics of [`queueMessage`](/0.2.0/specification/threads/messages#4-queueing-messages).
  explanation: 'An ACS host hands the executor each inbound item with the authenticated principal and
    identity that delivered it and any anchors. SA''s portable inbound path is the message route, whose
    request body has `role`, `content` and `attachments` only: no metadata and no declared origin, and
    the caller chooses `role`, including `''assistant''` and `''system''` (the published `QueueMessageInput.role`
    admits only `''user''` and `''assistant''`). The route authenticates the caller, but the persisted
    message does not record who that was; the specification ''deliberately does **not** define who the
    person is or how their input arrives''. A message created by an at-rest operation runs only agent-level
    lifecycle hooks. In-process, the published types let `injectMessage` and `queueMessage` carry `metadata`;
    the text shows it once, in an `injectMessage` example, and defines neither input type. Searched: author,
    sender, caller (messages.md): no such field.'
  combined: 'Today: an external system that delivers observations calls a packaged thread endpoint (a
    file-based route such as `acs/observations.post.ts`) instead of the generic message route. The endpoint
    has `auth.caller` (MUST-level for `authenticated` endpoints), builds the ACS canonical event with
    `source`, `anchors` and `sender_identity`, stores it, and calls `state.queueMessage({ role: ''user'',
    content, metadata: { acs: { event_id } } })` (`metadata` here is in the published types only). The
    authentication mechanism is implementation-defined, so `authenticated_by` is an `x-` value or deployment
    configuration, and `trust_class` comes from configuration. Messages that arrive through the generic
    route get an anchor of `kind: ''human_note''` and no sender identity.'
  see_also:
  - approval-human#identity-01
  - workflow-execution#wf-30
  - multi-agent#coord-08
- id: provider-01
  relation: partial
  acs:
    concept: 'Evidence from search and retrieval (`search` and `retrieve` outputs with `evidence_anchors`;
      anchor `kind: url`)'
    refs:
    - schemas/capability_ontology.yaml node retrieve (lines 98-139; quote at line 135), node search (line
      140)
    quote: 'description: Source references'
  sa:
    concept: Provider-executed tools (web search, file search, code interpreter) and what is recorded
      of them
    refs:
    - content/0.2.0/specification/providers.md §6 Streaming (lines 377-392), §10.1 Overview (line 602),
      §10.3 Tool Definitions with Variables (lines 617-635)
    - content/0.2.0/specification/models.md `providerTools` (lines 34, 184, 473)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (lines 104-105)
    - '@standardagents/spec 0.45.10 index.d.ts lines 443 (executionMode), 1014-1021 (ProviderResponse.providerTools),
      1071-1088 (ProviderWebSearchResult), 1096-1139 (ProviderExecutedToolResult), 1172-1178 (stream chunks)'
    quote: Providers can embed built-in tools that leverage provider-specific capabilities. For example,
      OpenAI provides web search, file search, code interpreter, and image generation tools that execute
      server-side.
  explanation: 'A provider-executed web search is, in ACS terms, a `search` whose evidence is its list
    of sources. Spec text: provider tools run server-side; nothing says what the runtime records of them
    or whether any hook fires (tools.md §9 limits its sequential-execution MUST to ''local tools''). Published
    types: a provider can return `providerTools?: ProviderExecutedToolResult[]` (''Provider-executed tool
    calls surfaced for logging and inspection.''), with `sources` (`url`, `title`) under `result.actions`,
    and stream chunks `web-search-done` and `provider-tool-done`. None of these appears in the 0.2.0 text.
    No hook signature receives these results and no `Message` field is defined for them. Inference: evidence
    the model obtains through provider tools bypasses a hook-based grounding layer, and package code cannot
    tell that a given answer relied on one. Searched (content/0.2.0): providerTools (only the model definition''s
    `string[]`), web-search-done, provider-tool-done, ProviderExecutedToolResult: not found.'
  combined: 'Cannot be done portably in 0.2.0. A grounded agent that needs anchored web evidence uses
    a local function tool for search and retrieval (it fires `tool_call_done`, its result is a persisted
    message, and it returns its own `evidence_anchors`) and leaves the model definition''s `providerTools`
    empty. Otherwise the binding detects the case statically: when the active prompt''s model definition
    declares `providerTools` (`state.loadPrompt`, then `state.loadModel`), every answer of that prompt
    is marked as possibly resting on unanchored provider-side evidence.'
  see_also:
  - tools-contracts#cls-08
  - safety-enforcement#surface-01
  - approval-human#approval-15
  - models-context-memory-security#perceive-02
- id: exec-01
  relation: partial
  acs:
    concept: '`execute` output (`result`, `stdout`, `stderr`, `exit_code`, `evidence_anchors`)'
    refs:
    - schemas/capability_ontology.yaml execute.output_schema (lines 1076-1094; quote at line 1087)
    quote: 'description: Standard output'
  sa:
    concept: '`CodeExecutionResult` from `state.runCode` (`status`, `result`, `reports`, `logs`, `error`,
      `durationMs`)'
    refs:
    - content/0.2.0/specification/threads/code-execution.md §4 CodeExecutionResult (lines 254-276), §11
      Security Considerations (lines 552, 555; quote at line 555)
    quote: '- **Log redaction**. Captured `logs` may contain values derived from `globals`. Treat `logs`
      with the same confidentiality level as the most sensitive input passed into `globals` or `imports`.'
  explanation: 'Both describe the outcome of running code. ACS''s `execute` output has `result`, `stdout`,
    `stderr`, `exit_code` and required `evidence_anchors`. SA''s sandbox returns to the calling tool a
    structured `CodeExecutionResult`: an outcome status with five values, the selected export''s value,
    values emitted through the `report` bridge in call order, captured `console.*` logs, an error object
    and a wall-clock duration. It has no exit code and no stdout/stderr split (log entries carry a level
    instead), and no anchor or identifier for the run. The result is received in process by the tool that
    called `runCode`; nothing in the text says it is persisted or shown to hooks unless the tool returns
    it. The page warns that captured logs may contain values derived from sensitive inputs.'
  combined: 'Works today inside the tool that calls `state.runCode`: `status` maps to `exit_code` (0 for
    `success`, non-zero otherwise; a convention of this document), `logs` of level `error` and `warn`
    to `stderr` and the rest to `stdout`, and `result` to `result`. The tool builds the evidence bundle
    itself (a digest of the source it ran, `reports`, the duration), and the `tool_call_done` hook supplies
    the call id for the anchor `ref` (anchors-04). The redaction step of privacy-01 applies to `logs`
    before they enter an anchor excerpt or an audit record.'
  see_also:
  - tools-contracts#cls-10
  - tools-contracts#cls-15
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-18
- id: order-01
  relation: acs_only
  acs:
    concept: Ordering rules around audit and grounding (`verify` precedes `audit`; `soft_requires` edges
      into `ground`, warning W601)
    refs:
    - schemas/capability_ontology.yaml edge `verify` to `audit` (lines 1985-1988; quote at line 1988),
      `soft_requires` edges into `ground` (lines 1803-1839)
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 145-171)
    - spec/EDGE_TYPES.md
    quote: 'rationale: Verification results must be audited'
  sa:
    concept: No ordering constraint between tools found; tool calls execute sequentially in the order
      the model returned them
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44), §9 Conformance Notes
      (line 153)
    - content/0.2.0/specification/agents.md §4 Stop Semantics (lines 117-122)
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (line 382)
    quote: Tool calls **MUST** execute sequentially in the returned order.
  explanation: 'ACS constrains the order of capabilities statically: when a workflow has both, `verify`
    must run before `audit` (a `precedes` edge, V102), and `ground` is expected after at least one of
    `observe`, `detect`, `predict`, `attribute`, `explain`, `retrieve` or `search` (`soft_requires`, warning
    W601). The validator checks these against a declared workflow before anything runs. SA defines no
    workflow and no ordering constraint between tools: the model chooses the calls and the runtime executes
    them ''sequentially in the returned order''. The nearest SA constructs are `uses` (which targets a
    tool may invoke, not their order) and the stop-evaluation order of a side. Searched (content/0.2.0,
    examples page aside): prerequisite, depends on, dependenc, must run before, run before, precede: only
    tool and package dependencies and env precedence.'
  combined: 'Two routes today. Build time: the agent''s intended tool sequence is described as an ACS
    workflow and checked by the ACS validator in CI; this checks the design, not what the model does at
    run time. Run time: each ACS tool wrapper checks its own preconditions against the evidence store
    (for example, `audit` looks for a `verify` record in the current execution and `ground` for at least
    one observation anchor) and returns an error result or a warning field when they are missing. Hooks
    cannot enforce order: `tool_call_started`, the only tool hook that runs before execution, cannot modify
    the call.'
- id: privacy-01
  relation: partial
  acs:
    concept: 'Redaction of sensitive data in anchors and audit records: rules exist in skill instructions
      only (anchors may carry `excerpt`; the SDK anchor stores `tool_input`)'
    refs:
    - skills/audit/SKILL.md Procedure step 6 (line 92), Safety Constraints (line 314)
    - skills/perspective-validation/SKILL.md line 149; skills/persist/SKILL.md lines 362-363; skills/receive/SKILL.md
      line 346; skills/recall/SKILL.md line 297
    - schemas/event_schema.yaml types.Anchor.excerpt (lines 34-36)
    - grounded_agency/state/evidence_store.py metadata limits (lines 24-27), _sanitize_metadata (lines
      82-128), from_tool_output (lines 201-205)
    - spec/SECURITY.md lines 85, 294 (the two unrelated 'sensitive' hits)
    quote: '- Redact sensitive information (credentials, PII) from audit output'
  sa:
    concept: 'Redaction and disclosure rules: `envType` secret/text classification, sanitising results
      in `before_store_tool_result`, limits on events, hook logs, prompts and sandbox bridges'
    refs:
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (line 236), §5.2 Event
      Guidelines (line 348)
    - content/0.2.0/specification/hooks.md §1.2 (line 68), §4.2 (lines 334-335), §5.2 (lines 386-398),
      §8.7 (lines 764-784, example)
    - content/0.2.0/specification/prompts.md §2.1 String Prompts (line 50); content/0.2.0/specification/subagents.md
      §3.2 Immediate Spawning (lines 103-104)
    - content/0.2.0/specification/threads/code-execution.md §11 Security Considerations (lines 552, 555)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 11), §2 Routes (lines 18-32)
    - content/0.2.0/specification/users.md §6 Credential Grants (lines 199, 203; draft page)
    quote: Values marked `secret` should be redacted from tool output and logs; values marked `text` may
      be displayed.
  explanation: 'Anchors and audit records copy data out of tool calls into places with wider visibility:
    message metadata and files reach clients through message reads, `message_data` frames and the file
    route; events reach every connected client. SA has rules for this in the specification text: a per-variable
    secret/text classification that code can query, a hook position meant for sanitising results before
    storage, ''Events **SHOULD NOT** contain sensitive information'', and MUST-level rules for hooks (''Hooks
    **MUST NOT** expose sensitive data in logs or error messages.''), prompts, scoped env values and sandbox
    bridges. ACS has redaction rules in skill instructions (audit, persist, receive, recall, perspective-validation)
    but none in STANDARD-v1.1.0.md, SECURITY.md, the schemas or the SDK collector, which copies `tool_input`
    into anchor metadata (truncated above 1 KB, not redacted). Neither side enforces these rules for anchors.
    Searched (STANDARD-v1.1.0.md, SECURITY.md, event and world-state schemas, evidence_store.py; then
    skills/): redact, sensitive, PII.'
  combined: 'Today: the stored value is observed in `after_create_message` for the `role: ''tool''` message,
    which sees the content after every rewriting hook, and anchors are built from that. Argument values
    are not copied into anchors unless the tool''s capability mapping marks them safe. The value of a
    variable for which `await state.envType(name)` returns ''secret'' is never included; a hook cannot
    read a tool''s `variables` declaration, so the names come from a configured list. Full records stay
    in the key-value store and only `ref`, `kind` and `timestamp` go into `metadata.acs`. The specified
    client API has no route for stored values, but a runtime MAY add routes and another package''s endpoint
    on the same thread can expose them.'
  see_also:
  - tools-contracts#var-01
  - models-context-memory-security#secrets-01
- id: entity-01
  relation: acs_only
  acs:
    concept: 'Identity resolution policy for world-state entities (§7): hierarchical entity ids, alias
      matching by weighted feature scoring, and merge and split rules with hard constraints; with the
      entity taxonomy, two of the five required canonical schema files of §6.1'
    refs:
    - 'spec/STANDARD-v1.1.0.md §7 Identity Resolution Policy (lines 1174-1203): §7.1 Entity Identification
      (lines 1176-1182), §7.2 Alias Confidence Scoring (lines 1184-1193; quote at line 1186), §7.3 Merge/Split
      Rules (lines 1195-1203)'
    - spec/STANDARD-v1.1.0.md status header (lines 6-8), §1 Scope, item 5 (line 22), §6.1 Required Schema
      Files (lines 1113 and 1115)
    - schemas/identity_resolution_policy.yaml alias_confidence_scoring (lines 15-53), merge_rules (lines
      54-68), split_rules (lines 69-81)
    - schemas/entity_taxonomy.yaml id_convention (lines 12-13)
    - schemas/workflow_catalog.yaml header comment (line 18), `integrate` step purpose (line 588)
    - skills/integrate/SKILL.md step 3, 'Resolve entity identity' (lines 56-59)
    quote: 'Alias matching MUST use weighted feature scoring:'
  sa:
    concept: 'None. SA 0.2.0 defines no entity records. The section''s words mean other things there:
      ''identity'' is the user a request resolves to (Draft Users page), an ''alias'' is a second relationship
      name for one child agent, and a ''namespace'' is a package''s definition scope or the TypeScript
      `StandardAgentSpec` namespace'
    refs:
    - content/0.2.0 (whole tree), src/data, README.md and @standardagents/spec 0.45.10 index.d.ts searched;
      terms in the explanation
    - content/0.2.0/specification/users.md status banner (line 3), §1 Identity (lines 7-25; quote at line
      9); Draft
    - content/0.2.0/specification/subagents.md §2.3 Aliases (lines 60-74)
    - content/0.2.0/distribution/packaging.md 'Namespace Isolation' (lines 217-219), 'Qualified Names'
      (lines 232-236)
    - content/0.2.0/specification/type-registry.md §1.1 Overview (lines 7-9)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 Runtime Semantics, items 1 and 4 (lines 350 and 353)
    quote: A runtime MUST resolve every authenticated request to a stable user id.
  explanation: 'ACS §7 governs records about things in the modelled world: an entity id has the form `namespace:type:id`,
    alias matching uses weighted feature scoring, and a merge must not join conflicting unique identifiers
    or incompatible types and is always recorded in lineage. SA 0.2.0 has no entity records, so nothing
    corresponds. Its user identity maps to ACS §5.17 (models-context-memory-security#identity-01), not
    to §7; its aliases are relationship names; its namespaces scope definitions. The Standard''s status
    header says the reference validator and executor do not check §7. Searched (content/0.2.0, src/data,
    README.md, index.d.ts): entity, entities, identity resolution, dedup, fuzzy, lineage (no match); alias,
    merge, split, taxonomy, canonical (unrelated uses).'
  combined: 'Identity resolution stays in package code. Entities are part of the world-state snapshot
    that checkpoint-rollback-state#state-14 keeps in thread storage; of that storage SA requires of every
    runtime that key-value entries persist and round-trip as JSON. The work belongs to a function tool
    classified `integrate` (the ACS catalog composes identity resolution as `detect`, `classify`, `integrate`):
    it applies identity_resolution_policy.yaml, compiled into the package as a constant (packaging-conformance-governance#pkg-06),
    refuses a merge the hard constraints forbid, and records each merge or split in the snapshot''s lineage
    and as an action record. ACS writes the id form two ways (`namespace:type:id` in §7.1, `<class>:<namespace>/<local_id>`
    in entity_taxonomy.yaml); the package states which it uses. SA user ids, relationship names and qualified
    names are not entity ids.'
