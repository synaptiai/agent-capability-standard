    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-100), §2.4 Execution Provenance
      (lines 171-196)
    - content/0.2.0/specification/prompts.md §8 Hook Scoping (lines 270-273; quote at line 272)
    - content/0.2.0/specification/agents.md §2.2 Optional (lines 89-93), §6 Required Parent Hooks (lines
      132-167)
    - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 147-163)
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 221-230)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (lines 22-26)
    - '@standardagents/spec 0.45.10 index.d.ts line 6477 (`DEFINITION_ISSUE_CODES` includes `agent_tool_description_missing`;
      the check is in the package''s index.js, lines 631-637)'
    quote: '- When `hooks` is non-empty, only those hooks form the prompt base set'
  explanation: 'In the ACS integrations capture is installed once for the whole session. In SA no hook
    is global: a prompt''s non-empty `hooks` array replaces the agent''s list, which is only a fallback,
    and ''At-rest operations have no active prompt.'', so they use the agent-level list alone. A hook
    inside an installed package cannot be listed by a host prompt (''**Global code** sees unpacked definitions
    and packed entry agents''). The mechanism that reaches every prompt on both sides is `parentHooks`:
    a composed child''s required hooks run against the parent, and composition MUST fail closed when one
    cannot load. It covers direct parents only, is composed ''For each active prompt'' (nothing says it
    applies at rest or in handler turns), and carries a package signature only for packed children. Inference:
    after a handoff, hooks resolve from the new agent.'
  combined: 'Works today, two ways. (a) Same namespace only: the capture hooks are listed in every prompt''s
    `hooks`, in every prompt used as a tool, and in the agent''s `hooks` (for at-rest operations), and
    a build step checks this. (b) Across packages: the hooks ship with an entry agent that has `exposeAsTool:
    true`, a `toolDescription` (the published validator reports `agent_tool_description_missing` without
    one) and `parentHooks`, declared as a `hidden: true` relationship on each agent to be covered. This
    is MUST-level for every prompt on either side and for fail-closed loading, never transitive, not provided
    for at-rest operations (hooks.md §1.3 names only the agent-level array there) and unspecified for
    handler turns. The declaration is the audited agent author''s choice, and composition UIs MUST disclose
    the hook id, reason and stage.'
