    quote: The step's output is the delegation's output with the matching event as
  sa:
    concept: Child to parent result delivery (completion message, copied attachments, `stopSession`) and
      key-value isolation
    refs:
    - 'content/0.2.0/specification/subagents.md §3.3 Blocking and Create-or-Continue (line 108), §5.1
      Persistent Invocation Arguments (lines 173-174), §6.2 Child → Parent: Completion and Failure (lines
      195-205), §6.4 (lines 211-219), §7 Attachment Copying (lines 230-237)'
    - content/0.2.0/infrastructure/runtime.md §7.1 (lines 117-120), §8.2 Child -> Parent (lines 199-211),
      §8.3 Status Updates (line 217), '14. Durable Key-Value Store' §14.1 items 3 and 8 (lines 352, 357;
      quote at line 352)
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 109-113)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (lines 94-95, 98)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2659-2672 (StopSessionOptions)'
    quote: Each thread **MUST** maintain its own isolated key space. Values **MUST NOT** be readable by
      any other thread, including parent, child, or sibling threads.
  explanation: In ACS a delegated result arrives as a structured event. For `receive` and `synchronize`
    waits the reference executor copies the event's `anchors` into `evidence_anchors`; for a waiting `delegate`
    the event, anchors included, is delivered as `result`. The Python SDK also has a `CrossAgentEvidenceBridge`
    that shares anchors with a trust decay. In SA a child's result reaches the parent as a queued silent
    message (a fixed sentence plus the result text, shown without a normative keyword; runtime.md says
    the content 'should include subagent reference and result summary'), or as the `subagent_create` result
    when the relationship is `blocking`. Only attachment copying is a MUST. On a prompt-backed child the
    `messageProperty` value is a model-written tool argument. Message metadata of the child's own messages
    is not said to travel, and the child's key-value store is isolated by MUST, although subagents.md
    §6.4 suggests delivery through 'the parent's key-value store'.
  combined: 'Code, not the model, should author the result. A child-side tool builds the payload from
    the child''s evidence store, writes the bundle as a file and calls `state.stopSession({ result, notifyParent
    })` (runtime.md §8.3: implementations ''should treat this as a successful terminal child run''), or
    the parent pulls the bundle through `state.getChildThread(reference)` with a `reference` from `state.children`.
    If a `sessionStop` binding is used, its text is an untrusted pointer and anchors are read only from
    the copied bundle file, the MUST-level channel. From parent to child, the validated `arguments` object
    is carried by MUST. Every imported anchor is qualified with the child `reference` and re-based on
    destination-local paths. Reading or writing another thread''s stored values through a `ThreadState`
    handle is not relied on until SA settles whether it is permitted.'
