  sa:
    concept: No counterpart found; the only statements about untrusted input concern prompt injection
    refs:
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 231-234)
    - content/0.2.0/specification/users.md §1 'Application roles' (line 30), §2.3 Environment (line 104);
      draft page
    - content/0.2.0/specification/prompts.md §2.1 String Prompts (line 50)
    - content/0.2.0/specification/hooks.md §3.3 prefilter_llm_history (line 271)
    - content/0.2.0/specification/handlers.md §1 (line 28); content/0.2.0/specification/threads/decisions.md
      §4.1 (line 156)
    - content/0.2.0/specification/threads/client-api.md §3.3 Timestamps (line 71), §16.2 (line 457)
    quote: Implementations **MUST** sanitize prompt content that incorporates untrusted input to prevent
      injection.
  explanation: 'Not found in SA 0.2.0: any notion of source authority, evidence weight, recency decay
    or conflict resolution between sources. Hits, none about source authority: ''trust boundary'' for
    `instanceEnv` (threads.md §2.3, users.md §2.3); the ''trusted identity authority'' that supplies user
    roles; ''handlers are trusted definition code''; untrusted code in the sandbox; an ''Authoritative
    run status'' and an ''authoritative'' `message_data` frame; ''probability-weighted'' (decisions);
    unrelated ''stale'' and ''freshness''. SA''s only rules about untrusted content are prompts.md line
    50 and hooks.md line 271, both about prompt injection. SA does supply inputs the ACS formula needs:
    a creation time on every message, an origin (prompt, child reference, user) and places to keep per-source
    weights. Searched (content/0.2.0, examples page aside, and index.d.ts): trust, authorit, weight, decay,
    conflict, reliab, recency, stale, freshness; no hits for decay, conflict, reliab, recency.'
  combined: 'Works today entirely in package code: `integrate` and conflict resolution are function tools
    that read anchors from the evidence store, compute age from `Message.created_at` (microseconds, converted
    to the ISO-8601 the ACS schemas use), take `trust_weight` from the ACS domain profile shipped with
    the package and apply `max(0.5 ** (age/half_life), min_trust)`. Where an item has both a trust class
    and a source type, the lower of the two weights applies (STANDARD §8.3). The class weight rests on
    prov-03''s classification, which SA does not attest, and the tools run only when the model calls them.
    SA neither helps nor hinders.'
