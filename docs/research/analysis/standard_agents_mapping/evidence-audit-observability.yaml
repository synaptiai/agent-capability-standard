    quote: '| `tool_status` | `''success'' \| ''error'' \| null` | Outcome of the tool call (for results)
      |'
  explanation: 'ACS already has a schema-defined record of an action: `ActionRecord`, required of world
    state by §6.3, with a status enum (`planned`, `approved`, `rejected`, `expired`, `executed`, `failed`,
    `rolled_back`), an optional approval digest, `actor_identity` and an `anchors` list. The reference
    executor produces these records only ''for every step that required'' approval, so they are not a
    full action log. SA has no action record, but each completed tool call leaves the fields one needs:
    the call id, the tool name, a success or error status and a time on the persisted tool-result message,
    and the arguments in `tool_call_done`. SA has no counterpart for `intent`, `approval`, `plan_ref`
    or `rolled_back`; ACS has no slot for thread, execution or step identifiers, which fit only in `action_id`
    or in anchors.'
  combined: 'Works today with no change to either standard: the guard wrapper writes the `ActionRecord`
    of a grounded call, before the effect and again after it (published-api-extension-points#hooks-02),
    and for calls no wrapper sees the hooks of collect-01 emit a best-effort `ActionRecord` per tool call,
    with `action_id` built from the thread id and `tool_call_id`, `timestamp` converted from the message''s
    microsecond `created_at`, `status` `executed` or `failed` from `tool_status`, `actor` and `actor_identity`
    from the binding''s own configuration (SA attests no actor identity), `intent` from the tool-to-capability
    mapping, and `anchors` pointing at the tool-result message. Records go to the store of store-01. The
    `approval` member is filled only where the tool itself ran an approval step.'
