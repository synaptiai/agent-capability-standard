# Evidence, provenance, audit and observability
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: evidence-audit-observability
title: Evidence, provenance, audit and observability
changes_in_1_2_0:
- row: anchors-01
  sections: '§4.1.1, §6.5'
  effect: 'Every output contract declares the common output fields, and `evidence_anchors` items are
    anchors of one defined type.'
- row: anchors-02
  sections: '§6.5'
  effect: 'One `Anchor` type with `digest`, the kind `record` and vendor kinds is shared by outputs,
    events and records.'
- row: anchors-03
  sections: '§6.6'
  effect: 'Evidence records and stores are specified: what a store keeps and states.'
- row: anchors-04
  sections: '§6.5'
  effect: 'The `acs:` ref scheme is defined.'
- row: collect-01
  sections: '§6.6, §5.20'
  effect: 'Evidence stores are specified, and with `grounding@1` a host reports the evidence a producer
    saw (`evidence_seen`).'
- row: collect-02
  sections: '§6.4, §6.7'
  effect: 'Action records carry `tool`, `call_id` and `details`, and secrets are replaced before anything
    is recorded.'
- row: collect-03
  sections: '§6.4'
  effect: 'Capture is required or best effort as declared, and a capture failure is never silent.'
- row: store-01
  sections: '§6.6'
  effect: 'What an evidence store keeps and states is specified, with the optional `acs.evidence_recorded`
    notification.'
- row: audit-01
  sections: '§6.4'
  effect: '`audit` records its event in a record of its own, with `require_record` and the output `record`
    (ontology 2.2.0).'
- row: audit-02
  sections: '§6.4, §4.4.1'
  effect: 'Action records carry `prev_hmac` and `hmac`, and a rollback never restores records.'
- row: retention-01
  sections: '§6.3'
  effect: '`retention_policy` applies to the store the records are written to, and `audit.retention` is a
    duration (W614 otherwise).'
- row: audit-03
  sections: '§6.4, §5.19.8'
  effect: 'The record mode `actions` and the run record every host keeps are specified.'
- row: audit-04
  sections: '§8.4, §6.4'
  effect: 'Manual trust overrides are specified, and `require_record` makes a step depend on its record.'
- row: action-01
  sections: '§6.4'
  effect: '`ActionRecord` gains `run_id`, `frame`, `step`, `capability`, `tool`, `call_id`,
    `checkpoint_id`, `code`, `reason_code`, `details`, `recorded_by`, `prev_hmac`, `hmac` and the status
    `cancelled`.'
- row: prov-01
  sections: '§6.5'
  effect: 'Anchors in provenance are the shared `Anchor` type.'
- row: prov-03
  sections: '§8.1, §8.3'
  effect: 'The trust score is defined by a formula, and evidence without a static weight has no score.'
- row: prov-04
  sections: '§5.20'
  effect: 'With `grounding@1`, an `invoke` step carries its nested run''s anchors.'
- row: trust-01
  sections: '§8.1, §8.2, §8.4'
  effect: 'The trust score is `weight × confidence × decay`, the conflict strategies are defined with a
    default, and manual overrides are specified.'
- row: trust-02
  sections: '§4.1.1'
  effect: '`confidence` is defined, and events and the world state share one `Uncertainty`.'
- row: trust-03
  sections: '§3.1, §5.20'
  effect: 'Grounding is defined, and F505 is raised under `grounding@1` and can fire a failure mode.'
- row: policy-01
  sections: '§5.21.3'
  effect: 'An applied profile tightens evidence and confidence requirements.'
- row: transform-01
  sections: '§6.2, §6.7'
  effect: 'A canonical event''s `raw` is unmodified except that each secret is replaced.'
- row: events-01
  sections: '§6.2, §6.5'
  effect: '`raw` has secrets replaced, events may record `redactions`, and anchors are the shared type.'
- row: events-02
  sections: '§6.6'
  effect: 'The optional `acs.evidence_recorded` notification is a defined evidence event.'
- row: provider-01
  sections: '§6.5'
  effect: 'Anchor kinds are defined, with vendor kinds.'
- row: privacy-01
  sections: '§6.7'
  effect: 'Rules on secrets are normative: redaction, its marker, and secrets never in evidence, records,
    diagnostics, traces or persisted memory.'
- row: entity-01
  sections: '§7.1'
  effect: 'Entity ids take the taxonomy''s form `<class>:<namespace>/<local_id>`.'
rows:
- id: anchors-01
  relation: acs_only
  acs:
    concept: 'Capability output contract: `evidence_anchors` (required on all 36 capabilities) and `confidence`
      (required on 23 of them)'
    refs:
    - schemas/capability_ontology.yaml meta.principles (line 13); nodes[*].output_schema.required (36
      of 36 list `evidence_anchors`, 23 list `confidence`, none gives `evidence_anchors` an `items` schema)
    - templates/SKILL_TEMPLATE_ENHANCED.md Output Contract field table (line 75)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 118-120; informative guide)
    - core/src/exec/machine.rs fn output (lines 1399-1408)
    quote: Every capability returns evidence anchors and confidence
  sa:
    concept: 'Function tool result: `ToolResult` / `HookToolResult` (`status`, one `result` string, `error`,
      `stack`, `attachments`)'
    refs:
    - content/0.2.0/specification/hooks.md §5.2 before_store_tool_result (lines 386-398; quote at line
      397, a 'Use cases' bullet), §6.3 HookToolResult (lines 478-490)
    - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 15-34), §9 Conformance Notes
      (lines 148-156)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (line 120), §6.2 Per-Execution Context (lines
      372-392)
    - content/0.2.0/specification/threads/runtime-streams.md §4 Neutral Example (line 82; `error_code`
      used in an example)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult), 5967-5984 (HookToolResult)'
    quote: '- Add metadata to tool results'
  explanation: 'Spec text: a function tool returns a status, one `result` string and optional file `attachments`;
    hooks.md §6.3 lists exactly `status`, `result`, `error`, `stack`, `attachments`. §5.2 names ''Add
    metadata to tool results'' in a non-normative use-case list, but no result type has a metadata member.
    The 0.2.0 text uses the name `ToolResult` without defining it. Published types: `ToolResult` adds
    `error_code` and `error_data` (the text uses `error_code` once, undefined, in an example); `HookToolResult`
    has neither, and `metadata` is a compile error on both. ACS: every ontology node requires `evidence_anchors`,
    typed as a bare `array`. SA validates tool arguments, not results. Inference: on the result object
    an ACS output crosses an SA tool boundary only as text in `result`. Searched: metadata (hooks.md §6.3:
    not found), interface ToolResult (content/0.2.0: not found).'
  combined: 'Works today as a transport convention: the tool returns `{ status: ''success'', result: JSON.stringify(output)
    }`. No ACS executor runs in TypeScript (the reference executor is a Rust core with a Python binding),
    and its own check is key presence only, so the wrapper that defines the tool checks the capability''s
    required output keys itself and returns `status: ''error''` otherwise. Anchors can stay out of model-visible
    text by (a) `state.setValue` inside `execute` plus a short handle in `result`, or (b) a `before_create_message`
    hook that moves them from the tool message''s `content` to `metadata.acs`; (b) fails open when the
    hook throws. Unavailable: a metadata member on the tool result object.'
  see_also:
  - tools-contracts#io-03
  - tools-contracts#io-05
- id: anchors-02
  relation: partial
  acs:
    concept: 'Evidence anchors attached to a stored claim or observation (`Anchor`: `ref`, `kind`, `timestamp`,
      `excerpt`; `ProvenanceRecord.anchors`)'
    refs:
    - schemas/event_schema.yaml types.Anchor (lines 13-36)
    - schemas/world_state_schema.yaml types.Anchor (lines 62-85), types.ProvenanceRecord (lines 151-188)
    - spec/STANDARD-v1.1.0.md §6.2 Observation Requirements (lines 1121-1139; quote at line 1138)
    quote: '| `anchors` | array | Yes | Links to original evidence |'
  sa:
    concept: '`Message.metadata`, settable through `before_create_message`, `injectMessage` and `updateMessage`
      (and, in the published types only, `queueMessage`)'
    refs:
    - content/0.2.0/specification/threads/messages.md introductory Note (line 7), §1 Message Structure
      (line 29), §3 Injecting Messages (line 111), §5 Updating Messages (line 176)
    - content/0.2.0/specification/hooks.md §4.1 before_create_message (lines 310-322), §6.1 HookMessage
      (lines 448-463), §8.6 (lines 743-762, example)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 154)
    - content/0.2.0/specification/handlers.md §1 Handler Definition (line 28)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 9), §11 Reading Messages (line
      325), §16.1 Server frames (line 438)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2027-2042 (Message.metadata), 2101-2139 (InjectMessageInput,
      QueueMessageInput, MessageUpdates), 5947 (`type HookMessage = Message;`)'
    quote: '| `metadata` | `Record<string, unknown>` | Custom metadata (may include runtime status markers
      such as `status_kind`) |'
  explanation: 'Spec text: every message record has a free-form `metadata` object, and for `before_create_message`
    ''The returned object **MUST** be used for insertion''. With tools.md §9 (''persist tool results as
    messages before advancing'') this covers tool-result messages (inference). A `message_data` frame
    carries every member a message read returns, and handlers receive the full message including metadata.
    Not found: how `updateMessage` combines metadata (only the published types say ''merged with existing'');
    which keys the runtime reserves (it writes `status_kind`, `subagent_id`, `forwarded_from`; the types
    add `queued`, `subagent_event`); whether metadata is sent to a model. Inconsistencies: the Note at
    messages.md line 7 calls `before_create_message` non-destructive; hooks.md §6.1 omits `metadata` from
    `HookMessage`; the §8.6 example does not compile. Client visibility depends on the Thread Client API,
    a SHOULD. Searched: metadata (every hit in content/0.2.0), merge.'
  combined: 'Works today as a display copy of the evidence, not as the system of record. A `before_create_message`
    hook, for `role: ''tool''` messages, takes the anchors from the message itself (it parses `message.content`,
    the ACS tool''s own result) and returns `{ ...message, metadata: { ...message.metadata, acs: { capability,
    evidence_anchors, confidence } } }`. The spread is required: the published `metadata` is optional
    and the runtime writes its own keys there. Code paths use `state.injectMessage({ ..., metadata })`
    or `state.updateMessage(id, { metadata })`. For assistant messages the hook writes only what it can
    know (anchor ids recorded so far), not a grounding verdict. Not guaranteed: merge behaviour on update,
    survival against other hooks or `deleteMessage`, and insertion of the annotated message when the hook
    throws (audit-04).'
  see_also:
  - tools-contracts#io-09
  - published-api-extension-points#drift-02
  - published-api-extension-points#hooks-03
  - checkpoint-rollback-state#state-26
  - models-context-memory-security#context-04
- id: anchors-03
  relation: fits
  acs:
    concept: 'Evidence payload behind an anchor of `kind: file`, including evidence that must travel with
      a delegated result'
    refs:
    - schemas/world_state_schema.yaml types.Anchor (lines 62-85; quote at line 70)
    - schemas/event_schema.yaml types.Anchor (lines 13-36)
    quote: 'description: Pointer like file:line, URL, tool-output-id'
  sa:
    concept: Tool and message `attachments` (`ToolAttachment`, `AttachmentRef`) and files in the thread
      file system
    refs:
    - content/0.2.0/specification/hooks.md §6.3 HookToolResult (lines 478-490)
    - content/0.2.0/specification/threads/messages.md §1.2 Attachment References (lines 51-67)
    - content/0.2.0/specification/threads/filesystem.md introduction (line 3), §1 File Record (lines 7-21),
      §2 Writing Files (lines 23-40), §5 Moving and Renaming (line 78), §9.4 Behavior (line 178)
    - content/0.2.0/specification/subagents.md §5.1 Persistent Invocation Arguments (lines 173-174), §7
      Attachment Copying (lines 230-237)
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 109-111)
    - content/0.2.0/specification/threads/client-api.md §14 Reading a File (lines 383-395)
    - 'content/0.2.0/getting-started/examples.md line 1092 (`id: file.path`; non-normative)'
    - '@standardagents/spec 0.45.10 index.d.ts lines 188-207 (AttachmentRef), 246 (ToolResult.attachments
      comment), 2253-2287 (FileRecord, WriteFileOptions), 3261 (writeFile)'
    quote: The destination thread **MUST** receive destination-local attachment paths.
  explanation: 'SA gives files a client-readable home, and attachments are the only structured payload
    the text requires a runtime to carry from child to parent (subagents.md §7; from parent to child the
    validated `arguments` object is also carried by MUST). ACS says only that an anchor `ref` is a pointer.
    The two fit: SA stores the bytes, the anchor points at them. Limits: `AttachmentRef` has no digest
    or source-URL member; it requires an `id` that `FileRecord` lacks, and the text gives no rule for
    it (the examples page writes `id: file.path`); a path changes when a file is copied to another thread,
    moved or renamed; filesystem.md states no persistence requirement (its one MUST is chunk ordering).
    Searched (content/0.2.0): hash, checksum, sha256, digest, integrity (only the effect name `send_digest`).'
  combined: 'Works today. A tool writes its evidence bundle with `state.writeFile(''/acs/evidence/<id>.json'',
    data, ''application/json'')` to a path the package controls and anchors on it: `{ ref: ''file:'' +
    path, kind: ''file'' }`. An attachment is needed only to cross a thread boundary or to show the file;
    an `AttachmentRef` then follows the examples page (`id: file.path`), which is an example, not a rule.
    For a child agent the `attachmentsProperty` of `sessionStop` names a tool argument, so on a prompt-backed
    side the model chooses the path; only the copy is a MUST. The parent reads anchors from the copied
    bundle file, never from model-typed text, and treats the bundle as unverified unless a digest kept
    outside the child matches. A digest is computed in tool code: SA has no field for it.'
- id: anchors-04
  relation: fits
  acs:
    concept: Anchor reference convention (`ref` strings such as `tool:<name>:<tool_use_id>` and `file:<path>`)
    refs:
    - grounded_agency/state/evidence_store.py EvidenceAnchor.from_tool_output (lines 177-206; quote at
      line 198), from_file (lines 208-235), kind priorities (lines 140-143)
    - docs/integrations/claude_agent_sdk.md 'Evidence Format' (lines 364-371)
    - templates/SKILL_TEMPLATE_ENHANCED.md Output Contract (line 65)
    - schemas/event_schema.yaml types.Anchor.kind (lines 21-30), event.source.kind (lines 94-102)
    - grounded_agency/coordination/delegation.py line 146 (anchor kind `coordination`)
    quote: ref=f"tool:{tool_name}:{tool_use_id}",
  sa:
    concept: 'Identifiers available to package code: `HookToolCall.id` / `Message.tool_call_id`, `Message.id`,
      `ThreadState.threadId`, `execution.flowId`, file `path`'
    refs:
    - content/0.2.0/specification/hooks.md §6.2 HookToolCall (lines 465-476)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 13, 17, 18)
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (lines 19-32; quote
      at line 23)
    - content/0.2.0/specification/threads.md §1.2.1 Properties (line 40)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2578-2622 (ExecutionState), 5951-5963 (HookToolCall)'
    quote: '| `flowId` | `string` | Unique execution ID |'
  explanation: 'ACS''s reference implementation names a tool-output anchor by tool name and call id; SA
    gives every tool hook those two values (`toolCall.function.name`, `toolCall.id`) and stores the call
    id on the result message (`tool_call_id`). SA adds thread, execution (`flowId`) and step identifiers
    that ACS has no slot for. SA: a tool''s `execute(state, args)` is not handed its call id; it can sometimes
    derive it from the persisted assistant message''s `tool_calls` (runtime.md §3 persists that message
    before tools run), while a hook always has it. The uniqueness scope of message ids and call ids is
    not stated. ACS: no thread-qualified reference form; `Anchor.kind` has no value for a message or an
    agent report (agent and human origins exist only on `event.source.kind`); the Python kinds (`tool_output`,
    `file`, `command`, `mutation`, `coordination`) differ from the schema enum. Searched: tool_call_id,
    toolCall (tools.md, execution-state.md: not found).'
  combined: 'Works today by convention: `ref: ''tool:'' + toolCall.function.name + '':'' + toolCall.id`
    (the existing ACS form), `kind: ''tool''`, always stored with `state.threadId`, because call ids are
    provider-assigned with no stated uniqueness scope, plus `state.execution?.flowId` and `stepCount`.
    `tool_call_done` is not given the result message id; it comes from `after_create_message` for the
    `role: ''tool''` message with the same `tool_call_id`, so a reader can resolve the anchor through
    `GET {runtime_prefix}/threads/{threadId}/messages`. A portable thread-qualified scheme has to be defined
    by ACS (see ACS gaps).'
- id: collect-01
  relation: partial
  acs:
    concept: Evidence collection after each tool execution (SDK `PostToolUse` hook `create_evidence_collector`)
    refs:
    - grounded_agency/hooks/evidence_collector.py create_evidence_collector (lines 22-127; quote at line
      27; except branch at lines 120-122)
    - docs/integrations/claude_agent_sdk.md 'PreToolUse Hook Enforcement', PostToolUse bullet (line 273)
    quote: Create a PostToolUse hook that collects evidence anchors.
  sa:
    concept: '`after_create_message` on the tool-result message (the stored result) and `tool_call_done`
      (observational, once per call)'
    refs:
    - content/0.2.0/specification/hooks.md §4.2 after_create_message (lines 324-336), §5.5 tool_call_done
      (lines 430-444; quote at line 440)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 154-155)
    - content/0.2.0/infrastructure/runtime.md '14. Durable Key-Value Store' §14.2 Capacity and Errors
      (line 362)
    quote: Implementations **MUST** call this hook once per tool call, whether it succeeded or failed.
  explanation: 'The observation point matches closely: both run after the tool, receive the call id, tool
    name, arguments and result, and are observational (ACS code comment: ''Fail silently - evidence collection
    is observational'', followed by a warning log; SA: ''The return value **MUST** be ignored; the hook
    cannot modify the result.''). Among the tool hooks, hooks.md states a MUST to invoke only for `tool_call_done`
    and `tool_call_started`. A second, MUST-backed view exists: tool results are persisted as messages
    (tools.md §9) and `after_create_message` runs ''after successful insertion'', so the tool-result message
    shows what was stored after every rewriting hook, with `tool_call_id` and the message id (inference:
    no sentence names tool-result messages). Differences: the ACS collector is SDK reference code, not
    a normative part of the standard; it receives parsed input, the SA hook JSON strings. Rated partial
    because of the open points in collect-02.'
  combined: 'Works today. Primary record: `defineHook({ hook: ''after_create_message'', id: ''acs_record_tool_result'',
    ... })` acting on `role: ''tool''` messages, which sees the stored content. Supplement: `defineHook({
    hook: ''tool_call_done'', id: ''acs_collect_evidence'', execute: async (state, toolCall, toolResult,
    context) => { ... } })`, which adds the arguments and fires for failures. Both append to the store
    of store-01; both signatures, with a `state.setValue` call inside, type-check against @standardagents/spec
    0.45.10. They run only when they are in the resolved hook set for the active prompt (collect-03).
    A hook that fails or times out is silent, and so is a `setValue` rejected for a capacity cap.'
  see_also:
  - published-api-extension-points#hooks-02
  - safety-enforcement#flags-02
  - safety-enforcement#hook-01
  - safety-enforcement#hook-02
  - models-context-memory-security#security-02
- id: collect-02
  relation: partial
  acs:
    concept: Recording the inputs and outcome a tool actually ran with (anchor metadata `tool_name`, `tool_input`,
      `has_response`; approval bound to a digest of what was shown)
    refs:
    - grounded_agency/state/evidence_store.py from_tool_output (lines 177-206; quote at line 204)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Approvals (lines 149-166; informative
      guide)
    quote: '"has_response": tool_response is not None,'
  sa:
    concept: What each tool hook is given (`HookToolCall.function.arguments`, `HookToolResult`), in what
      order, and for which calls
    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-85), §4.1 (lines 320-321), §5.1
      tool_call_started (lines 367-384; quote at line 378), §5.2-§5.5 (lines 386-444)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 148-156)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §5.3 Tool Classes (lines 94-100)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 17)
    - content/0.2.0/getting-started/examples.md line 547 (non-normative)
    quote: Its name is known, but `toolCall.function.arguments` **MAY** be an incomplete JSON fragment
      (or empty), and `progress` is `undefined`.
  explanation: 'Spec text settles three things: `tool_call_started` may see incomplete arguments and cannot
    change the call; tool arguments are validated against the declared schema; results are persisted as
    messages before the loop advances. No tool hook runs between validation and `execute`. For model-initiated
    calls a message lifecycle hook on the assistant message can record the model-emitted arguments beforehand
    (inference from runtime.md §3, hooks.md §4.1 and messages.md §1). Left open: (1) whether `function.arguments`
    in post-execution hooks is complete, and model text or validated value; (2) the order of the post-execution
    tool hooks and the tool message''s lifecycle hooks; (3) which result `tool_call_done` receives; (4)
    which calls fire tool hooks: prompt tools, handoff tools, lifecycle tools, `invokeTool` / `queueTool`,
    provider-executed tools. Searched (hooks.md): invokeTool, queueTool: not found; provider: only provider
    request and provider-message transformation.'
  combined: 'Today: the stored result comes from the tool message in `after_create_message` (collect-01)
    and the arguments from `tool_call_done`, with `JSON.parse(toolCall.function.arguments)` inside try/catch
    and the raw string kept when parsing fails. `toolResult.result` in `tool_call_done` is not assumed
    to equal the persisted content. A record of what is about to happen is written by the tool itself
    at the top of `execute`, which has the validated `args`. Digests rely on the host JavaScript environment;
    SA specifies no hash primitive. The examples page says of `before_store_tool_result` ''The hook runs
    for the results of every tool in the prompt.'', which is a hint, not a requirement. A complete, portable
    audit of tool activity cannot be claimed from the 0.2.0 text alone.'
  see_also:
