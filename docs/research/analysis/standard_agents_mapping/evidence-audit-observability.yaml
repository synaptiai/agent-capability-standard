    quote: it runs around steps and messages, its failures are non-fatal to the decorated turn, and it
      may not own a side
  explanation: 'Both sides, as implemented, capture evidence fail-open: the ACS SDK collector catches
    its own exceptions and logs a warning, the plugin audit hook exits 0 without `jq`, and SA defines
    hooks as decorations whose failure does not fail the turn. Spec text: only the two `before_*_message`
    hooks say a failure SHOULD prevent the write; the `after_*` hooks say failures SHOULD NOT affect it;
    the tool hooks state no runtime behaviour, though ''Hooks accessing external services **MUST** handle
    failures gracefully.'' binds authors. Published types add that after a throwing `before_create_message`
    a runtime can still insert a model-step or tool-result message ''with the last good message''. ACS
    signals a failed audit write in band: the `audit` output requires `recorded`, and the audit skill
    sets `recorded: false`; the Standard''s text has no rule for ambient capture. hooks.md calls `execution`
    ''Always present in hooks''; elsewhere the text makes it null at rest.'
  combined: 'Today: records that must exist before an effect is accepted are written inside the tool''s
    own `execute`, because hooks fail open. An SA `audit` tool returns a success result whose JSON has
    `recorded: false` and the reason when the write fails, so an ACS workflow can gate on it; `status:
    ''error''` corresponds to a failed step (R402). Hooks stay for ambient, best-effort capture and read
    `state.execution?.flowId`. Gaps are found by reconciliation, not by a counter the same hook writes:
    evidence records are compared with the thread''s persisted `role: ''tool''` messages by `tool_call_id`,
    for example in the tool bound to `sessionStop` or in an endpoint. On a capture failure a hook can
    call `state.execution?.stop()` as a best-effort fail-stop; the text describes it without a MUST, and
    it cannot help when the hook never runs.'
