- id: store-01
  relation: fits
  acs:
    concept: 'Evidence store (`EvidenceStore`: bounded, in-memory, queried by kind, capability and ref
      prefix)'
    refs:
    - grounded_agency/state/evidence_store.py class EvidenceStore (lines 316-353; quote at line 318; DEFAULT_MAX_ANCHORS
      at line 341)
    quote: In-memory store for evidence anchors with bounded size.
  sa:
    concept: Durable per-thread key-value store (`getValue` / `setValue`), the thread file system and,
      in the published types only, user-scope values
    refs:
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-445)
    - content/0.2.0/infrastructure/runtime.md '14. Durable Key-Value Store' §14.1 Runtime Semantics (lines
      348-358; quote at line 353), §14.2 Capacity and Errors (line 362); the page has two sections numbered
      14
    - content/0.2.0/specification/threads/filesystem.md introduction (line 3)
    - content/0.2.0/specification/subagents.md §5.1 Persistent Invocation Arguments (lines 173-174); content/0.2.0/specification/tools.md
      §8 Annotations (line 144)
    - content/0.2.0/specification/threads/client-api.md §2 Routes (lines 18-32), §10 Deleting a Thread
      (line 296)
    - content/0.2.0/specification/users.md §2 UserState (line 56; draft page)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3152-3167 (getValue, setValue), 3179-3204 (getUserValue,
      setUserValue, listUserValues)'
    quote: Values **MUST** round-trip with JSON-equivalent structure (objects, arrays, strings, numbers,
      booleans, `null`).
  explanation: 'ACS''s reference store defines what is held and how it is queried, but it is process memory
    that evicts beyond 10,000 anchors, and STANDARD-v1.1.0.md sets no persistence requirement for it.
    SA defines durable per-thread storage: persistence across restarts and redeploys, visibility to every
    later tool, hook and endpoint of the thread, and JSON round-trip are MUSTs. It is the only general-purpose
    store writable at any time with a stated JSON round-trip (thread `arguments` and tool `annotations`
    are also preserved by MUST). Limits: no key listing, append or compare-and-set at thread scope; the
    key space is isolated between threads, not between packages; size caps are implementation-defined
    (MAY); a thread delete removes it. Published types only: `getUserValue`, `setUserValue` and `listUserValues`
    give listable storage shared by one user''s threads. Searched: evidence store, EvidenceStore (STANDARD-v1.1.0.md);
    getUserValue, setUserValue, listUserValues (content/0.2.0): not found.'
  combined: 'Works today as the primary store. `await state.setValue(''<package-id>.acs.evidence.'' +
    id, record)` per anchor (the prefix is a convention; any code on the thread can overwrite the key),
    plus an index chunked per execution, because keys cannot be listed and one growing array meets a value-size
    cap first. A write from a hook is best effort: a rejection is caught, noted in `state.context` and
    reported from the next ACS tool call. Read-modify-write of an index can race with endpoints and effects.
    Files under `/acs/evidence/` suit large bundles but are client-readable and writable by any file tool
    the model has. Records are exposed through a packaged thread endpoint: the Thread Client API has no
    route for stored values. Lost: cross-thread queries and atomic append.'
  see_also:
  - published-api-extension-points#thread-01
  - safety-enforcement#ckpt-02
  - checkpoint-rollback-state#state-01
