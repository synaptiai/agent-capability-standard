  - published-api-extension-points#hooks-02
  - published-api-extension-points#shown-01
  - published-api-extension-points#tools-04
  - safety-enforcement#appr-01
  - safety-enforcement#exec-01
  - safety-enforcement#hook-02
  - safety-enforcement#hook-03
  - checkpoint-rollback-state#state-19
  - approval-human#approval-06
  - workflow-execution#wf-07
  - multi-agent#coord-20
