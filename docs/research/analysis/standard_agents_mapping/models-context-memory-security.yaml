- id: context-03
  relation: fits
  acs:
    concept: 'Explicit data flow between steps: typed bindings `${store.field}` resolved by the executor,
      and required output fields checked (R402)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.3 Binding Syntax (lines 286-318; quote at line 288), §5.4 Typed Binding
      Rules (lines 320-333), §5.5 Consumer Contract Checking (lines 335-361)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 119-120)
    quote: 'Bindings reference prior step outputs and workflow inputs:'
  sa:
    concept: Implicit data flow through conversation history, governed per prompt by `includeChat`, `includePastTools`,
      `recentImageThreshold` and `reasoning.include`; explicit sub-prompt input through `requiredSchema`
      and `initUserMessageProperty`
    refs:
    - content/0.2.0/specification/prompts.md §1.2 Optional Properties (lines 26-27; quote at line 27),
      §3.3 Sub-Prompt Tool Configuration (lines 161, 168), §5.2 Schema Usage (line 218), §6.3 Reasoning
      Visibility (lines 245-248), §7 Image Context Management (lines 252-256)
    - content/0.2.0/infrastructure/runtime.md §4 Context Assembly (lines 61-71)
    - content/0.2.0/specification/subagents.md §5.1 Persistent Invocation Arguments (lines 173-174)
    - content/0.2.0/getting-started/examples.md §2 An Agent with Tools (line 300), non-normative
    - '@standardagents/spec 0.45.10 index.d.ts lines 4416-4428 (PromptDefinition.historyLimit)'
    quote: '| `includePastTools` | `boolean` | `false` | Include past tool results |'
  explanation: 'ACS passes evidence from step to step explicitly and type-checks it; the reference executor
    fails a step whose output lacks the contract''s required fields. SA passes it implicitly: a later
    model step sees what the prompt''s flags admit into the snapshot. `includeChat` and `includePastTools`
    both default to `false`; their meaning is one table row each, a Tip, and the non-normative examples
    page (''The default excludes past tool results.''). The term ''eligible persisted history'', used
    in several MUSTs, is not defined in terms of the flags. SA''s explicit channel into a sub-prompt is
    narrow: arguments are validated against `requiredSchema` (MUST), but `initUserMessageProperty` maps
    one property, and other arguments reach the model only through prompt variable interpolation, which
    has no specified syntax. The published types add `historyLimit`, which narrows `execution.messageHistory`
    itself and is not in the 0.2.0 text.'
  combined: 'When an ACS workflow drives SA (the host''s `invoke_capability` calls a prompt tool or spawns
    a subagent), all resolved bindings are serialised into one argument (for example `inputs`, a JSON
    string) declared in the receiving prompt''s `requiredSchema` and named by `initUserMessageProperty`;
