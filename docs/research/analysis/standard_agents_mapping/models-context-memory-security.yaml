      config slots)
    refs:
    - content/0.2.0/specification/models.md introduction (line 3; quote at line 3), §1 Model Definition
      (lines 9-34), §3 Fallback Chains (lines 40-52), §5 Capabilities (lines 74-113), §6 Validation (lines
