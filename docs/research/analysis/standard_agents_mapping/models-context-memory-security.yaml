- id: remember-03
  relation: partial
  acs:
    concept: 'The persist and recall skills'' project memory: stable learnings written to durable knowledge
      files such as CLAUDE.md'
    refs:
    - skills/persist/SKILL.md frontmatter `description` (line 3; quote at line 3)
    - skills/recall/SKILL.md Procedure steps 2-3 (lines 41-48)
    quote: 'description: Write stable learnings, decisions, and patterns to durable storage like CLAUDE.md
      or knowledge files. Use when saving project decisions, recording patterns, or updating long-term
      memory.'
  sa:
    concept: 'Agent Skills library as a durable, principal-scoped, cross-thread store: `state.skills.install`,
      `get`, `readFile`, `list`; an administrator-shared library'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Skills (lines 163-170), §7.4 Agent Skills
      (lines 449-458; quote at line 449)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1840-1841 (SkillMetadata.updatedAt), 1844-1847 (SkillFileInput),
      1875 (install)'
    quote: '`state.skills` exposes the calling thread owner''s Agent Skills library plus any administrator-reviewed
      skills explicitly shared by the runtime.'
  explanation: 'The ACS persist skill does not describe a key-value store: it describes writing stable
    knowledge into files an agent will read again in later sessions. The closest SA analogue is the Agent
    Skills library, not the thread store: durable, scoped to the calling principal, visible from every
    thread of that owner, on a non-Draft page, with an optional administrator-shared library, and with
    name and description surfaced to agents in ambient context (SHOULD). Differences: a skill is instructions
    with a required frontmatter, not arbitrary data; installs need mutation authorization, which a runtime
    may refuse to agent code; shared-library changes need an administrative principal; a private skill
    MUST NOT be visible to another principal, so there is no project scope below the shared library; and
    what is installed reaches later models as instructions, so it is not a place for evidence.'
  combined: Project-level learnings that ACS `persist` would write to a knowledge file are offered to
    a person as a proposed skill (a `SKILL.md` text with `name` and `description`) rather than installed
    by agent code; a user or administrator installs it with `state.skills.install` or through the runtime's
    interface. `recall` with project scope reads `state.skills.get(name)` or `state.skills.readFile(name,
    path)` and anchors the result as `skill:<name>`, a binding-defined ref scheme, with the skill's `updatedAt`
    when the runtime supplies it. Data, evidence and approvals stay in the thread store, thread files
    or an external store (rows remember-01 and remember-02).
  see_also:
  - checkpoint-rollback-state#state-27
- id: portability-01
  relation: fits
  acs:
    concept: 'Checks that fail closed and records that outlive their producer: a check ''is never silently
      off''; `audit` with `retention`; append-only events'
    refs:
    - spec/STANDARD-v1.1.0.md §5.17 Sender Identity (lines 1039-1042; quote at line 1041)
    - schemas/capability_ontology.yaml nodes[id=audit] input `retention` (lines 1357-1359)
    - schemas/event_schema.yaml schema.principles (line 8)
    quote: check is never silently off.
  sa:
    concept: 'Portability requirements for packed agents: no sidecar services that substitute for runtime
      behaviour; optional enhancements capability-detected; declared external services'
    refs:
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 9-25; quote at line 16)
    - content/0.2.0/specification/threads.md §1.2.1 Properties, `_notPackableRuntimeContext` (line 50),
      §2.3 Environment Variable Resolution (lines 231-234)
    - content/0.2.0/specification/users.md status banner (line 3)
    - content/0.2.0/infrastructure/providers.md 'Method Overrides' (lines 177-180)
    quote: package's declared agents and required dependencies MUST execute correctly when
  explanation: 'ACS''s checks are written to fail closed (a check ''is never silently off''), and its
    records are meant to outlive the thing that produced them. SA constrains what a packed agent may depend
    on: packed definitions MUST NOT require private runtime RPCs, undocumented events, sidecar services
    that substitute for runtime behaviour, or `_notPackableRuntimeContext`; runtime-specific enhancements
    may be capability-detected, but the package MUST execute correctly when they are absent; an external
    service is acceptable when the package declares it as part of the agent''s purpose. Three parts of
    this binding touch that rule: an external evidence log (row context-02), failing closed when an optional
    surface is missing (`instanceEnv`, the Draft Users surface, `ctx.state` on provider overrides), and
    records kept outside the thread. Threads §2.3 itself tells consumers of `instanceEnv` to fail closed,
    so SA''s text holds both positions.'
  combined: A packed grounded agent declares its external evidence log as an external service that is
    part of the agent's purpose, and keeps a thread-local copy so that the agent still executes without
    it; anchors then carry a weaker, stated guarantee. Optional surfaces are capability-detected with
    a defined fallback (the bundled profile when `instanceEnv` is absent, the binding's own allow-list
    when grants are absent). Where no safe fallback exists, the affected tool returns an error result
    naming the missing capability instead of the agent failing as a whole, and the package documents that
    capability as required.
