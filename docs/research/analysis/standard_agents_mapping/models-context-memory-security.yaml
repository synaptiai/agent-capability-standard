      value. Unknown or non-thread sources default to `secret`. Values marked `secret` should be redacted
      from tool output and logs; values marked `text` may be displayed.'
  explanation: 'The ACS Standard and SECURITY.md state no rule on secrets; rules exist only as non-normative
    skill text and in the persist, checkpoint and send frontmatter hooks, and the reference audit hook
    records skill arguments verbatim. SA''s typed, layered model varies in strength. MUST-level: system
    prompts must not contain secrets; provider credentials are declared as secret slots; hooks must not
    expose sensitive data in logs or error messages; bridged sandbox functions must not expose secrets
    the caller did not pass; `scopedEnv` values are not shown to the model; decision-provider destination
    overrides must not redirect inherited credentials; and, on the Draft Users page, grant secrets are
    write-only. Lowercase ''should'': encryption at rest, and redaction of `secret` values from tool output
    and logs. Nothing stops a tool from returning a secret it read with `state.env()`. Searched: secret,
    credential, redact, api key, encrypt (every file under spec/): three hits, none a rule.'
  combined: 'SA''s model is adopted unchanged, plus one binding rule: evidence excerpts, audit records
    and persisted memory are built only after redaction. The tool wrapper hands the inner `execute` a
    proxied state whose `env()` remembers every value returned for a name the tool declares with `type:
    ''secret''`, and replaces those values (above a minimum length) in `result` and `error` before returning.
    A value is redacted when the tool declares its name with `type: ''secret''` or when `state.envType(name)`
    returns `secret`, the redaction class threads.md §2.3 defines (tools-contracts#var-01); `envType`
    also reports `secret` for every value from a non-thread source, so the second test only widens the
    set. A `before_store_tool_result` hook is a second layer that may fail open (row security-02). Limits:
    exact matches only, and nothing in SA prevents a tool from reading a variable it did not declare.'
  see_also:
  - tools-contracts#var-01
  - evidence-audit-observability#privacy-01
- id: secrets-02
  relation: fits
  acs:
    concept: '`send`: transmit data to an external system (high risk; checkpoint and approval required).
      `destination` is a free string; the send skill refers to a destination allow-list that nothing defines'
    refs:
    - schemas/capability_ontology.yaml nodes[id=send] (lines 1133-1170; quote at line 1135)
    - spec/STANDARD-v1.1.0.md §4.4 Safety-Critical Capabilities (line 187)
    - skills/send/SKILL.md frontmatter hook (line 21), Procedure (line 88), Safety Constraints (line 295),
      non-normative
    quote: 'description: Transmit data to external system'
  sa:
    concept: 'Credential grants: named, user-scoped credentials with `origins` and `allow` policies, used
      through `fetch(grant, ...)` (Draft)'
    refs:
    - content/0.2.0/specification/users.md status banner (line 3), §2 UserState (line 70), §5 UserHandle
      (line 175), §6 Credential Grants (lines 186-205; quote at line 201), §8 Conformance (lines 393-394),
      Draft
    - '@standardagents/spec 0.45.10 index.d.ts lines 1582 (UserHandle.fetch), 1593-1628 (CredentialGrant)'
    quote: 3. The runtime MUST reject a `fetch` whose destination origin is not covered by `origins`.
  explanation: 'Two controls on one act. ACS decides whether a send may happen (a checkpoint and an approval
    first); in the Standard and the ontology `destination` is a free string, and the send skill refers
    to a destination allow-list that no schema or profile defines. An SA credential grant fixes where
    a credential may go (`origins`) and which packaged tools, endpoints or agents may use it (`allow`;
    an absent `allow` denies all callers); the secret is write-only. Where grants are supported the origin
    and caller checks are MUSTs. Not guaranteed: that grants exist (SHOULD-level, on a Draft page), that
    package code can detect their absence (`fetch` is a non-optional member and no capability flag is
    defined), or that a grant admits this tool for this user. Searched: allowlist, allow-list, allowed_destinations
    (spec/ and schemas/): not found; redirect (users.md): not found.'
  combined: 'An optional hardening for deployments that provision a grant naming the send tool in `allow.tools`:
    the tool calls `(await state.user())?.fetch(grant, destination, { redirect: ''error'', ... })` inside
    try/catch and returns an error result on any rejection. Without a grant, and on user-less threads,
    the wrapper checks the destination against the binding''s own allow-list before using a `secret` variable.
    In both cases the checkpoint and the approval of `send` are separate and still required; the approved
    value is the full destination, which the wrapper compares itself, since a grant restricts origins
    only.'
  see_also:
  - published-api-extension-points#grant-01
  - safety-enforcement#cred-01
- id: secrets-03
  relation: fits
  acs:
    concept: 'Delegation constraints: `fresh_context`, `read_only`, attested as `effective`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 917-922; quote at line 917)
    - schemas/capability_ontology.yaml nodes[id=delegate] inputs (lines 1463-1477), output `effective`
      (lines 1517-1532)
    quote: '`delegate` accepts `fresh_context` (start the delegate without the'
  sa:
    concept: 'Credential flow to child threads: `scoped` variables, relationship `scopedEnv`, `setEnv`
      propagation; thread isolation of the child'
    refs:
    - content/0.2.0/specification/tools.md §3 Variable Declarations (lines 60-64; quote at line 63)
    - content/0.2.0/specification/subagents.md introduction (line 3), §1 SubagentRelationship, `scopedEnv`
      (line 42), §3.2 Immediate Spawning (lines 103-104), §3.3 Blocking and Create-or-Continue (line 110)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (lines 94-95), §2.3 Environment Variable Resolution
      (lines 220-225, 238)
    - content/0.2.0/infrastructure/runtime.md §7.4 Initial Payload Mapping (lines 176-179)
    - '@standardagents/spec 0.45.10 index.d.ts lines 300-306 (VariableDefinition.scoped)'
    quote: '- `scoped: true` blocks inheritance from parent thread env for that variable name.'
  explanation: 'ACS lets a delegator ask for a fresh context and read-only behaviour and has the host
    attest what it used; it defines read-only by behaviour and says nothing about credentials. SA specifies
    credential flow. Thread env flows downward by default: scoped variables ''still flow downward'' from
    the declaring thread, descendants filter out inherited values for names marked `scoped` in their own
    agent graph, and `setEnv` propagates to active descendants. `scopedEnv` names values copied into a
    child as runtime-only transfer data, which the runtime MUST NOT expose to the model unless `nameEnv`
    or `descriptionEnv` designates the same name. No parent-side switch stops inheritance. For `fresh_context`
    the SA counterpart is structural: a child runs in its own isolated thread. Credentials are neither
    necessary nor sufficient for `read_only`: user-account and instance values stay resolvable by name,
    and a child can reach its parent''s `ThreadState`.'
  combined: 'Credential flow: grounded children declare their secrets with `scoped: true` and receive
    them through the relationship''s `scopedEnv`. `effective.fresh_context: true` is attested only for
    a newly created child instance; create-or-continue (`blocking: true` with `maxInstances: 1`) resumes
    an instance with its history. `effective.read_only: true` is attested only on the conditions set in
    the safety-enforcement concern: the child''s prompts offer only tools bound to non-mutating capabilities,
    its tools declare `uses: []`, its models list no `providerTools`, it has no handoff agents, and its
    tool, hook, effect and handler code has been reviewed to make no external write and no write outside
    its own thread; otherwise the host reports `false`. Credential isolation supports that review and
    does not replace it.'
