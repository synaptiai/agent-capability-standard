- id: identity-02
  relation: partial
  acs:
    concept: '`agent_identity` for agent parties: `principal`, `kind: agent`, `owner`, `model_family`,
      `trust_class: own_subagent_report`; `effective.identity` on a delegation; `actor_identity`'
    refs:
    - schemas/agent_identity_schema.yaml (lines 8-55)
    - spec/STANDARD-v1.1.0.md §5.16 Quorum, `require_distinct_identities` (line 980), §5.17 Sender Identity,
      Delegation (lines 1063-1075; quote at line 1063), Actor (lines 1095-1101)
    - schemas/capability_ontology.yaml nodes[id=delegate] output `effective.identity` (lines 1529-1532)
    quote: '**Delegation.** A delegation''s host may attest who took it:'
  sa:
    concept: 'Agent-side identifiers: `state.agentId`, `SubagentRegistryEntry.reference`, `relationship`
      and `name`, side backings, `state.userId`'
    refs:
    - content/0.2.0/specification/threads.md §1.2.1 Properties (lines 40-44)
    - content/0.2.0/specification/subagents.md §4.2 Registry (lines 128-147; quote at line 132)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure, `subagent_id` (line 30)
    - content/0.2.0/specification/threads/client-api.md §5 Listing Agents (lines 126-135)
    - content/0.2.0/specification/agents.md §1.1 The Three Backings (lines 11-15)
    quote: 'reference: string; // stable instance reference (UUID)'
  explanation: Delegation and quorum need identities for agents, not only for people. SA has no identity
    object for an agent party, but it has the parts. A child instance has a registry `reference` described
    as a stable instance reference (UUID), a `relationship` name and the implementing agent's `name`;
    the message record carries `subagent_id`; a thread has `agentId` and the owner's `userId`. The nearest
    notion to ACS `kind` is a side's backing (human, prompt or handler), which the agent list reports
    as `side_a_backing` and `side_b_backing`; it describes a side, not a party, and SA has no 'service'
    kind. `model_family` has no SA field (row models-02). Nothing in SA authenticates one agent to another;
    the registry is runtime-maintained, which is what makes a child's reference usable as a host-attested
    principal.
  combined: 'A delegate realised as a subagent gets `principal` = `''sa-subagent:'' + reference` (its
    registry `reference`, namespaced as in evidence-audit-observability#prov-03), `kind: ''agent''`, `role`
    as the delegation requested, `owner` = the thread owner''s id (`state.userId`), `model_family` per
    row models-02 and `trust_class: ''own_subagent_report''`. The host attests this as `effective.identity`
    and, for a waiting delegate, accepts only results it reads from that child''s own thread through `state.getChildThread(reference)`,
    with the reference taken from `state.children`; a message''s `subagent_id` is not relied on (multi-agent#coord-08).
    Two instances of one agent definition have different references and therefore different principals;
    whether they count as distinct reviewers is the host''s decision, and a host that wants one party
    per definition uses the qualified agent name as the principal instead.'
