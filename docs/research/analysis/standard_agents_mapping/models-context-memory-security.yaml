    - core/src/validate/semantics.rs (line 26)
    quote: '| `domain`, `profile`, `risk_propagation`, `data_flow` | — | Recognised descriptive fields
      |'
  sa:
    concept: 'Configuration surfaces: layered `env` (thread, agent, prompt, user account, instance), optional
      `instanceEnv`, `variables`, `PromptToolConfig.options`, `CreateThreadRequest.env`, code bundled
      in the package'
    refs:
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-238; quote
      at line 231)
    - content/0.2.0/specification/agents.md §2.2 Optional, `env` (line 91)
    - content/0.2.0/specification/prompts.md §1.2 Optional Properties, `variables` and `env` (lines 32-33),
      §3.2 Tool Configuration with Environment Values (lines 119-125)
    - content/0.2.0/specification/tools.md §3 Variable Declarations (lines 51-64)
    - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (lines 147-151, 162)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 15-17), 'Entry Point Exports'
      (line 29)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2947 (instanceEnv), 4218-4222 (PromptToolConfig.options)'
    quote: Use it when a value establishes a trust boundary, such as a service endpoint
  explanation: 'SA has no profile and no risk or evidence policy object. ACS itself does not say how a
    profile is applied: the Standard mentions profiles in §5.1 (a descriptive field) and §8.3 only, the
    validator checks structure, and no reference code reads one. Placement in SA is therefore an inference:
    the profile belongs in package code, imported by hooks and tool wrappers. Selection through `agent.env`
    is a default, not a pin: thread values resolve first, `POST {runtime_prefix}/threads` accepts caller-supplied
    `env`, and `setEnv` propagates to descendants. Only `instanceEnv` reads from the instance alone, and
    it is optional. `variables` declare names and secrecy of string values; `PromptToolConfig.options`
    is structured and author-set, but how a tool reads it is unspecified. Searched: risk (content/0.2.0):
    not found; threshold: 6 lines, none about risk; profile: 1 line (the user''s profile).'
  combined: 'One validated profile is pinned in package code as a JSON or TypeScript module and imported
    by the wrappers; that is the whole binding until ACS defines how a profile is selected and merged.
    If a deployment must choose, the wrapper reads `await state.instanceEnv?.(''ACS_PROFILE'')` and falls
    back to the bundled profile when the method or the value is missing, never to a caller-supplied value;
    falling back keeps a packed agent working where the optional capability is absent, as Packaging requires.
    The variable is declared with `scoped: true`, so a parent thread''s value is not inherited. No comparison
    of profiles by strictness is implemented: §5.2.1 defines ''stricter of'' for four flags, not for profiles.'
  see_also:
  - published-api-extension-points#options-01
  - published-api-extension-points#thread-07
