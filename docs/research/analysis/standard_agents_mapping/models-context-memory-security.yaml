    - skills/digital-twin-sync-loop/SKILL.md frontmatter `name` (line 2)
    quote: '- YAML frontmatter with `name`, `description`, `allowed-tools`, `agent` type, and `layer`'
  sa:
    concept: Agent Skills library on `state.skills` (`list`, `get`, `readFile`, `install`, `setEnabled`,
      `remove`); progressive disclosure
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Skills (lines 161-170), §7.4 Agent Skills
      (lines 447-465; quote at line 455)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1844-1847 (SkillFileInput), 1875 (install)'
    quote: '- A skill''s identity **MUST** come from its `SKILL.md` frontmatter — never from a caller-supplied
      name — and installs **MUST** validate the frontmatter against the standard.'
  explanation: 'Both use a folder whose root SKILL.md opens with YAML frontmatter carrying `name` and
    `description`; all 42 ACS skills meet the limits §7.4 states (lowercase kebab-case `name` of at most
    64 characters, `description` of at most 1024; checked by script). Differences: (1) the other ACS keys
    are Claude Code keys for which SA defines no behaviour; (2) two skills have a `name` that differs
    from their directory (`gap-analysis-workflow`, `digital-twin-sync-workflow`), and on SA the frontmatter
    name is the identity; (3) the SA library belongs to the thread owner, not to a package: installs need
    mutation authorization and change what that owner''s other agents see, and how skills reach a model
    is SHOULD-level; (4) checks that six ACS skills express as frontmatter `hooks` do not run on SA. Whether
    an install accepts the extra keys depends on the Agent Skills standard, which was not consulted.'
  combined: 'Agent code does not install ACS skills into the thread owner''s library. Capability instructions
    travel in prompt text (row prompts-01), which ships with the package and is scoped to the agent. Installing
    an ACS skill with `state.skills.install([{ path: ''SKILL.md'', content }])` is offered only as something
    a user or administrator does; the published input type carries text files only. The checks of the
    six skills with frontmatter hooks (audit, checkpoint, persist, rollback, send, transform) are re-expressed
    in tool wrappers; the skill bodies still carry the same rules as instructions.'
  see_also:
  - tools-contracts#skl-01
  - packaging-conformance-governance#pkg-05
- id: context-01
  relation: fits
  acs:
    concept: Grounded claims (§3.1) and provenance (F505 PROVENANCE_MISSING, reserved and unchecked)
    refs:
    - spec/STANDARD-v1.1.0.md header 'Status' (lines 4-8), §3.1 Grounded Claims (line 77; quote at line
      77), §5.17 Sender Identity, Always ask (lines 1091-1093), §9.6 Safety Errors, F505 (line 1325)
    quote: Every claim MUST be evidence-backed or explicitly marked as inferred. Ungrounded claims MUST
      include an `inference_method` and `confidence` score.
  sa:
    concept: 'Context assembly and request-context hooks: `after_system_message`, `filter_messages`, `prefilter_llm_history`;
      stored history versus request context; child `parentHooks`'
    refs:
    - content/0.2.0/infrastructure/runtime.md §4 Context Assembly (lines 61-73)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-85), §3.2 filter_messages (lines
      227-231; quote at line 230), §3.3 prefilter_llm_history (lines 261-264), §3.4 Stored history and
      the request context (lines 293-306), §6.4 LLMMessage (lines 495-503)
    - content/0.2.0/specification/threads/execution-state.md §2.2 Live execution history (lines 45-49)
    - content/0.2.0/specification/threads/messages.md §7 Conformance Scenarios (line 197)
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (line 163)
    - content/0.2.0/specification/providers.md §1.1 Methods, `inspectRequest` (line 42)
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 73)
    quote: '- Synthetic or transformed messages returned here **MUST** remain confined to the request
      context. They **MUST NOT** replace [`execution.messageHistory`](/0.2.0/specification/threads/execution-state#22-live-execution-history).'
  explanation: 'Do the context hooks threaten evidence integrity? Stored evidence: no. Synthetic or transformed
    messages MUST stay confined to the request and MUST NOT replace `execution.messageHistory`; this is
    also a conformance scenario. What the model saw: yes. The hooks may drop evidence-bearing messages,
    rewrite content and add synthetic messages that exist nowhere in storage, and SA defines no record
    of the dispatched context (`inspectRequest` is an optional provider preview; Handlers §5 names a ''request/execution
    log'' that no page defines). A claim can therefore cite a stored message the model never saw, or rest
    on a synthetic message no anchor can reach. ACS does not relate an anchor to what the claimant was
    shown either: F505 is reserved, and the reference implementation does not check §3.1. Searched: request
    log, execution log, dispatched (hooks.md, runtime.md, execution-state.md, messages.md): not found.'
  combined: '(a) Evidence is anchored to persisted records (message `id`, `tool_call_id`, file path),
    never to request-context content. (b) The dispatched context is recorded in a `prefilter_llm_history`
    hook, whose returned array MUST be the provider request history: a digest of the provider messages
    and the tool call ids, stored per `state.execution.flowId` and `stepCount`; the provider-extension
    record of row providers-01 is a second check where `ctx.state` is present. An output tool can then
    refuse an anchor `tool_call:<id>` whose id is absent from the current step''s record. (c) A synthetic
    message returned by a request-context hook counts as inferred content. Limits: provider messages carry
    tool call ids but no persisted message id, so only tool results are identifiable; a child''s `parentHooks`
    of the same type run after the parent''s; ACS has no rule that requires (b).'
- id: context-02
  relation: partial
  acs:
    concept: Append-only observations and events; audit trail; retention
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms, Observation (line 58)
    - schemas/event_schema.yaml schema.principles (lines 7-11; quote at line 8)
    - spec/SECURITY.md §2.1 STRIDE Analysis, Tampering and Repudiation (lines 83-84)
    - schemas/profiles/healthcare.yaml compliance.audit_retention_days (line 106)
    quote: Events are immutable and append-only.
  sa:
    concept: 'Persisted message storage and its mutation paths: `updateMessage`, `deleteMessage`, client
      message deletion, thread deletion; message lifecycle hooks'
    refs:
    - content/0.2.0/specification/threads/messages.md §1 Message Structure, `status` (line 20), §5 Updating
      Messages (lines 169-178), §6 Deleting Messages (lines 180-186)
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36), §1.3 Hook Scoping (lines
      80-83, 99-100), §4.2 after_create_message (lines 334-335), §4.3 before_update_message (lines 348-350)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 14), §10 Deleting a Thread (lines
      294-296; quote at line 296), §13 Deleting a Message (lines 378-381)
    - content/0.2.0/specification/subagents.md §4.1 Persistence Is Universal (line 124)
    - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (line 235)
    - content/0.2.0/specification/effects.md §3 Execution Semantics (lines 85-90)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 9-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6161-6164 (before_update_message comment)'
    quote: 5. The runtime **MUST** delete the messages, files, and stored values of every thread in the
      deletion set.
  explanation: 'SA thread storage is durable and ordered, which suits it as a working evidence store,
    but it is not append-only. Code holding a `ThreadState` can change a message''s content or metadata
    or delete it (tool-result messages cascade with their assistant message); a client with thread access
    can delete a message; deleting a thread MUST delete its messages, files and stored values. Updates
    have before and after hooks: the text says a failing `before_update_message` SHOULD prevent the update,
    and the published types say a throw rejects `updateMessage()` except for updates an execution cannot
    go on without. Deletion has no hook and no stream frame. Retention is runtime-defined. ACS states
    append-only in a definition and a schema principle, not in a MUST, so this limits the naive binding
    and is not a contradiction. Searched: delet (hooks.md): not found.'
  combined: 'The tool wrapper that produced the evidence is the primary mirror: before it returns, it
    appends a digest of its result string to a log outside the thread (an external service the package
    declares as part of its purpose) or, as a weaker local copy, to a thread file; a failed append becomes
    an error result instead of a silent gap. `after_create_message` and `after_update_message` hooks add
    the message id as a secondary record; they are listed on every prompt that sets `hooks` and on the
    agent, and their failure is silent. Scheduled effects are not used: delivery is not guaranteed, and
    thread deletion discards them. An anchor resolves only if `state.getMessage(id)` returns the record,
    a mirror entry exists and the digests match. The mirror detects alteration by other code on the thread;
    it does not prevent it.'
