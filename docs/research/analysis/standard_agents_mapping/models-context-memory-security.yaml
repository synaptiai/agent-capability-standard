    - spec/STANDARD-v1.1.0.md header 'Status' (lines 4-8), §2 Terms, Grounding (line 65), §3.1 Grounded
      Claims (line 77)
    quote: 'description: Anchor claims to evidence'
  sa:
    concept: '`state.decide()` over explicit context: a `boolean` or `choice` question evaluated without
      reading or changing the conversation'
    refs:
    - content/0.2.0/specification/threads/decisions.md introduction (lines 3-4), §2 Request Types (lines
      56-60), §3 Question Types (lines 92-96), §4.1 Answer Semantics (lines 155-167), §5 Provider Interface
      (lines 190-192), §6 Conversation Semantics (lines 202-207; quote at line 204)
    - content/0.2.0/infrastructure/runtime.md §1.1 Decision Inference (lines 21-25)
    - content/0.2.0/specification/prompts.md §1.2 Optional Properties, `includeChat` (line 26)
    quote: '- read conversation messages to assemble context;'
  explanation: '`ground` is the ACS capability that checks a claim against sources. SA has no grounding
    construct, but a decision is its natural carrier: `decide()` evaluates typed questions against caller-supplied
    context, MUST NOT implicitly read conversation messages, and adds nothing to the conversation. The
    sources a grounding check saw are therefore exactly the items the caller passed, which a model step
    cannot guarantee (row context-01). What SA does not supply: `required_strength` has no counterpart
    beyond the caller''s own threshold on the returned probability; `evidence` and `gaps` are lists a
    boolean answer cannot carry; and a deployment may have no decision provider. ACS for its part does
    not define the three strength levels, and its reference implementation does not check §3.1. Searched:
    required_strength (every file under spec/): not found.'
  combined: A `ground` function tool takes `claim` and `sources` (refs to persisted records), resolves
    each ref (`state.getMessage(id)`, `state.readFile(path)`) and passes the resolved texts as `context`
    to `state.decide()` with a `choice` question whose options are supported, contradicted and not addressed.
    `grounded` is the caller's threshold applied to the probability of 'supported', taken per `required_strength`
    from a table the binding publishes; `evidence_anchors` are the refs that were placed in `context`;
    `gaps` lists the refs that did not resolve. Without a decision provider the tool falls back to a prompt
    tool that is given the same explicit sources and no chat history (`includeChat` is `false` by default).
  see_also:
  - tools-contracts#io-08
  - published-api-extension-points#decide-01
