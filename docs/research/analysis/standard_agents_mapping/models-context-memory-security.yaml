  sa:
    concept: 'Observation of a model call by provider-extension code: method overrides (`generate`, `stream`,
      `getResponseMetadata`) and the per-request transport (`createFetch`), each with the thread `state`
      when the runtime supplies it'
    refs:
    - content/0.2.0/infrastructure/providers.md 'Provider Packages' (line 24), 'Method Overrides' (lines
      141-180; quote at line 178), 'Per-request Transport (`createFetch`)' (lines 182-189)
    - content/0.2.0/specification/providers.md §1.2 Provider Factory (lines 50-65), §1.3 'Method Overrides'
      (lines 174-214), §5 Response Format (lines 347-368), §6 Streaming (lines 380-391), §9 Response Metadata
      (lines 512-566)
    - content/0.2.0/specification/models.md §3.1 Fallback Behavior (lines 44-48), §4.2 Pricing Priority
      (line 72)
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36)
    - content/0.2.0/infrastructure/runtime.md §7.4 Initial Payload Mapping (line 176)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 21-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3638-3655 (ProviderOverrideContext), 3666-3670 (CreateFetch),
      3745 (factory context argument), 1179-1183 (finish chunk)'
    quote: additionally receive the executing thread's `state` on
  explanation: 'ACS says what a record contains; no MUST asks for a record per model call (SECURITY.md
    §4.2 is a SHOULD-level list about tools). This row is supporting infrastructure for rows models-02
    and context-01, not a conformance item. SA shows the facts of a model call (dispatched request, token
    usage, answering model) to provider-extension code only: of the 14 thread hooks, the message hooks
    see the assistant message built from the response, and none receives usage, finish reason or the answering
    model. The text does not require runtimes to run overrides; they run because the published `defineProvider()`
    wraps the base instance, and `state` arrives only through a second factory argument that the published
    types have and the text''s `ProviderFactory` lacks. Decision calls, a runtime''s own model calls (the
    bootstrap pass of Runtime §7.4) and provider-executed tools are outside the wrapper.'
  combined: 'A provider extension is the `provider` of every model of a grounded agent, fallbacks included,
    with: (1) `overrides.generate` recording `ctx.request.model`, a digest of `ctx.request.messages` and
    token counts after `next()`; (2) `overrides.stream` returning a wrapping async iterable that records
    the same at the `finish` chunk (no chunk carries the answering model); (3) `overrides.getResponseMetadata`
    recording `ctx.summary.model`. Records go to `ctx.state.setValue` under a package-prefixed key, without
    `usage.cost`, which SA restricts to authorized parties. When `ctx.state` is undefined the record cannot
    be tied to a thread; an agent that requires it throws, which fails the step only once every model
    of the chain has thrown. `createFetch` is the transport-level alternative. An external sink is an
    external service the package has to declare as part of its purpose.'
- id: prompts-01
  relation: sa_only
  acs:
    concept: (no counterpart in the Standard) instructions to the model; the nearest ACS artefact is a
      skill's procedure text
    refs:
    - spec/STANDARD-v1.1.0.md (searched for 'prompt'; not found)
    - spec/SECURITY.md §2.2.1 Prompt Injection (lines 91-101), §9.2 Open Research Questions (line 408)
    - CLAUDE.md 'Skill Structure' (lines 252-260; quote at line 259), plugin documentation, non-normative
    quote: '- Procedure steps with evidence grounding'
  sa:
    concept: 'Prompt definition: system prompt content (`text` and `include` parts), `tools`, `toolChoice`,
      `reasoning`, `hooks`; `after_system_message` hook'
    refs:
    - content/0.2.0/specification/prompts.md introduction (line 3; quote at line 3), §1.1 Required Properties
      (lines 13-18), §2.2 Structured Prompts (lines 54-62), §2.4 Include Resolution (lines 86-91), §8
      Hook Scoping (lines 272-273), §9.1 Required Field Validation (lines 283-288)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-85), §3.1 after_system_message
      (lines 204-215)
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 223-230)
    - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (lines 147-151)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4086-4099 (PromptEnvPart, PromptPart)'
    quote: A prompt defines how each request to an LLM is crafted.
  explanation: 'The ACS Standard never mentions prompts: it constrains which steps exist and what they
    return, not how a model is instructed. SA''s prompt definition is adopted as written. Prompt text
    can state the grounding rules, but text given to a model satisfies no ACS MUST; enforcement stays
    in tool wrappers and hooks. Two SA limits shape the binding. Packed code sees only its own package
    plus other packages'' entry agents, so a shared rules prompt cannot be included across packages; an
    included prompt is also a full definition that needs a `toolDescription` and a defined `model`. An
    `after_system_message` hook runs only when it is in the resolved hook set, and a child''s hook at
    the default `after_parent` stage may replace the string again. Searched: prompt (spec/STANDARD-v1.1.0.md:
    not found; spec/SECURITY.md: lines 91, 101 and 408, all on prompt injection).'
  combined: 'The grounding rules ship as a string constant exported by the binding library and placed
    in a text part, `{ type: ''text'', content: ACS_GROUNDING_RULES }`; an `include` part is usable only
    for a prompt in the same package, and only its `prompt` field is included. Profile-dependent text
    can be added per request by an `after_system_message` hook, whose returned string MUST replace the
    rendered system message; the hook is listed in the `hooks` array of every prompt that declares one
    and in the agent''s `hooks` for prompts that declare none (row hooks-01). Grounded system prompts
    are not built from caller-settable environment values: the published types have an `env` prompt part,
    and `POST {runtime_prefix}/threads` accepts `env`.'
