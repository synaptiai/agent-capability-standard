    - schemas/profiles/healthcare.yaml risk_thresholds (lines 46-54)
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition, `risk` and `requires_approval` (lines 120-123),
      §5.14 Approval (lines 804-902)
    quote: 'description: Capability IDs that must never run autonomously'
  sa:
    concept: Human-in-the-loop composition (a child with a human side, `awaiting_human`); observational
      `tool_call_started`; the non-normative 'policy gate' note
    refs:
    - content/0.2.0/specification/agents.md §1.1 The Three Backings (line 19), §7 Human-in-the-Loop Composition
      (lines 171-189)
    - content/0.2.0/specification/hooks.md §3.3 prefilter_llm_history, Note (line 273), §5.1 tool_call_started
      (lines 381-382; quote at line 382)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 113)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6023-6355 (HookSignatures)'
    quote: '- The return value **MUST** be ignored; the hook cannot modify the tool call.'
  explanation: 'ACS grades capabilities by risk and lets a profile name levels and capabilities. Only
    `block_autonomous` has a clear reading (capability ids; every value in the seven shipped profiles
    is a valid id). The other three keys are not bindable mechanically: the schema speaks of ''human review''
    and ''human execution'' without defining either or relating them to `requires_approval` and §5.14,
    the `require_human` enum includes `critical`, a level no capability can have, and the healthcare profile
    sets `require_human: low`, which read literally parks every call on a person. SA has no risk attribute
    on tools, prompts or agents and no hook that can stop a tool call before it executes; it does specify
    a waiting state for a person (a child with a human side parks as `awaiting_human`) without defining
    who the person is. Searched: risk (content/0.2.0): not found.'
  combined: 'Only `block_autonomous` is bound: tools bound to a listed capability are left out of every
    prompt''s `tools`, or their wrapper returns an error result (which the runtime MUST persist without
    crashing the loop) unless a recorded human decision exists; that decision comes from the approval
    binding of the approval concern. Enforcement sits in the tool''s `execute`, not in a hook. `auto_approve`,
    `require_review` and `require_human` are treated as documentation until ACS defines them, and the
    binding says so.'
- id: profile-03
  relation: acs_only
  acs:
    concept: '`checkpoint_policy` (free-form keys mapped to always / high_risk / medium_risk / never)'
    refs:
    - schemas/profiles/profile_schema.yaml checkpoint_policy (lines 56-61; quote at line 58)
    - schemas/profiles/personal_assistant.yaml checkpoint_policy (line 45)
    - schemas/profiles/healthcare.yaml checkpoint_policy (lines 56-60)
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88)
    quote: 'description: When to create checkpoints'
  sa:
    concept: (no counterpart) SA has no checkpoint or rollback concept
    refs:
    - content/0.2.0/ (every file searched; not found)
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 74; quote at line 74)
    quote: '- The inbound message stays persisted. Nothing is rolled back.'
  explanation: 'SA has no checkpoint or rollback concept; the nearest wording is the handler rule that
    a failed turn rolls nothing back (''snapshot'' in SA refers to the context snapshot and registry snapshots).
    Independently of SA, the profile''s keys are free-form labels such as `before_send_message` or `before_any_recommendation`:
    the schema constrains only the values, and nothing defines which capability, step or tool a key denotes.
    Searched: checkpoint, rollback, revert, savepoint, transaction (content/0.2.0): not found; rolled
    back: one line, handlers.md §5.'
  combined: Cannot be bound mechanically today. The checkpoint rule that is defined (a checkpoint before
    `mutate`, `send` and `rollback`) comes from the ontology, not from the profile, and is bound in the
