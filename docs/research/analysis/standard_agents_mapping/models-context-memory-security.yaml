- id: security-01
  relation: fits
  acs:
    concept: 'Untrusted content and prompt injection: trust classes, always-ask marks, residual risk statement'
    refs:
    - spec/SECURITY.md §2.2.1 Prompt Injection (lines 91-101; quote at line 101)
    - spec/STANDARD-v1.1.0.md §5.17 Sender Identity, input table (line 1048), Always ask (lines 1077-1093),
      §8.3 Trust Classes (lines 1243-1251)
    quote: '**Residual Risk**: Prompt injection is primarily a runtime concern. The standard provides
      structure but not content filtering.'
  sa:
    concept: Sanitization and validation duties on implementations and hooks; sandbox for untrusted code
    refs:
    - content/0.2.0/specification/prompts.md §2.1 String Prompts (line 50; quote at line 50), §5.2 Schema
      Usage (line 222)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-85), §3.3 prefilter_llm_history
      (line 271), §4.1 before_create_message (lines 320-322)
    - content/0.2.0/specification/threads/code-execution.md §11 Security Considerations (lines 550-552)
    quote: System prompts **MUST NOT** contain secrets or sensitive credentials. Implementations **MUST**
      sanitize prompt content that incorporates untrusted input to prevent injection.
  explanation: 'Each side covers what the other leaves open. ACS identifies who delivered an item (trust
    class), carries an always-ask mark along references the workflow author fixed and the executor tracks,
    gates approval on it, and states that it provides no content filtering. SA places sanitization and
    validation duties on implementations and hooks and sandboxes untrusted code, but does not define untrusted
    input, has no way to mark stored content as untrusted, and specifies no interpolation mechanism. In
    a model-driven SA thread there are no executor-tracked references: the messages an action''s evidence
    anchors name are chosen by the model, which can leave an injected message out of its anchors. A binding
    that follows anchors is therefore weaker than ACS''s mark. Searched: taint, trust class (content/0.2.0
    and the published types): not found; untrusted: prompt input and sandboxed code only.'
  combined: The thread is marked, not the anchor. A `before_create_message` hook classifies each stored
    message (tool results by a static tool-name map, child reports by the child registry, everything else
    unclassified) and sets a thread value such as `acs/always_ask = true` whenever the class is an always-ask
    class or is missing; wrappers of tools that require approval read that value and require a person
    while it is set. This matches the rule that a mark is never removed during a run and does not depend
    on what the model cites. It is conservative (one untrusted message marks the whole thread), it holds
    against the model and not against other code on the thread, which can clear the value, and a hook
    that is not in the active prompt's resolved set does not run (row hooks-01).
- id: security-02
  relation: partial
  acs:
    concept: 'Behaviour when a check itself fails: fail-safe by site (a stop-type gate whose `when` errors
      fires; an `end` gate does not; a condition reads false)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.8.2 Evaluation (lines 491-495; quote at line 492)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Conditions and gates (lines 124-130)
    quote: 'Its effect is fail-safe by site: a **gate** whose `when` errors'
  sa:
    concept: 'Hook failure semantics: non-fatal to the decorated turn; SHOULD-level prevention in the
      `before_*` message hooks; handler errors'
    refs:
    - content/0.2.0/specification/hooks.md introduction (line 5; quote at line 5), §1.2 Hook Definition
      (line 66), §3.3 prefilter_llm_history, Note (line 273), §4.1 before_create_message (line 322), §4.3
      before_update_message (line 350), §5.2 before_store_tool_result (lines 386-398)
    - content/0.2.0/getting-started/examples.md §3 Hooks (line 550), non-normative
    - content/0.2.0/specification/handlers.md §5 Error Semantics (lines 71-77)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons, `hook_blocked` (line 113)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6109-6112 (before_create_message comment), 6161-6164
      (before_update_message comment)'
    quote: its failures are non-fatal to the decorated turn
  explanation: 'Both define what happens when a check errors, with different defaults. ACS is fail-safe
    by site: a stop-type gate whose expression errors fires, an `end` gate does not (firing would report
    success), and a condition that errors is false. An SA hook''s failures are non-fatal to the decorated
    turn by default. For `before_create_message` and `before_update_message` the text says a failure SHOULD
    prevent the write; the published types say a throw prevents an `injectMessage()` insertion or an `updateMessage()`
    update, while a runtime may still perform a write an execution cannot go on without ''with the last
    good message''. For `before_store_tool_result`, the redaction point, the text gives no failure behaviour.
    A runtime may let a request-context hook block a request (a Note, with the reason code `hook_blocked`).
    A redaction or grounding hook therefore cannot be assumed to fail closed.'
  combined: 'Fail-closed logic sits where failure is visible: in the tool''s `execute` wrapper, which
    returns an error result that the runtime MUST persist. A handler-backed side is fail-closed for one
    turn only: a throwing handler is fatal to the turn, and the session continues. Inside hooks, errors
    are caught and a safe value is substituted (for a redaction error, a fixed placeholder as `result`)
    instead of throwing. A try/catch does not cover a hook timeout or a hook that is outside the resolved
    set, so hooks stay a second layer behind the wrapper.'
  see_also:
  - published-api-extension-points#hooks-02
  - safety-enforcement#flags-02
  - safety-enforcement#hook-01
  - safety-enforcement#hook-02
