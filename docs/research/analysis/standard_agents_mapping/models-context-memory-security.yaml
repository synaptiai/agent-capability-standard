  - evidence-audit-observability#collect-03
- id: identity-01
  relation: partial
  acs:
    concept: '`agent_identity` for people and services: `principal`, `kind`, `role`, `owner`, `authenticated_by`,
      `trust_class`'
    refs:
    - schemas/agent_identity_schema.yaml (lines 8-55)
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 804-902), §5.15 Delegation, principal (lines 932-938),
      §5.17 Sender Identity (lines 1021-1030; quote at line 1029)
    quote: fills it in; the standard does not say how a party is authenticated or
  sa:
    concept: 'User identity: `UserIdentity` / `ThreadUser` (`id`, `role`, `roles`, `permissions`), `state.user()`,
      endpoint `auth.caller`'
    refs:
    - content/0.2.0/specification/users.md status banner (line 3), §1 Identity (lines 9-25; quote at line
      9), 'Application roles' (lines 29-43), Draft
    - content/0.2.0/specification/threads.md §1.2.2 Methods, User identity (line 159)
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 98-105)
    - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (line 159)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1892-1905 (ThreadUser)'
    quote: 1. A runtime MUST resolve every authenticated request to a stable user id.
  explanation: 'Field by field: `principal` maps to the user `id` (ACS compares principals by exact equality;
    that the id is stable is a MUST only on the Draft Users page). `role` maps to `role` or one of `roles`,
    opaque strings from the runtime''s trusted identity authority, never from clients. `kind` (agent,
    human, service) has no SA field; a comment in the published types gives role values for the reference
    runtime only. `authenticated_by` is not exposed: the mechanism is implementation-defined. `trust_class`
    has no SA concept. The subject matters: `state.user()` is the thread''s owner and can resolve `null`,
    while ACS needs the identity of a sender, an actor or an approver, and Endpoints §4 notes that caller
    and owner frequently differ. In the published types `ThreadUser.username` and `role` are required;
    the Draft''s `UserIdentity` makes them optional. Agent parties are row identity-02.'
  combined: 'People: identities are built from `auth.caller` in a thread endpoint: `{ principal: ''sa-user:''
    + caller.id, kind: <per deployment>, role: <an application role from caller.roles, else caller.role>,
    authenticated_by: ''x-<runtime id>'' }`, with `trust_class: ''owner''` only when `caller.id === state.userId`.
    Classing the owner as `owner` is the binding''s decision, supported by the rule that a thread''s owner
    is set from the authenticated caller. Approver roles are checked on that caller when the decision
    is recorded, in line with SA''s advice to authorize each protected request rather than keep an earlier
    grant. `state.user()` identifies the owner for display and for the `owner` field of an agent''s identity,
    nothing more.'
