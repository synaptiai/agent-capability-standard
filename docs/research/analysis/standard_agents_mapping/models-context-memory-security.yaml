- id: hooks-01
  relation: partial
  acs:
    concept: 'Where safety checks apply: safety layers act on every step''s effective flags; the reference
      plugin hook matches every mutating tool call of a session'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
    - hooks/hooks.json PreToolUse matcher (lines 3-13; quote at line 5)
    - spec/SECURITY.md §5.1 Pre-Tool Use Hooks (lines 276-280)
    quote: '"matcher": "Write|Edit|MultiEdit|NotebookEdit|Bash"'
  sa:
    concept: 'Hook scoping: a prompt''s non-empty `hooks` array replaces the agent''s; at rest only agent-level
      hooks apply; an enabled child relationship adds its `parentHooks` before or after'
    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 72-100)
    - content/0.2.0/specification/prompts.md §8 Hook Scoping (lines 272-273; quote at line 272)
    - content/0.2.0/specification/agents.md §2.2 Optional, `hooks` and `parentHooks` (lines 92-93), §6
      Required Parent Hooks (lines 155-164)
    - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 149-163)
    - content/0.2.0/specification/threads/execution-state.md §2.1 Prompt Path (lines 36-39)
    quote: '- When `hooks` is non-empty, only those hooks form the prompt base set'
  explanation: 'ACS expects its safety layer to see every step, and the reference plugin hook is global:
    it matches tool names for the whole session. SA thread hooks are scoped. A prompt with a non-empty
    `hooks` array uses only those hooks as its base set; the agent''s `hooks` apply only to prompts that
    declare none and to at-rest operations; an enabled child relationship adds its `parentHooks` before
    or after the base set. So a grounding, redaction, mirroring or trust-tagging hook listed only on the
    agent does not run for a prompt that sets its own hooks, one listed only on a prompt does not run
    at rest, and a sub-prompt with its own list, or a handed-off agent from another author, runs without
    it (the last by inference from §1.3). The text defines no way for an agent to require a hook for all
    of its prompts.'
  combined: 'Every hook-based part of this binding (rows context-01, context-02, context-04, security-01,
    secrets-01, reliability-01) lists its hooks in the `hooks` array of every prompt that declares one
    and in the agent''s `hooks`; a build-time check over the package''s definitions verifies this, since
    the runtime does not. Guarantees that must hold regardless of the active prompt are placed in tool
    wrappers, which run wherever the tool is called. Composing a child is reviewed for the `parentHooks`
    it declares: composition interfaces MUST disclose the hook id, reason and stage, and those hooks run
    with the parent''s `ThreadState`.'
