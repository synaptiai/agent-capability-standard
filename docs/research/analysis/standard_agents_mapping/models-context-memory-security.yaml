      (lines 977-978), §5.17 Sender Identity, Delegation (lines 1071-1075; quote at line 1074)
    quote: it does not protect against a host that lies
  sa:
    concept: 'Thread isolation and its exceptions: `getParentThread()` and `getChildThread()` return a
      full `ThreadState`; a child''s `parentHooks` run in the parent'
    refs:
    - 'content/0.2.0/specification/subagents.md introduction (line 3), §6.4 Child → Parent: Explicit Escalation
      (line 219)'
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Subagent Hierarchy (lines 94-95), §9 Subagent
      Hierarchy, Communication, and Termination (lines 485-486)
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (lines 155-163; quote at line 163)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 84-85, 95-96)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14),
      §14.1 item 3 (line 352)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2913-2919 (getChildThread, getParentThread)'
    quote: '- The hook receives the parent''s `ThreadState` and remains active for the lifetime of the
      enabled relationship. It applies during every prompt on either side of the parent.'
  explanation: 'ACS relies on the host to attest that a delegate started without the delegator''s context
    and did not depend on forbidden inputs, and says the attestation does not protect against a host that
    lies. In SA a child''s thread is isolated for models: its own messages, filesystem, queue and lifecycle.
    It is not a boundary against the code it is composed with. `getParentThread()` and `getChildThread()`
    return the full surface of the other thread (values, messages, files, env), Subagents §6.4 suggests
    delivering results through the parent''s key-value store, and a composed child''s `parentHooks` run
    with the parent''s `ThreadState` on every prompt, by default after the parent''s own hooks. The text
    does not reconcile the handles with the rule that values MUST NOT be readable by any other thread.
    Every binding in this mapping therefore holds against the model, not against co-located or composing
    code.'
  combined: 'The host attests `effective.fresh_context` and reviewer independence only for children whose
    package code has been reviewed: no use of `getParentThread()` to read the delegator''s messages, values
    or files, and no `parentHooks` that write into the parent beyond what the composition discloses. A
    grounded parent treats a composed child''s package as part of its own trusted code base and reviews
    the `parentHooks` a child declares before enabling the relationship. Evidence that must survive other
    code on the thread is mirrored outside it (row context-02).'
