    - '@standardagents/spec 0.45.10 index.d.ts line 4048 (defineModel)'
    quote: A model definition specifies which Large Language Model (LLM) to use for inference and how
      to connect to it.
  explanation: 'The ACS Standard does not describe models or LLM providers. Its only model-related concept
    is `model_family`: a requested input of `delegate` and an attested identity field (row models-02).
    The reference SDK passes a model name and a cost budget through to the Claude Agent SDK and keeps
    a per-model cost summary; none of that is normative. SA specifies models and providers normatively
    (required fields, validation MUSTs, fallback SHOULDs, typed provider errors). No ACS field maps to
    a model definition, so SA''s two pages are adopted as written; other rows of this mapping do constrain
    four properties of the model definitions a grounded agent writes. Searched: temperature, pricing,
    context window, system prompt, sampling, llm provider (every file under spec/, case-insensitive).'
  combined: '`defineModel({ name, provider, model })` and provider packages are used unchanged; the call
    type-checks against the published types. Four rules from other rows apply to the definition: (1) no
    `fallbacks` that leave the model family the host attests (models-02); (2) no `providerTools` on models
    of grounded prompts unless their results are captured (perceive-02); (3) `capabilities.supportsImages`
    declared explicitly, because it defaults to `false` and the binding''s dispatcher reads it (modality-02);
    (4) a provider extension that wraps the provider for recording is a separate provider identity with
    its own `name` in setup interfaces (providers-01).'
- id: models-02
  relation: partial
  acs:
    concept: 'Model family: requested with `delegate` `model_family`, attested as `effective.model_family`
      or the attested identity''s `model_family`, and required by quorum `require_model_families`'
    refs:
    - schemas/agent_identity_schema.yaml agent_identity.model_family (lines 29-31; quote at line 31)
    - schemas/capability_ontology.yaml nodes[id=delegate] input `model_family` (lines 1467-1469), output
      `effective` (lines 1517-1532)
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 760-761), §5.15 Delegation (lines 917-923),
      §5.16 Quorum, `require_model_families` (line 981), §5.17 Sender Identity, Delegation (lines 1063-1075)
    quote: 'description: For an agent, the model family it ran on.'
  sa:
    concept: 'Model identity at run time: `ModelDefinition.name` and `model`, `fallbacks`, `ProviderResponse.metadata.model`,
      `ResponseSummary.model`, `ProviderUsage.provider`; the message record''s `prompt` field'
    refs:
    - content/0.2.0/specification/models.md §1.1 Required Properties (lines 15-19), §3.1 Fallback Behavior
      (lines 44-48; quote at line 47), §5.3 Default Capabilities (line 111), §8.5 Sampling Parameters
      (line 315)
    - content/0.2.0/specification/providers.md §5 Response Format (lines 362-367), §6 Streaming (lines
      380-391), §9.3 ResponseSummary Structure (lines 536-549), §9.5 Implementation Notes (lines 563-566),
      §11 TypeScript Reference (lines 806, 816-817)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 11-38)
    - content/0.2.0/specification/threads/decisions.md §4 Result Types (line 148)
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 228-230)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2006-2097 (Message), 1024 (ProviderResponse.metadata),
      1179-1183 (finish chunk), 2880 (loadPrompt)'
    quote: 2. If the primary model fails after exhausting retries, try each fallback in order
  explanation: 'ACS counts a model family only when the host attests it (§5.16), and `effective` is part
    of the delegation''s output, so for a waiting delegate it is attested before the delegate''s model
    has answered. SA knows a prompt''s model statically, but with `fallbacks` (SHOULD-level) another model
    may answer, and the message record names the prompt, not the model. Provider code can see the answering
    model: `ProviderResponse.metadata.model` on `generate` (optional; typed `unknown` in the published
    types) and `ResponseSummary.model`, documented as the model that handled the request, for streamed
    and non-streamed calls; no stream chunk carries it. `ProviderUsage.provider` names the upstream provider.
    SA has no family field. Searched: a model member in the Message table and the published `Message`
    interface: not found; family (content/0.2.0: one adjective in models.md §8.5; published types: not
    found).'
  combined: '(a) Attestation is static. A reviewer whose family counts toward `require_model_families`
    uses a model definition with no `fallbacks`, or a chain whose members all map to one family. The host
    maps a definition to a family string with its own table (ACS defines no vocabulary) and reads definitions
    in its own namespace with `state.loadPrompt<PromptDefinition>(name)` and `state.loadModel<ModelDefinition>(prompt.model)`;
    a packaged reviewer publishes its family itself, because package internals cannot be loaded from outside.
    (b) A dynamic record is a cross-check: a provider extension records `ctx.summary.model` in `overrides.getResponseMetadata`
    and `ctx.request.model` in `generate` and `stream` (row providers-01), which needs the optional `ctx.state`;
    a verdict whose recorded model maps to another family is discarded. (c) Where the delegate is a blocking
    spawn and the host answers only after the child session closes, it may attest from that record. `state.decide()`
    is outside these overrides; `DecisionResult.model` reports its model.'
  see_also:
  - published-api-extension-points#thread-06
  - workflow-execution#wf-20
  - multi-agent#coord-07
- id: providers-01
  relation: fits
  acs:
    concept: 'Recording a model call: `audit` and `ProvenanceRecord` say what a record holds; no ACS requirement
