  explanation: 'In SA the natural form of `generate` is an assistant message: free text with no anchors
    or confidence. A sub-prompt used as a tool returns a single text string. SA''s portable way to obtain
    a structured, validated model output is a tool call whose arguments the runtime validates (a MUST).
    `toolChoice: ''required''` is weaker than it reads: the quoted MUST binds the model; the runtime''s
    part is a SHOULD-level retry; any tool satisfies it, including the lifecycle tools injected on a side
    with visible relationships; and whether a `stopTool` that returns an error still ends the turn is
    not stated. A JSON response format exists on `ProviderRequest.responseFormat` and as `supportsJsonMode`,
    but the prompt property table has no response-format field; the published types add a provider-specific
    `providerOptions` on prompts. `transform` and `integrate` have no SA construct of their own.'
  combined: '`generate`: a prompt with `toolChoice: ''required''` whose `tools` contain one output tool
    with `args` mirroring the ontology output (`content`, `evidence_anchors`, `confidence`). The runtime
    validates the arguments; the tool''s `execute` checks that each anchor ref resolves (`state.getMessage(id)`,
    `state.statFile(path)`) and returns an error result otherwise. Acceptance does not depend on stop
    semantics: on success the tool stores the accepted output with `state.setValue` under a key derived
    from `state.execution.flowId`, and the consumer (the calling tool or the host''s dispatcher) reads
    it there and fails the step when it is absent. Naming the tool as `stopTool` is a convenience; the
    generating side declares no visible subagent relationships. A resolving anchor shows that the record
    exists, not that the model was shown it (row context-01). `transform` and `integrate` are function
    tools returning the ontology output as JSON text.'
- id: modality-01
  relation: partial
  acs:
    concept: Modality-specific evidence anchors (`text_span`, `bounding_box`, `time_segment`, `video_region`,
      `composite`), defined in a Guide
    refs:
    - docs/guides/MODALITY_HANDLING.md header (lines 3-5), §4.1 Evidence Anchor Types by Modality (lines
      600-611; quote at line 603), §4.2 Anchor Schema (lines 617-651), §4.3 Grounding Rules by Modality
      (lines 655-678)
    - schemas/profiles/vision.yaml evidence_policy.required_anchor_types (lines 59-63)
    - schemas/world_state_schema.yaml types.Anchor (lines 62-85)
    quote: '| **Image** | `bounding_box` | `image:<path>:bbox:<x>,<y>,<w>,<h>` | Rectangular region in
      pixel coordinates |'
  sa:
    concept: 'Non-text content: `AttachmentRef` into the thread file system, provider content parts (`text`,
      `image`, `image_url`, `file`), `recentImageThreshold`, cross-thread attachment copying, file `metadata`'
    refs:
    - content/0.2.0/specification/threads/messages.md §1.2 Attachment References (lines 53-67)
    - content/0.2.0/specification/threads/filesystem.md §1 File Record (lines 11-21), §4 Directory Operations
      (line 75), §5 Moving and Renaming (lines 80-82)
    - content/0.2.0/specification/providers.md §3.1 Content Types (lines 304-310)
    - content/0.2.0/specification/prompts.md §7 Image Context Management (lines 252-256; quote at line
      255)
    - content/0.2.0/specification/subagents.md §7 Attachment Copying (lines 232-237)
    - content/0.2.0/specification/threads/code-execution.md §6.1 No Host Capabilities on `globalThis`
      (line 389)
    - '@standardagents/spec 0.45.10 index.d.ts lines 166-172 (ToolAttachment comment on downsampling of
      user uploads)'
    quote: '- Older images are replaced with text descriptions'
  explanation: SA carries non-text content as files referenced by `AttachmentRef` (path, mimeType, size,
    optional width and height). ACS's modality anchors, which a Guide defines, need a stable path and
    stable coordinates. The path is stable only while no code moves, renames, unlinks or rewrites the
    file; SA defines no immutability for attachments. Across threads attachments are copied and the destination
    MUST receive destination-local paths, and neither `AttachmentRef` nor `FileRecord` has a content digest;
    `FileRecord.metadata` can hold one, though whether a cross-thread copy keeps it is not stated. In
    context, `recentImageThreshold` replaces older images with text descriptions, and a comment in the
    published types mentions downsampling of user uploads, so a model may not have seen the stored bytes.
    The guide's modality kinds are not canonical `Anchor.kind` values (file, url, tool, log, sensor, human_note).
  combined: 'An anchor is a ref plus a digest in every case: `image:<path>:bbox:x,y,w,h` or `audio:<path>:segment:a-b`
    with `sha256:<hex>` of the stored bytes, computed by the tool that processed the file (`state.readFile(path)`)
    using a hash function bundled with the package, because 0.2.0 does not say which host globals tool
    code may use. Verification re-reads the file and compares. For files the binding writes, the digest
    is also stored in the file''s `metadata` through the `writeFile` options. Coordinates are produced
    in tools on the stored bytes, never taken from model text. Audio and video are processed by function
    tools that read the thread file system; the SA text does not say how non-image attachments are presented
    to a model.'
- id: modality-02
  relation: partial
  acs:
    concept: Modality selection by the step's `domain` parameter; the Guide's `unsupported_domain` error
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition, `domain` (line 260)
    - docs/guides/MODALITY_HANDLING.md §1.1 Design Philosophy (line 51), §1.3 Handling Unsupported Modalities
      (lines 67-86; quote at line 86), Appendix A (lines 773-791), Guide
    - core/src/exec/mod.rs Body::InvokeCapability.domain (lines 104-108)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (line 85)
    quote: This allows workflow authors to detect modality gaps at design time rather than encountering
      silent failures at runtime.
  sa:
    concept: Model capability flags (`supportsImages`) and request-time filtering of image parts
    refs:
    - content/0.2.0/specification/models.md §3.1 Fallback Behavior (lines 44-48), §5.1 Capability Properties
      (lines 80-88), §5.3 Default Capabilities (lines 107-113)
    - content/0.2.0/specification/providers.md §1.1 Methods, `getModelCapabilities` (line 40)
    - content/0.2.0/infrastructure/runtime.md §4 Context Assembly (lines 61-82; quote at line 82)
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 228-230)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3788-3846 (ModelCapabilities)'
    quote: When supported by the model, attachments remain multimodal content. If a model does not support
      vision, runtimes may filter image parts at request time while preserving stored message attachments.
  explanation: 'Both declare modality support, in different places. ACS puts it on the step (`domain`,
    a step field in §5.2 that the reference executor passes to the host with the action); SA puts it on
    the model (`supportsImages`, default `false`). SA declares images only. Behaviour when unsupported
    differs: the ACS Guide says an implementation should return a clear error naming the domain (a lowercase
    ''should'', in a Guide that predates §5.2); SA lets a runtime drop image parts at request time, and
    the text does not say at which assembly step, nor that anything records the omission. A provider may
    also report capabilities through the optional `getModelCapabilities`; how that combines with a definition''s
    defaults is not stated. Searched: audio (content/0.2.0): not found; video: one file name in an example;
    supportsAudio, supportsVideo, supportsFiles (published types): not found.'
  combined: 'In the host''s capability dispatcher, for a step whose `domain` is `image`, starts with `image.`,
    or is another domain the binding maps to image input: load the prompt and every model of its fallback
    chain from the host''s own namespace and fail the step with R402 and a message naming the domain unless
    each has `capabilities.supportsImages === true`. The flag has to be declared explicitly, since an
    omitted flag reads as `false`. A packaged child cannot be inspected from outside its package; it declares
    the modalities it accepts. Audio and video domains are dispatched to tools; SA has no capability flag
    to consult. R402 with a message is what the host protocol allows today (any other code is read as
    R402).'
- id: profile-01
  relation: acs_only
  acs:
    concept: Domain profile as a unit (`trust_weights`, `risk_thresholds`, `checkpoint_policy`, `evidence_policy`,
      `domain_sources`) and where it is supplied
    refs:
    - schemas/profiles/profile_schema.yaml (lines 5-13)
