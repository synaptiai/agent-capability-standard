    quote: '| `failed` | `step_error`, `repeated_tool_error`, `session_fail`, `fatal_error`, `execution_lost`
      |'
  explanation: 'RFC-0002 is a Draft that specifies no fields; it says the standard lacks a session primitive
    and the telemetry to compute its axes. SA has sessions, a persisted run status with reason codes,
    and a hook that fires once for every completed tool call when it is in the resolved set: raw material
    for a delivery measure. SA states how sessions end (stop, fail, error or turn cap) and that a later
    message starts a new session with history intact; it does not define the first session''s start, a
    session identifier, or whether a session spans several executions. The reason codes are SHOULD-level
    and extensible, and `ThreadStatus.reason` holds only the last transition. Searched: a session is,
    session begins, session starts (content/0.2.0): not found.'
