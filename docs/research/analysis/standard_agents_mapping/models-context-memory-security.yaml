- id: profile-04
  relation: partial
  acs:
    concept: '`evidence_policy`: `minimum_confidence`, `require_grounding`, `required_anchor_types`; `classify`
      output `probabilities`; the canonical `Uncertainty` type'
    refs:
    - schemas/profiles/profile_schema.yaml evidence_policy (lines 62-80; quote at line 75)
    - schemas/capability_ontology.yaml nodes[id=classify] output_schema (lines 342-360), nodes[id=measure]
      output_schema (lines 381-405)
    - schemas/world_state_schema.yaml types.Uncertainty (lines 86-116)
    quote: 'description: Minimum confidence threshold for actions'
  sa:
    concept: 'Decision inference: `state.decide()` with explicit context, typed questions, probabilities
      and optional confidence; decision providers'
    refs:
    - content/0.2.0/specification/threads/decisions.md §1 Thread Interface (lines 11-27), §2 Request Types
      (lines 48-60), §3 Question Types (lines 69-96), §4.1 Answer Semantics (lines 155-167; quote at line
      165), §5 Provider Interface (lines 190-192), §6 Conversation Semantics (lines 202-207)
    - content/0.2.0/infrastructure/runtime.md §1.1 Decision Inference (lines 21-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1321-1323 (DecideOptions.provider)'
    quote: Providers and runtimes **MUST NOT** coerce a boolean probability to a boolean
  explanation: 'SA''s decision API returns probabilities in [0, 1] and forbids providers and runtimes
    from thresholding them; thresholds and subsequent actions are the caller''s. ACS''s `minimum_confidence`
    is such a caller threshold. `decide()` takes explicit context and MUST NOT implicitly read conversation
    messages, so the evidence a decision saw is exactly what the caller passed: its result is groundable
    by construction. Limits: the decision interface is a separate provider capability (`kind: ''decision''`)
    that no provider package is required to offer; an answer''s `confidence` is optional, provider-reported
    and distinct from an outcome probability; a `score` answer is a rubric index, while ACS `measure`
    requires `value` and `uncertainty`. On the ACS side nothing reads `minimum_confidence` or `require_grounding`,
    and the capability-output `confidence` is undefined, although the canonical schemas have a richer
    `Uncertainty` type.'
  combined: '`state.decide({ provider, model, context, questions })` is an optional implementation of
    `classify` (a `choice` question) and of yes/no checks (a `boolean` question), available when the deployment
    has a decision provider; otherwise a function tool is used. `probabilities` are reported as returned.
    ACS `confidence` is set from the provider''s `confidence` when present and otherwise from the selected
    option''s probability, and the output records which of the two was used. `evidence_anchors` are the
    refs of the items placed in `context`. A `score` question serves `measure` only when the metric is
    a rubric, with `uncertainty` derived from the distribution. Comparing with the profile''s `minimum_confidence`,
    and rejecting empty `evidence_anchors` for `require_grounding` capabilities, are binding choices until
    ACS gives profiles application semantics.'
  see_also:
  - tools-contracts#io-08
  - published-api-extension-points#decide-01
  - evidence-audit-observability#trust-02
- id: profile-05
  relation: acs_only
  acs:
    concept: 'Source trust: `trust_weights`, `domain_sources`, trust classes and their default weights
      (§8)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.17 Sender Identity (lines 1044-1056), §8.1 Trust Score Calculation (lines
      1211-1222), §8.3 Trust Classes (lines 1243-1251; quote at line 1249)
    - schemas/authority_trust_model.yaml source_ranking.weights (lines 20-26), trust_classes.weights (lines
      32-40)
    - schemas/profiles/profile_schema.yaml trust_weights (lines 25-34)
    - benchmarks/scenarios/conflicting_sources.py _recency_weight (lines 70-87)
    quote: A domain profile overrides a class weight with a `trust_weights` key
  sa:
    concept: '(no trust model) source-identifying signals only: the tool name on tool results, the record''s
      `subagent_id`, `metadata.subagent_id`, `metadata.forwarded_from`, hook `PackageSignature`'
    refs:
    - content/0.2.0/specification/threads/messages.md §1 Message Structure, `name` and `subagent_id` (lines
      16-30), §1.1 Provenance Metadata Conventions (lines 42-49; quote at line 49)
    - content/0.2.0/specification/subagents.md §4.2 Registry (lines 128-148), §6.5 Provenance Metadata
      (lines 223-228)
    - content/0.2.0/specification/hooks.md §2.4 Execution Provenance (lines 173-196)
    quote: 'These are conventions, not requirements: consumers **MUST** tolerate their absence, and runtimes
      **MUST NOT** rely on them for routing correctness.'
  explanation: 'SA has no source-trust model: ''trust'' appears for trust boundaries (`instanceEnv`),
    the trusted identity authority of user roles, untrusted code and trusted definition code, never as
    a weight on a data source. SA contributes labels: the tool name on a tool-result message, the record''s
    `subagent_id`, the cross-thread metadata conventions, the thread owner''s identity, and package provenance
    for child-contributed hooks. The ACS side is not mechanical either: of the 101 `trust_weights` keys
    in the seven shipped profiles, one (`hardware_sensor`) is also a key of `source_ranking.weights`,
    and none uses the `trust_class:<class>` form §8.3 defines (checked by script). ACS ships no reusable
    implementation of the §8 score: the half-life rule is implemented only in a benchmark scenario. Searched:
    trust (content/0.2.0): 15 lines, none a source weight.'
  combined: A static map in package code from SA tool name to a profile `trust_weights` key or `domain_sources`
    entry, written by hand per profile and published with the binding. A child's report gets trust class
    `own_subagent_report` only when the record's `subagent_id` (or `metadata.subagent_id`) matches a `reference`
    in `state.children`. A message with no class is dropped or always-ask under §5.17 where those inputs
    are bound; for §8 scoring it gets its source-type weight, not a floor. The §8 score, including the
    MUST that the decay factor is 0.5 at one half-life, is implemented by the binding in TypeScript, for
    example inside an `integrate` tool; SA supplies only the labels.
  see_also:
  - evidence-audit-observability#trust-01
- id: profile-06
  relation: fits
  acs:
    concept: 'Enforced safety flags: validators, executors and safety layers MUST act on effective flags'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-93), §5.2.1 Safety Flags (lines 272-284;
      quote at line 279)
    quote: Validators, executors and safety layers MUST act on effective flags.
  sa:
    concept: Tool `annotations` (implementation-specific hints)
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 125-146; quote at line 146), §9 Conformance
      Notes (line 156)
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Resource Loading (lines 102-113)
    - content/0.2.0/specification/hooks.md §6.2 HookToolCall (lines 468-475)
    - '@standardagents/spec 0.45.10 index.d.ts lines 412 (ToolAnnotations), 424 (DefineToolOptions.annotations)'
    quote: '- Annotations **MUST NOT** change argument validation, execution, the tool''s results, or
      what is sent to the model. A tool behaves identically in a runtime that ignores them.'
  explanation: 'Not a conflict between the two texts: both requirements can hold together, so the relation
    is partial. SA offers a declarative, non-enforcing metadata slot; ACS''s flags need an enforcing layer
    elsewhere. Recording an ACS capability id, domain or flags in a tool''s `annotations` is allowed:
    keys belong to whoever owns them, `defineTool()` MUST return them unchanged, and implementations MUST
    preserve them. Expecting a runtime to enforce them would contradict SA, where annotations MUST NOT
    change execution and a runtime MUST ignore keys it does not understand. A hook cannot look up a tool''s
    annotations through `ThreadState`, which has no tool loader, and it receives only the call''s name
    and arguments; a hook in the same package can import the tool definition module (an inference from
    ordinary module imports). Searched: loadTool, getToolNames (content/0.2.0 and the published types):
    not found.'
  combined: '`annotations: { ''ai.synapti/acs'': { standard, ontology, capability, layer, domain, risk, mutation, requires_checkpoint,
    requires_approval } }` (the object `schemas/interop/standard_agents_annotation.schema.json` defines;
    `domain` is its one optional member) is declarative metadata only, read at build time by an ACS validator
    that imports the package''s tool definitions, and by interfaces. Enforcement comes from code: the
    tool''s own `execute` wrapper, which knows its capability from its closure, and hooks keyed by tool
    name. No ACS guarantee depends on a runtime reading annotations.'
  see_also:
