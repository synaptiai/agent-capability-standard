  explanation: 'Close in purpose, different in contract. Matches: keyed durable storage of JSON values,
    durable across executions, restarts and redeploys (MUST), with read-your-writes on the same thread
    (MUST). Durability at the moment `setValue` resolves is SHOULD-level, and runtimes MAY cap key length,
    value size and key count. Missing on the SA side: `ttl`, a stored-at timestamp for thread values,
    and an output object (`setValue` returns nothing; `getValue` returns the value or `null`). Because
    `setValue(key, null)` deletes the key, `null` cannot be stored. Missing on the ACS side: scope and
    lifetime (row remember-02) and a grammar for `ttl`. A time to live can still be honoured above the
    store. Searched: ttl, expire, expir (content/0.2.0 and the published types): only stream tickets,
    a room challenge and credential-grant metadata.'
  combined: '`persist`: `key = args.key ?? generated`; `await state.setValue(''<pkg>/persist/'' + key,
    { data, stored_at, expires_at, anchors })` inside try/catch, then a read-back; return `{ stored, key,
    timestamp, evidence_anchors }`, with `stored: false` when the write is rejected (for example by a
    capacity cap). With `ttl`, the wrapper parses it as an ACS duration (§5.10.1; the binding''s choice),
    sets `expires_at` and schedules a cleanup effect with that delay; effects have no delivery guarantee,
    so the read-side check is the guarantee. `recall`: `const v = await state.getValue(''<pkg>/persist/''
    + key)`; an absent or expired entry is `found: false` with `data` set to `default`. Only a `ttl` that
    does not parse is rejected. The store is not required to be encrypted at rest, so secrets are not
    persisted (row secrets-01); the key space is shared by all code on the thread.'
