    refs:
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113)
    - content/0.2.0/specification/subagents.md §6.2 (lines 195-205), §6.4 (line 219), §7 Attachment Copying
      (lines 230-237)
    - content/0.2.0/infrastructure/runtime.md §8.2 Child -> Parent (lines 197-202), 'Durable Key-Value
      Store' §14.1 item 3 (line 352)
    - content/0.2.0/specification/threads.md §12 TypeScript Reference (lines 659-665)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 152); content/0.2.0/specification/threads/messages.md
      §1 (line 17)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (`ToolResult`), lines 2659-2680 (`StopSessionOptions`)'
    quote: '- payload attachments **MUST** be copied child filesystem -> parent filesystem'
  explanation: 'ACS outputs are objects checked against the ontology, and the `delegate` output must carry
    `evidence_anchors`. SA''s child-to-parent result is text: a session binding forwards one argument
    field, `stopSession` takes `result?: string`, `notifyParent` takes a string, and a tool result''s
    `result` is a string in the published types. Other channels, each with a caveat. Files: attachments
    returned on completion or failure MUST be copied to the parent and referenced by parent-local paths,
    the only MUST-level delivery guarantee. The parent''s key-value store: named by subagents.md §6.4
    for explicit-mode children, but in tension with the rule that values MUST NOT be readable by any other
    thread. `ToolResult.error_data`: structured, but published types only and error results only. `metadata`
    on a message a child queues to its parent through `getParentThread()`. The child''s own history, where
    a stop tool''s schema-validated arguments persist in `tool_calls`.'
  combined: Let deterministic child code serialise the ACS output, not the model. Give the child a stop
    tool with a typed `args` schema (validated per tools.md §9) whose `execute` builds the JSON and calls
    `state.stopSession({ result })`, or writes a file that it then returns as an attachment (preferable
    for evidence bundles, because of the copy guarantee). Alternatively the parent's host reads the stop
    tool call's arguments from the child's history by reference. In every case the parent's host validates
    the object against the ACS schema before submitting it to the executor, and adds its own anchor identifying
    the child reference it came from.
