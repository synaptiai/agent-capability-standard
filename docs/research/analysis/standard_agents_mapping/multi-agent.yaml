      SDK only)
    - 'docs/guides/RUNNING_WORKFLOWS.md ''Driving a run yourself'' (lines 271-278: signed snapshots)'
    quote: '- A workflow cannot weaken a capability''s safety flags (§5.2.1)'
  sa:
    concept: 'Not found: no machine-readable declaration of a child agent''s effects, and no hook source
      by which a parent observes or constrains a child''s tool calls'
    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-93), §5.1 `tool_call_started` (line
      381)
    - 'content/0.2.0/specification/agents.md §2.2 Optional (lines 85-90): `title`, `description`, `toolDescription`
      are free text'
    - content/0.2.0/specification/subagents.md §1 (line 37, `description`), §2.2 Single Owner (line 58)
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
    - content/0.2.0/specification/handlers.md §1 Handler Definition (line 28)
    - content/0.2.0/specification/threads.md §2.3 (lines 227-234, `instanceEnv`)
    - 'content/0.2.0/getting-started/examples.md §6 Composition (lines 737-990; non-normative): a child
      that labels GitHub issues'
    - '@standardagents/spec 0.45.10 index.d.ts lines 4959-5114 (`AgentDefinition`: no `annotations` member),
      line 2913 (`getChildThread`)'
    quote: If none of these sources declares a matching hook, no hook runs.
  explanation: 'Nothing in the specification tells an SA parent that a child mutates: agents are described
    in free text, the registry entry carries `description` and `status`, and `annotations` are non-normative
    and function-tool only (see the Standard Agent Specification findings). A thread''s hooks come from
    four sources (its direct children''s `before_parent` hooks, the active prompt''s, the agent''s fallback
    hooks, its children''s `after_parent` hooks), none of them its parent, so a parent''s hooks see none
    of a child''s tool calls, and a parent cannot add a hook to a child. `getChildThread` returns a full
    `ThreadState`, so parent code can inject, update and delete the child''s messages and write its files,
    and ''handlers are trusted definition code, like tools'': child-side grounding holds against the parent''s
    model, not its package''s code. ACS has the matching weakness (see the Agent Capability Standard findings):
    `delegate` is `mutation: false` with no checkpoint or approval flag. Searched: childHooks, child hooks
    (not found); inherit (environment, key-value and credential text only).'
  combined: 'Three measures within 0.2.0. (1) A grounded child enforces its own checkpoints and approvals
    in its own thread; the parent cannot do it for the child. Where the parent package''s code is untrusted,
    protect the child''s records with an integrity check keyed from `instanceEnv` (optional: consumers
    ''must feature-detect the method and fail closed if the capability is unavailable''), as the ACS reference
    executor signs snapshots. (2) Declare the `delegate` step for any child not known to be read-only
    with `requires_approval: true` and, where the delegator will act on the result, `requires_checkpoint:
    true`; §5.2.1 makes a stricter declaration effective. A parent checkpoint does not cover the child''s
    effects (ACS gap). (3) Audit afterwards: parent code can read the child''s history, tool calls included,
    with `(await state.getChildThread(ref)).getMessages({ includeSilent: true })`; sub-prompt messages
    need `maxDepth`, and the limits listed in coord-06 apply.'
  see_also:
