# Delegation and composition across agents
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: multi-agent
title: Delegation and composition across agents
rows:
- id: coord-01
  relation: partial
  acs:
    concept: '`delegate` capability (COORDINATE layer): one host-performed capability call with required
      `task` and `agent`, returning required `accepted` and `evidence_anchors` and optional `task_id`,
      `agent`, `effective`, `result`'
    refs:
    - 'schemas/capability_ontology.yaml node `delegate` (lines 1443-1538): `risk: medium`, `mutation:
      false`, no `requires_checkpoint` or `requires_approval`'
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 904-940)
    - 'spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 753-755): a waiting delegate''s delegation
      MUST return a string `task_id`'
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (`InvokeCapability` row, line 85; guide
      to the reference executor, non-normative)
    quote: 'description: Assign task to another agent'
  sa:
    concept: '`SubagentRelationship` declared on an agent side, plus the runtime-injected lifecycle tool
      `subagent_create`'
    refs:
    - content/0.2.0/specification/subagents.md intro (lines 3-5), §1 SubagentRelationship (lines 7-47),
      §3.1 Creation Paths (lines 88-94), §5 Lifecycle Tools (lines 155-165)
    - content/0.2.0/infrastructure/runtime.md §5.3 Tool Classes (lines 94-100), §7.1 Parent/Child Threading
      and §7.2 Lifecycle Tooling (lines 115-131)
    - content/0.2.0/specification/handlers.md §6 Capabilities (line 85)
    - 'content/0.2.0/specification/threads.md §1.2.1 Properties (line 44, `children`), §1.2.2 Methods
      (lines 52-176: no creation method)'
    - '@standardagents/spec 0.45.10 index.d.ts lines 4546-4685 (`SubagentRelationship`), lines 1925-1976
      (`SubagentRegistryEntry`), lines 2771-3493 (`ThreadState`), lines 5911-5916 (`HookExecutionSource`
      comment)'
    quote: 'A subagent relationship is part of the agent''s structure: it is declared on the agent side
      that owns it, never inside a prompt''s `tools` array.'
  explanation: 'Both hand a task to another agent that runs separately. ACS: one capability call whose
    target is a free string (`agent`) chosen at run time; where the delegate runs is left to the host.
    SA: a static declaration (which agent definitions a side may instantiate, under which relationship
    name) plus run-time creation in an isolated thread; runtimes MUST reject lifecycle invocations that
    target undeclared or disabled relationships, without creating a child. For `subagent_create` 0.2.0
    fixes `agent` (MUST enumerate the enabled relationship names), a non-empty `name` (MUST) and `arguments`
    (SHOULD). Unspecified (see the Standard Agent Specification findings): what a non-blocking call returns,
    and what code calls; `ThreadState` declares no creation method, and both the tool name `subagent_create`
    and the relationship name (''Relationship names are tool names.'') fit the text. Searched: returns,
    reference, result; createChild, spawnChild, createSubagent, spawn(.'
  combined: 'To be verified per runtime (see the Standard Agent Specification findings). The host answers
    `InvokeCapability` for `delegate` by creating an instance of the relationship ACS `agent` names (the
    `as` name, not the agent definition), with `task` as `arguments` and a host-chosen non-empty `name`.
    It mints `task_id` and maps it to the child reference, read in an `after_subagent_created` hook (`childState.threadId`,
    which only the published types equate with `reference`; active hook set only) or from the registry
    later (entries keyed by relationship name and lookup through `ThreadState` are MUSTs). `accepted:
    true` equals `ToolResult.status === ''success''` only for a non-blocking relationship; a blocking
    call returns after the child session closes. `evidence_anchors`: parent `threadId`, child reference,
    `relationship`, `createdAt`. Not guaranteed: that `state.invokeTool(''subagent_create'', ...)` resolves
    from code, arguments beyond `agent` and `name`, the result, same-invocation visibility in `state.children`,
    a lifecycle tool as a packed tool''s `uses` target. A run-time `agent` can select only declared relationships.'
  see_also:
  - tools-contracts#cls-07
  - published-api-extension-points#thread-06
  - safety-enforcement#gate-03
  - approval-human#approval-14
  - approval-human#approval-16
  - approval-human#identity-06
  - workflow-execution#wf-20
- id: coord-02
  relation: partial
  acs:
    concept: '`delegate.task` input (an untyped object) and the `accepted` output'
    refs:
    - schemas/capability_ontology.yaml `delegate.input_schema.task` (lines 1454-1456) and `output_schema.accepted`
      (lines 1509-1510)
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 753-762): on a waiting delegate, a delegation not accepted
      is R402'
    - 'spec/STANDARD-v1.1.0.md §5.12 (lines 659-672): literal `invoke` inputs are checked against the
      target (S303/S304, R402 at run time); no equivalent rule for `delegate`'
    - 'core/src/exec/machine.rs lines 1437-1444: the `accepted` check applies only when the step has `wait`
      and the workflow declares `wait@1`'
    - 'schemas/workflow_catalog.yaml workflow `multi_agent_orchestration` (lines 1686-1688): a plain delegate
      tests `accepted` in a failure mode'
    quote: 'description: Task to delegate'
  sa:
    concept: Persistent invocation arguments validated against the receiving agent's side A `requiredSchema`
    refs:
    - content/0.2.0/specification/subagents.md §5 (line 165), §5.1 Persistent Invocation Arguments (lines
      167-175), §5.2 Scoped Variable Bootstrap (lines 177-182)
    - content/0.2.0/infrastructure/runtime.md §7.4 Initial Payload Mapping (line 174), §7.5 Scoped Variable
      Bootstrap (lines 181-187)
    - content/0.2.0/specification/threads.md §6.1 Thread Arguments (lines 352-370)
    - 'content/0.2.0/specification/agents.md §1.2 SideConfig (lines 21-57): any side may be human-, prompt-
      or handler-backed'
    - '@standardagents/spec 0.45.10 index.d.ts lines 224-230 (`ToolResult.error_code`)'
    quote: The invocation arguments a subagent accepts are dictated solely by the *receiving* agent, through
      the `requiredSchema` of its side A prompt.
  explanation: 'SA defines a per-child task contract; ACS does not. The receiving agent''s side A `requiredSchema`
    governs: runtimes MUST validate creation arguments against it and persist them for the life of the
    child thread, and MUST reject creation with a structured `subagent_arguments_required` error when
    required arguments are missing (subagents.md §5.1). Levels differ: runtime.md §7.4 says ''should be
    validated'' (lower case), and exposing `arguments` at all is a SHOULD. No schema source is named for
    a child whose side A is handler-backed or human-backed. ACS `delegate.task` is `type: object` with
    no per-target schema, and the validator has no check like the one for literal `invoke` inputs. `accepted`
    other than `true` fails a step automatically only on a waiting delegate; on a plain delegate `accepted:
    false` is an ordinary output.'
  combined: 'Where the child''s side A is prompt-backed, its `requiredSchema` is the task contract. A
    creation rejected with `subagent_arguments_required` is a refused delegation: a waiting delegate''s
    host returns `accepted: false` and the executor raises R402; a plain delegate''s host answers `Error`
    with code R402, or the workflow tests `accepted` in a gate or failure mode. `subagent_env_required`
    (SHOULD-level) is a deferred creation, not a refusal: the bootstrap route stores the provided values
    and boots the deferred child from the original creation payload. Complete the bootstrap, or fail the
    step and ensure the request cannot complete later; never retry while it is open, since a retry delegates
    again and could leave two children. Detect both by `ToolResult.error_code`, else `status === ''error''`:
    the field is in the published types but, in the 0.2.0 text, only in a non-normative example (threads/runtime-streams.md).'
- id: coord-03
  relation: partial
  acs:
    concept: 'Waiting `delegate` (`wait@1` on a delegate step): delegate, then wait for that delegation''s
      result under a mandatory `timeout`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 719-736 and 753-775)
    - 'spec/STANDARD-v1.1.0.md §5.13, W608 rule (lines 777-790); §9 code table (line 1338: W608 `WAIT_SPANS_CHECKPOINT`,
      a warning)'
    - schemas/capability_ontology.yaml `delegate.output_schema.result` (lines 1533-1536)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces' (lines 145-148 and 201) and 'Driving
      a run yourself' (lines 258-289); guide to the reference executor, non-normative
    quote: then waits for that delegate's result. The delegation MUST return a string
  sa:
    concept: '`blocking: true` on a relationship; child result via a `sessionStop` binding or `state.stopSession({
      result })`'
    refs:
    - content/0.2.0/specification/subagents.md §3.3 Blocking and Create-or-Continue (lines 106-112), §6.2
      (lines 195-205)
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113), §7 Human-in-the-Loop
      Composition (line 171)
    - 'content/0.2.0/specification/threads.md §9.3 Parent Messaging (lines 526-542), §12 TypeScript Reference
      (lines 661-665: `stopSession` with `result?: string`)'
    - content/0.2.0/infrastructure/runtime.md §8.3 Status Updates (line 217), §11 Concurrency (line 239)
    - content/0.2.0/specification/handlers.md §4 Delivery Semantics (lines 62-65), §9 Worked Example (line
      137)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 105-114)
    - content/0.2.0/getting-started/examples.md §6 Composition (lines 737-990; non-normative example)
    quote: '`blocking: true` makes `subagent_create` await the child session''s close and return its result
      payload.'
  explanation: 'Same shape (start a delegate, suspend until its own result arrives), five differences.
    (1) An ACS wait MUST declare a `timeout` (S304) and a lapse is R401; SA states no bound for a blocking
    wait, and by inference from ''await the child session''s close'' a child parked in `awaiting_human`
    keeps the caller waiting. (2) ACS correlates by `task_id`; an SA blocking result is the call''s return
    value. (3) SA returns text plus copied attachments (coord-23); ACS expects an event object. (4) In
    the reference executor a completed wait invalidates earlier checkpoints, and W608 warns of a wait
    between a checkpoint and a step that needs one; SA has no checkpoint concept. (5) Run status `idle`
    is not session completion: it also covers `awaiting_human`, `hook_blocked`, `aborted`, `max_total_steps`,
    `max_side_steps` and `max_session_turns`, and reason codes are SHOULD-level. Searched (pages listed
    in the Standard Agent Specification findings): timeout, deadline (hook timeouts and code execution
    only).'
  combined: 'Recommended: a waiting delegate (`wait`, `timeout`) over a non-blocking relationship on a
    handler-backed owning side, driven as in coord-26; decide completion from an obtained result (coord-23),
    not from `idle`. If a blocking relationship is used: (a) still declare `wait` and `timeout`, because
    a plain delegate backed by a blocking child looks instantaneous to the executor, earlier checkpoints
    stay valid and W608''s protection is bypassed; (b) a late answer is still R401, but the host is inside
    the call and cannot terminate or escalate at the deadline; (c) not from a handler, which would hold
    its thread''s one-at-a-time delivery slot for the whole child session, as would polling `status()`
    inside one tool call or handler invocation. After the child returns, take a fresh checkpoint before
    any `mutate` or `send`.'
  see_also:
  - tools-contracts#eff-01
  - published-api-extension-points#thread-05
  - checkpoint-rollback-state#state-08
  - approval-human#approval-09
  - approval-human#wait-02
  - workflow-execution#wf-10
  - workflow-execution#wf-17
  - models-context-memory-security#reliability-01
- id: coord-04
  relation: partial
  acs:
    concept: Liveness of a waited-for delegate (`liveness`, R406) and replacement of a hung delegation
      (`replaces`)
    refs:
    - spec/STANDARD-v1.1.0.md §5.13 (liveness row, line 713; R406, lines 726-729; replacement, lines 762-774)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (`AwaitEvent` row, line 90; non-normative)
    quote: names the delegation it replaces (`replaces`, its `task_id`) so the host
  sa:
    concept: Thread run status (`status()`), registry status text (`setStatus`, `sessionStatus`), `stopSession()`,
      `execution.stop()` and `terminate()`
    refs:
    - content/0.2.0/specification/threads/execution-state.md §3 Controlling Execution (lines 57-70), §4
      Run Status (lines 72-122)
    - content/0.2.0/specification/subagents.md §6.3 (lines 207-209), §8 Queue and Termination (lines 239-244)
    - content/0.2.0/specification/threads.md §1.2.2 (line 98, `stopSession`), §8 Lifecycle (lines 467-478),
      §9.3 (line 540)
    - content/0.2.0/specification/threads/client-api.md §3.2 item 6 (line 55), §15 Stopping Execution
      (lines 397-407)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1925-1976 (`SubagentRegistryEntry`), line 2913 (`getChildThread`),
      lines 3381-3392 (`status()` comment)'
    quote: A lost execution settles to `failed` with reason `execution_lost`
  explanation: 'SA offers the raw material for ACS liveness, not the feature. Probe mode has a normative
    basis: runtimes MUST NOT leave a thread `running` once its executor is gone, so a child''s `status()`
    distinguishes a lost run from a slow one. Reason codes are SHOULD-level in general, though `execution_lost`
    is named in that MUST NOT bullet, and one such reading is one failed probe, not R406: ''a later recovery
    run sets `running` again''. Push mode is weaker: `sessionStatus` and `setStatus()` update ''the parent''s
    registry status text'' (a ''free-form label'' in the published types), the registry entry carries
    only `createdAt`, and the only timestamped child-to-parent signal is a message (`created_at`). For
    replacement, ''`terminate()` is the *only* soft-destruction path''. Whether a parent may call `stopSession()`,
    `execution.stop()` or `terminate()` on a child''s `ThreadState` is not stated (an open question);
    for `terminate()` it is inferred from the return type of `getChildThread()`.'
  combined: 'Probe: the host answers ACS liveness probes with `(await state.getChildThread(ref))?.status()`.
    `running` and `idle` (including reason `awaiting_human`) are live; consecutive `failed` readings with
    reason `execution_lost` count against `failure_threshold`, and only then is the answer `LivenessLost`
    (R406); `failed` with any other reason is runtime-defined and is reported as a failed delegation (R402).
    Push: a heartbeat is a `state.notifyParent(...)` message under `parentCommunication: ''explicit''`
    to a handler-backed owning side; `setStatus` alone cannot carry one. `replaces` (by the inference
    above): `(await state.getChildThread(oldRef))?.terminate()`, then create a new instance. Termination
    is permanent, though the thread stays readable. Whether a terminated instance still counts toward
    `maxInstances` is not stated, so do not set `maxInstances: 1` on relationships whose delegations may
    be replaced.'
  see_also:
  - workflow-execution#wf-10
  - workflow-execution#wf-17
- id: coord-05
  relation: partial
  acs:
    concept: '`delegate.fresh_context` and its attestation in `effective.fresh_context`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 (lines 917-923)
    - spec/STANDARD-v1.1.0.md §5.16, `require_fresh_context` row (line 978) and counting rule (lines 987-993)
    - schemas/capability_ontology.yaml `delegate.input_schema.fresh_context` (lines 1463-1466), `output_schema.effective`
      (lines 1517-1532)
    quote: '`delegate` accepts `fresh_context` (start the delegate without the'
  sa:
    concept: Thread isolation of a child, versus persistence, create-or-continue, and hooks that receive
      both thread states
    refs:
    - content/0.2.0/specification/subagents.md intro (line 3), §3.3 (lines 108-110), §4.1 Persistence
      Is Universal (lines 116-124), §6.1 Parent → Child (lines 186-193)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store', §14.1 Runtime Semantics item
      8 (line 357; the second of two sections numbered 14)
    - 'content/0.2.0/specification/hooks.md §1.1 (line 24), §1.3 Hook Scoping (lines 95-96), §7 TypeScript
      Reference (lines 525-529: `after_subagent_created` receives `state` and `childState`)'
    - content/0.2.0/specification/threads.md §2.3 (line 238, `setEnv` propagation); content/0.2.0/specification/tools.md
      §3 (line 63)
    - content/0.2.0/distribution/packaging.md 'PackedMeta' (lines 189-215)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6035-6044 (`after_subagent_created` comment)'
    quote: the thread remains addressable, and a later message starts a **new session with history intact**
  explanation: 'A new SA child starts without the parent''s conversation by structure: it runs in its
    own isolated thread, and nothing in 0.2.0 has the runtime copy the parent''s history into it. What
    crosses is explicit: creation arguments, the initial message and attachments, `scopedEnv`, and environment
    values propagated by `setEnv`. But code can carry context across: `after_subagent_created` receives
    both thread states (the published types suggest it for copying or linking metadata), and a child''s
    `parentHooks` run with the parent''s `ThreadState`. And instances persist: with `blocking: true` and
    `maxInstances: 1`, `subagent_create` MUST behave as create-or-continue, resuming an instance whose
    history holds earlier rounds, which is not fresh in the ACS sense; the call''s result is not specified
    to say which happened. SA has no flag that requests or reports a fresh context. Searched (subagents.md,
    threads.md, runtime.md §7 to §8): inherit, history, copied, context.'
  combined: 'Attest structurally: `effective.fresh_context: true` only when (1) the relationship is not
    `blocking: true` with `maxInstances: 1` (the only continue rule in 0.2.0), so a successful create
    cannot be a continue; (2) the host created the instance for this call and has not messaged it before;
    (3) creation arguments, initial message and attachments carry only the task; (4) neither the parent''s
    own `after_subagent_created` hooks nor the child''s disclosed `parentHooks` (`__meta.parentHooks`)
    copy parent history into the child. Otherwise `false`. Do not attest by comparing `state.children`
    before and after the call: same-invocation visibility is not stated. For reviewers that must be fresh,
    never use create-or-continue or reuse an instance through `subagent_message`.'
  see_also:
  - published-api-extension-points#thread-06
  - safety-enforcement#scope-01
  - checkpoint-rollback-state#state-12
  - approval-human#approval-06
  - workflow-execution#wf-16
  - workflow-execution#wf-20
  - models-context-memory-security#isolation-01
  - models-context-memory-security#secrets-03
- id: coord-06
  relation: acs_only
  acs:
    concept: '`delegate.read_only` and `effective.read_only` (the delegate may read but must not change
      anything)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 (lines 917-922)
    - spec/STANDARD-v1.1.0.md §5.16, `require_read_only` row (line 979)
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 760-761): a waiting delegate''s output is the delegation''s
      output with the event as `result`'
    - docs/guides/ORCHESTRATION_EXTENSIONS.md 'Delegation hints (`delegation@1`)' (lines 438-439)
    quote: standard does not say how a host enforces `read_only`, only that
  sa:
    concept: 'Not found: no read-only mode for a child thread and no declaration of a child''s side effects'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 221-230)
    - 'content/0.2.0/specification/threads.md §1.2.2 Resource Loading (lines 100-113): `loadModel`, `loadPrompt`,
      `loadAgent`, no tool loader'
    - content/0.2.0/specification/prompts.md §3.3 Sub-Prompt Tool Configuration (line 127); content/0.2.0/specification/models.md
      §1.2 (line 34, `providerTools`)
    - '@standardagents/spec 0.45.10 index.d.ts line 2888 (`loadAgent<T = unknown>`)'
    quote: '- Annotations **MUST NOT** change argument validation, execution, the tool''s results, or
      what is sent to the model.'
  explanation: 'Nothing in SA lets a parent ask for, or learn of, a child that cannot change state. Tool
    `annotations` are the only place an author could say that a tool only reads; they are non-normative,
    exist only on function tools, and are out of a parent''s reach: `ThreadState` has no tool loader,
    and a packed child''s internal tools and prompts ''in a package are hidden from outside''. ACS does
    not need SA to enforce read-only (''How a host keeps a delegate read-only is up to it''), but the
    host''s attestation needs a truthful basis, and 0.2.0 provides none. Searched (content/0.2.0, src/data,
    README.md): read_only, read-only, readOnly, side effect, destructive, mutat, sandbox, permission (unrelated
    hits only: ''(readonly)'' property notes, the TypeScript `readonly` keyword, ''read-only argument
    object'', side effects as the purpose of hooks and effects, ''non-destructively'' for the message
    APIs, ''requires mutation authorization'' for skills, the code-execution sandbox, user `permissions`).'
  combined: 'Default to `effective.read_only: false`. Attest `true` only for a child whose whole transitive
    definition the host owns and has classified: both sides'' prompts, sub-prompt tools, function tools,
    model `providerTools`, hooks, a handler, effects, thread endpoints and the child''s own subagent relationships.
    This is the host''s judgement, not an SA guarantee, and `loadAgent` returns an untyped value, so the
    shape inspected is the host''s assumption. Checking tool names in the child''s history afterwards
    is not enough: `effective` belongs to the delegation''s output, which precedes the result; code in
    hooks, handlers and effects leaves no tool-call message; grandchildren live in other threads; messages
    can be deleted. For verdicts needing a normative basis, prefer `decide()` (coord-10). For a packed
    third-party child attest `false`; a quorum with `require_read_only` then ignores that verdict, the
    fail-closed outcome ACS intends.'
  see_also:
  - published-api-extension-points#thread-06
  - safety-enforcement#gate-04
  - models-context-memory-security#secrets-03
- id: coord-07
  relation: partial
  acs:
    concept: '`delegate.model_family` / `role` and their attestation (`effective.model_family`, `effective.role`)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 (lines 917-923)
    - spec/STANDARD-v1.1.0.md §5.16, `require_model_families` row (line 981)
    - schemas/capability_ontology.yaml `delegate.input_schema.model_family`, `role` (lines 1467-1472)
    quote: 'Only an attested family covers one: `effective.model_family`, or the attested identity''s'
  sa:
    concept: The child's model is fixed by its prompts' `model` references; model `fallbacks`; no model
      recorded on messages
    refs:
    - content/0.2.0/specification/prompts.md §1.1 Required Properties (line 18), §3.3 (line 127)
    - content/0.2.0/specification/models.md §1.1 (line 19), §1.2 (lines 27-28), §3.1 Fallback Behavior
      (lines 42-48)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 9-38)
    - 'content/0.2.0/specification/providers.md §5 Response Format (lines 344-367: `metadata.model` optional),
      §9.3 ResponseSummary Structure (lines 533-540), §9.5 (line 566)'
    - content/0.2.0/specification/threads/decisions.md §4 Result Types (line 148)
    - src/data/home.md (line 13)
    quote: '| `fallbacks` | `string[]` | Names of fallback models to try if this model fails. |'
  explanation: 'ACS counts a requested model family toward a quorum only when the host attests it. In
    SA the parent cannot choose: each prompt names its model, so the family follows from which child agent
    is instantiated. Attestation is harder (see the Standard Agent Specification findings): a model may
    list `fallbacks` (SHOULD be tried in order), the message record has a `prompt` field but none for
    the model, `ProviderResponse.metadata.model` is optional, and no `ThreadState` API exposes the log
    records of providers.md §9; only `decide()` reports the resolved model. Nor is a child one model:
    both sides may be prompt-backed with different models, sub-prompt tools have their own `model`, and
    `includedProviders` routes through multi-provider gateways. SA has no model-family concept, and ACS
    `role` has no functional counterpart (a side `label` and a relationship name are descriptive only).
    Searched: model (messages.md: reasoning and model-context text only); family (models.md, providers.md:
    one prose use, ''model-family-specific'').'
  combined: 'Express model diversity structurally: one reviewer agent per model family (separate agent
    definitions whose prompts reference different models), with ACS `model_family` selecting the relationship;
    SA''s own principle is ''3. Agents should be coupled to a model.'' Attest `effective.model_family`
    only when every model definition reachable from the side that produces the result (its prompt, its
    sub-prompts, and all their `fallbacks`) maps to one family in a table the host maintains; otherwise
    omit it, and `require_model_families` fails closed. The family label is the host''s mapping, since
    the `model` string is whatever is ''sent to the provider API'' and may be an alias. Attest `effective.role`
    only when the host''s own relationship table assigns that role to the relationship; `effective` reports
    what the host used, not what was requested.'
  see_also:
  - published-api-extension-points#thread-06
  - workflow-execution#wf-20
  - models-context-memory-security#models-02
- id: coord-08
  relation: partial
  acs:
    concept: Principals, `accept_from`, the delegate's attested identity (`effective.identity`) and trust
      class `own_subagent_report`
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 (lines 923-940)
    - 'spec/STANDARD-v1.1.0.md §5.17 Sender Identity: identity fields (lines 1021-1030), ''Delegation''
      paragraph (lines 1063-1075)'
    - 'spec/RFC-0004-agent-identity.md ''Amendment: the delegate''s identity'' (lines 205-235)'
    - schemas/authority_trust_model.yaml `trust_classes.weights` (lines 32-40)
    - schemas/agent_identity_schema.yaml `authenticated_by` pattern (line 37)
    quote: run, never a sender the item's content claims.
  sa:
    concept: Owning-side perspective routing of child traffic, the message record's `subagent_id` fields,
      and the optional provenance metadata conventions
    refs:
    - content/0.2.0/specification/subagents.md §2.1 The Owning Side (line 53), §4.2 Registry (line 147),
      §6.2 (lines 195-205), §6.5 Provenance Metadata (lines 221-228)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 30-38), §1.1 Provenance
      Metadata Conventions (lines 40-49)
    - content/0.2.0/specification/threads/client-api.md §1 Scope item 3 (line 11), §12 Sending a Message
      (lines 334-370)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2006-2097 (`Message`), lines 2101-2130 (`InjectMessageInput`
      and `QueueMessageInput`), lines 2979-2980 (`notifyParent` comment)'
    quote: 'These are conventions, not requirements: consumers **MUST** tolerate their absence, and runtimes
      **MUST NOT** rely on them for routing correctness.'
  explanation: 'ACS requires the host to report the authenticated party that delivered each received item,
    and weighs an owner''s message (0.95) above the orchestrator''s own sub-agent report (0.7). In SA
    a non-blocking child''s result reaches the parent as a queued silent message on the owning side''s
    perspective: for a side A relationship, `role: ''user''`, the role of a person''s messages. Distinguishing
    signals: the text prefix, the `silent` flag, the optional `metadata.subagent_id` convention (SHOULD),
    and the record''s top-level `subagent_id` with projected `subagent_relationship` and `subagent_name`,
    which no sentence says when the runtime sets. In the published types code can set `metadata` and `silent`
    but not `subagent_id`; the Client API send body (`role`, `content`, `attachments`) accepts all three
    roles and a runtime MAY accept more fields, so imitation of a child report is not excluded (see the
    Standard Agent Specification findings). The record has no sender, author or principal field. Searched
    (messages.md, published `Message` type): sender, author, principal.'
  combined: 'For results ACS filters or counts, do not rely on message text or optional metadata: use
    the return value of a blocking `subagent_create`, or read the result from the child''s own thread
    through `state.getChildThread(reference)`; treat the top-level `subagent_id` as an observed signal
    0.2.0 does not guarantee. The principal is this integration''s convention (§5.15 leaves the mapping
    to the host): the child instance''s registry `reference`, namespaced (approval-human#identity-06,
    evidence-audit-observability#prov-03), so that a waiting delegate keeps only the result of the instance
    that took the delegation; two aliases (`as`) of one agent definition are then two principals, so a
    host that attests identities for `require_distinct_identities` also refuses reviewers that share a
    `SubagentRegistryEntry.name`. Report `kind: agent`, `trust_class: own_subagent_report` and an integration-owned
    `authenticated_by` value fitting the schema pattern, for example `x-acs.sa-child-thread`, not one
    in another project''s namespace. This attestation (§5.17) rests on SA''s MUSTs that lifecycle invocations
    for undeclared relationships are rejected and that parent/child lookup goes through `ThreadState`.'
  see_also:
  - tools-contracts#io-04
  - published-api-extension-points#hitl-01
