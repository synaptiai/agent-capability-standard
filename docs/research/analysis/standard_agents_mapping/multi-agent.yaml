- id: coord-20
  relation: acs_only
  acs:
    concept: 'Gating a delegation before it starts: effective `requires_approval` / `requires_checkpoint`
      on a `delegate` step (F502, F501)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 (lines 279-284), §5.14 Approval (lines 804-844)
    - 'schemas/workflow_catalog.yaml workflow `multi_agent_orchestration`, `delegate` step (lines 1674-1680):
      `requires_approval: true`'
    quote: 'declaration stricter than the ontology (e.g. `requires_approval: true` on'
  sa:
    concept: No pre-spawn decision point for a model-initiated `subagent_create`; `hidden` relationships
      and handler-backed sides keep spawning in code
    refs:
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (line 24), §3.3 Note (line 273), §5.1
      `tool_call_started` (lines 367-384), §5.5 `tool_call_done` (line 440)
    - 'content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 113: `hook_blocked`)'
    - content/0.2.0/infrastructure/runtime.md §7.3 Optional + Immediate + Hidden Branches (lines 139-143)
    - content/0.2.0/specification/subagents.md §1 (line 45, `hidden`), §2.5 Visibility (lines 80-84),
      §3.1 (lines 88-94), §5 (lines 157 and 163)
    quote: '- `hidden`: the relationship stays declared and spawnable by runtime code (`invokeTool`/`queueTool`
      from hooks, tools, and handlers), but the tool **MUST NOT** appear in any LLM request''s tool list'
  explanation: 'ACS can require approval or a checkpoint before a `delegate` step runs and fails the step
    otherwise. SA has no hook that runs before a child is created and can refuse it: the only subagent
    hook is `after_subagent_created`, and `tool_call_started` is observational (''The return value **MUST**
    be ignored; the hook cannot modify the tool call.''). Two passages look like gates and provide none
    for spawning (see the Standard Agent Specification findings): the hooks.md §3.3 Note on request-context
    policy gates is optional and gates a whole model request, and nothing defines what sets the stop reason
    `hook_blocked`. hooks.md says tool-call hooks fire ''exactly once per tool call'' with no exempt tool
    class and is silent on calls made from code. So when a model on a prompt-backed side calls `subagent_create`,
    0.2.0 guarantees a grounded agent no point at which to refuse. Searched (hooks.md): invokeTool, queueTool,
    lifecycle tool, subagent_create (no hits).'
  combined: 'Spawn only from deterministic code. (a) Preferred: a handler-backed owning side whose handler
    runs the ACS checks (valid checkpoint, approval decision) before creating the child. (b) On a prompt-backed
    side: declare every relationship `hidden: true`, so that no lifecycle tool is injected (injection
    happens only for a side with non-hidden relationships), and give the prompt a function tool whose
    `execute` runs the checks, then creates the child. Mixing hidden and visible relationships is not
    a safe gate: the lifecycle tools are then injected, and the rejection rule covers ''undeclared or
    disabled relationships'', not hidden ones. Split the wrapper into request and resume around a saved
    run (coord-26), since an out-of-band approval can take hours. Unspecified: the creation call (coord-01),
    a lifecycle tool in a packed tool''s `uses`, and which side''s relationships a code-initiated call
    resolves against. That hidden relationships stay spawnable by code rests on a lower-case ''should''
    list (runtime.md §7.3).'
