- id: coord-24
  relation: partial
  acs:
    concept: Lifetime of delegations relative to the run that made them
    refs:
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 771-774): descriptive text in the replacement rule, no requirement
      keyword'
    - spec/STANDARD-v1.1.0.md §5.14 deferral rule 2 (lines 856-859)
    quote: whose delegations name none of the earlier run's; the host ends those
  sa:
    concept: '`terminate()` of a thread, an undefined ''parent teardown policy'', and cascading deletion
      through the Client API'
    refs:
    - content/0.2.0/specification/subagents.md §4.1 (lines 120-121), §8 (lines 239-244)
    - content/0.2.0/specification/threads.md §8 Lifecycle (lines 467-478)
    - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (lines 227-235)
    - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread (lines 275-299)
    quote: '- **Only explicit termination destroys an instance**: `state.terminate()`, operator action,
      or a parent teardown policy.'
  explanation: 'ACS says, descriptively and for one case (a calling workflow''s loop that runs an `invoke`
    again), that the host ends the earlier nested run''s delegations ''with the run they belong to'';
    it uses no MUST or SHOULD. SA deliberately specifies the opposite default: child threads outlive sessions,
    and ''Runtimes **MUST NOT** destroy or orphan child threads on any session-finalization path.'' For
    the abnormal case SA is specific only about Client API deletion, whose deletion set is the addressed
    thread and every descendant, with executions in flight aborted. What `terminate()` on a parent does
    to running children is not stated (threads.md §8 and runtime.md §10 cover only the terminated thread
    and its own parent''s registry), and the ''parent teardown policy'' is named once and never defined
    (see the Standard Agent Specification findings). Searched: teardown, descendant, orphan, cascade (other
    hits: environment propagation, the deletion set, the no-orphaning rule, message deletion).'
  combined: A host that wants the ACS behaviour ends children explicitly. When an ACS run ends or is abandoned,
    iterate the references it recorded for that run and call `(await state.getChildThread(ref))?.terminate()`
    for those still `running` (calling `terminate()` on a child's `ThreadState` is an inference from the
    return type of `getChildThread()`). Recurse through each child's own `children`, since terminating
    a child says nothing about its children. Persist the list of outstanding references with the run,
    so that a later sweep can clean up if the parent's execution is lost. Do not rely on terminating the
    parent thread to stop its children.
- id: coord-25
  relation: sa_only
  acs:
    concept: Not found for most flags; nearest are step `condition` (for `optional`) and trigger kinds
      (for `immediate`)
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 step fields (line 250, `condition`)
    - spec/STANDARD-v1.1.0.md §5.10 Triggers (line 574)
    - 'spec/RFC-0003-orchestration-extensions.md ''Open questions'' (lines 324-331): placement of a delegated
      step is out of scope'
    quote: '| `kind` | `schedule`, `event`, `manual`, `invoke` |'
  sa:
    concept: 'Relationship flags without an ACS counterpart: `immediate`, `optional`, `hidden`, `scopedEnv`,
      and the agent flag `primary`'
    refs:
    - content/0.2.0/specification/subagents.md §1 property table (lines 33-45), §3.2 Immediate Spawning
      (lines 96-104)
    - content/0.2.0/infrastructure/runtime.md §7.3 Optional + Immediate + Hidden Branches (lines 137-145)
    - content/0.2.0/specification/agents.md §2.2 (line 88, `primary`), §8 Definition-Time Errors (lines
      193-205)
    - content/0.2.0/specification/hooks.md §1.1 (line 24); content/0.2.0/specification/threads.md §1.2.1
      (line 44, `children`)
    quote: '| `immediate` | Spawn at **thread creation**, before any side takes a turn'
  explanation: 'These flags configure composition, not a single act of delegation, and ACS has no place
    for them. `immediate` creates a child before any turn, with no step that could be gated or audited.
    The pages differ in level on recursion: ''Immediate spawning is recursive'' (subagents.md §3.2) against
    ''Immediate spawning should be recursive across activated child threads.'' (runtime.md §7.3, in a
    list introduced by ''Runtimes should evaluate relationship flags before exposing/executing them:'').
    No rule rejecting a cycle of immediate relationships was found among the definition-time errors (agents.md
    §8). `optional` enables a relationship from an environment flag, roughly an ACS step `condition`.
    `hidden` removes a relationship from the model''s tool surface but keeps it available to code. `scopedEnv`
    carries ''Environment values copied into the child thread; runtime-only transfer data.'' `primary`
    only affects agent pickers.'
  combined: '`hidden` is the flag a grounded binding uses (coord-20). Avoid `immediate` for children that
    can mutate: they exist before any ACS run does, so no checkpoint or approval can precede their creation.
    The parent learns of them through `state.children`, and through an `after_subagent_created` hook if
    that hook fires for immediate spawns, which the text does not state. Map `optional` to an ACS step
    `condition` so that the workflow and the relationship agree on whether delegation is possible; an
    ACS condition cannot read SA environment values, so the host passes the flag''s resolved value in
    as a workflow input. Keep `scopedEnv` values out of ACS evidence and audit records.'
- id: coord-26
  relation: fits
  acs:
    concept: Suspending and resuming a run between actions (`snapshot`, `restore`, `tick`), with deadlines
      carried in the actions
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md introduction (lines 10-14), 'Actions and responses' (lines 81-92),
      'Driving a run yourself' (lines 258-289); guide to the reference executor, non-normative
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 777-781: a wait can last hours and the run may resume elsewhere)'
    - 'core/src/exec/mod.rs (lines 670-689: `snapshot` and `restore`)'
    quote: driving it. Use it to run actions asynchronously, across processes, or
  sa:
    concept: Durable per-thread key-value store, one handler turn per inbound message, and delayed effects
    refs:
    - content/0.2.0/specification/threads.md §4.1 Scheduling Effects (lines 284-300), §7 Durable Key-Value
      Store (lines 408-433)
    - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (lines 27-38), §11 Concurrency (line
      239), 'Durable Key-Value Store' §14.1 items 1 and 2 (lines 350-351)
    - content/0.2.0/specification/handlers.md §3 Execution Model (lines 44-55), §4 Delivery Semantics
      (lines 57-67), §9 (line 137)
    - content/0.2.0/specification/effects.md §1.1 (line 13), §3 Execution Semantics (lines 81-90)
    quote: '- **MUST** enqueue effects asynchronously for execution.'
  explanation: 'A synthesis: neither specification describes the pattern. The ACS reference executor is
    built to be suspended: it does no I/O, exposes one pending action at a time and saves a run as a snapshot
    (canonical JSON, SHA-256, optional HMAC) restorable against the same catalog. These are properties
    of the reference implementation and its guide, not of the Standard. SA offers matching pieces with
    normative backing: a key-value store whose values MUST survive execution boundaries, process restarts
    and runtime redeploys; exactly-once, in-order handler delivery; and effects that runtimes MUST enqueue,
    whose `args` they MUST preserve until execution, and that take a `delay`. Together they let hours-long
    ACS waits pass without holding a thread''s single execution slot (needed by coord-03, -04, -12, -16,
    -20, -22). Not stated: whether an effect counts as a ''flow'' under runtime.md §11, and so may run
    while a turn of the same thread is in flight.'
  combined: 'After each action that cannot be answered within the turn (`AwaitEvent`, an out-of-band `RequestApproval`,
    `Sleep`), store the signed snapshot with `state.setValue(...)`, end the turn, and restore the run
    on the next inbound message on the owning side: a child''s completion, a person''s reply, or a tick.
    For the action''s deadline or a liveness interval, call `state.scheduleEffect(name, args, delayMs)`
    with an effect that only queues a tick message, so that the run is touched only inside a turn; on
    a tick, call the run''s `tick(now)` and handle R401 or R406. Keep the snapshot''s HMAC key outside
    the thread''s own storage (for example in `instanceEnv`, an optional capability): any code holding
    the thread''s `ThreadState` can write its key-value store. Precondition: an executor callable from
    the SA process (ACS gap: a TypeScript or WebAssembly build), or a host outside the runtime (coord-27).'
  see_also:
  - tools-contracts#eff-01
  - published-api-extension-points#handler-01
  - published-api-extension-points#options-01
  - published-api-extension-points#thread-04
  - published-api-extension-points#thread-07
