- id: coord-09
  relation: acs_only
  acs:
    concept: 'Review quorum (`quorum@1`): a blocking `constrain` step that counts typed verdicts from
      independent reviewer delegations'
    refs:
    - spec/STANDARD-v1.1.0.md §5.16 Quorum (lines 942-1005)
    - 'spec/STANDARD-v1.1.0.md §5.5 (lines 357-360): the executor runs a quorum itself'
    - schemas/review_verdict_schema.yaml (`reviewer_id`, `value`, `pinned`, `scope`)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', bullet 'Quorums' (lines 237-243;
      non-normative)
    - 'core/src/exec/quorum.rs (line 2); core/src/exec/machine.rs (lines 1641-1644: a waiting delegate''s
      `result` is the delivered event)'
    quote: '| `reviewers` | Required: `store_as` names of `delegate` steps that run before this one (else
      V107), delegating to distinct agents when the agents are literal (else F504) |'
  sa:
    concept: 'Not found: no quorum, voting or verdict construct; the parts (several children, results,
      registry) exist'
    refs:
    - content/0.2.0/specification/subagents.md (whole file)
    - content/0.2.0/specification/handlers.md §4 Delivery Semantics (line 67)
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (line 110), §9.2 Worker / Reviewer (lines
      221-256)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 152)
    - content/0.2.0/specification/threads/messages.md §1 (line 17, `tool_calls`)
    quote: Cross-thread fan-in ordering (two children queueing toward the same parent handler) is implementation-defined;
      only per-thread persistence order is guaranteed.
  explanation: 'SA has no construct that counts independent results, pins them to a reviewed artefact
    or checks reviewer independence. ACS''s rules are specific: one verdict per reviewer, pinned to `pinned_to`,
    in the vocabulary, with `min_pass`, vetoing `blocking_values`, optional `min_full`, and independence
    conditions that count only when the host attests them. The ACS executor makes the count, not the host:
    ''The executor evaluates it itself; there is no host call.'' For a reviewer that is a waiting delegate,
    the executor takes `result` from the event the host delivers. SA supplies usable parts: several child
    threads with isolated history, a closed set of declared relationships, and results returned to the
    parent. Searched (content/0.2.0, src/data, README.md): quorum, consensus, vote, voting, verdict, attest,
    majority, tally (no matches apart from the letters ''tally'' inside ''incrementally'').'
  combined: 'One relationship per reviewer, each targeting a distinct agent definition, on a side deterministic
    code controls (coord-20). Each reviewer gets a stop tool whose `args` schema is the verdict (`value`,
    `pinned`, `scope`, notes), which runtimes MUST validate; obtain the verdict as in coord-23 (`execute`
    calls `state.stopSession({ result: JSON.stringify(verdict) })`, or the parent''s host reads the call''s
    arguments from the child''s history), not through a `messageProperty` binding, which carries one unvalidated
    model-written string. The host sets `reviewer_id` to the step''s `agent` (the relationship name) and
    wraps the verdict in the event it delivers to that reviewer''s waiting delegate, where the workflow''s
    `verdicts` references point. The count runs in the ACS executor, outside the SA runtime (coord-27)
    until a TypeScript build exists (ACS gap). No model may tally; join logic must not depend on arrival
    order. Per-reviewer attestation: coord-05 to coord-08.'
  see_also:
  - tools-contracts#cls-11
  - tools-contracts#io-04
  - approval-human#approval-20
- id: coord-10
  relation: fits
  acs:
    concept: 'Quorum independence conditions: `require_fresh_context`, `require_read_only`, `require_model_families`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.16, rows `require_fresh_context`, `require_read_only`, `require_model_families`
      (lines 978-981) and the counting rule (lines 987-1005)
    - docs/guides/RUNNING_WORKFLOWS.md introduction (line 10; guide to the reference executor, non-normative)
    quote: 'Every reviewer binds `fresh_context: true` (F504 otherwise)'
  sa:
    concept: '`ThreadState.decide()`: typed questions evaluated against caller-supplied context only'
    refs:
    - content/0.2.0/specification/threads/decisions.md §2 Request Types (lines 32-61), §3 Question Types
      (lines 66-101), §4 Result Types (lines 103-151), §6 Conversation Semantics (lines 200-210)
    - content/0.2.0/infrastructure/runtime.md §1.1 Decision Inference (lines 19-25)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1321-1323 (`DecideOptions`), line 3401 (`ThreadState.decide`)'
    quote: '- read conversation messages to assemble context;'
  explanation: '`decide()` is not delegation, and SA does not present it as a review mechanism; that reading
    is this mapping''s. It is the one SA surface with a normative basis for the properties ACS asks a
    host to attest and that SA subagents lack: ''Invoking `decide()` **MUST NOT** implicitly:'' read conversation
    messages, change them, ''execute tools;'' or start a conversational turn, and its result reports the
    model that performed the evaluation, with the resolved version when the request uses an alias. A `choice`
    question maps directly onto a quorum vocabulary. Limits: it evaluates only the context passed in and
    runs no tools, so it suits verdicts over supplied material, not reviews that must explore a repository.
    That it is a single model call is an inference, not a statement in the text.'
  combined: 'An option, not the default: whether a `decide()` call satisfies §5.16''s ''delegating to
    distinct agents'' is an open ACS question. The reference executor leaves the performance of a capability
    call to the host (''The executor does no I/O.'', a guide statement), so a host may answer a reviewer''s
    `delegate` call with `state.decide({ provider, model, context: <the pinned change>, questions: { verdict:
    { type: ''choice'', instructions, options: { approve: ..., request_changes: ..., abstain: ... } }
    } })`. On the strength of decisions.md §6 it can then attest `effective.read_only: true` and, provided
    it passes nothing but the pinned change as `context`, `effective.fresh_context: true`. `DecisionResult.model`
    is a provider model identifier, so `effective.model_family` is still the host''s mapping, and a decision
    provider for each required family is a deployment matter. The host, not the reviewer, writes `pinned`
    and `reviewer_id` into the verdict.'
  see_also:
  - published-api-extension-points#thread-06
  - safety-enforcement#gate-04
  - models-context-memory-security#secrets-03
- id: coord-11
  relation: sa_only
  acs:
    concept: 'Not found as a primitive: a two-party review loop inside one execution context (nearest:
      a `critique`/`verify` step with a bounded recovery loop)'
    refs:
    - 'spec/STANDARD-v1.1.0.md §5.16 (lines 965-971): quorum reviewers must be `delegate` steps to distinct
      agents'
    - 'spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 638-693): `goto_step`, `max_loops`'
    quote: '`quorum` is allowed only on `constrain` with literal'
  sa:
    concept: 'Dual-agent composition: two prompt-backed sides of one agent (worker and reviewer) sharing
      one thread'
    refs:
    - content/0.2.0/specification/agents.md §1.3 Derivations (line 66), §9.2 Worker / Reviewer (lines
      221-256; an example)
    - content/0.2.0/getting-started/examples.md §7 Dual AI agents (lines 992-1239; non-normative; the
      sentences quoted below are at lines 1233 and 1237)
    - content/0.2.0/infrastructure/runtime.md §4 Context Assembly (lines 77-80)
    - content/0.2.0/specification/threads.md §1 Thread Definition (line 18)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 113)
    quote: Two prompt-backed sides can ping-pong indefinitely, and a handler that replies to every inbound
      message can livelock against a prompt side just as hard
  explanation: 'SA lets two models converse as the two sides of one agent, with `maxSessionTurns` as an
    optional cap. The example page adds, non-normatively, that with a `sessionStop` binding on side B
    only the reviewer can end the session, and that ''The two sides share the thread''s file system.''
    (also inferable from a thread having ''isolated storage for messages and files''). ACS has no two-sided
    agent; its ''reviewer'' is a quorum''s reviewer delegation. The pattern is not an ACS quorum: the
    reviewer sees the worker''s turns as `user` messages in the same thread (though ''opposite-side tool
    calls are not directly visible'') and shares its files, so it is neither a separate delegation nor
    independent, and there is one reviewer. Searched (spec/STANDARD-v1.1.0.md): dual, two-sided, handoff,
    side (other than ''side effects'' and ''outside'').'
  combined: 'Treat a prompt-by-prompt child as a single ACS delegate with one principal: it contributes
    at most one verdict to a quorum, and its internal review does not satisfy `require_fresh_context`.
    `maxSessionTurns` resembles ACS `max_loops` (a bound on rework rounds) by analogy only: reaching it
    settles the run as `idle` with reason `max_session_turns`, not as a failure, so the host must treat
    a child that stopped on the cap without a result as failed. Where ACS independence is required, use
    separate child threads (coord-09) rather than two sides of one thread.'
  see_also:
  - workflow-execution#wf-10
  - workflow-execution#wf-17
  - models-context-memory-security#reliability-01
- id: coord-12
  relation: partial
  acs:
    concept: '`parallel_group` and `join` on workflow steps'
    refs:
    - 'spec/STANDARD-v1.1.0.md §4.3 (lines 159-161), §5.2 step fields (lines 256-257), §10.3 Conformance
      Testing (lines 1427-1431: runtime fixtures are informative)'
    - spec/EDGE_TYPES.md 'Runs before' (lines 15-18)
    - 'docs/GLOSSARY.md ''Parallel Group'' (lines 300-303): `all_complete`, `any_complete`'
    - schemas/workflow_catalog.schema.json (line 334)
    - 'core/src/exec/mod.rs (line 736: run state invariant, one pending action)'
    quote: '| `parallel_group` | string | Group ID; steps of one group run concurrently |'
  sa:
    concept: 'Concurrency rules: sequential tool execution within a thread, concurrency across threads,
      non-blocking children'
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88), §11 Concurrency (line 239)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153)
    - content/0.2.0/specification/prompts.md §1.2 (line 28, `parallelToolCalls`)
    - content/0.2.0/specification/handlers.md §4 (lines 62 and 67)
    - content/0.2.0/specification/subagents.md §4.2 (line 140, `spawnGroupId`)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 105-114)
    quote: A single thread **MUST NOT** execute multiple concurrent flows. Cross-thread concurrency is
      allowed.
  explanation: 'ACS uses `parallel_group` mainly as a static ordering fact (group members do not ''run
    before'' each other). At run time it means little (see the Agent Capability Standard findings): `join`
    is a string whose values appear only in the glossary and a schema example, conformance levels cover
    validation only, and the reference executor holds one pending action and reads neither field, so members
    run in list order. SA is explicit: within a thread ''Tool calls **MUST** execute sequentially in the
    returned order.'', even where a prompt sets `parallelToolCalls`; concurrency exists only across threads.
    ACS puts no MUST on executors, so there is no conflict, but running members concurrently inside one
    SA thread would contradict SA''s MUST. SA has no join primitive. Searched: parallel, join (core/src/exec:
    Rust string joins only); join, wait for all, fan-out, fan-in (SA: only the handlers.md §4 fan-in sentence
    and unrelated example code).'
  combined: 'Local group members run in list order inside the thread, a valid schedule for every ACS static
    rule. The reference executor issues one action at a time, so it cannot drive a group concurrently
    (workflow-execution#wf-18); a host that schedules a group itself, without that executor, makes each
    member a non-blocking child and implements the join in code: `all_complete` when a result has been
    obtained for every member (coord-23), with `failed` runs and `idle` runs that produced no result (turn
    cap, abort, hook block) counted as member failures. Drive the join from completion messages plus a
    deadline effect (coord-26) rather than a polling loop, and do not let it depend on arrival order.
    Do not use `blocking: true` for group members: sequential tool execution would serialise them. `spawnGroupId`
    is listed on the registry entry without stated semantics, so do not rely on it to identify a group.'
  see_also:
  - workflow-execution#wf-10
  - workflow-execution#wf-17
  - workflow-execution#wf-18
  - models-context-memory-security#reliability-01
- id: coord-13
  relation: partial
  acs:
    concept: '`conflicts_with` edges (mutate/rollback, persist/rollback): the pair may not share a `parallel_group`
      (F504)'
    refs:
    - spec/STANDARD-v1.1.0.md §4.3 enforcement table (line 170)
    - schemas/capability_ontology.yaml edges (lines 2021-2036)
    - spec/EDGE_TYPES.md §5 `conflicts_with` (lines 138-158)
    quote: The two capabilities never share a `parallel_group`; in sequence they are allowed
  sa:
    concept: Per-thread serialisation of steps, tool calls and handler turns; isolated per-thread storage
    refs:
    - content/0.2.0/infrastructure/runtime.md §1 Overview (lines 9-13), §5.1 (line 88), §11 (line 239),
      'Durable Key-Value Store' §14.1 item 3 (line 352)
    - content/0.2.0/specification/handlers.md §4 (line 62)
    - content/0.2.0/specification/threads.md §1.3 Access Contexts (lines 178-186), §4 Effect Scheduling
      (lines 276-280)
    - content/0.2.0/specification/effects.md §1.1 (line 13), §3 (line 90)
    quote: Tool calls **MUST** execute sequentially in the returned order.
  explanation: 'Different layers. ACS rejects at validation time workflows that would run conflicting
    capabilities concurrently; SA guarantees at run time that a thread executes one step at a time, runs
    tool calls sequentially and never invokes a handler concurrently for the same thread, so conflicting
    capabilities implemented as tool calls or handler code in one thread cannot overlap. The guarantee
    is not stated for everything that touches a thread: effects ''Run **independently** of the conversation
    flow'' and may run after the invoking conversation has completed, and thread endpoints receive a `ThreadState`
    at rest; whether either counts as a ''flow'' under runtime.md §11 is not stated. Between a parent
    and its children SA isolates thread storage (messages, files, key-value store) but is silent on external
    state that sibling children might both change, where an ACS conflict could still materialise.'
  combined: Keep F504 as a design-time check in the ACS validator. At run time, keep capabilities that
    conflict over the same state in one thread and implement them as tool calls or handler code, where
    SA serialises them. Do not implement `rollback`, `mutate` or `persist` as an effect or a thread endpoint
    that could run beside a turn, and do not split a `mutate` and a `rollback` of the same external resource
    across sibling non-blocking children.
  see_also:
  - tools-contracts#eff-01
  - published-api-extension-points#consume-01
  - published-api-extension-points#thread-01
  - safety-enforcement#ckpt-02
  - safety-enforcement#edge-02
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-08
  - checkpoint-rollback-state#state-09
  - checkpoint-rollback-state#state-16
  - checkpoint-rollback-state#state-21
  - approval-human#approval-10
- id: coord-14
  relation: acs_only
  acs:
    concept: '`synchronize` capability: reach state agreement across a list of agents'
    refs:
    - schemas/capability_ontology.yaml node `synchronize` (lines 1539-1608)
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 719-720: a waiting synchronize needs a literal list of at
      least two distinct agents), §5.15 (`accept_from`, lines 923-930), §5.5 (lines 357-360: the executor
      runs a wait on `synchronize` itself)'
    - 'core/src/exec/machine.rs (lines 1645-1650: `agreed_state` from one event''s `canonical`, `participants`
      from the step''s `agents`)'
    - 'grounded_agency/coordination/synchronization.py (reference SDK only: barrier with merge strategies)'
    quote: 'description: Achieve state agreement across agents'
  sa:
    concept: 'Not found: no state-agreement primitive; key-value state is deliberately not shared between
      threads'
    refs:
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store', §14.1 Runtime Semantics items
      3 and 8 (lines 352 and 357)
    - content/0.2.0/specification/threads.md §2.3 (line 238, `setEnv` propagation), §7.2 Semantics (lines
      424-433)
    - content/0.2.0/specification/subagents.md §5 (line 161, `subagent_message`), §6.1 (line 189)
    - content/0.2.0/specification/handlers.md §6 Capabilities (line 83)
    quote: 8. Values **MUST NOT** be automatically copied, inherited, or synchronized between threads
      when subagents are spawned.
  explanation: 'No SA mechanism collects acknowledgements or yields an agreed state: `setEnv` is one-way
    (''writes to thread storage and propagates recursively to active descendants''), and `subagent_message`
    queues a message to one existing instance. The quoted rule concerns key-value values only and does
    not rule out synchronisation in general. ACS `synchronize` is itself loosely specified (inputs `agents`
    and `state`; outputs `synchronized`, `agreed_state`, `participants`); the barrier and merge strategies
    exist only in the reference Python SDK. For a waiting `synchronize` the executor, not the host, produces
    the output: the reference executor builds `agreed_state` from one delivered event''s `canonical` field
    and `participants` from the step''s `agents` input. Searched (content/0.2.0): synchron, consensus,
    agree, barrier (besides ''asynchronous'' and the quoted rule, unrelated hits only, such as a client
    that ''resynchronizes'', sandbox ''barriers'' and a ''package/runtime agreement'').'
  combined: 'For a waiting `synchronize`, the host''s job is to deliver one event whose `canonical` holds
    the agreed state; any fan-out must happen before that event is delivered. For a `synchronize` that
    does not wait, the host performs the whole capability. Either way the agreement protocol is host code:
    send the proposed state to each participant with `(await state.getChildThread(ref))?.queueMessage({
    role: ''user'', content })` (the typed route; the arguments of `subagent_message` beyond `agent` are
    not specified), collect each answer by reference from the participant''s own thread (coord-22), and
    compute the agreed state in the host. Use `setEnv` only for configuration every active descendant
    should see. SA gives no atomicity or agreement guarantee, so the host''s output is the only evidence
    that agreement was reached.'
- id: coord-15
  relation: partial
  acs:
    concept: '`invoke` capability: run another workflow as a nested run that shares the caller''s checkpoints;
      cycles rejected (V105)'
    refs:
    - schemas/capability_ontology.yaml node `invoke` (lines 1609-1644) and edge `delegate specializes
      invoke` (lines 2105-2108)
    - spec/STANDARD-v1.1.0.md §5.12 (lines 659-672), §5.13 (lines 785-790), §5.11 Handler Steps (lines
      607-626)
    - 'docs/guides/RUNNING_WORKFLOWS.md ''What the executor enforces'', bullet ''Invocations'' (lines
      230-236): nested at most four deep in the reference executor'
    - 'grounded_agency/coordination/delegation.py (lines 113-119 and 209-211: `max_delegation_depth`,
      default 10; reference SDK only)'
    quote: run it invokes shares the caller's checkpoints, so its waits invalidate
  sa:
    concept: Prompt tools (nested sub-prompts in the same thread) and `state.invokeTool()` with a tool's
      `uses` list
    refs:
    - content/0.2.0/specification/tools.md §1 Tool Categories (lines 5-13), §2.1 Tool Dependencies (lines
      36-44), §4 Prompt Tool Configuration (lines 66-79)
    - content/0.2.0/specification/prompts.md §2.4 Include Resolution (line 89), §3.3 Sub-Prompt Tool Configuration
      (lines 127-168)
    - content/0.2.0/specification/threads.md §3.2 Direct Invocation (lines 260-272)
    - content/0.2.0/specification/threads/execution-state.md §2.1 Prompt Path (lines 34-41)
    quote: '| Prompt tool | Nested prompt invocation | `definePrompt()`, named in another prompt''s `tools`
      |'
  explanation: 'Both are synchronous nested invocations that stay in the caller''s context, as opposed
    to delegation to a separate one. The ontology''s ''Delegation is specialized invocation to agents''
    parallels SA''s three tool categories (function tool, prompt tool, agent tool). The targets differ:
    an ACS `invoke` runs a workflow with declared inputs and statically checked bindings; an SA prompt
    tool runs a model call whose output is serialised into one text string. ACS rejects invoke cycles
    at validation time, its reference executor limits nesting to four runs, and its reference SDK caps
    chained delegations. For SA sub-prompts and subagent graphs no cycle or depth rule was found. Searched:
    cycle, circular, recursi, depth (circular prompt includes are rejected; ''recursive'' describes immediate
    spawning and `setEnv` propagation; ''depth'' is a message filter).'
  combined: 'When an ACS workflow runs inside one SA thread, `invoke` stays internal to the ACS executor
    and needs no SA surface. In the other direction, classify an SA prompt-tool call by what the sub-prompt
    does (for example `generate` or `classify`) rather than as `invoke`, unless its target is itself an
    ACS workflow. A tool''s `uses` list is the nearest SA analogue of ACS''s static invoke graph: ''When
    a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside the list.''
    Only packed tools must declare it, and an ACS-side checker can read it only at build time from the
    package''s tool definitions, since `ThreadState` has no tool loader.'
  see_also:
  - workflow-execution#wf-19
- id: coord-16
  relation: fits
  acs:
    concept: '`inquire` capability (produce clarifying questions), with the answer arriving through `receive`'
    refs:
    - schemas/capability_ontology.yaml node `inquire` (lines 1645-1703) and edge `inquire enables receive`
      (lines 1849-1852)
    - spec/STANDARD-v1.1.0.md §5.13 (wait on `receive`, lines 695-736), §5.17 (lines 1032-1061; always-ask
      row, line 1048)
    quote: 'rationale: An inquiry''s answer arrives through receive'
  sa:
    concept: 'Human-backed side: the session parks awaiting human input; `awaiting_human` registry status
      for children'
    refs:
    - content/0.2.0/specification/agents.md §1.1 The Three Backings (lines 9-19), §7 Human-in-the-Loop
      Composition (lines 169-191)
    - content/0.2.0/specification/subagents.md §4.3 Human-in-the-Loop Children (lines 151-153)
    - content/0.2.0/specification/threads/execution-state.md §4.1 to §4.2 (lines 91-114)
    - content/0.2.0/specification/handlers.md §6 Capabilities (line 84)
    - 'content/0.2.0/specification/threads.md §1.2.1 (line 42, `userId`), §1.2.2 ''User identity'' (line
      159, `user()`); content/0.2.0/specification/users.md (line 3: ''Status: draft proposal'')'
    - content/0.2.0/specification/threads/client-api.md §3.1 item 6 (line 46), §12 (lines 341-345)
    quote: The specification deliberately does **not** define who the person is or how their input arrives
  explanation: 'ACS separates asking from waiting: `inquire` only produces structured questions with an
    ambiguity analysis and evidence; a later `receive` wait collects the answer, optionally filtered by
    sender. SA makes waiting a runtime fact: at a human-backed side''s turn the session parks and resumes
    on that side''s inbound message, and such a child shows `awaiting_human` in the parent''s registry.
    SA defines no question or answer format and leaves the person''s identity to the runtime: the thread''s
    user is available (`userId`, `user()`; the Users page is a draft), but the message record has no field
    for the caller or route that delivered a message, the send route accepts `role: ''user'' | ''assistant''
    | ''system''` from any caller the thread access policy admits, and a message queued by code looks
    the same. ACS has no parked session visible to a parent. Searched (spec/STANDARD-v1.1.0.md): park,
    awaiting, paus (only the failure action `pause_and_checkpoint`).'
  combined: 'Deterministic code posts the questions: from a handler-backed side A opposite a human-backed
    side B, `state.injectMessage({ role: ''assistant'', content })`, then save the run and end the turn
    (coord-26). The session parks; the person''s reply arrives as an inbound message that resumes the
    run and satisfies the ACS `receive` wait. For a child, use SA''s approval-gate pattern and observe
    `awaiting_human`. A prompt-backed side cannot be made to emit the `inquire` output verbatim, since
    its reply is the model''s. Identity: with 0.2.0 the host can attest at most that the sender was a
    caller admitted by the runtime''s thread access policy, and only if it captures the caller at its
    own ingress or no definition code queues messages in that role. Otherwise it reports no `sender_identity`;
    under `always_ask_trust_classes` an item with ''no identity or no `trust_class`'' is then always-ask,
    the safe outcome.'
  see_also:
  - approval-human#inquiry-01
- id: coord-17
  relation: sa_only
  acs:
    concept: 'Not found: transfer of the same run to another agent (a run carries one actor identity)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.17 'Actor' (lines 1095-1101)
    - 'spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 904-940): a delegation is a separate task'
    - 'core/src/exec/mod.rs (lines 516 and 608: the saved run state carries `actor_identity`; lines 684-689:
      `restore` takes no actor)'
    quote: '**Actor.** A run may be started with the identity of the agent that runs'
  sa:
    concept: 'Handoff: an exposed agent named in a prompt''s `tools` takes over the same thread'
    refs:
    - content/0.2.0/specification/agents.md §5 Tool Exposure (lines 126-130), §2.2 (lines 88-90), §6 Required
      Parent Hooks (line 155)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (lines 20-30)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-100)
    - content/0.2.0/infrastructure/runtime.md §5.3 Tool Classes (line 99), §7.3.1 Required Parent-Hook
      Composition (lines 149-153)
    - content/0.2.0/distribution/packaging.md 'PackedMeta' (lines 213-215)
    - content/0.2.0/specification/threads/execution-state.md §2.1 Prompt Path (line 39)
    quote: 'When `exposeAsTool: true`, an agent referenced directly in a prompt''s `tools` array is a
      **handoff**: the tool call transfers control of the *same thread* to the target agent, preserving
      history.'
  explanation: 'ACS delegation always yields a separate task whose result returns to the delegator; nothing
    changes the party running a workflow mid-run. An SA handoff does exactly that, from a model''s tool
    call or from code (''Queue a tool call to an agent to trigger handoff programmatically''). By inference,
    not by a stated rule, the source agent''s grounding hooks then stop: thread hooks resolve from the
    active prompt, falling back to the thread''s agent, and after a handoff the prompt path is the new
    agent''s. The text is inconsistent on whether a handoff activates the target''s `parentHooks` (see
    the Standard Agent Specification findings). No return path was found. Searched: handoff, hand off,
    hand-off (ACS Standard, RFC-0002 to RFC-0004, ORCHESTRATION_EXTENSIONS.md, ontology: none; under schemas/
    only clinical patient handoff, domain content); hand back, return path (content/0.2.0); return (agents.md
    §5, threads.md §1.1).'
  combined: 'End (or fail) the ACS run before a handoff, and never restore a saved run under the agent
    that took over: the saved state carries `actor_identity` and `restore` takes no actor, so the target
    would continue under the source''s identity. A new run starts with the target''s `actor_identity`.
    Thread state (key-value store, files, message history) survives, so a checkpoint or evidence log stored
    there stays readable; enforcement continues only if the target agent''s prompts or agent definition
    list the same grounding hooks. Do not depend on `parentHooks` for a handoff until SA resolves the
    inconsistency. Treat handoff as reachable from tools and hooks as well as from a model''s tool call.
    It applies only to targets with a human side matching the thread''s conversational surface.'
- id: coord-18
  relation: sa_only
  acs:
    concept: 'Not found: a way for a delegate to require behaviour of its delegator (nearest: propagation
      of the always-ask mark along data flow and into nested runs)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.17 'Always ask' (lines 1077-1093)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    quote: value is marked (§5.12). A mark is never removed during a run. A
  sa:
    concept: '`parentHooks`: thread-scoped hooks a child agent requires on its direct parent, activated
      on composition and failing closed'
    refs:
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (lines 132-167)
    - content/0.2.0/specification/hooks.md intro (line 5), §1.3 Hook Scoping (lines 70-100), §2.4 Execution
      Provenance (lines 171-196), §3.3 Note (line 273), §4.1 (line 322), §5 Tool Execution Hooks (lines
      365-444)
    - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 147-163)
    - content/0.2.0/distribution/packaging.md 'package.json Requirements' and 'PackedMeta' (lines 178-215)
    quote: '- Requirements apply only to direct parent relationships; they do not propagate transitively
      through the child graph.'
  explanation: 'SA lets an agent with `exposeAsTool: true`, and only such an agent, declare thread hooks
    its direct parent must run: ''composing it **MUST** activate every `parentHooks` requirement automatically'',
    ''The hook receives the parent''s `ThreadState` and remains active for the lifetime of the enabled
    relationship.'', composition UIs MUST disclose them, and ''Missing, invalid, or unloadable required
    hooks **MUST** fail composition closed.'' The requirement is strictly one hop, and user-scoped hooks
    cannot be required. ACS has no corresponding construct. Its obligations travel the other way and by
    data flow: the always-ask mark follows references through later steps and into nested runs, and safety
    flags are resolved per step. The reverse, a parent requiring a hook on a child, was not found in SA
    (coord-19).'
  combined: 'A grounded child package can declare `parentHooks: [{ hook, reason, stage }]` naming a thread
    hook from its own namespace, for example an `after_subagent_created` hook that writes the delegation''s
    evidence anchor to the parent''s key-value store; it receives the child state, and `context.source`
    identifies the contributing relationship. SA guarantees activation, disclosure and fail-closed loading,
    not a veto: hook failures are non-fatal to the decorated turn, tool-call hooks observe or can only
    replace a stored result, a failing `before_create_message` hook only SHOULD prevent that message,
    and request-context policy gates are something runtimes ''may support''. A hook stamping provenance
    on the child''s result messages must first recognise them, which depends on the runtime setting `subagent_id`
    (coord-08). To reach a grandparent, an intermediate agent must redeclare the requirement. Not stated
    (an open question): whether these hooks run when the owning side is handler-backed, and whether `after_subagent_created`
    fires for code-initiated creation.'
  see_also:
