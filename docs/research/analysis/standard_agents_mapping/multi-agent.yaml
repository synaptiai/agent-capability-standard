- id: coord-27
  relation: fits
  acs:
    concept: A host that performs `delegate` and its wait from outside the agent runtime (how a host performs
      a capability call is left to the host)
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md introduction (line 10), 'Actions and responses' (lines 81-92);
      non-normative
    - 'spec/STANDARD-v1.1.0.md §5.15 (lines 932-936: the host maps its own identities to principals)'
    quote: The executor does no I/O. It tells your code what to do next (an
  sa:
    concept: 'Thread Client API: create a thread, send a message, read status and messages, stop, delete'
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope (lines 7-14), §3.1 (lines 39-46), §6
      Creating a Thread (lines 140-163), §8 Reading a Thread (lines 218-249), §10 Deleting a Thread (lines
      275-299), §11 Reading Messages (lines 302-332), §12 Sending a Message (lines 334-370), §15 Stopping
      Execution (lines 397-407), §17 Conformance (lines 471-488)
    - content/0.2.0/infrastructure/runtime.md §15 Thread Client API (lines 364-380)
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 7-25)
    quote: 2. `status` **MUST** equal the [`ThreadStatus`](/0.2.0/specification/threads/execution-state#4-run-status)
      that `state.status()` resolves for the thread.
  explanation: 'The Client API is a better-specified delegation surface than code-initiated `subagent_create`,
    and works with today''s Python executor, needing no in-process binding. Creating a thread MUST return
    a `CreateThreadResponse` holding `threadId`; the read route returns the same `ThreadStatus` as `state.status()`;
    the stop route aborts the execution in flight and settles it `idle` with reason `aborted_by_user`;
    deletion covers the thread and every descendant; results are read from the message route. Limits:
    the API is optional (SHOULD); `CreateThreadRequest` has `agent_id`, `tags` and `env` but no `arguments`,
    so SA''s validated creation arguments are unavailable and the task travels as the first message; and
    the delegate is a top-level thread, not a child: no registry entry, no `parentHooks`, no implicit
    completion message, an owner set ''from the authenticated caller''. Whether such an executor is a
    ''sidecar'' under the packaging portability rules is for SA to say (an open question).'
  combined: '`delegate`: `POST {runtime_prefix}/threads` with the delegate agent''s `agent_id`, then `POST
    .../threads/{threadId}/messages` with `role: ''user''` and the task. Use the returned `threadId` as
    the ACS `task_id`; report `accepted: true` when both calls succeed. `AwaitEvent`: follow `GET .../threads/{threadId}`
    (or the stream''s `thread_status` frames) and read the result from `GET .../threads/{threadId}/messages`;
    a liveness probe is the same `status` read (coord-04). On the ACS deadline: `POST .../stop`, then
    report R401. `replaces`: stop, or delete the thread. `effective.fresh_context: true` holds by construction
    for a new thread that received only the task. The runtime does not tell the caller which model produced
    a message, so model family and principal are attested as in coord-07 and coord-08.'
  see_also:
  - tools-contracts#io-07
  - published-api-extension-points#erase-01
