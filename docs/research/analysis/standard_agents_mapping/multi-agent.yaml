- id: coord-21
  relation: sa_only
  acs:
    concept: 'Not found: continuing an earlier delegation, or capping concurrent delegations (a retry
      always creates a new delegation)'
    refs:
    - 'spec/STANDARD-v1.1.0.md §5.13 (lines 762-774): retry and recovery loops delegate again and name
      the delegation replaced'
    - 'spec/STANDARD-v1.1.0.md §5.16 (line 959: the example''s per-reviewer `forbidden_inputs` option
      names `prior_rounds`; lines 997-999: `scope`)'
    - 'schemas/review_verdict_schema.yaml `scope: full | delta`'
    - 'spec/STANDARD-v1.1.0.md §5.5 (lines 350-353): `x-` binding keys reach the host'
    quote: R402. A `retry` of the step delegates again, and the new capability call
  sa:
    concept: Persistent child threads, `subagent_message`, create-or-continue, and `maxInstances`
    refs:
    - content/0.2.0/specification/subagents.md §1 (line 38, `maxInstances`), §3.3 (line 110), §4.1 Persistence
      Is Universal (lines 116-124), §5 (lines 159-161)
    - content/0.2.0/infrastructure/runtime.md §7.2 (line 131), §10 Termination Semantics (line 235)
    quote: '**Every child instance is a persistent thread.**'
  explanation: 'SA treats a child as a long-lived collaborator: session end never terminates a thread,
    a later message ''starts a **new session with history intact**'', the parent can address an instance
    by reference with `subagent_message`, and `maxInstances` caps simultaneous instances per relationship.
    In ACS a delegation is a one-shot task identified by `task_id`: running the step again creates a new
    delegation and asks the host to cancel the old one, and nothing asks the same delegate again. A persistent
    SA child could serve a `scope: delta` review, but ACS does not presuppose a reviewer with memory:
    `delta` is defined by coverage only, and the §5.16 example shows, as an option, a reviewer forbidden
    from depending on prior rounds. SA''s pages differ on the cap error: SHOULD in subagents.md §1, MUST
    in runtime.md §7.2 (see the Standard Agent Specification findings). Searched (spec/STANDARD-v1.1.0.md):
    continu, persistent, max_instances, maxInstances (one unrelated hit, ''changes persistent state'').'
  combined: 'Today an ACS host can only present a follow-up to an existing child as a new `delegate` call
    and attest `effective.fresh_context: false` for it; the continuity is invisible to the ACS validator.
    A continuation reference can already reach the host as a vendor input (coord-29): an `input_bindings`
    key that ''starts with `x-`'' is not reported as unknown, and ''The host still receives it''. When
    an ACS retry carries `replaces`, the host chooses between SA''s two behaviours: terminate the old
    instance and create a new one (matches ACS semantics), or message the existing instance (cheaper,
    but not what `replaces` means). Use the first for reviewers whose independence is counted. An SA `maxInstances`
    refusal maps to a refused delegation (coord-02).'
- id: coord-22
  relation: partial
  acs:
    concept: 'Two ways to receive a delegate''s result: a waiting `delegate` step, or a non-waiting `delegate`
      followed by a `receive` wait with `correlate`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.13 (lines 719-731 and 753-761)
    - 'spec/STANDARD-v1.1.0.md §5.10 (line 576: event `source_kind`; 1.1 adds `agent`)'
    quote: '`wait` is allowed only on `receive`, on `delegate`, or on `synchronize`'
  sa:
    concept: '`parentCommunication: ''implicit'' | ''explicit''`, with `notifyParent`, `setStatus` and
      `stopSession` for explicit escalation'
    refs:
    - content/0.2.0/specification/subagents.md §6.2 to §6.4 (lines 195-219)
    - content/0.2.0/infrastructure/runtime.md §7.1 Parent/Child Threading (lines 117-120), §7.2.1 Parent
      Communication Modes (line 135), §8.2 Child -> Parent (lines 197-211)
    - content/0.2.0/specification/threads.md §9.3 Parent Messaging (lines 526-542)
    - content/0.2.0/specification/threads/messages.md §1 (line 30), §1.1 (line 49)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2979-2980 (`notifyParent` comment)'
    quote: runtimes **MUST NOT** auto-queue completion/failure to the parent
  explanation: 'Both distinguish a delivered result from a fetched one. SA: `implicit` (the default) queues
    a completion or failure message that wakes the parent; under `explicit` a child''s finish does not
    wake the parent at all, and the child escalates deliberately. ACS: a waiting delegate receives its
    own result as an event correlated by `task_id`; a plain delegate returns at once and a separate `receive`
    step waits for a matching event. The correspondence is loose: SA delivers messages into a conversation
    and wakes a turn, guaranteeing per-thread order only; ACS delivers typed events to a step with a deadline
    and sender filters, and correlation does not depend on order. Attribution is the weak point: with
    several outstanding children, the source of a completion or `notifyParent` message is identifiable
    only by signals 0.2.0 does not guarantee (coord-08): the `subagent_id` field, the `metadata.subagent_id`
    convention, or the message text.'
  combined: 'Use the parent-side message only as a wake-up. On each wake, visit the outstanding children
    by the references the host recorded, read `status()` and the result from each child''s own thread,
    and build the ACS event from that, with `source_kind: agent`. Identity and correlation then rest on
    `getChildThread(reference)`, which has a MUST behind it (runtimes MUST ''expose parent/child lookup
    through `ThreadState`''), not on message content or optional metadata. Waiting delegate: a non-blocking
    relationship whose completion the host matches this way, or a blocking one with the cautions of coord-03.
    Delegate followed by `receive`: declare `parentCommunication: ''explicit''` and have the child call
    `state.notifyParent(content)` or stop with `state.stopSession({ result, notifyParent })`; the wake-up
    rule still applies.'
  see_also:
