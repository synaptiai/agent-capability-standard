- id: coord-19
  relation: acs_only
  acs:
    concept: Capability safety flags (`mutation`, `requires_checkpoint`, `requires_approval`, `risk`)
      as the delegator's knowledge of what an action may do
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 84-93), §5.2.1 Safety Flags (lines 270-284),
      §5.14 deferral rule 2 (lines 856-859)
    - schemas/capability_ontology.yaml node `delegate` (lines 1443-1447)
