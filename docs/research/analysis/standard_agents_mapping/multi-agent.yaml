- id: coord-28
  relation: partial
  acs:
    concept: 'Remaining members of the coordination nodes: `delegate.constraints`, output `agent`, the
      edges `decompose enables delegate` and `delegate enables synchronize`, and the reference SDK''s
      `max_delegation_depth`'
    refs:
    - schemas/capability_ontology.yaml `delegate.input_schema.constraints` (lines 1460-1462), `delegate.output_schema.agent`
      (lines 1514-1516), edges (lines 1790-1795)
    - 'spec/STANDARD-v1.1.0.md §4.3 (line 153: `enables` is informational)'
    - grounded_agency/coordination/delegation.py (lines 113-119 and 209-211; reference SDK only)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', bullet 'Invocations' (lines 230-231)
    quote: 'description: Delegation constraints'
  sa:
    concept: Creation `arguments` and relationship configuration as the only carriers; registry `name`
      and `relationship`; no depth limit for the subagent graph
    refs:
    - content/0.2.0/specification/subagents.md §1 property table (lines 33-45), §4.2 Registry (lines 131-147),
      §5.1 Persistent Invocation Arguments (lines 167-175)
    - content/0.2.0/specification/agents.md §1.3 Derivations (line 66), §8 Definition-Time Errors (lines
      193-205)
    quote: '`relationship` is the composition identity (which declared relationship spawned this instance);
      `name` is the implementing agent.'
  explanation: '`delegate.constraints` is an untyped object in the ontology, and the Standard gives it
    no semantics. SA has no slot for per-delegation constraints: a parent can pass creation `arguments`,
    validated against the child''s schema, and the relationship configuration fixes `maxInstances`, `blocking`
    and `scopedEnv` in advance; neither constrains the child''s behaviour. The ACS output `agent` (''Assigned
    agent'') corresponds to the registry''s `name`, the ACS input `agent` to `relationship` (coord-01).
    The two `enables` edges are informational and need no binding. Depth: the reference executor nests
    `invoke` at most four deep and the reference SDK caps chained delegations (`max_delegation_depth`,
    default 10); the Standard states no limit for delegation chains, and SA none for subagent graphs (coord-15).
    Searched: constraints (spec/STANDARD-v1.1.0.md: `constrain`, `plan` and `explain` inputs and trust-model
    text only).'
  combined: Pass ACS `constraints` to the child as one key of the creation `arguments`, and only if the
    child's side A `requiredSchema` declares it, since creation arguments are validated against that schema;
    honouring them is the child's job. Report the output `agent` as the registry entry's `name`. A host
    that wants a depth limit across child threads has to carry a counter in the creation arguments itself
    and refuse to delegate beyond it.
- id: coord-29
  relation: fits
  acs:
    concept: 'Vendor extension points: `x-` input-binding keys that reach the host, reserved `x-` field
      names, and `x-` values for `authenticated_by`'
    refs:
    - 'spec/STANDARD-v1.1.0.md §5.5 (lines 350-353), §11.3 Compatibility Guarantees (line 1458), Appendix
      B: Reserved Identifiers (line 1730), §5.17 (line 1026)'
    - schemas/agent_identity_schema.yaml `authenticated_by` pattern (line 37)
    quote: Field names starting with `x-` are reserved for vendor extensions.
  sa:
    concept: SA-specific delegation parameters with no ACS input (the required instance `name`, an existing
      instance reference), and SA's own extension point, tool `annotations`
    refs:
    - content/0.2.0/specification/subagents.md §3.3 (line 110), §5 Lifecycle Tools (lines 159-161)
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
    quote: It **MUST** require a non-empty `name` argument for the spawned instance
  explanation: 'ACS already has a way to carry runtime-specific parameters to a host without changing
    the ontology: a binding key that ''starts with `x-`'' is not reported as unknown, and ''The host still
    receives it''. SA-specific values that have no ACS input, such as the display `name` SA requires for
    a new instance or the reference of an instance to continue, can travel that way today. Such keys are
    outside the capability''s contract: the validator does not type them, and another host will ignore
    them. On the SA side the corresponding extension point is tool `annotations`, whose ''meaning belongs
    to whoever owns the key''; it exists on function tools only, not on agents (SA gap).'
  combined: 'Reserve integration-owned key names for `delegate` steps (illustrative names: `x-sa-name`
    for the instance name, `x-sa-continue` for an instance reference) and read them in the host when it
    answers `InvokeCapability`. When the host continues an existing instance because of such a key, it
    attests `effective.fresh_context: false`. List the keys in the published interop mapping so that two
    hosts agree on them.'
