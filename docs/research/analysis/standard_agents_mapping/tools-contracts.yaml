- id: io-05
  relation: acs_only
  acs:
    concept: Every capability output requires `evidence_anchors`; 23 of the 36 also require `confidence`.
      The element type of `evidence_anchors` is not defined
    refs:
    - 'schemas/capability_ontology.yaml meta.principles (lines 11-15) and each node''s `output_schema.required`
      (counted by script; every `evidence_anchors` is `type: array` without `items`)'
    - spec/STANDARD-v1.1.0.md §3.1 Grounded Claims (lines 76-77), §6.2 (lines 1123-1126), §9.6 F505 (line
      1325)
    - schemas/world_state_schema.yaml `Anchor` (lines 62-84)
    quote: '- Every capability returns evidence anchors and confidence'
  sa:
    concept: (no counterpart) a tool result carries status, text, error and attachments
    refs:
    - content/0.2.0/specification/hooks.md §5.5 tool_call_done (lines 430-444), §6.3 (lines 478-490)
    - content/0.2.0/specification/threads/messages.md §1 (lines 16-18), §1.1 (lines 40-42)
    - content/0.2.0/specification/threads/decisions.md §4 (lines 105-124)
    - '@standardagents/spec 0.45.10 index.d.ts lines 208-249'
    quote: Files returned by a tool are surfaced through `attachments`.
  explanation: 'SA defines no evidence or confidence field on a tool result; `confidence` occurs only
    in decision answers, and ''provenance'' only as hook execution provenance and as metadata conventions
    for cross-thread messages. On the ACS side the anchor shape for capability outputs is itself undefined:
    every `evidence_anchors` is `type: array` with no `items`, and the Standard says a capability''s ''`evidence_anchors`
    output and an event''s `anchors` field are different things.'' The world-state `Anchor` type (kind
    `tool`; `ref` described as ''Pointer like file:line, URL, tool-output-id'') is the nearest model.
    The principle text says every capability returns confidence, while 13 do not require it. Searched:
    evidence, anchor, grounded, grounding, citation (content/0.2.0, src/data/home.md, src/data/community.md,
    README.md: one unrelated hit, ''trust anchors'', threads.md line 111); confidence, provenance (content/0.2.0:
    only the uses just described).'
  combined: The wrapper requires the implementation to return the ontology's required output fields, `evidence_anchors`
    included, and serialises them into `result`. The check is presence-only, as in the reference executor
    (F505 is reserved and not checked), so a binding should itself require a non-empty anchor list for
    capabilities that read. Anchors refer to what the tool read (a URL, a path in the thread file system).
    A tool cannot name its own call (row cls-04); the stored tool message already carries `tool_call_id`
    and `name`, so no hook is needed to tie a result to its call (row io-09). Values of variables declared
    `secret` must be kept out of anchors and excerpts (row var-01).
  see_also:
  - evidence-audit-observability#anchors-01
- id: io-06
  relation: partial
  acs:
    concept: Diagnostic codes and format; in the Claude Code plugin a blocked call is reported to the
      model with a reason
    refs:
    - spec/STANDARD-v1.1.0.md §9.5-§9.6 (lines 1306-1325), §9.8 Diagnostic Format (lines 1348-1370)
    - hooks/pretooluse_require_checkpoint.sh header (lines 9-11)
    quote: '| F501 | CHECKPOINT_REQUIRED | Mutation without checkpoint |'
  sa:
    concept: 'A tool error is a result and does not halt the step: `status: ''error''` with `error` text.
      `error_code` and `error_data` exist in the published types only, and a runtime may end a run on
      `repeated_tool_error`'
    refs:
    - content/0.2.0/specification/tools.md §9 (line 155)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (lines 90-92)
    - content/0.2.0/specification/hooks.md §5.4 (lines 414-428), §6.3 (lines 478-488)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 105-114)
    - content/0.2.0/specification/threads/runtime-streams.md example (line 82)
    - content/0.2.0/specification/providers.md §3.2 (lines 324-328)
    - '@standardagents/spec 0.45.10 index.d.ts lines 222-236 (`error_code`, `error_data`), 5967-5984 (HookToolResult)'
    quote: '- persist tool errors as tool result messages rather than halting execution.'
  explanation: 'The behaviour matches ACS''s Claude Code hook, where a refused call is reported back to
    the model with the reason and the loop continues; SA makes it a MUST. Caveat: the stop-reason table
    lists `repeated_tool_error` under `failed` (codes at SHOULD level), so a runtime may end a run after
    repeated tool errors, which a grounded tool that keeps refusing could trigger. For machine-readable
    codes the published ToolResult has `error_code` and `error_data` (''Machine-readable error code for
    structured handling.''); in the 0.2.0 text `error_code` appears once, in an example, ToolResult is
    never defined, and HookToolResult (text and types) has no code field, so a hook cannot see a code.
    ACS run-level outcomes (a run that ends with F503, a gate `stop`) have no counterpart in a free-form
    tool loop. Searched: error_data, errorCode (content/0.2.0; not found).'
  combined: 'A refused grounded call returns { status: ''error'', error: ''F501 CHECKPOINT_REQUIRED: ...''
    } with the ACS code at the start of the text. Hooks receive that text as `error`, and the runtime
    must persist it as a tool result message; that the model reads the same text is implied by the specification,
    not stated, and an `after_tool_call_failure` hook may rewrite it. Where the published types are used
    the tool may also set `error_code: ''F501''` and put a §9.8 diagnostic object in `error_data`; its
    `location` names a workflow and a step, which a free-form call lacks, so use `capability` and add
    a tool-name key, which §9.8 allows. Do not rely on `error_code` reaching hooks.'
  see_also:
  - published-api-extension-points#tools-04
  - safety-enforcement#err-01
