- id: cls-08
  relation: sa_only
  acs:
    concept: (no counterpart) every capability use is dispatched to a host that runs it and reports the
      output
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 10-14), 'Actions and responses' (lines 81-93); guide
      to the reference executor, non-normative
    quote: The executor does no I/O.
  sa:
    concept: Provider tools that execute server-side at the model provider (`providerTools` on a model,
      `getTools` on a provider)
    refs:
    - content/0.2.0/specification/providers.md §10 Provider Tools (lines 598-653)
    - content/0.2.0/specification/models.md §1.2 (line 34), §9.7 (lines 461-481)
    - content/0.2.0/specification/tools.md §9 (line 153)
    - '@standardagents/spec 0.45.10 index.d.ts lines 108-121 (`provider:` and `mcp:` callables), 438-448
      (`executionMode`, `executionProvider`), 1014-1021 (`ProviderResponse.providerTools`), 1089-1112
      (ProviderExecutedToolResult)'
    quote: Providers can embed built-in tools that leverage provider-specific capabilities. For example,
      OpenAI provides web search, file search, code interpreter, and image generation tools that execute
      server-side.
  explanation: 'Spec text: a model lists `providerTools` (''Provider-embedded tools available for this
    model.'') and a provider may return their definitions from `getTools`; the Tools page requires runtimes
    to ''execute local tools sequentially'' without saying what a non-local tool is. That such a call
    is not executed locally is stated by the published types only (the comment on `ProviderResponse.providerTools`
    says such entries ''must not be re-executed locally''), which also add `executionMode` and the reserved
    `provider:` and `mcp:` prefixes. In ACS terms these are real capability uses (a code interpreter is
    `execute`, web search is `search`) outside any enforcement point, and the agent author does not own
    the definition to annotate it. The text does not say whether tool hooks fire for them. Searched: executionMode,
    executionProvider, mcp:, MCP, tenvs (content/0.2.0; not found).'
  combined: 'Cannot be gated with what 0.2.0 guarantees. Recommendation (from neither text), checkable
    at definition time by an author-side lint (row cls-15): a grounded agent uses no model `providerTools`
    entry, no `provider:` or `mcp:` tool reference and no tool with `executionMode: ''provider''` whose
    capability requires a checkpoint or an approval, and records the ones it allows in the shared classification
    table for audit. Under ontology 2.1.0 that admits a provider web search (`search`) and excludes a
    provider code interpreter (`execute` has `requires_approval: true`).'
  see_also:
  - published-api-extension-points#tools-06
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-07
  - checkpoint-rollback-state#state-25
