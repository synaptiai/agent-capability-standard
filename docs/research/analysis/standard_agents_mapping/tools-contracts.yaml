# Capabilities, tools and typed contracts
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: tools-contracts
title: Capabilities, tools and typed contracts
rows:
- id: cls-01
  relation: partial
  acs:
    concept: 'Capability: one of 36 atomic verbs in 9 layers, each with an input contract, an output contract
      and safety flags'
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms (line 55)
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 109-127), §4.2 Layers (lines 129-143)
    - schemas/capability_ontology.yaml meta and layers (lines 6-96); ontology version 2.1.0
    - 'docs/methodology/REJECTED_CANDIDATES.md §5 ''Rejected: Tool-Specific'' (lines 550-613; non-normative)'
    quote: '| **Capability** | An atomic primitive with single purpose, composable with explicit I/O contracts
      |'
  sa:
    concept: 'Tool: a named callable exposed to a model. The Tools page sorts tools by how they are defined
      (function, prompt, agent); the Runtime page adds runtime-injected lifecycle tools, and the Models
      page provider-embedded tools'
    refs:
    - content/0.2.0/specification/tools.md intro (line 3), §1 Tool Categories (lines 5-11)
    - content/0.2.0/infrastructure/runtime.md §5.3 Tool Classes (lines 94-100)
    - content/0.2.0/specification/models.md §1.2 Optional Properties (line 34, `providerTools`)
    - content/0.2.0/specification/agents.md intro (line 5)
    quote: Tools are callable capabilities exposed to models during execution.
  explanation: 'The words overlap; the concepts do not. An ACS capability is a member of a closed, versioned
    vocabulary that says what kind of act is performed and carries a contract and flags. An SA tool is
    an open-ended concrete callable identified by name. A tool implements zero, one or several capabilities,
    and many tools can implement one capability; ACS''s own non-normative text says so (''This is an implementation
    of `retrieve`, not a separate capability.''). SA categories sort tools by how they are defined, ACS
    layers by what they do; the axes are independent. SA text uses ''capabilities'' informally and defines
    no vocabulary of tool kinds or risk. Searched: readOnlyHint, destructiveHint, idempotentHint, risk
    level, risk:, requiresApproval, requires_approval, requires_checkpoint (content/0.2.0; not found).'
  combined: 'Classification is a declaration by the tool author: tool name to capability id, plus domain
    and flags. SA 0.2.0 promises only that the declaration is preserved on function tools (row cls-02);
    no party is required to read it, and prompts and agents have no slot (rows cls-05, cls-06). Fit by
    capability (inference): function tools for capabilities that read or act (retrieve, search, observe,
    execute, mutate, send, persist, recall, audit) and for checkpoint and rollback, which the author must
    implement because SA has no such primitive; `state.decide()`-backed function tools for classify, detect,
    measure and compare only; prompt tools for generative capabilities; `delegate` by the reserved lifecycle
    tool name. Searched: checkpoint, rollback, roll back, undo, revert (content/0.2.0; not found).'
  see_also:
  - published-api-extension-points#tools-01
- id: cls-02
  relation: fits
  acs:
    concept: 'What a classification of a tool would carry (a proposal: no normative ACS text defines a
      tool binding): capability id, the §4.1 safety flags and the step-level `domain`. The one precedent,
      the Python SDK''s MCP tool `metadata`, carries `capability_id`, `risk`, `mutation` and `requires_checkpoint`'
    refs:
    - grounded_agency/mcp.py `create_grounded_mcp_server` docstring (lines 45-54) and registration (lines
      100-110)
    - docs/integrations/claude_agent_sdk.md 'MCP Tool Mapping' (lines 160-186)
    - spec/STANDARD-v1.1.0.md §4.1 (lines 111-124), §5.2 (line 260)
    quote: 'Each tool may optionally carry ``metadata`` with:'
  sa:
    concept: '`annotations` on a function tool: a free-form object that `defineTool()` returns unchanged'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146), §9 Conformance Notes (line
      156)
    - '@standardagents/spec 0.45.10 index.d.ts lines 412, 424, 532'
    - '@standardagents/spec 0.45.10 index.js lines 145-165 (`defineTool`; implementation observation)'
    quote: '`defineTool()` **MUST** return `annotations` unchanged on the tool definition.'
  explanation: 'Spec text: a function tool MAY declare annotations; the specification defines no keys
    and leaves their meaning to the key owner; `defineTool()` MUST return them unchanged and implementations
    MUST preserve them. Published types: `annotations?: ToolAnnotations`, where `type ToolAnnotations
    = Record<string, unknown>;`; an unknown top-level property such as `capability` is a compile error
    (TS2353, tsc 6.0.3). `annotations` is therefore the only free-form metadata slot on a tool that is
    promised to survive. Limits: the declaration has no run-time effect and no in-thread reader (row cls-04);
    a raw literal is not type-checked (row cls-12); and §8 says annotations are ''keyed by the runtime
    or tool that reads them'', whereas an ACS key is read by neither (open question).'
  combined: 'defineTool({ annotations: { ''ai.synapti/acs'': { standard, ontology, capability, layer, domain, risk, mutation,
    requires_checkpoint, requires_approval } }, ... }), the key and the members that `schemas/interop/standard_agents_annotation.schema.json`
    defines (`domain` is optional; no other member is allowed). This type-checks against @standardagents/spec
    0.45.10. The key name and the value schema are ACS''s to define and publish. Its readers are build-time
    lints, packagers and reviewers (row cls-15). Keep the value JSON-serialisable: the SA text does not
    require it and function values compile, so this is an ACS rule. Implementation observation, not spec:
    the published `defineTool` builds its return value from a fixed list of keys, so an undeclared top-level
    key would also be dropped at run time.'
  see_also:
  - published-api-extension-points#tools-02
  - published-api-extension-points#tools-03
  - safety-enforcement#flags-01
  - approval-human#approval-02
  - packaging-conformance-governance#pkg-03
  - packaging-conformance-governance#ver-02
  - models-context-memory-security#profile-06
- id: cls-03
  relation: fits
  acs:
    concept: Effective safety flags are acted on where the capability is used, and a declaration cannot
      weaken them (written for workflow steps)
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 84-93)
    quote: Validators, executors and safety layers MUST act on effective flags.
  sa:
    concept: 'Annotations are inert: they must not change validation, execution, results, or what the
      model is sent; and no hook is specified as able to refuse a tool call'
    refs:
    - content/0.2.0/specification/tools.md §8 Semantics (lines 142-146), §9 (lines 150-156)
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384), §4.1 before_create_message
      (lines 310-322), §3.3 note on policy gates (line 273)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 113, `hook_blocked`)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50)
    quote: Annotations **MUST NOT** change argument validation, execution, the tool's results, or what
      is sent to the model. A tool behaves identically in a runtime that ignores them.
  explanation: 'Not a conflict between the texts: both requirements hold when the annotation is a declaration
    only and enforcement is ordinary code of the tool. A conflict arises for one design only, an SA runtime
    that refuses a `mutate` tool because of its annotation. §5.2.1 addresses ACS validators, executors
    and safety layers acting on workflow steps; the SA sentence has ''Annotations'' as its subject and
    names no bound party (open question). A hook cannot be the gate: of the five tool hooks only `tool_call_started`
    runs before execution, and its ''return value **MUST** be ignored; the hook cannot modify the tool
    call''. The stop reason `hook_blocked` is listed once and not defined, and whether a failing `before_create_message`
    on the assistant message prevents its tool calls is not stated.'
  combined: 'Enforce inside the tool''s own `execute`: a wrapper closes over the configuration it also
    writes to `annotations`, checks checkpoint and approval records (row rec-01) and returns { status:
    ''error'', error: ... } when a precondition is missing. It is a cooperative gate: it stops a model
    from skipping a checkpoint or an approval, and relies on all other definition code on the thread being
    trusted. It does not cover unclassified tools in the same prompt, provider-executed tools (cls-08),
    injected lifecycle tools (cls-07) or scheduled effects (eff-01). A generic wrapper around `defineTool`
    needs one type assertion at `execute` (TS2322 without it, tsc 6.0.3). The absence of a pre-execution
    hook that can refuse a call is recorded as an SA gap under the safety-enforcement and approval concerns.'
  see_also:
  - published-api-extension-points#tools-02
  - published-api-extension-points#tools-03
  - published-api-extension-points#tools-06
  - safety-enforcement#flags-01
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-07
  - checkpoint-rollback-state#state-25
  - approval-human#approval-02
  - approval-human#approval-15
  - approval-human#approval-16
  - multi-agent#coord-20
  - packaging-conformance-governance#pkg-03
  - models-context-memory-security#profile-06
- id: cls-04
  relation: acs_only
  acs:
    concept: Looking up a tool's classification by name at call time (`ToolCapabilityMapper.map_tool`
      in the Python SDK; the Claude Code plugin hook matches tool names)
    refs:
    - grounded_agency/capabilities/mapper.py `map_tool` (lines 339-375)
    - hooks/hooks.json PreToolUse matcher (line 5)
    quote: Map a tool invocation to its capability metadata.
  sa:
    concept: 'Reading a tool''s definition or annotations from a hook, a tool or a handler: no ThreadState
      method loads or lists tool definitions'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Resource Loading (lines 100-113), §2.1-§2.2 (lines
      190-206)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-100), §5.5 tool_call_done (line
      440), §6.2 HookToolCall (lines 465-476)
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (lines 19-32), §2.2
      (lines 43-49)
    - content/0.2.0/distribution/packaging.md 'PackedExports Interface' (lines 121-147)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2866-2906 (load and list methods), 2578-2634 (ExecutionState),
      5951-5963 (HookToolCall)'
    quote: '| `loadAgent(name)` | `Promise<T>` | Load agent definition |'
  explanation: 'SA text: ThreadState loads models, prompts and agents by name and lists their names; no
    tool counterpart is listed, and in the published types `state.loadTool` and `state.getToolNames` are
    compile errors. Hooks receive a HookToolCall with id, type, function.name and function.arguments only.
    `execute(state, args)` is given neither the tool''s registered name nor the call id; a tool can read
    `execution.messageHistory` but cannot tell which of several identical calls is its own. So nothing
    inside a thread can read a tool''s annotations. Outside a thread a specified reader exists for packed
    tools: the package entry point exports `tools` as loaders keyed by name (row cls-15). Searched: loadTool,
    getToolNames, getTool( (content/0.2.0, src/data, README.md, AGENTS.md, index.d.ts; not found).'
  combined: 'Keep the classification table in an ordinary module that the tool wrappers and an audit hook
    both import, keyed by the name a prompt lists; the author repeats the name, because a tool definition
    does not contain it. The hook maps `toolCall.function.name` to a classification for after-the-fact
    audit. Limits: a non-empty prompt `hooks` list replaces the agent''s, so the hook must be listed on
    every grounded prompt; `tool_call_done` MUST fire ''once per tool call'', but the text does not say
    whether that covers invokeTool or queueTool calls, sub-prompt tool calls, provider-executed tools
    or lifecycle tools, nor whether a packed tool''s name is local or qualified. Annotations cannot be
    looked up from inside a thread with 0.2.0.'
  see_also:
  - published-api-extension-points#handler-01
  - published-api-extension-points#hooks-02
  - published-api-extension-points#thread-02
  - safety-enforcement#exec-01
  - safety-enforcement#hook-02
  - evidence-audit-observability#collect-02
  - multi-agent#coord-20
  - packaging-conformance-governance#pkg-09
- id: cls-05
  relation: partial
  acs:
    concept: Cognitive capabilities (UNDERSTAND, REASON, MODEL, SYNTHESIZE); in the ACS repository each
      capability is a prompt-driven skill with an `allowed-tools` grant
    refs:
    - spec/STANDARD-v1.1.0.md §4.2 (lines 131-143)
    - schemas/capability_ontology.yaml `classify` (lines 323-360)
    - skills/classify/SKILL.md frontmatter (lines 1-11)
    - grounded_agency/capabilities/mapper.py `Skill` mapped to `invoke` (lines 245-250)
    quote: 'allowed-tools: Read, Grep'
  sa:
    concept: 'Prompt tool: a prompt named in another prompt''s `tools`, with `toolDescription`, `requiredSchema`
      and its own `tools`'
    refs:
    - content/0.2.0/specification/tools.md §1 (line 10), §2.1 (line 38), §4 (lines 66-79)
    - content/0.2.0/specification/prompts.md §1.1-§1.2 (lines 9-36), §3.3 (lines 127-168), §5 (lines 201-222)
    - content/0.2.0/specification/threads/execution-state.md §2.1 Prompt Path (lines 34-41)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4309-4456 (PromptDefinition)'
    quote: 'The `requiredSchema` property defines inputs when the prompt is called as a tool:'
  explanation: 'The nearest SA construct to an ACS cognitive capability: system instructions, a model,
    a tool grant and a validated input schema. A prompt tool whose instructions do one thing can take
    one capability id, and its `requiredSchema` can mirror the capability''s input schema. Missing: (1)
    a free-form metadata slot: §8 gives annotations to function tools only, the PromptDefinition tables
    list none, and the published types reject the property (TS2353). (2) An output schema (row io-04).
    (3) A risk of its own: it depends on the tools the prompt may call; the ACS mapper treats the analogous
    `Skill` tool as `invoke` with the comment ''Skills may mutate but we check at skill level''.'
  combined: 'Leave the prompt tool unannotated and ground every function tool it can call: a sub-prompt
    runs inside the calling thread (Execution State tracks it in `promptPath`), so each inner call enforces
    its own flags against the same records. Record the prompt''s classification in the shared table of
    row cls-04 for audit. A grounded function tool placed in front of the prompt (`uses: [''<prompt name>'']`,
    then `state.invokeTool`) can carry a label, but only that: what `invokeTool` returns for a prompt
    target is not specified, code has nowhere to set the result-shaping options, and their defaults include
    the inner tool traffic. Where a typed output is needed, back the tool with `state.decide()` or with
    code, not with a prompt.'
- id: cls-06
  relation: partial
  acs:
    concept: '`delegate` (assign a task to another agent) and `invoke` (run a composed workflow)'
    refs:
    - schemas/capability_ontology.yaml `delegate` (lines 1443-1538), `invoke` (lines 1609-1644)
    - grounded_agency/capabilities/mapper.py `Task` mapped to `delegate` (lines 239-244)
    quote: 'description: Assign task to another agent'
  sa:
    concept: 'Agent tool: an `exposeAsTool: true` agent with a human side, listed in a prompt''s `tools`,
      is a handoff of the same thread'
    refs:
    - content/0.2.0/specification/agents.md §2.2 (lines 89-90), §5 Tool Exposure (lines 126-130)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (lines 20-30)
    - content/0.2.0/infrastructure/runtime.md §5.3 (line 99)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4959-5114 (AgentDefinition)'
    quote: 'When `exposeAsTool: true`, an agent referenced directly in a prompt''s `tools` array is a
      **handoff**: the tool call transfers control of the *same thread* to the target agent, preserving
      history.'
  explanation: 'A handoff changes which agent owns the thread; it is not a general way to assign a task.
    The same paragraph adds: ''Handoff requires the target agent to have a human side matching the thread''s
    conversational surface.'' The text does not say what the calling tool call receives (inference: nothing
    the caller acts on). ACS `delegate` returns `accepted`, an optional `result` and the `effective` settings,
    so the fit is loose and `delegate` serves as an audit label only. AgentDefinition has no annotations
    in the text tables (§2.1, §2.2) and the published types reject the property (TS2353), so the classification
    has no home on the definition. In ontology 2.1.0 `delegate` is medium risk and requires neither checkpoint
    nor approval, so nothing has to be enforced by default.'
  combined: 'Record handoff targets as `delegate` in the shared table (row cls-04) for audit. Where a
    stricter flag is wanted, do not list the agent in `tools`; give the model a grounded function tool
    that declares `uses: [''<agent name>'']`, runs its gate, and then calls `state.queueTool`. The basis
    is a descriptive table row (''Queue a tool call to an agent to trigger handoff programmatically''),
    not a requirement, so test it per runtime: when a queued handoff takes effect and which arguments
    an agent callable accepts are not specified. After a handoff the target agent''s tools run on the
    same thread and can read and write the same gate records (row rec-01).'
- id: cls-07
  relation: partial
  acs:
    concept: '`delegate` with a waiting result, and the `delegation@1` inputs `fresh_context`, `role`,
      `read_only`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 904-940; the quoted sentence starts on line 917
      and continues on the next line)
    - schemas/capability_ontology.yaml `delegate` (lines 1443-1538)
    quote: '`delegate` accepts `fresh_context` (start the delegate without the'
  sa:
    concept: Runtime-injected lifecycle tools `subagents`, `subagent_create`, `subagent_message`
    refs:
    - content/0.2.0/specification/subagents.md §1 (lines 40, 45), §3.1 (lines 88-94), §3.3 (lines 106-110),
      §5 Lifecycle Tools (lines 155-165)
    - content/0.2.0/infrastructure/runtime.md §5.3 (lines 94-100), §7.3 (lines 137-145)
    - content/0.2.0/specification/tools.md §5 (lines 81-87)
    quote: 'For a prompt-backed side with non-hidden relationships, runtimes inject three built-in tools
      scoped to that side''s declarations:'
  explanation: '`subagent_create` is SA''s closest equivalent of `delegate`: the child runs in its own
    thread (ACS `fresh_context: true`), and on a relationship declared `blocking: true` the call waits
    and returns the child''s result (an ACS waiting delegate). The tools are injected by the runtime,
    so there is no definition object to annotate and no `execute` to wrap; they can be classified by reserved
    name only. ACS `delegate` output requires `accepted` and `evidence_anchors`, which the lifecycle tools
    do not produce. ACS does not settle how `subagent_message` and `subagents` are classified (open question).'
  combined: 'Classify by reserved name in the shared table: `subagent_create` as `delegate`. By default
    nothing needs enforcing, because `delegate` requires neither checkpoint nor approval in ontology 2.1.0.
    To gate a delegation, declare every relationship on the side `hidden: true` and spawn from a grounded
    function tool: while any relationship is visible the injected `subagent_create` stays callable, and
    the text does not promise that it refuses a hidden relationship''s name. The code path is named (''`invokeTool`
    / `queueTool` on the lifecycle surface, or dedicated runtime APIs'') but not specified. Gate records
    are per thread: a child sees none of its parent''s checkpoints or approvals (row rec-01).'
  see_also:
