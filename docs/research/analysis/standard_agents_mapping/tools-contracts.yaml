- id: cls-15
  relation: fits
  acs:
    concept: 'Static checking before anything runs: an L1 validator resolves every capability id against
      the ontology and resolves effective flags'
    refs:
    - spec/STANDARD-v1.1.0.md §10.2 L1 (lines 1389-1396), §9.2 V101 (line 1276)
    quote: '- Resolves effective safety flags and reports downgrades (§5.2.1)'
  sa:
    concept: A packed agent's entry point exports every definition as a loader keyed by name (`PackedExports.tools`),
      so code outside a runtime can load a tool definition and read its `annotations` and `uses`
    refs:
    - content/0.2.0/distribution/packaging.md 'Lazy Loading' and 'PackedExports Interface' (lines 110-147),
      'Visibility Rules' (lines 221-230)
    - content/0.2.0/getting-started/examples.md intro (line 11)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5830-5838 (PackedExports)'
    quote: 'tools: Record<string, DefinitionLoader<ToolDefinition>>;'
  explanation: 'The one specified way for code to read a tool''s annotations is outside a thread and at
    build time: a package''s entry point exports `tools` as loaders keyed by name, and a loaded ToolDefinition
    carries `annotations`, `uses` and `variables` (a lint written this way compiles against the published
    types). This is the SA counterpart of ACS static validation. It is also the only place where a rule
    that every tool listed by a grounded prompt is classified can be enforced: nothing in SA 0.2.0 lets
    a third party refuse an unclassified tool at run time. Limit: name-to-definition resolution is specified
    for packages only (''The specification does not define a folder layout.''), so for unpacked projects
    the lint depends on the runtime''s layout.'
  combined: 'Ship a lint with the binding that takes a package''s exports and checks: every name in a
    grounded prompt''s `tools` is a classified tool, a control-only tool (row cls-11) or an allowed provider
    tool (row cls-08); every annotation value validates against the ACS schema, names an existing capability
    (the equivalent of V101) and declares flags no weaker than the ontology''s (W602); `uses` closures
    satisfy row cls-13; no tool exposes raw key-value writes or bridges `state` into `runCode`. Run it
    in CI and at packing time.'
  see_also:
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-01
  - checkpoint-rollback-state#state-02
  - checkpoint-rollback-state#state-18
  - evidence-audit-observability#exec-01
