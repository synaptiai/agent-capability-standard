- id: cls-09
  relation: partial
  acs:
    concept: 'Atomicity: a capability has one responsibility and composition is the workflow''s job. Non-normative
      precedents exist for one external unit mapping to several capabilities'
    refs:
    - spec/STANDARD-v1.1.0.md §3.4 Composable Atoms (lines 95-98)
    - schemas/interop/oasf_mapping.yaml mapping types (lines 9-14)
    - grounded_agency/adapters/oasf.py `OASFSkillResult` and `translate` (lines 56-64, 178-191)
    - grounded_agency/capabilities/mapper.py compound Bash commands (lines 418-434)
    - docs/methodology/REJECTED_CANDIDATES.md §5.2 and §5.4 (lines 566-598; non-normative)
    quote: '- Workflows orchestrate; capabilities do one thing'
  sa:
    concept: A function tool is arbitrary code and may invoke other callables
    refs:
    - content/0.2.0/specification/tools.md §1 (line 9), §2.1 Tool Dependencies (lines 36-44)
    - content/0.2.0/getting-started/examples.md `apply_triage` (lines 1422-1473), `close_as_duplicate`
      (lines 426-483); non-normative examples
    quote: 'description: ''Add labels to one GitHub issue and post a comment on it.'','
  explanation: 'SA places no atomicity requirement on tools. Its own examples (non-normative) include
    tools that perform two writes in one call (labels plus a comment; a comment plus closing the issue),
    and `uses` lets a tool call further tools. ACS has no normative rule for classifying a non-atomic
    tool, and three non-normative precedents: the OASF mapping (`composition`: ''Multiple capabilities
    required''), whose adapter takes the highest risk among the mapped capabilities and ORs `requires_checkpoint`
    only; the SDK mapper, which classifies a compound Bash command by its sub-commands; and the rejected-candidates
    analysis, which treats one tool as implementing several capabilities.'
  combined: 'Proposal by analogy with the stricter-of rule of §5.2.1 (which is written for a step''s declaration
    against the ontology): declare a primary capability and the others the tool performs, and compute
    the effective flags as the strictest across all of them (highest risk, OR of every boolean, which
    goes beyond the OASF adapter). One checkpoint and one approval then cover the whole call. The tool
    must report partial completion (first write done, second failed), because ordering edges cannot be
    checked inside a tool body. Prefer splitting the tool so that each call is one capability. Neither
    text defines a field for the additional capabilities.'
- id: cls-10
  relation: acs_only
  acs:
    concept: 'Classification by call arguments: the ACS Python SDK (not the Standard) classifies a `Bash`
      call by its command and treats unknown commands as high risk'
    refs:
    - grounded_agency/capabilities/mapper.py `_classify_bash_command` and `_classify_single_command` (lines
      377-516)
    - docs/integrations/claude_agent_sdk.md 'Bash Command Classification' (lines 148-158)
    - docs/methodology/REJECTED_CANDIDATES.md §5.2 (line 572; non-normative)
    quote: '# SECURE DEFAULT: Unknown commands are high-risk'
  sa:
    concept: Annotations are a static value on the definition; general-purpose tools such as code execution
      exist
    refs:
    - content/0.2.0/specification/tools.md §1 (line 13), §8 example (lines 127-140)
    - content/0.2.0/infrastructure/runtime.md 'Code Execution Runtime', Isolation (lines 257-265)
    - content/0.2.0/specification/threads/code-execution.md §11 Security Considerations (line 551)
    quote: Function tools that evaluate model- or user-authored JavaScript or TypeScript **SHOULD** do
      so through [`state.runCode`](/0.2.0/specification/threads/code-execution) rather than `eval` or
      `new Function`.
  explanation: 'For a general-purpose tool (a shell, an HTTP client, a code runner) the capability depends
    on the arguments: the ACS SDK mapper returns observe, mutate, send or execute for the same `Bash`
    tool. An SA annotation is one static value per definition, and SA has no per-call classification concept.
    For `runCode` the sandbox has no host APIs unless the caller installs them, and ''Bridged functions
    **MUST** validate arguments against an explicit schema'', so what the code can do is decided by the
    tool''s own code, which is where a per-call decision has to live.'
  combined: Annotate the worst case the tool can perform. Let the wrapper accept an optional classify(args)
    function, evaluated inside `execute` on arguments the runtime has already validated, that selects
    the capability for this call and falls back to the annotated worst case for input it does not recognise.
    Write the classifier as an allow-list, as the Python one is. Because the annotation is static, the
    wrapper must write the per-call classification into its own audit record or result; a hook can recompute
    it only by importing the same classifier. This mirrors the mapper's fail-safe default and needs nothing
    from SA.
  see_also:
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-18
  - evidence-audit-observability#exec-01
- id: cls-11
  relation: sa_only
  acs:
    concept: (no counterpart as a capability) control flow belongs to the workflow DSL (gates, `end`,
      failure modes), not to a capability
    refs:
    - spec/STANDARD-v1.1.0.md §5.6 Gate Semantics (lines 363-412)
    - grounded_agency/capabilities/mapper.py default for an unregistered tool (lines 369-375)
    quote: '| `action` | enum | Yes | `stop`, `rollback`, `skip`, `warn`, `end` (else S303) |'
  sa:
    concept: 'Tools whose job is to end a turn or a session: the `stopTool`, `sessionStop`, `sessionFail`
      and `sessionStatus` bindings, and `stopToolResponseProperty`'
    refs:
    - content/0.2.0/specification/agents.md §1.2 PromptSide (lines 34-47), §3 SessionToolBinding (lines
      97-113), §4 Stop Semantics (lines 115-124)
    - content/0.2.0/getting-started/examples.md `submit_triage` (lines 869-881); non-normative example
    - '@standardagents/spec 0.45.10 index.d.ts lines 4826-4836 (`stopTool`, `stopToolResponseProperty`)'
    quote: 'description: ''Submit the finished triage. This ends the session.'','
  explanation: 'In SA a turn or a session is ended by calling a designated tool, whose body is often trivial
    (the example returns its argument). `stopToolResponseProperty` (''Extracted property for stop tool
    outcomes'') implies that a runtime also reads a property of the stop tool''s result; the extraction
    is not defined. ACS has no capability for signalling completion and does not need one: in a workflow
    that is a gate or the end of the step list. Forcing such a tool into one of the 36 capabilities would
    misclassify it. Leaving it unclassified makes it indistinguishable from a forgotten tool: the ACS
    SDK maps an unregistered tool to `observe` at medium risk, and a binding that failed closed on unclassified
    tools would refuse it.'
  combined: 'Let the ACS annotation schema mark a tool as control-only (no capability, no effect on the
    world), so that audits and any fail-closed default can tell it from an unclassified tool. The marker
    cannot be verified at run time (the body can still call `fetch` or write the key-value store), so
    pair it with an author-side lint: a control-only tool is referenced by a `stopTool`, `sessionStop`,
    `sessionFail` or `sessionStatus` binding and declares `uses: [] as const` (''An empty list permits
    no targets.''). This is a proposal for the ACS schema; SA needs no change.'
  see_also:
  - approval-human#approval-20
  - multi-agent#coord-09
  - multi-agent#coord-23
- id: cls-12
  relation: fits
  acs:
    concept: An unknown capability id is a validation error; the ontology is the registry
    refs:
    - spec/STANDARD-v1.1.0.md §9.2 (line 1276), §10.2 L1 (lines 1389-1396)
    - site/src/lib/api.ts capability endpoints of the documentation site's JSON data API (lines 317-332)
    quote: '| V101 | UNKNOWN_CAPABILITY | Capability ID not found in ontology |'
  sa:
    concept: 'Type registry: name unions built by declaration merging, so invalid references fail at compile
      time when the registries are generated'
    refs:
    - content/0.2.0/specification/type-registry.md §1 (lines 5-57), §3.3 (lines 209-220), §4.1 (lines
      224-230), §5.2 (lines 299-309), §6.1 (lines 317-323)
    - '@standardagents/spec 0.45.10 index.d.ts line 412 (`ToolAnnotations`)'
    quote: 'TypeScript catches invalid references at compile time:'
  explanation: 'Both reject dangling references, at different times: SA at compile time for the names
    of models, prompts, agents, tools, hooks and handlers, when the registries are generated (a SHOULD;
    ''Empty registries default to `string`''); ACS at workflow validation for capability ids. The SA registries
    hold names only (''Registry entries use `true` as a placeholder value:''), so they cannot carry capability
    metadata. The annotation slot is untyped: a raw literal with a misspelt capability id compiles, and
    a key owner cannot narrow `ToolAnnotations` by declaration merging, because it is a type alias (TS2300,
    tsc 6.0.3). The ACS documentation site serves the ontology as JSON, but ACS publishes no npm package
    or TypeScript types of it (the example binding written alongside this analysis is not counted).'
  combined: Ship the ontology as generated TypeScript (a union of capability ids and a table of flags)
    with a helper through which the annotation is written. A wrong id is then a compile error when the
    declaration passes through the helper or a `satisfies` clause, the code-first equivalent of V101,
    and the helper can apply the stricter-of rule of §5.2.1 and report W602 from the same table. A raw
    annotation literal bypasses the types, so add a build-time lint over loaded definitions (row cls-15).
    SA needs no change; an interface with an index signature for `ToolAnnotations` would let key owners
    type their keys.
  see_also:
  - published-api-extension-points#registry-01
  - packaging-conformance-governance#type-01
- id: cls-13
  relation: fits
  acs:
    concept: A workflow's call set is its step list, and `invoke` targets are named and checked; ACS has
      no call-set declaration for a tool binding (`allowed-tools` in skill frontmatter is Claude Code
      metadata, not Standard text)
    refs:
    - spec/STANDARD-v1.1.0.md §5.1 (line 213), §5.12 (lines 659-663), §9.2 V107 (line 1282)
    - skills/mutate/SKILL.md frontmatter (line 7)
    quote: '| `steps` | array | Yes | Ordered list of capability invocations |'
  sa:
    concept: '`uses`: a tool''s declared and runtime-enforced list of the callables it may invoke by name'
    refs:
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44)
    - content/0.2.0/distribution/packaging.md intro (line 5)
    - content/0.2.0/getting-started/examples.md intro (line 11)
    - '@standardagents/spec 0.45.10 index.d.ts lines 449-484'
    quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
      the list.
  explanation: 'SA makes a tool''s outgoing named calls a declared and enforced set, mandatory for packed
    tools (''A packed tool **MUST** declare the targets it invokes by name.''); the published types narrow
    invokeTool and queueTool to it when it is declared `as const`. ACS has the same property for its own
    composite unit, the workflow, and lacks it for tool bindings. `uses` bounds invocation by name only:
    not `state.scheduleEffect`, storage, `runCode`, a direct `fetch` or an imported implementation, so
    the reachable set is a lower bound on what a tool can cause. Text and types differ on a violation:
    invokeTool ''returns an error result for an undeclared target'' in the text, while the types say ''At
    runtime, attempts to call unlisted items will throw an error.'''
  combined: Require every grounded tool to declare `uses`, because when it is omitted 'this restriction
    does not apply' (`[] as const` when it calls nothing; compile-time narrowing needs `as const`). An
    author-side lint over a package's exports (row cls-15) walks `uses`, recursing through the `tools`
    of reachable prompts and agents, which carry no annotations, and checks that the tool's declared flags
    are at least as strict as those of every reachable callable. Treat scheduling an effect that writes
    as the mutate or send act itself, gated at the scheduling call (row eff-01). Name-to-definition resolution
    is specified for packages only.
  see_also:
  - published-api-extension-points#tools-05
  - safety-enforcement#gate-03
  - workflow-execution#wf-26
  - packaging-conformance-governance#pkg-08
- id: cls-14
  relation: partial
  acs:
    concept: Every act is a classified capability use with effective flags; a write to durable state is
      `mutate` or `persist` wherever it happens
    refs:
    - spec/STANDARD-v1.1.0.md §5.1 (line 213), §5.2.1 (lines 270-284)
    - schemas/capability_ontology.yaml `mutate` (lines 1095-1132), `persist` (lines 1376-1410)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 81-93); non-normative guide
    quote: 'description: Change persistent state'
  sa:
    concept: 'Acts that are not tool calls: state-changing ThreadState primitives (`writeFile`, `setValue`,
      `setEnv`, `scheduleEffect`, `skills.install`, `runCode`) called by definition code that is not a
      tool (handlers, hooks, effects, thread endpoints)'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods (lines 52-176)
    - content/0.2.0/specification/handlers.md §1 (line 28), §6 Capabilities (lines 79-88)
    - content/0.2.0/specification/threads/endpoints.md §3 Handler Signature (lines 56-69)
    - content/0.2.0/specification/tools.md §8 (line 125)
    quote: 'A handler receives the full [`ThreadState`](/0.2.0/specification/threads) and may do anything
      tools can do:'
  explanation: 'In ACS every act is a classified capability use. In SA a tool call is one of several ways
    to act: handlers, hooks, effects and thread endpoints receive the ThreadState and can write files,
    set durable values, set environment values, schedule effects, install skills and run code without
    any tool call. SA treats this code as trusted (''handlers are trusted definition code, like tools.'').
    Annotations exist for function tools only (§8), so none of these acts has a declaration slot, and
    the tool hooks are defined for tool calls only. A binding that classifies tools therefore classifies
    only the acts a model can request through a prompt''s `tools`; what other definition code does lies
    outside it.'
  combined: 'State the scope of a grounded agent plainly: the classification and the in-tool gate cover
    model-issued calls to grounded function tools. Keep state-changing ThreadState calls inside grounded
    tools; give handlers, hooks and endpoints no writes of their own except the binding''s own record
    keeping (row rec-01), and review them as trusted code. Where a handler must act, have it call a grounded
    tool through `state.invokeTool`, so that the same gate runs. An author-side lint can check the tools
    a prompt lists (row cls-15); nothing in 0.2.0 lets it check what a handler or endpoint body does.'
  see_also:
  - published-api-extension-points#thread-05
  - published-api-extension-points#tools-06
  - safety-enforcement#ckpt-02
  - safety-enforcement#exec-01
  - safety-enforcement#surface-01
