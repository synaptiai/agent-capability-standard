- id: eff-01
  relation: sa_only
  acs:
    concept: '(no counterpart) ACS has no deferred side-effect handler: a side effect is a step whose
      effective flags apply where it runs, and a checkpoint taken before a wait or a delay no longer authorises
      the step'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 (lines 84-93), §5.2.1 (lines 270-284)
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 777-781, 792-798)
    quote: '- A workflow cannot weaken a capability''s safety flags (§5.2.1)'
  sa:
    concept: 'Effects: scheduled side-effect handlers that run outside tool execution, possibly after
      the conversation has completed'
    refs:
    - content/0.2.0/specification/effects.md intro (line 3), §1.2 (lines 15-49), §3 Execution Semantics
      (lines 81-90), §4 (lines 94-102)
    - content/0.2.0/specification/tools.md §2.1 (line 38)
    - content/0.2.0/specification/threads.md §1.2.2 Effect Scheduling (lines 122-128)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1388, 1396 (`defineEffect`)'
    quote: Effect execution is runtime-managed and may occur after the invoking conversation has completed.
  explanation: 'An effect is defined with `defineEffect(description, args?, handler)`, which has no annotations
    parameter. It runs ''outside normal tool execution''; `uses` does not bound `state.scheduleEffect`
    (§2.1 names only invokeTool and queueTool, and a tool declared `uses: [] as const` that schedules
    an effect compiles); and no hook is defined for an effect run. Effects take a `ToolArgs` schema, but
    §3 states no requirement to validate effect arguments. A grounded tool that schedules an effect that
    writes therefore moves the write to a place with no gate and no audit hook. ACS has no counterpart
    construct; in ACS terms the deferred write is still a `mutate` or `send`.'
  combined: Treat the scheduling call as the mutate or send act itself and gate it there, inside the grounded
    tool that schedules. At the top of the effect handler, which receives a ThreadState, re-read the binding's
    own record of the scheduled act (still scheduled, not cancelled, approval not expired), because time
    passes between scheduling and execution; the checkpoint check is not repeated there, since the text
    does not say that an effect has a `state.execution` and a checkpoint bound to its `flowId` could not
    match (checkpoint-rollback-state#state-08, checkpoint-rollback-state#state-16). List effects by name
    in the shared classification table (row cls-04) and have the handler write its own audit record, since
    no tool hook observes it.
  see_also:
  - published-api-extension-points#thread-04
  - published-api-extension-points#thread-05
  - published-api-extension-points#tools-06
