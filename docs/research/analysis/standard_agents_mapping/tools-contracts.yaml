- id: io-08
  relation: partial
  acs:
    concept: '`classify`, `measure`, `detect`: typed judgements with probabilities and confidence'
    refs:
    - schemas/capability_ontology.yaml `detect` (lines 282-322), `classify` (lines 323-360), `measure`
      (lines 361-405)
    quote: 'description: Assign labels or categories to items'
  sa:
    concept: 'Decisions: `state.decide()` evaluates typed questions (`choice`, `score`, `boolean`) against
      explicit context, with a caller-supplied provider and model'
    refs:
    - content/0.2.0/specification/threads/decisions.md §1-§4 (lines 1-167), §6 Conversation Semantics
      (lines 200-210)
    - content/0.2.0/infrastructure/runtime.md §1.1 Decision Inference (lines 19-25)
    quote: A decision evaluates named, typed questions against caller-supplied context.
  explanation: 'Besides validated tool arguments (row io-04), this is where SA specifies typed model outputs.
    A `choice` answer (choice, probabilities, optional confidence) lines up with classify''s labels, probabilities
    and confidence. A `boolean` answer carries only `probability`, P(true), and no confidence member,
    while `detect` requires `confidence`; SA says ''Confidence is provider-reported and is distinct from
    an individual outcome probability.'' A `score` is a probability-weighted level index, not a value
    in the caller''s unit, and `measure` also requires `uncertainty`. Two properties suit grounding: the
    context is supplied explicitly by the caller (decide() must not implicitly read conversation messages),
    so the evidence is known; and thresholds are left to the caller, which is where ACS gates belong.
    No evidence anchors are returned.'
  combined: Where a decision provider is configured (decide() takes a caller-supplied `provider` factory
    and a provider model id; the runtime MUST expose the method, not a provider), a grounded function
    tool classified `classify`, `detect` or `measure` may call `state.decide()` in its `execute` and map
    the answer to the capability's output, adding anchors for the context it passed. `confidence` for
    detect, and `uncertainty` and the unit conversion for measure, have to be derived by the tool from
    the returned probabilities and labelled as derived; whether ACS permits that derivation, or requires
    the tool to fail the required-field check, is an open question.
  see_also:
  - published-api-extension-points#decide-01
  - evidence-audit-observability#trust-02
  - models-context-memory-security#ground-01
  - models-context-memory-security#profile-04
- id: io-09
  relation: fits
  acs:
    concept: 'An evidence anchor that points at tool output: the world-state `Anchor` has kind `tool`
      and a `ref` for a tool output id'
    refs:
    - schemas/world_state_schema.yaml `Anchor` (lines 62-84)
    - spec/STANDARD-v1.1.0.md §6.2 (lines 1123-1126)
    quote: 'description: Pointer like file:line, URL, tool-output-id'
  sa:
    concept: 'Structured carriers beside the text `result`: the stored tool message (`tool_call_id`, `name`,
      `metadata`), result `attachments`, `state.context` and the durable key-value store'
    refs:
    - content/0.2.0/specification/threads/messages.md §1 (lines 16-18, 29), §3 (lines 102-113)
    - content/0.2.0/specification/hooks.md §4.1 before_create_message (lines 310-322), §6.3 (lines 478-490)
    - content/0.2.0/specification/threads.md §6.2-§6.3 (lines 372-404), §7 (lines 408-433)
    - content/0.2.0/specification/tools.md §9 (line 154)
    quote: '| `metadata` | `Record<string, unknown>` | Custom metadata (may include runtime status markers
      such as `status_kind`) |'
  explanation: 'SA needs no change for a result to be tied to its call: runtimes MUST ''persist tool results
    as messages before advancing'', and a message record has `tool_call_id` and `name`, which fits the
    ACS anchor kind `tool`. Structured data can travel beside the text: a `before_create_message` hook
    may add classification or anchors to the tool message''s `metadata` (''The returned object **MUST**
    be used for insertion''); a result may carry `attachments`; tools in one execution can share values
    through `state.context`; and the key-value store persists them. Limits: the hook must be in scope
    (row cls-04); the text does not say whether `metadata` is kept out of the model request, preserved
    or merged; `context` is lost when the execution ends; and all four are untyped.'
  combined: Use the stored tool message's `tool_call_id` as the `ref` of an anchor of kind `tool` when
    a later step cites a tool result. Where an audit trail outside the model-visible text is wanted, a
    `before_create_message` hook writes the classification under the binding's own `metadata` key on tool
    messages; treat it as best effort until SA states preservation rules for `metadata`. Keep the JSON-encoded
    `result` (row io-03) as the authoritative copy of the capability output.
  see_also:
  - published-api-extension-points#hooks-03
  - evidence-audit-observability#anchors-02
  - models-context-memory-security#context-04
- id: var-01
  relation: sa_only
  acs:
    concept: (no counterpart in the Standard) the STANDARD does not model the configuration or credentials
      a capability needs; rules about secrets exist only as skill instructions
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 (lines 109-127)
    - skills/perspective-validation/SKILL.md (line 149), skills/audit/SKILL.md (line 314); instructions
      to a model, not Standard text
    quote: '- Do not include secrets/PII in evidence excerpts; prefer references/hashes over raw content.'
  sa:
    concept: '`variables` on tools and prompts: name, `text` or `secret`, required, scoped'
    refs:
    - content/0.2.0/specification/tools.md §3 Variable Declarations (lines 46-64)
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 208-240)
    - content/0.2.0/specification/hooks.md §1.2 (line 68)
    quote: '- `type: ''secret''` indicates sensitive values that should be encrypted at rest.'
  explanation: 'SA lets a tool declare the configuration and secrets it needs and gives runtime rules
    for resolution, scoping and redaction. ACS has no equivalent on a capability or a step, and no rule
    about secrets in the Standard or in SECURITY.md; rules exist as skill instructions to a model (for
    example ''Redact sensitive information (credentials, PII) from audit output''). A declared secret
    is not a classification signal by itself (a read may need a token). It matters for grounded output:
    anchors and excerpts are copied from tool output and must not contain secret values. The SA sentence
    on redaction is a lower-case ''should'' (''Values marked `secret` should be redacted from tool output
    and logs''); the MUST in this area binds hooks. Searched: secret, redact (spec/STANDARD-v1.1.0.md,
    spec/SECURITY.md, case-insensitive; not found).'
  combined: Nothing is needed for classification. For each declared variable whose `state.envType(name)`
    is `secret`, the wrapper removes occurrences of the resolved value from the serialised result, anchors,
    excerpts, error text and `error_data` before returning. An ACS audit hook that logs tool arguments
    is bound by 'Hooks **MUST NOT** expose sensitive data in logs or error messages.' Since the SA redaction
    sentence is advisory, this is ACS's rule to set (ACS gap).
  see_also:
  - evidence-audit-observability#privacy-01
  - models-context-memory-security#secrets-01
- id: skl-01
  relation: partial
  acs:
    concept: 'Each capability ships as an Agent Skills-style folder: skills/<id>/SKILL.md with `name`
      and `description` frontmatter, plus its output schema'
    refs:
    - skills/classify/SKILL.md frontmatter (lines 1-11)
    - skills/classify/schemas/output_schema.yaml
    - skills/capability-gap-analysis/SKILL.md and skills/digital-twin-sync-loop/SKILL.md frontmatter (`name`
      differs from the folder name)
    - CLAUDE.md 'Skill Structure'
    quote: 'name: classify'
  sa:
    concept: '`state.skills`: a per-owner Agent Skills library with list, get, readFile, install, setEnabled,
      remove'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Skills (lines 161-170), §7.4 Agent Skills (lines 447-465)
    - content/0.2.0/distribution/packaging.md 'PackedExports Interface' (lines 121-147)
    - content/0.2.0/specification/prompts.md §2.2-§2.4 (lines 52-91)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1828-1880 (SkillMetadata, SkillsNamespace)'
    quote: Skills follow the [Agent Skills](https://agentskills.io) standard
  explanation: 'All 42 ACS SKILL.md files have a kebab-case `name` of at most 64 characters and a `description`
    of at most 1024 (the longest is 292; checked by script), the two frontmatter constraints the SA text
    states. Limits: a skill is text for a model, with no flags and no enforcement. Every ACS skill carries
    extra frontmatter written for Claude Code (argument-hint, disable-model-invocation, user-invocable,
    allowed-tools, context, agent; layer in 13; hooks in 6), and ''installs **MUST** validate the frontmatter
    against the standard'' without saying whether extra keys pass. Two composed skills have a frontmatter
    name that differs from their folder (SA takes identity from the frontmatter). Their `allowed-tools`
    name Claude Code tools that do not exist in an SA thread.'
  combined: 'Do not install skills from agent code: `skills.install` writes to the thread owner''s library
    (''Runtimes **MUST** authorize mutations and confine them to the calling principal''s scope.''), which
    in ACS terms is itself a mutation to classify, and whether a model ever sees an installed skill is
    a SHOULD. Where the capability procedures are wanted inside an agent, put the text in the prompt through
    an `include` part, which ships with the package; skills belong to a principal''s library, and PackedExports
    has no skills entry. Mention ACS skills only as something a user or an administrator may install.'
  see_also:
  - packaging-conformance-governance#pkg-05
  - models-context-memory-security#prompts-02
