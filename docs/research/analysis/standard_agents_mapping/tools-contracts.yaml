- id: io-04
  relation: partial
  acs:
    concept: Typed outputs of cognitive capabilities and of `delegate` and `invoke` (result objects)
    refs:
    - schemas/capability_ontology.yaml `classify` output (lines 342-360), `delegate` output (lines 1503-1538),
      `invoke` output (lines 1628-1644)
    quote: 'description: Workflow result (contains nested workflow outputs)'
  sa:
    concept: A sub-prompt's result is one text string; a composed agent returns one text field of its
      stop tool's arguments, plus attachment paths
    refs:
    - content/0.2.0/specification/prompts.md §3.3 Sub-Prompt Tool Configuration (lines 127-168)
    - content/0.2.0/specification/agents.md §1.2 (lines 41-47), §3 SessionToolBinding (lines 97-113)
    - content/0.2.0/specification/subagents.md §3.3 (line 108), §6.2 (lines 195-205), §6.4 (lines 211-219)
    - content/0.2.0/infrastructure/runtime.md §8.3 (line 217)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2659-2665 (`StopSessionOptions.result`)'
    quote: Since sub-prompts return their results as tool call responses, all output must be serialized
      into a single text string.
  explanation: 'SA has a typed channel at the boundary: a stop tool''s arguments are validated against
    its Zod schema like any tool''s, so a prompt that must finish by calling such a tool produces a schema-checked
    object. What is forwarded is narrower: `messageProperty` is ''which arg field becomes lifecycle message
    text'', and `attachmentsProperty` names a field of attachment paths, which are ''copied child → parent
    and included as parent-local paths''. So a child can return text and files, not an object. In the
    implicit path the text arrives inside a template (''Subagent (reference: {uuid}) has returned the
    following result:''). For a sub-prompt the result string is assembled from text, tool calls and errors
    according to includeTextResponse, includeToolCalls and includeErrors; its format is not specified.'
  combined: 'Give the stop tool typed arguments, which the runtime validates, and let its `execute` build
    the capability output and return it from code with `state.stopSession({ result: JSON.stringify(output)
    })`. Delivery of `result` to a blocking caller is stated in the published types (''Result text returned
    to a blocking parent/subagent caller.'') and at lower-case ''should'' level in Runtime §8.3. A child
    that reports from code may use another channel; Subagents §6.4 names ''the parent''s key-value store,
    for example''. A JSON file returned through `attachmentsProperty` is a third route. Fallback: one
    string argument named in `messageProperty` that carries the JSON; the receiver must then extract it
    from the surrounding text.'
  see_also:
