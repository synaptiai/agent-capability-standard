- id: io-07
  relation: acs_only
  acs:
    concept: 'Typed bindings: a step''s inputs reference earlier steps'' outputs and are type-checked
      before the run'
    refs:
    - spec/STANDARD-v1.1.0.md §5.3 Binding Syntax (lines 286-318), §5.4 Typed Binding Rules (lines 320-333),
      §5.5 (lines 335-361)
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 3-14); non-normative guide
    - 'core/Cargo.toml (lines 8-17: `publish = false`; one feature, `python`)'
    quote: 1. Untyped bindings infer type from the producer's output schema.
  sa:
    concept: (no counterpart) data moves between tool calls through the model, or through code with untyped
      arguments, text results, `state.context` and the key-value store
    refs:
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-52)
    - content/0.2.0/specification/threads.md §3 Tool Invocation (lines 244-272), §6.2 Per-Execution Context
      (lines 372-392), §7 Durable Key-Value Store (lines 408-433)
    - content/0.2.0/specification/threads/endpoints.md §3 (line 67), §4 (line 91)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3011-3033 (queueTool, invokeTool)'
    quote: 5. Execute tool calls sequentially
  explanation: 'SA has no declarative data flow between tool calls. In a prompt-backed turn the model
    reads earlier results and writes the next call''s arguments; in code, invokeTool takes `args: Record<string,
    unknown>` and returns a ToolResult whose `result` is text. Tools can also share values without the
    model through `state.context` and the durable key-value store, both untyped. There is no producer
    output schema to infer from (row io-03), so nothing like B201 to B204 can be checked on the SA side.
    This is the part of ACS that SA does not attempt, and it is why the two compose: an ACS workflow can
    be the typed plan and SA the place where its steps run.'
  combined: 'Works today, out of process: the ACS executor (it does no I/O) stays in the Python package,
    and each InvokeCapability action is answered by an HTTP request to an `authenticated` thread endpoint
    whose handler calls `state.invokeTool` on a grounded tool; the host parses `result` back into the
    output object the executor checks. `invokeTool` outside an execution is described only in the published
    types, and hook coverage for such calls is unspecified. In-process use needs an exported WebAssembly
    or TypeScript build of the core: the Rust crate compiles for wasm32-unknown-unknown (`cargo check
    --lib`, run for this analysis), but no interface or JavaScript wrapper is published, and SA makes
    no promise that packed code may load a WebAssembly module. Searched: wasm (core/Cargo.toml, pyproject.toml,
    spec/ROADMAP.md, docs/guides/RUNNING_WORKFLOWS.md; not found).'
  see_also:
