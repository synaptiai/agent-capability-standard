- id: rec-01
  relation: fits
  acs:
    concept: 'The record a gate checks: a checkpoint that precedes the use, and an approval decision that
      expires and is used once. For calls outside a workflow only the Python SDK defines such a record
      (scope, expiry, consumption)'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 (lines 84-88), §5.14 Approval (lines 827-834)
    - grounded_agency/state/checkpoint_tracker.py `Checkpoint` (lines 40-62)
    quote: A checkpoint must be created before mutations and is consumed
  sa:
    concept: 'Durable key-value store on the thread: visible to all definition code on the thread, isolated
      per thread'
    refs:
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store', Runtime Semantics items 2, 3
      and 8 (lines 344-358; the page has two sections numbered 14)
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-433)
    - content/0.2.0/specification/threads/client-api.md §6 (line 150)
    - content/0.2.0/specification/threads/endpoints.md §4 (line 91)
    - content/0.2.0/specification/agents.md §7 (line 173; the approval-gate pattern)
    quote: 3. Each thread **MUST** maintain its own isolated key space. Values **MUST NOT** be readable
      by any other thread, including parent, child, or sibling threads.
  explanation: 'An in-tool gate needs records of checkpoints and approvals that outlive one tool call.
    SA''s durable key-value store fits: a written value ''**MUST** be visible to every subsequent `getValue(key)`
    on the same thread, across any execution context (tools, hooks, endpoints)'', and local tools execute
    sequentially, so the tool calls of one step do not race. The same rule means that any definition code
    holding the ThreadState can write those records. Records are per thread: a subagent child starts with
    none of its parent''s checkpoints or approvals, and after a handoff a different agent''s tools share
    the thread and its records. SA specifies no approval record; its approval-gate pattern is a human-in-the-loop
    child agent (see the approval concern).'
  combined: 'Keep checkpoint and approval records in the durable key-value store under reserved keys,
    written only by the grounded checkpoint tool and by an approval path the model cannot drive, for example
    an `authenticated` thread endpoint; a decision that returns to the model as text and comes back as
    a tool argument can be invented by the model. Do not keep records in env: a client may supply env
    when it creates a thread. Publish both scope consequences (a child thread starts empty; records outlive
    a handoff). The gate then holds against the model, provided no tool in its prompt exposes raw key-value
    writes; it does not hold against other code on the thread.'
  see_also:
  - published-api-extension-points#thread-01
  - safety-enforcement#ckpt-02
  - safety-enforcement#trust-01
  - checkpoint-rollback-state#state-01
  - checkpoint-rollback-state#state-02
  - checkpoint-rollback-state#state-04
  - multi-agent#coord-19
  - models-context-memory-security#isolation-01
  - models-context-memory-security#remember-01
  - models-context-memory-security#remember-02
- id: dom-01
  relation: acs_only
  acs:
    concept: 'Domain parameter: one capability specialised by a per-step `domain` string instead of one
      capability per domain'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 (line 260), §5.1 (line 225)
    - core/src/exec/mod.rs `InvokeCapability` (lines 104-116)
    - schemas/interop/oasf_mapping.yaml `domain_hint` (for example lines 34, 80)
    quote: '| `domain` | string | Domain parameter for the capability |'
  sa:
    concept: '(no counterpart) nearest carriers: an annotation value, the `env` of a tool reference in
      a prompt, or an argument; `options` on a tool reference has no specified delivery'
    refs:
    - content/0.2.0/specification/prompts.md §3.2 (lines 103-125)
    - content/0.2.0/specification/tools.md §2 (lines 17-34)
    - content/0.2.0/specification/threads.md §2.3 (lines 220-225)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4205-4223 (PromptToolConfig)'
    quote: '| `env` | `Record<string, string>` | Environment variable values for this tool |'
  explanation: 'SA has no domain parameter on a tool. On the ACS side `domain` is a per-step value, a
    bare string with no grammar or registry in the Standard; the executor passes it to the host with each
    InvokeCapability action. SA''s per-use-site setting for a tool is the `env` of a tool reference in
    a prompt, read with `state.env(name)`; ''Prompt-level `env` values serve as defaults.'', so thread
    and agent values override them, and the text does not say that a reference''s env is visible to that
    tool only. `PromptToolConfig.options` is described as ''Static tool options'' (types: ''Passed to
    the tool handler at execution time.''), but the text does not say how a tool reads them, since `execute`
    takes (state, args). Searched: domain (content/0.2.0, case-insensitive; not found).'
  combined: 'Three carriers, by how often the domain varies: a static domain as a field of the ACS annotation;
    a per-prompt domain as the tool reference''s `env` plus a declared `variables` entry, with one variable
    name per tool; a per-call domain as an ordinary field of `args`. `options` cannot be used until its
    delivery to the tool is specified (open question).'
  see_also:
  - published-api-extension-points#tools-02
  - safety-enforcement#flags-01
  - approval-human#approval-02
  - packaging-conformance-governance#pkg-03
  - packaging-conformance-governance#ver-02
  - models-context-memory-security#profile-06
- id: io-01
  relation: partial
  acs:
    concept: Capability `input_schema` and consumer contract checking of bindings
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 (line 118), §5.5 Consumer Contract Checking (lines 335-361), §5.2 (line
      259, `output_conforms_to`)
    - schemas/capability_ontology.yaml `retrieve` input_schema (lines 103-122)
    - grounded_agency/workflows/runner.py module example (lines 16-19) and `Host.invoke_capability` (lines
      76-80)
    quote: 3. The inferred or annotated type is compatible with the consumer's input
  sa:
    concept: 'Tool `args` and prompt `requiredSchema`: Zod object schemas validated by the runtime'
    refs:
    - content/0.2.0/specification/tools.md §2 (lines 15-34), §9 (line 152)
    - content/0.2.0/specification/prompts.md §1.2 (line 30), §5 Input Validation (lines 201-222)
    - content/0.2.0/specification/subagents.md §5.1 (lines 167-175)
    - '@standardagents/spec 0.45.10 index.d.ts lines 252-282 (ToolArgsNode, ToolArgs)'
    quote: '- validate tool args against the declared schema.'
  explanation: 'Both sides have first-class, validated input contracts, at different levels and times.
    SA validates each call''s arguments at run time against the tool''s own schema (MUST) and persists
    validated creation arguments for subagents. ACS checks at validation time that what a step binds is
    type-compatible with the capability''s generic input schema (for `retrieve`: target, format, filter,
    references). A tool''s `args` (owner, repo, number) specialise the capability''s inputs; neither schema
    replaces the other. Types only: `args` must be a Zod object built from a fixed set of node kinds,
    nesting depth 7 by default (''Tool arguments MUST be defined as a Zod object schema.''); the 0.2.0
    text types `requiredSchema` as `ZodSchema` and uses `ToolArgs` in its TypeScript references without
    defining it.'
  combined: 'Keep the tool''s `args` as the tool''s contract. For free-form tool use by a model no mapping
    is needed. When an ACS workflow step is dispatched to an SA tool, the mapping from the capability''s
    inputs to the tool''s arguments is host code, as in the reference runner''s `invoke_capability`. A
    step can already carry tool-specific arguments: an `input_bindings` key that starts with `x-` is not
    reported and ''The host still receives it'', and `output_conforms_to` pins a step''s whole output
    to a schema. A declarative input map would be a convenience for a generic SA host, not a prerequisite.'
- id: io-02
  relation: partial
  acs:
    concept: 'Contracts written as JSON Schema: Draft 2020-12 is a normative reference, and the ontology
      uses a JSON-Schema-like dialect'
    refs:
    - spec/STANDARD-v1.1.0.md §1.1 (line 33), §4.1 (lines 118-119), §5.4 (lines 320-333)
    - schemas/capability_ontology.schema.json `input_schema` and `output_schema` (lines 169-178)
    - schemas/capability_ontology.yaml type spellings, for example lines 131 (`any`), 151 (`string|object`),
      991 (`object|array`)
    - core/src/types.rs (lines 148-181)
    quote: JSON-Schema-like description of the capability's input contract.
  sa:
    concept: Contracts written as Zod; JSON Schema is generated for the model
    refs:
    - content/0.2.0/specification/prompts.md §5.2 Schema Usage (lines 214-220)
    - content/0.2.0/specification/providers.md §2 (line 237), §4 Tool Definitions (lines 331-341)
    - '@standardagents/spec 0.45.10 index.d.ts lines 263 (ToolArgsNode), 971-977 (ProviderTool)'
    - '@standardagents/spec 0.45.10 package.json (dependency `zod` `^4.0.0`)'
    quote: 2. Implementations **MUST** generate JSON Schema for LLM tool definitions
  explanation: 'Zod to JSON Schema: required by the text for a prompt''s `requiredSchema`; for function-tool
    `args` it is implied by `parameters?: JSONSchema` on ProviderTool, a type the text does not define
    (the published types say `Record<string, unknown>`). Experiment (zod 4.6.7): `z.toJSONSchema` emits
    `$schema` https://json-schema.org/draft/2020-12/schema, the draft ACS references. JSON Schema to Zod:
    neither specification covers it. `z.fromJSONSchema` throws ''Unsupported type: any'' and ''Unsupported
    type: string|object'' on the ontology''s spellings, which 23 of the 36 capabilities use (26 uses of
    `any`, 6 pipe unions); ACS §5.4 mentions type `any`, and the reference core reads the pipe shorthand.
    A strict `{}` converts to ZodAny, which `ToolArgsNode` does not list (it lists ZodUnknown). Searched:
    json schema, jsonschema (content/0.2.0, case-insensitive: prompts.md line 219 and four type references
    in providers.md).'
  combined: 'SA to ACS works today for documentation: export each grounded tool''s `args` with `z.toJSONSchema`
    and diff it between releases (a runtime''s own generator decides what the model is sent). A tool''s
    `args` need not equal the capability''s input schema (row io-01); the well-defined checks are that
    each required capability input of a workflow-dispatched tool has a source of a compatible primitive
    type, and that the wrapper''s declared output keys cover the capability''s required output fields.
    ACS to SA needs strict 2020-12 schemas from ACS (ACS gap) and generated Zod source that emits `z.unknown()`
    for open slots and `z.union` for type lists; a schema converted at run time is typed `ZodType<unknown>`,
    needs a cast as `args` (TS2740, tsc 6.0.3) and loses the inferred argument types.'
- id: io-03
  relation: acs_only
  acs:
    concept: Capability `output_schema` with required fields; the reference executor rejects an output
      that is not an object or lacks a required key (a presence check)
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 (line 119), §3.5 Explicit Contracts (lines 100-103)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 118-120); non-normative guide
    - core/src/exec/machine.rs `output` (lines 1399-1427)
    quote: '| `output_schema` | object | Yes | JSON Schema for outputs |'
  sa:
    concept: 'Tool result: a status and a text `result`; no output schema'
    refs:
    - content/0.2.0/specification/tools.md §2 example (lines 21-24), §9 (lines 150-156)
    - content/0.2.0/specification/hooks.md §5.2-§5.3 (lines 386-412), §6.3 HookToolResult (lines 478-490)
    - content/0.2.0/specification/threads.md §1.2.2 Tool Invocation (line 120)
    - content/0.2.0/specification/providers.md §2 (line 237), §2.1 (line 248)
    - content/0.2.0/getting-started/examples.md (lines 136-144); non-normative example
    - '@standardagents/spec 0.45.10 index.d.ts lines 145-165 (ToolContent), 208-249 (ToolResult)'
    quote: '| `invokeTool(toolName, args)` | `Promise<ToolResult>` | Invoke tool and wait for result |'
  explanation: 'SA 0.2.0 has no output schema for tools. Spec text: the Tools page shows a result object
    in examples only and never defines `ToolResult`; the only result interface written out is HookToolResult,
    with `result?: string`. Types: `result?: string` (''Text representation of the tool output.''); a
    non-string result is a compile error (TS2322) and an `outputSchema` property is rejected (TS2353);
    the types export ToolContent items, and a comment mentions tools ''that return structured content'',
    but ToolResult has no such member. The provider request has `responseFormat` with an optional schema;
    the only route to it from a definition is the provider-specific `prompt.providerOptions`. The specification''s
    own examples put JSON into the string. Searched: output schema, outputSchema, result schema, resultSchema,
    returnSchema, return schema, responseSchema, response schema, structured output, structuredContent,
    response_format (content/0.2.0, src/data, README.md: one unrelated hit, src/data/models.md line 402;
    index.d.ts: lines 3831 and 4440, neither about tool results).'
  combined: 'Encode the capability''s output object as JSON in `result`, and have the wrapper check the
    ontology''s required output fields before returning, as the ACS executor does (presence only: `evidence_anchors:
    []` passes in both). Consumers (another tool through invokeTool, a hook, a workflow host) parse the
    string. This is a convention between ACS-aware parties: SA runtimes treat the text as opaque, a hook
    that rewrites results (`before_store_tool_result`, `after_tool_call_success`) can alter it before
    it is stored, and the text does not say whether an `invokeTool` caller receives the tool''s own result
    or the rewritten one. The stored tool message ties the result to its call (row io-09).'
  see_also:
