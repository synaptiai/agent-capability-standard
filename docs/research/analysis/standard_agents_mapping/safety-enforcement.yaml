    - content/0.2.0/specification/users.md status note (line 3), §2.1 Serialization (line 79)
    - content/0.2.0/specification/threads.md §1.2.2 Methods, User identity (line 159)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4341-4346 (parallelToolCalls), 1561-1583 (UserHandle),
      3231 (ThreadState.user)'
    quote: A single thread **MUST NOT** execute multiple concurrent flows. Cross-thread concurrency is
      allowed.
  explanation: 'For model-issued tool calls the ACS rule holds inside one SA thread: calls MUST execute
    sequentially in the returned order and a thread MUST NOT execute concurrent flows. The table gloss
    of `parallelToolCalls` (''Allow parallel tool execution'') is in tension with that; the one normative
    sentence says an explicit value ''controls the provider option''. Not serialised by the text: an endpoint
    or effect acting during an execution, a tool awaiting several `invokeTool` calls together, and other
    threads. The frozen pages have no cross-thread exclusion; the draft Users page requires per-user serialised
    endpoint execution, which the published types expose to a thread through `state.user()` (typed `ThreadUser`
    on the frozen Threads page, `UserHandle` in the types). Searched: lock, mutex, semaphore, serializ,
    lease, atomic: none in the frozen pages.'
  combined: 'Model-issued calls of one thread need nothing. For the other in-thread paths (endpoints,
    effects, concurrent `invokeTool`), a grounded mutating or rollback tool takes a lease: best effort
    in the thread''s key-value store, which has no compare-and-set, or in the external system. Across
    threads only an external lock works on the frozen surface; on a runtime that implements the draft
    Users page, a user endpoint called through the user handle''s `call()` can hold the lease for the
    threads of one user. Setting `parallelToolCalls: false` on prompts that hold mutating tools lets the
    model see each result before it chooses its next call; it is an optional recommendation and a provider
    option, not something the guard depends on.'
  see_also:
