- id: ckpt-03
  relation: acs_only
  acs:
    concept: 'Rollback to the latest checkpoint: the `rollback` capability, the gate and failure-mode
      action, and F503'
    refs:
    - spec/STANDARD-v1.1.0.md §5.6 Gate Semantics (lines 389-392)
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (line 681)
    - spec/STANDARD-v1.1.0.md §9.6 Safety Errors, F503 (line 1323)
    - core/src/exec/machine.rs lines 644-661 (rollback)
    - core/src/exec/mod.rs lines 120-123 (Body::Rollback)
    quote: '| `rollback` | Roll back to the latest checkpoint; with none, or if the host fails it, the
      run ends F503 |'
  sa:
    concept: No restore operation; failures leave persisted state in place
    refs:
    - content/0.2.0/specification/handlers.md §5 Error Semantics (lines 69-77; quote at line 74)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/hooks.md §5.4 after_tool_call_failure (lines 414-428), §6.3 HookToolResult
      (lines 478-488)
    quote: '- The inbound message stays persisted. Nothing is rolled back.'
  explanation: 'SA defines no operation that restores thread messages, files, key-value data or external
    state (search terms as in ckpt-01). A failed tool yields a persisted error result and the loop continues;
    a failed handler turn leaves everything as it was. Rollback in an SA agent is therefore the agent
    author''s code. A hook is the wrong trigger for automatic rollback: `after_tool_call_failure` receives
    a `HookToolResult` without an error code, so it cannot tell a guard''s denial (nothing changed) from
    a failed effect, and the text does not say whether a returned error result, as opposed to a thrown
    exception, reaches that hook. ACS''s own tool-call layers do not roll back automatically either: automatic
    rollback is a declared failure mode of a workflow step.'
  combined: '`rollback` is an ordinary function tool that restores what its paired `checkpoint` tool saved
    (thread files with `writeFile` and `unlinkFile`; external systems through their own APIs) and returns
    an error result carrying F503 when there is no checkpoint or the restore fails. A restore made of
    several file calls is not atomic, so a partial restore is reported as F503. If automatic rollback
    is wanted, do it in the guard wrapper, which knows whether the inner `execute` started the effect,
    and only for a failure after that point. Declared `action: rollback` failure modes are the executor''s
    job when SA code hosts it (exec-01).'
  see_also:
  - published-api-extension-points#thread-03
  - checkpoint-rollback-state#state-06
  - checkpoint-rollback-state#state-16
  - checkpoint-rollback-state#state-23
  - checkpoint-rollback-state#state-26
  - workflow-execution#wf-08
- id: appr-01
  relation: partial
  acs:
    concept: 'Approval before a step whose effective `requires_approval` is true (in the ontology: `execute`,
      `mutate`, `send`): the decision is bound to a digest of the shown values, needs `min_approvers`
      distinct approvers, expires and is single-use (F502)'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (line 123)
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 804-902; validity rule at lines 831-833)
    - spec/STANDARD-v1.1.0.md §9.6 Safety Errors, F502 (line 1322)
    - 'schemas/capability_ontology.yaml lines 1058, 1101, 1139 (`requires_approval: true` on execute,
      mutate, send)'
    - core/src/exec/machine.rs lines 688-783 (approval; default shown values at lines 717-722), 983-1076
      (decide)
    - grounded_agency/capabilities/mapper.py lines 153-167 (ToolMapping has no approval field)
    - skills/send/SKILL.md lines 10-31 (a model-judged PreToolUse prompt)
    quote: '| `requires_approval` | boolean | No | Each use needs approval (default false) |'
  sa:
    concept: 'Human-in-the-loop composition: a child agent with a human side parks `awaiting_human`, and
      the text names an approval gate as the canonical use. It defines the waiting state, not the decision'
    refs:
    - content/0.2.0/specification/agents.md §7 Human-in-the-Loop Composition (lines 169-191; quote at
      line 189)
    - content/0.2.0/specification/subagents.md §4.3 (line 153), §5 Lifecycle Tools (lines 157-163), §6.1
      (line 191), §6.2 (lines 197-203)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 11-38)
    - content/0.2.0/specification/threads/client-api.md §12 Sending a Message (lines 334-366)
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 96-103)
    quote: The runtime does not define who sees the parked session or through which interface they answer
      — only the waiting state and its fulfillment.
  explanation: 'SA defines the waiting state and its fulfilment; no tool is required to pass the gate.
    A message-based answer cannot carry an ACS decision: parent traffic and the approver''s reply enter
    the child on the same perspective (`role: ''user''`), the message record has no sender field, and
    a client may send any of three roles, so an echoed digest shows that the child saw the request, not
    who approved (inference from those facts). What can carry it is a thread endpoint, whose `auth.caller`
    MUST be the authenticated identity (appr-03). On the ACS side the §5.14 protocol is enforced only
    by the workflow executor; the plugin hook and SDK adapter enforce none, and the `send` skill adds
    a model-judged prompt. Searched: approver, digest, expire, mandate, consent, confirmation, sign-off:
    no decision record found.'
  combined: Use a recorded decision, not a blocking wait. The guard computes the ACS digest of the shown
    values (by default the list holding the call's inputs, as the reference executor does) and looks up
    a decision with `state.getValue`. With none valid it writes a pending request (digest, shown values,
    expiry, `min_approvers`), returns an error result carrying F502, and may call `state.execution.stop()`.
    An authenticated thread endpoint records the decision (appr-03). On the retried call the guard requires
    a digest match, enough distinct approvers, not expired and not used, goes on to the checkpoint check,
    and marks the record used only when that check has passed as well, so that a call refused F501 leaves
    the approval unused (published-api-extension-points#tools-04). A human-sided child stays useful for
    asking inside the conversation; if used, declare it `hidden` with a handler-backed side A, and do
    not treat its reply as the decision record.
  see_also:
