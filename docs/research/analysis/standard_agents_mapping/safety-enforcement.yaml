- id: flags-03
  relation: acs_only
  acs:
    concept: '`mutation_overridable`: the one case in which a declaration lowers an ontology flag. A step
      may declare `mutation: false` on a capability so marked (in the reference ontology, `audit`), and
      an ontology that sets the marker outside the allowed cases MUST be rejected when loaded'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (line 124)
    - spec/STANDARD-v1.1.0.md §4.4 Safety-Critical Capabilities (lines 191-195)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 272-277; quote at line 277)
    - schemas/capability_ontology.yaml nodes[id=audit] (lines 1336-1345)
    - core/src/ontology.rs load-time check (lines 142-154); core/src/validate/semantics.rs W602 condition
      (lines 266-268)
    - examples/standard_agents/src/acs/ontology.ts effectiveFlags; examples/standard_agents/src/acs/grounded.ts;
      examples/standard_agents/test/grounded.test.ts
    quote: '`mutation: false` on a `mutation_overridable` capability (§4.4) is honoured.'
  sa:
    concept: 'None for the flag or the exception. The premise of the exception, a capability whose writes
      are append-only, has no SA storage primitive: definition code can replace or delete thread key-value
      entries, files and messages. A tool-level declaration travels in `annotations`, which must not affect
      execution'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146), §9 Conformance Notes (line
      156)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 Runtime Semantics, item 6 (line 355)
    - 'content/0.2.0/specification/threads.md §1.2.2 Methods (line 65: `deleteMessage`; line 76: `unlinkFile`),
      §7.2 Semantics (line 432)'
    - 'content/0.2.0/specification/threads/code-execution.md §2.2 CodeExecution Handle (line 54: the one
      occurrence of ''append-only'')'
    - 'content/0.2.0/specification/providers.md §1.3 ''Config Slots'' (lines 112-134), §11 TypeScript
      Reference (line 707): `overridable` on a provider config slot, unrelated'
    quote: '`setValue(key, null)` and `setValue(key, undefined)` **MUST** delete the key so that subsequent
      `getValue(key)` calls return `null`.'
  explanation: 'safety-enforcement#flags-01 and safety-enforcement#flags-02 give the rule that a declaration
    may only be stricter than the ontology. §5.2.1 has one exception: `mutation: false` is honoured, without
    W602, on a capability marked `mutation_overridable`. §4.4 permits the marker only where `mutation`
    is true, `risk` is low and neither a checkpoint nor approval is required, and ties it to append-only
    writes. SA 0.2.0 has no flag to weaken and no append-only store: `setValue(key, null)` deletes a key,
    `unlinkFile` a file, `deleteMessage` a message. SA''s `overridable` is a provider config-slot option.
    Searched (content/0.2.0, index.d.ts): append-only (one hit, the sandbox `reports` view), immutable
    (thread metadata, types only), write-once, tamper (no match).'
  combined: 'A tool classified `audit` may declare `mutation: false`. The reference binding''s `effectiveFlags`
    accepts that declaration only for a capability its ontology table marks `mutation_overridable`; on
    any other mutating capability it reports W602 and `groundedTool` throws. Whatever builds that table
    from an ontology applies the §4.4 load-time rule (inference: it is the loader). The value is published
    in `annotations.acs`; an SA runtime MUST preserve annotations and never let them affect execution.
    In the binding `mutation` gates nothing: of the four flags its wrapper acts on `requires_checkpoint`
    and `requires_approval`, and §4.4 keeps the marker off capabilities that carry either. Append-only
    is the tool''s own discipline; other code on the thread can rewrite its entries (evidence-audit-observability#audit-02).'
- id: edge-01
  relation: fits
  acs:
    concept: 'Ordering edges checked over a workflow''s declared step list: `requires` (some `from` runs
      before every `to`), `precedes` (only when both are present), `soft_requires` (a warning)'
    refs:
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 145-180; quote at line 167)
    - spec/EDGE_TYPES.md §1 requires (lines 30-48), §2 soft_requires (lines 52-80), §4 precedes (lines
      104-134)
    - 'schemas/capability_ontology.yaml edges: 3 `requires`, all from `checkpoint` (lines 1763-1771);
      18 `precedes`; 10 `soft_requires`'
    quote: '| `requires` | For every `to` step, some `from` step runs before it | V102 per `to` step |'
  sa:
    concept: 'Step cycle: the model chooses the tool calls; the runtime executes them one at a time in
      the returned order and places no constraint on which tool may follow which'
    refs:
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-50), §5.1 Ordering (line 88)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 152-155)
    - content/0.2.0/specification/subagents.md §5 Lifecycle Tools (line 159)
    quote: Tool calls **MUST** execute sequentially in the returned order.
  explanation: 'SA fixes how returned calls are executed (in order, results persisted before advancing),
    not which tool may follow which; the one ordering statement found is guidance to the model (injected
    descriptions SHOULD direct it to call `subagents` before `subagent_create`). ACS defines its edges
    over a step list validated before the run, not over a model-driven loop. Read online, `requires` becomes
    a prefix check at each `to` call. `precedes` applies only ''If the workflow contains both'', so it
    is decidable only when a `from` call follows a `to` call that had no earlier `from`; refusing that
    late call would stop the wrong call, so reporting is the only useful action (reasoning from the rule,
    not text). Searched: prerequisite, precondition, depends on, must be called before, only after, must
    precede: no ordering constraint found.'
  combined: 'Route 1, deterministic: write the sequence as an ACS workflow, validate it at build time
    with the ACS validator, and run its steps from one function tool or handler in that order, with `uses`
    listing the step tools; the model cannot reorder it. Route 2, model-driven: the ontology''s three
    `requires` edges all start at `checkpoint`, so enforce a valid marker before `mutate` and `send` and
    an existing checkpoint record before `rollback` (ckpt-01, ckpt-02). Write each grounded call''s capability
    into its audit record; report a `precedes` violation when a `from` call follows an unpreceded `to`,
    and W601 for a `to` with no `soft_requires` source earlier in the flow. `execution.messageHistory`
    can serve as the trace within one execution (trace-01).'
