- id: appr-03
  relation: partial
  acs:
    concept: 'Who approved: a valid decision needs at least `min_approvers` distinct approvers, and the
      approvers are recorded on the action record'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 819, 831-833, 898-902; quote at line 832)
    quote: canonical JSON of the shown values matches, at least `min_approvers` distinct approvers agree,
      it
  sa:
    concept: 'Thread endpoint authentication context: `auth.caller` is the authenticated caller, the only
      place in the frozen 0.2.0 pages where definition code learns who made a request'
    refs:
    - content/0.2.0/specification/threads/endpoints.md §3 Handler Signature (lines 58-69), §4 Access and
      Authentication (lines 89-105; quote at line 100), §5 Endpoint Context (line 109)
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics item 2 (line
      351)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 11-38)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5367-5372 (ThreadEndpointAuth), 5508 (ThreadEndpointHandler),
      1892-1905 (ThreadUser)'
    quote: '**MUST** be the authenticated identity when the request presented credentials the runtime
      verified, and `null` otherwise.'
  explanation: 'For an endpoint with the default `authenticated` access level the runtime MUST authenticate
    the request and enforce its thread access policy before invoking the handler, and `caller` is always
    non-null. The text separates `caller` (who is making the request) from the thread''s owner. A decision
    that such an endpoint writes with `state.setValue` is visible to a tool''s later `getValue` by a MUST
    of the key-value store. This gives ACS §5.14 a verifiable approver and a count of distinct approvers,
    which a human-side message cannot give (the message record has no sender field). Not provided by SA:
    how the caller was authenticated, which callers the runtime''s thread access policy admits, and any
    notion of approval, digest, expiry or single use; those stay in the binding''s code.'
  combined: 'A thread endpoint with `authenticated` access (for example a file `approve.post.ts`) reads
    `{ digest, decision }`, rejects a digest that differs from the pending request the guard wrote, de-duplicates
    approvers by `auth.caller.id`, may check `auth.caller.roles` against the ACS approver role, and writes
    the decision under a key of its own (the request''s digest plus `auth.caller.id`) with `state.setValue`,
    a rejection as an idempotent flag, so that two approvers deciding at once cannot overwrite each other:
    the store has no conditional write and the text does not serialise endpoint requests (approval-human#approval-04).
    The guard reads it on the retried tool call (appr-01). The endpoint runs with `state.execution` null:
    it records and returns, and does not perform the effect. Record `auth.caller.id` as the ACS approver.
    State that admission to the endpoint is governed by the runtime''s thread access policy, which SA
    leaves to the runtime.'
  see_also:
