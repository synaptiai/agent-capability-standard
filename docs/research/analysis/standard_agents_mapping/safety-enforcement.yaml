- id: audit-01
  relation: acs_only
  acs:
    concept: 'Tamper-evident audit log: each entry of the plugin''s log carries an HMAC of the previous
      entry'
    refs:
    - hooks/posttooluse_log_tool.sh (lines 2-17; quote at line 11)
    - spec/SECURITY.md §5.2 Post-Tool Use Hooks (lines 282-286)
    quote: '# The HMAC chain ensures tamper detection: modifying or deleting'
  sa:
    concept: 'No counterpart. Persisted message history is mutable: code can update and delete messages,
      clients can delete them, and message hooks return the record that is stored'
    refs:
    - content/0.2.0/specification/threads/messages.md introductory note (line 7), §5 Updating Messages
      (lines 169-178), §6 Deleting Messages (lines 180-186; quote at line 186)
    - content/0.2.0/specification/threads/client-api.md §13 Deleting a Message (lines 372-378)
    - content/0.2.0/specification/hooks.md §4.1 (lines 320-321), §4.3 (lines 348-349)
    quote: Returns `true` if the message was found and removed, `false` otherwise. Tool-result messages
      cascade with their parent assistant message.
  explanation: 'SA''s stored tool-call history is not an append-only record. `updateMessage` and `deleteMessage`
    are on `ThreadState`, deleting an assistant message removes its tool results with it, the Thread Client
    API lets a client delete a message, and `before_create_message` and `before_update_message` return
    the object that is stored. Thread files and key-value entries can likewise be overwritten by any code
    in the thread. SA defines no integrity mechanism for any of them. The ACS plugin log is hash-chained,
    with the stated caveat that its default key, derived from the hostname, protects against accidental
    corruption only. Searched content/0.2.0 and the published types: append-only (a code-execution report
    view only), tamper, immutab, integrity, hmac, hash chain: no integrity mechanism for messages, files
    or key-value data found.'
  combined: An ACS audit binding writes its own record and does not rely on message history as evidence.
    Where tamper evidence matters, the guard wrapper chains each record to the previous one (an HMAC or
    hash of the prior entry, as the plugin log does) and sends it to a sink outside the thread, since
    anything stored in the thread can be rewritten by co-located code (trust-01). Message history remains
    useful as a convenience trace (trace-01).
  see_also:
  - checkpoint-rollback-state#state-19
  - evidence-audit-observability#audit-02
  - models-context-memory-security#context-02
- id: hook-03
  relation: fits
  acs:
    concept: 'Checks after a step (after-gates, `verify`, failure modes): they cannot prevent the step;
      they can stop, redirect, or roll back to the latest checkpoint. Capability outputs are objects checked
      against an `output_schema`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.6 Gate Semantics (lines 383-392; quote at line 388)
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 175-178)
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition, `output_schema` (line 119)
    - schemas/capability_ontology.yaml lines 1117-1121 (mutate output requires `success` and `evidence_anchors`)
    quote: '- An after-gate cannot `skip` (S303): the step has already run.'
  sa:
    concept: Hooks that replace a tool result after execution (`after_tool_call_success`, `after_tool_call_failure`,
      `before_store_tool_result`); tool results are strings
    refs:
    - content/0.2.0/specification/hooks.md §5.2 before_store_tool_result (lines 386-398)
    - content/0.2.0/specification/hooks.md §5.3 after_tool_call_success (lines 400-412; quote at line
      411)
    - content/0.2.0/specification/hooks.md §5.4 after_tool_call_failure (lines 414-428)
    - content/0.2.0/getting-started/examples.md §3 Hooks (lines 544-550)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult; `result?: string` at line 221)'
    quote: If hook returns a result, it replaces the original
  explanation: 'These hooks run after the tool has executed, so like an ACS after-gate they cannot prevent
    the effect; they control what is stored and therefore what the model sees next. Their strength is
    limited: §5.2 gives `before_store_tool_result` a signature and use cases but no behaviour statement,
    §5.3''s replacement rule has no uppercase MUST or SHOULD, and the statement that the returned object
    is what the runtime stores is on the examples page, which uses no requirement keyword. `after_tool_call_failure`
    may return a replacement result, so a hook could turn a guard''s denial into an apparent success in
    stored history (inference from the return type; the effect still did not happen). Turning a successful
    mutating call into an error after the effect invites the model to retry and repeat it.'
  combined: 'Check outputs in the wrapper, not in a hook. SA tool results are strings (`result?: string`),
    while ACS capability outputs are objects with required fields such as `evidence_anchors`: every grounded
    tool returns JSON text, and after the inner `execute` returns the wrapper parses it and validates
    it against the capability''s `output_schema`. For a non-mutating capability it returns an error result
    when validation fails. For a mutating capability it returns success with the finding in the result
    and in the record, never an error, because the effect has happened. Use `after_tool_call_success`
    only for tools that cannot be wrapped (prompt tools), as best effort; never rely on it for checkpoint
    or approval rules.'
  see_also:
  - tools-contracts#io-03
  - tools-contracts#io-06
  - published-api-extension-points#tools-04
  - checkpoint-rollback-state#state-19
  - evidence-audit-observability#collect-02
