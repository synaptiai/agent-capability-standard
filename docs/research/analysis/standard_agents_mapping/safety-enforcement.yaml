# Safety flags, ontology edges and enforcement
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: safety-enforcement
title: Safety flags, ontology edges and enforcement
rows:
- id: gate-01
  relation: acs_only
  acs:
    concept: Denying a tool call before it runs. In ACS this is what the reference safety layers do (the
      Claude Code PreToolUse hook, the SDK adapter's PreToolUse hook in strict mode, skill-scoped hooks);
      the Standard itself names 'safety layers' once and does not define them
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
    - spec/SECURITY.md §5.1 Pre-Tool Use Hooks (lines 276-280)
    - hooks/hooks.json PreToolUse matcher (lines 3-13)
    - hooks/pretooluse_require_checkpoint.sh exit-code contract (lines 9-11)
    - grounded_agency/adapter.py lines 525-641 (_make_pretooluse_safety_hook; strict-mode deny at lines
      627-630; strict_mode default at line 178)
    - skills/send/SKILL.md frontmatter hooks (lines 9-46)
    quote: Validators, executors and safety layers MUST act on effective flags.
  sa:
    concept: '`tool_call_started`: the only tool hook that fires before execution, and observational.
      `before_create_message` and the request-context hooks also run before a tool executes, but nothing
      says they can stop or change a tool call'
    refs:
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36)
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384; quote at line 382)
    - content/0.2.0/specification/hooks.md §4.1 before_create_message (lines 310-322)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §5.2 Error Handling (line 92)
    - content/0.2.0/specification/providers.md §10.1 Overview (line 602)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6283-6315 (HookSignatures.tool_call_started), 6109-6112
      (before_create_message comment), 6359 (HookName)'
    quote: The return value **MUST** be ignored; the hook cannot modify the tool call.
  explanation: 'SA 0.2.0 lists 14 thread hooks. Of the five tool hooks only `tool_call_started` fires
    before execution: its return value MUST be ignored, and without a `progressArgument` its arguments
    MAY be an incomplete JSON fragment. The text does not say the runtime waits for it. `before_create_message`
    runs on the assistant message that carries the tool calls (Runtime §3, steps 4 and 5) and the request-context
    hooks run before the model call; none is specified to stop a call the model returned. The published
    `HookSignatures` has no pre-execution hook with a meaningful return. On the ACS side the SDK hook
    denies a missing checkpoint only in strict mode (the default). Searched: before_tool, pre_tool, before_execute,
    veto, deny, permission, guard, intercept, prevent, refus, authoriz, confirm, consent, approv, block:
    no pre-execution veto hook found.'
  combined: 'Not possible with a hook in SA 0.2.0. For a locally executed function tool, the decision
    point every conforming runtime honours is the tool''s own `execute`: a wrapper around `defineTool()`
    runs the ACS guard first and returns `{ status: ''error'', error }` without performing the effect;
    Runtime §5.2 requires the error to be persisted as the tool result and the loop to continue. That
    guard runs on every invocation path of the tool (model call, `invokeTool`, `queueTool`). A prompt
    tool or an agent can be fronted by a guard tool that alone is offered to the model and reaches the
    target through `state.invokeTool` under `uses`; this relies on runtimes not executing unoffered calls,
    which 0.2.0 does not state. Provider-executed tools and injected lifecycle tools cannot be guarded.'
  see_also:
  - published-api-extension-points#tools-06
  - checkpoint-rollback-state#state-07
  - approval-human#approval-01
  - workflow-execution#wf-14
- id: gate-02
  relation: partial
  acs:
    concept: 'Contract checks made before any host code runs: typed bindings between workflow steps, checked
      by the validator (B201 to B203)'
    refs:
    - spec/STANDARD-v1.1.0.md §3.5 Explicit Contracts (line 102)
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition, `input_schema` (line 118)
    - spec/STANDARD-v1.1.0.md §5.5 Consumer Contract Checking (lines 335-361)
    - schemas/capability_ontology.yaml lines 1102-1116 (mutate input_schema)
    quote: '- Type mismatches MUST be detected at validation time'
  sa:
    concept: 'Built-in rejections a runtime applies before a tool or child runs, none of which evaluates
      an author-supplied predicate at call time: argument validation, the `uses` list, undeclared or disabled
      relationships, required subagent arguments, `maxInstances`, a terminated thread'
    refs:
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 148-156; quote at line 152)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 44), §3 Variable Declarations
      (line 61)
    - content/0.2.0/specification/prompts.md §5.2 Schema Usage (line 218)
    - content/0.2.0/specification/subagents.md §1 (lines 38, 44), §3.3 (line 110), §5 Lifecycle Tools
      (line 163), §5.1 (line 175)
    - content/0.2.0/infrastructure/runtime.md §7.2 Lifecycle Tooling (line 131), §7.3 (lines 139-140),
      §10 Termination Semantics (line 232)
    - content/0.2.0/specification/threads.md §2.3 (line 238), §8 Lifecycle (line 473)
    quote: '- validate tool args against the declared schema.'
  explanation: 'SA''s pre-execution rejections are fixed and declarative. Implementations MUST validate
    tool args against the declared schema (the text does not say a failing call is not executed) and prompt-tool
    inputs against `requiredSchema`; MUST reject an invocation outside a supplied `uses` list; MUST reject
    lifecycle invocations that target undeclared or disabled relationships; MUST reject creation when
    required subagent arguments are missing. Creation beyond `maxInstances` MUST return tool errors in
    Runtime §7.2 but SHOULD in Subagents §1, with create-or-continue for a blocking single-instance relationship.
    A `required: true` variable ''means execution cannot continue until a value resolves'' (no uppercase
    keyword). None of these evaluates a predicate the agent author supplies at call time, and none performs
    ACS''s type checks between steps.'
  combined: 'Keep each SA tool''s own `args` schema; do not replace it with the capability''s ontology
    `input_schema`, which is generic (for `mutate`: a `target` string and an untyped `operation` object).
    Bind by capability id and let the wrapper build the ACS-shaped input for its action record. For contract
    checks between steps, write the sequence as an ACS workflow and validate it offline with the ACS validator
    (edge-01, route 1). Do not use an `optional` relationship flag as an approval gate: the flag is not
    single-use, `setEnv` propagates to active descendants, and Runtime §7.3 says only that runtimes ''should
    evaluate relationship flags before exposing/executing them''.'
- id: gate-03
  relation: fits
  acs:
    concept: 'Closed composition: a workflow''s steps are a declared list of capabilities, each checked
      against the ontology before the run (V101)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition (lines 232-243)
    - spec/STANDARD-v1.1.0.md §9.2 Validation Errors, V101 (line 1276)
    quote: '| V101 | UNKNOWN_CAPABILITY | Capability ID not found in ontology |'
  sa:
    concept: '`uses`: a runtime-enforced allow-list of the tools, prompts and agents a function tool may
      invoke by name through `state.invokeTool()` or `state.queueTool()`. It bounds composition, not side
      effects'
    refs:
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44; quote at line 44)
    - '@standardagents/spec 0.45.10 index.d.ts lines 449-484 (DefineToolOptions.uses; comment at line
      456), 359-399 (UsesConstrainedState, EmptyUsesState at line 391)'
    - '@standardagents/spec 0.45.10 index.d.ts lines 2913, 2919 (getChildThread and getParentThread return
      ThreadState)'
    quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
      the list.
  explanation: '`uses` is a static, runtime-enforced bound on what one tool can invoke by name: an empty
    list permits no targets, a packed tool MUST declare its targets, and when `uses` is omitted the restriction
    does not apply. It says nothing about order or preconditions and does not apply to calls the model
    makes. It does not make a tool non-mutating: the published `EmptyUsesState` removes only `queueTool`
    and `invokeTool`, so file, key-value, environment, message and effect methods remain, and `getChildThread()`
    returns an unconstrained `ThreadState`. Text and types differ on the failure shape: the text says
    `invokeTool()` returns an error result and `queueTool()` throws; the type comment says unlisted calls
    ''will throw an error''. Compile-time narrowing applies only when the list is written `as const`.'
  combined: 'A function tool that implements an ACS workflow declares `uses` as exactly the tools bound
    to its steps'' capabilities, so the runtime rejects any other target. It wraps each `invokeTool` call
    in try/catch and also checks `status`, because text and types disagree on how a rejection surfaces.
    `uses: []` on a tool bound to a non-mutating capability shows that it cannot invoke a mutating tool
    by name; it shows nothing about the tool''s own code. Not stated in 0.2.0: whether lifecycle names
    such as `subagent_create` are valid `uses` targets, which a guarded tool that spawns a child (scope-01)
    would need.'
  see_also:
  - tools-contracts#cls-07
  - tools-contracts#cls-13
  - published-api-extension-points#thread-06
  - published-api-extension-points#tools-05
  - approval-human#approval-16
  - workflow-execution#wf-20
  - workflow-execution#wf-26
  - multi-agent#coord-01
  - multi-agent#coord-20
  - packaging-conformance-governance#pkg-08
- id: gate-04
  relation: partial
  acs:
    concept: Read-only delegation (`delegate.read_only`, attested by the host as `effective.read_only`)
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 917-922; quote at line 921)
    quote: standard does not say how a host enforces `read_only`, only that
  sa:
    concept: 'What a prompt offers the model: the prompt `tools` list, `toolChoice: ''none''`, `hidden`
      relationships that never appear in a model request, and the model definition''s `providerTools`'
    refs:
    - content/0.2.0/specification/prompts.md §3 Tool Configuration (lines 93-176), §4.2 Tool Choice Behavior
      (lines 190-199)
    - content/0.2.0/infrastructure/runtime.md §7.3 (line 143)
    - content/0.2.0/specification/subagents.md §1 `hidden` (line 45), §5 Lifecycle Tools (line 163)
    - content/0.2.0/specification/models.md §1.2 Optional Properties, `providerTools` (line 34)
    - content/0.2.0/specification/agents.md §5 Tool Exposure (line 128)
    - '@standardagents/spec 0.45.10 index.d.ts line 391 (EmptyUsesState)'
    quote: '- `hidden`: the relationship stays declared and spawnable by runtime code (`invokeTool`/`queueTool`
      from hooks, tools, and handlers), but the tool **MUST NOT** appear in any LLM request''s tool list'
  explanation: 'An agent whose prompts offer only tools classified non-mutating exposes no mutating tool
    to the model, and a hidden relationship MUST NOT appear in any request''s tool list. Whether the agent
    is read-only also depends on the code of those tools and of its hooks, handlers and effects, which
    all hold a full `ThreadState`; on provider tools named in the model definition; and on handoff agents
    listed in `tools`. No sentence requires a runtime to refuse a model tool call that names a tool it
    was not offered; for `toolChoice: ''none''` the requirement is placed on the LLM. Searched: tool list,
    not in the, unlisted, unknown tool, no such tool, unrecogni, hallucinat, undeclared, not offered,
    not exposed, invalid tool, nonexistent: no such sentence found.'
  combined: 'Bind `read_only: true` to a child agent whose prompts offer only tools bound to capabilities
    with `mutation: false`, whose tools declare `uses: []`, whose model lists no `providerTools`, whose
    prompts list no handoff agents, and whose tool, hook, effect and handler code has been reviewed (or
    lint-checked) to make no external write. Report `effective.read_only: true` only with that review;
    otherwise report `false`. The attestation rests on the author''s review, not on an SA mechanism, and
    on runtimes not executing unoffered tool calls, which 0.2.0 does not state.'
  see_also:
  - published-api-extension-points#thread-06
  - multi-agent#coord-06
  - multi-agent#coord-10
  - models-context-memory-security#secrets-03
- id: gate-05
  relation: partial
  acs:
    concept: 'Workflow gates that stop a run before a step (`action: stop`, R403) and the recommended
      `constrain` before acting (W601)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.6 Gate Semantics (lines 363-392)
    - spec/STANDARD-v1.1.0.md §9.5 Runtime Errors, R403 (line 1312)
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 89-92)
    - spec/STANDARD-v1.1.0.md §4.3, `soft_requires` row (line 169)
    quote: '| R403 | GATE_BLOCKED | A gate stopped the run, or a condition was false with `skip_if_false:
      false` |'
  sa:
    concept: 'Ways a hook can stop progress: request-context hooks as optional ''policy gates'', the undefined
      `hook_blocked` stop reason, `before_create_message` failures, and `state.execution.stop()` called
      from a hook'
    refs:
    - content/0.2.0/specification/hooks.md §3.3 prefilter_llm_history, Note (line 273)
    - content/0.2.0/specification/hooks.md introduction (line 5), §2.1 (line 136), §4.1 (line 322)
    - content/0.2.0/specification/threads/execution-state.md §3 Controlling Execution (lines 57-70), §4.2
      Reasons (lines 105-114)
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics item 2 (line
      351)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2199-2202 and 2229-2236 (run-state comments), 2609-2614
      (ExecutionState.stop)'
    quote: Runtimes may support request-context hooks acting as **policy gates** — refusing to let a request
      proceed (for example, a moderation gate erroring out of `prefilter_llm_history`).
  explanation: ACS gates belong to a declared workflow; a model-driven SA loop declares none. The nearest
    SA analogue, a request-context hook that refuses a model request, rests on a note with a lowercase
    'may' (SA states no keyword convention, so reading it as optional is an inference), acts before the
    model has produced the call it would judge, and signals by 'erroring out' on a page that calls hook
    failures non-fatal. `hook_blocked` occurs once in the text and once in the published types, which
    also say 'a hook block'; nothing says what produces it. `before_create_message` failures SHOULD prevent
    message creation. Every thread hook can call `state.execution.stop()`; its effect on tool calls already
    returned in the same response is not stated.
  combined: 'Workflow gates need no SA mechanism: the ACS executor evaluates them when SA code hosts it
    (exec-01). For a coarse stop in a model-driven agent use a latch: the guard writes a key such as `acs.halted`
    with `state.setValue`, and every grounded tool refuses while it is set (visibility across tools, hooks
    and endpoints is a MUST of the key-value store). The guard may also call `state.execution.stop()`.
    Treat a `prefilter_llm_history` policy gate only as an optional extra on runtimes that support it:
    a conforming runtime may treat the thrown error as a non-fatal hook failure and send the request.'
- id: ckpt-01
  relation: acs_only
  acs:
    concept: A checkpoint before every `mutate`, `send` and `rollback` (the ontology's `requires` edges,
      V102) and before any step whose effective `requires_checkpoint` is true (F501). Both are validator
      diagnostics; at run time the reference executor asks the host for a checkpoint and raises F501 only
      when none can be taken
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88)
    - spec/STANDARD-v1.1.0.md §4.4 Safety-Critical Capabilities (lines 182-188)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 279-284)
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 681-682), §9.6 Safety Errors (lines
      1321, 1323)
    - spec/EDGE_TYPES.md §1 requires (lines 30-48)
    - schemas/capability_ontology.yaml lines 1763-1771 (requires edges), 1095-1101 (mutate flags), 1247-1251
      (rollback has no requires_checkpoint)
    - core/src/validate/semantics.rs line 385; core/src/exec/machine.rs lines 644-677 (rollback, checkpoint),
      2044-2056 (F501 when the host cannot take a checkpoint)
    - spec/SECURITY.md §1.1 Mutation Requires Checkpoint (line 13)
    quote: '- A `checkpoint` MUST run before every `mutate`, `send` and `rollback` (the'
  sa:
    concept: 'No counterpart. Nearest building blocks: the durable per-thread key-value store and the
      thread file system'
    refs:
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics (lines 348-358;
      quote at line 350)
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-445)
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 74)
    quote: 1. Values **MUST** be persisted to durable per-thread storage that survives execution boundaries,
      process restarts, and runtime redeploys.
  explanation: 'SA has no concept of a restore point and no rule tying one tool to an earlier one. The
    ACS rule differs by capability: `mutate` and `send` carry `requires_checkpoint`; `rollback` does not,
    its rule is the `requires` edge (V102 statically), and at run time a rollback with no checkpoint is
    F503, not F501. ACS''s layers also differ at run time: the plugin hook and the SDK adapter deny a
    call that lacks a checkpoint, while the executor asks the host to create one. Searched content/0.2.0
    and the published types: checkpoint, rollback, roll back, revert, backup, transaction, savepoint,
    compensat: not found; ''rolled back'' once (handlers.md §5); ''undo'' only inside ''undocumented'';
    restor: subagent arguments and, on the draft Users page, sockets.'
  combined: 'Bind `checkpoint` to a function tool that saves what the agent''s mutating tools can change
    and writes a marker with `state.setValue`; its scope is fixed in code, or recorded so that the guard
    can check that it covers the call''s target. Tools bound to `mutate`, `send`, or a capability with
    a raised `requires_checkpoint` return an error result carrying F501 when no valid marker exists; this
    follows the ACS hooks (deny), not the executor (create). The tool bound to `rollback` returns F503
    when no checkpoint record exists. Coverage: wrapped tools only; nothing for unwrapped tools, provider-executed
    tools or tools inside packed children. The marker shows that code in this thread wrote the key, no
    more (trust-01).'
  see_also:
  - published-api-extension-points#thread-05
  - checkpoint-rollback-state#state-04
  - checkpoint-rollback-state#state-05
  - checkpoint-rollback-state#state-20
  - approval-human#approval-09
  - approval-human#approval-19
- id: ckpt-02
  relation: fits
  acs:
    concept: 'Checkpoint lifetime: one checkpoint authorises one step that requires one, is consumed when
      that step is about to run, and no longer authorises anything after a wait or delay (W608); `rollback`
      uses the latest checkpoint whether or not it was consumed'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Checkpoints (lines 145-148; an informative
      guide)
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 777-790, 792-802)
    - core/src/exec/machine.rs lines 644-677 (rollback, checkpoint), 865-884 (invalidate_checkpoints)
    - grounded_agency/adapter.py lines 543-546 (reservation by tool_use_id), 643-699 (consumed after a
      successful call, released after an error)
    - tests/conformance/runtime/checkpoint_per_mutation.json line 2 (an informative runtime fixture)
    quote: '- **Checkpoints.** One checkpoint authorises one step that requires one,'
  sa:
    concept: 'Storage and ordering a marker can rely on: the durable per-thread key-value store, `execution.flowId`,
      and sequential execution of model-issued tool calls within a thread'
    refs:
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics (lines 348-358;
      quote at line 351)
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88), §11 Concurrency (line 239)
    - content/0.2.0/specification/threads/execution-state.md §1 Availability (lines 9-11), §2 Execution
      Properties (line 23), §4.1 States (lines 99-103)
    - content/0.2.0/specification/threads.md §1.2.1 Properties (line 49), §6.2 Per-Execution Context and
      §6.3 (lines 372-406)
    quote: 2. A value written by `setValue(key, value)` **MUST** be visible to every subsequent `getValue(key)`
      on the same thread, across any execution context (tools, hooks, endpoints).
  explanation: 'SA has no checkpoint concept but supplies what a marker needs. Tool calls MUST execute
    sequentially and a thread MUST NOT execute concurrent flows, so check-then-consume inside one model-issued
    call cannot race another model-issued call of that thread. Not covered: the same tool invoked from
    a thread endpoint or an effect, or several `invokeTool` calls awaited together; `setValue` has no
    compare-and-set, and the only cross-thread store with a serialisation guarantee is the user scope
    of the draft Users page (edge-02). To mirror ACS''s rule that a wait invalidates checkpoints, the
    marker is stamped with `execution.flowId`; that a later human turn starts a new flow is an inference.
    `state.context` is no substitute: its sharing across tool calls is described without MUST.'
  combined: 'Checkpoint tool: `state.setValue(''acs.checkpoint'', { checkpoint_id, flowId, valid: true,
    scope })`, with `const flowId = state.execution?.flowId` (the property is typed `ExecutionState |
    null`); deny when it is absent. Guard for `mutate`, `send` and a raised `requires_checkpoint`, in
    the executor''s order: approval decision first, then require `valid` and the same `flowId`, write
    `valid: false`, then perform the effect. This consumes before the effect, as the executor does; the
    SDK adapter consumes only after a successful call. The rollback tool requires only that a checkpoint
    record exists in the thread, with any `valid` and any `flowId`, and does not consume it. Wrap the
    guard in try/catch and deny on error. A child thread needs its own checkpoint (scope-01).'
  see_also:
