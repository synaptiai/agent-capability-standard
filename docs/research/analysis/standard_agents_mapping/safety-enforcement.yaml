- id: flags-02
  relation: partial
  acs:
    concept: 'Effective flags: a declaration may strengthen but never weaken the ontology''s safety flags
      (W602)'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (line 93)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 272-277)
    - spec/STANDARD-v1.1.0.md §9.7 Warnings, W602 (line 1332)
    - grounded_agency/capabilities/mapper.py lines 304-337 (register_mcp_tool takes caller-chosen flags)
    quote: '- A workflow cannot weaken a capability''s safety flags (§5.2.1)'
  sa:
    concept: 'Hook scoping: a non-empty prompt `hooks` array replaces the agent''s hooks for that prompt;
      only `parentHooks` are mandatory and fail closed'
    refs:
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-100)
    - content/0.2.0/specification/prompts.md §8 Hook Scoping (lines 258-277; quote at line 272)
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (lines 132-167)
    - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 147-163)
    quote: '- When `hooks` is non-empty, only those hooks form the prompt base set'
  explanation: 'In SA the hooks that run are chosen per prompt: a non-empty prompt `hooks` array is the
    base set and the agent''s `hooks` array is the fallback (it also serves at-rest operations), so adding
    one hook to a prompt drops every agent-level hook for that prompt, including an audit or redaction
    hook. The one mandatory mechanism is `parentHooks`: composing a child MUST activate its required hooks
    on the direct parent for every prompt on either side, and a missing, invalid or unloadable hook MUST
    fail composition closed. An in-tool guard cannot be dropped by a prompt, so a no-weakening rule can
    hold for wrapped tools, provided the wrapper computes effective flags itself. ACS''s own Python mapper
    does not: `register_mcp_tool` accepts caller-chosen flags without combining them with the ontology''s.'
  combined: 'Keep enforcement in the tool. For audit hooks that must not be dropped, the primary route
    is to list them in every prompt''s `hooks` and lint for it. A workaround uses composition: a carrier
    agent with `exposeAsTool: true` (the text grants `parentHooks` to exposed agents, and the published
    validator reports `agent_parent_hooks_invalid` otherwise), a `toolDescription`, and `parentHooks:
    [{ hook, reason, stage }]` naming a thread-scoped hook in the carrier''s own package namespace, composed
    as `{ agent, hidden: true }`. Composition then activates the hook for every prompt of the parent and
    fails closed when it cannot load; composition UIs MUST disclose the hook ID, reason and stage. The
    text does not describe this use, and such a hook still fails non-fatally.'
  see_also:
  - published-api-extension-points#hooks-01
  - published-api-extension-points#hooks-02
