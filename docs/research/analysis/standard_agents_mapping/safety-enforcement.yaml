    - spec/STANDARD-v1.1.0.md §4.2 Layers (lines 129-143)
    quote: '| `mutation` | boolean | No | Whether the capability changes persistent state (default false)
      |'
  sa:
    concept: Side effects can originate in tools, hooks, handlers, effects, thread endpoints, sandboxed
      code with bridged functions, and provider-executed tools
    refs:
    - content/0.2.0/specification/effects.md introduction and §1.1 Purpose (lines 3-13; quote at line
      3)
    - content/0.2.0/specification/hooks.md introduction (line 3)
    - content/0.2.0/specification/handlers.md §6 Capabilities (lines 79-88)
    - content/0.2.0/specification/threads/endpoints.md §3 Handler Signature (lines 63, 67)
    - content/0.2.0/specification/providers.md §10.1 Overview (line 602)
    - content/0.2.0/specification/models.md §1.2 Optional Properties, `providerTools` (line 34)
    - content/0.2.0/infrastructure/runtime.md Code Execution Runtime, Value Marshaling (lines 280-282)
    - '@standardagents/spec 0.45.10 index.d.ts lines 439-448 (executionMode), 1014-1021 (ProviderResponse.providerTools),
      4001 (model providerTools)'
    quote: Effects are scheduled side-effect handlers that run outside normal tool execution.
  explanation: 'A tool-call safety layer sees tool calls. In SA, state-changing code also runs in effects
    (outside normal tool execution), in hooks (whose definition lists side effects), in handlers, in thread
    endpoints, in `runCode` when the caller bridges host functions into the sandbox, and in provider-executed
    tools, which the Providers page says execute server-side and which the published types call informational,
    adding that they ''must not be re-executed locally''. None of these passes through a function tool''s
    `execute`, and the text does not say which tool hooks, if any, fire for them. Provider tools are enabled
    per model (`providerTools` in the model definition), not in a prompt''s `tools`. Searched content/0.2.0:
    executionMode, provider-executed: not found in the text.'
  combined: 'A convention for a grounded SA agent, not something SA can enforce: every external write
    goes through a grounded tool; effects, hooks, handlers and endpoints that need to write call that
    tool with `state.invokeTool` instead of writing directly; `runCode` is given no bridged function that
    writes; and provider-executed tools bound to mutating capabilities are left out of the model definition''s
    `providerTools`.'
