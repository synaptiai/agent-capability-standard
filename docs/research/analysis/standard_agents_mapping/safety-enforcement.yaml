- id: trust-01
  relation: partial
  acs:
    concept: 'The safety layer''s own state is kept outside the tools it governs: the plugin hook checks
      every Write, Edit, MultiEdit, NotebookEdit and Bash call and, by its own comment, its checkpoint
      marker is written outside those tools'
    refs:
    - hooks/pretooluse_require_checkpoint.sh (lines 36-41; quote at line 40)
    - hooks/hooks.json PreToolUse matcher (lines 3-13)
    quote: '# is not trusted to be. The marker itself is written outside these tools'
  sa:
    concept: 'A per-thread key-value store with no access control inside the thread: every tool, hook,
      endpoint and effect of the thread, and hooks contributed by a composed child, can read and write
      the guard''s records'
    refs:
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics items 2 and 3
      (lines 351-352)
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (lines 155, 163; quote at line 163)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 95-97)
    - content/0.2.0/specification/threads.md §1.2 ThreadState Interface (line 34), §7.2 Semantics (lines
      424-433)
    quote: The hook receives the parent's `ThreadState` and remains active for the lifetime of the enabled
      relationship.
  explanation: 'SA isolates key-value data between threads (values MUST NOT be readable by any other thread)
    and has no access control inside a thread: `ThreadState` is one interface for tools, hooks and endpoints,
    so any of them can write the checkpoint marker, the approval record or the halt latch. A model-callable
    checkpoint tool with a model-chosen scope can also checkpoint nothing. Hooks that a composed child
    requires run with the parent''s `ThreadState`, so composing a child with `parentHooks` lets code from
    its package rewrite the parent''s tool results and markers. The in-tool guard therefore controls model-chosen
    calls; it is not a boundary against code running in the same thread. Searched content/0.2.0 and the
    published types: access control, per-key, ACL, read-only key: no per-key protection found.'
  combined: 'State the trust limit in the binding: the guard constrains what the model can cause through
    grounded tools, on the assumption that all definition code in the thread (tools, hooks, handlers,
    effects, endpoints, and hooks contributed by composed children) is trusted. Fix the checkpoint tool''s
    scope in code. Review the `parentHooks` a package discloses before composing it; composition UIs MUST
    disclose the hook ID, reason and stage. Where co-located code is not trusted, keep the decision record
    outside the thread, in an external store the grounded tools consult, rather than in the key-value
    store; for a packed agent such a store is an external service its core behaviour depends on, which
    falls under packaging.md ''Portability requirements'' (packaging-conformance-governance#pkg-07).'
  see_also:
