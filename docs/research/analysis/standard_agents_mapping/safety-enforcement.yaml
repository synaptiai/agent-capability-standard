- id: scope-01
  relation: partial
  acs:
    concept: 'Reach of the safety rules across nested runs: an invoked workflow shares the caller''s checkpoints;
      delegation settings are attested by the host; `delegate` itself carries no checkpoint or approval
      flag'
    refs:
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 786-790; quote at line 788)
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 917-922)
    - 'schemas/capability_ontology.yaml lines 1443-1447 (delegate: `risk: medium`, `mutation: false`)'
    quote: run it invokes shares the caller's checkpoints, so its waits invalidate
  sa:
    concept: 'Child threads are isolated: key-value data is not shared, hooks do not flow from parent
      to child, a package''s internal tools are hidden. A parent can pass values down and read a child''s
      persisted history afterwards'
    refs:
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Runtime Semantics items 3 and 8
      (lines 352, 357)
    - content/0.2.0/specification/hooks.md §1.1 (line 24), §1.3 Hook Scoping (lines 76-93)
    - content/0.2.0/specification/agents.md §5 Tool Exposure (line 128), §6 Required Parent Hooks (line
      160)
    - content/0.2.0/distribution/packaging.md Visibility Rules (lines 221-230)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (line 94), §2.3 (line 238)
    - content/0.2.0/specification/subagents.md §1 (lines 41-42, 45), §5 Lifecycle Tools (lines 157-163),
      §6.2 (lines 197-203)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6035-6044 (after_subagent_created)'
    quote: Values **MUST NOT** be automatically copied, inherited, or synchronized between threads when
      subagents are spawned.
  explanation: 'An SA parent cannot extend its checks into a child thread: the child''s hooks come from
    the child''s own prompts and agent, the parent''s key-value markers are not readable there, and a
    package''s internal tools and prompts are hidden from outside, so a host cannot wrap them. The parent
    can pass values down (`setEnv` propagation, `scopedEnv`, creation arguments, the `after_subagent_created`
    hook, which receives the child''s `ThreadState`) and can read the child''s persisted history afterwards
    through `getChildThread()`; no text restricts that for packed children. It cannot gate the child''s
    tool calls. ACS states the same limit for delegation (the host attests `effective`) but shares checkpoints
    with invoked workflows. A handoff agent is not a child: it takes over the same thread and sees the
    same markers.'
  combined: 'Treat each SA thread as its own ACS run: a child takes its own checkpoint before it mutates.
    Treat composing an ungrounded packed agent as an ACS `delegate` step whose effects are unknown: declare
    every relationship of that side `hidden`, since any visible relationship gives the model the lifecycle
    tools; spawn the child from a guarded tool bound to `delegate`, with `requires_approval` and `requires_checkpoint`
    raised as the deployment needs (the ontology gives `delegate` neither); set `parentCommunication:
    ''explicit''` if the child''s reference must stay out of model context; and do not offer ungrounded
    agents as handoff tools. The code-facing call shape for spawning is not fixed by 0.2.0.'
  see_also:
