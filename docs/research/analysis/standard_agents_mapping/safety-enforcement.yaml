- id: hook-02
  relation: partial
  acs:
    concept: 'Observing tool use for an audit trail: the plugin''s PostToolUse log of `Skill` invocations,
      skill-scoped PostToolUse logs, the SDK adapter''s evidence collector, and workflow action records'
    refs:
    - hooks/hooks.json PostToolUse matcher (lines 14-24)
    - hooks/posttooluse_log_tool.sh (lines 1-12; quote at line 2)
    - spec/SECURITY.md §5.2 Post-Tool Use Hooks (lines 282-286)
    - grounded_agency/adapter.py lines 335-339 (evidence collector, no matcher), 349-352 (a separate failure
      hook)
    - skills/send/SKILL.md lines 41-46 (skill-scoped PostToolUse log)
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 898-902, the action record)
    - schemas/capability_ontology.yaml line 1336 (the `audit` capability)
    quote: '# Append a skill usage line to .claude/audit.log with HMAC integrity chain.'
  sa:
    concept: '`tool_call_done` (observational; MUST be called once per tool call, on success and on failure),
      with `after_tool_call_success` and `after_tool_call_failure`'
    refs:
    - content/0.2.0/specification/hooks.md §5.5 tool_call_done (lines 430-444; quote at line 440)
    - content/0.2.0/specification/hooks.md §5.3 and §5.4 (lines 400-428), §6.2 and §6.3 (lines 465-490),
      §1.2 (line 68), §1.3 (line 87)
    - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store, Capacity and Errors (line 362)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5967-5984 (HookToolResult), 211-249 (ToolResult),
      2280-2287 (WriteFileOptions)'
    quote: Implementations **MUST** call this hook once per tool call, whether it succeeded or failed.
  explanation: 'For its firing guarantee SA is the stronger side: `tool_call_done` MUST be called once
    per tool call with the call (id, name, JSON arguments) and its result, whereas the Claude SDK needs
    separate success and failure hooks and the ACS plugin hook matches `Skill` invocations only. Limits
    for an ACS audit record: the hook runs only where a prompt or agent lists it (flags-02); its failure
    is non-fatal; the text does not say whether it receives the tool''s original result or a rewritten
    one, nor whether it fires for tools run through `invokeTool` or `queueTool` or for provider-executed
    tools; and `HookToolResult` has no `error_code`, although the published `ToolResult` does. The comparison
    concerns firing, not the integrity of what is stored (audit-01).'
  combined: 'The guard wrapper writes the authoritative record for every grounded call (allowed, denied,
    approved) under its own key, or sends it to an external sink, because only it knows the capability,
    the code and the decision. A `tool_call_done` hook (`defineHook({ hook: ''tool_call_done'', id: ''acs_audit'',
    execute })`) adds coverage for calls the wrapper does not see, writing one key or file per `toolCall.id`:
    neither `setValue` nor `writeFile` appends, and key-value caps are implementation-defined. Arguments
    may hold secrets, and hooks MUST NOT expose sensitive data in logs. State that completeness depends
    on which invocation paths fire the hook, which 0.2.0 does not say.'
  see_also:
  - tools-contracts#cls-04
  - published-api-extension-points#handler-01
  - published-api-extension-points#hooks-02
  - evidence-audit-observability#action-01
  - evidence-audit-observability#audit-01
  - evidence-audit-observability#audit-04
