- id: err-01
  relation: partial
  acs:
    concept: Safety diagnostics with fixed codes and a fixed JSON format (F501, F502, F503, F504)
    refs:
    - spec/STANDARD-v1.1.0.md §9.6 Safety Errors (lines 1317-1325; quote at line 1321)
    - spec/STANDARD-v1.1.0.md §9.8 Diagnostic Format (lines 1348-1370)
    - grounded_agency/adapter.py lines 203-218 (_checkpoint_denial returns prose)
    - grounded_agency/errors.py lines 1-12, 73 (the §9 codes and format)
    quote: '| F501 | CHECKPOINT_REQUIRED | Mutation without checkpoint |'
  sa:
    concept: Tool error results, persisted as tool messages; `error_code` and `error_data` exist in the
      published types only
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 155)
    - content/0.2.0/specification/hooks.md §6.3 HookToolResult (lines 478-488)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 19, 29)
    - content/0.2.0/specification/threads/runtime-streams.md line 82 (an example that returns `error_code`)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult; error_code at line 230, error_data
      at line 236), 1001-1007 (ProviderToolResultContent)'
    quote: Tool errors **MUST** be persisted as tool results and **MUST NOT** crash the execution loop.
  explanation: 'An in-tool denial maps cleanly onto an SA error result: it MUST be persisted and the loop
    MUST continue, so the model sees the reason and can take a checkpoint or seek approval, the same recovery
    path the Claude Code hook gives. The 0.2.0 text never defines the `ToolResult` object that `execute`
    returns (it appears only as a type name); the published types define it with `error_code` and `error_data`.
    The persisted message has `tool_status` but no code field, and no hook receives a code. The SA binding
    would be more structured than ACS''s own SDK layer, whose denial is prose without a code. The consequences
    differ: an unhandled F501 or F502 ends an ACS workflow run, while in SA the loop continues until `maxSteps`
    or a runtime cap.'
  combined: 'The guard returns `{ status: ''error'', error: ''F501 CHECKPOINT_REQUIRED: take a checkpoint
    first'', error_code: ''F501'', error_data: <the §9.8 diagnostic> }`. Keep the code and the remedy
    in `error`: `status` and `error` are in the text, and the published provider tool-result content type
    has an error string and no code field. For `error_data` use the §9.8 diagnostic unchanged with `location:
    { capability, tool }` (its `location` MAY carry further keys) and the remedy in `suggestion`. `error_code`
    and `error_data` are in the published types only, so a consumer must tolerate their absence.'
  see_also:
  - tools-contracts#io-06
  - published-api-extension-points#tools-04
  - checkpoint-rollback-state#state-23
  - workflow-execution#wf-08
  - packaging-conformance-governance#diag-03
- id: err-02
  relation: partial
  acs:
    concept: A safety error ends the workflow run with its code unless a failure mode handles it; ACS's
      tool-call layers instead deny the call and let the model recover
    refs:
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 691-693; quote at line 693)
    - core/src/exec/mod.rs lines 172-179 (Body::Failed)
    - grounded_agency/adapter.py lines 627-630 (strict mode denies, non-strict mode logs)
    quote: the run with its code, and a step that did not fail goes on to the next.
  sa:
    concept: 'Ending a run or a session from code: `state.execution.stop()`, `state.stopSession()` (a
      successful stop), the model-called `sessionFail` binding, and run-status reason codes'
    refs:
    - content/0.2.0/specification/threads/execution-state.md §3 Controlling Execution (lines 57-70; quote
      at line 70), §4.2 Reasons (lines 105-114)
    - content/0.2.0/specification/threads.md §9.3 Parent Messaging (line 540)
    - content/0.2.0/specification/agents.md §1.2 SideConfig (lines 46, 57)
    - content/0.2.0/specification/subagents.md §6.2 (line 205)
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 77)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2609-2614 (ExecutionState.stop), 2996-3010 (stopSession)'
    quote: '`state.execution.stop()` stops the current execution loop.'
  explanation: 'Tool code can end the loop with `execution.stop()`; the published comment says it takes
    effect after the current operation completes and ''Does not abort in-progress LLM calls.'' Neither
    text nor types say whether the remaining tool calls of the same model response still execute, nor
    which `reason` a run stopped this way reports; runtimes MAY add codes and clients MUST treat unknown
    codes as opaque, so a safety stop cannot be recognised from run status in a portable way. SA''s failed-session
    path is `sessionFail`, a tool binding on a prompt side that the model calls; code has no equivalent,
    and the published comment on `stopSession` says it stops the session ''successfully''. Searched content/0.2.0
    and the published types: failSession: not found.'
  combined: 'Default: return the error result and continue, as ACS''s own tool-call layers do (strict
    mode there means deny instead of warn, not end the run). Stop the loop when the call waits for a person
    (F502 pending) or after a configured number of denials in one flow, and set the latch of gate-05 for
    a hard stop. In a child thread, `state.stopSession({ result })` carries the ACS code inside the result
    text, because code cannot end a session as failed. Consumers read the code from the tool result or
    the guard''s record, never from `ThreadStatus.reason`.'
  see_also:
  - workflow-execution#wf-12
  - packaging-conformance-governance#diag-04
- id: lim-01
  relation: fits
  acs:
    concept: 'Bounds on repetition: `retry.max`, `max_loops`, step `timeout` (R401, R404); the SDK adapter''s
      per-risk rate limit'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition, `timeout` and `retry` (lines 254-255)
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 639-642)
    - spec/STANDARD-v1.1.0.md §9.5 Runtime Errors (lines 1310, 1313)
    - grounded_agency/adapter.py lines 539-542 (rate limit by risk level)
    quote: '| R404 | RECOVERY_EXHAUSTED | Max recovery loops exceeded |'
  sa:
    concept: '`maxSteps`, `maxSessionTurns`, runtime hard caps, and the matching stop reasons'
    refs:
    - content/0.2.0/infrastructure/runtime.md §1 Overview (line 12), §6 Stop Conditions (lines 102-109;
      quote at line 109)
    - content/0.2.0/specification/agents.md §1.2 SideConfig, `maxSteps` (line 44), §2.2 Optional, `maxSessionTurns`
      (line 84)
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (line 25), §4.2 Reasons
      (lines 113-114)
    quote: 4. safety limits (`maxSteps`, `maxSessionTurns`, runtime hard caps)
  explanation: 'Both bound runaway behaviour, at different granularity: ACS per step and per failure mode,
    SA per side and per session. `maxSteps` counts model request/response cycles, not tool calls, so several
    denied calls can arrive in one step, and it has no default. Enforcement rests on Runtime §1 (the runtime
    MUST ''enforce configured limits and stop semantics''); the stop order in §6 is introduced with a
    lowercase ''should''. SA has no per-tool or per-risk limit and no tool execution timeout. Searched
    content/0.2.0: timeout (hooks SHOULD have one; providers and runtime streams have request timeouts;
    code execution has none by design), deadline, rate limit (a provider error code only), throttl, quota
    (a draft Users example), budget, retry.'
  combined: Set `maxSteps` on prompt sides that hold grounded tools, so that a model that keeps being
    denied cannot loop without end. Keep any per-call or per-risk rate limit in the guard wrapper, with
    a counter in the key-value store, since `maxSteps` does not bound tool calls.
  see_also:
  - workflow-execution#wf-17
- id: exec-01
  relation: fits
  acs:
    concept: The reference executor as a state machine that does no I/O, driven by a host through actions
      and responses
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md (lines 10-14; action table at lines 83-92)
    - core/src/exec/mod.rs lines 103-180 (enum Body)
    - core/Cargo.toml lines 8, 14-17 (`publish = false`; the Python feature)
    quote: The executor does no I/O. It tells your code what to do next (an
  sa:
    concept: 'Deterministic code that owns a turn or a tool call and holds the full `ThreadState`: a handler-backed
      side, or one function tool with `uses`'
    refs:
    - content/0.2.0/specification/handlers.md §3 Execution Model (lines 44-55), §4 Delivery Semantics
      (lines 63, 65), §5 Error Semantics (lines 71-75), §6 Capabilities (lines 79-88; quote at line 81)
    - content/0.2.0/specification/subagents.md §3.3 (line 112)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44)
    - content/0.2.0/specification/threads.md §3.2 Direct Invocation (lines 260-272)
    - '@standardagents/spec 0.45.10 index.d.ts line 221 (`result?: string`)'
    quote: 'A handler receives the full [`ThreadState`](/0.2.0/specification/threads) and may do anything
      tools can do:'
  explanation: 'The strongest enforcement available is not a hook: deterministic SA code acts as the ACS
    host. The executor decides the next action and a function tool, or a handler, performs it through
    `ThreadState`; checkpoints, approvals, gates, edge order and failure modes are then enforced as ACS
    defines them, and models work only inside individual steps. SA hazards: a handler turn that throws
    is fatal to the turn and is not redelivered, and a handler that awaits a blocking child holds its
    thread''s delivery slot and can deadlock. Tool hooks are not stated to fire for `invokeTool`, so the
    host writes its own records. The ACS executor is an unpublished Rust crate with a Python binding;
    it type-checks for the `wasm32-unknown-unknown` target, so it needs a JavaScript binding, not a port.'
  combined: '`defineTool({ uses: [...] as const, execute })`, or a handler, runs the loop: ask the ACS
    run for its next action, perform it, submit the response. `InvokeCapability` maps to `state.invokeTool`;
    each step tool returns JSON text, which the host parses and checks before it answers `Output` (else
    R402). `CreateCheckpoint` and `Rollback` map to the agent''s checkpoint and rollback tools, `RecheckSource`
    to a re-read. For waiting actions (`RequestApproval`, `AwaitEvent`, `Sleep`) the host saves the run
    snapshot in the key-value store, ends the turn, and resumes on a later turn, after the authenticated
    endpoint recorded the decision (appr-03); it does not await a blocking child from a handler. `uses`
    must list every target. This needs an ACS executor callable from TypeScript, which ACS does not ship.'
