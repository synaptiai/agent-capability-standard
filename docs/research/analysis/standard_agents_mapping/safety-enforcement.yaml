- id: trace-01
  relation: fits
  acs:
    concept: '''Runs before'': the order relation the edge rules are evaluated over, defined on a workflow''s
      step list'
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms, Runs before (line 68)
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 159-161)
    quote: '| **Runs before** | Step A runs before step B when A comes earlier in the step list and is
      not in B''s parallel group (§4.3) |'
  sa:
    concept: '`execution.messageHistory`: the live persisted history of the current execution, including
      the assistant message with its `tool_calls` (persisted before the calls execute) and tool results
      with `tool_status`'
    refs:
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (line 30), §2.2 Live
      execution history (lines 43-49; quote at line 45)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 17-19), §3.3 Same-execution
      visibility (lines 132-136), §5 and §6 (lines 169-186)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 47-49)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2593-2598 (messageHistory comment), 4416-4428 (PromptDefinition.historyLimit)'
    quote: '`execution.messageHistory` **MUST** represent live chronological persisted execution history.'
  explanation: 'SA already keeps a trace a guard can read: the step cycle persists the assistant response
    before executing its tool calls, each `tool_calls` entry carries an id, a name and arguments, and
    tool results carry `tool_status`. Within one execution this supports an online `requires` prefix check
    without a wrapper-written trace, and lets a tool find candidate ids for the call it is serving (by
    inference; it fails for two identical calls in one response and for `invokeTool` or `queueTool` calls).
    Limits: one execution only; records can be changed by `updateMessage` and `deleteMessage`; and the
    published types say that with a prompt''s `historyLimit`, which does not occur in the 0.2.0 text,
    the history is only its newest window.'
  combined: 'Use `state.execution?.messageHistory` as a convenience trace for reporting `precedes` and
    `soft_requires` findings within one execution. Do not base a denial on it: checkpoint and approval
    decisions rest on the guard''s own records (ckpt-02, appr-01), which also span executions. Where a
    wider scope matters (a session, or the thread''s lifetime), the wrapper keeps its own trace, writing
    each grounded call''s capability under one key per call.'
- id: hook-01
  relation: partial
  acs:
    concept: 'Fail-safe evaluation: an erroring gate fires (except an `end` gate), an erroring condition
      is false, an erroring failure-mode `when` does not fire; the strict-mode SDK adapter denies on internal
      error'
    refs:
    - spec/STANDARD-v1.1.0.md §5.8.2 Evaluation (lines 491-495; quote at line 492)
    - core/src/exec/machine.rs lines 614-627 (gate_fires)
    - grounded_agency/adapter.py lines 590-596 (an unclassifiable tool is treated as a high-risk mutation),
      627-637 (deny in strict mode)
    - grounded_agency/capabilities/mapper.py lines 369-375 (an unknown tool name is mapped to `observe`)
    quote: 'trace. Its effect is fail-safe by site: a **gate** whose `when` errors'
  sa:
    concept: Hook failures are non-fatal to the decorated turn; per-hook failure rules are SHOULD-level
      for message hooks and absent for tool hooks; only composition fails closed by a MUST
    refs:
    - content/0.2.0/specification/hooks.md introduction (line 5)
    - content/0.2.0/specification/hooks.md §1.2 (lines 65-68), §1.3 (lines 96-97)
    - content/0.2.0/specification/hooks.md §4.1 to §4.4 (lines 322, 335, 350, 363), §5.4 (line 428)
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 77)
    - content/0.2.0/getting-started/examples.md §3 Hooks (line 550)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - '@standardagents/spec 0.45.10 index.d.ts lines 6109-6112 (before_create_message comment)'
    quote: its failures are non-fatal to the decorated turn
  explanation: 'The defaults point in opposite directions. In SA, `before_create_message` and `before_update_message`
    failures SHOULD prevent the creation or update; failures of the two `after_` message hooks SHOULD
    NOT affect the message; for the five tool hooks the text gives no outcome for a throw or a timeout,
    so by the page''s general statement such a failure is non-fatal (an ACS check placed there would fail
    open; inference). Composition is the exception: a missing required parent hook MUST fail closed. The
    published types add that a runtime can still insert a tool result message when `before_create_message`
    throws. ACS''s own layers are not uniformly fail-safe: the SDK mapper classifies an unknown tool name
    as non-mutating `observe`, and non-strict mode only logs a missing checkpoint.'
  combined: 'Never put a check whose failure must block into a hook. Put it in the tool''s `execute`,
    perform the effect as the last thing the function does, catch the guard''s own errors, and return
    an error result (deny) on any internal failure. A throw from `execute` before the effect is covered
    by the same MUST as a returned error: tool errors are persisted as tool results and do not crash the
    loop.'
  see_also:
  - published-api-extension-points#hooks-02
  - evidence-audit-observability#action-01
  - evidence-audit-observability#audit-04
  - evidence-audit-observability#collect-01
  - evidence-audit-observability#collect-03
