- id: flags-01
  relation: fits
  acs:
    concept: 'Per-capability safety metadata: `risk`, `mutation`, `requires_checkpoint`, `requires_approval`,
      resolved to effective flags that safety layers MUST act on'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 109-124; quote at line 120)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    - spec/STANDARD-v1.1.0.md §2 Terms, Effective flag (line 67)
    - schemas/capability_ontology.yaml (flags on each capability node, for example lines 1095-1101)
    - schemas/interop/standard_agents_annotation.schema.json (the `acs` annotation key; added with the
      reference binding after this mapping was drafted, cited only for the key name)
    quote: '| `risk` | enum | No | `low` (default), `medium`, `high` |'
  sa:
    concept: 'Tool `annotations`: implementation-specific hints with no normative meaning, available on
      function tools only'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146; quote at line 146)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 156)
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Resource Loading (lines 100-113)
    - content/0.2.0/distribution/packaging.md Visibility Rules (lines 221-230)
    - '@standardagents/spec 0.45.10 index.d.ts lines 412 (ToolAnnotations), 424 (DefineToolOptions.annotations)'
    quote: Annotations **MUST NOT** change argument validation, execution, the tool's results, or what
      is sent to the model.
  explanation: 'SA tool definitions have no field for risk, side effects or approval. `annotations` is
    the only open metadata slot: `defineTool()` MUST return it unchanged, a runtime MUST ignore keys it
    does not understand, and annotations MUST NOT change execution. So annotations may publish ACS flags,
    but an SA runtime must not act on them; enforcement has to be author-supplied code generated from
    the same source. Applying ACS §5.2.1 to a tool-level layer is an inference: the Standard defines the
    effective flag for a workflow step. No `ThreadState` method returns a tool definition; a hook in the
    same project could import the tool module (inference), but not a package''s internal tools. Searched:
    risk, destructive, read-only, side effect, mutat, idempoten, dangerous, irreversib, hint, loadTool,
    getToolNames: no such field or method found.'
  combined: 'Declare the binding under the `acs` annotation key, for example `annotations: { acs: { capability:
    ''mutate'', ... } }`, as a declaration only. The same wrapper that writes it closes over the capability''s
    flags and enforces them in `execute`. Flags come from the ontology by capability id; a tool-level
    value may only be stricter (ACS §5.2.1), so the wrapper computes the effective flags itself. Limits
    to state: only function tools carry annotations, so prompt tools, handoff agents and lifecycle tools
    cannot be declared this way; a lint must compare the enforced flags with the annotation; and nothing
    checks the author''s choice of capability id (binding a writing tool to `retrieve` weakens it silently).'
  see_also:
  - tools-contracts#cls-02
  - tools-contracts#cls-03
  - tools-contracts#dom-01
