- id: appr-02
  relation: acs_only
  acs:
    concept: 'Attendance and the `when_unattended` plan: an unattended run that needs a human approval
      fails (F502, the default), skips, or defers to a queue; W606 at validation'
    refs:
    - spec/STANDARD-v1.1.0.md §5.10 Triggers, `attendance` (line 577), W606 (lines 591-595)
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 825, 839-849)
    - core/src/exec/machine.rs lines 785-822 (unattended)
    quote: '| `when_unattended` | `fail` (default), `skip` or `defer_to_queue` |'
  sa:
    concept: No attendance concept. Runs can start with nobody present (a scheduled effect, a queued tool,
      two prompt-backed sides), and execution state does not expose what started a run
    refs:
    - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (lines 27-38)
    - content/0.2.0/specification/effects.md §3 Execution Semantics (lines 81-90; quote at line 90)
    - content/0.2.0/specification/agents.md §1.2 SideConfig (line 29), §9.2 Worker / Reviewer (lines 221-256)
    - content/0.2.0/specification/threads.md §1.2.2 Methods (lines 106, 159), §2.3 Environment Variable
      Resolution (lines 220-225)
    - content/0.2.0/specification/users.md status note (line 3), §2 (line 63), §7 Lifecycle Hooks (lines
      213-214)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2578-2634 (ExecutionState)'
    quote: Effect execution is runtime-managed and may occur after the invoking conversation has completed.
  explanation: 'ACS attendance is a property of the trigger: `manual` is attended, `schedule` and `event`
    are unattended, `invoke` inherits. SA lists four invocation triggers, but the published `ExecutionState`
    exposes none of them, so tool code cannot tell which one started the run. A guard can observe weaker
    signals: whether the agent has a human-backed side (`state.loadAgent(state.agentId)`), whether the
    thread has a user (`state.user()` resolves `null` for user-less threads), and, on runtimes that implement
    the draft Users page, whether a client is attached. None states that a person will answer. A run started
    by a scheduled effect or `queueTool` corresponds to ACS''s `schedule` and `event` triggers. Searched
    content/0.2.0 and the published types: attended, unattended, attendance: not found.'
  combined: 'Decide attendance by configuration and default to unattended, which fails closed: treat a
    run as attended only when the agent has a human-backed side and a flag in configuration bundled with
    the package, or in `state.instanceEnv` where the runtime offers it, says so; `state.env()` is not
    used, because a thread value overrides an `agent.env` default (approval-human#approval-21). With the
    recorded decision of appr-01, `fail` is the F502 denial and `defer_to_queue` is the pending request
    written with `state.setValue`; a person who approves later through the endpoint is ACS''s out-of-band
    case. SA limit: code that starts an unattended run (an effect, an endpoint calling `queueTool`) has
    no specified way to mark that run for the guard.'
  see_also:
  - published-api-extension-points#agent-01
  - published-api-extension-points#options-01
