- id: cred-01
  relation: fits
  acs:
    concept: 'No counterpart: `send` is governed by the checkpoint and approval flags; role-based capability
      authorisation is listed as planned'
    refs:
    - spec/STANDARD-v1.1.0.md §4.4 Safety-Critical Capabilities, `send` (line 187)
    - spec/SECURITY.md §9.1 Planned Enhancements (line 401)
    quote: '| `send` | `checkpoint` | Cannot send without prior checkpoint |'
  sa:
    concept: Credential grants with `origins` and `allow` lists that the runtime enforces on `fetch` (Users
      page, a draft proposal)
    refs:
    - content/0.2.0/specification/users.md status note (line 3)
    - content/0.2.0/specification/users.md §6 Credential Grants (lines 184-205; quote at line 202)
    - content/0.2.0/specification/users.md §8 Conformance (lines 393-394)
    - content/0.2.0/getting-started/examples.md §3 Hooks (line 542)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1582 (UserHandle.fetch), 1593 (CredentialGrant)'
    quote: 4. The runtime MUST reject a `fetch` from a caller not covered by `allow`. An absent `allow`
      denies all callers.
  explanation: 'The draft Users page gives the only runtime-enforced denial of an outbound request that
    is keyed to the calling tool: a credentialed `fetch` MUST be rejected unless the destination origin
    is covered by `origins` and the caller by `allow`, which can list tools. (The `uses` rule is also
    keyed to the calling tool, but governs invocation, not requests.) The page is marked ''draft proposal'',
    and within it grant support is SHOULD; the published types already export `CredentialGrant`. A grant
    is user-scoped: the page does not say an agent package can create one or set its `allow` list, and
    a secret a tool reads directly (as the examples page''s `close_as_duplicate` reads `GITHUB_TOKEN`)
    is outside the grant policy. Searched ACS spec/, schemas/, docs/guides: credential, allowlist, egress:
    nothing comparable found.'
  combined: 'Deployment guidance, not something a package can enforce: where a runtime implements the
    draft Users page, operators store outbound credentials only as grants whose `allow.tools` names the
    grounded tools, and never as environment variables; the package documents the tool names to allow.
    An unwrapped tool then cannot make an authenticated request to that origin, which closes the main
    bypass of in-tool guards for `send`-type effects. Do not rest 0.2.0 conformance on it.'
  see_also:
  - published-api-extension-points#grant-01
  - models-context-memory-security#secrets-02
