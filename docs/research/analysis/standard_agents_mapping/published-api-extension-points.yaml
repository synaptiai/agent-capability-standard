    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-50), §5 Tool Execution (lines 84-100)
    quote: '- Implementations **MUST** call this hook once per tool call, whether it succeeded or failed.'
  explanation: 'HookToolCall is { id; type: ''function''; function: { name; arguments (a JSON string)
    } }. HookToolResult is { status; result?; error?; stack?; attachments? }. Text and types agree on
    both. HookToolResult lacks the `error_code` and `error_data` of ToolResult (TS2339) and has no metadata
    member, although hooks.md line 397 lists ''Add metadata to tool results'' as a use. Only `tool_call_started`
    and `tool_call_done` carry a ''MUST call'' sentence. No normative statement gives the order of the
    three result hooks, which result `tool_call_done` receives, what is stored when one throws, or for
    which tool classes and for `invokeTool` or `queueTool` they fire; runtime.md names none of the five.
    The Examples page says informatively that `before_store_tool_result` ''runs for the results of every
    tool in the prompt''. Searched: after_tool_call_success, after_tool_call_failure, before_store_tool_result,
    tool_call_done (content/0.2.0/infrastructure: not found).'
  combined: 'The wrapper, not a hook, writes the action record: before the effect with status `planned`
    or `approved`, refusing when that write fails, and afterwards with `executed`, `failed` or `rejected`.
    The wrapper knows the capability, the arguments, the digest and the decision; a hook knows only the
    tool name and has no `intent`, which ActionRecord requires. `tool_call_done` only adds `toolCall.id`
    to that record, and `after_create_message` the stored message id; both are conveniences that may not
    fire for `invokeTool` calls. An ACS code is never recovered from hook-side `error` text for enforcement.
