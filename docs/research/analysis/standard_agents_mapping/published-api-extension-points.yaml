  - packaging-conformance-governance#pkg-09
- id: thread-03
  relation: fits
  acs:
    concept: Checkpoint snapshot and rollback source, audit trail, evidence artifacts
    refs:
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 678-683), §9.6 Safety Errors (line
      1323)
    - schemas/capability_ontology.yaml checkpoint (lines 1211-1246)
    quote: '| `rollback` | Roll back to the latest checkpoint; with none, or if the host fails it, the
      run ends F503 |'
  sa:
    concept: 'Thread file system on ThreadState: writeFile, readFile, readFileStream, statFile, readdirFile,
      unlinkFile, mkdirFile, rmdirFile, moveFile, renameFile, getFileStats, grepFiles, findFiles, getFileThumbnail'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 3261-3380 (file methods), lines 2253-2276 (FileRecord)'
    - content/0.2.0/specification/threads/filesystem.md §1 to §9 (the one MUST is at line 178)
    - content/0.2.0/specification/threads.md §1.2.2 File System table (lines 67-82), §12 TypeScript Reference
      (lines 611-741)
    - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread (line 296), §14 Reading
      a File (lines 383-395)
    quote: '5. **Ordering Guarantee**: Chunks are always yielded in sequential order. Implementations
      **MUST NOT** yield chunks out of order.'
  explanation: 'A per-thread file tree with custom `FileRecord.metadata`. It cannot snapshot anything
    outside the thread and has no snapshot, copy or append primitive; a restore is many writes and is
    not atomic. filesystem.md states one MUST (chunks are not yielded out of order) and no persistence
    or read-after-write requirement. Files die with the thread: a thread delete MUST remove messages,
    files and stored values. Nothing reserves a path prefix, so any code on the thread, and a model through
    any file-writing tool, can overwrite or unlink a record. Text versus types: `moveFile` and `renameFile`
    are in filesystem.md §5 and the types but missing from the method table and the §12 reference in threads.md;
    `FileRecord.createdAt` and `updatedAt` are in the types only. Searched: createdAt, updatedAt (filesystem.md:
    not found).'
  combined: 'Call it a thread-local trace, not a durable audit log. A checkpoint of thread files is a
    copy under `/acs/checkpoints/<id>/` plus a manifest with a SHA-256 per file; the checkpoint tool refuses
    when a file cannot be read; rollback verifies the hashes, and a partial restore is F503. Trace records
    are one file each under `/acs/audit/`, since there is no append. External state (an API, a database)
    needs a capability-specific checkpoint that the tool author supplies. Records that must outlive the
    thread, or resist the thread''s own code, go to a store outside it. Files are readable through the
    Thread Client API by any caller with thread access. Tier 2: the page is descriptive apart from one
    MUST.'
