    cycle, not a stated rule. Limits: one extension per model definition, fallback models included; no
    effect on `invokeTool`, `queueTool`, provider-executed tools or a composed child''s models; the stored
    assistant message shows the replaced call.'
  combined: 'Optional second layer under the wrapper, for agents that list tools the binding did not write:
    define `acs_gated` from the provider the project already uses, check each returned tool call against
    the binding''s name table and guard records, and substitute a call to an `acs_refused` tool that returns
    the F501 or F502 text. Fail closed when `state` is absent. It reaches lifecycle tools and prompt tools,
    which the `execute` wrapper cannot. It does not compose with other packages'' decisions and rewrites
    what the model appears to have asked for, so the action record keeps the original call. Tier 2: no
    sentence requires a runtime to act only on the returned calls.'
