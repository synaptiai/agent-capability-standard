  explanation: 'An agent may pair a prompt-backed side with a handler-backed side. If the prompt lists
    no mutating tool and replies with one proposed action as JSON, the handler receives that reply as
    an inbound message, exactly once and in order, and is the only code that calls the mutating tools.
    Deterministic code then sits between the model and every effect without any hook. An agent of this
    shape, with a handler that validates the proposal, takes a checkpoint and calls `state.invokeTool`,
