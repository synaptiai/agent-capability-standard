  - packaging-conformance-governance#type-01
- id: ext-01
  relation: partial
  acs:
    concept: 'Vendor extension slot: field names starting with `x-` are vendor data that validators never
      report; an extension a consumer must understand is declared in `workflow_extensions.requires`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.1 (lines 203-204 and 228-230), §5.5 (lines 350-352), §5.9 Workflow Extensions
      (lines 534-543), §11.3 (lines 1457-1458), Appendix B (line 1730)
    quote: Field names starting with `x-` are reserved for vendor extensions.
  sa:
    concept: '`annotations` on a function tool: owner-keyed hints that a runtime may read and must otherwise
      ignore'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
    - '@standardagents/spec 0.45.10 index.d.ts line 412 (ToolAnnotations)'
    quote: '- Annotations are non-normative. This specification defines no annotation keys, and their
      meaning belongs to whoever owns the key.'
  explanation: 'Each standard has one slot for data it does not define, with the same core rule: a consumer
    that does not know the data ignores it and behaves as before. They differ in three ways. ACS has a
    naming rule (the `x-` prefix, also used for vendor values in vocabularies such as `authenticated_by`);
    SA says only that meaning ''belongs to whoever owns the key''. ACS allows `x-` fields on catalogs,
    workflows and input bindings and reports other unknown fields as W604; SA has the slot on function
    tools only. ACS also has a must-understand mechanism (`workflow_extensions.requires`, V106), which
    SA lacks (row agent-01). The published types add nothing to the SA rule.'
  combined: 'The binding uses each slot in its own direction. ACS data rides in SA as the `ai.synapti/acs` annotation
    (row tools-02). Standard Agents data rides in an ACS catalog or workflow as `x-` fields, or as `x-`
    keys in a step''s `input_bindings`, which the host receives; for example `x-standardagents: { agent:
    ''release_agent'', tool: ''write_config'' }`. Validators accept these without a warning. Neither slot
    changes behaviour in a consumer that ignores it. Tier 1.'
  see_also:
  - packaging-conformance-governance#ver-04
- id: drift-01
  relation: partial
  acs:
