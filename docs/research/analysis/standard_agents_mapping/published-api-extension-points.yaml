    which carry `tool_call_id` and `name`; the capability comes from the name table of row thread-02.
    To change metadata later, read, change and write the whole object instead of relying on merge. Treat
    a message id as a locator, not as evidence that will stay: an anchor names thread id, message id and
    `tool_call_id` and carries a SHA-256 of the stored content, so a later reader can tell whether the
    row changed (see also row erase-01). When the stamping hook throws, the row may be unstamped or missing;
