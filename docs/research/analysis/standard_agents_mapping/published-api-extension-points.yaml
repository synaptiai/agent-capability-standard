    quote: 1. **Source must exist.** Moving a missing path throws.
  explanation: 'The key-value store has no conditional write: `setValue(key, null)` succeeds whether or
    not the key was present, so reading, checking and deleting a record is not a single step. `moveFile`
    behaves differently by its stated constraints: moving a missing path throws, and it ''does not overwrite''
    an existing destination. That gives create-if-absent and consume-once with members present in both
    the text and the types; a helper that consumes by moving a file from an open directory to a used one
    type-checks against 0.45.10. The constraints are written without MUST and say nothing about two moves
    issued at the same moment. `moveFile` is in filesystem.md §5 and the types but missing from the method
    table of threads.md §1.2.2.'
  combined: 'Where single use must hold even if an endpoint handler runs during a flow, the approval and
    the checkpoint are files: the granting side writes `/acs/approvals/open/<request>.json`, and the gated
    tool consumes by `moveFile` to `/acs/approvals/used/<request>.json` before acting. A throw means the
    record was already consumed or never granted, and the tool refuses with F502 or F501. The file is
    the single-use token only: thread files are served to every caller with thread access and can be written
    by any file-writing tool the agent offers a model, so the decision and its approvers are still read
    from the key-value record, and a file with no matching record is refused (approval-human#approval-13).
    This is stronger than deleting a key, which cannot report that the key was already gone; the guarantee
    is descriptive text, so the tombstone rule of row thread-01 stays in place as well. Tier 2.'
