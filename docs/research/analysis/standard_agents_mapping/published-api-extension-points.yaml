    and injects the result on its own side. The grounded tools keep their own wrapper, so the handler
    is a second layer, not a replacement. Set `maxSessionTurns`, since a handler that answers every message
    can loop against a prompt side. The handler writes its own records. Tier 1 for delivery; the allow-list
