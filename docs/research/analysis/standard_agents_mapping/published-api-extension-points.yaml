      plus `next()`, where `next()` calls the base provider implementation.
  explanation: 'A provider extension is package code between a model and the runtime. Its `generate` and
    `stream` overrides wrap every model request of a model definition that uses it, receive the executing
    thread''s `state` ''when the runtime has one'', and return the ProviderResponse or chunk stream that
    carries the tool calls. An override that replaces a refused call with a call to a refusal tool, in
    the response and in the stream, type-checks against 0.45.10. Text and types agree on the override
