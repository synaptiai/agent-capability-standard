    quote: 'declare function defineHook<K extends HookName>(options: HookDefinitionOptions<K>): HookDefinitionResult<K>;'
  explanation: 'The types declare 17 hook types: 14 thread hooks and three user-scope hooks. Eight thread
    hooks return a value the runtime uses (three request-context hooks, two before-message hooks, three
    tool-result hooks); none returns a decision about a tool call. hooks.md §1.1 lists the 14; the user
    hooks appear only on the draft Users page, at SHOULD level, and are project-scoped. The per-hook signature
    blocks in hooks.md §3 to §5 omit the trailing context that §2.1, §7 and the types include. The set
    is closed: an unknown type is a compile error and the published defineHook throws. A thread hook runs
    only when listed: a non-empty prompt list replaces the agent''s, at-rest operations use the agent-level
    list, and `parentHooks` of a composed child are added. Hook failures are non-fatal to the turn.'
  combined: 'List the ACS hook ids in the agent''s `hooks` and in every prompt that has a non-empty `hooks`
    list, prompts used as tools included, and lint for it. Use `parentHooks` only on a child the host
    really composes, such as the approval gate: it needs `exposeAsTool: true`, reaches the direct parent
    only, and its hook cannot see the host''s tool table; set `hidden: true` on it and on every other
    relationship of that side when the model must not spawn it (multi-agent#coord-20). Treat hooks as
    best-effort observation: a throw or a timeout loses the observation and nothing reports it. The record
    ACS requires is written by the wrapper before it acts (row hooks-02). No hook can block a call. Tier
    1 for the calls of an active `tool_call_done` or message hook; tier 2 for timing and failure behaviour.'
