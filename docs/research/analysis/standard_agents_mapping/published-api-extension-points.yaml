  sa:
    concept: 'Inventory, part 1: members of @standardagents/spec 0.45.10 (SPEC_VERSION 0.2.0) that the
      text under content/0.2.0 does not contain'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 6525-6528 (SPEC_VERSION), 211-249 (ToolResult), 443-448,
      3097, 3179-3211, 4428, 4090-4099, 83-121, 6477-6510, 5207 and 5299, 5338-5349, 5420 and 5543, 5727-5756,
      5872, 1014-1021, 1096-1139, 246'
    - content/0.2.0 (whole tree; each name searched case-insensitively)
    - content/0.2.0/specification/hooks.md §6.3 (lines 486 and 490; ToolAttachment named)
    - content/0.2.0/specification/providers.md §2.1 (line 248; `prompt.providerOptions`)
    quote: declare const SPEC_VERSION = "0.2.0";
  explanation: 'Not found in content/0.2.0 (each name searched): tools: executionMode, executionProvider,
    tenvs, the ToolResult interface with error_data (error_code appears once, in an example), the ToolArgs
    Zod subset, validateToolName, the rule that new attachments are stored under /attachments/. ThreadState:
    runAgent, getUserValue, setUserValue, listUserValues. Prompts: historyLimit, PromptEnvPart. Registry:
    PromptSchemaRegistry, SchemaFields, ProviderCallable, McpCallable. Agents: validateAgentDefinition,
    DEFINITION_ISSUE_CODES, HANDLER_SYMBOL, isHandler. Endpoints: defineController, ControllerContext,
    EndpointOptions, getEndpointAccess. Packaging: PackedMetadata, NamespaceContext, isPacked, belongsToPackage,
    isVisibleInNamespace, parseQualifiedName. Providers: ProviderExecutedToolResult, ProviderResponse.providerTools,
    the provider-tool-done chunk. Also SPEC_VERSION itself. Named in the text but not defined there: ToolAttachment,
    and `prompt.providerOptions` (absent from prompts.md). The types'' comments present some of these
    as one product''s features (''stored by Standard Agents Builder prompts'').'
  combined: 'Compile against the published types and cite the text, in three tiers, which every row of
    this mapping names. Tier 1: behaviour the binding requires rests only on sentences with MUST in the
    0.2.0 text and compiles against 0.45.10. Tier 2: SHOULD-level and descriptive behaviour is used only
    with a stated fallback. Tier 3: members found only in the types are passed as extra fields or feature-detected
    as methods and never relied on; a field that a runtime may drop cannot be feature-detected. Presence
    in both text and types does not make a member required of every runtime: the file system has one MUST,
    and `emit` reaches a client only through an API a runtime SHOULD expose. ACS states such differences
    in its own status header; SA has no equivalent statement.'
- id: drift-02
  relation: partial
  acs:
