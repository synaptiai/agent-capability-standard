# The published TypeScript API as a binding surface
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: published-api-extension-points
title: The published TypeScript API as a binding surface
changes_in_1_2_0:
- row: tools-01
  sections: '§5.18.1, §5.18.4'
  effect: 'A tool call is classified through a tool binding, and a composite tool lists the tools it calls
    (`invokes`).'
- row: tools-02
  sections: '§5.18.1'
  effect: 'The classification record of a tool is the normative tool binding.'
- row: tools-03
  sections: '§5.18.5 to §5.18.8, §10.4'
  effect: 'A safety layer that acts on effective flags over calls is specified, with conformance class
    SL.'
- row: tools-04
  sections: '§5.18.8, §5.18.9, §5.18.10'
  effect: 'Refusals, records and fail-closed loading, text-only results and the capability checks are
    stated for calls.'
- row: tools-05
  sections: '§5.18.5, §5.18.4'
  effect: '`requires` is evaluated over calls within a layer''s scope, and a composite tool''s calls are
    covered through `invokes`.'
- row: tools-06
  sections: '§5.18.2'
  effect: 'A tool the layer has no binding for is still gated, as the strictest case; this is the rule for
    calls the binding did not author.'
- row: options-01
  sections: '§5.2.4'
  effect: 'Step `domain` values are domain ids with a host selection rule.'
- row: provext-01
  sections: '§5.18'
  effect: 'The check before a call''s effect is specified for tool-calling hosts.'
- row: hooks-01
  sections: '§5.18, §10.4'
  effect: 'Safety hooks around tool use are a safety layer under §5.18; a layer claims class SL with a
    statement of its scope.'
- row: hooks-02
  sections: '§6.4, §6.5'
  effect: 'Audit records (action records and canonical events, required or best-effort capture, no silent
    capture failure) and one evidence anchor type are defined.'
- row: hooks-03
  sections: '§6.5, §6.6'
  effect: 'Anchors can carry a `digest` and the kind `record`, and evidence stores are specified.'
- row: callid-01
  sections: '§5.18.8, §6.4'
  effect: 'An action record carries `run_id`, `tool` and `call_id`, which tie a record to one call.'
- row: thread-01
  sections: '§4.4.1, §5.14'
  effect: 'A checkpoint reports what it captured, its digest and expiry, and the approval digest input is
    defined.'
- row: thread-02
  sections: '§5.18.2, §5.18.3'
  effect: 'Classifying an arbitrary call is the Standard''s rule: by its binding, which classifies by
    effect, and as the strictest case when it has none.'
- row: thread-03
  sections: '§4.4.1, §6.6'
  effect: 'A rollback never restores the record of what happened (stores, trace, records, audit log), and
    evidence stores are specified.'
- row: thread-04
  sections: '§5.19.3, §5.10.2'
  effect: 'Tick boundaries are stated (an answer at the deadline is in time), and schedule fire times
    follow the declared time zone.'
- row: thread-05
  sections: '§5.2.2, §5.19.2'
  effect: 'A checkpoint''s validity ends at the end of a wait or delay and at a resumption, and a run''s
    `run_id` is unique.'
- row: thread-06
  sections: '§5.15.1 to §5.15.4'
  effect: 'Agent manifests, `continues`, `effective.model_id` and `effective.checkpointed` are added to
    delegation.'
- row: decide-01
  sections: '§3.1, §4.1.1'
  effect: 'An output is grounded by an anchor to evidence its producer had, or marked inferred by
    `inference_method` and `confidence`.'
- row: consume-01
  sections: '§5.2.2, §5.18.6, §5.18.7'
  effect: 'Single use is stated for steps and for calls: one checkpoint per gated step or call, and one
    decision per call.'
- row: erase-01
  sections: '§4.4.1, §6.4'
  effect: 'A rollback never restores the record of what happened, and audit records are specified.'
- row: hitl-01
  sections: '§5.14, §10.3'
  effect: 'The digest input is the array of resolved `shows` values (or `[inputs]`), SHA-256 in lowercase
    hex, with normative vectors.'
- row: endpoint-01
  sections: '§5.14, §5.17'
  effect: '`out_of_band` is defined, and with `identity@1` a decision carries `approver_identities`
    checked against the requested kind and role.'
- row: shown-01
  sections: '§5.14'
  effect: 'A step with no `approval` field is shown its resolved inputs, and the digest is computed over
    the shown values in order.'
- row: user-01
  sections: '§5.17'
  effect: 'A run keeps its actor while it continues: a restore for another actor is refused and a
    resumption may name a new actor.'
- row: grant-01
  sections: '§4.4.2'
  effect: 'Each transmission has an `idempotency_key` and at most one transmission per key; destination
    policies refuse a `send` with F504.'
- row: agent-01
  sections: '§5.10.2'
  effect: 'A host that starts a run other than by a trigger gives the run''s attendance itself.'
- row: handler-01
  sections: '§5.19, §10.5'
  effect: 'The host protocol is normative, and the runtime fixtures are normative for executors (class
    EX).'
- row: pack-01
  sections: '§11.5, §11.6'
  effect: 'The catalog header is an explicit value of the start operation, and how documents cite the
    ontology version is stated.'
- row: valid-01
  sections: '§9.8'
  effect: 'Every location key is defined, with `path` (RFC 6901) and `catalog`.'
- row: ext-01
  sections: 'Appendix B'
  effect: 'The prefix `x-acs-` is reserved for the Standard.'
- row: drift-02
  sections: '§10.3, §10.5'
  effect: 'Vectors and runtime fixtures are normative, so agreement with the reference is checked by
    conformance classes.'
rows:
- id: tools-01
  relation: partial
  acs:
    concept: 'Capability-typed tool: one tool call is one use of one ontology capability, the unit that
      is classified and on which a safety layer acts'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 109-127)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    quote: Validators, executors and safety layers MUST act on effective flags.
  sa:
    concept: defineTool() / DefineToolOptions / ToolDefinition
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts line 644 (defineTool), lines 421-517 (DefineToolOptions),
      lines 529-575 (ToolDefinition), lines 263-282 (ToolArgs), line 640 (comment on tool names)'
    - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 15-34), §8 Annotations (line
      144), §9 Conformance Notes (lines 148-156)
    - '@standardagents/spec 0.45.10 index.js lines 145-165 (defineTool; implementation observation)'
    quote: 'declare function defineTool<State = ThreadState, Args extends ToolArgs | null = null, Tenvs
      extends ToolTenvs | null = null, Uses extends readonly string[] = readonly string[]>(options: DefineToolOptions<State,
      Args, Tenvs, Uses>): ToolDefinition<State, Args, Tenvs, Uses>;'
  explanation: 'DefineToolOptions has ten members: description, annotations, args, execute, variables,
    tenvs (deprecated), executionMode, executionProvider, uses, progressArgument. None expresses a capability
    id, layer, risk, mutation or an output schema. STANDARD §4.1 requires id, layer, description and both
    schemas of a capability and gives risk and mutation defaults. The text says less than the types: tools.md
    has no TypeScript reference, and executionMode, executionProvider, tenvs and the definition of ToolArgs
    are not found in content/0.2.0. A tool definition carries no name: the published defineTool returns
    ten fixed keys, none a name, and drops other option keys (observed by running 0.45.10), and the text
    states no naming rule for function tools (see the Standard Agent Specification findings). Searched:
    executionMode, executionProvider, tenvs, ToolArgsNode, file-based, filename, tool name.'
  combined: 'A helper `groundedTool(toolName, capabilityId, options)` calls `defineTool`, adds the annotation
    (row tools-02) and replaces `execute` with a wrapper (row tools-04); it type-checks under strict settings
    with two casts, and call sites keep inference. The tool name is passed explicitly because the definition
    has none; a lint compares it with the file name or the PackedExports.tools key. One capability per
    tool. The claim is limited: the effective flags of the declared capability are enforced on every call
    that reaches this `execute`, and the output is checked at run time for the capability''s required
    fields; the capability''s input contract is not checked, because `args` is the author''s own schema.
    Tier 1 (the tiers are defined in row drift-01).'
  see_also:
  - tools-contracts#cls-01
- id: tools-02
  relation: fits
  acs:
    concept: 'Classification record of a tool: capability id, layer, risk, mutation, requires_checkpoint,
      requires_approval'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 113-124)
    - schemas/capability_ontology.yaml mutate (lines 1095-1101)
    quote: '| `requires_checkpoint` | boolean | No | A checkpoint must precede each use (default false)
      |'
  sa:
    concept: 'ToolAnnotations: the `annotations` member of DefineToolOptions and ToolDefinition'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 412, 424 and 532'
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146), §9 Conformance Notes (line
      156)
    - content/0.2.0/distribution/packaging.md 'PackedExports Interface' (lines 121-147)
    quote: 'A function tool **MAY** declare `annotations`: an object of implementation-specific hints,
      keyed by the runtime or tool that reads them.'
  explanation: '`annotations` is the only pass-through slot on a tool definition. The text says more than
    the types: the types give `type ToolAnnotations = Record<string, unknown>;` with no comment; tools.md
    §8 adds four rules (non-normative; defineTool MUST return it unchanged; a runtime MAY read keys it
    understands and MUST ignore others; annotations MUST NOT change validation, execution, results or
    model input). Any owner may define a key (''their meaning belongs to whoever owns the key''); what
    is absent is a naming or collision rule. Values are `unknown`, so typed access needs a runtime check
    (TS2571 without one, tsc 6.0.3), and the alias cannot be narrowed by declaration merging. No ThreadState
    member returns a tool definition; a definition is reachable through the PackedExports.tools loaders
    or a direct import. Searched: loadTool, getToolNames.'
  combined: 'Generate one literal per capability from the ontology, together with the flags the wrapper
    enforces, so the two cannot drift: `annotations: { ''ai.synapti/acs'': { standard: ''1.1.0'', ontology: ''2.1.0'',
    capability: ''mutate'', layer: ''EXECUTE'', risk: ''high'', mutation: true, requires_checkpoint: true,
    requires_approval: true } }`. It describes; the enforcing code never reads it (row tools-03). Its
    readers are code that imports the definition (the same package, or a checker that calls the PackedExports.tools
    loaders) and a runtime that opts in; a hook that receives a call by name cannot read it (row thread-02).
    The key is `ai.synapti/acs`, a reverse-DNS name of a domain the project controls, so it cannot collide with the key of a
    package that follows the same rule (ACS-Q15). Tier 1.'
  see_also:
  - tools-contracts#cls-02
  - tools-contracts#cls-03
  - tools-contracts#dom-01
  - safety-enforcement#flags-01
  - approval-human#approval-02
  - packaging-conformance-governance#pkg-03
  - packaging-conformance-governance#ver-02
  - models-context-memory-security#profile-06
- id: tools-03
  relation: fits
  acs:
    concept: 'Enforcement driven by the classification: a safety layer acts on the effective flags'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 84-93)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
    quote: A `checkpoint` MUST run before every `mutate`, `send` and `rollback`
  sa:
    concept: 'Annotation semantics: annotations must never affect execution'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 143-146)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 156)
    quote: '- Annotations **MUST NOT** change argument validation, execution, the tool''s results, or
      what is sent to the model. A tool behaves identically in a runtime that ignores them.'
  explanation: 'tools.md §8 and §9 forbid annotations from changing execution; STANDARD §5.2.1 requires
    a safety layer to act on effective flags. The two requirements are compatible: a wrapper inside `execute`
    acts on flags it holds in code and never reads annotations, so the tool behaves identically in a runtime
    that ignores them. The relation is therefore not a conflict: no pair of normative sentences is jointly
    unsatisfiable. One design would break SA: carrying the flags only in the `ai.synapti/acs` annotation and having
    a runtime refuse or delay a call because of them violates tools.md lines 146 and 156. Whether the
    MUST NOT also binds definition code, such as a hook that reads an annotation, is not stated; reading
    it as addressed to runtimes is an inference. The published types are silent on the point.'
  combined: 'Keep enforcement out of annotations: the wrapper closes over a flag table generated from
    the ontology and gates inside `execute` (row tools-04). A lint that compares the `ai.synapti/acs` annotation with
    that table is tooling and changes no execution. A runtime-level gate driven by ACS annotations cannot
    be built on 0.2.0 as written. Tier 1.'
  see_also:
  - tools-contracts#cls-02
  - tools-contracts#cls-03
  - safety-enforcement#flags-01
  - approval-human#approval-02
  - packaging-conformance-governance#pkg-03
  - models-context-memory-security#profile-06
- id: tools-04
  relation: partial
  acs:
    concept: Pre-execution gate with diagnostics (F501, F502) and the typed output contract including
      evidence_anchors
    refs:
    - spec/STANDARD-v1.1.0.md §9.6 Safety Errors (lines 1317-1325), §9.8 Diagnostic Format (lines 1348-1370)
    - spec/STANDARD-v1.1.0.md §3.5 Explicit Contracts (lines 100-103)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 118-120), 'What the executor enforces'
      (lines 145-148)
    quote: '| F501 | CHECKPOINT_REQUIRED | Mutation without checkpoint |'
  sa:
    concept: Tool `execute` signature (UsesAwareExecute) and ToolResult
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts line 411 (UsesAwareExecute), lines 211-249 (ToolResult;
      error_code line 230, error_data line 236), lines 5967-5984 (HookToolResult)'
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 152-155)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/hooks.md §5.2 (lines 386-398), §5.4 (lines 414-426), §6.3 HookToolResult
      (lines 478-490)
    - content/0.2.0/specification/threads.md lines 120 and 671 (ToolResult named, not defined)
    - content/0.2.0/specification/threads/runtime-streams.md line 82 (error_code in an example)
    quote: Tool errors **MUST** be persisted as tool results and **MUST NOT** crash the execution loop.
  explanation: '`execute` receives only (state, args): no tool-call id, tool name or provenance. ToolResult
    is { status; result?; error?; error_code?; error_data?; stack?; attachments? }; `result` is a string,
    and there is no metadata member and no output schema (TS2353). The text says less: `interface ToolResult`
    and `error_data` are not found in content/0.2.0, `error_code` occurs once in an example, and the text-defined
    HookToolResult has status, result, error, stack and attachments only. MUST-backed: argument validation,
    sequential local execution, and persisting a tool error as a tool result instead of halting. Not specified:
    what the stored message holds for an error. A refusal is therefore a tool error, not the end of a
    run; `after_tool_call_failure` may rewrite the stored error and `before_store_tool_result` the result.
    Searched: interface ToolResult, error_data, error_code.'
  combined: 'Order inside the wrapper: check everything; refuse without consuming anything; consume the
    checkpoint and the approval; write the action record; then call the inner function inside try/catch
    and report a throw as R402. A refusal returns `{ status: ''error'', error: ''F501 CHECKPOINT_REQUIRED:
    <message>'', error_code: ''F501'', error_data: <§9.8 diagnostic> }`. The code is the first token of
    `error` because the text defines no place for `error_code` or `error_data` outside the ToolResult
    returned to a `state.invokeTool` caller; a model, a hook and the stored record get the `error` text.
    Outputs are `result: JSON.stringify(output)` with the capability''s required fields, evidence_anchors
    included; a later hook may alter the stored string. Tier 1; error_code and error_data are tier 3.'
  see_also:
  - tools-contracts#io-03
  - tools-contracts#io-06
  - safety-enforcement#appr-01
  - safety-enforcement#ckpt-02
  - safety-enforcement#err-01
  - safety-enforcement#hook-03
  - checkpoint-rollback-state#state-19
  - approval-human#approval-19
  - evidence-audit-observability#collect-02
  - evidence-audit-observability#transform-01
  - packaging-conformance-governance#diag-03
- id: tools-05
  relation: partial
  acs:
    concept: 'Declared dependencies: the `requires` edge from checkpoint to mutate, send and rollback;
      and the binding''s own calls to helper tools'
    refs:
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 145-171)
    - spec/STANDARD-v1.1.0.md §4.4 Safety-Critical Capabilities (lines 182-189)
    quote: '| `mutate` | `checkpoint` | Cannot mutate without prior checkpoint |'
  sa:
    concept: '`uses` on a tool: allow-list for state.invokeTool and state.queueTool (UsesConstrainedState,
      EmptyUsesState)'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 484 and 568 (uses), lines 367-399 (constrained state
      types), lines 456, 558-559 and 566 (comments)'
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44)
    - content/0.2.0/distribution/packaging.md 'Qualified Names' (lines 232-236)
    - '@standardagents/spec 0.45.10 index.js line 322 (parseQualifiedName; implementation observation)'
    quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
      the list.
  explanation: '`uses` is a may-call allow-list, enforced by the runtime and, with `as const`, by the
    compiler. An ACS `requires` edge is a must-have-run-before ordering. Neither implies the other. Text
    and types differ in two details. For an undeclared target, tools.md line 44 says `invokeTool()` ''returns
    an error result'' while the types'' comment says such calls ''will throw an error'' (line 456). Qualified
    names are `{packageId}/{name}` in packaging.md, while a types comment gives ''other_pkg:agent'' (line
    566); the published `parseQualifiedName` splits on ''/'' only (observed by running 0.45.10).'
  combined: 'A grounded tool that calls a helper declares it, for example `uses: [''acs_checkpoint'']
    as const`; a packed tool MUST. A grounded tool that calls nothing declares `uses: [] as const`, which
    removes `invokeTool` and `queueTool` from the state type it receives. Code that invokes an undeclared
    target handles both an error result and a throw. ACS ordering is checked by the wrapper at call time
    from recorded state (row thread-01), never by `uses`. Tier 1.'
  see_also:
  - tools-contracts#cls-13
  - safety-enforcement#gate-03
  - workflow-execution#wf-26
  - packaging-conformance-governance#pkg-08
- id: tools-06
  relation: acs_only
  acs:
    concept: A gate that covers every action, including calls the binding did not author
    refs:
    - hooks/README.md 'Pre-Tool-Use Hooks' (lines 30-41)
    - docs/integrations/claude_agent_sdk.md 'PreToolUse Hook Enforcement' (lines 268-272)
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (line 85)
    quote: Run **before** a tool executes and can block operations. Claude Code passes
  sa:
    concept: 'No hook decides before a tool runs (nearest: the observational `tool_call_started`); calls
      that never pass through a package-authored `execute`: provider-executed tools, prompt tools, agent
      handoffs, injected lifecycle tools'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts line 6315 (tool_call_started), line 516 (progressArgument),
      lines 443-448 (executionMode, executionProvider), lines 110-121 (ProviderCallable, McpCallable),
      lines 1014-1021 (ProviderResponse.providerTools)'
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384), §7 TypeScript Reference
      (lines 595-600)
    - content/0.2.0/specification/providers.md §10 Provider Tools (lines 598-653)
    - content/0.2.0/specification/models.md §1.2 (line 34, `providerTools`)
    - content/0.2.0/infrastructure/runtime.md §5.3 Tool Classes (lines 94-100), §7.2 Lifecycle Tooling
      (lines 122-129), §7.3 (line 143)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (line 22)
    quote: '- The return value **MUST** be ignored; the hook cannot modify the tool call.'
  explanation: 'ACS''s existing bindings gate in a pre-tool hook that can deny a call. No SA hook can:
    `tool_call_started` is declared `(state, toolCall, progress, context) => Promise<void>`, is observational,
    and may fire while arguments are an incomplete JSON fragment. Separately, the wrapper of row tools-04
    covers only function tools it wraps. Lifecycle tools are injected for a prompt-backed side''s non-hidden
    relationships; a handoff keeps the thread and its records; provider tools ''execute server-side'';
    and the text does not say what a runtime does with a call to a tool the prompt does not list. A provider
    extension is a package-authored point before execution for model-issued calls (row provext-01), hence
    partial. In the types only: executionMode, executionProvider, ProviderResponse.providerTools, the
    `provider:` and `mcp:` prefixes. Searched: before_tool, pre_tool, veto, guardrail, unknown tool, unlisted,
    hallucinat.'
  combined: 'State coverage as: calls a model makes to function tools wrapped by the binding. Conditions:
    every relationship of a grounded side is `hidden: true` and delegation goes through a grounded tool;
    no handoff to an agent outside the binding; side-effecting `providerTools` are left off the model
    definitions; and the binding assumes a runtime does not execute a tool the active prompt does not
    list (not stated in 0.2.0). Two stronger structures exist today, each with limits: a provider extension
    on the agent''s own models (row provext-01) and a handler-backed side that alone invokes the mutating
    tools (row handler-02). `tool_call_started` serves only as a notification that a call is about to
    run. Tier 1 for wrapped tools; the allow-list assumption is tier 2.'
  see_also:
  - tools-contracts#cls-03
  - tools-contracts#cls-07
  - tools-contracts#cls-08
  - tools-contracts#cls-14
  - tools-contracts#eff-01
  - safety-enforcement#gate-01
  - safety-enforcement#surface-01
  - checkpoint-rollback-state#state-07
  - checkpoint-rollback-state#state-25
  - approval-human#approval-01
  - approval-human#approval-15
  - approval-human#approval-16
  - workflow-execution#wf-14
  - multi-agent#coord-20
  - packaging-conformance-governance#pkg-03
- id: options-01
  relation: partial
  acs:
    concept: 'A per-use declaration on a step: the `domain` parameter, and safety flags stricter than
      the ontology''s'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition (lines 260-262)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 279-284)
    quote: '| `domain` | string | Domain parameter for the capability |'
  sa:
    concept: 'PromptToolConfig: a prompt''s per-tool entry with `env` and `options`'
    refs:
    - content/0.2.0/specification/prompts.md §3.2 Tool Configuration with Environment Values (lines 103-125),
      §10 TypeScript Reference (lines 335-339)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4205-4223 (PromptToolConfig), line 411 (UsesAwareExecute)'
    - '@standardagents/spec 0.45.10 index.js line 182 (definePrompt; implementation observation)'
    quote: '| `options` | `Record<string, unknown>` | Static tool options |'
  explanation: 'A prompt''s `tools` entry may be an object with `name`, `env` and `options`. Text and
    types agree on the shape, and it is the one declared per-prompt, per-tool slot that could carry a
    third-party declaration such as an ACS `domain` or a stricter flag for one use of a tool. Text and
    types disagree on its effect: prompts.md calls it ''Static tool options''; the types'' comment adds
    ''Passed to the tool handler at execution time.'' (line 4220), yet `execute` has no parameter that
    could receive it (line 411). The published `definePrompt` keeps the value (observed by running 0.45.10).
    The types also carry a deprecated `tenvs` on the entry, absent from the text. Searched: tenvs.'
  combined: 'Use `options` descriptively only, for example `{ name: ''write_config'', options: { acs:
    { domain: ''config'', requires_approval: true } } }`, read by a build-time checker that loads the
    prompt definition. It cannot make the wrapper stricter at run time, because the wrapper never receives
    it; a stricter variant of a tool is a second grounded tool with its own flags. Per-prompt values a
    tool must read at run time go through `env`, which a thread value can override (row thread-07), so
    nothing security-relevant belongs there. Tier 2: descriptive text, and no behaviour is relied on.'
  see_also:
  - safety-enforcement#appr-02
  - checkpoint-rollback-state#state-15
  - approval-human#approval-12
  - approval-human#approval-21
  - approval-human#users-01
  - evidence-audit-observability#audit-02
  - workflow-execution#wf-05
  - multi-agent#coord-26
  - models-context-memory-security#profile-01
- id: provext-01
  relation: partial
  acs:
