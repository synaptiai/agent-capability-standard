      disagree'
    refs:
    - content/0.2.0/specification/threads/client-api.md (wire types, lines 147-156 and 341-359)
    - content/0.2.0/specification/users.md §3.2 (line 148), §5 (lines 167-177), §7 (lines 211-215)
    - content/0.2.0/specification/subagents.md §5.1 (line 175)
    - content/0.2.0/specification/hooks.md §1.1 (lines 17-36), §2.1 (line 136), §4.1 (line 322), §5.1
      (line 373), §6.1 (lines 448-463)
    - content/0.2.0/specification/tools.md §2.1 (line 44)
    - content/0.2.0/distribution/packaging.md 'Qualified Names' (line 234)
    - content/0.2.0/specification/threads.md line 159, §12 (lines 611-741)
    - content/0.2.0/specification/prompts.md §3.2 (line 123), §10 (line 320)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5947, 3410, 6109-6112, 456, 566, 1561, 3231, 6339-6354,
      4099, 4219-4222, 2137, 2150-2239'
    quote: '| `execution` | `ExecutionState` | Always present in hooks |'
  explanation: 'In the text only: the Thread Client API wire types (AgentListEntry, CreateThreadRequest,
    SendMessageRequest, the `message_data` and `event` stream frames, stream tickets; the types declare
    three stream events under other names), the `X-Standard-Agents-Caller` header, the error code `subagent_arguments_required`.
    Disagreements: HookMessage (ten-field interface versus alias of Message); `execution` ''Always present
    in hooks'' versus nullable; per-hook signatures without the trailing context; `before_create_message`
    failure (SHOULD prevent versus the types'' comment); an undeclared `invokeTool` target (error result
    versus throw); the qualified-name separator (''/'' versus a '':'' example); the result of `user()`
    (three versions); user hooks returning `void` versus `Promise<void>`; 14 hooks listed versus 17 declared;
    `PromptPart` with two members versus three; tool `options` ''Passed to the tool handler at execution
    time.'' with no such parameter; metadata merge on `updateMessage` stated in the types only; threads.md
    §12 omits user, skills, runtimeStreams, moveFile and renameFile.'
  combined: 'For each disagreement the binding takes the reading that fails safe and compiles: `state.execution`
    is treated as nullable everywhere; hooks declare the trailing context parameter; code that calls `invokeTool`
    handles both a throw and an error result; qualified names use ''/''; metadata is written whole, not
    merged; nothing is passed through tool `options` at run time; and the result of `user()` is read through
    optional fields only. The wire types of the client API are copied from the text where a client needs
    them, since the package does not export them. Tier 1 where the text has a MUST; otherwise tier 2.'
  see_also:
  - checkpoint-rollback-state#state-26
  - evidence-audit-observability#anchors-02
  - models-context-memory-security#context-04
