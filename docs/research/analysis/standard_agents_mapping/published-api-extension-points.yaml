    a model''s call to a tool the active prompt does not list. Text and types agree on the handler contract.'
  combined: 'For agents whose mutating tools must never be callable by a model: side A is a planner prompt
    with read-only tools and `stopOnResponse`; side B is an `acs_gatekeeper` handler that parses the proposal,
