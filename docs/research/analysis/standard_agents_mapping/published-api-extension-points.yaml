  explanation: 'A handler receives the full ThreadState and the full Message. Delivery is exactly once,
    in order, never concurrent on a thread, and a failed invocation MUST NOT be redelivered automatically;
    a throw fails only that turn. A handler turn makes no model request. That matches the executor''s
    design: deterministic, resumable, asked what to do next. Text and types state the same contract; the
    types additionally brand the definition with `[HANDLER_SYMBOL]: true` and export `isHandler()`, neither
    in handlers.md §10. Whether `state.invokeTool` from a handler fires tool hooks or stores a tool message
