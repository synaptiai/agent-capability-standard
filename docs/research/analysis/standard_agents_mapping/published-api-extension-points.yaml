    quote: 4. The runtime MUST reject a `fetch` from a caller not covered by `allow`. An absent `allow`
      denies all callers.
  explanation: 'On the draft Users page, a credential grant is a named, user-scoped credential with a
    use policy. `UserHandle.fetch(grant, input, init)` makes the runtime inject the credential, and the
    runtime MUST reject a `fetch` whose destination origin is not covered by `origins` or whose caller
    is not covered by `allow` (tools, endpoints, user endpoints, rooms, agents). Secret material is not
    readable by packaged code. This is a pre-effect gate that the runtime, not the package, enforces:
    it limits which tool may reach which origin with which credential. It does not decide whether a particular
    action may proceed. Text and types agree on CredentialGrant and `fetch`; the page is marked as outside
    ''the frozen specification surface'', and a thread without a user has no handle.'
  combined: 'Where the draft surface exists, a grounded `send` or `mutate` tool that needs a credential
    calls `fetch` on the handle that `state.user()` resolves to, instead of reading a secret from `env`,
    and the deployer lists only grounded tools in the grant''s `allow`. An ungrounded tool then cannot
    use the credential, which narrows the coverage gap of row tools-06 for credentialed effects. The ACS
    checkpoint and approval checks still run in the wrapper first. The tool feature-detects the handle
    and its `fetch`, and a packed binding still works without them. Tier 2: a draft surface, feature-detected.'
