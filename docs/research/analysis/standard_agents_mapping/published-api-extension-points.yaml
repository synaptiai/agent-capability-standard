  explanation: 'Every record a binding keeps inside a thread can be removed from outside the binding.
    Where the runtime exposes the client API (a SHOULD), a caller with thread access can delete the thread,
    which MUST delete its messages, files and stored values and discard its queued messages and scheduled
    effects; delete one message, with the semantics of `deleteMessage` (tool-result messages cascade with
    their parent assistant message); or stop a run, which MUST abort the execution in flight and settle
    it as `idle` with reason `aborted_by_user`. Thread retention is runtime-defined. ACS treats observations
    as append-only and requires each decision on an action record. No published types are involved: the
    client API''s wire types are in the text only.'
  combined: 'Write the action record before the effect and update it after, so an aborted mutation still
    leaves a `planned` or `approved` record. Anything that must outlive the thread, or survive its deletion
    by an admitted caller, is copied to a store outside the thread that the package declares as part of
    its purpose. A binding claim states this limit: inside SA 0.2.0 the trail is a thread-local trace
    under the control of everyone the runtime admits to the thread. Tier 1: the deletions are MUSTs, so
    the limit is certain.'
