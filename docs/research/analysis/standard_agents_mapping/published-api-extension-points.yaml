    quote: '# Unknown tool - default to medium risk observe'
  sa:
    concept: 'ThreadState definition lookup: loadModel, loadPrompt, loadAgent, getPromptNames, getAgentNames,
      getModelNames; there is no tool lookup'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 2872-2906 (lookup methods), lines 5456-5457 (ControllerContext.tools),
      lines 5828-5860 (PackedExports)'
    - content/0.2.0/specification/threads.md §1.2.2 Resource Loading (lines 100-113), §2 Resource Loading
      (lines 188-206)
    - content/0.2.0/distribution/packaging.md 'Lazy Loading' (lines 110-119), 'PackedExports Interface'
      (lines 121-147)
    quote: '| `loadAgent(name)` | `Promise<T>` | Load agent definition |'
  explanation: 'The ACS reference SDK maps a tool name to a capability: a registered or built-in name
    gets its mapping; a name it does not know gets `observe`, medium risk, no checkpoint; only when the
    mapper itself fails does the pre-tool hook substitute a high-risk `mutate`. In SA, text and types
    agree on six lookup methods and neither has a tool lookup (`state.loadTool` is TS2339). A tool hook
    receives only `toolCall.function.name` and cannot reach the ToolDefinition or its annotations through
    ThreadState. A definition is reachable outside ThreadState, through the PackedExports.tools loaders
    or a direct import. `ControllerContext.tools` is optional and in the types only. In SA a hook can
    record a call but cannot deny it. Searched: loadTool, getToolNames, loadHook, loadHandler, loadEffect.'
  combined: 'Generate one static module `{ toolName: capabilityId }` at build time from the project''s
    tool files, or from the PackedExports.tools keys, import it from the hooks, and lint it against each
    definition''s `ai.synapti/acs` annotation. A registry filled when definitions load is not reliable: packed definitions
    sit behind lazy loaders, and the text does not say that a tool module and a hook module share one
    instance. A call to a name outside the table (a host tool, a lifecycle tool, a `provider:` or `mcp:`
    callable) is recorded as unclassified. No rule for unknown tools is enforced, since a hook cannot
    refuse. Tier 1: a build-time table and plain imports.'
  see_also:
