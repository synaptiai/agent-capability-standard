  explanation: '`state.decide()` evaluates typed questions over caller-supplied context and returns probabilities;
    providers and runtimes MUST NOT coerce a probability to a boolean or apply a threshold, and `decide()`
    MUST NOT implicitly read or change the conversation or execute tools. The runtime MUST expose it,
    also when `state.execution` is null. Every call names a `provider` factory and a `model`, so a binding
