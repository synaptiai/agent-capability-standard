    call `state.decide()`, return the answer''s probability as the ACS `confidence`, record the provider
    and model as the inference method, and list as `evidence_anchors` the stored items (message ids, file
    paths) whose content it passed as context. The threshold that turns a probability into a `verify`
    verdict is the tool author''s, as decisions.md requires of callers, and belongs in the tool''s constants.
