    quote: reserves the active checkpoint for the call, keyed by its `tool_use_id` (`CheckpointTracker.validate_and_reserve`)
  sa:
    concept: 'The tool-call id: `HookToolCall.id` and `Message.tool_calls` carry it; `execute` does not
      receive it; `execution.messageHistory` lets a tool look it up'
    refs:
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50)
    - content/0.2.0/specification/threads/execution-state.md §2 (line 30), §2.2 Live execution history
      (line 45)
    - content/0.2.0/specification/threads/messages.md §1 (line 17, `tool_calls`)
    - '@standardagents/spec 0.45.10 index.d.ts line 411 (UsesAwareExecute), line 2598 (messageHistory),
      lines 5951-5963 (HookToolCall), lines 2578-2634 (ExecutionState)'
    quote: '`execution.messageHistory` **MUST** represent live chronological persisted execution history.'
  explanation: '`execute` receives (state, args) and ExecutionState has no current-call member (TS2339
    on `state.execution?.toolCall`), so a tool is not told which call it serves. It can usually find out:
    the step cycle MUST persist the assistant response before executing its tool calls, and `execution.messageHistory`
    MUST be the live persisted history, so the last assistant message''s `tool_calls` holds an entry with
    the tool''s own name and arguments. A helper doing this type-checks against 0.45.10. The lookup fails
    for two identical calls in one response and for calls made with `invokeTool` or `queueTool`, and it
    needs the tool to know its own name, which a definition does not carry (row tools-01). Text and types
    agree on `messageHistory` and on the stored `tool_calls` shape.'
  combined: The wrapper derives `action_id` from the recovered call id when exactly one unanswered call
    in the last assistant message matches its name and arguments; otherwise it generates its own id and
    records that no call id was available. With the call id on the wrapper's record, the `tool_call_done`
    hook is no longer needed to join tool-side and hook-side records. Unlike the ACS Python adapter, the
    binding cannot reserve a checkpoint for a call id before the call starts, because nothing runs before
    `execute`; it validates and consumes inside `execute` (row thread-05). Tier 1 when the lookup is unambiguous.
- id: thread-01
  relation: fits
  acs:
    concept: Checkpoint record and approval decision record (digest-bound, expiring, single-use)
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 829-837)
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces' (lines 145-148)
    quote: has not expired, and it has not been used before.
  sa:
    concept: 'ThreadState.getValue / setValue: the durable per-thread key-value store'
    refs:
    - '@standardagents/spec 0.45.10 index.d.ts lines 3152 and 3167 (getValue, setValue), lines 2913 and
      2919 (getChildThread, getParentThread)'
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-445)
    - content/0.2.0/infrastructure/runtime.md second heading '## 14. Durable Key-Value Store' (lines 344-362),
      §11 Concurrency (line 239), §16 Conformance Summary (line 392)
    - content/0.2.0/specification/subagents.md §6.4 (line 219)
    quote: 1. Values **MUST** be persisted to durable per-thread storage that survives execution boundaries,
      process restarts, and runtime redeploys.
  explanation: 'Text and types agree on the two signatures. MUST-backed: durable, one key space per thread,
    JSON round-trip, null or undefined deletes, never copied to children. Only SHOULD: ''Writes **SHOULD**
    be durable before the promise returned by `setValue` resolves'', so an acknowledged delete can be
    lost in a crash. Not provided: key ownership, key listing, a conditional write, and a statement of
    whether endpoint or effect writes can interleave with a running flow. Any code on the thread can overwrite
    a record, and so can code in a related thread: `getParentThread()` and `getChildThread()` return a
    full ThreadState, and subagents.md names ''the parent''s key-value store'' as a child''s result channel,
    against runtime.md''s rule that values are not readable by any other thread. Searched: atomic, compare,
    ifAbsent (threads.md, runtime.md: no rule for thread values).'
  combined: One writer per key. The endpoint writes one key per approver, `acs.approval.<request>.by.<callerId>`;
    the tool writes a tombstone `acs.used.<request>` before acting and never deletes it, and a decision
    counts only while no tombstone exists. The request id includes the digest, so two identical actions
    need two decisions. `acs.checkpoint.<id>` holds { id, scope, flow, created_at }. Where single use
    must hold under interleaving, consume with `moveFile` (row consume-01). The trust boundary is all
    code installed on the thread, on composed children whose `parentHooks` run with this ThreadState,
    and on a parent holding `getChildThread()`; the binding cannot make these records tamper-proof. Tier
    1 for storage; durability at acknowledgement is tier 2.
