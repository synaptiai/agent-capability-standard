  explanation: '`metadata?: Record<string, unknown>` is on Message in the text and the types, and every
    insert MUST pass `before_create_message` and `after_create_message`, tool result messages included.
    Disagreements: hooks.md §6.1 declares HookMessage as a ten-field interface without metadata, while
    the types have `type HookMessage = Message;`; the §8.6 example assigns a string to `metadata` and
    does not compile (TS2322, TS18047). On a throwing hook the text says ''Failures **SHOULD** prevent
    message creation''; the types'' comment lets a runtime still insert a tool result message. That `updateMessage`
    merges metadata is a types comment only (line 2137). Message records `prompt`, `subagent_id` and the
    SHOULD-level `metadata.subagent_id` and `metadata.forwarded_from`; none identifies the authenticated
    caller. A message can be updated and deleted, also by a client with thread access. Searched: sender,
    author (messages.md: not found).'
