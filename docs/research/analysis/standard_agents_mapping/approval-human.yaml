    - content/0.2.0/specification/threads/client-api.md §1 item 6 (line 14), §2 Routes (line 29), §10
      Deleting a Thread, item 5 (line 296), §13 Deleting a Message (lines 372-381)
    - 'content/0.2.0/specification/tools.md §7 Progress Reporting, example (lines 102-113: a file-writing
      tool)'
    - content/0.2.0/specification/subagents.md §4.1 (line 124)
    quote: A human-backed side's turn ends when the human's inbound message is persisted.
  explanation: 'In SA the record of an answer is the conversation: a persisted message with no sender,
    which code holding `ThreadState` can update or delete, clients can delete, and a `before_create_message`
    hook can rewrite before storage. Retention is runtime-defined, and deleting a thread removes everything:
    ''The runtime **MUST** delete the messages, files, and stored values of every thread in the deletion
    set.'' Files are served to any caller with thread access by a fixed route, and a model can write them
    wherever the agent exposes a file-writing tool; the key-value store has no client route and is reached
    only from code. ACS defines the record''s content, not where it is kept. Searched: append, immutab,
    tamper, write-once, audit (content/0.2.0; `append` and `audit` occur only in unrelated senses).'
  combined: 'Keep everything the guard reads (pending requests, decisions, consumed markers) in the key-value
    store under a reserved key prefix. Write one ACS `ActionRecord` per gated call (`planned`, then `approved`,
    `rejected` or `expired`, then `executed` or `failed`) with its `approval` object and the SA references:
    the thread id, the approver''s namespaced `auth.caller.id`, and a child `reference` if one was shown.
    Use the file system only for copies meant for people, and say that they are not evidence. Neither
    store survives deletion of the thread or the runtime''s retention policy, and any code holding `ThreadState`
    can rewrite both; a deployment that needs an audit trail must also send each record to a store outside
    the thread.'
