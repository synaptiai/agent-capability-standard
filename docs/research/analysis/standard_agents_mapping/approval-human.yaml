    quote: '| `public` | The runtime **MUST** invoke the handler regardless of the request''s authentication
      state.'
  explanation: 'SA offers a coarse gate: authenticated callers admitted by the runtime''s thread access
    policy, or everyone, with best-effort caller resolution. ACS filters by principal list, authentication
    mechanism and trust class, counts what it drops and keeps waiting. The two coincide only where the
    wanted filter is: any authenticated caller with access to this thread. On a `public` endpoint a non-null
