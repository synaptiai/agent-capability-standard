    - spec/STANDARD-v1.1.0.md §9.6 Safety Errors, F502 (line 1322)
    quote: '- `defer_to_queue` → a `planned` action record, and the step is'
  sa:
    concept: Stop and session bindings (`stopTool`, `sessionStop`, `sessionFail`, `sessionStatus`) are
      tied to a tool being called; the text does not make them depend on the result's status
    refs:
    - content/0.2.0/specification/agents.md §1.2 SideConfig, PromptSide (lines 42-47)
    - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113), §4 Stop Semantics (lines
      117-122)
    - content/0.2.0/infrastructure/runtime.md §6 Stop Conditions (lines 104-109)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 19, `tool_status`)
    - content/0.2.0/specification/threads.md §1.3 Access Contexts (lines 182-186)
    quote: '| `stopTool` | `string` | - | Stop side turn when this tool is called |'
  explanation: In ACS a step whose approval is refused, skipped or deferred does not run, and the run
    records that. In SA a guarded tool that answers with a pending or refusal error has still been called.
    Agents §1.2 describes `stopTool` as 'Stop side turn when this tool is called', §3 describes a session
    binding's `name` as the 'tool that controls the lifecycle action', and §4 gives the evaluation order;
    none of them makes a binding depend on the result's status. A refused or pending call may therefore
    end the turn or the session and, through `messageProperty`, hand a parent model-written text as the
    result, although nothing ran. Whether a binding takes effect on an error result is not stated (SA
    gap).
  combined: Never name a gated tool in `stopTool`, `sessionStop`, `sessionFail` or `sessionStatus`. Where
    a turn or session should end after a gated action, bind a separate, ungated tool that the model calls
    once the gated tool has returned success, or end the session from code with `state.stopSession()`
    inside the gated tool after the action has run (tools run inside an execution). A build-time check
    over the agent definitions, comparing every bound tool name with the list of guarded tools, makes
    the rule mechanical.
