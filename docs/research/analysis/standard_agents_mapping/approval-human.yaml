  combined: 'Apply the three ACS filters in the endpoint before queueing anything: `accept_from` against
    the caller''s namespaced principal, `accept_trust_classes` against the derived class, `sender_check`
    against the vendor mechanism value. Use `access: ''authenticated''` when only callers the runtime
    already admits to the thread may answer. On a `public` endpoint admit a caller only when `auth.threadAccess`
