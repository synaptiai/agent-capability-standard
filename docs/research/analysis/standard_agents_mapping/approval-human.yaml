  explanation: 'What ACS excludes, SA standardises for runtimes that expose the Thread Client API (a SHOULD):
    durable acceptance of input, pushed run status, custom events and a fixed client API. An SA package
    can be the host that an ACS approval request is handed to. Three limits apply. An emitted event reaches
    only clients connected to that thread''s stream at that moment (''Delivery is at-most-once. The stream
    carries no history and no acknowledgements.''), and an approver without access to the thread cannot
    connect. The fixed API cannot serve an approval inbox (approval-18). And the ACS core has no JavaScript-callable
