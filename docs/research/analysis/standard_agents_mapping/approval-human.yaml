    code bundled with the package, or from `state.instanceEnv` after feature-detecting it and failing
    closed when it is absent or the value is missing. Never read it with `state.env()`, from user values,
    from thread storage or from a child's `arguments`. A deployment that needs per-environment settings
    on a runtime without `instanceEnv` builds them into the package.
