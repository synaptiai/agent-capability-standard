      outside an active execution context)'
    quote: A **human-backed** side's turn parks execution until the human's inbound message arrives.
  explanation: 'No time bound on a human turn or on a decision was found; the matches for the search terms
    concern provider and model requests, hook execution, code execution, stream tickets, runtime-stream
    opening and Draft user rooms. `maxSessionTurns` caps exchanges, not time. Two things may clear a parked
    child without the package knowing: Runtime §6 mentions ''runtime hard caps'' without defining them,
    and Subagents §4.1 puts retention of idle threads out of scope. On the ACS side the Standard names
    the `expired` status; that a lapse fails the step with F502 is in the reference executor. Searched:
    timeout, deadline, expir, ttl, ''time limit'', elapse, wall-clock (content/0.2.0).'
  combined: 'Keep an absolute `expires_at` in the acting thread''s pending record, not in a child''s arguments.
    The decision endpoint refuses a decision that arrives later, and the tool refuses one whose `expires_at`
    has passed (record status `expired`); the tool-side check is the guarantee. A scheduled effect (`state.scheduleEffect(name,
    args, delay)`) can sweep: it writes the `expired` record and, for a parked child, reaches it through
    `getChildThread(reference)` and calls `terminate()`, since the published `stopSession` is documented
    to throw outside an active execution. Effects carry no timing bound and no exactly-once delivery (runtimes
    ''**MUST** enqueue effects asynchronously for execution.''), so the sweep is best effort; without
    it an `expired` record is written only when the tool is next called.'
