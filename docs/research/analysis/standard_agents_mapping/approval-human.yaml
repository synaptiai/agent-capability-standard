  explanation: 'No standing pre-approval of actions was found in SA. The nearest construct is the Draft
    `CredentialGrant.allow`, a per-user policy naming which tools may use a credential against named origins;
    it approves no action instance and carries no digest, but shows SA''s style for a fail-closed standing
    policy. `state.env()` must never be the source of a mandate: thread values resolve first, a thread''s
    creator can supply them through the Thread Client API (`CreateThreadRequest.env`), and `setEnv` propagates
    them to descendants. Under the rule of identity-04 a mandate may not answer on a thread that has received
    an unattributed message, so in practice this row applies to endpoint-fed, unattended threads. Searched:
    mandate, standing, pre-approv (content/0.2.0; `mandate` occurs once, as a verb).'
  combined: 'Sources of mandates, in this order: mandates bundled with the package, which no thread or
    user can change (portable); then `state.instanceEnv` where the runtime offers it (an optional capability:
    feature-detect it and fail closed, as the text requires). Never `state.env()`, user values or thread
    storage. A mandate that covers the action yields an ACS decision naming the mandate and the approvers
    it stands for; otherwise the decision is `unavailable` and `when_unattended` applies. Where the action
    is a credentialed HTTP call, a Draft `CredentialGrant` with `allow.tools` and `origins` can additionally
