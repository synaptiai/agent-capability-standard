    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (line 410)
    - content/0.2.0/specification/threads/messages.md §4 Queueing Messages (line 166)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult), 5367-5372 (ThreadEndpointAuth)'
    quote: 2. A value written by `setValue(key, value)` **MUST** be visible to every subsequent `getValue(key)`
      on the same thread, across any execution context (tools, hooks, endpoints).
  explanation: ACS states when a decision counts and leaves the exchange to the host. SA 0.2.0 has three
    MUST-level joints from which a host can be assembled on one thread, with no child thread and no model
    in the path. A tool error is persisted as a result without halting execution. A thread endpoint with
    the default `authenticated` access always has a non-null `auth.caller`, which '**MUST** be the authenticated
    identity when the request presented credentials the runtime verified'. And a value written on a thread
    is visible to later reads on that thread from tools, hooks and endpoints. Durability of a write before
    its promise resolves is a SHOULD. A guard, a request endpoint and a decision endpoint written this
    way type-check against the published types (0.45.10).
  combined: (1) The gated tool computes the digest, writes a pending record (request id, digest, canonical
    shown text, expiry, recheck baseline) with `state.setValue`, and returns a pending error result (approval-01).
