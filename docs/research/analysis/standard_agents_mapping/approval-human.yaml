      line 142)
    - 'content/0.2.0/getting-started/examples.md §9 Remote Trigger (lines 1340-1342: an agent with no
      person in its thread; non-normative)'
    - '@standardagents/spec 0.45.10 index.d.ts line 1957 (`initialArguments?` is optional on the registry
      entry)'
    quote: 5. `side_a_backing` and `side_b_backing` **MUST** report the [backing](/0.2.0/specification/agents)
      of each side.
  explanation: 'SA has no attended or unattended notion. ACS takes attendance from the trigger (''Default:
    `manual` → attended, `invoke` → the invoker''s, `schedule`/`event` → unattended''); SA starts an execution
    from a user message, a queued message, a queued tool or a scheduled effect, but `ExecutionState` does
    not tell a tool which. The absence of a human-backed side therefore detects only threads where nobody
    can ever be present. Of the three ACS rules that defer dependants, rule 2 (effective flags) and rule
    3 (ontology `precedes` edges) need only what a guard knows; rule 1 needs data flow. ACS does not say
    how a queued action is later resumed (ACS gap). Searched: attended, unattended, presence (content/0.2.0,
    published types; `presence` occurs only on the Draft Users page and as a model parameter).'
  combined: 'Let the deployment state attendance: package configuration per agent, or a flag set by the
    code that starts unattended work, and unattended when neither says otherwise (safety-enforcement#appr-02).
    `fail`: an error result naming F502. `skip`: a result saying the action was skipped, with a record.
    `defer_to_queue`: write a `planned` action record on the acting thread and return; those records are
    the queue, and a parked child is an optional view of it. Apply rule 2 in the guard: after a deferral,
    note it in `state.context` (''Mutable per-execution scratch storage.'') and defer every later guarded
    call of that execution without asking. An unflagged run is treated as unattended and follows `when_unattended`,
    whose default is `fail` (F502); nothing runs unapproved either way.'
