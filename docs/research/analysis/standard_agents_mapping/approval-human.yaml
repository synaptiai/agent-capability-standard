    - 'core/src/exec/machine.rs lines 1075, 1081, 1123 (stage order: approval, recheck, checkpoint)'
    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Checkpoints (lines 145-148; informative
      guide)
    quote: '| `recheck` | `source` (required, a `${...}` reference re-read before acting, else S303),
      `compare`: `version` or `digest` (default), `on_change`: `reask` (default), `replan` or `stop` |'
  sa:
    concept: 'None: the text defines only the waiting state, and has no checkpoint concept'
    refs:
    - content/0.2.0/specification/subagents.md §4.3 Human-in-the-Loop Children (line 153)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' §14.1 item 7 (line 356)
    - content/0.2.0 (whole tree searched; terms in the explanation)
    quote: The session resumes when human input arrives on that side's perspective; the specification
      defines only this waiting state, not who supplies the input or through which interface
  explanation: 'SA says nothing about re-reading state between a person''s answer and the action, and
    has no checkpoint concept; nothing in SA forbids doing both in tool code. On the ACS side the Standard
    defines the `recheck` field and names the order approval, checkpoint, execution (§5.13, Delays); that
    the recheck runs between approval and checkpoint is the reference executor''s stage order. `stale`
    occurs only for Draft room admissions, generated types and an effect example. Searched: recheck, re-check,
    re-read, checkpoint, stale (content/0.2.0).'
  combined: 'All in the gated tool''s `execute`, after a decision is accepted and before any side effect:
    re-read the source and compare it (digest or version) with the baseline stored with the pending record
    on the acting thread when approval was requested; on change, request approval again showing previous
    and current values (`reask`) or return an error result (`stop`); then take a fresh checkpoint and
    act. A checkpoint taken before the approval wait must not be reused. The stored baseline rests on
    `setValue`, whose durability before the promise resolves is a SHOULD.'
