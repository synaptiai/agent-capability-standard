    - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Approvals (lines 149-152; informative
      guide)
    quote: Validators, executors and safety layers MUST act on effective flags. A
  sa:
    concept: No approval requirement on tools, prompts or agents, and no hook that can stop a tool call
      before it executes. What SA does guarantee is that a tool's error result is persisted without halting
      the run
    refs:
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36)
    - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384; quote at line 382)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 150-156)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §5.2 Error Handling (line 92)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 107-114)
    - content/0.2.0/specification/subagents.md §5.2 Scoped Variable Bootstrap (line 179)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 19, `tool_status`)
    - content/0.2.0/specification/threads.md §7.4 Agent Skills (line 456)
    - content/0.2.0/specification/threads/runtime-streams.md §2 Optional Capability (lines 48-49), §4
      example (line 82, `error_code`)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult), 6023-6355 (HookSignatures),
      6315 (tool_call_started)'
    quote: '- The return value **MUST** be ignored; the hook cannot modify the tool call.'
  explanation: 'SA 0.2.0 names no action that needs approval. `tool_call_started` is the only tool hook
    that fires before execution, and it is observational; the published `HookSignatures` has no hook that
    returns a verdict before `execute`. The nearest normative precedents are access control, not approval:
    ''Runtimes **MUST** authorize mutations'' for skills, and runtime streams, where runtimes ''may refuse
    any request''. In the SA approval-gate pattern a model chooses whether to ask; in ACS the executor
    asks for every step whose effective flag is true. Searched: approv, consent, confirm, permission,
    guard, deny, veto, before_tool, pre-tool, pretool, PreToolUse, intercept, authoriz, refus (content/0.2.0,
    src/data, README.md; `approv` occurs only in the approval-gate pattern, in model-reviewer examples
    and in an environment-variable name).'
  combined: 'Enforce inside the tool. Wrap each function tool mapped to an approval-requiring capability
    so that `execute` first looks for a valid decision for this request (approval-19). With none, return
    `{ status: ''error'', error, error_code, error_data: { request_id, digest, expires_at } }`, with `error_code:
    ''F502''` both for a pending request and for a refusal, and the request''s state (pending, rejected,
    expired) in `error_data`; Tools §9 requires runtimes to persist tool errors as results without halting.
    `error_code` and `error_data` are members of the published `ToolResult`; SA''s own precedent is the
    structured `subagent_env_required` error. A success-status result saying that nothing ran is a fallback
    only for a runtime known to fail runs on `repeated_tool_error`; it mis-reports the call to hooks and
    clients. Coverage: the wrapped function tools, on every path to their `execute`, and nothing else
    (approval-15, approval-16, approval-20).'
  see_also:
  - tools-contracts#io-06
  - published-api-extension-points#hitl-01
  - published-api-extension-points#tools-06
  - safety-enforcement#appr-01
  - safety-enforcement#gate-01
  - checkpoint-rollback-state#state-07
  - workflow-execution#wf-14
  - workflow-execution#wf-15
  - packaging-conformance-governance#diag-03
- id: approval-02
  relation: fits
  acs:
    concept: Obligation on validators, executors and safety layers to act on effective flags. The effective
      flag is defined for a workflow step; 'safety layer' is not a defined term
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
    - spec/STANDARD-v1.1.0.md §2 Terms, Effective flag (line 67)
    quote: Validators, executors and safety layers MUST act on effective flags. A
  sa:
    concept: 'Tool `annotations`: implementation-specific hints on function tools that must not change
      execution'
    refs:
    - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 156)
    - content/0.2.0/specification/threads/client-api.md §2 Routes (lines 18-32; no route returns tool
      definitions)
    - '@standardagents/spec 0.45.10 index.d.ts line 424 (`annotations?: ToolAnnotations` on DefineToolOptions)'
    quote: '- Annotations **MUST NOT** change argument validation, execution, the tool''s results, or
      what is sent to the model. A tool behaves identically in a runtime that ignores them.'
  explanation: No pair of requirements is jointly unsatisfiable; the texts fix where enforcement may sit.
    Annotations can carry ACS flags as descriptive metadata ('A runtime **MAY** read keys it understands,
    typically to choose how it displays a tool call'), but a runtime may not withhold or delay a call
    because of them. Only function tools may declare annotations, so prompts, agents and relationships
    cannot carry the flags, and an annotation is a claim, not evidence that a guard is present. On the
    ACS side the effective flag is defined for a workflow step ('The safety flag a step is treated as')
    and 'safety layer' is not a defined term; reading §5.2.1 as binding on a tool-level guard is an inference
    (ACS gap).
  combined: 'Publish `annotations: { ''ai.synapti/acs'': { standard, ontology, capability, layer, risk, mutation, requires_checkpoint,
    requires_approval } }` (the members `schemas/interop/standard_agents_annotation.schema.json` requires)
    as descriptive metadata for validators, catalogues and UIs, read from the definitions at build time
    (no Thread Client API route returns annotations). Enforce in the tool''s own `execute` (approval-01),
    and generate the annotation and the guard from the same ontology entry, so that the guard never depends
    on a runtime reading the annotation. Do not define a runtime mode keyed on annotations; runtime-level
    enforcement needs a normative SA surface first (SA gap: pre-execution tool hook).'
  see_also:
  - tools-contracts#cls-02
  - tools-contracts#cls-03
  - tools-contracts#dom-01
  - published-api-extension-points#tools-02
  - published-api-extension-points#tools-03
