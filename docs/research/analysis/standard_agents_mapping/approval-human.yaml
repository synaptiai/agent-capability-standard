    quote: System prompts **MUST NOT** contain secrets or sensitive credentials. Implementations **MUST**
      sanitize prompt content that incorporates untrusted input to prevent injection.
  explanation: 'SA has no marking of data by origin. Its guidance on untrusted input is limited to prompt
    sanitising, hook input validation (''Hooks that modify message content **MUST** validate inputs against
    an expected schema to prevent prompt-injection attacks.'') and untrusted code; none of it follows
    data from its sender to a later action. ACS marks follow `${...}` references between workflow steps,
    and ACS itself says that content a host carries by other means is beyond what the executor can see.
    In SA 0.2.0 every message that did not enter through a binding''s endpoint is unattributed: a person''s
    own chat messages, parent traffic and child completions. Searched: taint, ''trust class'', trust_class
    (content/0.2.0).'
  combined: 'Only inside an ACS-executed workflow can a mark follow data. For a model-driven thread, a
    rule the guard can check without hooks: a standing mandate may answer only on a thread whose agent
    has no human-backed side and whose every `role: ''user''` message was created by the binding''s endpoint
    (the endpoint uses `injectMessage`, which returns the record, and stores the ids; the guard compares
    them with `getMessages`). On any other thread, always ask a person. This is stricter than ACS, where
    only items of a step that binds `always_ask_trust_classes` are marked; it leaves mandates to endpoint-fed
    unattended threads, and a deleted message escapes the check. A message hook is not a reliable observer,
    because a prompt-level `hooks` list replaces the agent-level one.'
