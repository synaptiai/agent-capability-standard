- id: approval-22
  relation: partial
  acs:
    concept: '`approver.kind: human` and `agent_identity.kind` (`agent`, `human` or `service`): a workflow
      can require a person, and the host says what kind of party answered'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 819, 842)
    - spec/STANDARD-v1.1.0.md §5.17 Sender Identity (lines 1021-1030)
    - schemas/agent_identity_schema.yaml lines 10-12 (`kind` is required)
    quote: its `kind` (`agent`, `human` or `service`), and optionally its `role`,
  sa:
    concept: '`auth.caller`: the identity behind verified credentials, with no member that says person
      or service; the authentication mechanism is implementation-defined'
    refs:
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 100-105)
    - content/0.2.0/specification/threads.md §1.2.2 Methods, User identity (line 159)
    - content/0.2.0/getting-started/examples.md §9 Remote Trigger (line 1342; non-normative)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1892-1905 (ThreadUser), 5367-5372 (ThreadEndpointAuth)'
    quote: '| `caller` | `ThreadUser \| null` | **MUST** be the authenticated identity when the request
      presented credentials the runtime verified, and `null` otherwise. For an endpoint whose access level
      is `authenticated`, `caller` is always non-null. |'
  explanation: 'ACS lets a workflow require a `human` approver and has the host report each party''s `kind`.
    An SA endpoint sees an authenticated caller, not a person: `caller` is whatever identity the verified
    credentials belong to, the mechanism ''(sessions, API keys, or otherwise)'' is implementation-defined,
    and `ThreadUser` has no member that says person or service (a `method` on `ThreadEndpointAuth` and
    a `kind` on `ThreadUser` do not exist in the published types). SA''s own remote-trigger example has
    a CI job ''send it to an authenticated thread endpoint using an API key''. An agent whose tools hold
    a credential the runtime accepts could therefore call the decision endpoint and approve its own request.'
  combined: 'A deployment rule, to be stated in the integration document: no credential the runtime accepts
    is within reach of any tool, prompt variable or thread environment value, and decision endpoints are
    reached only with credentials issued to people (for example, an approver list or an application role
    that the deployment grants only to people). `kind: ''human''` on the recorded identity, and the satisfaction
    of `approver.kind: human`, are then assertions by the deployment, not attestations by SA; record them
    as such. Where the deployment cannot make the assertion, the endpoint refuses the decision.'
- id: approval-23
  relation: partial
  acs:
    concept: The ACS reference safety layer is a library around the host's own tool loop (`GroundedAgentAdapter.wrap_options`);
      it is not a separate component the model calls
    refs:
    - docs/integrations/claude_agent_sdk.md 'Quick Start' (lines 7-35), 'Running Workflows' (lines 506-512)
    - grounded_agency/adapter.py line 301 (`wrap_options`)
    quote: The adapter guards tool calls an agent makes freely. To run a catalog
  sa:
    concept: 'Packaging visibility: a package''s internal tools and prompts are hidden from outside, packed
      code sees only its own package and other entry points, and packed thread endpoints share the local
      route namespace'
    refs:
    - content/0.2.0/distribution/packaging.md 'Visibility Rules' (lines 221-230), 'Packed Thread Endpoints'
      (lines 268-278)
    - content/0.2.0/specification/threads/endpoints.md §2 File-Based Routing (line 48), §4 (line 94)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 38-44)
    quote: '- **Packed code** sees only its own package contents plus other entry points'
  explanation: 'ACS ships its reference safety layer as a library around the host''s own tools. SA''s
    unit of distribution is the package, and its visibility rules decide how a guard can be delivered:
    a package''s internal tools and prompts ''are hidden from outside'', and packed code ''sees only its
    own package contents plus other entry points''. A packed ACS package therefore cannot export guard
    tools for a host''s prompts, and its endpoints or effects cannot invoke a host''s tools; what it exposes
    is entry agents. Packed thread endpoints are different: they ''use the same route namespace as local
    thread endpoints'' and carry their access level with them, so request and decision endpoints can be
    shipped in a package.'
  combined: 'Ship the guard as a TypeScript library: a function that wraps the options of the host''s
    own `defineTool` call, so that the guarded tool is the host''s local definition. Ship the request
    and decision endpoints either as local endpoint files or packed into the shared route namespace; in
    both cases each endpoint checks `state.agentId` and the pending record (approval-17). The wake-up
    after a decision is `state.queueMessage` on the endpoint''s own thread, which needs no tool name;
    `queueTool` re-entry works only where the endpoint and the tool share a namespace (wait-02).'
- id: approval-24
  relation: fits
  acs:
    concept: 'A decision''s validity rests on its digest, approvers, expiry and single use, never on text
      delivered as content (compare §5.15: a principal is never a sender the item''s content claims)'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 831-837)
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 932-938)
    quote: run, never a sender the item's content claims. So an item a peer relays on
  sa:
    concept: '`parentCommunication: ''explicit''`: the runtime must not auto-queue a child''s completion
      or failure to its parent'
    refs:
    - 'content/0.2.0/specification/subagents.md §1 SubagentRelationship (line 41), §2.1 The Owning Side
      (line 53), §6.2 (lines 195-205), §6.4 Child → Parent: Explicit Escalation (lines 211-219)'
    - content/0.2.0/infrastructure/runtime.md §7.2.1 Parent Communication Modes (line 135)
    - content/0.2.0/specification/threads/messages.md §4 Queueing Messages (lines 157-166)
    quote: When the effective `parentCommunication` is `explicit`, runtimes **MUST NOT** auto-queue completion/failure
      to the parent.
  explanation: 'Under the default `implicit` mode, a child that ends through `sessionStop` has its result
    queued into the parent on the owning side''s perspective, in a message that carries the model-supplied
    `messageProperty` text. For a side-A-owned relationship that is the `user` role, the role a person
    on side B writes in, so a model-written ''approved'' reaches the acting model as conversation input.
    `explicit` is the one MUST that keeps such a completion out of the parent: ''runtimes **MUST NOT**
    auto-queue completion/failure to the parent''. ACS places validity in the decision''s digest, approvers,
    expiry and single use, never in delivered text; the two fit when the SA side delivers no decision
    text at all.'
  combined: 'Declare every gate relationship with `parentCommunication: ''explicit''` (and `hidden: true`).
    The child then reaches the parent only through code, for example `state.notifyParent(...)` from a
    handler turn, used as a wake-up whose content the acting tool ignores. The decision itself is read
    from the acting thread''s own store (approval-19). Because an `explicit` child''s finish does not
    wake the parent, the decision endpoint on the acting thread does the waking with `state.queueMessage`.'
  see_also:
  - published-api-extension-points#hitl-01
  - safety-enforcement#appr-01
  - workflow-execution#wf-30
  - multi-agent#coord-08
  - multi-agent#coord-22
