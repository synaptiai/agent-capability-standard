  explanation: 'ACS types the act of asking: questions, the parameter each resolves, suggested options,
    an ambiguity analysis, evidence anchors and confidence. SA supplies the turn mechanics that put a
    question in front of a person and bring the reply back (the examples page shows a reply that asks
    ''the person to identify an issue or repository''). Neither defines a typed answer or a link between
    a question and its answer.'
  combined: '`inquire` is a tool whose result is the ACS output object serialised as JSON text (`ToolResult.result`
    is a string); the side A model then puts the questions to the person as its text reply, which ends
    its turn (`stopOnResponse` defaults to `true`). The model paraphrases: the person does not see the
    typed object unless a client renders the tool result. The next inbound message on the human side is
    the `receive` item; its sender is unattributed unless it enters through an endpoint (identity-01).
    On a thread with no human side, `inquire` needs a human-backed child or must fail.'
