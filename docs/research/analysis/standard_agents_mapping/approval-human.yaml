    - spec/RFC-0003-orchestration-extensions.md Key decision 6, 'E3 approval' (line 134)
    quote: canonical JSON of the shown values matches, at least `min_approvers` distinct approvers agree,
      it
  sa:
    concept: 'Approval gate: a child agent with a human-backed side that parks in `awaiting_human` (the
      text''s example of the human-in-the-loop composition rule)'
    refs:
    - content/0.2.0/specification/agents.md §7 Human-in-the-Loop Composition (lines 169-191; quote at
      line 173), §4 Stop Semantics (lines 117-124), §5 Tool Exposure (line 128)
    - content/0.2.0/specification/subagents.md §1 SubagentRelationship (lines 36, 41, 45), §3.1 Creation
      Paths (lines 90-94), §4.3 Human-in-the-Loop Children (line 153), §5 Lifecycle Tools (lines 157-163),
      §9 Example (line 259)
    - content/0.2.0/infrastructure/runtime.md §7.3 (line 143)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (line 27)
    - content/0.2.0/specification/threads/endpoints.md §5 Endpoint Context (line 109)
    - content/0.2.0/getting-started/examples.md (line 3; nine examples, none with a human-backed child)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4654-4662 (`hidden`), 5913-5916 (relationship name
      passed to `invokeTool` / `queueTool`; published types only)'
    quote: 'This is a deliberate capability, not an accident of the model. The canonical use is an **approval
      gate**:'
  explanation: 'SA defines the waiting state and its fulfilment, gives one short example, and says it
    does not define who answers or through which interface. In the example the parent receives the `decision`
    argument of a `record_decision` tool call made by the side A model (`sessionStop.messageProperty`):
    model-authored text. Nothing in the text requires a human message to precede that call (an inference
    from the stop order of Agents §4), binds the answer to the proposed action, limits its validity or
    prevents reuse. A gate thread also cannot tell who created it: its endpoints see `state.arguments`,
    which hold whatever the creator passed. ACS defines exactly these validity conditions and leaves transport
    and UI to the host.'
  combined: 'Treat a human-backed child as an optional view of the waiting state; decisions are recorded
    and read on the acting thread (approval-19). Where a gate child is used: give the relationship an
    alias (`as`) and leave `exposeAsTool` unset on the gate agent (with `primary: false`), so that the
    name cannot denote a handoff; declare it `hidden: true` with `parentCommunication: ''explicit''` (approval-24)
    and hide every relationship on that side, so that no lifecycle tool is injected; back side A with
    a handler, not a prompt (argument handling for such a child is unspecified: SA gap); take role, approver
    count and expiry from the tool''s own configuration, never from the child''s arguments. The code-side
    creation call has no specified form (SA gap).'
  see_also:
  - published-api-extension-points#hitl-01
  - safety-enforcement#appr-01
  - workflow-execution#wf-09
- id: approval-04
  relation: partial
  acs:
    concept: '`approval.approver`: `kind` (`human` or `standing_mandate`), `role`, `min_approvers`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval, field table (line 819)
    - spec/STANDARD-v1.1.0.md §5.14 (lines 831-837)
    quote: '| `approver` | Required (S304). `kind` (required): `human` or `standing_mandate`; `role`;
      `min_approvers` (integer ≥ 1, default 1); `mandate_ref`, required for and only for a standing mandate
      (S304 / S303) |'
  sa:
    concept: '`HumanSide`: `human: true` and an optional `label`; roles are visible only on the caller
      of a thread endpoint (`auth.caller.roles`)'
    refs:
    - content/0.2.0/specification/agents.md §1.1 The Three Backings (lines 13, 19)
    - content/0.2.0/specification/agents.md §1.2 SideConfig, HumanSide (lines 25-32)
    - content/0.2.0/specification/agents.md §8 Definition-Time Errors, item 1 (line 197)
    - content/0.2.0/specification/threads.md §1.2.2 Methods, User identity (line 159)
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 89-103)
    - content/0.2.0/specification/users.md §1 Identity, Application roles (lines 27-43; Draft)
    - content/0.2.0/infrastructure/runtime.md §11 Concurrency (line 239)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4772-4790 (HumanSide), 1892-1905 (ThreadUser; `roles?:
      string[]` at line 1899)'
    quote: No other properties are legal on a human side.
  explanation: 'Both name a person as the party who answers. The SA human side carries no role, no count
    and no identity (the text makes identity a runtime concern), and an agent has at most one human side:
    both sides human is reserved and 0.2.0 runtimes MUST reject it. So `role` and `min_approvers` cannot
    be declared on the SA side; a `role` member on a human side fails to type-check against the published
    `HumanSide`. They can be checked in endpoint code against `auth.caller.roles`, which is optional in
    the published `ThreadUser` and explained only on the Draft Users page. On a runtime that supplies
    no roles a role-bound approval can never be given, which fails closed.'
  combined: 'Check `role` in the decision endpoint against `auth.caller.roles`. On a `public` endpoint
    admit a caller only on a role match, on membership in an approver list from the tool''s own policy,
    or when `auth.threadAccess` is true; never on a non-null caller alone. For `min_approvers`, write
    each approval under its own key (digest, round and `auth.caller.id`) and a rejection as an idempotent
    flag, with an index key whose lost update can only under-count: the store has no compare-and-set and
    cannot list keys, and the text does not say that endpoint requests on one thread are serialized. The
    tool, which runs inside the thread''s single flow, counts distinct ids for the same digest. `label`
    may display the role but grants nothing. `kind: human` cannot be attested (approval-22).'
  see_also:
