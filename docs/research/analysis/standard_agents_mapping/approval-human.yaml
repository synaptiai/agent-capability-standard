      context when the thread is not executing)'
    quote: the thread remains addressable, and a later message starts a **new session with history intact**.
  explanation: 'SA has no decision identifier and no notion of consuming a result; its lifecycle points
    the other way, since a finished child can be messaged again and return another result. Single use
    can be claimed for model-driven calls: ''Tool calls **MUST** execute sequentially in the returned
    order.'', and a thread runs one flow. It cannot be claimed for a call that an endpoint, effect or
    hook starts through `invokeTool` while a flow is running; neither the text nor the published types
    say how such a call is ordered. The store has no compare-and-set, and durability before `setValue`
    resolves is SHOULD-level. Searched: nonce, replay, ''used before'', ''at most one'' (content/0.2.0;
    the last occurs only for stream tickets and unrelated rules).'
  combined: 'Store each decision under a per-request key and give it a `decision_id`. The tool marks the
    id consumed in the acting thread''s key-value store before acting and refuses a consumed id: at most
    once, even if the write is lost. Make decision writes idempotent and let the reader prefer a rejection
    over an approval for the same request. Do not invoke gated tools from endpoints, effects or hooks;
    calls started there are outside the guarantee. After a final decision, `terminate()` a gate child
    so that it takes no further messages (''Rejects future `queueMessage()` and execution attempts'').
    Use one gate instance per request; do not set `maxInstances: 1`.'
