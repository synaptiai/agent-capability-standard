- id: approval-05
  relation: partial
  acs:
    concept: '`approval.mode`: `in_session` (default) or `out_of_band`'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval, example (line 809) and field table (line 820)
    - core/src/validate/approval.rs line 110 (the two accepted values)
    - schemas/workflow_catalog.schema.json line 438 and schemas/world_state_schema.yaml lines 398-402
      (enums)
    - core/src/exec/machine.rs lines 758-762, 1013, 2150 (default `in_session`; passed to the host and
      recorded)
    - docs/guides/ORCHESTRATION_EXTENSIONS.md line 312 (a comment in an example; informative guide)
    quote: '| `mode` | `in_session` (default) or `out_of_band` |'
  sa:
    concept: Human side on the acting thread (the chat surface) versus a human-backed child thread
    refs:
    - content/0.2.0/specification/agents.md §1.3 Derivations (line 63)
    - content/0.2.0/specification/agents.md §7 (line 171)
    - 'content/0.2.0/specification/threads/execution-state.md §3 Controlling Execution (line 61), §4.2
      Reasons (line 113: `awaiting_human`, `forced_human_turn`)'
    - content/0.2.0/specification/threads/messages.md §4 Queueing Messages (lines 164-167)
    - content/0.2.0/specification/threads.md §3.1 Queuing Tools (line 258)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2599-2607 (forcing a human-backed side parks execution),
      3021 (queueTool)'
    quote: '- **Chat surface** — the primary conversational interface renders wherever a `human` backing
      is. A human on side A is legal.'
  explanation: 'ACS lists the two values and does not define them: they occur only in the §5.14 example
    and field table, a guide comment, the schema enums, the validator''s enum and the executor''s default
    and record. SA has both shapes structurally without naming the distinction: a human side on the acting
    thread, and a human-backed child thread. Because ACS gives the values no meaning, enforcement must
    not branch on them; reading them as acting thread versus separate thread is an inference on both sides.
    SA also lets code hand the turn to a human side (`state.execution.forceTurn`, reason code `forced_human_turn`);
    the reply is still an unattributed message. Searched: in_session, out_of_band (ACS spec/, docs/guides/,
    schemas/, core/src, grounded_agency/*.py).'
  combined: 'Use one mechanism for both modes: the pending record and decision endpoint on the acting
    thread (approval-19); an approver outside the conversation can call the same endpoint. Record `mode`
    on the action record and let it choose presentation only: whether a human-backed child is shown, and
    who is notified. After a decision the endpoint wakes the thread with `state.queueMessage` (''If the
    thread is idle, queueing forces a new turn.''); the model then has to repeat the call with the same
    arguments. Re-entry with `state.queueTool` is optional and under-specified: which side the tool runs
    as, and whether the model then gets a turn to see the result, are not stated. A free-text chat reply
    never counts as a decision (identity-01).'
- id: approval-06
  relation: partial
  acs:
    concept: '`shows` and `binds_to: digest`: the decision binds to the SHA-256 digest of the RFC 8785
      canonical JSON of the shown I-JSON values'
    refs:
    - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 821-822, 828-833)
    - core/src/exec/machine.rs lines 716-736 (what is digested; default when `shows` is absent; what a
      re-ask appends)
    - core/src/exec/canonical.rs lines 93-101 (lowercase hex SHA-256 of canonical JSON), lines 119-126
      (case-insensitive comparison)
    - schemas/world_state_schema.yaml line 383
    quote: JSON (RFC 8785). A decision is valid only if the SHA-256 digest of the
  sa:
    concept: 'Durable copies of what was asked: the acting thread''s key-value store, and a child''s `subagent_create.arguments`
      (validated, persisted for the life of the child thread, read-only on `ThreadState.arguments`)'
    refs:
    - content/0.2.0/specification/subagents.md §5.1 Persistent Invocation Arguments (lines 167-175), §3.3
      Blocking and Create-or-Continue (line 110)
    - content/0.2.0/specification/threads.md §6.1 Thread Arguments (lines 354-360), §9 (line 510)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' §14.1 items 2 and 4 (lines 351,
      353)
    - '@standardagents/spec 0.45.10 index.d.ts line 263 (ToolArgsNode: the node types an argument schema
      may use)'
    quote: '- runtimes **MUST** validate them against the schema and persist the validated arguments for
      the life of the child thread.'
  explanation: 'SA offers durable copies of what was asked but no digest, no canonical form and no link
    between an answer and what was shown. ACS says the digest is of the ''canonical JSON of the shown
    values''; that the digested value is the array of resolved `shows` values, what is used when `shows`
    is absent and what a re-ask appends are in the reference executor only (ACS gap). The digest is reproducible
    outside the core: a short JavaScript canonicaliser matched the reference executor for two shown arrays,
    one with non-ASCII text, `-0`, `1e21` and `0.000001`. SA names no platform API that tool code may
    rely on, so WebCrypto cannot be assumed. Searched: digest, sha-256, sha256, canonical, hash, nonce
    (content/0.2.0; `digest` and `canonical` occur only in unrelated senses).'
  combined: 'In tool code compute the lowercase-hex SHA-256 of the RFC 8785 canonical JSON of the shown
    array, with a bundled SHA-256 or a feature-detected WebCrypto that fails closed. Store the canonical
    text itself beside the digest: every verifier hashes that exact string and parses it only for display,
    so no re-serialisation is involved. Key the pending record and the decision by a request id the tool
    generates, with the digest as the bound content; two calls with equal arguments have equal digests.
    Before acting, recompute the digest from the actual arguments. If a child carries the request, declare
    every key in its `requiredSchema`, and never combine `blocking: true` with `maxInstances: 1`: create-or-continue
    would reuse a thread whose persisted arguments belong to an earlier request.'
  see_also:
