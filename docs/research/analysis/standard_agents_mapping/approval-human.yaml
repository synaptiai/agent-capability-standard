    decision with `auth.caller` after checking `state.agentId`, that this thread recorded the request,
    the digest, the expiry and the caller's admission (approval-04, approval-17). (3) On its next call
    with the same arguments the tool reads the decision on the same thread, re-checks digest, expiry,
    approver count and single use, marks it consumed, then rechecks, checkpoints and acts. Required role,
    approver count and expiry come from the tool's own configuration (approval-21), never from the decision
