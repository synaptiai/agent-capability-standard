  - approval-human#approval-13
  - approval-human#approval-19
  - evidence-audit-observability#store-01
  - workflow-execution#wf-09
  - multi-agent#coord-19
  - packaging-conformance-governance#pkg-03
  - models-context-memory-security#isolation-01
  - models-context-memory-security#remember-02
- id: state-05
  relation: acs_only
  acs:
    concept: '`checkpoint` capability: save state for potential recovery (`scope`, `label`, `metadata`
      in; `checkpoint_id`, `timestamp`, `size` out). The Standard and the ontology do not define the saved
      content; the reference skill does'
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms, Checkpoint (line 64)
    - schemas/capability_ontology.yaml nodes[id=checkpoint] (lines 1211-1246)
    - skills/checkpoint/SKILL.md Procedure (lines 76-102), Output Contract (lines 108-125), capability-specific
      rules (lines 246-252)
    - docs/guides/RUNNING_WORKFLOWS.md Actions and responses, CreateCheckpoint (line 86)
    - core/src/exec/machine.rs checkpoint output handling (lines 1464-1484)
    - grounded_agency/state/checkpoint_tracker.py Checkpoint dataclass (lines 40-56)
    - grounded_agency/adapter.py wrap_options (lines 306, 403)
    - spec/SECURITY.md §8.2 (line 383), §9.1 (line 400)
    quote: '| **Checkpoint** | A saved state that enables rollback |'
  sa:
    concept: No snapshot primitive; a userland copy built from `ThreadState` file and key-value methods
    refs:
    - content/0.2.0 (whole tree searched; terms in the explanation)
    - content/0.2.0/specification/threads.md §1.2.2 File System table (lines 67-82; quote at line 71),
      Effect Scheduling table (lines 122-128)
    - content/0.2.0/specification/threads/filesystem.md §2-§6 (lines 23-124), §9.4 item 2 (line 175)
    - content/0.2.0/specification/effects.md §3 (line 87)
    - content/0.2.0/distribution/packaging.md intro (line 3)
    quote: '| `writeFile(path, data, mimeType, options?)` | `Promise<FileRecord>` | Write file |'
  explanation: 'SA 0.2.0 defines no snapshot, versioning, copy-on-write or backup of thread state. On
    the ACS side the normative layer is thin: the ontology input is a free-text `scope` and the executor
    tracks an id and a validity flag. The reference checkpoint skill does define content (mechanism types,
    a manifest, hashes, `scope.files`, `scope.state_keys`, `restore_command`, `expiry`), in git and project-directory
    terms; the Python tracker stores metadata only, and the SDK adapter leaves file capture to the Claude
    Agent SDK (`enable_file_checkpointing`), for which SA has no host equivalent. Searched: checkpoint,
    backup, copy-on-write, copyFile, immutable, snapshot, restor (content/0.2.0, src/data, README.md,
    published types). ''snapshot'' names only message-history, registry, status, report and identity snapshots;
    ''restor'' concerns thread arguments and sockets; ''immutable'' has one unrelated type comment.'
  combined: 'A `checkpoint` function tool mirroring the skill''s `file_backup` type. Scope it to the paths
    the next gated call names and exclude the binding''s own directory. For each file: `statFile`, `readFile`,
    create parents, `writeFile` the copy under `/<pkg>/checkpoints/<id>/`, `statFile` the copy and compare
    sizes, and compute SHA-256 with a bundled implementation. Copy named keys with `getValue`; call `getScheduledEffects()`
    in try/catch (it is SHOULD-level); write the manifest last with `setValue`. Return `checkpoint_id`,
    `timestamp`, `size`, `type`, `scope.files`, `scope.state_keys`, `pre_mutation_state.hash`, `expiry`,
    `evidence_anchors`. Not guaranteed: durability of the copies (no MUST for files), atomicity, capacity,
    and anything outside the listed files and keys of this thread. Environment values and child threads
    cannot be captured; messages can be read but not faithfully restored.'
  see_also:
  - safety-enforcement#ckpt-01
- id: state-06
  relation: acs_only
  acs:
    concept: '`rollback` capability and the `rollback` gate and failure-mode actions (F503 when it cannot
      be done)'
    refs:
    - schemas/capability_ontology.yaml nodes[id=rollback] (lines 1247-1278), edge rollback specializes
      mutate (lines 2101-2104)
    - spec/STANDARD-v1.1.0.md §5.6 Gate Semantics (lines 389-392), §5.12 runtime table (lines 678-683;
      quote at line 681), §9.6 F503 (line 1323)
    - grounded_agency/workflows/runner.py Host.rollback (lines 93-96)
    - core/src/exec/machine.rs rollback (lines 644-661)
    - skills/rollback/SKILL.md Procedure steps 3-4 (lines 93-103), Output Contract (lines 115-139), Safety
      Constraints (lines 262-275)
    - grounded_agency/hooks/skill_tracker.py (lines 111-114)
    quote: '| `rollback` | Roll back to the latest checkpoint; with none, or if the host fails it, the
      run ends F503 |'
  sa:
    concept: No rollback or undo; the handler error rule is the only statement that uses the word
    refs:
    - content/0.2.0/specification/handlers.md §5 Error Semantics (lines 69-77; quote at line 74)
    - content/0.2.0/specification/threads.md §4.3 Managing Scheduled Effects (lines 312-322), §8 Lifecycle
      (lines 467-478)
    - content/0.2.0/specification/threads/filesystem.md §5 constraint 2 (lines 101-103)
    - content/0.2.0/specification/threads/messages.md §6 Deleting Messages (lines 180-186)
    - content/0.2.0/specification/effects.md §3 (line 87)
    quote: '- The inbound message stays persisted. Nothing is rolled back.'
  explanation: 'The quoted sentence is the only rollback vocabulary in SA 0.2.0. It describes what the
    runtime does when a handler throws; it does not forbid a tool from restoring files it saved, so there
    is no conflict. SA defines no undo of file writes, key-value writes, environment changes, messages
    or executed effects. ACS specifies the outcome codes but not the restoration: the reference `Host.rollback`
    raises `NotImplementedError("no rollback")`, so a restoring tool goes beyond the reference host. The
    ontology output has `restored`, `previous_state` and `restored_state`; the rollback skill adds `changes_reverted[]`,
    `verification.match` and `warnings[]`. The skill refuses an expired checkpoint, while the executor
    rolls back to the latest checkpoint whatever its validity; a binding has to choose. Searched: rollback,
    rolled back, roll back, undo, revert, restor, transaction, compensat, backup.'
  combined: 'A `rollback` function tool: load the manifest (missing: an F503 error result). For each entry:
    `statFile`, `unlinkFile` if present, `writeFile` from the copy, then `statFile` and a digest check.
    Delete only paths that the binding''s own journal records as created by a gated call after the checkpoint,
    never by listing a scope, because the tree also holds attachments the runtime stored. Cancel only
    effect ids the binding recorded when it scheduled them, in try/catch. Return `restored: true` only
    when every entry verified; otherwise return an F503 error result with per-file outcomes in `changes_reverted`
    and `warnings`, and keep the checkpoint so the call can be repeated. Afterwards leave the record''s
    validity as it was: in the reference executor a rollback neither consumes nor invalidates a checkpoint
    (safety-enforcement#ckpt-02). Always list what was not restored: effects that ran, external calls,
    environment values, child threads, messages.'
  see_also:
  - published-api-extension-points#thread-03
  - safety-enforcement#ckpt-02
  - safety-enforcement#ckpt-03
  - workflow-execution#wf-08
