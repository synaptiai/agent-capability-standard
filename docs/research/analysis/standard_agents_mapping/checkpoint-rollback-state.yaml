- id: state-09
  relation: fits
  acs:
    concept: Single-use checkpoints and the reservation that prevents two concurrent tool calls sharing
      one
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md What the executor enforces, Checkpoints (lines 145-148; quote at
      line 145)
    - core/src/exec/machine.rs checkpoint() (lines 663-677), retry reuse (lines 1389-1391)
    - grounded_agency/state/checkpoint_tracker.py validate_and_reserve (lines 547-598), consume_checkpoint
      (lines 662-708)
    - docs/integrations/claude_agent_sdk.md PreToolUse Hook Enforcement (lines 272-274)
    - spec/STANDARD-v1.1.0.md §10.3 (lines 1427-1431)
    quote: '- **Checkpoints.** One checkpoint authorises one step that requires one,'
  sa:
    concept: Sequential tool execution and one flow per thread
    refs:
    - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (lines 27-38), §3 Step Cycle (lines
      42-50), §5.1 Ordering (line 88), §11 Concurrency (line 239)
    - content/0.2.0/specification/handlers.md §4 Delivery Semantics (line 62)
    - content/0.2.0/specification/threads.md §4 Effect Scheduling (line 277)
    - content/0.2.0/specification/threads/endpoints.md §5 Endpoint Context (lines 107-119)
    - content/0.2.0/specification/users.md §2.1 Serialization (lines 77-80), §2.2 Reaching Threads (lines
      82-88) (Draft page)
    - content/0.2.0/specification/prompts.md §1 `parallelToolCalls` (lines 28, 38)
    - '@standardagents/spec 0.45.10 index.d.ts line 3033 (invokeTool)'
    quote: A single thread **MUST NOT** execute multiple concurrent flows. Cross-thread concurrency is
      allowed.
  explanation: 'The ACS Python tracker reserves a checkpoint so that two concurrent tool calls cannot
    both proceed on it. For the tool calls a model returns, SA removes that race: they MUST execute sequentially,
    and a thread MUST NOT run concurrent flows. Not covered by any sentence found: tool invocations started
    concurrently by code (`Promise.all` over `state.invokeTool` type-checks against the published types),
    thread endpoint handlers, effects (which ''Run **independently** of the conversation flow''), another
    thread''s handle, and Draft `UserState.thread()`. The store has no compare-and-set. Single use is
    itself reference behaviour (the guide and an informative fixture), and the ACS references consume
    at different moments: the executor before the step runs, a retry reusing the checkpoint; the SDK adapter
    after a successful mutation, releasing on failure. Searched: concurren, parallel, serializ, lock,
    mutex, atomic, compare-and.'
  combined: 'Consume before acting, as the reference executor does: read the record, write it back with
    `consumed_at` set, then act. This fails safe if the process dies in between. Claim single use only
    for model-issued tool calls on one thread; it is not guaranteed against concurrent `invokeTool` calls
    made by code, endpoint handlers, effects or another thread''s handle. The binding''s own tools, hooks
    and handlers must not invoke gated tools concurrently, and must not write the binding''s keys from
    endpoint handlers or effects. The binding relies on the Runtime MUST for sequential execution, not
    on the prompt option `parallelToolCalls`, whose table text reads ''Allow parallel tool execution''.'
  see_also:
