# Checkpoints, rollback, state and memory
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: checkpoint-rollback-state
title: Checkpoints, rollback, state and memory
changes_in_1_2_0:
- row: state-01
  sections: '§4.5, §6.7'
  effect: '`persist` gains `scope`, a `ttl` grammar, `stored_at` and `expires_at`, with host guarantees; a
    `persist` of a secret is refused.'
- row: state-02
  sections: '§4.5'
  effect: '`recall` gains `scope` in its input and output.'
- row: state-03
  sections: '§4.4.1'
  effect: 'A checkpoint is a host-kept copy of the state within its scope and reports what it `captured`
    and `excluded`.'
- row: state-04
  sections: '§5.2.2, §4.4.1'
  effect: 'Checkpoint use is stated, and the checkpoint output gains `mechanism`, `captured`, `excluded`,
    `digest` and `expires_at`.'
- row: state-05
  sections: '§2, §4.4.1'
  effect: 'The term checkpoint is redefined as a host-kept copy of the state within its scope, and the
    capability''s outputs are extended.'
- row: state-06
  sections: '§4.4.1'
  effect: '`restored` is true only on a full restore, `unrestored` and `not_covered` report the rest, and
    `RolledBack` answers only a full restore (else F503).'
- row: state-07
  sections: '§5.2.2, §5.18.6, §10.4'
  effect: 'Where the rule is enforced is now stated for executors and for safety layers over calls.'
- row: state-08
  sections: '§5.2.2, §4.4.1'
  effect: 'Validity ends at the end of a wait or delay and at a resumption; retention is separate from
    validity, and `expires_at` is reported.'
- row: state-09
  sections: '§5.18.6'
  effect: 'One checkpoint per gated call is stated for safety layers.'
- row: state-11
  sections: '§4.5, §4.4.1'
  effect: '`persist` and `recall` have a `scope`, and a checkpoint''s scope bounds what it captures.'
- row: state-12
  sections: '§5.15.4'
  effect: 'A run''s checkpoints never authorise a delegate''s changes, except in a safety layer''s shared
    scope.'
- row: state-13
  sections: '§4.5'
  effect: 'Memory scopes, lifetimes and host guarantees are defined.'
- row: state-15
  sections: '§5.19.4'
  effect: 'Saving and continuing a run is specified: one writer, save before acting, state integrity, and
    a key where others can change stored states.'
- row: state-16
  sections: '§3.3, §4.4.2, §12.1'
  effect: 'A `send` checkpoint restores the agent''s own state, not the transmission; `send` reports
    `compensation`.'
- row: state-17
  sections: '§6.3, §4.4.1'
  effect: '`retention_policy` applies to the store the records are written to, `audit.retention` is a
    duration, and checkpoint retention is separate from validity.'
- row: state-19
  sections: '§6.4, §4.4.1'
  effect: 'Audit records are specified, the status `cancelled` is added, and a rollback never restores
    records.'
- row: state-20
  sections: '§5.2.2'
  effect: 'With no valid checkpoint, the executor has its host take one, and F501 if that fails.'
- row: state-21
  sections: '§4.3'
  effect: '`conflicts_with` applies within one `parallel_group`; a host should serialise a rollback with
    `mutate` and `persist` on the same state.'
- row: state-22
  sections: '§5.21.3'
  effect: '`checkpoint_policy` keys are `*` or capability ids, and a profile''s policy raises
    `requires_checkpoint` by risk (F501).'
- row: state-23
  sections: '§4.4.1, §5.19.7'
  effect: 'An incomplete rollback is F503, and error reasons are defined.'
- row: state-24
  sections: '§6.7, §4.4.1'
  effect: 'Secrets never enter persisted memory or records, and a checkpoint reports what it `excluded`.'
- row: state-26
  sections: '§4.4.1'
  effect: 'A rollback never restores the record of what happened.'
rows:
- id: state-01
  relation: partial
  acs:
    concept: '`persist` capability (REMEMBER layer): store data durably. `data` is the only required input;
      `key` and `ttl` are optional'
    refs:
    - schemas/capability_ontology.yaml nodes[id=persist] (lines 1376-1410; quote at line 1378)
    - schemas/capability_ontology.yaml edges persist enables recall (lines 1799-1801), mutate enables
      persist (lines 1814-1817)
    - spec/STANDARD-v1.1.0.md §4.2 Layers, REMEMBER row (line 142), §5.10.1 Durations (lines 597-605)
    - skills/persist/SKILL.md Inputs (lines 74-78), Procedure step 8 (line 120), Output Contract (line
      130)
    quote: 'description: Store data durably'
  sa:
    concept: 'Thread durable key-value store: `ThreadState.setValue(key, value)`'
    refs:
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-445)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 items 1-9 and §14.2 (lines 344-362; quote at line 350)
    - content/0.2.0/specification/effects.md §3 Execution Semantics (lines 83-90)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3153-3167 (ThreadState.setValue), 258-263 (ToolArgsNode)'
    quote: Values **MUST** be persisted to durable per-thread storage that survives execution boundaries,
      process restarts, and runtime redeploys.
  explanation: 'SA supplies the storage half of `persist` with normative force: per-thread, JSON-equivalent
    values, durable across executions, restarts and redeploys (MUST), and visible to later reads on the
    same thread (MUST). Durability at the moment `setValue` resolves is SHOULD only (item 7), and runtimes
    MAY cap key length, value size and key count (§14.2). SA has no counterpart for `ttl` (thread values
    do not expire), for the output `timestamp` (values carry no metadata), for `evidence_anchors`, or
    for binary data (non-JSON values MAY be rejected). On the ACS side the contract is the ontology node
    alone: the Standard states no storage requirement, and `ttl` has no grammar. Searched: ttl, time to
    live, expir, expires_at (content/0.2.0 and the published types; only stream-ticket, room-challenge
    and grant-metadata hits).'
  combined: 'A `persist` function tool declares `data: z.unknown()` (`z.any()` is not an allowed tool-argument
    type in the published types), generates a key when none is given, and calls `await state.setValue(''<pkg>/persist/''
    + key, { v: data, stored_at, expires_at })`, where `<pkg>` is the package ID (a binding convention).
    It then reads the key back and returns `stored: true` only if the envelope is there: that is the MUST-level
    guarantee, and the persist skill''s verify step. A thrown `setValue` becomes an error result. For
    `ttl` the binding accepts the §5.10.1 duration grammar (its own choice), stores `expires_at`, and
    schedules a package effect that deletes the key if `expires_at` is unchanged. When that effect runs
    is not bounded, so `recall` also checks expiry.'
  see_also:
  - tools-contracts#cls-15
  - tools-contracts#rec-01
  - published-api-extension-points#thread-01
  - safety-enforcement#ckpt-02
  - approval-human#approval-13
  - evidence-audit-observability#store-01
  - workflow-execution#wf-09
  - models-context-memory-security#remember-01
- id: state-02
  relation: partial
  acs:
    concept: '`recall` capability: retrieve previously stored data by `key`, with `default`, `found` and
      `stored_at`'
    refs:
    - schemas/capability_ontology.yaml nodes[id=recall] (lines 1411-1442; quote at line 1413)
    - skills/recall/SKILL.md Procedure steps 1-2 (lines 36-44), Output Contract (lines 73-83)
    quote: 'description: Retrieve previously stored data'
  sa:
    concept: '`ThreadState.getValue(key)`'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Durable Key-Value Store table (lines 136-141),
      §7.2 Semantics (lines 424-433)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 items 2, 5, 6 (lines 351-355; quote at line 355)
    - content/0.2.0/specification/users.md §2 UserState, `listValues` (lines 54-57; Draft page)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3131-3152 (ThreadState.getValue), 3193-3211 (listUserValues)'
    quote: '`setValue(key, null)` and `setValue(key, undefined)` **MUST** delete the key so that subsequent
      `getValue(key)` calls return `null`.'
  explanation: '`getValue` is the lookup, with MUST-level visibility of earlier writes from tools, hooks
    and endpoints on the same thread. Two ACS outputs need help: `found` (SA returns `null` for a missing
    key, and because writing `null` deletes the key, a stored `null` cannot exist) and `stored_at` (thread
    values carry no metadata). The envelope written by `persist` (state-01) supplies both; `default` is
    applied by the tool. The thread store cannot be listed: the 0.2.0 text gives `ThreadState` only `getValue`
    and `setValue`; `listValues` exists on the Draft `UserState` and, in the published types only, as
    `ThreadState.listUserValues` for the user store. Exact-key lookup therefore cannot serve the ranked,
    query-style recall that the ACS recall skill describes.'
  combined: '`const e = await state.getValue(''<pkg>/persist/'' + key)`. Validate that `e` has the envelope
    shape before using it, because any definition code on the thread can write the same key; treat an
    entry whose `expires_at` has passed as missing and delete it. Return `{ data: found ? e.v : (args.default
    ?? null), found, stored_at, evidence_anchors }` as JSON in `ToolResult.result`. Store `null` data
    as `{ v: null }`, never as an absent member, so the required `data` output survives the JSON round
    trip.'
  see_also:
  - tools-contracts#cls-15
  - tools-contracts#rec-01
  - models-context-memory-security#remember-01
- id: state-03
  relation: partial
  acs:
    concept: 'Persistent state that is file-shaped: targets of `mutate`, large or binary `persist` data,
      checkpoint copies'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition, `mutation` field (line 121)
    - schemas/capability_ontology.yaml nodes[id=mutate] (lines 1095-1132)
    - hooks/hooks.json PreToolUse matcher (line 5)
    quote: '| `mutation` | boolean | No | Whether the capability changes persistent state (default false)
      |'
  sa:
    concept: 'Thread file system on `ThreadState`: writeFile, readFile, readFileStream, statFile, readdirFile,
      unlinkFile, mkdirFile, rmdirFile, moveFile, renameFile, findFiles, grepFiles, getFileStats'
    refs:
    - content/0.2.0/specification/threads/filesystem.md intro (line 3), §1 File Record (lines 7-21), §2
      Writing Files (lines 23-40), §5 Moving and Renaming (lines 78-107), §9.4 Behavior (lines 172-179)
    - content/0.2.0/specification/threads.md §1.2.2 File System table (lines 67-82), §7.3 Comparison With
      Other Storage (line 443), §11.3 Error Handling (lines 600-605), §12 TypeScript Reference (lines
      698-712)
    - content/0.2.0/specification/threads/client-api.md §12 item 4 (line 365), §14 Reading a File (lines
      383-395), §10 item 5 (line 296)
    - content/0.2.0/infrastructure/runtime.md §8 Cross-Thread Communication (lines 194, 201), §16 Conformance
      Summary (lines 384-392)
    - content/0.2.0/specification/subagents.md §7 Attachment Copying (lines 230-237)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2253-2287 (FileRecord, WriteFileOptions), 3250-3261
      (writeFile), 3340 and 3353 (moveFile, renameFile), 3367-3373 (findFiles)'
    quote: Each thread has an isolated file system for storing files, images, and other binary data. It
      is addressable through `ThreadState` and survives execution cycles — two separate invocations of
      the same thread see the same file tree.
  explanation: 'The API is sufficient as a mutation target and for large or binary data, but its guarantees
    are weaker than the key-value store''s. filesystem.md has one RFC 2119 sentence (chunk ordering, §9.4);
    durability and isolation are described, not required. Other pages bind runtimes for particular cases
    only: storing client attachments in the tree, copying attachments between threads, serving files to
    clients, deleting files with the thread. Not stated for the `ThreadState` methods: what `writeFile`
    does when the path exists (only `moveFile` is said not to overwrite), whether it creates parent directories,
    `unlinkFile` on a missing path, `mkdirFile` on an existing directory, the glob grammar of `findFiles`,
    and what `readFile` returns for external storage. `WriteFileOptions.metadata`, `FileRecord.createdAt`
    and `updatedAt` are in the published types only. Searched: overwrit, already exists, parent director,
    intermediate director, recursive, glob.'
  combined: 'Bind file-shaped persistence to `writeFile`, `readFile` and `statFile`, with defensive rules.
    Never rely on overwrite: `statFile`, `unlinkFile` if the path exists, then `writeFile`. Create parent
    directories with `mkdirFile` and tolerate an error for an existing one. After each write compare `statFile(path)?.size`
    with the bytes written and return an error result on a mismatch. Keep small values that a later step
    must be able to rely on (flags, ids, manifests) in the key-value store, which has MUST-level durability.
    State in the binding''s documentation that in 0.2.0 a file''s survival across executions is described
    but not required, that the tree is shared with attachments the runtime stores, and that clients can
    read it where the Thread Client API is exposed.'
- id: state-04
  relation: fits
  acs:
    concept: Checkpoint record that authorises a step whose effective `requires_checkpoint` is true
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88), §5.2.1 Safety Flags (lines 279-284),
      §12.5 example (line 1609)
    - schemas/capability_ontology.yaml mutate.input_schema.checkpoint_id (lines 1114-1116)
    - grounded_agency/state/checkpoint_tracker.py Checkpoint dataclass (lines 40-64), state file format
      (lines 165-173), marker file (lines 478-517), validate_and_reserve (lines 547-598), has_checkpoint_for_scope
      (lines 633-648)
    - hooks/pretooluse_require_checkpoint.sh marker contract (lines 13-19)
    - core/src/exec/machine.rs checkpoint() (lines 663-677), add_checkpoint (lines 1524-1527)
    - docs/guides/RUNNING_WORKFLOWS.md What the executor enforces, Checkpoints (lines 145-148)
    quote: '- A `checkpoint` MUST run before every `mutate`, `send` and `rollback` (the'
  sa:
    concept: Durable thread key-value store, read by a later tool call in the same thread
    refs:
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 items 1-3 (lines 350-352; quote at line 351), §14.2 (line 362)
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88), §5.2 Error Handling (line 92)
    - content/0.2.0/specification/threads.md §7 (line 410), §6.3 Context Limitations (lines 397-406)
    - content/0.2.0/distribution/packaging.md Portability requirements (lines 9-13)
    - content/0.2.0/specification/users.md §2.2 Reaching Threads (lines 82-88; Draft page)
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks, `after_thread_created` (line 23)
    quote: A value written by `setValue(key, value)` **MUST** be visible to every subsequent `getValue(key)`
      on the same thread, across any execution context (tools, hooks, endpoints).
  explanation: 'ACS requires that a checkpoint exist; its reference implementations keep the record in
    a JSON state file and a marker file. SA offers a portable place for the same record: the thread key-value
    store is the only key-addressed surface with MUST-level durability and read-after-write across tools,
    hooks and endpoints. The record is evidence against the model only. Any definition code holding the
    `ThreadState` can write the same key (tools, hooks, handlers, effects, endpoints, a child''s parent
    hooks, Draft `UserState.thread()`), and SA defines no key ownership. The gate proves that a record
    exists, not that the checkpoint covers the target; the ACS Python tracker likewise reserves without
    comparing scope. Refusing with F501 follows the ACS validator and hook; the reference executor instead
    asks the host for a checkpoint (state-20). Searched: namespace, prefix, reserved, valuePrefix.'
  combined: 'The checkpoint tool writes `{ checkpoint_id, scope, created_at, expires_at, flow_id, consumed_at
    }` under `<pkg>/checkpoint/active` and its manifest under `<pkg>/checkpoint/<id>`. A tool whose effective
    `requires_checkpoint` is true begins `execute` by reading the record. It accepts the ACS `mutate`
    input `checkpoint_id`, requires its target to be in that checkpoint''s manifest, refuses any path
    or key under the binding''s own prefix, and otherwise returns `{ status: ''error'', error: ''F501
    CHECKPOINT_REQUIRED: ...'' }`. Keep an index key, since the store cannot be listed, and prune it,
    since key count and value size may be capped. No initialisation is needed (`getValue` returns `null`
    for an unset key); initial keys, if wanted, belong in an `after_thread_created` hook.'
  see_also:
