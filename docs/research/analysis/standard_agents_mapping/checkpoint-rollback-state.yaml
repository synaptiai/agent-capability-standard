- id: state-10
  relation: partial
  acs:
    concept: Step outputs held under `store_as`, and `_recovery` context, for the life of a workflow run
    refs:
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition (lines 234-243; quote at line 240), §5.12 injected
      context (lines 655-658)
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 10-14)
    quote: '| `store_as` | string | Yes | Output identifier for later reference (missing: S304) |'
  sa:
    concept: '`ThreadState.context`: mutable per-execution scratch storage'
    refs:
    - content/0.2.0/specification/threads.md §6.2 Per-Execution Context (lines 372-395), §6.3 Context
      Limitations (lines 397-406; quote at line 402)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 154)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.2 (line 362)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3116-3130 (ThreadState.context)'
    quote: '| **Persistence** | Mutations are lost after execution ends |'
  explanation: 'Both carry values from one step or tool call to later ones. Their lifetimes differ: an
    ACS run can wait for hours and resume from a snapshot with its stores intact, while SA `context` lasts
    for one execution and is described without RFC 2119 keywords (the published type comment allows a
    runtime to rehydrate a value from another durable source). `context` can therefore back ACS stores
    only for a run that finishes inside one execution. The mapping matters only where an ACS executor
    holds `store_as` values, and no executor can run inside an SA tool today (state-15). In a model-driven
    loop the step outputs are the tool results, which the runtime MUST persist as messages, so nothing
    has to be bound.'
  combined: Keep stores that must survive a park in the key-value store (`setValue('<pkg>/run/<run_id>/stores',
    ...)`), subject to runtime-defined size caps; use `state.context` only as a per-execution cache of
    them.
- id: state-11
  relation: partial
  acs:
    concept: 'Storage scope of `persist`, `recall` and `checkpoint`: not modelled in the ontology (`key`
      and `scope` are free strings); the reference skills name memory stores (`session`, `project`, `global`)'
    refs:
    - schemas/capability_ontology.yaml checkpoint.input_schema.scope (lines 1221-1223), persist.input_schema
      (lines 1381-1394), recall.input_schema (lines 1416-1426)
    - skills/recall/SKILL.md Procedure step 2 (lines 41-44), capability-specific rules (line 298)
    - skills/persist/SKILL.md Procedure step 2 (lines 90-93)
    - skills/checkpoint/SKILL.md Output Contract, scope (lines 114-116)
    - schemas/world_state_schema.yaml meta.world_id (lines 454-456)
    quote: 'description: What to checkpoint'
  sa:
    concept: 'Scope tiers: thread invocation (`arguments`, read-only), execution (`context`), thread (key-value
      store, files, messages, thread environment), user (Draft), runtime instance (environment)'
    refs:
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-225), §6.1
      Thread Arguments (lines 354-355), §7.3 Comparison With Other Storage (lines 435-443; quote at line
      441), §7.4 Agent Skills (lines 447-465)
    - content/0.2.0/specification/users.md §2 UserState (lines 45-75; Draft page)
    - content/0.2.0/specification/threads/client-api.md §10 item 5 (line 296)
    quote: '| `getValue` / `setValue` | Thread | Durable | Small structured state scoped to the thread
      |'
  explanation: 'SA publishes a comparison of its storage surfaces by scope and persistence. ACS has scope
    vocabulary only in its reference skills: the recall skill names `session`, `project` and `global`
    memory stores and says to respect scope boundaries, and the persist skill selects a destination file.
    The ontology and the Standard give `persist` and `recall` no input by which a caller can ask for a
    scope, and a checkpoint''s `scope` is a free string. A binding therefore has to choose, and a wrong
    choice either loses data at the end of an execution or shares it more widely than intended. ACS `session`
    corresponds to SA thread scope; `project` and `global` have no frozen SA tier for key-addressed values
    (the Draft user scope is the nearest; `state.skills` holds Agent Skills folders, state-27).'
  combined: 'Default `persist`, `recall` and checkpoint records to thread scope: it is the only choice
    that rests on frozen, MUST-level SA text, and it ends with the thread. Use `context` for nothing that
    must last, and do not treat `arguments` as a store (it is read-only). Use the user scope only on runtimes
    that implement the Draft Users page (state-13). Report the scope used in each tool result.'
