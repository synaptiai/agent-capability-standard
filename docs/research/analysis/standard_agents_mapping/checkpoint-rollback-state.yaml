- id: state-08
  relation: partial
  acs:
    concept: 'Checkpoint validity over time: a wait or delay invalidates earlier checkpoints (W608); the
      reference tracker expires them after 30 minutes'
    refs:
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 777-790; quote at line 780), Delays (lines
      792-800), §9.7 W608 (line 1338)
    - core/src/exec/machine.rs invalidate_checkpoints (lines 865-884), end of a delay (lines 2124-2126)
    - grounded_agency/state/checkpoint_tracker.py DEFAULT_EXPIRY_MINUTES (line 176), Checkpoint.is_valid
      (lines 58-64)
    - docs/guides/RUNNING_WORKFLOWS.md Checkpoints (lines 145-148)
    quote: checkpoint taken before it no longer authorises the step. Take a new
  sa:
    concept: 'Execution boundary: `execution.flowId`, per-execution `context`, key-value lifetime equal
      to the thread''s'
    refs:
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (lines 21-32; quote
      at line 23), §4.1 States (lines 91-103)
    - content/0.2.0/specification/hooks.md §2.2 Execution State (line 144)
    - content/0.2.0/specification/threads.md §1.3 Access Contexts (lines 180-186), §6.2 (line 390), §6.3
      (lines 397-404), §7.2 Persistence row (line 429)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2579-2580 (ExecutionState.flowId), 3022-3033 (invokeTool),
      3116-3130 (context)'
    quote: '| `flowId` | `string` | Unique execution ID |'
  explanation: 'ACS invalidates checkpoints when a wait or delay ends, because ''a wait can last hours
    and the run may resume elsewhere''. SA has no wait step, but it has execution boundaries: a run settles
    as `idle` when the turn passes to a human-backed side, and a later message starts a new execution.
    Key-value values outlive that boundary, so a stored record stays valid across a park unless the binding
    bounds it. `flowId` could tie a record to one execution, but the text describes it only in table cells.
    It does not say that a later execution always gets a different id, or whether a sub-prompt, a handoff,
    a queued tool or `invokeTool` from an endpoint shares the caller''s. `context` is likewise descriptive,
    may be seeded by the runtime, and is writable by every tool and hook. Neither is backed by an RFC
    2119 sentence.'
  combined: 'Publish a short `expires_at` (a few minutes) as the validity rule the binding guarantees.
    Store `flow_id: state.execution?.flowId` as an additional check that fails closed (it can refuse a
    valid call, never admit a stale one), and say that it rests on behaviour the specification does not
    define. Do not present a `context` token as equivalent. ACS `mutate` and `send` also require approval,
    and a person''s answer arrives as a new execution, so the order inside one execution is approval,
    then checkpoint, then the gated call, which is the reference executor''s order. Evaluate the gate
    when a deferred action is scheduled, not inside the effect handler, where `state.execution` is not
    specified. Checkpoint-on-write (state-20) has no validity window.'
