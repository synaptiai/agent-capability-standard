- id: state-25
  relation: sa_only
  acs:
    concept: 'No counterpart: ACS classifies state changes by capability (`mutation`, `requires_checkpoint`)
      and has no category for a write the host performs on its own'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition, `mutation` and `requires_checkpoint` fields
      (lines 121-122; quote at line 122), §5.2.1 (line 279)
    quote: '| `requires_checkpoint` | boolean | No | A checkpoint must precede each use (default false)
      |'
  sa:
    concept: Writes the runtime performs in the thread file tree without any package tool (client message
      attachments, tool-result attachments, attachments copied from a child), and provider-executed tools,
      which have no local `execute`
    refs:
    - content/0.2.0/specification/threads/client-api.md §12 item 4 (line 365)
    - content/0.2.0/infrastructure/runtime.md §8.1-§8.2 (lines 191-201; quote at line 201)
    - content/0.2.0/specification/subagents.md §7 Attachment Copying (lines 230-237)
    - content/0.2.0/specification/hooks.md §6.3 HookToolResult (line 490)
    - content/0.2.0/specification/models.md §1 `providerTools` (line 34)
    - '@standardagents/spec 0.45.10 index.d.ts lines 239-247 (ToolResult.attachments), 438-443 (executionMode)'
    quote: '- payload attachments **MUST** be copied child filesystem -> parent filesystem'
  explanation: 'An SA runtime changes a thread''s file tree on its own account. It MUST store each attachment
    of a client message in the thread''s file system; it stores new attachments returned by any tool (a
    published type comment places them under `/attachments/`; the 0.2.0 text does not name the directory);
    and it MUST copy attachments from a child''s file system into the parent''s when the child reports.
    None of these passes through a package tool, so no checkpoint gate sees them. Provider-embedded tools
    are a further path: by the published types they are executed by the model provider, with no local
    `execute` to wrap. ACS has no category for host-initiated writes; its flags describe capabilities
    invoked as steps.'
  combined: 'Treat runtime-written files as outside the checkpoint contract. Exclude them from every checkpoint
    scope, never delete or overwrite them in `rollback` (state-06 deletes only what the binding''s journal
    recorded), and list them as not covered in the `rollback` result. Record in the binding''s documentation
    the paths that never reach the gate: runtime-stored attachments, provider-embedded tools, other tools
    on the prompt, and any hook, handler, effect or endpoint that holds the `ThreadState`. An agent that
    needs every change gated should not offer provider-embedded tools.'
  see_also:
  - tools-contracts#cls-03
  - tools-contracts#cls-07
  - tools-contracts#cls-08
  - tools-contracts#cls-14
  - tools-contracts#eff-01
  - published-api-extension-points#tools-06
  - safety-enforcement#surface-01
  - approval-human#approval-15
  - approval-human#approval-16
  - multi-agent#coord-20
  - packaging-conformance-governance#pkg-03
- id: state-26
  relation: fits
  acs:
    concept: 'What a rollback leaves in the record: action status `rolled_back` and an audit trail of
      what was reverted. The Standard does not say whether a rollback covers the conversation'
    refs:
    - schemas/world_state_schema.yaml ActionRecord.status (lines 355-364)
    - skills/rollback/SKILL.md capability-specific rules (lines 269-275; quote at line 274)
    - spec/STANDARD-v1.1.0.md §2 Terms, Checkpoint (line 64)
    quote: '- Preserve audit trail of what was reverted'
  sa:
    concept: Message metadata updates, message deletion and the request-context hook `filter_messages`
    refs:
    - content/0.2.0/specification/threads/messages.md §5 Updating Messages (lines 169-178), §6 Deleting
      Messages (lines 180-186)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-93), §3.2 filter_messages (lines
      217-231; quote at line 230), §3.4 (lines 291-306)
    - content/0.2.0/specification/threads/execution-state.md §2.2 Live execution history (lines 43-49)
    - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 17-24)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2134-2139 (MessageUpdates)'
    quote: '- Synthetic or transformed messages returned here **MUST** remain confined to the request
      context. They **MUST NOT** replace [`execution.messageHistory`](/0.2.0/specification/threads/execution-state#22-live-execution-history).'
  explanation: 'After a rollback the stored conversation still holds the tool results of the undone calls,
    and the model will read them as true. ACS asks that the audit trail of what was reverted be preserved,
    and its action record has a `rolled_back` status; it does not say whether the conversation is within
    a rollback''s reach. SA has two levers that keep the record while correcting what the model sees:
    `updateMessage(id, { metadata })` can tag a stored message without touching its content (metadata
    is merged, by the published type comment), and a `filter_messages` hook can annotate or hide tagged
    results in the request context only, on prompts whose hook set includes it. Deleting the messages
    would destroy the record. The `execute` signature shown in the text is `(state, args)`, with no tool-call
    id, so the messages to tag must be found by searching `execution.messageHistory`.'
  combined: 'Leave messages in place. The `rollback` result states, in plain words, which earlier results
    no longer describe the files (paths and the journal or checkpoint ids). Optionally tag the superseded
    tool-result messages by reading each message''s `metadata`, adding `''<pkg>'': { rolled_back_by: <checkpoint_id>
    }` and writing the whole object back with `updateMessage`, since only a published type comment says
    an update merges metadata (published-api-extension-points#hooks-03), and ship a `filter_messages`
    hook that prefixes tagged results with a notice; the hook is active only where a prompt or agent lists
    it. Never use `deleteMessage` for this.'
  see_also:
  - published-api-extension-points#drift-02
  - published-api-extension-points#hooks-03
  - published-api-extension-points#thread-03
  - safety-enforcement#ckpt-03
  - evidence-audit-observability#anchors-02
  - workflow-execution#wf-08
  - models-context-memory-security#context-04
- id: state-27
  relation: partial
  acs:
    concept: 'Durable, cross-session knowledge kept as files: ACS capabilities are Agent Skills (`skills/<name>/SKILL.md`
      with `name` and `description` frontmatter), and the persist skill writes learnings, decisions and
      patterns to project files'
    refs:
    - skills/persist/SKILL.md Intent (line 60), Procedure step 2 (lines 90-93)
    - skills/recall/SKILL.md frontmatter (lines 1-10), Procedure step 2 (lines 41-44)
    quote: Execute **persist** to write stable learnings, decisions, and patterns to durable storage for
      future recall and consistency.
  sa:
    concept: '`state.skills`: the thread owner''s server-side Agent Skills library (`list`, `get`, `readFile`,
      `install`, `setEnabled`, `remove`)'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Skills table (lines 161-170), §7.4 Agent Skills (lines
      447-465; quote at line 453)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1853-1880 (SkillsNamespace), 3232-3249 (ThreadState.skills)'
    quote: '- Skills are stored server-side and scoped to the calling principal. A principal''s private
      skills **MUST NOT** be visible to another principal.'
  explanation: '`state.skills` is the one cross-thread, principal-scoped store on the frozen Threads page,
    and it uses the Agent Skills format that ACS skills also use (a folder whose `SKILL.md` opens with
    `name` and `description` frontmatter). It is not a key-value memory: an entry is a validated skill
    folder, its identity comes from the frontmatter, installs and removals require mutation authorization,
    and runtimes SHOULD surface each enabled skill''s `name` and `description` in the agent''s ambient
    context. That makes it a counterpart for what the ACS persist skill does in a project (writing learnings
    to `CLAUDE.md` or a named file), and a place to install ACS skill documents, but not a store for `persist`
    keys or checkpoint records.'
  combined: 'Do not bind `persist`/`recall` keys to `state.skills`. Where an operator wants durable, model-visible
    guidance across threads, a tool may call `state.skills.install([{ path: ''SKILL.md'', content }])`
    with a skill whose frontmatter names it, expecting the call to fail without mutation authorization,
    and `recall` may read it with `state.skills.get(name)`. Treat anything installed this way as content
    the model will be shown.'
  see_also:
  - models-context-memory-security#remember-03
