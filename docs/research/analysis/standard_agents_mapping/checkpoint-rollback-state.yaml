      on tool calls not stated), and non-normative tool annotations
    refs:
    - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36), §3.3 note (line 273), §4.1
      before_create_message (lines 320-322), §5.1 tool_call_started (lines 367-384; quote at line 382),
      §5.4 (lines 414-421), §6.3 HookToolResult (lines 478-488)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §5.2 Error Handling (line 92),
      §7.3 `hidden` (line 143)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 44), §8 Annotations (lines 142-146)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 113-114)
    - content/0.2.0/specification/models.md §1 `providerTools` (line 34)
    - content/0.2.0/distribution/packaging.md Visibility Rules (line 230)
    - '@standardagents/spec 0.45.10 index.d.ts lines 225-236 (ToolResult.error_code, error_data), 438-443
      (executionMode)'
    quote: '- The return value **MUST** be ignored; the hook cannot modify the tool call.'
  explanation: 'No SA hook has a defined power to refuse a tool call. `tool_call_started` is observational
    and may see incomplete arguments. `before_create_message` runs before the assistant message carrying
    the calls is stored, but its effect on those calls is not stated. The other tool hooks run after execution.
    Annotations can label a tool, but they ''**MUST NOT** change argument validation, execution, the tool''s
    results, or what is sent to the model''. The one runtime-side refusal before `execute` is for an invocation
    target outside a `uses` list. The checkpoint record can therefore be checked only inside the gated
    tool''s own `execute`, which cannot be imposed on another package''s tools (internal tools are hidden
    from outside), on provider-embedded tools, or directly on runtime-injected lifecycle tools. Searched:
    before_tool, pre_tool, beforeTool, before_execute, veto.'
  combined: 'Wrap only tools whose effective `requires_checkpoint` is true (`mutate`, `send`, or a raised
    flag), never the checkpoint tool: `checkpoint`, `persist` and `audit` are mutations that need no checkpoint.
    On failure return `{ status: ''error'', error: ''F501 CHECKPOINT_REQUIRED: ...'' }`; the runtime MUST
    persist it and continue. Put the code in the `error` text, because `error_code` and `error_data` exist
    only in the published types. Carry the ACS classification as a descriptive annotation only. Publish
    the binding as cooperative: it covers locally executed tools written with the wrapper. A delegation
    that needs the gate can be declared `hidden` and spawned from a gated tool, provided every other relationship
    on that side is `hidden` too: with any visible one the lifecycle tools are injected, and the text
    does not say that they refuse a hidden relationship''s name (multi-agent#coord-20). Two caveats: `after_tool_call_failure`
    may replace the stored refusal, and `repeated_tool_error` is a listed `failed` reason with no defined
    trigger, so repeated refusals may end a run on some runtimes.'
