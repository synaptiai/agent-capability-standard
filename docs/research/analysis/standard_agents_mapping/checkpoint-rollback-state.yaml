- id: state-12
  relation: partial
  acs:
    concept: State shared between a workflow and what it invokes or delegates to (a nested `invoke` shares
      the caller's checkpoints)
    refs:
    - spec/STANDARD-v1.1.0.md §5.12 `invoke` (lines 659-672), §5.13 (lines 785-790; quote at line 788),
      §5.15 Delegation (from line 904)
    - docs/guides/RUNNING_WORKFLOWS.md Invocations (lines 230-236)
    quote: run it invokes shares the caller's checkpoints, so its waits invalidate
  sa:
    concept: 'Child thread isolation: key-value store neither shared nor copied; files isolated with attachments
      copied; thread environment propagates; parent and child `ThreadState` lookup'
    refs:
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 items 3 and 8 (lines 352, 357; quote at line 357)
    - content/0.2.0/infrastructure/runtime.md §7.4 Initial Payload Mapping (line 174), §8 Cross-Thread
      Communication (lines 189-211)
    - content/0.2.0/specification/threads.md §1.1 Agent Assignment (line 30), §2.3 setEnv (line 238),
      §6.1 Thread Arguments (lines 352-370), §7.2 (lines 428-433), §9 and §9.1 (lines 480-520)
    - content/0.2.0/specification/subagents.md intro (line 3), §5.1 (lines 167-175), §6.1 (line 189),
      §6.4 (lines 211-219), §7 Attachment Copying (lines 230-237)
    - content/0.2.0/specification/threads/execution-state.md §2.1 Prompt Path (lines 34-41)
    - content/0.2.0/specification/tools.md §3 Variable Declarations, `scoped` (lines 60-64)
    quote: Values **MUST NOT** be automatically copied, inherited, or synchronized between threads when
      subagents are spawned.
  explanation: A child thread does not see its parent's state. The key-value store is per thread and nothing
    is copied at spawn; the file system is isolated and referenced attachments are copied by value in
    each direction; creation arguments are validated and persisted on the child; thread environment values
    propagate to active descendants except names marked `scoped`. Either side can obtain the other's `ThreadState`,
    but whether the store may be used through that handle is contradictory (see the isolation gap). ACS's
    rule that an invoked run shares the caller's checkpoints fits a same-thread construct. A handoff is
    stated to stay in the thread; that a sub-prompt shares the caller's store, `flowId` and `context`
    is inference, since the text describes only `promptPath`. A parent's checkpoint does not cover a child's
    file system, and a child's returned attachments are written into the parent's tree by the runtime.
  combined: 'Treat same-thread constructs (a prompt used as a tool, `state.invokeTool`, a handoff) as
    an analogy for the shared checkpoint context of ACS `invoke`, not as a binding of `invoke`: running
    a nested workflow needs an ACS executor (state-15). Map `delegate` to a subagent relationship. A child
    built with this binding takes its own checkpoint in its own thread before it mutates. That cannot
    be required of a third-party child, for which the parent can only checkpoint its own tree before delegating
    and treat returned attachments as new files. If the parent''s `checkpoint_id` is passed, declare it
    in the child''s `requiredSchema`, since creation arguments are validated, and use it as a reference
    only, never as authorisation.'
