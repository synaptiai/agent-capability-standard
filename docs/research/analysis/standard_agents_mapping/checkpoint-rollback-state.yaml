- id: state-20
  relation: fits
  acs:
    concept: 'Checkpoint taken on demand: the reference executor asks the host for one (`CreateCheckpoint`)
      when no valid checkpoint exists, and the failure-mode action `pause_and_checkpoint` takes a new
      one; F501 only when the host cannot'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md Actions and responses, CreateCheckpoint (line 86); Checkpoints
      (lines 145-148; quote at line 147)
    - spec/STANDARD-v1.1.0.md §5.12 runtime table, `pause_and_checkpoint` (line 682)
    - core/src/exec/machine.rs checkpoint() (lines 663-677), checkpoint responses (lines 2041-2046)
    - tests/conformance/runtime/checkpoint_per_mutation.json, checkpoint_error.json, pause_and_checkpoint.json
    quote: is valid, the executor asks for a new one (`CreateCheckpoint`). A
  sa:
    concept: A restore point taken inside the gated tool's own `execute`, immediately before the write,
      recorded in the thread key-value store
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88), §5.2 Error Handling (line 92)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 item 2 (line 351)
    - content/0.2.0/specification/threads.md §1.2.2 File System table (lines 67-82), §7 (line 410)
    - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 17-24)
    quote: Tool calls **MUST** execute sequentially in the returned order.
  explanation: 'ACS has two responses to a missing checkpoint. The validator and the Claude Code hook
    refuse (F501, exit code 2). The reference executor takes one: it asks the host with `CreateCheckpoint`
    and raises F501 only if the host cannot. SA has no executor and no pre-execution hook, but a tool
    wrapper can play the host''s part: before a gated write it saves the one target file, or records that
    it did not exist, writes a journal entry to the thread store, then writes. This rests on the same
    MUSTs as the record gate of state-04 (read-after-write and sequential tool calls), needs no cooperation
    from the model, has no validity window, and costs in proportion to what changes. A wrapper of this
    shape type-checks against the published types. It restores single writes; a restore point spanning
    several calls still needs the explicit `checkpoint` tool.'
  combined: '`writeWithCheckpoint(state, path, data, mimeType)`: refuse paths under the binding''s prefix;
    read the journal counter; `statFile(path)`; if the file exists, `readFile` it and `writeFile` the
    copy to `/<pkg>/undo/<seq>`, comparing sizes; `setValue(''<pkg>/undo/<seq>'', { path, existed, copy,
    size, mimeType, at })` before the change; then `unlinkFile` if present and `writeFile`. Return the
    journal sequence as `checkpoint_id` in the `mutate` output. If the copy cannot be read or written,
    return an F501 error result and do not write. `rollback` replays journal entries in reverse (state-06).
    Prune old entries and copies, since storage may be capped.'
  see_also:
  - published-api-extension-points#thread-05
  - safety-enforcement#ckpt-01
  - safety-enforcement#ckpt-02
  - approval-human#approval-09
  - approval-human#approval-19
  - packaging-conformance-governance#pkg-03
- id: state-21
  relation: partial
  acs:
    concept: '`conflicts_with` edges rollback/persist and mutate/rollback (the pair may not share a `parallel_group`,
      F504); `alternative_to` persist/checkpoint'
    refs:
    - schemas/capability_ontology.yaml conflicts_with edges (lines 2021-2036; quote at line 2032), alternative_to
      edges (lines 2053-2060), constrain enables checkpoint (lines 1885-1888)
    - spec/STANDARD-v1.1.0.md §4.3 edge table (line 155), enforcement table (line 170), §9.6 F504 (line
      1324)
    quote: 'rationale: Cannot mutate during rollback operation'
  sa:
    concept: Sequential tool execution within one thread; cross-thread concurrency allowed
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88), §11 Concurrency (line 239)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153)
    quote: '- execute local tools sequentially in the order they were returned.'
  explanation: 'ACS forbids `rollback` to run concurrently with `mutate` or `persist`; in sequence they
    are allowed. Inside one SA thread the rule holds by construction for the tool calls a model returns,
    because they MUST execute sequentially and a thread MUST NOT run concurrent flows. It does not hold
    across threads: cross-thread concurrency is allowed, so a parent can roll back while a child mutates
    its own thread, which is harmless only because the child''s storage is separate (state-12). Nor is
    it stated for code that starts tool invocations concurrently, for effects, or for endpoint handlers
    (state-09). The `alternative_to` edge between `persist` and `checkpoint` matches the SA picture, where
    both are writes to the same two storage surfaces and differ only in purpose.'
  combined: Nothing to add inside one thread for model-issued calls. The binding's own code must not start
    a `rollback` concurrently with a gated tool or a `persist` (no `Promise.all` over `state.invokeTool`
    for these), and a `rollback` should not be scheduled as an effect. Across a delegation, a parent that
    rolls back its own thread does not roll back the child; say so in the `rollback` result.
  see_also:
  - safety-enforcement#edge-02
  - multi-agent#coord-13
- id: state-22
  relation: acs_only
  acs:
    concept: 'Domain-profile `checkpoint_policy`: free-form event keys mapped to `always`, `high_risk`,
      `medium_risk` or `never`'
    refs:
    - schemas/profiles/profile_schema.yaml required list (line 12), checkpoint_policy (lines 56-61; quote
      at line 58)
    - schemas/profiles/personal_assistant.yaml checkpoint_policy (lines 44-49)
    - tools/validate_profiles.py validate_checkpoint_policy (lines 175-199)
    quote: 'description: When to create checkpoints'
  sa:
    concept: None
    refs:
    - content/0.2.0 (whole tree searched; terms in the explanation)
  explanation: 'A domain profile must carry a `checkpoint_policy` whose keys are free-form event names
    (`before_send_message`, `before_purchase`) and whose values are `always`, `high_risk`, `medium_risk`
    or `never`. `tools/validate_profiles.py` checks the shape. No file under `grounded_agency/`, `core/`
    or `hooks/` reads the policy, and the term does not occur in spec/STANDARD-v1.1.0.md. SA has no counterpart:
    it has no profile document and no statement of when state should be saved. Searched: checkpoint, checkpoint_policy,
    policy (content/0.2.0, src/data, README.md; the ''policy'' hits are the thread access policy, credential-grant
    policy, parent teardown policy and request-context ''policy gates'').'
  combined: A binding may read a profile at build time and translate each policy key it understands into
    a wrapper decision (which tools take a restore point before writing). The keys are not capability
    ids, so the translation table is the binding's own and must be published with it. A profile value
    can add checkpoints; it cannot remove one the ontology requires.
  see_also:
  - models-context-memory-security#profile-03
- id: state-23
  relation: partial
  acs:
    concept: 'Failure of the safety operations themselves: a checkpoint the host cannot take ends the
      step F501; a rollback the host fails ends the run F503'
    refs:
    - spec/STANDARD-v1.1.0.md §5.12 runtime table (lines 681-682; quote at line 682), §9.5 R402 (line
      1311), §9.6 (lines 1321-1323)
    - core/src/exec/machine.rs (lines 2044-2046)
    - tests/conformance/runtime/checkpoint_error.json, rollback_error.json
    quote: '| `pause_and_checkpoint` | Take a new checkpoint; if the host fails it, the run ends F501
      |'
  sa:
    concept: 'Storage error contract: promise-returning methods SHOULD throw on storage errors; a capped
      `setValue` SHOULD reject; tool errors are persisted as results'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 File System table (lines 72-74), §11.3 Error Handling
      (lines 600-609)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 item 2 (line 351), §14.2 Capacity and Errors (line 362)
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    quote: Runtimes **MAY** enforce implementation-defined caps on key length, value size, and total number
      of keys per thread. When a cap is exceeded, `setValue` **SHOULD** reject with an error that identifies
      which limit was hit.
  explanation: 'ACS gives a failed checkpoint and a failed rollback their own codes, so a host must be
    able to tell that the save or the restore did not happen. SA lets a tool detect this only at SHOULD
    level: `ThreadState` methods that return promises SHOULD throw on storage errors, and a `setValue`
    that exceeds a runtime cap SHOULD reject with an error naming the limit. Nothing requires a failed
    `writeFile` to throw. What is MUST-level is the read side for the key-value store: a value read back
    after `setValue` is the value written (item 2). A tool error, once returned, MUST be persisted as
    a tool result and MUST NOT crash the loop.'
  combined: 'Wrap every storage call of the checkpoint and rollback tools in try/catch and verify by reading
    back: `getValue` after `setValue`, `statFile` and a size or digest comparison after `writeFile`. Map
    a failed or unverified save to an error result with `F501 CHECKPOINT_REQUIRED` and perform no write;
    map a failed or unverified restore to `F503 ROLLBACK_FAILED` with the per-file outcome. Map a capacity
    rejection of an ordinary `persist` to `R402 EXECUTION_FAILED` naming the limit. Never report `checkpoint_created`,
    `stored` or `restored` as true from a call that merely did not throw.'
  see_also:
  - published-api-extension-points#thread-03
  - safety-enforcement#ckpt-03
  - safety-enforcement#err-01
  - workflow-execution#wf-08
- id: state-24
  relation: fits
  acs:
    concept: 'Confidentiality of saved state: the checkpoint skill excludes sensitive files and keeps
      checkpoint metadata inside the workspace'
    refs:
    - skills/checkpoint/SKILL.md capability-specific rules (lines 246-252; quote at line 250)
    - skills/recall/SKILL.md capability-specific rules (line 297)
    - skills/persist/SKILL.md Procedure step 1 (line 87)
    quote: '- Do not checkpoint sensitive files (.env, credentials) - warn and exclude'
  sa:
    concept: 'Client reach into thread storage: the Thread Client API serves thread files and deletes
      messages; no client route is specified for the thread key-value store'
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope item 3 (line 11), §2 Routes (lines 18-35),
      §13 Deleting a Message (lines 372-381), §14 Reading a File (lines 383-395; quote at line 391)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.1 item 9 (line 358)
    - content/0.2.0/infrastructure/runtime.md §15 Thread Client API (lines 364-380)
    quote: 1. For a stored file, a successful request **MUST** return `200` with the file's bytes as the
      response body.
  explanation: ACS addresses exposure by saying what must not be saved; SA by saying who can read what
    is stored. Where a runtime exposes the Thread Client API, a caller with access to the thread can fetch
    any stored file by path and can delete individual messages. The route list contains no route for the
    thread key-value store, though a runtime MAY define further routes. Checkpoint copies and world-state
    snapshots written as thread files are therefore client-readable, and any file tool on the prompt can
    read them too. Key-value values are not required to be encrypted at rest (item 9).
  combined: 'Apply the skill''s exclusion rule in the checkpoint tool: skip paths that match a deny-list
    (`.env`, credential files) and report them as excluded in the result. Do not copy secrets into checkpoint
    files or manifests; reference environment values by name only. Assume everything under the binding''s
    directory is visible to the thread''s clients and to other tools on the prompt, and say so in the
    binding''s documentation. Keep small restore data that should not be served as a file in the key-value
    store.'
  see_also:
  - published-api-extension-points#consume-01
