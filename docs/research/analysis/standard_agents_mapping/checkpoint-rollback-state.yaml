- id: state-17
  relation: acs_only
  acs:
    concept: Retention of checkpoints, snapshots and audit records (`retention_policy`, `audit.retention`,
      tracker history and archive)
    refs:
    - schemas/world_state_schema.yaml retention_policy (lines 559-586)
    - schemas/capability_ontology.yaml audit.input_schema.retention (lines 1357-1359; quote at line 1359)
    - spec/STANDARD-v1.1.0.md §6.3 retention_policy row (line 1167)
    - grounded_agency/state/checkpoint_tracker.py history pruning and archive (lines 405-437)
    quote: 'description: How long to retain'
  sa:
    concept: Thread deletion and runtime-defined retention
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope items 1 and 6 (lines 9, 14), §10 Deleting
      a Thread (lines 275-300; quote at line 296), §13 Deleting a Message (lines 372-381)
    - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (lines 227-235), §15 Thread Client
      API (lines 364-380)
    - content/0.2.0/specification/subagents.md §4.1 (lines 116-124)
    - content/0.2.0/distribution/packaging.md Portability requirements (lines 21-25)
    quote: 5. The runtime **MUST** delete the messages, files, and stored values of every thread in the
      deletion set.
  explanation: 'Everything a binding keeps in thread scope (checkpoint copies, manifests, run snapshots,
    audit entries) disappears when the thread is deleted; deletion extends to every descendant thread
    and discards queued messages and scheduled effects. The deletion rule binds runtimes that expose the
    Thread Client API, which is a SHOULD; retention of idle threads is declared out of scope, and clients
    can also delete individual messages. ACS retention fields presuppose a store that keeps records: `observations.max_age`
    and `audit_logs.max_age` are durations, `snapshots` uses `max_count` and `keep_tagged`, and `audit.retention`
    is a free string. This is not a MUST-level conflict (`retention_policy` is optional in §6.3), but
    a retention promise cannot be met from thread storage alone.'
  combined: 'Keep recovery data (checkpoints, run snapshots) in thread scope, where its lifetime matches
    what it can restore. Export records that must outlive the thread synchronously inside the tool call,
    before returning success, to an external sink that the package declares as part of the agent''s purpose;
    use an effect only for retries, because a deferred export is discarded if the thread is deleted first.
    The Draft user scope is a weaker alternative (its values are not tamper-resistant, state-13). Report
    in the `audit` output which store was written and its lifetime: `thread`, `user (Draft)` or `external`.'
  see_also:
  - evidence-audit-observability#retention-01
  - workflow-execution#wf-27
  - models-context-memory-security#context-02
- id: state-18
  relation: fits
  acs:
    concept: '`execute` capability: run code deterministically, `mutation: false`, `requires_approval:
      true`'
    refs:
    - schemas/capability_ontology.yaml nodes[id=execute] (lines 1053-1094; quote at line 1055)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    quote: 'description: Run code or script deterministically'
  sa:
    concept: '`ThreadState.runCode` sandbox (where the runtime implements code execution): no ambient
      state; persistence only through bridged functions'
    refs:
    - content/0.2.0/specification/threads/code-execution.md §6.7 (lines 423-425), §6.8 Each Run Is Fresh
      (lines 427-429), §9 Interaction With Thread State (lines 450-468), §11 Security Considerations (lines
      548-555)
    - content/0.2.0/infrastructure/runtime.md 'Code Execution Runtime' (the first section numbered 14)
      §14.1 Isolation (lines 257-265), §14.3 Value Marshaling (line 279), §14.9 Conformance Checklist
      (line 323), §16 Conformance Summary (line 391)
    - content/0.2.0/specification/threads.md §12 TypeScript Reference (line 717)
    - '@standardagents/spec 0.45.10 index.d.ts line 3477 (runCode)'
    quote: Every call to `runCode` gets its own isolate. State — module caches, intrinsic mutations, top-level
      variables — does **not** carry over between runs. If you need persistence, write to thread storage
      through a bridged function.
  explanation: 'The sandbox cannot reach thread files, the key-value store or the network unless the calling
    tool bridges them in, and a runtime that implements code execution MUST create a fresh isolate per
    call. `runCode` is a conditional capability although `ThreadState` declares it without `?`: the conformance
    summary applies ''when `ThreadState.runCode` is exposed''. An `execute` bound to `runCode` with read-only
    bridges does not change thread state, which matches the ontology''s `mutation: false`; that is a property
    of the tool''s own bridge code, not of the sandbox. Once a write bridge is passed, the same call can
    change persistent state, and under §5.2.1 the step should declare stricter flags. `Date.now()` and
    `Math.random()` are nondeterministic inside the sandbox. `requires_approval: true` is left to the
    approval concern.'
  combined: Feature-detect `runCode` and return an error result when it is absent. Bridge a path-restricted
    reader that refuses the binding's directory and returns a string or a `Uint8Array` (the marshaling
    rule names typed arrays, not `ArrayBuffer`). If writes are bridged, bridge the checkpoint-on-write
    function of state-20, one restore point per write, instead of the single-use gate, which would fail
    on the second write of a run; classify the tool as `mutate`. Tie termination to `state.execution?.abortSignal`
    and, where the module environment has timers, a deadline. For determinism, bridge deterministic replacements
    through `globals`.
  see_also:
  - tools-contracts#cls-10
  - tools-contracts#cls-15
  - safety-enforcement#surface-01
  - evidence-audit-observability#exec-01
- id: state-19
  relation: partial
  acs:
    concept: 'Durable record of what was done: `ActionRecord` (status includes `rolled_back`), the `audit`
      capability, append-only observations'
    refs:
    - schemas/world_state_schema.yaml ActionRecord (lines 329-367), composition_contracts guarantees (lines
      599-604; quote at line 603)
    - schemas/capability_ontology.yaml nodes[id=audit] (lines 1336-1375)
    - hooks/README.md Audit Trail (lines 126-151)
    quote: '- Observations are append-only and grounded.'
  sa:
    concept: Tool results persisted as messages before the runtime advances; message update and delete
      APIs
    refs:
    - content/0.2.0/specification/tools.md §9 Conformance Notes (lines 148-156; quote at line 154)
    - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §5.2 Error Handling (lines
      90-92)
    - content/0.2.0/specification/threads/messages.md intro note (line 7), §5 Updating Messages and §6
      Deleting Messages (lines 169-186)
    - content/0.2.0/specification/threads/client-api.md §13 Deleting a Message (lines 372-381)
    - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 87-88), §5.2-§5.5 (lines 386-444)
    quote: '- persist tool results as messages before advancing.'
  explanation: 'SA guarantees that the result of every tool call, success or error, is persisted in thread
    history before the runtime advances. That is a durable, ordered record that the checkpoint, mutating
    and rollback tools ran and what they returned. It is not append-only: `updateMessage` and `deleteMessage`
    change persisted storage, clients can delete messages through the Thread Client API, tool-result messages
    cascade with their parent assistant message, and `before_store_tool_result` and the `after_tool_call_*`
    hooks may rewrite a result before it is stored. SA defines no integrity chain; the ACS reference audit
    log is HMAC-chained. The step cycle lists ''Execute tool calls sequentially'' before ''Persist tool
    results'' and does not say whether each result is persisted before the next call of the same step
    runs. Searched: audit, tamper, integrity, hmac.'
  combined: 'Have ACS tools return their ACS output as JSON in `ToolResult.result`, so thread history
    carries `checkpoint_id`, `restored` and the list of unrestored items. For an audit trail of ACS strength,
    additionally append a chained record from the tool: a key per entry plus a counter key (the store
    cannot be listed), a bundled hash function, and a plan for the runtime''s key-count cap; or use an
    external sink. Such a chain is tamper-evident against the model, not against other definition code
    holding the same `ThreadState`. `tool_call_done` is the one hook that observes every tool call, gated
    or not, on prompts whose hook set includes it.'
  see_also:
  - tools-contracts#io-03
  - tools-contracts#io-06
  - published-api-extension-points#erase-01
