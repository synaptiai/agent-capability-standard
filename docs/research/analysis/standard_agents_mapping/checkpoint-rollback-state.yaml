- id: state-16
  relation: partial
  acs:
    concept: '`send` requires a checkpoint; what rollback means for data already transmitted is not defined'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 (lines 85-88), §4.4 Safety-Critical Capabilities (lines 184-188), §12.1
      When to Use Checkpoints (lines 1522-1545; guidance; quote at line 1543)
    - schemas/capability_ontology.yaml nodes[id=send] (lines 1133-1170), edge checkpoint requires send
      (lines 1766-1768)
    - schemas/world_state_schema.yaml TransitionRule.rollback (lines 314-323)
    - spec/RFC-0002-agent-reliability-profile.md (lines 122-128)
    quote: '| Send HTTP POST | Yes | May cause side effects |'
  sa:
    concept: 'Effects: `scheduleEffect`, `getScheduledEffects`, `removeScheduledEffect`; a deferred side
      effect can be cancelled while pending'
    refs:
    - content/0.2.0/specification/effects.md §1.1 Purpose (line 11), §3 Execution Semantics (lines 81-90;
      quote at line 87)
    - content/0.2.0/specification/threads.md §4 Effect Scheduling (lines 274-322)
    - content/0.2.0/specification/threads/client-api.md §10 item 3 (line 294)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3056 (scheduleEffect), 3067-3077 (removeScheduledEffect)'
    quote: '- **SHOULD** expose inspection and cancellation APIs (`getScheduledEffects`, `removeScheduledEffect`).'
  explanation: 'Neither standard can undo a transmission. ACS requires a checkpoint before `send` (§3.3,
    §4.4 and the ontology; §12.1 is guidance) and says nothing further; its world-state schema has a compensation
    descriptor (`TransitionRule.rollback.inverse_effects`) that `send` does not use. SA offers one lever:
    a deferred side effect has an id and can be cancelled while pending. The lever is weak. Inspection
    and cancellation are SHOULD-level; the delivery guarantee of effects is not stated, so a handler may
    run more than once (the idempotency sentence is addressed to runtimes); effects return no output to
    the model; thread deletion discards scheduled effects; and by the published type comment `removeScheduledEffect`
    returns `false` alike for an executed, a cancelled and an unknown effect. Searched (effects.md, threads.md
    §4): at-least-once, at most once, exactly-once, redeliver, retr.'
  combined: 'A cancellable `send`: the tool runs the approval and checkpoint checks, writes `{ state:
    ''scheduled'' }` under a send id, schedules the effect with a grace period, and returns `sent: false`
    with `scheduled: true` and the id (the ACS output `sent` has no value for ''scheduled''). The effect
    handler reads the record, does nothing unless it is `scheduled`, marks `sending`, transmits with the
    send id as an idempotency key, then marks `sent`. Cancel or `rollback`: a `scheduled` record is set
    to `cancelled`, which the handler honours, and `removeScheduledEffect` is called in try/catch as a
    courtesy; a `sending` or `sent` record is reported as not reversible. Residual risks: a handler may
    run twice or interleave with a running execution, and a send made directly inside a tool is irreversible.'
  see_also:
  - tools-contracts#eff-01
