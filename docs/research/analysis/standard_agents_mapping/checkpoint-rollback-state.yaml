    quote: 'cognitive_mapping: ''Cognitive: Long-term memory'''
  sa:
    concept: 'User-scope values (Draft): `UserState.getValue`/`setValue`/`listValues`, `UserHandle.getValue`/`setValue`/`call`'
    refs:
    - content/0.2.0/specification/users.md status line (line 3), §2 UserState (lines 45-75), §2.1 Serialization
      (lines 77-80), §5 UserHandle (lines 165-182), §7.1 `valuePrefix` (lines 284-286)
    - content/0.2.0/specification/threads.md §1.2.2 User identity, `user()` (lines 155-159), §7.4 Agent
      Skills (lines 447-465)
    - content/0.2.0/distribution/packaging.md Portability requirements (lines 15-17)
    - '@standardagents/spec 0.45.10 index.d.ts lines 3168-3211 (getUserValue, setUserValue, listUserValues),
      3231 (user()), 1561-1583 (UserHandle)'
    quote: '> **Status: draft proposal.** Not yet part of the frozen specification surface.'
  explanation: The thread store is invisible to other threads and is deleted with the thread, so memory
    across conversations needs a wider scope. For key-addressed values SA's only candidate is the user
    scope, which is a Draft page; nothing on it is required of a conforming 0.2.0 runtime. There, serialized
    read-modify-write exists only inside user endpoints and `UserHandle.call()`; `UserHandle.getValue`
    and `setValue` are explicitly not serialized, and the page mentions 'client-writable value routes',
    so a recalled user value is unverified input. The frozen Threads page types `state.user()` as identity
    only; the published types return a `UserHandle` and also declare `getUserValue`, `setUserValue` and
    `listUserValues` on `ThreadState`, which no 0.2.0 page mentions. A thread may have no user. The frozen
    cross-thread store, `state.skills`, is not a key-value memory (state-27).
  combined: 'For cross-thread `persist`/`recall`: `const u = await state.user()`, then test at run time
    that `u` has `setValue` (the published types always say so) and write the envelope; route read-modify-write
    through a packaged user endpoint with `u.call(...)`. Return the scope actually used in the tool result.
    When the caller asked for cross-thread storage and the runtime lacks it, return an error instead of
    falling back to thread scope, because a silent fallback changes what `persist` means. Mark data recalled
    from user scope as low-trust, for example with an evidence anchor naming the scope. This is an optional
    enhancement under the packaging rules, not a portable dependency.'
  see_also:
  - models-context-memory-security#remember-02
- id: state-14
  relation: acs_only
  acs:
    concept: 'World state: `state` and `transition` capabilities and the canonical versioned snapshot
      (`meta.version_id`, `parent_version_id`, `lineage`)'
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms, World State (line 59), §6.3 World State Requirements (lines 1145-1170)
    - schemas/world_state_schema.yaml principles (lines 7-13), TransitionRule (lines 287-328), world_state.meta
      (lines 443-484)
    - schemas/capability_ontology.yaml nodes[id=state] (lines 711-754), nodes[id=transition] (lines 755-795)
    quote: '| **World State** | Derived snapshot from observations and transition rules |'
  sa:
    concept: 'None: thread state is the agent''s own messages, files, key-value values and environment'
    refs:
    - content/0.2.0 (whole tree searched; terms in the explanation)
    - content/0.2.0/specification/threads.md §1 Thread Definition (lines 16-18)
    - content/0.2.0/specification/threads/client-api.md §14 Reading a File (lines 383-395)
    quote: A thread is an **instance** of an agent with isolated storage for messages and files.
  explanation: 'ACS world state is a model of the external world (entities, state variables, observations,
    transition rules, action records) kept as versioned snapshots. SA thread state is the storage of one
    conversation; SA defines no world model, entity, observation, lineage or snapshot version. `state`
    and `transition` are `mutation: false`, so they bind as ordinary function tools; only storing their
    output touches SA state. §6.3 requires the snapshot fields, not a storage mechanism, so nothing normative
    depends on the choice of surface. Searched: world state, world_state, world model, lineage, long-term,
    observation, entity, transition, memory, recall (content/0.2.0, src/data, README.md, published types;
    the few hits are unrelated: an observation point for tool calls, status transitions, sandbox memory
    limits).'
  combined: 'Write each snapshot as JSON to `/<pkg>/world/<version_id>.json`: `statFile` first (skip when
    the file is present and its digest matches), verify the size after writing, then move the head pointer
    with `setValue(''<pkg>/world/head'', { version_id, sha256 })`, so that a missing or altered file is
    detected on read. Keep small snapshots in the key-value store itself. A change produces a new `version_id`
    with `parent_version_id` and `lineage`. ''Never rewrite a snapshot'' is a convention that the binding
    enforces only by refusing its own directory in gated tools. The files are readable by clients where
    the Thread Client API is exposed, and their durability is runtime-documented in 0.2.0. Validation
    against world_state_schema.yaml is the tool''s job.'
- id: state-15
  relation: fits
  acs:
    concept: Executor run snapshot and restore (canonical JSON, SHA-256, optional HMAC), so a run can
      be saved and resumed
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 10-14; quote at line 14), Driving a run yourself (lines
      258-277)
    - grounded_agency/_core.pyi Run.restore, Run.snapshot (lines 55-68)
    - core/Cargo.toml lib and features (lines 10-17)
    - core/src/lib.rs (lines 19-20)
    - core/src/validate/mod.rs Context::load (line 99)
    - core/src/ontology.rs Ontology::from_value (line 109)
    - spec/ROADMAP.md Multi-language SDKs (line 86)
    quote: the same snapshot, and a run can be saved and resumed anywhere.
  sa:
    concept: Persist-before-advance for messages and tool results, durable queues, and the durable key-value
      store
    refs:
    - content/0.2.0/infrastructure/runtime.md §1 Overview (lines 9-13; quote at line 11), §3 Step Cycle
      (lines 42-50), §9 Queue and Delivery Semantics (lines 219-225), §16 Conformance Summary (lines 384-392)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14)
      §14.2 (line 362)
    - content/0.2.0/specification/threads/execution-state.md §4.3 Requirements (lines 118-122)
    - content/0.2.0/distribution/packaging.md intro (line 3), Portability requirements (lines 9-25)
    - content/0.2.0/specification/threads/code-execution.md §6.1 (line 389)
    quote: '- persist messages and tool results before continuing'
  explanation: 'Both make a long-running process resumable, at different layers. The SA runtime persists
    the conversation step by step and keeps queued messages durably; a lost execution settles as `failed`
    with reason `execution_lost`. The ACS executor exposes its own deterministic state as an I-JSON snapshot.
    An ACS run hosted in an SA thread needs both, because the SA runtime does not know the workflow''s
    position. The run cannot be hosted in-process today. The core compiles for wasm32-unknown-unknown
    unchanged, but the artefact exports only `memory`: the single interface module is behind the `python`
    feature, and the validator context loads from file paths. SA says nothing about WebAssembly in tool
    modules, and packs an agent into a single module. Searched: wasm, webassembly (the hits concern the
    `runCode` sandbox only).'
  combined: 'Design for when a JavaScript interface exists: after each `submit`, `await state.setValue(''<pkg>/run/<run_id>'',
    snapshotString)`; at the start of the next execution, `restore` from it and continue. Store the snapshot
    as a string and check its size against the runtime''s documented cap. Bundle the catalog and ontology
    as data, because a snapshot restores only against the ones it was taken from. An HMAC key read with
    `state.env` is readable by every definition on the thread. Until then only the checkpoint gate and
    the tools of state-04 to state-06 and state-20 can be bound. A remote executor would be an external
    service; the packaging rules allow one only when the package declares it as part of the agent''s purpose
    (inference: the text does not address this case directly).'
