# Standard Agent Specification to Agent Capability Standard mapping: index
# Summary and method: docs/integrations/standard_agents.md
meta:
  version: 1.0.0
  date: '2026-11-14'
  description: Concept-by-concept mapping between the Agent Capability Standard and the Standard Agent
    Specification, with the passages each row rests on, and the findings about each standard that the
    mapping produced.
  agent_capability_standard:
    standard: 1.1.0
    ontology: 2.1.0
    commit: 3e4cd94
  standard_agent_specification:
    version: 0.2.0
    repository: https://github.com/standardagents/spec
    commit: faccc8be0ba5921a8af86db2fe52283773cd1583
    types_package: '@standardagents/spec 0.45.10'
  relations:
    same: The two concepts mean the same thing.
    partial: One covers part of the other.
    fits: They address different layers and combine without conflict.
    acs_only: The Standard Agent Specification has nothing comparable.
    sa_only: The Agent Capability Standard has nothing comparable.
    conflict: Using both as written would break a requirement of one.
  row_fields:
    id: Row identifier, unique within its concern. Across concerns a row is <concern>#<id>.
    relation: One of the relations above.
    acs: The Agent Capability Standard concept, where it is defined, and a verbatim quote.
    sa: The Standard Agent Specification concept, where it is defined, and a verbatim quote.
    explanation: Why the relation holds, and what was searched for when something is absent.
    combined: How the two can be used together with what Standard Agents 0.2.0 requires of every runtime.
      Absent when they cannot.
    see_also: Rows of other concerns that hold a condition or caveat this row relies on.
  finding_fields:
    id: Finding identifier.
    priority: 'blocker, important or minor. For the Standard Agent Specification: blocker means something
      this standard requires cannot be enforced even by cooperating tool code; important means it can
      be enforced only cooperatively or with a workaround that has a stated weakness. For this standard:
      blocker means two careful implementers would build incompatible things or a safety rule can be bypassed;
      important means an implementer must guess or read the reference code.'
    summary: What the text says or leaves out, and the consequence.
    refs: Where the evidence is.
    quote: A verbatim passage, when the finding rests on one.
    searched: 'For an absence: what was searched for, and where.'
    proposed_change: The smallest change that would resolve the finding.
    disposition: 'Standard Agent Specification findings only. proposal: one of the six drafted issues
      asks for the change (tasks/standard-agents-upstream/). not_proposed: no issue asks for it, with
      the reason. candidate: worth an issue of its own.'
    document_item: 'Agent Capability Standard findings only: the numbered item in the integration document''s
      list of proposed changes that states the finding.'
    concerns: The concerns whose mapping produced the finding.
  references: Paths under content/ and src/ are in the Standard Agent Specification repository at the
    commit above. Other paths are in this repository at the commit above, and line numbers refer to those
    commits. The exceptions are the files this analysis added (examples/standard_agents/, schemas/interop/standard_agents_annotation.schema.json,
    docs/integrations/standard_agents.md), which are cited as they stand, without line numbers for the
    binding's code.
  review: 'Each concern was mapped from the full text of both sides, then read by two independent reviewers:
    one checked every reference and quote and tried to refute every claim of absence; the other checked
    that every combination compiles against the published types and relies only on what the specification
    requires. A third pass reconciled the mapping with both reviews. Rows of different concerns that rest
    on the same passage were then compared, and findings were merged across concerns and checked against
    the sources again.'
