- id: ACS-51
  title: The ontology principle on `confidence` contradicts the schemas, and `confidence` is undefined
  priority: minor
  area: ontology
  kind: inconsistency
  summary: '`meta.principles` says ''Every capability returns evidence anchors and confidence''. By script,
    23 of 36 output schemas require `confidence` and 13 neither require nor declare it. Where present
    it is a number in [0, 1] with no statement of what it measures; only `inquire` describes it, and the
    skills for ten of the 13 return a `confidence` anyway, glossed as parse success, delivery or match
    quality. Profiles set a `minimum_confidence`. `Uncertainty` differs between event_schema.yaml and
    world_state_schema.yaml, and `measure.uncertainty` is a third shape. A typed binding follows the schemas,
    not the principle.'
  refs:
  - schemas/capability_ontology.yaml meta.principles (line 13); measure output `uncertainty` (lines 391-397);
    inquire output `confidence` (line 1703)
  - schemas/event_schema.yaml types.Uncertainty (lines 37-55)
  - schemas/world_state_schema.yaml types.Uncertainty (lines 86-116)
  - schemas/profiles/profile_schema.yaml evidence_policy.minimum_confidence (lines 71-75)
  - docs/proposals/OASF_SAFETY_EXTENSIONS.md (line 67)
  - 'SA: content/0.2.0/specification/threads/decisions.md §4.1 Answer Semantics (lines 153-167)'
  quote: Every capability returns evidence anchors and confidence
  proposed_change: 'Reword the principle to match the schemas: every capability returns evidence anchors;
    those that make a judgement also return confidence. Define the output `confidence` in §4 (what it
    is a probability of; self-reported unless the host says otherwise), allow an optional `uncertainty`
    of one reconciled `Uncertainty` type beside it, and state that thresholds belong to gates and profiles.'
  verified: 'Counted by script over schemas/capability_ontology.yaml: 23 outputs require `confidence`;
    receive, execute, mutate, send, checkpoint, rollback, constrain, audit, persist, recall, delegate,
    synchronize and invoke neither require nor declare it. Read both `Uncertainty` types and `measure.uncertainty`.
    Found a top-level `confidence` in the output contracts of ten of the thirteen skills (not execute,
    mutate or invoke). Read spec/STANDARD-v1.1.0.md §8.1 (line 1218), which calls the factor ''Self-reported
    confidence from source''.'
  status: fixed
  resolution: 'Standard 1.2.0 §4.1.1 (Common Output Fields), accepted from RFC-0008: `confidence` is the
    producer''s self-reported probability that the output''s claim is correct, with no threshold in the
    Standard (gates, conditions and profiles set them); `meta.principles` (ontology 2.2.0) now say every
    output carries evidence anchors or is marked inferred, and that a capability whose contract requires
    a confidence returns one; the 13 outputs without one declare it optional; one reconciled
    `Uncertainty`, optional on every output, with `measure.uncertainty` keeping `lower` and `upper` and
    gaining its members. Every capability skill glosses `confidence` as that probability, and the OASF
    proposal quotes the reworded principle. Pinned by `tests/test_evidence_schemas.py` (the 23/13 split,
    the principle, the glosses).'
