    569-641, hooks/pretooluse_require_checkpoint.sh lines 31-34, grounded_agency/errors.py lines 1-90
    and the published types at dist/index.d.ts lines 211-236. The reference binding, examples/standard_agents/src/acs/grounded.ts,
    returns the §9.8 object with `location: { tool, capability }`.'
  status: fixed
  resolution: 'Standard 1.2.0 §9.8 and §5.18.8: a refusal of a call is the §9.8 diagnostic with
    `location` {tool, capability, call}, and its text form is `<CODE> <NAME>: <message>`; host policies
    such as rate limits refuse with F504, and a failure of the layer is R407 SAFETY_CHECK_FAILED.
