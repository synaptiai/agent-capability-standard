# Findings about the Agent Capability Standard
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
about: agent_capability_standard
findings:
- id: ACS-01
  title: No normative rules for a safety layer over tool calls outside a workflow
  priority: blocker
  area: standard_text
  kind: missing
  summary: 'The Standard states its safety rules over workflow steps. For other hosts it has one sentence,
    in §5.2.1, naming ''safety layers''; §2 does not define the term, and ''tool'' and ''hook'' do not
    occur in the text. The repository''s layers differ: the plugin hook checks a time-limited marker file;
    the SDK adapter reserves a checkpoint per call, consumes it after success and denies only in strict
    mode; the executor consumes one per step and requests a missing one. §10 covers validators only, so
    a binding has nothing to conform to.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
  - spec/STANDARD-v1.1.0.md §2 Terms (lines 53-68)
  - spec/STANDARD-v1.1.0.md §10.1-§10.3 (lines 1376-1431)
  - hooks/pretooluse_require_checkpoint.sh (lines 36-47, 59-101)
  - grounded_agency/adapter.py PreToolUse hook (lines 612-630), PostToolUse consumer (lines 680-698)
  - core/src/exec/machine.rs checkpoint() (lines 663-677)
  quote: Validators, executors and safety layers MUST act on effective flags.
  searched: Case-insensitive 'safety layer' in spec/ (one match, STANDARD line 279); whole-word 'tool'
    and 'tools', and 'hook', 'PreToolUse', 'tool call', in spec/STANDARD-v1.1.0.md (no match).
  proposed_change: 'By RFC, add a normative section for tool-call safety layers: define the term in §2;
    fix the trace scope; say how `requires`, `precedes` and `soft_requires` apply to a call sequence;
    state the F501, F502 and F503 refusals and fail-closed behaviour; require a claim to name the calls
    it covers. Add language-neutral call-sequence fixtures and a conformance statement for bindings.'
  verified: Read spec/STANDARD-v1.1.0.md §2 (lines 51-68), §3.3 (lines 84-93), §4.3 (lines 145-180), §5.2.1
    (lines 270-284), §5.13 (lines 777-802) and §10 (lines 1374-1431); hooks/pretooluse_require_checkpoint.sh
    and hooks/hooks.json in full; grounded_agency/adapter.py lines 525-706 and 737-844; core/src/exec/machine.rs
    lines 644-677; docs/guides/RUNNING_WORKFLOWS.md lines 145-148; spec/SECURITY.md §2.2.7 (lines 165-172);
    spec/CONFORMANCE.md lines 71-82. Ran the greps listed under searched.
  status: fixed
  resolution: 'Standard 1.2.0 §5.18 (Tool-Calling Hosts), accepted from RFC-0005. §2 defines
    tool-calling host, call, tool binding, safety layer, layer scope and execution boundary. §5.18.5
    fixes the scope, applies `requires` to a call sequence (F501, F503 for `rollback`, otherwise V102),
    leaves `soft_requires` a warning at most and `precedes` and `conflicts_with` unenforced and
    unreported, with reasons, and makes check-and-use atomic. §5.18.8 makes a layer fail closed (R407).
    §10.4 adds the safety-layer class SL, which requires §5.18.5–§5.18.10 and whose statement names the
    calls a layer covers and any §5.18.10 check it does not apply yet; the two reference layers meet the
    class except the rows their statements list (the secret checks and redaction of §6.7, the
    destination policy of §4.4.2 and, for the Python adapter, the output contract of a tool result), and
    claim it once those are applied. Fixtures: tests/conformance/bindings/ (33) and
    tests/conformance/calls/ (23), from scripts/gen_call_fixtures.py, with the statements in
    tests/conformance/calls/statements/; the Python adapter runs them in tests/test_binding_fixtures.py
    and tests/test_call_fixtures.py, the Standard Agents binding in
    packages/acs-core/test/bindings.test.ts and examples/standard_agents/test/calls.test.ts, which read
    the fixture text exactly (parseJsonExact).'
  concerns:
  - tools-contracts
  - published-api-extension-points
  - safety-enforcement
  - checkpoint-rollback-state
- id: ACS-02
  title: Checkpoint single use, expiry and missing-checkpoint behaviour are not normative and differ between
    implementations
  priority: blocker
  area: standard_text
  kind: inconsistency
  summary: The Standard gives a static rule (a `checkpoint` step before a step needing one) and, in §5.13,
    invalidation by a wait or delay. A catalog with one checkpoint before two `mutate` steps validates.
    Single use appears only in a guide and an informative fixture. The executor consumes one before the
    step runs, has no expiry and requests a missing one; the SDK adapter consumes after success, expires
    after 30 minutes and refuses in strict mode; the hook never consumes. The rollback skill refuses an
    expired checkpoint; the executor does not.
  refs:
  - spec/STANDARD-v1.1.0.md §3.3 (lines 85-88), §5.13 (lines 777-781, 796-798), §10.3 (lines 1427-1431)
  - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Checkpoints (lines 145-148)
  - core/src/exec/machine.rs rollback() (lines 644-661), checkpoint() (lines 663-677), invalidate_checkpoints()
    (lines 865-884), retry (lines 1389-1391)
  - grounded_agency/state/checkpoint_tracker.py Checkpoint.is_valid (lines 58-64), DEFAULT_EXPIRY_MINUTES
    (line 176), validate_and_reserve (lines 547-598)
  - hooks/pretooluse_require_checkpoint.sh expiry check (lines 96-101)
  - skills/rollback/SKILL.md (line 273)
  quote: One checkpoint authorises one step that requires one,
  proposed_change: 'Decide, and state in §5: either the executor''s rules become normative (one checkpoint
    per step that requires one, consumed when the step is about to run, invalid after a wait or delay,
    `rollback` exempt), or one validity rule is normative and each host documents the rest. State the
    run-time conditions for F501 and F503. Align adapter, hook and rollback skill.'
  verified: 'Ran the reference validator and executor on a catalog of `checkpoint`, `mutate`, `mutate`:
    the validator reported no error (two W601 warnings), and the run asked for `CreateCheckpoint` before
    the second mutation. Read core/src/exec/mod.rs lines 341-344 (a checkpoint record holds `id` and `valid`
    only), core/src/exec/machine.rs lines 644-677, 865-884 and 1375-1396, grounded_agency/state/checkpoint_tracker.py
    lines 40-64, 343-392 and 529-598, grounded_agency/adapter.py lines 660-704, the hook script, tests/conformance/runtime/checkpoint_per_mutation.json
    and skills/rollback/SKILL.md line 273.'
  status: fixed
  resolution: 'Standard 1.2.0 §5.2.2 (steps) and §5.18.6 (calls): one checkpoint per gated step or call,
    the newest valid one, used up when the call is allowed to start and whatever its outcome once it
    started; a hold that lapses or is never resolved counts as used; validity ends at an execution
    boundary and, for a call, at a stated maximum age of at most 30 minutes; with none valid the
    executor has its host take one and a layer refuses (F501); a rollback needs a checkpoint taken
    earlier and uses none (F503). grounded_agency/state/checkpoint_tracker.py (holds, consume_if_valid,
    end_validity, the cap, a maximum age applied to every checkpoint) and grounded_agency/adapter.py
    follow it; a checkpoint dated after the clock reads (a crafted state file, a clock stepped back)
    authorises nothing. The plugin''s hooks use the marker up per gated call, take it on a successful
    `git stash create`, end it at Stop, and keep every marker whose validity ended (used, expired, ended
    with its turn, replaced) under .claude/checkpoints/, so `git stash pop|apply <commit>` of a recorded
    commit is a rollback that uses none; the rollback skill''s command hook refuses a restore that names
    no recorded checkpoint (F503). Tests: tests/test_checkpoint_holds.py,
    tests/test_hook_checkpoint_lifecycle.py and the call fixtures checkpoint_single_use,
    two_checkpoints_two_calls, refused_call_keeps_checkpoint, failed_call_uses_checkpoint,
    checkpoint_stale_after_boundary, checkpoint_stale_after_max_age, rollback_needs_checkpoint and
    rollback_after_use.'
  concerns:
  - safety-enforcement
  - checkpoint-rollback-state
- id: ACS-03
  title: §5.14 approval is neither defined nor enforced for tool calls outside a workflow
  priority: blocker
  area: standard_text
  kind: missing
  summary: '§5.14 defines approval as a field of a workflow step: a decision binds to the digest of the
    values its `shows` references resolve to. A tool call has no step and no `shows`, so each binding
    chooses what to hash, and two bindings produce different digests for the same action. The ontology
    sets `requires_approval: true` on `execute`, `mutate` and `send`, yet the plugin hook checks only
    the checkpoint marker and the SDK adapter only checkpoints and a rate limit. The `send` skill''s hook
    asks a model whether the user approved.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 821-822, 827-833), §5.2.1 (line 279), §2 (line 67)
  - schemas/capability_ontology.yaml `requires_approval` (lines 1058, 1101, 1139)
  - grounded_agency/capabilities/mapper.py ToolMapping (lines 152-167)
  - hooks/hooks.json (lines 3-24)
  - skills/send/SKILL.md prompt hook (lines 10-31)
  - core/src/exec/machine.rs approval request (lines 716-762)
  quote: '| `shows` | References whose values the approvers see (each a `${...}` reference, else S303)
    |'
  searched: '''approv'' in grounded_agency/adapter.py (lines 311 and 535, both about the SDK''s pre-approved
    tools) and in grounded_agency/capabilities/mapper.py, grounded_agency/mcp.py, grounded_agency/state/*.py,
    hooks/*.sh and hooks/hooks.json (no match); ''type: prompt'' in skills/*/SKILL.md (checkpoint, persist,
    rollback, send, transform; not mutate or execute).'
  proposed_change: 'In the RFC for tool-call safety layers, define approval for a call that has no step:
    the object shown and hashed (the call''s inputs wrapped in an array, as the executor does without
    `shows`, or a fixed object of named members), one decision per call, and F502 otherwise. Implement
    the rule in the SDK adapter.'
  verified: 'Read spec/STANDARD-v1.1.0.md §5.14 (lines 804-902); grounded_agency/adapter.py lines 525-641
    and 737-844 (a rate limit and the checkpoint reservation, no approval check); hooks/hooks.json; skills/send/SKILL.md
    lines 10-31; core/src/exec/machine.rs lines 688-780. Ran the executor on a `mutate` step with no `approval`
    field: it showed and hashed the step''s inputs wrapped in an array. The reference binding, examples/standard_agents/src/acs/grounded.ts,
    hashes `[{ action, capability, args }]`, a different object.'
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.7: the shown values of a call are `[{action, capability, args}]`
    with the §5.14 digest; one decision per call, used up when the call is allowed; `min_approvers` and
    expiry from the binding''s `approval`; a host prompt that shows the call and decides it alone is a
    one-approver decision, relied on only where it reaches a person (F502 otherwise); changed arguments
    are classified again; with no one to ask, or arguments that are not I-JSON, F502 (both layers, by
    one I-JSON number rule, and the call fixtures approval_args_not_i_json,
    approval_args_beyond_limit_by_one and approval_args_integral_float). The Python adapter records the
    digest, asks only in the permission modes default, acceptEdits and plan, refuses `min_approvers`
    above 1 and `role`, and re-classifies changed arguments (tests/test_permission_modes.py,
    tests/test_permission_callback.py); the plugin hook answers `ask` with an F502 reason in those modes
    and blocks F502 in the others unless ACS_HOOK_APPROVAL=off; the send skill''s prompt hook no longer
    judges approval. Vectors: the `tool_call` kinds in tests/conformance/approval/digests.json; fixtures
    decision_single_use, decision_expires, refused_call_keeps_decision, rejection_wins and
    two_approvers.'
  concerns:
  - published-api-extension-points
  - safety-enforcement
  - approval-human
- id: ACS-04
  title: A `delegate` step's safety flags ignore what the target agent may do
  priority: blocker
  area: standard_text
  kind: underspecified
  summary: 'The ontology gives `delegate` `risk: medium`, `mutation: false` and no checkpoint or approval
    flag, whatever the target does. A delegate that changes external state therefore acts outside the
    delegating workflow''s checkpoint and approval rules unless the author raises the step''s flags by
    hand, as the reference catalog''s `multi_agent_orchestration` does with `requires_approval: true`.
    The Standard knows a delegate can act: the deferral rule counts `delegate` among steps that may act
    on the world. A bare `delegate` step validates without a diagnostic and runs with no checkpoint or
    approval, whatever its task.'
  refs:
  - schemas/capability_ontology.yaml node `delegate` (lines 1443-1447)
  - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
  - spec/STANDARD-v1.1.0.md §5.14 Approval, deferral rule 2 (lines 855-858)
  - 'spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 917-922: `read_only`)'
  - schemas/workflow_catalog.yaml `multi_agent_orchestration`, delegate step (lines 1674-1685)
  - 'tools/validate_workflows.py (line 19: `--strict` fails on warnings)'
  quote: '2. it may act on, or wait on, the world: its effective `requires_checkpoint` or `requires_approval`
    is true, it waits or delays (§5.13), or it is an `invoke`, `delegate`, `synchronize` or `rollback`;'
  searched: 'Flags on node `delegate` in schemas/capability_ontology.yaml (lines 1443-1538): `risk` and
    `mutation` only, no `requires_checkpoint` or `requires_approval`. Every mention of `delegate` in spec/STANDARD-v1.1.0.md:
    none relates the step''s flags to its target.'
  proposed_change: 'With an agent manifest available, define a `delegate` step''s effective flags as the
    stricter of the ontology''s and the target manifest''s maxima, unless the step binds `read_only: true`.
    Add a warning for a `delegate` step with neither `read_only: true` nor a raised `requires_approval`,
    for workflows that opt in by extension or `standard_version`, since strict validation fails on new
    warnings.'
  verified: 'Probe delegate.py: a workflow whose only step is `delegate` with a literal task and agent,
    no checkpoint and no approval, validated with no diagnostic, and the first action of its run was `InvokeCapability`
    for `delegate`. Read schemas/capability_ontology.yaml lines 1443-1500, spec/STANDARD-v1.1.0.md lines
    268-284 and 850-861, and schemas/workflow_catalog.yaml lines 1674-1690.'
  status: partly_fixed
  resolution: 'docs/integrations/standard_agents.md, ''How a delegate step maps to a host'', gives the
    workaround a workflow author has today: raise a `delegate` step''s flags when the target agent can
    mutate. Remaining: deriving a delegate step''s flags from what its target may do needs an agent manifest
    (ACS-29) and normative text, which needs an RFC.'
  concerns:
  - multi-agent
  related:
  - ACS-18
- id: ACS-05
  title: Domain profiles have no application semantics, undefined thresholds and free-form policy keys
  priority: blocker
  area: standard_text
  kind: underspecified
  summary: 'The Standard mentions profiles twice: `profile` as a descriptive workflow field (§5.1) and
    a `trust_weights` override key (§8.3). It does not say what applying a profile changes, and nothing
    in core/src, grounded_agency or hooks reads one; tools/validate_profiles.py checks shape only. `require_human`
    admits `critical`, a level §4.1 does not define; `checkpoint_policy` keys are free-form labels; none
    of 29 `required_anchor_types` is an `Anchor.kind`. The EU AI Act documentation nevertheless calls
    `block_autonomous` ''Enforced at profile evaluation level''.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.1, line 225; §8.3, lines 1249-1251; §4.1, line 120
  - schemas/profiles/profile_schema.yaml risk_thresholds, checkpoint_policy, evidence_policy, lines 35-80
  - schemas/profiles/healthcare.yaml risk_thresholds, lines 46-54; compliance, lines 102-106
  - tools/validate_profiles.py validate_risk_thresholds, validate_checkpoint_policy, validate_evidence_policy,
    lines 120-258
  - core/src/validate/semantics.rs known workflow fields, line 26
  - docs/compliance/eu-ai-act/annex_iv_technical_documentation.md, lines 245 and 280
  quote: '| **Domain blocking** | `block_autonomous` capability lists prevent autonomous execution regardless
    of approval status | Enforced at profile evaluation level |'
  searched: '`profile`, `trust_weights`, `risk_thresholds`, `checkpoint_policy`, `evidence_policy`, `minimum_confidence`,
    `block_autonomous`, `required_anchor_types`, `retention` in core/src (one hit, the known-field list
    at core/src/validate/semantics.rs line 26), grounded_agency/ (no match) and hooks/ (no match); `profile`
    in spec/STANDARD-v1.1.0.md (lines 225 and 1249 only).'
  proposed_change: 'Add a normative section on domain profiles: how a run selects one; a merge rule that
    only tightens, as §5.2.1; what each field changes in terms of effective flags and §5.14; key grammars
    tied to capability ids and `Anchor.kind`; diagnostics. Implement it in the executor. Otherwise mark
    profiles informative and correct the compliance documents.'
  verified: 'Ran a script over the seven shipped profiles: 101 `trust_weights` keys, one (`hardware_sensor`,
    manufacturing.yaml) in `source_ranking.weights` and none in the `trust_class:<class>` form; 29 `required_anchor_types`,
    none an `Anchor.kind` of schemas/world_state_schema.yaml or schemas/event_schema.yaml; six profiles
    set the thresholds low, medium, high and healthcare.yaml sets none, low, low; every `block_autonomous`
    and `require_grounding` entry is an ontology capability id. Read schemas/profiles/profile_schema.yaml
    lines 1-111 and tools/validate_profiles.py lines 120-258 (type and enum checks only).'
  status: partly_fixed
  resolution: 'docs/domains/README.md gained ''Status of Domain Profiles'': a profile is informative data,
    no shipped component loads or selects one, and grounded_agency/trust.py applies a profile''s trust_weights
    only when a caller passes them. A table names what the validator, the reference executor, the Python
    adapter and the plugin hook enforce. Domain pages and profile header comments point there. The EU
    AI Act, ISO 42001 and NIST AI RMF documents now present block_autonomous, thresholds, minimum_confidence,
    anchor types and retention as declarations, and name what enforces each control. Remaining: The normative
    part: a Standard section saying how a run selects a profile, a tighten-only merge rule, what each
    field changes, key grammars tied to capability ids and Anchor.kind, and diagnostics. That needs an
    RFC. README.md (root) and analysis/10-regulatory-compliance.md, outside this package''s scope, still
    present block_autonomous as enforced.'
  concerns:
  - checkpoint-rollback-state
  - evidence-audit-observability
  - models-context-memory-security
  related:
  - ACS-06
- id: ACS-06
  title: '`evidence_anchors` has no item schema, and the anchor vocabularies in the repository disagree'
  priority: blocker
  area: ontology
  kind: inconsistency
  summary: 'All 36 capability outputs require `evidence_anchors`, declared `type: array` with no `items`.
    The anchor forms elsewhere disagree: `Anchor` in event_schema.yaml (seven kinds), `Anchor` in world_state_schema.yaml
    (six), the Python `EvidenceAnchor` (`tool_output`, `file`, `command`, `mutation`, `coordination`,
    free `metadata`), a 14-kind enum in the modality guide, plain strings in the skill template, and profile
    `required_anchor_types` that match no `kind`. No schema has a digest. The executor checks key presence
    only, so an empty list passes; a reference to one anchor is B204.'
  refs:
  - schemas/capability_ontology.yaml, 36 `evidence_anchors` properties (first at lines 133-135)
  - schemas/event_schema.yaml types.Anchor (lines 13-36)
  - schemas/world_state_schema.yaml types.Anchor (lines 62-85)
  - grounded_agency/state/evidence_store.py class EvidenceAnchor (lines 148-168), get_for_capability_output
    (lines 532-544)
  - templates/SKILL_TEMPLATE_ENHANCED.md (lines 50, 65, 75)
  - spec/STANDARD-v1.1.0.md §5.4 (lines 324-327), §6.2 (lines 1123-1126)
  quote: '`evidence_anchors` output and an event''s `anchors` field are different things.'
  proposed_change: 'Define one `EvidenceAnchor` from the event schema''s `Anchor` (`ref`, `kind`, `timestamp`,
    `excerpt`): one `kind` enum across both schemas and the SDK, an optional `digest`, and a rule for
    host or `x-` kinds and `ref` schemes. Say what `required_anchor_types` means relative to `kind` and
    whether an empty list satisfies §3.1. Add `items` to the 36 outputs only after strict catalog validation.'
  verified: 'Counted by script over schemas/capability_ontology.yaml: 36 `evidence_anchors` properties,
    all required, none with `items`. Read the cited lines, docs/guides/MODALITY_HANDLING.md §4.2 (lines
    613-651), schemas/profiles/profile_schema.yaml lines 66-70, schemas/profiles/healthcare.yaml lines
    64-69, grounded_agency/coordination/delegation.py line 146 and core/src/exec/machine.rs lines 1399-1427
    and 1640-1666. Ran the reference executor with `evidence_anchors: []` on every step: accepted. Validated
    a catalog that binds `${r_out.evidence_anchors[0]}` in strict mode: B204. Read examples/standard_agents/src/example/settings.ts,
    where the reference binding returns `{ ref, kind: ''file'', metadata: { sha256 } }`. The word ''anchor''
    occurs in spec/STANDARD-v1.1.0.md at lines 58, 65, 1126 and 1138 only.'
  status: fixed
  resolution: 'Standard 1.2.0 §6.5 (Evidence Anchors), accepted from RFC-0008, which takes over RFC-0005 decision 8
    and answers its open question 5: one evidence anchor, `event_schema.yaml#/types/Anchor` 1.2.0, which
    `world_state_schema.yaml` repeats (`tools/validate_canonical_schemas.py` and
    `tests/test_evidence_schemas.py` check they are equal), with `ref`, `kind` and optional `timestamp`,
    `excerpt` and a `sha256:` `digest`; one kind vocabulary (the seven, `record`, and vendor kinds
    `x-...`); `ref` opaque except the reserved `acs:` scheme; every one of the 36 outputs''
    `evidence_anchors` has `items: anyOf [Anchor, string, object]` (ontology 2.2.0), the bare string and
    the non-anchor object being deprecated legacy forms, accepted until 2.0 and never counted. An empty
    list grounds nothing (§3.1); `required_anchor_types` lists kinds and is a grounding policy''s
    `kinds` (§5.20). Every repository catalog still validates in strict mode. The Python SDK writes
    canonical kinds (the legacy names are deprecated aliases whose queries keep their 1.1 results;
    `tests/test_evidence_anchor.py`), the binding''s `fileAnchor` carries `digest`, and
    `schemas/interop/evidence.schema.json` restates the anchor.'
  concerns:
  - tools-contracts
  - published-api-extension-points
  - evidence-audit-observability
  - models-context-memory-security
  related:
  - ACS-05
  - ACS-62
- id: ACS-07
  title: Python tool mapper classifies unknown tools as `observe` and lets declarations weaken ontology
    flags
  priority: blocker
  area: python_sdk
  kind: defect
  summary: '`ToolCapabilityMapper.map_tool` returns `observe`, medium risk, no checkpoint, for a tool
    name it does not know; the adapter''s high-risk fallback applies only when the mapper raises. `register_mcp_tool`
    stores the declared flags and never reads the ontology: called with `capability_id=''mutate''`, `risk=''low''`
    it yields no checkpoint requirement, and it accepts an unknown capability id. `ToolMapping` has no
    `requires_approval` or `domain`. Apart from a rate limit, the adapter''s PreToolUse hook allows any
    call whose mapping needs no checkpoint, so in strict mode an unregistered or weakly declared tool
    passes the checkpoint rule.'
  refs:
  - grounded_agency/capabilities/mapper.py ToolMapping (lines 152-167), `self._ontology` (line 301), register_mcp_tool
    (lines 304-337), unknown tool (lines 369-375)
  - grounded_agency/adapter.py `_UNCLASSIFIED_TOOL` (lines 195-200), PreToolUse hook (lines 589-596, 612-613)
  - grounded_agency/mcp.py (lines 100-110)
  - spec/STANDARD-v1.1.0.md §5.2.1 (lines 272-279), §3.3 (line 93)
  - schemas/capability_ontology.yaml `mutate` (lines 1095-1101)
  quote: '# Unknown tool - default to medium risk observe'
  proposed_change: In `register_mcp_tool`, resolve `capability_id` against the registry and reject an
    unknown id; compute flags as the ontology's combined with any stricter declaration and report a weaker
    one (W602); add `requires_approval` and `domain` to `ToolMapping`. Give an unclassified tool the strictest
    classification, as `_UNCLASSIFIED_TOOL` does, or refuse it in strict mode, and state that default
    in the binding profile.
  verified: 'Ran the mapper in the repository''s virtual environment: an unregistered name maps to `observe
    (risk=medium)`; `register_mcp_tool(''x'', capability_id=''mutate'', risk=''low'')` gives mutation
    False and requires_checkpoint False; `capability_id=''no_such_capability''` is accepted; the fields
    of `ToolMapping` are capability_id, risk, mutation and requires_checkpoint. Read grounded_agency/capabilities/mapper.py
    in full (`_ontology` is assigned at line 301 and not read again) and grounded_agency/adapter.py lines
    192-200 and 579-641.'
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.2 states the default: an unbound tool is the strictest case,
    reported W617 UNBOUND_TOOL where the host knows the tools it offers.
    grounded_agency/capabilities/mapper.py: an unknown tool maps to UNCLASSIFIED_TOOL; an unknown
    capability is V101; a weaker declaration has no effect (W602). `register_mcp_tool` and
    `create_grounded_mcp_server` no longer register a tool with no capability as `execute`: it is
    unbound and reported W617. `check_offered` (Python) and `checkBindings` (TypeScript) report unbound
    offered tools. Tests: tests/test_tool_bindings.py, tests/test_mcp_integration.py, the fixtures
    offered_unbound and unbound_tool_is_strictest.'
  concerns:
  - tools-contracts
  - safety-enforcement
- id: ACS-08
  title: §9.8 states no convention for reporting a tool-call denial
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§9.8 requires diagnostics in a fixed object and shows a `location` of workflow, step, capability
    and field. It does not say that a tool-call denial uses this format, or what `location` holds when
    there is no workflow or step. The SDK adapter does not use the format: its denial is a prose `permissionDecisionReason`
    with no code, and the plugin hook writes ''Blocked: ...'' to stderr. grounded_agency/errors.py already
    implements the codes. Each binding invents its own refusal text, and a client cannot tell which rule
    refused a call without parsing prose.'
