- id: ACS-53
  title: Retention fields assume a store that outlives the session
  priority: minor
  area: schemas
  kind: underspecified
  summary: '`retention_policy` in the world state schema (`observations.max_age`, `audit_logs.max_age`,
    `snapshots.max_count`, `keep_tagged`) and the free-string `audit.retention` input state how long records
    are kept. The Standard says of them only ''How long to retain'' (§6.3), and no code in core/src or
    grounded_agency/ reads either. On a host that deletes a session''s storage with the session, as Standard
    Agents requires of a runtime that exposes its thread client API when a thread is deleted, a retention
    period written to session-scoped storage cannot be kept, and nothing reports that to the workflow.'
  refs:
  - schemas/world_state_schema.yaml retention_policy (lines 559-584)
  - schemas/capability_ontology.yaml audit.input_schema.retention (lines 1357-1359)
  - spec/STANDARD-v1.1.0.md §6.3 `retention_policy` row (line 1167)
  - 'SA: content/0.2.0/specification/threads/client-api.md §1 item 6 (line 14), §10 items 3 and 5 (lines
    294, 296)'
  - 'SA: content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (line 235)'
  quote: '| `retention_policy` | object | No | How long to retain |'
  searched: 'retention, retain (case-insensitive) in spec/STANDARD-v1.1.0.md: line 1167 only. retention
    in core/src and grounded_agency/: only the eviction priority of the in-memory evidence store (grounded_agency/state/evidence_store.py
    lines 131, 305).'
  proposed_change: State in §6.3 that retention applies to the store the records are written to, and that
    a host SHOULD report in the `audit` output which store was used and whether its lifetime is bounded
    by the session. Recommend exporting audit records at write time on hosts with session-scoped storage.
    Give `audit.retention` the duration form `max_age` uses.
  verified: 'Read the cited lines. Ran an `audit` step with `retention: "whenever"` through strict validation
    and the reference executor: accepted, and passed to the host unchanged.'
  status: fixed
  resolution: 'Standard 1.2.0 §6.3 and §6.6, accepted from RFC-0008: retention applies to the store the records are
    written to, and a `memory` or `session` store cannot keep a record longer than its process or
    session; a host that must keep records longer exports each when it writes it. `audit.retention` is a
    §5.10.1 duration, and a literal outside the grammar is W614 (`core/src/validate/extensions.rs`
    `audit_retention`, fixture `pass_audit_retention_warn`); the `audit` output gains `store` (`name`,
    `durability`, `retention`), which a host whose store does not outlive the session never reports
    `durable`, so a workflow can stop on it. The `audit` skill reports its store; the plugin''s audit
    log is documented as a `durable` store with no retention of its own.'
  concerns:
  - checkpoint-rollback-state
