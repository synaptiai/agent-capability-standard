- id: ACS-12
  title: Approvers are bare strings with no identity, role or authentication check
  priority: important
  area: standard_text
  kind: missing
  summary: A decision lists approvers as strings, and the executor counts distinct strings toward `min_approvers`.
    The request's `approver.role` is passed to the host; the executor does not check it, and §5.14 states
    no check. The `identity@1` inputs (`sender_check`, `accept_trust_classes`) apply to `receive`, `synchronize`
    and a waiting `delegate`, not to approval decisions. A host that can attest who approved, as a Standard
    Agents thread endpoint can through `auth.caller`, has no field for the attestation, and a workflow
    cannot require an authenticated approver.
  refs:
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 819, 831-833), §5.17 Sender Identity (lines 1032-1036)
  - schemas/world_state_schema.yaml ActionRecord.approval.approvers (lines 393-397)
  - core/src/exec/machine.rs approver passed to the host (lines 742-751, 767-774), distinct strings (line
    998)
  - core/src/exec/mod.rs Response::Decision (lines 218-224)
  - 'Standard Agent Specification: content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication
    (lines 98-105)'
  quote: 'description: Distinct approver identities.'
  searched: '''role'' in core/src/exec/machine.rs (no match).'
  proposed_change: 'With `identity@1`, let a decision carry `approver_identities` (a list of `agent_identity`),
    count distinct approvers by `principal`, require an identity''s `role` to equal the requested `role`
    when both are present, and record the identities in `ActionRecord.approval`. Do not promise a check
    of `kind: human`: whether the attested party is a person remains the host''s assertion.'
  verified: Read spec/STANDARD-v1.1.0.md lines 817-837 and 1032-1061, schemas/world_state_schema.yaml
    lines 373-412, core/src/exec/machine.rs lines 742-780 and 983-1030, core/src/exec/mod.rs lines 202-229
    and Standard Agent Specification endpoints.md lines 98-105. The record also proposes that `approval.approver`
    may bind `sender_check` and `accept_trust_classes`.
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.17 ("Approvers"): with `identity@1` a decision may carry
    `approver_identities`; approvers are counted by principal, an identity counts only if its kind is
    `human` for a human approver and its `role` is the requested one, and two different identities for one
    principal make the decision malformed. In a workflow that targets 1.2 the approver may require
    `sender_check` and `accept_trust_classes` (V106, S303; W604 and W616 in an earlier target). The record
    lists the counted approvers and `approval.approver_identities` (schemas/world_state_schema.yaml 1.2.0).
