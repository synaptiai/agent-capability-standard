- id: ACS-38
  title: No normative tool-to-capability binding record, and no statement that a declaration only strengthens
    flags
  priority: important
  area: interop_and_bindings
  kind: missing
  summary: 'The Standard defines no record by which a tool declares the capability it performs. Three
    carriers exist outside it: `ToolMapping` and `register_mcp_tool` in the Python SDK, a `metadata` convention
    read by `create_grounded_mcp_server`, and a generated JSON Schema for an `acs` annotation on Standard
    Agents tools, which no file under spec/ mentions. That schema is specific to one host, requires `layer`
    although it follows from `capability`, and accepts `capability: mutate` with `layer: PERCEIVE` and
    no checkpoint. No text says a tool-level declaration can only strengthen flags.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 272-284)
  - spec/RFC-0001-agent-capability-ontology-and-workflow-dsl.md 'Open questions' (line 54)
  - grounded_agency/capabilities/mapper.py ToolMapping (lines 152-171), register_mcp_tool (lines 304-337)
  - grounded_agency/mcp.py metadata convention (lines 45-54, 100-110)
  - schemas/interop/standard_agents_annotation.schema.json required members (lines 7-16), `layer` (lines
    70-83)
  - 'Standard Agent Specification: content/0.2.0/specification/tools.md §8 Annotations (lines 142-146)'
  quote: '- Canonical adapters for common toolchains'
  searched: Whole-word 'tool' and 'tools' in spec/STANDARD-v1.1.0.md (no match); 'standard_agents_annotation'
    in spec/ and docs/guides/ (no match; it occurs in scripts/, tests/, examples/standard_agents/, CHANGELOG.md
    and docs/integrations/standard_agents.md).
  proposed_change: 'By RFC, publish one host-neutral binding record under schemas/interop/: tool name,
    capability (unknown id: V101), optional domain, declared flags under the §5.2.1 stricter-of rule (weaker:
    W602), ontology version. State that the record describes and the enforcing code is authoritative.
    Make the Python `metadata` and the `acs` annotation instances of it; drop `layer` or require a check
    against the ontology.'
  verified: 'Read grounded_agency/capabilities/mapper.py lines 152-171 and 304-337, grounded_agency/mcp.py
    lines 32-119, schemas/interop/standard_agents_annotation.schema.json, scripts/gen_standard_agents_binding.py,
    .github/workflows/ci.yml lines 92-93, schemas/interop/oasf_mapping.yaml lines 1-22 and Standard Agent
    Specification tools.md lines 142-146. Validated the instance {capability: mutate, layer: PERCEIVE,
    risk: low, mutation, requires_checkpoint and requires_approval false} against the annotation schema
    with the jsonschema package: accepted.'
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.1 and schemas/interop/tool_binding.schema.json: one host-neutral
    record (`tool`, `ontology`, `standard`, `capability`, `domain`, `flags`, `additional_capabilities`,
    `classifier`, `invokes`, `approval`, `control`, `destination`, `x-` members), with V101, V109
    (another ontology major, or a cited Standard the layer does not support), V110 and W602, and
    carriers that may hold informative copies a layer ignores. Loaders:
    grounded_agency/capabilities/bindings.py (`load_bindings`, the MCP `metadata` carrier in
    grounded_agency/mcp.py) and packages/acs-core/src/binding.ts (`checkBindings`, the `acs`
    annotation). The generated schemas/interop/standard_agents_annotation.schema.json makes the
    annotation a carrier and refuses a copy inconsistent with the capability. A record with a member
    that has no I-JSON form is S303, by one number rule in both loaders (an integer beyond ±2^53, or a
    float canonical JSON writes as one, such as 1.8e16); `approval.role`, when present, is a non-empty
    string, and `approval.expires` at most 2^53 − 1 ms; diagnostics name members by dotted path.
    Fixtures: the 33 in tests/conformance/bindings/ (unsupported_standard, the vendor_member and
    approval limits), which both runners read exactly; tests/test_tool_bindings.py,
    packages/acs-core/test/ijson.test.ts and tests/test_standard_agents_binding.py.'
