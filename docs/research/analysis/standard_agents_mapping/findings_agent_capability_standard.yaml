    scripts/gen_trigger_vectors.py with zoneinfo and run by core/tests/triggers.rs and
    tests/test_triggers.py; runtime fixtures invoke_trigger_attendance_ignored*. RFC-0006 Part B, decision
    B7.'
  concerns:
  - workflow-execution
- id: ACS-15
  title: Run-time meaning of `parallel_group` and `join` is unspecified; the executor runs members serially
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§4.3 and §5.2 say the steps of one group "run concurrently", and §5.6 and §5.13 forbid an
    `end` gate and a `delay` there for that reason. `join` is a free string; its values are named only
    in the glossary and in a schema description. The reference executor holds one pending action and reads
    neither field: members run in list order, and any `join` string validates and changes nothing. A host
    cannot tell whether serial execution conforms, or what `any_complete` does to members that have not
    finished.'
  refs:
  - spec/STANDARD-v1.1.0.md §4.3 (lines 159-161), §5.2 (lines 256-257)
  - spec/STANDARD-v1.1.0.md §5.6 (lines 403-404), §5.13 (lines 801-802), Appendix C (line 1743)
  - docs/GLOSSARY.md 'Parallel Group' (lines 300-303); schemas/workflow_catalog.schema.json (lines 328-335)
  - 'core/src/validate/mod.rs (lines 389-390: both fields typed as strings)'
  - 'core/src/exec/mod.rs check_state (lines 735-737: one pending or terminal action); core/src/exec/
    (no occurrence of `parallel`)'
  - 'schemas/workflow_catalog.yaml (lines 895-898: the only group in schemas/workflow_catalog.yaml and
    schemas/workflows/, with one member)'
  quote: '| `join` | string | How to wait for parallel completion |'
  searched: '`parallel` and `join` in core/src/exec/: only string-joining calls. `all_complete`, `any_complete`,
    `first_complete` in spec/, docs/, schemas/, core/src, grounded_agency/ and skills/: docs/GLOSSARY.md
    lines 303 and 310, schemas/workflow_catalog.schema.json line 334, and `join: all_complete` in two
    catalogs and one guide example.'
  proposed_change: State in §5.2 that a `parallel_group` leaves its members unordered relative to each
    other for the rules of §4.3, and that an executor MAY run them in list order. Enumerate the `join`
    values and define each, including what `any_complete` does to unfinished members, or remove `join`.
    Specify concurrent dispatch later, as a separate action shape.
  verified: 'Probe parallel.py: a workflow with two steps in one group validated identically (one unrelated
    W615) with `join` set to `all_complete`, `any_complete` and `no-such-join-value`; run with `any_complete`,
    the executor issued `InvokeCapability` for steps 0, 1 and 2 in order, one at a time, and completed.
    Read spec/STANDARD-v1.1.0.md lines 153-172, 250-260, 398-406, 778-802.'
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.2.3 (Parallel Groups): the members are not ordered, an executor may run them
    in any order or concurrently and a §5.19 executor runs them in list order; the group is complete when
    every member has finished; unfinished members are abandoned when a recovery escalates or ends the run,
    and a loop continues from its target. `join` has one defined value, `all_complete`; any other, or a
    `join` without a group, is W618 (UNKNOWN_JOIN, ignored); a read of a group mate''s store is W619
