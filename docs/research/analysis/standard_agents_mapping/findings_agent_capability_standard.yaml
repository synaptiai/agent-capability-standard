- id: ACS-44
  title: '`approval.mode` values `in_session` and `out_of_band` have no defined meaning'
  priority: minor
  area: standard_text
  kind: underspecified
  summary: §5.14 lists `mode` as `in_session` (default) or `out_of_band` and says nothing more. The values
    are enumerated in the catalog schema and the world state schema, validated, passed to the host in
    the approval request and copied to the action record. No text gives either a meaning, and the executor
    does not branch on the value. A host has to guess what distinguishes them, and whether an unattended
    run may put an `out_of_band` request to a person instead of applying `when_unattended` at once.
