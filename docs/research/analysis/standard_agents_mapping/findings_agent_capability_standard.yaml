- id: ACS-55
  title: 'Hook layer: audit logs only skills, no fail-closed loading, concurrency assumption unstated'
  priority: minor
  area: plugin_hooks
  kind: idea_from_sa
  summary: The plugin's PostToolUse hook matches `Skill` only and its script exits for any other tool,
    although SECURITY.md §4.2 says implementations SHOULD 'Log all tool usage for audit'; SA has one observation
    point that fires once per tool call, success or failure. Neither the Standard nor SECURITY.md requires
    a host to refuse when a required hook is missing or fails, where SA's `parentHooks` fail closed. SA
    requires sequential tool execution; the Standard states no concurrency assumption for a safety layer,
    and the Python adapter needs checkpoint reservations.
  refs:
  - hooks/hooks.json PostToolUse, lines 14-24
  - hooks/posttooluse_log_tool.sh, lines 32-35
  - spec/SECURITY.md §4.2 Runtime Security, line 247
  - grounded_agency/adapter.py PostToolUse and PostToolUseFailure hooks, lines 334-352
  - 'standardagents/spec: content/0.2.0/specification/hooks.md §5.5 tool_call_done, lines 430-444; content/0.2.0/specification/agents.md
    §6, line 164'
  - 'standardagents/spec: content/0.2.0/infrastructure/runtime.md §5.1 Ordering, line 88'
  quote: '- Implementations **MUST** call this hook once per tool call, whether it succeeded or failed.'
  searched: '`fail closed|fail-closed|fail-open` in spec/STANDARD-v1.1.0.md, spec/SECURITY.md and hooks/
    (no match; ''fail-safe'' occurs only for expression errors, STANDARD lines 492 and 632); `hook` in
    spec/STANDARD-v1.1.0.md (no match).'
  proposed_change: Log every tool call, not only skills, in the plugin's audit hook; let a skill or plugin
    declare a required hook and require a host to refuse when it cannot load or run it; record which configuration
    activated a hook; and state the safety layer's concurrency assumption in the Standard.
  verified: Ran hooks/posttooluse_log_tool.sh with a `Bash` payload (exit 0, nothing written) and with
    a `Skill` payload (one audit.log line). Read hooks/hooks.json, grounded_agency/adapter.py lines 325-352
    and 535-550, and in standardagents/spec content/0.2.0/specification/hooks.md lines 169-180 and 428-444,
    content/0.2.0/specification/agents.md lines 132-166 and content/0.2.0/infrastructure/runtime.md lines
    84-92.
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.8: a host that claims a conforming layer runs no covered call
    without the layer''s decision, and a missing, failing or silent layer means refusal (R407); every
    record names the layer and its configuration (`recorded_by`). §5.18.10 makes the checks a skill''s
    hooks implement requirements of the capability on every host. §5.18.5 makes check-and-use atomic,
    and each statement says how. `create_grounded_mcp_server()` (`require_layer=True` by default) serves
    tools that refuse a call the adapter''s layer did not allow (R407), a control-only tool excepted;
    adapter records (digest of the settings, rate limits included, and bindings, computed once per
    change, every loaded binding I-JSON), the plugin''s audit lines (`recorded_by` with the digest of
    hooks/hooks.json and the effective settings) and every entry a grounded or control tool writes in
    the binding''s trace (a grounded tool''s digest covers its annotation and checkpoint maximum age),
    refusals and the layer''s own failures included, carry `recorded_by`; one adapter is one scope.
    Tests: tests/test_mcp_integration.py, tests/test_tool_bindings.py (TestRecordedBy),
    tests/test_verify_audit_log.py, tests/test_toctou_race.py,
    examples/standard_agents/test/tools.test.ts, grounded.test.ts and nesting.test.ts.'
  concerns:
  - safety-enforcement
- id: ACS-56
  title: No reusable implementation or language-neutral test vectors for the §8 trust score
  priority: minor
  area: conformance
  kind: missing
  summary: §8.1 requires a true half-life decay (factor 0.5 at one half-life) with `min_trust` as a floor
    on the decay factor, and §8.3 says the lower of the class weight and the source-type weight applies.
    The only code that computes the decay is a private function of a benchmark scenario; nothing in core/src
    or grounded_agency computes a §8 score or applies the §8.3 rule, and tests/conformance holds expression,
    runtime and contrib fixtures only. An implementation in another language has no vectors to test against.
  refs:
  - spec/STANDARD-v1.1.0.md §8.1 Trust Score Calculation, lines 1209-1227
  - spec/STANDARD-v1.1.0.md §8.3 Trust Classes, lines 1241-1251
  - spec/STANDARD-v1.1.0.md §10.3 Conformance Testing, lines 1414-1431
  - benchmarks/scenarios/conflicting_sources.py _recency_weight, lines 70-87
  - grounded_agency/coordination/evidence_bridge.py module docstring, lines 1-8
  - tools/validate_canonical_schemas.py recency_factor check, lines 268-277
  quote: 'Time decay MUST be a true half-life: the decay factor for an observation of age equal to the
    configured `half_life` MUST be `0.5`.'
  searched: '`half_life`, `min_trust`, `recency`, `trust_class:`, `trust_classes`, `trust_weights` in
    core/src and grounded_agency (hits only for the identity fields `accept_trust_classes` and `always_ask_trust_classes`
    and the evidence bridge''s `min_trust_floor`); `half_life|min_trust|trust_score` in tests/conformance
    (no match).'
  proposed_change: 'Add language-neutral trust-score fixtures beside the expression fixtures: inputs (source
    type, trust class, profile overrides, age, half-life, `min_trust`, confidence) with the expected decay
    factor and weight, including the §8.3 rule that the lower of class weight and source-type weight applies.
    Run them in CI against one reference function.'
  verified: 'Read spec/STANDARD-v1.1.0.md lines 1209-1251 and 1414-1431, benchmarks/scenarios/conflicting_sources.py
    lines 60-87, grounded_agency/coordination/evidence_bridge.py lines 1-26 (propagated trust is `source_agent.trust_score
    * trust_decay`, a different score) and tests/test_validators.py lines 704-711 (the test replaces the
    formula string in the schema). Listed tests/conformance: contrib, expressions, runtime. benchmarks/tests/test_scenarios.py
    tests only the benchmark''s private `_recency_weight`.'
  status: partly_fixed
  resolution: 'New module grounded_agency/trust.py, standard library only: decay_factor (0.5 ** (age /
    half_life), floored at min_trust), static_weight (the lower of class and source weight, with profile
    `trust_class:<class>` and source keys), trust_score (the product in schemas/authority_trust_model.yaml)
    and TrustModel. Vectors tests/conformance/trust/decay.json (13), weight.json (14) and score.json (7),
    absolute tolerance 1e-12; each file lists under `not_covered` the cases section 8 leaves open, and
    no vector covers them. tests/test_trust.py runs the vectors and checks agreement with the benchmark
    scenario''s decay. Remaining: STANDARD §10.3 does not name the trust vectors (normative text, RFC).
    Field authority (§8.1) and the §8.2 strategies have no stated arithmetic and are not implemented.
    A min_trust above 0.5 (which conflicts with 0.5 at one half-life), a negative age, unknown weights
    and the composition of the factors are left open by the Standard''s text; the files list them. benchmarks/scenarios/conflicting_sources.py
    still uses its private `_recency_weight`.'
  concerns:
  - models-context-memory-security
- id: ACS-57
  title: A tool binding cannot declare the bindings it invokes
  priority: minor
  area: interop_and_bindings
  kind: idea_from_sa
  summary: 'For a workflow the step list is the validated set of what it invokes: an unknown capability
    is V101, and `invoke` targets are named and checked. ACS has no counterpart for a tool, so the effective
    flags of a tool that calls other tools cannot be computed before it runs. Standard Agents has one:
    a packed tool must declare in `uses` the targets it invokes by name, and a runtime must reject a target
    outside a supplied list. `allowed-tools` in skill frontmatter is Claude Code metadata.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.1 (line 213), §5.12 (lines 659-663), §9.2 V101 and V107 (lines 1276, 1282)
  - skills/mutate/SKILL.md frontmatter (line 7)
  - 'Standard Agent Specification: content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines
    36-44)'
  quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
    the list.
  searched: '''allowed-tools'' and ''allowed_tools'' in spec/*.md, schemas/ and core/src (no match); whole-word
    ''uses'' in spec/STANDARD-v1.1.0.md (four matches, lines 840, 1089, 1336 and 1346, none a declaration
    field).'
  proposed_change: In the tool-binding profile, let a binding list the bindings it invokes and define
    a composite's effective flags as the strictest over that list. Recommend that hosts enforce the list
    where the platform allows. Note that the list bounds named invocation only, not effects, storage or
    direct network calls, so the computed flags are a lower bound.
  verified: Read spec/STANDARD-v1.1.0.md §5.1 (lines 201-230), §5.12 (lines 659-672) and §9.2 (lines 1272-1284);
    skills/mutate/SKILL.md lines 1-9; Standard Agent Specification tools.md lines 36-44. The integration
    document names `uses` in the unnumbered paragraph that follows item 6, not in a numbered item.
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.4: `invokes` lists the bindings a composite may call; its effective
    flags include theirs transitively (V107 for an unresolved name, V105 for a cycle); a nested call the
    composite''s own code made is covered by its approval and checkpoint, keeps its other checks
    (prerequisites included) and is recorded with the call that covered it; attribution needs evidence
    the composite made the call, and a nested call outside the list is F504. The Standard Agents
    binding''s `groundedTool({invokes})` passes the names as `uses` and issues a one-shot nesting token
    per invocation; the Python loader computes the flags (its statement says it cannot see nested
    calls). Tests: examples/standard_agents/test/nesting.test.ts; fixtures invokes_transitive,
    invokes_cycle, invokes_unresolved, composite_takes_invoked_flags, nested_call_covered,
    nested_call_keeps_prerequisites and nested_call_outside_invokes.'
  concerns:
  - tools-contracts
  related:
  - ACS-39
- id: ACS-58
  title: No defined notification for newly recorded evidence
  priority: minor
  area: interop_and_bindings
  kind: missing
  summary: 'Standard 1.1.0 defines no notification for recorded evidence or for the progress of a step:
    neither ''stream'' nor ''progress'' occurs in its text. The roadmap lists ''Streaming events for real-time
    evidence collection'' and, under consideration, ''Runtime telemetry and observability hooks''. A host
    that already pushes records to clients, as Standard Agents does with message frames and custom events,
    has the transport and no ACS payload to send, so each binding would choose its own event name and
    fields.'
  refs:
  - spec/ROADMAP.md 'Runtime and ecosystem' (line 77), 'Under consideration' (line 101)
  - 'SA: content/0.2.0/specification/threads.md §5 Events (lines 324-348)'
  - 'SA: content/0.2.0/specification/threads/client-api.md §16.2 Delivery, items 3 and 9 (lines 449, 455)'
  quote: Streaming events for real-time evidence collection
  searched: 'stream, progress (case-insensitive) in spec/STANDARD-v1.1.0.md: no hit.'
  proposed_change: Define a small 'evidence recorded' notification (`event_id`, `capability`, anchor refs,
    correlation id) that a host MAY emit when it stores a canonical event or an audit record, and state
    that it is not the durable record. Document its Standard Agents form as a custom `state.emit` event,
    which is delivered at most once.
  verified: Grepped the Standard. Read spec/ROADMAP.md lines 72-104, SA threads.md lines 322-348 and SA
    client-api.md lines 445-462.
  status: fixed
  resolution: 'Standard 1.2.0 §6.6 (Notification), accepted from RFC-0008: a host MAY send an
    `acs.evidence_recorded` payload when it stores evidence records, a canonical event or audit records
    (`record_ids`, `event_id` or `action_ids`), with the anchors'' `ref`, `kind` and `digest` and the
    correlation; it is not a record, may be delivered at most once, and carries no excerpt or secret
    (`schemas/interop/evidence.schema.json` `EvidenceRecorded`). The Python stores notify `subscribe`d
    listeners once per append, outside their lock; the binding emits it through `state.emit` after a
    grounded call completes with anchors, at most once and never failing the call. Tested by
    `tests/test_evidence_store.py`, `tests/test_evidence_schemas.py` and the binding''s
    `test/evidence.test.ts`.'
  concerns:
  - evidence-audit-observability
