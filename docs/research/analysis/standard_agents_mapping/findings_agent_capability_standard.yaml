- id: ACS-20
  title: No rule for evidence capture failure outside `audit`; failed runs end without audit
  priority: important
  area: standard_text
  kind: underspecified
  summary: 'For an `audit` step a failure is signalled in band: `recorded` is a required output and a
    host error fails the step (R402). No rule covers the rest. The SDK''s evidence collector catches its
    own exceptions, the plugin hook exits 0 without `jq`, `audit_required: true` on manual trust overrides
    is defined and read nowhere, and a step returning `recorded: false` completes. Nine recovery texts
    in the reference catalog say a failed run ends and ''no audit is recorded'', while SECURITY.md §1.1
    lists ''Audit trail exists for all changes''.'
  refs:
  - schemas/capability_ontology.yaml audit.output_schema (lines 1360-1375)
  - grounded_agency/hooks/evidence_collector.py (lines 120-122)
  - hooks/posttooluse_log_tool.sh (lines 25-28)
  - schemas/authority_trust_model.yaml overrides (lines 78-81)
  - spec/SECURITY.md §1.1 Mutation Requires Checkpoint (lines 13-16)
  - schemas/workflow_catalog.yaml recovery texts (lines 430, 457, 1130, 1154, 1176, 1730, 1893, 2016,
    2036)
  quote: 'recovery: Roll back to the checkpoint taken before the fix; the run then ends with the execute
    step''s error, and no audit is recorded.'
  searched: 'audit_required in spec/, schemas/, core/src, grounded_agency/, docs/ and tools/: schemas/authority_trust_model.yaml
    line 81 only.'
  proposed_change: 'State, per capability or in a profile''s `evidence_policy`, whether ambient capture
    is best-effort or required, and that a required capture which fails fails the step with a defined
    diagnostic. Define what `audit_required` obliges and whether a workflow may ignore `recorded: false`.
    For failed runs, require a host-side record or let a workflow declare an audit step that runs on failure.'
  verified: 'Read the cited lines and counted the nine catalog texts with grep. Ran an `audit` step returning
    `recorded: false` on the reference executor: the run completed. Read skills/audit/SKILL.md line 95
    and SA hooks.md line 5 (a hook''s failures are non-fatal) and lines 430-442 (`tool_call_done` fires
    for failed calls too).'
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §6.4 separates required from best-effort capture and requires that no capture
    fails silently; an `audit` step that binds `require_record: true` fails R402, reason not_recorded,
    unless its output''s `recorded` is true (ontology 2.2.0 input); §5.19.8 gives every run a run record, an
