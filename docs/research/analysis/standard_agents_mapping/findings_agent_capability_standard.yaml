  - ACS-48
- id: ACS-21
  title: '`inference_method` is carried by no schema, and F505 is never raised'
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§3.1 says ungrounded claims ''MUST include an `inference_method` and `confidence` score'',
