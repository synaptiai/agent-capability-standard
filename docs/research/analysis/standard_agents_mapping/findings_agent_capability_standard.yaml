  - workflow-execution
  - multi-agent
- id: ACS-16
  title: '`conflicts_with` is not defined across concurrent runs or agents sharing state'
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§4.3 says conflicting capabilities "May not run concurrently" and enforces one thing: the
    two never share a `parallel_group`. The reference executor runs group members in list order, so the
    rule is static only. Concurrency that does occur is across runs: `overlap: allow_all` starts runs
    concurrently, and a delegate that is not waited for may work beside its delegator. Nothing says whether
    a `rollback` in one may overlap a `mutate` in the other on the same state. Standard Agents forbids
    concurrent flows in one thread and allows concurrency across threads.'
