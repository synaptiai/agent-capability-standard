- id: ACS-22
  title: Grounding does not require that the claimant had access to the cited evidence
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§3.1 requires a claim to be evidence-backed, not that the evidence was available to whoever
    made the claim. For executor-driven runs the Standard already tracks what a step read, through references:
    deferral (§5.14), always-ask marks (§5.17) and quorum `forbidden_inputs` (§5.16). §5.17 states the
    limit, that content a host carries into a step by other means is beyond what the executor can see.
    No rule ties an anchor to that set. On a host that assembles model context per request, a claim can
    cite a stored item the model never received.'
  refs:
  - spec/STANDARD-v1.1.0.md §3.1 Grounded Claims (line 77), §9.6 F505 (line 1325)
  - spec/STANDARD-v1.1.0.md §5.16 Quorum, `forbidden_inputs` (line 977)
  - spec/STANDARD-v1.1.0.md §5.17 Sender Identity, Always ask (lines 1077-1093)
  - 'SA: content/0.2.0/specification/hooks.md §3.4 Stored history and the request context (lines 291-306)'
  - 'SA: content/0.2.0/specification/prompts.md §1.2 Optional Properties (lines 26-27), §7 Image Context
    Management (lines 250-256)'
  quote: content a host carries into a later step by other means is beyond what the
  searched: 'anchor (case-insensitive) in spec/STANDARD-v1.1.0.md: lines 58, 65, 1126 and 1138, none about
    a step''s inputs or a model''s context.'
  proposed_change: 'When F505 is specified: for executor-driven steps, an anchor grounds a claim only
    if it refers to something the step produced or a value reachable through its references. For model-run
    steps, let the host optionally attest which evidence items were in the request, as `effective` does
    for a delegation; without the attestation the claim counts as inferred, not failed.'
  verified: 'Read the cited lines of the Standard and of the two SA pages. Listed every line of spec/STANDARD-v1.1.0.md
    that contains ''anchor'' (58, 65, 1126, 1138): none relates an anchor to what a step read.'
  status: fixed
  resolution: 'Standard 1.2.0 §3.1, §6.5 (Available evidence) and §5.20, accepted from RFC-0008: an anchor grounds a
    claim only if its producer had the evidence, and a host MUST NOT return one it knows its producer
    did not have. Under a grounding policy the executor requires an `acs:` citation to be of kind
    `record` and covered by a reference the step''s `input_bindings` make (same root, the bound path a
    prefix, an index within a bound slice counting); a host attests other evidence with `evidence_seen`
    on its `Output` response (absent attests nothing, an empty list attests nothing was seen), and
    `attested: true` makes an unattested anchor not count, so the output then stands only if marked
    inferred. A call''s argument names are what its `acs:` anchors may cite; the binding''s `seen`
    option lists only what the call received. Pinned by the coverage and attestation vectors of
    `tests/conformance/grounding/check.json` and the `grounding_acs_*`,
    `grounding_evidence_seen_mismatch` and `grounding_attested_*` runtime fixtures.'
  concerns:
  - models-context-memory-security
- id: ACS-23
