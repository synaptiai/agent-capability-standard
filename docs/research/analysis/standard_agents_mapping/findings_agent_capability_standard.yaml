  verified: 'Replayed the 175 files of tests/conformance/runtime through `_core.Run` (probe measure.py):
    final snapshot state 1,269 to 40,895 bytes, median 3,343; the trace is 43% of all bytes (median 39%
    per fixture). Read core/src/exec/mod.rs lines 414-420 and 494-517. Grepped core/src/exec for uses
    of `st.trace`: `len()` for `seq` and `push` only (machine.rs lines 169, 176).'
  status: fixed
  resolution: 'Run::take_trace and take_records shed the trace and the settled records from a run''s state while
    `seq`, record indices and action ids stay sound, and the state keeps SHA-256 chain heads over everything
