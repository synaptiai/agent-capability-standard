  - spec/STANDARD-v1.1.0.md §5.10 Triggers (lines 572-577)
  - 'docs/guides/ORCHESTRATION_EXTENSIONS.md ''Schedules'' (lines 86-90: `every` and `overlap`)'
  - core/src/cron.rs Cron (line 8), parse (line 65), matches (line 122)
  - grounded_agency/workflows/runner.py start() (line 240)
  - spec/RFC-0003-orchestration-extensions.md Non-goals (lines 70-71)
  - core/src/exec/ and grounded_agency/workflows/runner.py (no occurrence of `trigger`)
  quote: '| `attendance` | `attended` or `unattended`. Default: `manual` → attended, `invoke` → the invoker''s,
    `schedule`/`event` → unattended |'
  searched: '`trigger` (any case) in core/src/exec/*.rs, grounded_agency/workflows/runner.py and grounded_agency/_core.pyi:
    no match. `cron` in core/src/python.rs: no match. Functions in core/src/cron.rs: `parse`, `can_fire`,
    `matches` and two private field parsers; none returns a next fire time.'
  proposed_change: State in §5.10 that the host evaluates triggers and must apply the trigger's attendance,
    evaluate schedules in the declared time zone and enforce `overlap`. Define the three `overlap` values
    and the anchor of `every` there. Expose `next_fire(trigger, after_ms)` from the core in every binding,
    with fixtures, so hosts compute the same fire times.
  verified: Read spec/STANDARD-v1.1.0.md lines 562-595, docs/guides/ORCHESTRATION_EXTENSIONS.md lines
    57-122 and the function list of core/src/cron.rs; read grounded_agency/workflows/runner.py lines 235-269,
    where `start` passes its `attendance` argument, default `attended`, to the core.
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.10.2 (Evaluating Triggers) assigns trigger evaluation to the host, which
    applies the trigger''s attendance (a run an `invoke` step starts always has its invoker''s), starts one
    run per event it accepts under its sender policy and at most one per `event_id`, and starts schedule runs at their fire times as `overlap` allows; it defines
    fire times in the declared time zone (RFC 5545 §3.3.5 for clock changes), the `every` anchor (the Unix
    epoch), the three `overlap` values (a resumed run counts as in progress) and missed fire times.
    core/src/trigger.rs next_fire, exposed as _core.next_fire; grounded_agency/workflows/triggers.py
    (trigger_attendance, OverlapGate, EventGate); WorkflowRunner.start(trigger=, event=) and
