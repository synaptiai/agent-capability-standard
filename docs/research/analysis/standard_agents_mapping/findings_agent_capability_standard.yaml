    does to data already transmitted; only the send skill says the checkpoint ''is for state recovery''.
    `send` has no idempotency input: on the reference executor a `send` retried after R401 reaches the
    host twice with identical inputs under one approval. The world state schema''s `TransitionRule.rollback.inverse_effects`
    describes compensation, and `send` does not use it.'
  refs:
  - schemas/capability_ontology.yaml node send (lines 1133-1170); edges checkpoint requires send (lines
    1766-1768), checkpoint precedes send (lines 1953-1956)
  - spec/STANDARD-v1.1.0.md §3.3 (lines 85-88), §4.4 (line 187), §5.2 `retry` (line 255), §12.1 (lines
