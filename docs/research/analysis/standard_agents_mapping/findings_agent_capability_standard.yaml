  - workflow-execution
- id: ACS-47
  title: The validator cannot see a `delegate` step that continues an earlier delegation
  priority: minor
  area: standard_text
  kind: idea_from_sa
  summary: 'ACS delegates anew each time: a retry or a recovery loop delegates again, and the new call
    names the delegation it replaces. No input lets a step continue an earlier delegation, which Standard
    Agents does with persistent child threads and requires for single-instance blocking relationships.
    A host can carry a continuation reference in an `x-` input and attest `effective.fresh_context: false`,
    so the executor does not count a continued reviewer under `require_fresh_context`. The validator checks
    only the bound `fresh_context` and cannot know that the step continues one.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 762-774)
  - 'spec/STANDARD-v1.1.0.md §5.5 Consumer Contract Checking (lines 350-354: `x-` input keys reach the
    host)'
  - spec/STANDARD-v1.1.0.md §5.16 Quorum, `require_fresh_context` (line 978), counting rule (lines 987-996)
  - 'core/src/exec/quorum.rs (lines 91, 139: only an attested fresh context counts)'
  - 'SA: content/0.2.0/specification/subagents.md §3.3 Blocking and Create-or-Continue (line 110)'
  quote: A `retry` of the step delegates again, and the new capability call
  searched: 'continu, resume in spec/STANDARD-v1.1.0.md and schemas/capability_ontology.yaml: one hit,
    line 779 of the Standard (a run "may resume elsewhere"); nothing on continuing a delegation.'
  proposed_change: 'Add an optional `continues` input to `delegate` under `delegation@1`, naming an earlier
    delegate step''s `task_id`: a continued delegation has `effective.fresh_context: false`; binding `continues`
    with `fresh_context: true` is an error; a quorum with `require_fresh_context` excludes a continued
    reviewer statically. Until then, document the `x-` binding and the attestation rule.'
  verified: 'Probe delegate.py: a `delegate` step that binds `x-continues` validated with no diagnostic
    and the key reached the host in the action''s `inputs`; the same key without `x-` gave W604. Read
    spec/STANDARD-v1.1.0.md lines 753-775, 978 and 987-996 and core/src/exec/quorum.rs lines 88-140.'
  status: open
  resolution: Not changed in this round. The proposed change is to the Standard's normative text, the
    ontology or a canonical schema, which GOVERNANCE routes through an RFC; it waits for that decision.
  concerns:
  - multi-agent
