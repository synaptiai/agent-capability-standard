- id: ACS-18
  title: Checkpoint and rollback scope across a delegation is undefined
  priority: important
  area: standard_text
  kind: underspecified
  summary: '§5.13 says a run started by `invoke` ''shares the caller''s checkpoints''. Nothing equivalent
    is said of `delegate`: §5.15 defines `fresh_context`, `model_family`, `role`, `read_only` and `effective`,
    and no sentence relates a delegator''s checkpoint or `rollback` to what a delegate changes. `delegate`
    is `mutation: false` with no `checkpoint` edge, so a workflow can hand a change to another agent with
    no restore point among its own steps. A binding decides alone whether a parent''s rollback is expected
    to reach a child''s effects.'
