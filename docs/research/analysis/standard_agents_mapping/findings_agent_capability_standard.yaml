- id: ACS-61
  title: No guide maps delegation waiting style and instance caps to a host
  priority: minor
  area: documentation
  kind: missing
  summary: '§5.13 distinguishes a `delegate` that waits from one that does not, and only the waiting form
    fails automatically (R402) when the host returns `accepted` other than `true`; a plain delegate returning
    `accepted: false` completes and the run continues. No guide says how a host that has a cap on simultaneous
    delegates and a separate waiting flag, as Standard Agents has (`maxInstances`, `blocking`), reports
    them. The integration document maps a waiting delegate to `blocking: true` and is silent on caps,
    on the plain form and on create-or-continue.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 753-762)
  - core/src/exec/machine.rs fn output (lines 1437-1444)
  - schemas/capability_ontology.yaml node delegate, output_schema (lines 1503-1509)
  - schemas/workflow_catalog.yaml failure mode on `${delegate_out.accepted} == false` (lines 1686-1690)
  - docs/integrations/standard_agents.md 'Composition across agents' (line 163)
  - 'SA: content/0.2.0/specification/subagents.md §1 `maxInstances` (line 38), §3.3 (lines 106-110), §4.1
    (line 122)'
  quote: return self.exec_error("R402", "the delegation was not accepted");
  searched: 'maxInstances, max_instances, ''waiting style'', blocking (case-insensitive) in spec/, schemas/,
    docs/guides/ and docs/integrations/: no hit for an instance cap; `blocking` in the delegation sense
    only at docs/integrations/standard_agents.md line 163.'
  proposed_change: 'Documentation only. In the integration guide, map a waiting delegate to a result the
    host waits for, a plain delegate to a non-blocking child, and a cap refusal to `accepted: false` or
    an `Error` response. State that a plain delegate''s refusal fails nothing unless the workflow tests
    `accepted`, and that create-or-continue reuses an instance, which is not a fresh context.'
  verified: 'Read spec/STANDARD-v1.1.0.md lines 753-768 and core/src/exec/machine.rs lines 1437-1444.
    Ran a two-step catalog on the reference executor in which a `delegate` without `wait` returned `accepted:
    false`: the run completed and the next step ran. Read SA subagents.md lines 38, 106-110 and 122, and
    docs/integrations/standard_agents.md line 163.'
  status: fixed
  resolution: 'docs/integrations/standard_agents.md, under ''Composing grounded agents'', has a new subsection,
    ''How a delegate step maps to a host''. A waiting delegate is a result the host waits for. A plain
    delegate is a non-blocking child. A cap refusal is accepted false or an Error response. A plain delegate''s
    refusal fails nothing unless the workflow tests accepted. The subsection also covers create-or-continue
    and retries under maxInstances. For ACS-04 it gives the workaround: raise requires_approval or requires_checkpoint
    on the step, with a YAML example that the validator accepts.'
  concerns:
  - multi-agent
- id: ACS-62
  title: Modality guide trails §5.2 on `domain`; `unsupported_domain` has no machine-readable place
  priority: minor
  area: documentation
  kind: inconsistency
  summary: 'docs/guides/MODALITY_HANDLING.md (version 1.0.0, 2026-01-29) describes `domain` as ''a workflow-level
    annotation convention'' and does not cite §5.2 of Standard 1.1.0, which defines `domain` as a step
    field that the executor passes to the host. Its §1.3 shows an error with `code: unsupported_domain`,
    but a host''s `Error` response has only `code` and `message`, and for a capability call any code other
    than R401 is read as R402. The guide''s §4.2 anchor kinds also differ from the canonical `Anchor.kind`
    values.'
  refs:
  - docs/guides/MODALITY_HANDLING.md header, lines 3-5; §1.1, line 51; §1.3, lines 65-74; §4.2, lines
    613-651
  - spec/STANDARD-v1.1.0.md §5.2 Step Definition, line 260; §9.5 Runtime Errors, lines 1306-1315
  - core/src/exec/mod.rs Response::Error, lines 209-213
  - core/src/exec/machine.rs host error codes, lines 2020-2026
  - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses', line 85
  - schemas/world_state_schema.yaml types.Anchor.kind, lines 71-79
  quote: '**A note on the `domain` parameter:** The `domain` parameter used throughout this guide is a
    workflow-level annotation convention. It is not a formal property defined in the capability ontology
    schema'
  searched: '`unsupported_domain` in the repository outside dependencies: docs/guides/MODALITY_HANDLING.md
    lines 71, 81 and 83 only.'
  proposed_change: Update the guide to cite §5.2, and say in §9.5 or the host protocol that a host which
    cannot serve a step's `domain` answers R402 with the reason `unsupported_domain` in a defined place
    (a reason field on `Error`, or a fixed message prefix). Align the guide's anchor kinds with the canonical
    `Anchor.kind` vocabulary.
  verified: Read docs/guides/MODALITY_HANDLING.md lines 1-8, 45-78 and 613-655, spec/STANDARD-v1.1.0.md
    lines 260 and 1306-1315, core/src/exec/mod.rs lines 209-213 (`Error` has `code` and `message`) and
    core/src/exec/machine.rs lines 2020-2026 (R401 is kept, R406 is kept on a wait, any other code becomes
    R402).
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.19.7 (Error Reasons): an `Error` may carry a `reason` token
    (unsupported_capability, unsupported_domain, not_recorded and the other defined tokens, or an `x-`
    vendor token); any other value is ignored, as 1.1 ignored the member; the reason travels to the step''s
    trace, the run''s Failed action and the record''s `reason_code`. The core reads it (exec Reason), the
    runner''s HostCannotServe sends it, and docs/guides/MODALITY_HANDLING.md §1.3 uses `unsupported_domain`.
    Fixtures error_reason_unsupported_domain, error_reason_with_retry, error_reason_outside_grammar_ignored;
    core/tests/runtime.rs reason_grammar and reason_outside_grammar_is_ignored. RFC-0006 Part B, decision
