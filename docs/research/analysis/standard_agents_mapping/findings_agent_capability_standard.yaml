- id: ACS-39
  title: No classification rules for multi-capability, input-dependent and control-only tools or for remote
    writes
  priority: important
  area: interop_and_bindings
  kind: missing
  summary: 'The Standard has no rule for classifying a tool that performs several capabilities, whose
    capability depends on its arguments, or that only signals control. Sources outside it disagree on
    a write to a remote system: the SDK''s Bash classifier maps `git push` to `mutate`, `curl -X POST`
    to `send`, and an unrecognised command to `mutate`; a non-normative analysis calls POST `send`. The
    OASF adapter aggregates only risk and `requires_checkpoint` over a composition. `mutate` and `send`
    carry the same flags, but `requires` edges and audit records name the capability.'
  refs:
  - spec/STANDARD-v1.1.0.md §3.4 (lines 95-98), §12.1 (lines 1524-1545)
  - grounded_agency/capabilities/mapper.py patterns (lines 15-27, 55-67), classifier (lines 377-516)
  - grounded_agency/adapters/oasf.py translate (lines 178-208)
  - docs/methodology/REJECTED_CANDIDATES.md §5.2 (line 572; non-normative)
  - schemas/capability_ontology.yaml `mutate` (lines 1095-1101), `send` (lines 1133-1139)
  - 'Standard Agent Specification: content/0.2.0/getting-started/examples.md (lines 426-483; non-normative
    example)'
  quote: '**Analysis**: This is an implementation of `retrieve` (GET), `send` (POST), or `mutate` (changes
    to state).'
  searched: Whole-word 'tool', 'tools', 'control-only' and 'composite' in spec/STANDARD-v1.1.0.md (no
    match).
  proposed_change: 'In the tool-binding profile: let a binding declare additional capabilities, with effective
    flags the strictest across all four flags; allow a per-call classifier that falls back to the declared
    worst case on input it does not recognise; add a control-only marker; and give a decision table for
    `mutate` versus `send` and `persist` versus `mutate` that settles remote writes.'
  verified: 'Ran the mapper on Bash commands: `git push origin main` maps to `mutate`, `curl -X POST ...
    -d` to `send`, and `gh issue comment 5 --body hi`, which no pattern recognises, to `mutate`. Read
    grounded_agency/adapters/oasf.py lines 57-64 and 155-208 (the result holds `requires_checkpoint` and
    `max_risk` only), docs/methodology/REJECTED_CANDIDATES.md lines 548-580 and STANDARD §12.1; loaded
    the ontology with PyYAML and compared the flags of `mutate`, `send` and `persist`. The cited Standard
    Agents example, `close_as_duplicate`, posts a comment and closes an issue in one call (the record
    describes it as labelling and commenting).'
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.3 classifies a call by its effect, with a table that answers which
    capability a remote write, a write to the agent''s own store, a message to a delegate and a stop
    tool are; `additional_capabilities` takes the strictest flags and every prerequisite; a `classifier`
    may narrow a call to what its arguments do, never below each returned capability''s flags; a call
    is `rollback` only when it restores a checkpoint taken in the scope; a control-only tool is never
    refused and is recorded, and a host action tied to a tool that can be refused is F506. The Python
    mapper classifies Bash by command (a compound line takes the strictest of its commands; `git stash`
    forms by class, `pop|apply <commit>` a rollback only for a commit a checkpoint recorded) and binds
    `Skill` as `invoke`; a grounded MCP server serves a control-only tool unguarded; the Standard Agents
    binding has `additional_capabilities` and `controlTool`, and its lint reports F506. Tests:
    tests/test_bash_classification.py, tests/test_mcp_integration.py (TestGroundedServerGuard),
    examples/standard_agents/test/tools.test.ts; fixtures additional_strictest, gated_control_action,
    control_action_ok, additional_capability_strictest and control_tool_ungated.'
  concerns:
  - tools-contracts
  related:
  - ACS-57
- id: ACS-40
  title: The evidence store has no host-neutral contract
  priority: important
  area: interop_and_bindings
  kind: missing
  summary: Evidence collected outside workflow steps goes to the Python `EvidenceStore`, which holds at
    most 10,000 anchors in process memory and evicts by priority; coordination events go to a bounded
    in-memory deque. No file under spec/ mentions an evidence store, so a binding in another language
    has no interface to implement. For workflow runs the sink is whatever implements the `audit` capability,
    reached through the host. The TypeScript reference binding keeps its own trace in the Standard Agents
    thread store, in a shape of its own.
  refs:
  - grounded_agency/state/evidence_store.py class EvidenceStore (lines 316-353)
  - grounded_agency/coordination/audit.py class CoordinationAuditLog (lines 71-79)
  - grounded_agency/workflows/runner.py Host.invoke_capability (lines 76-80)
  - examples/standard_agents/src/acs/records.ts TraceEntry and appendTrace
  - spec/ROADMAP.md 'Standards and scale' (line 86)
  - 'SA: content/0.2.0/infrastructure/runtime.md ''14. Durable Key-Value Store'' §14.1 Runtime Semantics,
    items 1 and 4 (lines 350, 353)'
  quote: In-memory store for evidence anchors with bounded size.
  searched: '''evidence store'', evidence_store, EvidenceStore (case-insensitive) in spec/*.md: no hit.'
  proposed_change: Specify a storage-neutral evidence store interface (append, get by id, list by capability,
    kind and run, export) with a stated durability expectation, and state that an audit sink is whatever
    implements the `audit` capability. Align the reference binding's thread-store trace with the interface,
    and let the Python store accept a persistent backend.
  verified: Read the cited lines of the Python SDK, the runner and the reference binding, and SA runtime.md
    lines 344-362.
  status: fixed
  resolution: 'Standard 1.2.0 §6.6 (Evidence Records and Stores), accepted from RFC-0008: an evidence record (an
    anchor with `run_id`, `frame`, `step`, `capability`, `tool`, `call_id`) and the duties of an
    implementation that offers a store (append only, ids never reused, get, filter by capability, kind
    and run, JSON Lines export, stated durability and bound, removals counted); evidence records are not
