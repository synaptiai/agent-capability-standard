  - spec/CONFORMANCE.md coverage gaps (lines 107-110)
  - core/src/diag.rs (line 80)
  - grounded_agency/errors.py (line 77)
  - core/src/exec/machine.rs (lines 450-454)
  quote: Every claim MUST be evidence-backed or explicitly marked as inferred. Ungrounded claims MUST
    include an `inference_method` and `confidence` score.
  searched: 'inference_method in every .md, .yaml, .py, .rs, .json, .ts and .sh file of the repository
    outside _archive/, node_modules and build output: spec/STANDARD-v1.1.0.md line 77, spec/STANDARD-v1.0.0.md
    line 57 and spec/SECURITY.md line 53 only. F505, ProvenanceMissing, PROVENANCE_MISSING in core/src,
    grounded_agency/, tools/ and scripts/: the two declarations only. require_grounding outside schemas/profiles/:
