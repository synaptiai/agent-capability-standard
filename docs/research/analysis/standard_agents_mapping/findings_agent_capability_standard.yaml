  - grounded_agency/errors.py (lines 1-12, 73-74)
  - '@standardagents/spec 0.45.10 dist/index.d.ts ToolResult `error_code`, `error_data` (lines 211-236)'
  quote: 'Diagnostics MUST be returned in this format:'
  searched: '''F501'', ''F502'' and ''F503'' in grounded_agency/adapter.py, grounded_agency/state/*.py
    and hooks/*.sh (no match).'
  proposed_change: 'Keep §9.8 unchanged and add a convention for a tool-call denial: `location` carries
    `capability` and `tool` and no `workflow` or `step`, and the code and name open the human-readable
    message for channels that carry only text. Change the adapter''s deny reason and the hook''s message
