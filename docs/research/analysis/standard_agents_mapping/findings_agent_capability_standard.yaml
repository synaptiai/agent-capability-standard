  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 809, 820)
  - docs/guides/ORCHESTRATION_EXTENSIONS.md (line 312)
  - schemas/workflow_catalog.schema.json (line 438)
  - schemas/world_state_schema.yaml (lines 398-402)
  - core/src/validate/approval.rs (line 110)
  - core/src/exec/machine.rs (lines 758-762, 1013, 2150)
  quote: '| `mode` | `in_session` (default) or `out_of_band` |'
  searched: '''in_session'' and ''out_of_band'' in spec/, docs/guides/, schemas/, core/src and grounded_agency/
    (eleven lines: STANDARD 809 and 820, ORCHESTRATION_EXTENSIONS 312, workflow_catalog.schema.json 438,
    world_state_schema.yaml 401 and 402, machine.rs 761, 1013 and 2150, approval.rs 110 and a test at
    387); ''in-session'' and ''out-of-band'' in spec/RFC-0003-orchestration-extensions.md and docs/guides/
    (no match).'
  proposed_change: 'Define both values in §5.14: `in_session` is asked of the party attending the run
    through the run''s own channel; `out_of_band` is asked through a separate channel and may outlive
    the session. Say whether an unattended run may put an `out_of_band` request to a human approver instead
    of applying `when_unattended` at once.'
  verified: Ran the greps listed under searched and read each matching line. In core/src/exec/machine.rs
    the value is read at line 761 for the request and at lines 1013 and 2150 for the record, each with
    the default `in_session`, and nowhere else.
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.14 ("Modes") defines `in_session` (the party attending the run, in its
    session) and `out_of_band` (a separate channel whose approvers need not attend the run), says the mode
    changes neither the shown values, the digest nor which decisions are valid, and keeps the 1.1 rule that
    a human approver is never asked in an unattended run; out-of-band approval of an unattended run''s
    action is `defer_to_queue` and resumption (§5.14.1). schemas/workflow_catalog.schema.json and
