- id: ACS-Q15
  question: Is `acs` the final annotation key on a Standard Agents tool, or will it be replaced by a name
    the project controls, such as an npm package name or a domain name?
  refs:
  - schemas/interop/standard_agents_annotation.schema.json `description` (line 5)
  - examples/standard_agents/src/acs/grounded.ts `ANNOTATION_KEY`
  - 'SA: content/0.2.0/specification/tools.md §8 Annotations (lines 125, 143)'
  depends: The key every annotated tool carries and every reader looks up. A rename after packages are
    published leaves their tools unclassified to a reader of the new key.
