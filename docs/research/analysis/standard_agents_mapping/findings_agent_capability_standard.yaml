    the modality guide and the validator''s messages. core/src/validate/groups.rs; validator fixtures
    pass_join_unknown_warns and pass_group_mate_read_warns; runtime fixtures parallel_group_list_order,
    parallel_group_unknown_join and parallel_group_member_fails. RFC-0006 Part B, decision B8.'
