- id: ACS-34
  title: No call for the next wake-up time and no event-driven host recipe
  priority: important
  area: executor_and_validator
  kind: missing
  summary: '`WorkflowRunner.drive` is a blocking polling loop. A turn-based host must return between events
    and set a timer from the pending action''s `until`, `deadline` or `expires_at`. The exact boundaries
    differ and are not documented: `tick` ends a `Sleep` at `until`, but times out an action only after
    its deadline, which is why the runner sleeps to `deadline + 1`. A liveness `interval` reaches the
    host inside `liveness`, and the executor does not act on it. No guide describes driving a run from
    discrete events.'
  refs:
  - grounded_agency/workflows/runner.py drive() (lines 312-364; wake-up computation at lines 348-358)
  - 'core/src/exec/machine.rs tick() (line 2122: `>= *until`; lines 2134 and 2163-2164: `> d`)'
  - core/src/exec/mod.rs Body::AwaitEvent `liveness` (line 153), Body::Sleep (lines 156-158)
  - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 90-91), 'Driving a run yourself' (line
    268)
  - 'spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (line 713: `liveness`)'
  quote: until = min(until, deadline + 1)
  searched: 'wake, timer, event-driven, event driven, turn-based in docs/guides/*.md, core/src/exec/*.rs,
    grounded_agency/workflows/runner.py and grounded_agency/_core.pyi: one unrelated hit (docs/guides/RUNNING_WORKFLOWS.md
    line 188, a step that wakes after a delay).'
  proposed_change: 'Add `Run.wake_at()`: the earliest time at which `tick` would change the run, or none,
    and state that liveness probing stays the host''s schedule. Document the `tick` boundaries. Add an
    event-driven host recipe to the guide (persist after every submit, one writer, re-arm a timer each
    turn, inbound messages as wake-ups) with runtime fixtures driven that way.'
  verified: 'Read grounded_agency/workflows/runner.py lines 312-364 and core/src/exec/machine.rs lines
    2113-2170. Probe boundary.py restored a snapshot at the first deadline-bearing action of each kind
    and ticked at the deadline and one millisecond later: `InvokeCapability`, `AwaitEvent` and `RequestApproval`
    were unchanged at the deadline and changed after it; `Sleep` changed at `until`.'
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.19.3 (Time) states the tick boundaries (a Sleep ends at `until`; an action
    times out after its deadline, an answer at the deadline is in time), the wake-up time, and that liveness
    is the host''s to watch. Run::wake_at and _core.Run.wake_at; WorkflowRunner.advance (one turn of an
    event-driven host, a Turn with the wake-up time) and drive as a loop of turns; the event-driven recipe
    in docs/guides/RUNNING_WORKFLOWS.md. Fixtures wake_at_* with `wake_at` and `tick`/`changed` entries;
    every harness checks at every tick of every fixture that it changed the run exactly when its time
    reached the wake-up time. RFC-0006 Part B, decision B5.'
