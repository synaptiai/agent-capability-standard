- id: ACS-31
  title: No stated host obligations for single writer, snapshot persistence, idempotency and interruption
  priority: important
  area: executor_and_validator
  kind: underspecified
  summary: 'Nothing states what a host must guarantee: one writer per run, when to persist the snapshot,
    or what follows a crash between a side effect and `submit`. A restored run returns the same pending
    action, so side effects are at-least-once. The reference runner calls a host method again while it
    returns `None`, and its `Host` interface has no notice that an action timed out. `Action` carries
    an `id` and no run id, so a host composes its own idempotency key. A Standard Agents client stop aborts
    a running execution.'
  refs:
  - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 94-97), 'Driving a run yourself' (lines
    264-268, 278-279)
  - core/src/exec/mod.rs Action (lines 93-99), Run::next (lines 637-644)
  - core/src/exec/machine.rs record() (line 195), emit() (lines 240-247), tick() (lines 2163-2168)
  - grounded_agency/workflows/runner.py drive() (lines 312-364)
  - spec/STANDARD-v1.1.0.md §12.1 When to Use Checkpoints (line 1532)
  - 'SA: content/0.2.0/specification/threads/client-api.md §15 Stopping Execution (line 404), §10 Deleting
    a Thread (lines 294, 296)'
  quote: 'action = run.next() # same action until it is answered'
  searched: 'idempot, at-least-once, at least once, exactly once, single writer, one writer, crash, concurren
    in spec/, schemas/, docs/guides/, core/src and grounded_agency/. Hits: spec/STANDARD-v1.1.0.md line
    1532 (the §12.1 decision tree for workflow authors); grounded_agency/adapter.py line 802 and grounded_agency/state/checkpoint_tracker.py
    lines 235 and 557 (the tool-call adapter''s own file and lock); and `concurren` for parallel groups
    and trigger overlap. None states an obligation of a workflow host.'
  proposed_change: 'Add host obligations to the host protocol text: one writer per run; persist the snapshot
    after each `submit`, before the next action; make side effects idempotent under run id plus `action.id`,
    because an action can be issued again after a restore; put `run_id` on every action; state that a
    timed-out action is not announced, and what follows an aborted execution.'
  verified: 'Read grounded_agency/workflows/runner.py lines 312-364, core/src/exec/mod.rs lines 93-99
    and 637-644, and machine.rs lines 184-211, 240-250 and 2113-2170. Replayed the 175 runtime fixtures
    with a snapshot and restore before every scripted step (probe measure.py): the restored run returned
    the identical pending action, id included, at 968 of 968 points.'
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.19.4 states the host''s obligations (one writer, save after every change and
    before acting, at-least-once delivery idempotent under the delivery key (`run_id`, `id`), interrupted
    turns) and integrity (the executor detects corruption and, given a key, refuses a state whose MAC fails;
    a host whose stored states others can change uses a key); §5.19.2 makes `run_id` unique among the runs
    whose records or keys the host keeps. Every action carries `run_id` (host_protocol.schema.json requires
    it); Run.tick returns whether it changed the run; Host.withdraw; WorkflowRunner drive/advance/run take
    save= and key= and refuse a reused run_id. Tests test_restore_reissues_same_id_and_run_id,
    test_run_id_reuse_refused, test_drive_saves_after_every_change, test_withdraw_on_timeout; fixture
    action_has_run_id. RFC-0006 Part B, decision B3.'
  concerns:
  - workflow-execution
  related:
  - ACS-19
  - ACS-32
  - ACS-34
- id: ACS-32
  title: The host protocol has no way to end a run as cancelled
  priority: important
  area: executor_and_validator
  kind: missing
  summary: '`Run` offers `submit` and `tick` and no cancel operation, and no response means "stopped from
    outside". A host can answer most pending actions with `Error`, which can trigger the step''s retries,
    failure modes and recovery loops; `RequestApproval` accepts only a `Decision`, and `Sleep` accepts
    no response. A run therefore cannot be ended as cancelled, with the cause recorded and without recovery,
    and §9.5 has no code for it. Hosts on Standard Agents meet this through `terminate()`, the client
    stop route and thread deletion.'
  refs:
  - core/src/exec/mod.rs Outcome (lines 82-89), Response (lines 205-238), Run operations (lines 638-660)
  - core/src/exec/machine.rs submit() accepted pairs (lines 1943-1963)
  - spec/STANDARD-v1.1.0.md §9.5 Runtime Errors (lines 1306-1315)
  - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 83-92)
  - 'SA: content/0.2.0/specification/threads/client-api.md §15 Stopping Execution (lines 397-407)'
  - 'SA: content/0.2.0/specification/threads.md §8 Lifecycle (lines 467-478)'
  quote: (Body::RequestApproval { .. }, Response::Decision { .. })
  searched: 'cancel, abort, abandon in core/src/exec, grounded_agency/workflows, docs/guides, spec/STANDARD-v1.1.0.md,
    spec/RFC-0003 and spec/RFC-0004: three hits, all about cancelling a replaced delegation (core/src/exec/mod.rs
    line 113, docs/guides/ORCHESTRATION_EXTENSIONS.md line 666, spec/STANDARD-v1.1.0.md line 764).'
  proposed_change: 'Add `Run.cancel(reason, now_ms)`: it ends the run with a terminal action carrying
    a dedicated code or outcome, records the cause in the trace and on open action records, and runs no
    retry, failure mode or recovery. Alternatively state which response a host gives for each pending
    action kind. Say whether a rollback to the latest checkpoint is attempted.'
