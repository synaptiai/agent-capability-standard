  - core/tests/runtime.rs `{{digest}}` placeholder (lines 30-33)
  - tests/conformance/runtime/approval_wrong_digest.json (the only literal digest)
  - tests/conformance/approval/digests.json (generated by scripts/gen_standard_agents_binding.py; when this was verified, the vectors were the Standard Agents example's examples/standard_agents/test/fixtures/approval-digests.json, which packages/acs-core/test/canonical.test.ts replaced by reading this file in place)
  quote: canonical JSON of the shown values matches
  searched: 64-character hexadecimal literals in tests/conformance/runtime/*.json (one, all zeros, in
    approval_wrong_digest.json); '{{digest}}' in the same files (58 occurrences in 42 files); 'digest'
    and 'vector' in spec/CONFORMANCE.md (no match).
  proposed_change: State in §5.14 that the digested value is the JSON array of resolved `shows` values
    in order, the default when `shows` is absent, what is appended on a re-ask, and the lowercase hexadecimal
    encoding. Move the generated vectors to tests/conformance (input, canonical JSON, hex) and cite them
