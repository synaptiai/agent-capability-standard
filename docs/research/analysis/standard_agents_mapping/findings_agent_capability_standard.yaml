  related:
  - ACS-31
- id: ACS-35
  title: A saved run can be restored under a different actor; handoff is unrepresented
  priority: important
  area: executor_and_validator
  kind: underspecified
  summary: 'A run may be started with an `actor_identity`. The reference executor keeps it in the run
    state, so every snapshot carries it, and `restore` takes no actor. §5.17 does not say whether a party
    other than the one that started a run may resume it. On Standard Agents a handoff gives the same thread,
    with its stored state, to another agent: a target agent that restored a saved run would continue it,
    and its action records would carry the source agent''s identity.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.17 Sender Identity, 'Actor' (lines 1095-1101)
  - core/src/exec/mod.rs State.actor_identity (line 516), start() (line 608), restore() signature (lines
    684-689)
  - grounded_agency/workflows/runner.py restore() (lines 271-289)
  - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces' (lines 245-248), 'Driving a run yourself'
    (lines 258-288)
  - 'SA: content/0.2.0/specification/agents.md §5 Tool Exposure (line 128); content/0.2.0/specification/threads.md
    §1.1 Agent Assignment (line 22)'
  quote: '**Actor.** A run may be started with the identity of the agent that runs it; every action record
    then carries it as `actor_identity`, and `actor` is its `kind`.'
  searched: 'handoff, hand off, hand-off, resum in spec/STANDARD-v1.1.0.md, spec/RFC-0004-agent-identity.md,
    docs/guides/RUNNING_WORKFLOWS.md, core/src/exec/mod.rs and grounded_agency/workflows/runner.py: hits
    only on resuming a run from a snapshot; none on who may resume it.'
  proposed_change: 'State whether a run may be resumed by a party other than its starting actor. Let `restore`
    name the resuming actor and refuse a mismatch, or record the change. In the integration guide: a handoff
    ends the run; a saved run is not resumed under another actor; a new run starts with the new `actor_identity`.'
  verified: 'Probe actor.py: a run started with `actor_identity` principal `agent-a` was snapshotted and
    the snapshot state holds that identity; `Run.restore` rejected an `actor_identity` argument with TypeError;
    the restored run completed and both of its action records carry `agent-a`. Read core/src/exec/mod.rs
    lines 494-517 and 684-700.'
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.17 ("Actor"): a run keeps its actor while it continues; a restore that names
    an actor of another principal (or any actor for a run started without one) is refused; at a handoff the
    host cancels the run unless it ended `deferred`, which may be resumed under the new actor.
    `Run.restore_with` and `_core.Run.restore(actor_identity=)`, `WorkflowRunner.restore(actor_identity=)`,
    `Run.resume` with a new actor (trace `run_resumed`), which the queued records the resumption decides or
    supersedes carry; core/tests/runtime.rs restore_checks_the_actor, tests/test_runner.py, runtime
    fixtures resume_new_actor and resume_new_actor_supersedes. docs/integrations/standard_agents.md and
    schemas/interop/standard_agents_mapping.yaml state the handoff rule. RFC-0006 Part A, decision A6.'
  concerns:
  - multi-agent
- id: ACS-36
  title: 'Skill-scoped frontmatter hooks: wrong blocking exit code, model-judged checks, no host-neutral
    statement'
  priority: important
  area: plugin_hooks
  kind: defect
  summary: Six skills (audit, checkpoint, persist, rollback, send, transform) declare hooks in SKILL.md
    frontmatter, a layer neither the Standard nor SECURITY.md §5 describes. The command hooks of send,
    persist and rollback print BLOCK and `exit 1`, as does the SECURITY.md §5.3 example, while the plugin's
    own hook documents the contract as 0 to allow and 2 to block. Five skills add prompt hooks that ask
    a model to judge conditions such as approval, checkpoint existence and allowlists. A host that loads
    a skill as instructions loses the enforcement.
  refs:
  - skills/send/SKILL.md frontmatter `hooks`, lines 9-46 (`exit 1` at line 38)
  - skills/persist/SKILL.md frontmatter `hooks`, lines 10-48 (`exit 1` at lines 42 and 47)
  - skills/rollback/SKILL.md frontmatter `hooks`, line 46
  - hooks/pretooluse_require_checkpoint.sh, lines 9-11 and 30-33
  - spec/SECURITY.md §5.1 to §5.3, lines 276-298
  quote: '# Exit codes follow Claude Code''s hook contract:

    # 0 allow the tool call

    # 2 block it; the reason on stderr is shown to Claude'
  searched: '`frontmatter|skill-scoped|SKILL.md` in spec/STANDARD-v1.1.0.md and spec/SECURITY.md (no match);
    `{{tool_input` in the repository outside dependencies (the six skills only).'
  proposed_change: Use the documented blocking exit code in the skill command hooks and in the SECURITY.md
    §5.3 example; state each of the six checks as a host-neutral requirement of its capability, keeping
    the Claude Code hook as one implementation; and say in SECURITY.md which checks are enforced by code
    and which are model-judged prompts.
  verified: 'Parsed the frontmatter of all 42 skills by script: `hooks` on six; PreToolUse prompt hooks
    on checkpoint, persist, rollback, send and transform; PreToolUse command hooks on persist, rollback
    and send, with `exit 1` at skills/persist/SKILL.md lines 42 and 47, skills/rollback/SKILL.md line
    46 and skills/send/SKILL.md line 38. Read hooks/pretooluse_require_checkpoint.sh lines 1-34 (its `block`
    function exits 2) and spec/SECURITY.md lines 270-299.'
  status: fixed
  resolution: 'Standard 1.2.0 §5.18.10 states the capability checks host-neutrally, one row per
    capability the six skills'' hooks cover, with the rule that a required check is decided by code and
    a model''s judgement may only add a refusal; a host that loads a skill''s text without its hooks
    applies the checks by other means or does not cover those calls. spec/SECURITY.md §5.4 maps every
    condition of the six skills'' hooks to a §5.18.10 or §5.18.8 row or to a model-judged addition; the
