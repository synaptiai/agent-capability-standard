questions:
- id: ACS-Q01
  question: 'For a guard over tool calls outside a workflow: does §5.2.1 bind it; are `requires` and `precedes`
    evaluated over one execution, one session or the thread''s lifetime; and is a `precedes` violation,
    visible only at the later call, refused, reported or ignored?'
  refs:
  - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (line 279)
  - spec/STANDARD-v1.1.0.md §2 Terms (lines 67-68)
  - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 159-170)
  depends: The history a guard keeps and searches before each call, when that history is cleared, and
    whether a call that breaks an ordering edge is refused with V102 or only logged.
  finding: ACS-01
  answer: 'Standard 1.2.0 §5.2.1 and §5.18 bind a safety layer over calls (RFC-0005 decisions 1 and 3).
    History counts over the scope''s lifetime, which the layer names in its statement; a checkpoint''s
    power to authorise ends sooner (§5.18.6). `requires` refuses (F501, F503, V102); `precedes` is
    neither refused nor reported over calls (§5.18.5).'
- id: ACS-Q02
  question: 'Is one checkpoint per gated step normative for every host, or host-defined? If normative:
    is it consumed before the step runs (executor) or after it succeeds (SDK adapter), and with no valid
    checkpoint does a tool-call layer refuse (hook, adapter) or create one (executor)?'
  refs:
  - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88)
  - spec/STANDARD-v1.1.0.md §5.13 (lines 777-781)
  - docs/guides/RUNNING_WORKFLOWS.md 'What the executor enforces', Checkpoints (lines 145-148)
  - core/src/exec/machine.rs checkpoint() (lines 663-677)
  - grounded_agency/adapter.py PreToolUse hook (lines 612-630), PostToolUse consumer (lines 660-698)
  depends: Whether a guard marks a checkpoint used and when, whether a failed call gives it back, and
    whether a missing checkpoint yields F501 or a checkpoint taken on the caller's behalf.
  finding: ACS-02
  answer: 'Normative for every host (§5.2.2, §5.18.6; RFC-0005 decision 4). Used up when the step or
    call is allowed to start, before its effect, and whatever its outcome once started. With none valid
    the executor has its host take one (F501 if that fails); a safety layer refuses with F501 and takes
    none itself.'
- id: ACS-Q03
  question: For a tool-level guard, when a model calls one tool several times with identical arguments,
    is approval one decision per call, single use as §5.14 states for a step, or one decision per digest
    until it expires?
  refs:
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 831-833)
  - examples/standard_agents/src/acs/approval.ts consumeApproval
  depends: Whether the guard stores a used-decision marker per call or per digest, and whether a repeated
    identical call is refused with F502 until a person decides again.
  finding: ACS-03
  answer: 'One decision per call, used up when the call is allowed; an identical later call needs a new
    decision (§5.18.7; RFC-0005 decision 5).'
- id: ACS-Q04
  question: 'Which classification applies to a tool with no capability binding: non-mutating `observe`
    at medium risk, as `ToolCapabilityMapper.map_tool` returns, or the high-risk mutation the adapter
    assumes when classification raises an error?'
  refs:
  - grounded_agency/capabilities/mapper.py map_tool, unknown tool (lines 369-375)
  - grounded_agency/adapter.py `_UNCLASSIFIED_TOOL` (lines 192-200)
  - examples/standard_agents/src/acs/lint.ts lintPromptTools, `unclassified`
  depends: Whether an unbound tool runs with no check, is refused in strict mode, or needs a checkpoint.
    The reference binding reports it as a lint warning and applies no rule to its calls.
  finding: ACS-07
  answer: 'The strictest case: high risk, a mutation, a checkpoint and an approval (§5.18.2; RFC-0005
    decision 2). A host that knows the tools it offers reports one as W617 UNBOUND_TOOL.'
- id: ACS-Q05
  question: 'What may an item of a capability''s `evidence_anchors` be: a string, an `Anchor` object as
    in event_schema.yaml, or a host-defined reference such as `message:<id>`? Does an empty list satisfy
    §3.1?'
  refs:
  - schemas/capability_ontology.yaml `retrieve` output, `evidence_anchors` (lines 133-135)
  - spec/STANDARD-v1.1.0.md §6.2 Observation Requirements (lines 1123-1126)
  - spec/STANDARD-v1.1.0.md §3.1 Grounded Claims (lines 76-77)
  - templates/SKILL_TEMPLATE_ENHANCED.md (lines 50, 65, 75)
  - core/src/exec/machine.rs (line 1640)
  depends: The item type a binding emits and validates, the `ref` scheme it uses for host artefacts, and
    whether a capability output with no anchors is accepted or refused.
  finding: ACS-06
- id: ACS-Q06
  question: Is a domain profile normative? If so, do `auto_approve`, `require_review`, `require_human`
    and `block_autonomous` change effective `requires_approval` and §5.14, and what do the keys of `checkpoint_policy`
    and the level `critical` denote?
  refs:
  - spec/STANDARD-v1.1.0.md §5.1 (line 225)
  - spec/STANDARD-v1.1.0.md §8.3 (lines 1249-1251)
  - spec/STANDARD-v1.1.0.md §4.1 (line 120)
  - schemas/profiles/profile_schema.yaml risk_thresholds, checkpoint_policy (lines 35-61)
  depends: Whether a host reads a profile at all and, if it does, which steps it sends to a person, which
    capabilities it refuses to run unattended and where it takes checkpoints.
  finding: ACS-05
- id: ACS-Q07
  question: 'Which capability classifies each of: a write to a remote system through an API (`mutate`
    or `send`); a write to the host''s own durable store (`persist` or `mutate`); a message to an existing
    delegate (`delegate` or `send`); a tool that only signals control, such as a stop tool?'
  refs:
  - schemas/capability_ontology.yaml nodes `mutate` (lines 1095-1101), `send` (lines 1133-1139), `persist`
    (lines 1376-1379), `delegate` (lines 1443-1447)
  - grounded_agency/capabilities/mapper.py `_NETWORK_SEND_PATTERNS` (lines 55-57)
  - skills/send/SKILL.md frontmatter `description` (line 3)
  depends: Whether such a tool needs a checkpoint and an approval (`mutate`, `send`) or neither (`persist`,
    `delegate`), and which capability name `requires` edges and audit records carry.
  finding: ACS-39
  answer: '§5.18.3''s table (RFC-0005 decision 2): a write to a remote system that can be read back is
    `mutate`; a write to the store the host provides for the agent''s own memory is `persist`, anywhere
    else `mutate`; a message to an existing delegate is `delegate`; a tool that only signals the host is
    control-only, never refused and recorded.'
- id: ACS-Q08
  question: May a per-call classifier return, for one input, a capability with weaker flags than the tool's
    declared worst case, as the SDK's Bash classifier does for read-only commands, or does "cannot weaken"
    (§3.3, §5.2.1) extend to a tool's declaration?
  refs:
  - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (line 93)
  - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 272-277)
  - grounded_agency/capabilities/mapper.py `_classify_bash_command` (line 377)
  depends: Whether a binding gates every call of a tool by its worst case, or reads the arguments first
    and lets a read-only call through with no checkpoint or approval.
  finding: ACS-39
  answer: 'Yes (§5.18.3; RFC-0005 decision 2). A binding''s declared capability and flags are the worst
    case; a `classifier` may narrow one call to what its arguments do, never below the ontology flags of
    each capability it returns. "Cannot weaken" bounds a declaration against the ontology, not each call
    against the declaration.'
- id: ACS-Q09
  question: Do a delegator's checkpoints and `rollback` cover what a delegate changes, as an invoked run
    "shares the caller's checkpoints" (§5.13), or does a delegate that mutates take its own?
  refs:
  - spec/STANDARD-v1.1.0.md §5.13 (lines 786-790)
  - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 917-922)
  depends: Whether a parent's rollback must reach into a child's state, and whether a child agent needs
    a checkpoint tool of its own before it may mutate.
  finding: ACS-18
- id: ACS-Q10
  question: 'How does a host establish `attendance` for a model-driven thread that no trigger started:
    is a run attended when a person can answer, or only when one is present in the session at the moment
    approval is asked?'
  refs:
  - spec/STANDARD-v1.1.0.md §5.10 Triggers (line 577)
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 839-844)
  - docs/guides/ORCHESTRATION_EXTENSIONS.md 'Triggers (`triggers@1`)' (lines 68-69)
  - grounded_agency/workflows/runner.py start() (line 240)
  depends: Whether a guard asks a `human` approver and waits, or applies `when_unattended` at once (F502
    by default). On Standard Agents a human-backed side shows that someone can answer, not that someone
    is there.
- id: ACS-Q11
  question: May a canonical event's `raw` hold a payload from which the host has removed secrets, with
