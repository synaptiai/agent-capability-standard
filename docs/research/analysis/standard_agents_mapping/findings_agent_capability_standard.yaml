    step ran with, all action records and the full trace. The trace and the records only grow, and no
    size is documented. Replaying the 175 runtime fixtures, whose step outputs are tiny, gives final snapshots
    of 1.3 kB to 41 kB (median 3.3 kB), about two fifths of it trace. Turn-based hosts keep the snapshot
    in host storage between events, and Standard Agents lets a runtime cap value sizes in the thread key-value
    store.'
