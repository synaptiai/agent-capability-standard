  - approval-human
- id: ACS-13
  title: No protocol for approving and executing an action deferred by `defer_to_queue`
  priority: important
  area: standard_text
  kind: missing
  summary: '`when_unattended: defer_to_queue` leaves a `planned` action record and the run ends `deferred`;
    the terminal action lists each deferral with the `action_id` of its record. How a queued action is
    later approved and carried out is not described in the Standard, RFC-0003, the two guides or the roadmap.
    The executor''s interface offers `Run.start` and `Run.restore`, and a deferred run has ended. A host
    must decide for itself whether to run the workflow again attended or to act on the record, and whether
    the digest and `recheck` are checked again.'
  refs:
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 848-849, 880, 889-893)
  - docs/guides/ORCHESTRATION_EXTENSIONS.md (lines 348-355)
  - docs/guides/RUNNING_WORKFLOWS.md (lines 250-255)
  - grounded_agency/_core.pyi Run (lines 40-60)
  - core/src/exec/machine.rs deferred_report() (lines 966-981)
  quote: and the `action_id` of its record), so the host knows which queued actions
  searched: '''resum'', ''re-enter'', ''reenter'' and ''queued action'' in spec/STANDARD-v1.1.0.md, spec/RFC-0003-orchestration-extensions.md,
    docs/guides/ORCHESTRATION_EXTENSIONS.md, docs/guides/RUNNING_WORKFLOWS.md and spec/ROADMAP.md: ''resume''
    occurs only of waits and snapshots (STANDARD line 779, ORCHESTRATION_EXTENSIONS line 261, RUNNING_WORKFLOWS
    line 14); ''queued action'' occurs at STANDARD lines 883 and 892, ORCHESTRATION_EXTENSIONS line 399
    and RUNNING_WORKFLOWS line 255, none describing resumption.'
  proposed_change: 'Define resumption in §5.14: either a way to start a run that re-enters at a deferred
    step with a decision for its `action_id`, re-checking the digest and `recheck` before acting and then
    running the dependants, or an explicit statement that a queued action is carried out by a new attended
    run. Add a runtime fixture.'
  verified: Ran the greps listed under searched; read spec/STANDARD-v1.1.0.md lines 844-902, the `defer`
    and `queue` passages of spec/RFC-0003-orchestration-extensions.md (lines 236-311) and of both guides,
    grounded_agency/_core.pyi lines 40-68, and core/src/exec/machine.rs lines 783-862 and 967-981.
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.14.1 defines resumption: a run that ended `deferred` continues as the same
    run; its deferred steps run again, with the steps that ran ahead of them that they read and a checkpoint
    step whose invalidated checkpoint a re-entered mutation binds; a nested deferred run continues; a queued
    step is asked afresh (of a person when attended), every request naming `queued_action_id` until the step
    goes on or its action is carried out, and its `planned` record is updated in place with each decision
    and refusal; a recovery loop runs again only the steps from its target to the step that looped, a
    deferred handler among them keeping its nested run, and the resumption goes on; the queued actions of a
    run that did not end `deferred` are abandoned. `Run.resume` (core/src/exec/mod.rs, machine.rs),
    `_core.Run.resume`, `WorkflowRunner.resume`; twenty-seven `resume_*` runtime fixtures,
    core/tests/runtime.rs and tests/test_runner.py. RFC-0006 Part A, decision A5.'
  concerns:
  - approval-human
- id: ACS-14
  title: No component is assigned trigger evaluation, and no shared fire-time function exists
  priority: important
  area: standard_text
  kind: underspecified
  summary: '`triggers@1` is validated, but the reference executor and runner never read triggers. §5.10
    gives each trigger kind a default attendance and names the `overlap` values. It does not say which
    component applies them or evaluates schedules, what the `overlap` values mean (only the guide does),
    or where an `every` interval is anchored. The reference runner takes `attendance` as an argument that
    defaults to `attended`. The core parses and matches cron, has no next-fire function and exposes none
    of it to Python, so each host computes fire times independently.'
