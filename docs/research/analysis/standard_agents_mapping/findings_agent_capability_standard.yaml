- id: ACS-11
  title: The §5.14 digest input is under-specified and no conformance fixture pins a digest
  priority: important
  area: standard_text
  kind: underspecified
  summary: §5.14 says a decision must match the SHA-256 digest of the 'canonical JSON of the shown values'.
    The reference executor digests the JSON array of the resolved `shows` values, uses the step's inputs
    wrapped in an array when `shows` is absent, appends a `recheck` object when asking again, and writes
    lowercase hex, compared ignoring case. None of that is in the Standard. The runtime fixtures fill
    the digest through a `{{digest}}` placeholder, and their only literal digest is 64 zeros. Generated
    vectors exist only among the Standard Agents example's tests.
  refs:
  - spec/STANDARD-v1.1.0.md §5.14 Approval (lines 821, 829-833)
  - core/src/exec/machine.rs (lines 716-736)
