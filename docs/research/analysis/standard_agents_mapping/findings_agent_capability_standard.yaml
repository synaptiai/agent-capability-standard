  - core/src/exec/mod.rs Frame.stores, Frame.ran_inputs (lines 417-419), State (lines 494-517), snapshot()
    (lines 670-680)
  - core/src/exec/machine.rs trace() (lines 167-177)
  - docs/guides/RUNNING_WORKFLOWS.md 'Driving a run yourself' (lines 258-288)
  - tests/conformance/runtime/ (175 fixtures, replayed on the reference executor)
  - 'SA: content/0.2.0/infrastructure/runtime.md ''Durable Key-Value Store'', 14.2 Capacity and Errors
    (line 362)'
  quote: /// Everything that changes during a run, and all a snapshot holds.
  searched: 'drain, compact, prune, truncate in core/src/exec/*.rs and grounded_agency/workflows/runner.py:
    no operation that removes state (one unrelated comment, machine.rs line 45). size, bytes, grow in
    docs/guides/RUNNING_WORKFLOWS.md: no match.'
  proposed_change: Let a host move the trace, and the action records no pending step still refers to,
