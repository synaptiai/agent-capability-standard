  searched: '`parallel` in core/src/exec/: no match. `concurren` in spec/STANDARD-v1.1.0.md, spec/RFC-0003-orchestration-extensions.md
    and docs/guides/: every hit concerns one `parallel_group` (§4.3, §5.2, Appendix C, RFC-0003 lines
    83-86, 174) or trigger `overlap` (ORCHESTRATION_EXTENSIONS.md lines 90-101).'
  proposed_change: 'State in §4.3 whether `conflicts_with` applies to concurrently running runs or agents
