    when an output has no anchors and no `inference_method`, with outputs the executor builds itself exempt.
    State the rule for hosts as well as for the executor.'
  verified: 'Read the cited lines. Listed every capability output property whose name contains ''infer''
    or ''method'' by script: none. Ran the reference executor with empty `evidence_anchors` on every step:
    no diagnostic. Read schemas/profiles/profile_schema.yaml lines 76-80 (`require_grounding`).'
  status: fixed
  resolution: 'Standard 1.2.0 §3.1, §4.1.1 and §5.20, accepted from RFC-0008: `inference_method` is an optional
    string on all 36 output contracts with a vocabulary a producer SHOULD use; the extension
    `grounding@1` (a workflow `grounding` policy) and host policies given at start (covering nested
