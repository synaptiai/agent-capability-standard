- id: ACS-45
  title: The Standard does not say whether host protocol transmissions count as `send` steps
  priority: minor
  area: standard_text
  kind: underspecified
  summary: '`send` is high risk and requires a checkpoint and approval. A host also transmits data when
    it performs protocol actions that are not steps: it shows `shown` to an approver for `RequestApproval`,
    and it reports the terminal action''s outcome and outputs to whoever started the run. Neither the
    Standard nor the guide says that this traffic is outside the `send` rules. On Standard Agents both
    are outbound messages that userland code chooses to send, so a binding author has to draw the line
    alone.'
  refs:
  - schemas/capability_ontology.yaml node `send` (lines 1133-1139)
  - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88), §4.4 Safety-Critical Capabilities
    (line 187)
  - 'spec/STANDARD-v1.1.0.md §5.14 Approval (line 821: `shows`)'
  - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 88, 92)
  - 'SA: content/0.2.0/specification/handlers.md §7 The Outbound Boundary (lines 90-94)'
  quote: 'description: Transmit data to external system'
  searched: 'transmi, notif, outbound in spec/STANDARD-v1.1.0.md, spec/RFC-0003-orchestration-extensions.md,
    docs/guides/RUNNING_WORKFLOWS.md and docs/guides/ORCHESTRATION_EXTENSIONS.md: two hits, both names
    in an example workflow (ORCHESTRATION_EXTENSIONS.md lines 360, 365).'
  proposed_change: 'Add one paragraph where the host protocol is described: what a host transmits to carry
    out `RequestApproval`, `RecheckSource`, `AwaitEvent` and the terminal actions is protocol traffic,
    not a `send` step, provided it carries only the values the action names (`shown`, the outcome, the
    declared outputs). Anything else a workflow wants transmitted is a `send` or `inquire` step.'
  verified: Read schemas/capability_ontology.yaml lines 1133-1142, spec/STANDARD-v1.1.0.md lines 84-88,
    182-190 and 815-825, and the action table of docs/guides/RUNNING_WORKFLOWS.md (lines 83-92).
  status: fixed
  resolution: 'spec/STANDARD-v1.2.0.md §5.19.6 (Protocol Traffic): what a host transmits to perform an approval
    request, a recheck, a wait or a terminal action is protocol traffic, not a `send` step, and needs no
    checkpoint or approval, provided it carries only the action''s values; a host must not add other values
    of the run, and a tool that delivers it is a host action under §5.18.3. Appendix D.3 lists it;
    docs/guides/RUNNING_WORKFLOWS.md and docs/integrations/standard_agents.md apply it. RFC-0006 Part B,
    decision B11.'
  concerns:
  - workflow-execution
- id: ACS-46
  title: A workflow cannot declare its delegable agents for hosts with static composition
  priority: minor
  area: standard_text
  kind: idea_from_sa
  summary: 'A `delegate` step may compute its `agent` at run time; the reference catalog binds it to an
    element of an input list. Hosts with static composition cannot check this before the run: Standard
    Agents requires every child relationship to be declared and rejects lifecycle calls to undeclared
    ones, so such a host can refuse only when the step runs. A workflow-level `x-agents` list validates
    without a diagnostic today, but no such field is documented, and the validator has no warning for
    a `delegate.agent` that is neither a literal nor constrained.'
  refs:
  - schemas/workflow_catalog.yaml `multi_agent_orchestration`, delegate step (lines 1674-1690; `agent`
    at line 1685)
  - 'spec/STANDARD-v1.1.0.md §5.1 Catalog and Workflow Definition (lines 227-230: `x-` fields)'
  - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 904-940)
  - 'SA: content/0.2.0/specification/subagents.md §5 Lifecycle Tools (line 163)'
  quote: 'agent: "${task.agent_pool[0]: string}"'
  searched: '`x-agents` in spec/, schemas/ and docs/guides/: no match. `agents:` there occurs only as
    an input of `synchronize` (schemas/capability_ontology.yaml line 1550, schemas/workflow_catalog.yaml
    line 1703), not as a workflow field.'
  proposed_change: Document an `x-` workflow field, for example `x-agents`, that lists the agents a workflow
    may delegate to, from which a host with static composition generates its relationships. Make it a
    standard field, with a validator warning for a `delegate.agent` binding that is neither a literal
    nor constrained by it, once a second host needs the check.
  verified: 'Probe delegate.py: a workflow with `x-agents: [db-writer]` validated with no diagnostic;
    the same list under `agents` gave W604; a `delegate` step whose `agent` is `${pool[0]: string}` validated
    with no diagnostic. Read schemas/workflow_catalog.yaml lines 1674-1690 and spec/STANDARD-v1.1.0.md
    lines 222-230.'
  status: open
  resolution: Not changed in this round. The proposed change is to the Standard's normative text, the
