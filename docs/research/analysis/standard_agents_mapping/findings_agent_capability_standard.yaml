- id: ACS-50
  title: '`inquire` has no typed answer and no required key to correlate one'
  priority: minor
  area: ontology
  kind: underspecified
  summary: '`inquire` returns `questions`, each with `question`, an optional `parameter` and an untyped
    `options` array. An `enables` edge says the answer arrives through `receive`, whose output items define
    only `sender` and `sender_identity`. The ontology does not require `parameter`, although the skill''s
    checklist does. No answer shape and no question type exist, so a host cannot match an answer to its
    question from the contract. Standard Agents types the questions it puts to a model (`choice`, `score`,
