    is the qualified name of a packed entry agent; `as` defaults to the unqualified part, and relationship
    names cannot contain a slash. Map `invoke` (''Execute a composed workflow'') only when the target
    workflow is published as an entry agent; ACS''s catalog checks (W607, V105) do not apply across that
    boundary. On a prompt-backed side the child is spawned by the runtime-injected `subagent_create`,
    which runs no package code. Where a delegation needs a guard, declare that relationship and every
    other relationship on the side `hidden: true` (multi-agent#coord-20) and spawn it from a package function
    tool: a hidden relationship ''stays declared and spawnable by runtime code'' and its tool ''**MUST
