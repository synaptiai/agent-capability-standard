    - spec/ROADMAP.md 'Standard' table (lines 13-17)
    quote: '**Status:** Candidate Standard — accepted by'
  sa:
    concept: 'Licence and maturity: MIT; early-stage 0.2.0; one page marked Draft'
    refs:
