    as a Standard Agent package that offers tools (a `checkpoint` or `audit` tool) to other packages''
    prompts, because tools never cross the package boundary. Shared ACS code has to be ordinary library
    code that each agent package imports; SA 0.2.0 does not say whether it is bundled or declared as an
    npm dependency (pkg-01). Searched (STANDARD-v1.1.0.md): qualified (no match); namespace (canonical
    events, world ids and entities only).'
