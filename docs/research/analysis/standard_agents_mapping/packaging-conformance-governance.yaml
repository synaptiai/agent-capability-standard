  sa:
    concept: 'Change process: Discord for early ideas, GitHub issues and pull requests for specific changes;
      maintainers decide; no formal proposal process'
    refs:
    - src/data/community.md 'Governance' (lines 36-53)
    - README.md 'Contributing' (line 35)
    - AGENTS.md (lines 112-114 and 325-330; contributor guidance, not specification text)
    quote: A conversation or a pull request is enough to propose a change.
  explanation: 'Both are maintainer-led and accept outside proposals through GitHub. ACS is formal: a
    change to the Standard needs an RFC covering motivation, alternatives, backward compatibility and
    conformance tests; RFC structure is machine-checked (`tools/validate_rfcs.py`); and changes under
    `schemas/`, `spec/` and similar paths call for a PVC report. SA is deliberately light: ''It has no
    working groups, formal proposal process, or foundation structure of the kind you might expect from
    a large standards body.'' Its repository tracks no CONTRIBUTING file or issue templates (git ls-files
    at faccc8b). Its contributor guidance does set expectations: ''Keep specification contracts provider-
    and runtime-neutral.'', and a missing runtime capability is to be specified as a ''runtime-neutral
    primitive and its conformance requirements before a product'' depends on an implementation. SA states
    an intention to donate the specification to a steward later.'
  combined: 'Upstream: file one GitHub issue per change at standardagents/spec, each naming the page and
    section, the exact text proposed, the conformance impact, and why it helps SA users generally; keep
    ACS terms out of the proposed normative wording. Order the issues by how little design agreement each
    needs: editorial defects first (the duplicate section 14 and dangling anchors, the migration URL,
    the example range, the missing LICENSE), then alignment of text with types (ToolResult, definition
    issue codes), then new surface. Raise larger design questions on Discord first, as the Community page
    asks. Downstream: a mapping file under `schemas/interop/` follows the OASF precedent and falls under
    CONTRIBUTING.md''s ''include a **PVC report**'' rule for `schemas/`; any change to the Standard''s
    text goes through an ACS RFC.'
- id: gov-02
  relation: partial
