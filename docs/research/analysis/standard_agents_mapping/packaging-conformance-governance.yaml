    rule. Implement each ACS extension the agent uses inside package code; that code is the consumer of
    any bundled catalog and must refuse one that requires an extension it does not implement (§5.9), at
    build time and at load. Feature-detect optional SA surfaces (`if (!state.instanceEnv)`) and fail closed,
    as threads.md §2.3 asks of consumers that need a trust boundary. Inside a tool, failing closed means
    returning an error result, and the loop continues ('Tool errors **MUST** be persisted as tool results
    and **MUST NOT** crash the execution loop.'; diag-03). Declare any configuration the guard needs as
    a `required` variable, so that its absence stops execution before the guard runs.
