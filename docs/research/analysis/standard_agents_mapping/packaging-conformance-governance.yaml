- id: pkg-04
  relation: partial
  acs:
    concept: 'Classification is static data: a capability''s flags can be read from the ontology without
      executing anything'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (line 111)
    - schemas/capability_ontology.yaml (capability nodes)
    - site/src/pages/api/v1/capabilities/[value].json.ts (static JSON data API, in the site source)
    - site/src/lib/api.ts `capabilityResource` (lines 80-95)
    quote: 'A capability MUST define:'
  sa:
    concept: 'Code-free disclosure in package.json: `standardagent.parentHooks` duplicates the executable
      declaration'
    refs:
    - content/0.2.0/distribution/packaging.md 'package.json Requirements' (lines 153-185), 'PackedMeta'
      (lines 210-215), 'Discovery' (lines 255-259)
    - content/0.2.0/specification/threads/client-api.md §5 Listing Agents (lines 104-138)
    - content/0.2.0/specification/threads.md §2.1-§2.2 (lines 190-206)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2872-2888 (loadModel, loadPrompt, loadAgent)'
    quote: entry agent so a marketplace or installer can show composition effects
  explanation: 'SA recognises that an installer needs some facts before it imports package code, and solves
    this for one fact: packers MUST reproduce `parentHooks` in both `__meta.parentHooks` and `package.json.standardagent.parentHooks`.
    Nothing equivalent was found for tools. A tool''s `annotations` can be reached only by importing the
    package and awaiting the tool''s loader; the Thread Client API''s `AgentListEntry` carries no tool
    or annotation member; and `ThreadState` loads models, prompts and agents by name but has no tool loader.
    An ACS classification therefore travels with the code but is not visible at install time. Searched
    (content/0.2.0): annotation (tools.md only). Searched (content/0.2.0 and index.d.ts): loadTool (no
    match).'
  combined: Not possible within SA-defined fields in 0.2.0. A package can generate a static JSON summary
    at build time (tool name to ACS capability and effective flags). With the `exports` map the Packaging
    page shows (only `"."`), a JSON file in the tarball cannot be imported as a subpath (Node reported
    ERR_PACKAGE_PATH_NOT_EXPORTED in an experiment), so the summary needs its own `exports` and `files`
    entries, or a top-level package.json key the package owns, which can be read the way discovery step
    1 reads package.json. No SA runtime, installer or marketplace is required to read either, and a packer
    that generates package.json is not required to keep the key. See the SA gap on package-level annotations.
- id: pkg-05
  relation: partial
  acs:
    concept: 'Skills: one `skills/<name>/SKILL.md` per atomic capability (36) plus 6 composed skills,
      each with YAML frontmatter'
    refs:
    - skills/README.md 'Skill Layers' total (line 20), 'Skill Structure' (lines 148-159)
    - skills/mutate/SKILL.md frontmatter (lines 1-11)
    - 'skills/capability-gap-analysis/SKILL.md frontmatter (line 2, `name: gap-analysis-workflow`)'
    - 'skills/digital-twin-sync-loop/SKILL.md frontmatter (line 2, `name: digital-twin-sync-workflow`)'
    quote: '**Total: 36 atomic capabilities + 6 composed skills = 42 skills**'
  sa:
    concept: Agent Skills library on `ThreadState.skills` (list, get, readFile, install, setEnabled, remove)
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods, Skills table (lines 161-170), §7.4 Agent
      Skills (lines 447-465)
    - content/0.2.0/distribution/packaging.md intro (line 3), 'PackedExports Interface' (lines 136-146)
    - '@standardagents/spec 0.45.10 index.d.ts lines 1829-1880 (SkillMetadata, SkillsNamespace), 3249
      (`skills: SkillsNamespace;`)'
    quote: A skill's identity **MUST** come from its `SKILL.md` frontmatter — never from a caller-supplied
      name — and installs **MUST** validate the frontmatter against the standard.
  explanation: 'Both use the SKILL.md format. SA restates two frontmatter rules: `name` (lowercase kebab-case,
    at most 64 characters) and `description` (at most 1024); all 42 ACS files meet both (script check;
    longest description 292). Differences: (1) SA skills are a principal-scoped, server-side library,
    not package content. (2) ACS frontmatter carries keys beyond those two (`argument-hint`, `disable-model-invocation`,
    `user-invocable`, `allowed-tools`, `context`, `agent` on all 42; `layer` on 13; `hooks` on 6), and
    its `allowed-tools` values name Claude Code tools; which keys the Agent Skills standard defines was
    not checked. (3) Two directories differ from their frontmatter `name`, which is the identity under
    SA. (4) Atomic skill names are generic (`mutate`, `plan`), and SA gives an owner-scoped skill precedence
    over a shared one of the same name. Searched (packaging.md): skill (no match).'
  combined: Treat skills as an optional, user-side convenience. Where a runtime exposes `state.skills`
    (a required member in the published types; no page of the text requires it) and the principal chooses
    to install them, ACS SKILL.md files may be installed with `state.skills.install(...)`. Installs need
    mutation authorization and change the calling principal's library, so a packed agent should not install
    silently; whether install-time validation accepts the extra ACS keys is untested. Reaching the model
    is a SHOULD (progressive disclosure). No mechanism for a packed agent to declare or bundle skills
    was found, so ship any procedure text the agent relies on inside the package, as prompt text or behind
    a function tool that returns the bundled text. Do not load safety-relevant instructions by skill name.
  see_also:
  - tools-contracts#skl-01
  - models-context-memory-security#prompts-02
- id: pkg-06
  relation: acs_only
  acs:
    concept: 'Workflow catalogs and domain profiles: YAML documents validated against the ontology'
    refs:
    - spec/STANDARD-v1.1.0.md §5.1 Catalog and Workflow Definition (lines 201-230)
    - spec/STANDARD-v1.1.0.md §5.9 Workflow Extensions (lines 534-536)
    - spec/STANDARD-v1.1.0.md §11.5 Version Declaration (lines 1492-1516)
    - schemas/profiles/profile_schema.yaml
    - schemas/workflow_catalog.yaml
    - 'pyproject.toml (lines 1-15: build needs Python >=3.14 and a Rust toolchain)'
    quote: A catalog is a YAML mapping of workflow name to workflow. A top-level key
  sa:
    concept: No step-list workflow document and no policy or profile document; package contents are definition
      registries plus `__meta`
    refs:
    - content/0.2.0/distribution/packaging.md 'Entry Point Exports' (line 29), 'PackedExports Interface'
      (lines 135-147)
    - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-225)
    quote: 'The package entry point exports named registries for each definition type, plus a `__meta`
      export with package metadata:'
  explanation: 'SA 0.2.0 defines agents and prompts declaratively, but no step-list workflow document
    and no policy or profile document was found, and packaging.md does not mention data files. An ACS
    catalog or profile can therefore travel only as data compiled into the package''s code. On a prompt-backed
    side the model, not the catalog, chooses the order of tool calls, so a bundled catalog is advisory
    there. A profile should not be resolved through `state.env()`: thread-level values take precedence
    over agent defaults (''1. Thread environment variables'' is first in the resolution order), so whoever
    creates the thread could replace the policy. Searched (packaging.md): asset, data file, static, extra,
    custom, additional (no matches). Searched (content/0.2.0): workflow (prose, package ids and a GitHub
    Actions example only).'
  combined: A bundled catalog can do three things today. (1) Be validated by the ACS validator before
    packing, which brings Python >=3.14 and a Rust toolchain into the build, and be compiled in as a JSON
    or TypeScript constant; a top-level `x-` key may carry SA-specific hints, which ACS treats as vendor
    data. (2) Feed order guards inside tools from the ontology's `requires` edges, such as checkpoint
    before mutate; this is the part enforceable without an executor. (3) Be executed step by step only
    by a handler-backed side that implements the DSL itself or runs a future JavaScript or WebAssembly
    build of the reference executor; that code is then the consumer and must refuse a catalog whose `workflow_extensions.requires`
    names an extension it does not implement (§5.9). Keep the profile as a compiled constant.
  see_also:
  - published-api-extension-points#handler-01
  - safety-enforcement#exec-01
  - checkpoint-rollback-state#state-15
  - evidence-audit-observability#audit-03
  - workflow-execution#wf-04
  - workflow-execution#wf-05
  - workflow-execution#wf-22
  - workflow-execution#wf-25
  - multi-agent#coord-26
- id: pkg-07
  relation: fits
  acs:
    concept: 'Reference implementation boundary: validator and executor in a Rust core reached from Python;
      the executor performs no I/O and asks a host to act'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 3-14)
    - pyproject.toml (lines 1-15)
    - core/Cargo.toml [features] (lines 14-17)
    - core/src/validate/mod.rs line 99 (`load` takes file paths)
    - spec/ROADMAP.md 'Standards and scale' (line 86)
    quote: The executor does no I/O. It tells your code what to do next (an
  sa:
    concept: Portability requirements for packed agents
    refs:
    - content/0.2.0/distribution/packaging.md 'Portability requirements' (lines 7-25)
    - content/0.2.0/specification/threads.md §10.1 Portability (line 554)
    - content/0.2.0/specification/hooks.md intro (line 5), §5.1 (line 382)
    quote: by this specification. Packed definitions MUST NOT require private runtime
  explanation: 'SA requires a packed agent''s required behaviour to be expressible through specification
    surfaces: no private RPCs, runtime-specific storage, ''sidecar services that substitute for runtime
    behavior'', or `_notPackableRuntimeContext`. ACS obliges no one to use its reference implementation,
    so there is no conflict. The reference validator and executor are not available to JavaScript (Python
    >=3.14 plus a Rust extension; no npm or WebAssembly build); ROADMAP lists ''Multi-language SDKs (TypeScript,
    Rust, Go, Java)'' as open. In an experiment the crate type-checked for wasm32-unknown-unknown without
    the `python` feature, but it exports nothing callable and its validator loads the ontology from file
    paths. Inference: the executor''s no-I/O design suits the role `ThreadState` plays in SA. Searched
    (ACS tree outside the excluded files): wasm, webassembly (lock files and one site script only); wasm_bindgen
    in core/src (no match).'
  combined: 'Run ACS validation where the reference implementation exists, at build or CI time, before
    packing. At run time use SA surfaces by role: enforcement in a tool''s `execute` with `state.getValue`
    and `state.setValue`; observation in hooks, which cannot refuse a tool call and whose failures are
    non-fatal. A package whose core behaviour depends on an external ACS checkpoint, approval or audit
    service meets SA''s portability requirements only if the service is declared ''as part of the agent''s
    purpose rather than as a replacement for a'' missing runtime capability; a service that stands in
    for a checkpoint, approval or audit primitive SA lacks reads as such a replacement, which is an inference,
    because the text does not classify these services (workflow-execution#wf-25 and multi-agent#coord-27
    leave the question to SA). Where SA lacks a primitive the binding needs, the text asks for the primitive
    to be specified (packaging.md lines 17-19), so propose it upstream.'
  see_also:
  - published-api-extension-points#erase-01
  - safety-enforcement#trust-01
  - checkpoint-rollback-state#state-15
  - evidence-audit-observability#audit-03
  - evidence-audit-observability#retention-01
  - evidence-audit-observability#store-02
  - workflow-execution#wf-25
  - multi-agent#coord-27
  - models-context-memory-security#context-02
  - models-context-memory-security#portability-01
- id: pkg-08
  relation: partial
  acs:
    concept: 'Declared dependencies between capabilities: `requires` edges, checked by the validator (V102)'
    refs:
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88)
    - spec/STANDARD-v1.1.0.md §4.3 Edge Types and Dependency Semantics (lines 145-171)
    quote: '| `requires` | For every `to` step, some `from` step runs before it | V102 per `to` step |'
  sa:
    concept: 'Declared invocation dependencies of a function tool: `uses`, required for packed tools and
      enforced by the runtime'
    refs:
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44)
    - content/0.2.0/distribution/packaging.md intro (line 5)
    quote: A packed tool **MUST** declare the targets it invokes by name. A package **MUST** include its
      required tool dependencies. When a `uses` list is supplied, the runtime **MUST** reject an invocation
      of a target outside the list.
  explanation: 'Both are declared, machine-checked dependency lists, about different things. An ACS `requires`
    edge is an ordering rule between capabilities in a workflow: some `checkpoint` step must run before
    each `mutate`. SA''s `uses` is a call allow-list for one tool: the names it may invoke through `state.invokeTool()`
    or `state.queueTool()`. A packer reads it to decide what to include (''Packers discover a tool''s
    named invocation dependencies from its `uses` declaration.''), and a runtime enforces it by rejecting
    undeclared targets. `uses` says nothing about order, and an ACS edge says nothing about which code
    calls which. It is still the closest SA analogue of a declared prerequisite, and it applies to any
    guard tool that calls another tool by name.'
  combined: A packed ACS guard tool that calls another tool by name (for example a `mutate`-classified
    tool that invokes the package's checkpoint or audit tool) MUST list that tool in `uses`; with the
    list supplied, `invokeTool()` 'returns an error result for an undeclared target'. Generate the `uses`
    list of a guarded tool from the ontology's `requires` edges for its capability, so that the declared
    call targets and the ACS prerequisites stay in step. Ordering itself (checkpoint before mutate) is
    still enforced by the guard code (pkg-03), not by `uses`.
  see_also:
  - tools-contracts#cls-13
  - published-api-extension-points#tools-05
  - safety-enforcement#gate-03
  - workflow-execution#wf-26
- id: pkg-09
  relation: acs_only
  acs:
    concept: 'Classification is available to every safety layer: validators, executors and safety layers
      act on effective flags looked up by capability id'
    refs:
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 279-284)
    - hooks/hooks.json (PreToolUse and PostToolUse hooks of the Claude Code plugin)
    quote: Validators, executors and safety layers MUST act on effective flags. A
  sa:
    concept: 'What a tool hook receives: `HookToolCall` (id, type, function name and arguments) and `HookToolResult`;
      no access to the tool definition or its `annotations`'
    refs:
    - content/0.2.0/specification/hooks.md §5.1-§5.5 (lines 367-444), §6.2 HookToolCall (lines 465-476)
    - 'content/0.2.0/specification/threads.md §2.1-§2.2 (lines 190-206: loadModel, loadPrompt, loadAgent
      and name listings)'
    - content/0.2.0/specification/tools.md §8 (line 145)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2872-2888 (loaders), 5951-5963 (HookToolCall)'
    quote: '(state: ThreadState, toolCall: HookToolCall, toolResult: HookToolResult) => Promise<void>'
  explanation: 'In ACS every layer that acts on a step can look up its flags by capability id. In SA the
    annotation carrier of pkg-03 can be read by a runtime and by code that imports the tool''s module,
    but not through any hook argument: a tool hook receives the call''s id, name and JSON arguments and,
    afterwards, the result. `ThreadState` loads models, prompts and agents by name and has no tool loader.
    A hook in the same package can import a build-time table of classifications; a hook contributed from
    another package through `parentHooks` cannot classify the parent''s tools at all. The text lets a
    runtime read annotations (''**MAY** read keys it understands, typically to choose how it displays
    a tool call'') and gives hooks no equivalent. Searched (content/0.2.0 and index.d.ts): loadTool, getToolNames
    (no matches).'
  combined: 'Within one package: generate a constant map from tool name to its `ai.synapti/acs` annotation at build
    time and import it from the audit hook (`tool_call_done`), keyed by `toolCall.function.name`. Do not
    present a hook from an ACS-provided child package as able to classify or audit a parent''s tools by
    capability; it can record names, arguments and results only. See the SA gap on giving tool hooks the
    called tool''s annotations.'
  see_also:
