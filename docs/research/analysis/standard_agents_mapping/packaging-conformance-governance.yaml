    concept: 'Tool failure reporting: `status: ''error''` results persisted as tool messages'
    refs:
    - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 155)
    - content/0.2.0/specification/hooks.md §5.2-§5.5 (lines 386-444), §6.3 HookToolResult (lines 478-490)
    - content/0.2.0/specification/threads/runtime-streams.md §4 example (line 82)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 19, 29)
    - 'content/0.2.0/specification/threads.md §1.2.2 Methods (line 120: `ToolResult` named, not defined)'
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 114, `repeated_tool_error`)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult), 3033 (invokeTool), 5967-5984
      (HookToolResult)'
    quote: Tool errors **MUST** be persisted as tool results and **MUST NOT** crash the execution loop.
  explanation: 'ACS runtime and safety codes say why an executor stopped or refused a step. For tool results
    the SA text has no coded error model: a failed tool yields `status: ''error''` and an `error` string,
    stored as a tool message and returned to the model, and the loop continues. The value `execute` returns
    is never defined in the text; `status` and `error` appear in examples and in `HookToolResult`. The
    published `ToolResult` adds `error_code` (''Machine-readable error code for structured handling.'')
    and `error_data`; the text shows `error_code` once, in an example. `HookToolResult` has neither, and
    the message record has `tool_status` and a free-form `metadata` but no member for a code. So an ACS
    refusal does not by itself stop an SA run, and the model may try another route. Searched (content/0.2.0):
    interface ToolResult, error_data (no match); error_code (one example).'
  combined: 'Return `{ status: ''error'', error: ''F501 CHECKPOINT_REQUIRED: <message>'' }` from the tool''s
    `execute`; this is the shape the text''s examples and `HookToolResult` show. Also set `error_code:
    ''F501''` and put the ACS diagnostic in `error_data`, labelled as published types only: they reach
    a caller of `state.invokeTool()` but not hooks or stored messages. The prefix is a convention and
    is not tamper-proof: `after_tool_call_failure` ''Can return modified error or null for original.'',
    `before_store_tool_result` may transform results, and the text does not say which version `tool_call_done`
    receives. A refusal does not stop the run (diag-04). A runtime may end a run after repeated refusals:
    `repeated_tool_error` is among the reason codes runtimes SHOULD use.'
