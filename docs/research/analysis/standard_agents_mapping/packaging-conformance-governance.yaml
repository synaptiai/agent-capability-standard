    quote: The Standard Agent Specification is an early-stage open standard maintained by a team of engineers
      actively building production agents for customers.
  explanation: 'Both are open and permissively licensed, under different licences: ACS under Apache-2.0
    (LICENSE and NOTICE in the repository); SA under MIT (stated in README.md; the npm package ships a
    LICENSE file reading ''Copyright (c) 2025 FormKit Inc.''; the specification repository itself tracks
    no licence file at faccc8b). Maturity differs in kind. ACS 1.1.0 is a Candidate Standard with a supported
    previous version and a stated compatibility policy. SA calls itself early-stage, is at 0.2.0 after
    a breaking step from 0.1.0, lists one runtime (from the maintainers), and marks its Users page ''Not
    yet part of the frozen specification surface.'' Inference: that phrase implies the remaining pages
    are frozen, yet the contributor guidance says to edit the current version''s folder, so whether the
    0.2.0 text can still change is unclear (an open question).'
  combined: A package that combines ACS-derived data (Apache-2.0) with a dependency on `@standardagents/spec`
    (MIT) should carry the ACS NOTICE and state both licences; this is a factual note, not legal advice.
    Build only on SA surfaces outside the Draft Users page, and pin the commit.
- id: gov-03
  relation: acs_only
  acs:
    concept: 'Responsible disclosure: a private reporting address and a response timeline'
    refs:
    - spec/SECURITY.md §7 Responsible Disclosure (lines 329-363)
    quote: 'Please report security vulnerabilities privately:'
  sa:
    concept: No private channel for security reports found; the named channels are Discord and public
      GitHub issues and pull requests
    refs:
    - README.md 'Contributing' (line 35)
    - src/data/community.md 'How Changes Are Made' (lines 40-45)
    - git ls-files at faccc8b (124 tracked files; none named SECURITY)
    quote: '- **GitHub** is the place for specific problems and proposed changes, through issues and pull
      requests.'
  explanation: 'ACS publishes a private address for vulnerability reports and target times for acknowledgement,
    assessment and a fix. No equivalent was found for SA: the README and the Community page name Discord
    and public GitHub issues and pull requests, and the repository tracks no SECURITY file. A flaw in
    a security-relevant rule of the specification (credential grants, parent hooks that run with a parent''s
    `ThreadState`, code-execution isolation) or in the published helper package would have to be raised
    in public. This matters to a binding because ACS safety claims made on top of SA depend on those rules.
    Searched (README.md, AGENTS.md, src/data, content/0.2.0): vulnerab, responsible disclosure, security@,
    security issue, security polic, report a security (no relevant match; one unrelated use of ''vulnerability''
    in a model recommendation).'
  combined: Report defects in the ACS binding through the address in spec/SECURITY.md §7. For a suspected
    security defect in SA, ask the maintainers for a private channel before describing it, until SA names
    one. In the integration document, say which side owns each safety property, so that a reporter knows
    where to go.
- id: prov-01
  relation: fits
  acs:
    concept: 'Provenance and audit: traceability records for claims and transformations'
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms (line 60)
    - spec/STANDARD-v1.1.0.md §3.2 Auditable Transforms (lines 79-82)
    quote: '| **Provenance** | Traceability record for claims and transformations |'
  sa:
    concept: Package provenance (`PackageSignature`), hook execution provenance, and message provenance
      metadata conventions
    refs:
    - content/0.2.0/distribution/packaging.md 'Package Signature' (lines 238-251)
    - content/0.2.0/specification/hooks.md §2.4 Execution Provenance (lines 171-196)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 29), §1.1 Provenance
      Metadata Conventions (lines 40-49)
    - content/0.2.0/specification/threads.md §1.2.1 Properties (lines 40-41), §1.2.2 Methods (lines 65,
      76)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5065 (version changed at re-pack), 5669-5678 (PackageSignature),
      5727-5738 (PackedMetadata), 5918-5934 (HookExecutionSource)'
    quote: 'Each packed definition receives a signature marking its package membership:'
  explanation: 'SA records where a definition came from: `PackageSignature` holds `packageId`, `version`,
    `source` (''npm'' or ''local'') and `packedAt`, injected at load time. The interface has no digest
    or key member, so it is a membership marker and not a cryptographic signature (inference from the
    interface). The text exposes it to running code in one place: the final argument of a thread hook,
    `context.source.package`, on the `kind: ''child''` variant only, optional, with a conditional MUST
    (''present, **MUST** identify the namespace from which the child hook was loaded.''). A tool''s `execute`
    receives `ThreadState`, which carries no package identity. Closer to ACS provenance, a record about
    content, is messages.md §1.1: runtimes SHOULD set `metadata.subagent_id` and `metadata.forwarded_from`
    on messages that crossed a thread boundary. Searched (content/0.2.0): PackageSignature, packageId
    (packaging.md and hooks.md only).'
  combined: 'In ACS audit and evidence records written by package code, record `state.threadId`, `state.agentId`
    and, inside hooks, the members of `context.source` after narrowing on `kind` (`package` may be absent).
    Label package id and version in records written by tools as self-reported build constants: signatures
    are ''injected at load time, not embedded in source'', and the published types say a packer may change
    the version at pack time, so compiled-in constants can differ from the signature the runtime holds.
    The record goes to stores that any code on the thread can rewrite or delete (`setValue`, `unlinkFile`,
    `deleteMessage`), so SA surfaces give a log, not an append-only one; tamper evidence, where ACS needs
    it, has to come from the record format (for example a hash chain).'
