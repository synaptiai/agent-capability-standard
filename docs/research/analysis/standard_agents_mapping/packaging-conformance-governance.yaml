    - '@standardagents/spec 0.45.10 index.d.ts lines 2659-2680 (StopSessionOptions), 3010 (stopSession)'
    quote: '`reason` is the run''s stop reason code. Runtimes **SHOULD** use these codes'
  explanation: 'This is the nearest SA counterpart of ACS R4xx and F5xx: both record why a run stopped.
    SA''s vocabulary is open (runtimes SHOULD use the listed codes and MAY add others) and is set by the
    runtime. Package code can call `state.execution.stop()`, which ''stops the current execution loop.'',
    and `state.stopSession()`, of which the text says ''Implementations should treat this as a successful
    terminal child run for blocking and non-blocking subagent lifecycle handling.''; its reason `state_stop_session`
    settles as `idle`. No `ThreadState` method that ends a session as failed was found (`sessionFail`
    is a prompt-side tool binding), so an ACS rule that fails a run on a safety error has no direct SA
    primitive. `hook_blocked` is a listed reason, but refusing a request from a hook is only a lower-case
    ''may'' in a Note. Searched (content/0.2.0, index.d.ts): failSession (no match); sessionFail (a side
    binding, not a `ThreadState` method).'
  combined: 'Where an ACS rule requires the run to stop, call `state.execution.stop()` to stop the loop
    and `state.stopSession({ result, notifyParent })` to end the agent session, passing the ACS code in
    `result` and in `notifyParent` so that a blocking and a non-blocking parent can read it; `status`
    is left unset, because the registry field also receives the session''s own transition to `idle` or
    `failed` and the text does not say which write remains (workflow-execution#wf-12). Because ''the thread
    remains addressable and a later message starts a new session with history intact'', also persist a
    ''blocked'' record that the guarded tools check. Say plainly that the outcome is recorded as a successful
    stop: a failed-session outcome is not available to code in 0.2.0, and the text does not say whether
    tool calls already returned in the same model response are skipped. On a prompt-backed side, a `sessionFail`
    tool binding lets the model end the session as failed (reason `session_fail`).'
