    - '@standardagents/spec 0.45.10 index.d.ts lines 2809 (`runtimeStreams?`), 2947 (`instanceEnv?`)'
    quote: Runtime-specific enhancements MAY be capability-detected and optional, but the
  explanation: 'Both let a consumer cope with features it does not know, in opposite styles. ACS is declarative:
    a workflow lists the extensions it depends on, and a consumer that lacks one MUST refuse the whole
    workflow. SA is imperative for optional runtime surfaces: `runtimeStreams` and `instanceEnv` are detected
    by code that tests for the member, and `runCode`''s contract applies ''when `ThreadState.runCode`
    is exposed''. SA does declare some needs ahead of time: required variables (''`required: true` means
    execution cannot continue until a value resolves.''), invocation targets in `uses`, and `parentHooks`.
