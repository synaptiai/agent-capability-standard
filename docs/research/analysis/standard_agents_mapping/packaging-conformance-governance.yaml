# Packaging, versions, diagnostics, conformance and governance
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: packaging-conformance-governance
title: Packaging, versions, diagnostics, conformance and governance
rows:
- id: pkg-01
  relation: fits
  acs:
    concept: 'Distribution unit: a Claude Code plugin (skills directory and hooks), a Python package built
      around a Rust core, and plain schema files'
    refs:
    - .claude-plugin/plugin.json (whole file, lines 1-22)
    - pyproject.toml [build-system] and [project] (lines 1-15)
    - core/Cargo.toml [package] (line 8, `publish = false`)
    - spec/ROADMAP.md intro (lines 3-6)
    quote: '"skills": "./skills/"'
  sa:
    concept: 'Distribution unit: a packed agent, an npm package whose entry point exports definition registries
      and `__meta`'
    refs:
    - content/0.2.0/distribution/packaging.md intro (lines 3-5), 'Entry Point Exports' (lines 27-108),
      'PackedExports Interface' (lines 121-147), 'package.json Requirements' (lines 149-187), 'Visibility
      Rules' (lines 221-230)
    - content/0.2.0/specification/agents.md §6 Required Parent Hooks (lines 132-167), §7 Human-in-the-Loop
      Composition (lines 169-191)
    - content/0.2.0/specification/hooks.md intro (line 5), §5.1 tool_call_started (line 382)
    - '@standardagents/spec 0.45.10 index.d.ts line 5113 (`parentHooks` on AgentDefinition)'
    quote: Standard Agents can be packaged into self-contained npm packages, making them installable and
      distributable.
  explanation: 'ACS ships as a Claude Code plugin (plugin.json points at ./skills/), a Python package
    built with maturin around a Rust core (requires-python >=3.14; the crate sets publish = false), and
    YAML and JSON schema files. SA''s unit is an npm package whose entry point exports `agents`, `handlers`,
    `prompts`, `tools`, `models`, `hooks`, optional `effects` and `threadEndpoints`, and `__meta`. They
    fit together because they sit at different layers: ACS says what a capability is and what must hold
    around its use; SA says how an agent definition is shipped and executed. The SA text lists a packed
    agent''s dependencies as definition kinds and does not say whether ordinary library code is bundled
    into the module or declared as an npm dependency: its entry-point example imports `@standardagents/openai`,
    which the example package.json beside it does not list.'
  combined: '(a) Library form: compile ACS helper source (generated ontology constants, guard helpers)
    into the package''s own module; do not rely on a runtime resolving a third-party npm dependency of
    a packed agent, which packaging.md does not specify. (b) Agent form: an ACS-provided package whose
    entry agent sets `exposeAsTool: true` can contribute thread-scoped hooks shipped in the same package
    to a direct parent through `parentHooks`, and can offer an approval-gate child in the shape of agents.md
    §7 (an example, not a requirement). Form (b) gives opt-in observation during prompt turns only: no
    hook can refuse a tool call, hook failures are non-fatal, requirements do not propagate transitively,
    and the Visibility Rules give outside code no access to a package''s tools. Enforcement stays inside
    each tool''s own `execute` (pkg-03).'
  see_also:
  - published-api-extension-points#hooks-01
  - safety-enforcement#flags-02
  - safety-enforcement#trust-01
  - evidence-audit-observability#collect-03
  - multi-agent#coord-18
  - models-context-memory-security#hooks-01
- id: pkg-02
  relation: partial
  acs:
    concept: 'Manifest: plugin.json (name, version, description, author, homepage, repository, license,
      keywords, skills) and the ontology''s `meta` block'
    refs:
    - .claude-plugin/plugin.json (lines 2-21)
    - schemas/capability_ontology.yaml `meta` (lines 6-23)
    quote: '"license": "Apache-2.0",'
  sa:
    concept: 'Manifest: package.json `standardagent` field and "standardagent" keyword, the `__meta` export
      (`PackedMeta`), and packaging metadata on `AgentDefinition`'
    refs:
    - content/0.2.0/distribution/packaging.md 'package.json Requirements' (lines 149-187), 'PackedMeta'
      (lines 189-215)
    - content/0.2.0/specification/agents.md §2.2 Optional (line 95)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5778-5795 (PackedMeta), 5061-5083 (packageName, version,
      author, license)'
    quote: 'The `standardagent` field marks this as a Standard Agent package. Its sub-fields:'
  explanation: 'The SA 0.2.0 text requires only the `standardagent` field and the "standardagent" keyword;
    the other package.json fields are ordinary npm fields shown in a non-normative example. Agent-specific
    facts live in the sub-fields (`entryAgents`, optional `effects`, `threadEndpoints`, `parentHooks`),
    in `__meta` (`packageId`, `version`, `entryAgents`, `packedAt`, optional `description` and `parentHooks`)
    and in four `AgentDefinition` members ''consumed only when the agent is packed for distribution''.
    No package-level slot for third-party metadata was found, and the text does not say whether unknown
    `standardagent` sub-fields, extra `__meta` keys or extra entry-point exports are permitted or preserved.
    The published `PackedMeta` has no index signature, so a typed literal rejects unknown keys; declaration
    merging can add one, which the text does not offer as an extension point. Searched (packaging.md):
    annotation, additional, unknown, extension, extra, custom. Searched (content/0.2.0): unknown field,
    extra key, additional propert.'
  combined: 'Use npm fields for what they already express (`name`, `version`, `license`, and `keywords`
    including "standardagent"). An author who writes package.json by hand should set licence and author
    there: the only packer duty the text states concerns `parentHooks`, so nothing requires a packer to
    copy `license` or `author` from the `AgentDefinition`. ACS package facts (Standard and ontology versions,
    a domain profile) have no SA-defined home. They can be repeated on each function tool through `annotations`
    (pkg-03), or kept outside SA''s contract in the README or in a top-level package.json key the package
    owns. An experiment with Node showed that such a key and an extra named export are both readable,
    but SA defines neither and does not promise that a packer or runtime preserves them.'
- id: pkg-03
  relation: fits
  acs:
    concept: 'Capability classification: ontology node fields `id`, `layer`, `risk`, `mutation`, `requires_checkpoint`,
      `requires_approval`, acted on as effective flags'
    refs:
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 109-127)
    - spec/STANDARD-v1.1.0.md §5.2.1 Safety Flags (lines 270-284)
    - schemas/capability_ontology.yaml node `mutate` (lines 1095-1101)
    quote: '| `requires_checkpoint` | boolean | No | A checkpoint must precede each use (default false)
      |'
  sa:
    concept: 'Tool `annotations`: an opaque object of owner-keyed hints on a function tool definition'
    refs:
    - content/0.2.0/specification/tools.md §1 Tool Categories (lines 5-11), §8 Annotations (lines 123-146),
      §9 Conformance Notes (lines 148-156)
    - content/0.2.0/infrastructure/runtime.md §5.3 Tool Classes (lines 94-100)
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (line 23, `flowId`)
    - '@standardagents/spec 0.45.10 index.d.ts lines 412, 424, 532 (annotations), 443 and 549 (`executionMode`;
      not in the 0.2.0 text)'
    - '@standardagents/spec 0.45.10 index.js lines 145-165 (defineTool)'
    quote: '- `defineTool()` **MUST** return `annotations` unchanged on the tool definition.'
  explanation: 'SA defines no capability taxonomy or risk vocabulary for tools, only an extension object
    on function tools: ''This specification defines no annotation keys, and their meaning belongs to whoever
    owns the key.'' The carrier is guaranteed (`defineTool()` MUST return it unchanged; implementations
    MUST preserve it) and declarative only: ''Annotations **MUST NOT** change argument validation, execution,
    the tool''s results, or what is sent to the model.'' Inference: a conforming runtime may display an
    ACS classification but may not gate a call on it, so the safety layer of ACS §5.2.1 has to be package
    code. Only function tools carry annotations: prompt tools, agent tools and the runtime-injected lifecycle
    tools have none, so an ACS `delegate` classification on `subagent_create` has no carrier. Searched
    (content/0.2.0): ontolog, risk, checkpoint, rollback, evidence (no matches); taxonomy (once, in another
    sense).'
  combined: 'On each function tool, set the `ai.synapti/acs` annotation key to the object defined by `schemas/interop/standard_agents_annotation.schema.json`
    (`standard`, `ontology`, `capability`, `layer`, `risk`, `mutation`, `requires_checkpoint`, `requires_approval`).
    The annotation is self-declared disclosure; enforcement is the tool''s own `execute`, which returns
    an error result when no checkpoint record exists. That covers only locally executed function tools
    the package wrote: prompt tools, handoff agents, lifecycle tools and tools with `executionMode: ''provider''`
    (published types only) run no package code first. Scope the checkpoint record, for example by `state.execution.flowId`
    or by consuming it on use: a thread has no run boundary, and its key-value store is writable by all
    code that holds the thread''s `ThreadState`, including required parent hooks of composed children.'
  see_also:
