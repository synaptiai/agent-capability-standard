    - 'content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 114: `repeated_tool_error`)'
    quote: Tool errors **MUST** be persisted as tool results and **MUST NOT** crash the execution loop.
  explanation: 'Recovery in SA is whatever the turn owner does next: the model sees the tool error and
    decides, or handler code catches it. There is no counterpart to matching an error code, looping back
    a bounded number of times with injected context, or escalating; these stay inside the executor. (The
    stop reason `repeated_tool_error` implies runtime-defined handling of repeated errors, without a rule.)
