    naming the run. It never touches the snapshot and does not end the session: the published types make
    `stopSession` throw outside an active execution, and the text does not say whether an effect has one.
    Schedule a tick on every turn that leaves a time-bounded action pending, for the earliest of `until`,
    `deadline` and `expires_at`; never depend on cancelling the previous one; a tick that finds nothing
    due is a no-op that re-arms. A lost effect leaves the run pending until another message arrives. Units:
