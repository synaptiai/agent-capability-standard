    - content/0.2.0/getting-started/examples.md §2 and §5 (`await fetch(` at lines 115, 165, 219, 681;
      example text)
    - '@standardagents/spec 0.45.10 index.d.ts lines 5763-5766 (packaging comment), line 6528 (SPEC_VERSION)'
    quote: events, sidecar services that substitute for runtime behavior, or
  explanation: 'Options (a) and (b) need the executor inside the JavaScript process that runs handler
    or tool code. No such interface is shipped: an unmodified copy of the crate builds for wasm32-unknown-unknown
    (checked; `libc` is gated to unix), but it exports nothing callable from JavaScript, and `Context::load`
    reads the ontology and schemas from paths. A remote executor works in practice, but SA forbids packed
    definitions from requiring sidecar services that substitute for runtime behaviour, exempting an external
    service declared as part of the agent''s purpose; which clause applies is open. SA enumerates no platform
    surface for definition code (see the Standard Agent Specification findings); `WebAssembly` is mentioned
    only for the `runCode` sandbox. In ACS only the roadmap''s multi-language SDK item matched. Searched:
    wasm, wasm-bindgen, wasm32, napi, node, typescript.'
  combined: 'Today: option (d) (the executor in Python, SA reached over the client API), or a private,
    unpacked deployment in which a handler calls a self-hosted executor service. Needed for in-process
    use: an in-memory context constructor and a JSON-in, JSON-out binding over the existing crate, published
    to npm and replayed against the 175 runtime fixtures. Whether packed definition code may load WebAssembly
    is unstated in SA 0.2.0, so a binding has to name the runtimes it was tested on; a dependency-free
    TypeScript build would avoid the question. Not shipped today: a packed, portable SA agent that runs
    ACS workflows in-process.'
