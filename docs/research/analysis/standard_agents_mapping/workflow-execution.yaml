- id: wf-29
  relation: partial
  acs:
    concept: '`send` (high risk; needs a checkpoint and approval) and `inquire` (low risk) are capabilities,
      so an outbound message is a step with safety flags; messages a host emits while performing a protocol
      action (showing an approval request, reporting an outcome) are not classified'
    refs:
    - schemas/capability_ontology.yaml nodes `send` (lines 1133-1139) and `inquire` (lines 1645-1649)
    - 'spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 85-88), §4.4 Safety-Critical Capabilities
      (line 187), §5.13 Waiting for Events (lines 719-720: `wait` is not allowed on `inquire`)'
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 83-92)
    quote: '| `send` | `checkpoint` | Cannot send without prior checkpoint |'
  sa:
    concept: 'The outbound boundary: the runtime routes inbound, userland decides outbound. A handler
      speaks through `injectMessage` in its own side''s role, `notifyParent`, or a messaging tool of its
      choice'
    refs:
    - content/0.2.0/specification/handlers.md §6 Capabilities (lines 83-84), §7 The Outbound Boundary
      (lines 90-94)
    - content/0.2.0/specification/threads.md §9.3 Parent Messaging (lines 526-542)
    quote: 'This is a deliberate specification boundary: **the runtime routes inbound; userland decides
      outbound.**'
  explanation: 'SA makes every outward message userland code and attaches no policy to it; ACS makes an
    outward transmission a step that requires a checkpoint and approval. The two compose: a `send` step
    is an `InvokeCapability` that the host maps to a messaging tool, `injectMessage` or `notifyParent`,
    after the executor has obtained approval. What neither document settles is the status of messages
    the host emits while carrying out a protocol action rather than a step: showing `shown` to an approver,
    or reporting the terminal outcome to a parent. By inference they are not `send` steps, since the executor
    issues no `InvokeCapability` for them and they carry only what the workflow already exposes through
    `approval.shows` or its outputs; the Standard does not say so.'
  combined: 'Map `send` to one function tool per external surface (the `message_user` pattern) and let
    the executor''s checkpoint and approval run first. Map `inquire` to `state.injectMessage({ role: ''assistant'',
    content })` toward a human side B and leave the `InvokeCapability` pending until the reply arrives;
    `inquire` cannot declare a `wait`, so bound it with the step''s `timeout` and a tick. Keep protocol
    messages (approval prompts, outcome reports) free of data the workflow did not already designate as
    shown or as output.'
- id: wf-30
  relation: partial
  acs:
    concept: A principal is the authenticated party that delivered an item to the run, never a sender
      the item's content claims; approvers and event senders are reported by the host
    refs:
    - spec/STANDARD-v1.1.0.md §5.15 Delegation (lines 932-938), §5.14 Approval (lines 831-833), §5.17
      Sender Identity (lines 1024-1029)
    - core/src/exec/mod.rs Response::Decision and Response::Event (lines 218-236)
    quote: the principal of an item the authenticated party that delivered it to the
  sa:
    concept: 'On a handler-backed side A every source arrives as a `user`-role message: the person, the
      client API send route, child completions and `notifyParent`, and messages queued by effects and
      endpoints. No origin marker is guaranteed; the verified caller is exposed to thread endpoints only'
    refs:
    - content/0.2.0/specification/handlers.md §1 Handler Definition (line 28), §3 Execution Model (lines
      46-50)
    - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 11-38), §1.1 Provenance
      Metadata Conventions (lines 42-49), §3.2 Presentation (lines 125-130), §4 Queueing Messages (lines
      157-162)
    - content/0.2.0/specification/threads/client-api.md §1 Scope (line 11), §2 Routes (lines 18-32), §3.1
      Authentication and access (lines 41-46), §12 Sending a Message (lines 341-345, 368)
    - content/0.2.0/specification/subagents.md §2.1 The Owning Side (line 53)
    - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 100-105)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14),
      items 2-3 (lines 351-352)
    - '@standardagents/spec 0.45.10 index.d.ts lines 2119-2129 (QueueMessageInput; `metadata` at line
      2129)'
    quote: '**MUST** be the authenticated identity when the request presented credentials the runtime
      verified, and `null` otherwise.'
  explanation: ACS requires the host to attribute decisions and events to an authenticated party. SA authenticates
    callers (the send route requires one; a thread endpoint receives `auth.caller`), but the message record
    carries no sender, `silent` is a presentation flag, the provenance metadata keys are optional conventions,
    and `metadata` on a queued message exists in the published types only. A handler therefore cannot
    tell an endpoint's message from one typed by any caller with thread access, or a runtime-generated
    completion from an imitation of its English template. The durable key-value store is the one channel
    the specified client API has no route to, so records written by code are trustworthy where message
    content is not. Reasoned from the text; no SA runtime was available to test it.
  combined: 'Rule for every binding on a handler-backed side: read decisions, principals, events, child
    results and review verdicts only from key-value records written by code (an endpoint that took the
    principal from `auth.caller`), read a child''s result from the child''s own thread through `state.getChildThread(reference)`
    (multi-agent#coord-22), and treat the inbound message as a wake-up that names a key. Ignore a pointer
    with no record. Endpoints write one new key per record and never the run keys; only the handler writes
    those. A runtime that adds client routes to the store, which client-api.md §1 item 3 permits, breaks
    the assumption and must be excluded.'
