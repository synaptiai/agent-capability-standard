- id: wf-26
  relation: partial
  acs:
    concept: 'What may be invoked is fixed by the validated step list: a capability id outside the ontology
      is V101, and the executor issues `InvokeCapability` only for the capability of the current step'
    refs:
    - 'spec/STANDARD-v1.1.0.md §5.2 Step Definition (line 238), §9.2 Validation Errors (line 1276: V101)'
    - core/src/exec/mod.rs Body::InvokeCapability (lines 104-116), State.pending (line 505)
    quote: '| V101 | UNKNOWN_CAPABILITY | Capability ID not found in ontology |'
  sa:
    concept: 'Static allow-lists and relationship flags: a prompt''s `tools`, a function tool''s `uses`,
      and `optional` / `hidden` on a subagent relationship'
    refs:
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 38-44)
    - 'content/0.2.0/specification/prompts.md §1.2 Optional Properties (line 31: `tools`)'
    - content/0.2.0/specification/subagents.md §1 SubagentRelationship (lines 44-45), §5 Lifecycle Tools
      (lines 157, 163)
    - content/0.2.0/infrastructure/runtime.md §7.3 Optional + Immediate + Hidden Branches (lines 139-143)
    - 'content/0.2.0/specification/handlers.md §10 TypeScript Reference (lines 142-145: no `uses` on a
      handler)'
    quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
      the list.
  explanation: 'Both documents can fix, before anything runs, the set of things that may be invoked. ACS
    does it per run and in order: only the current step''s capability is issued. SA does it per definition
    and without order: a prompt''s `tools` list bounds what its model may call; a function tool''s `uses`
    list bounds what its code may invoke by name (MUST reject outside it; when `uses` is omitted the restriction
    does not apply); `hidden` keeps a relationship''s lifecycle tools out of every LLM request (MUST NOT
    appear); `optional` enables a relationship by environment flag (when the flag is re-read is not stated).
    None of these depends on earlier results, so they bound the surface a model can reach but cannot express
    a gate.'
  combined: 'Use them to shrink what an ACS-governed, model-driven side can do outside the executor: list
    on the prompt only the stepping tool; give that tool a `uses` list generated from the catalog''s routing
    table; declare every relationship `hidden: true` so that delegation passes through guarded code; list
    no sub-prompt or handoff agent in `tools`. A handler has no `uses` declaration (see the Standard Agent
    Specification findings), so on a handler-backed runner the allow-list exists only in the host''s own
    routing table.'
  see_also:
