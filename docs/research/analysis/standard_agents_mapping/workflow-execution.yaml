# Workflows and the executor
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
concern: workflow-execution
title: Workflows and the executor
rows:
- id: wf-01
  relation: acs_only
  acs:
    concept: 'Workflow catalog: a declarative YAML document of workflows (goal, risk, ordered capability
      steps); the reference executor refuses to start a run unless the catalog validates'
    refs:
    - spec/STANDARD-v1.1.0.md §5.1 Catalog and Workflow Definition (lines 201-230)
    - spec/STANDARD-v1.1.0.md §5.2 Step Definition (lines 232-268)
    - 'spec/STANDARD-v1.1.0.md §9.1 Categories and Severity (line 1268: validity) and §5.9 Workflow Extensions
      (lines 534-536: must-understand extensions)'
    - docs/guides/RUNNING_WORKFLOWS.md 'Quick start' (line 64; informative guide)
    - core/src/exec/mod.rs Run::start doc comment (lines 576-577)
    quote: A catalog is a YAML mapping of workflow name to workflow. A top-level key
  sa:
    concept: 'None. The order of work is decided at run time by whatever backs a side: a model following
      a prompt, or handler code'
    refs:
    - content/0.2.0/specification/agents.md intro (line 5)
    - content/0.2.0/specification/handlers.md §3 Execution Model (lines 44-55)
    - content/0.2.0/distribution/packaging.md intro (line 3)
    quote: prompts and handlers own turns, tools provide capabilities, hooks decorate turns, effects defer
      work, and subagent relationships define composition.
  explanation: 'ACS workflows are data: structure, ontology edges, typed bindings and expressions are
    checked statically. The Standard defines validity (''A workflow is valid when it has no errors.'',
    §9.1) and requires rejection only for an unimplemented extension (§5.9); the rule that an invalid
    catalog is never run belongs to the reference executor. The SA 0.2.0 text has no declarative step
    list, sequence or control-flow construct: order lives in a prompt (advisory to a model) or in handler
    code. In content/0.2.0, ''workflow'', ''orchestrat'' and ''declarative'' occur in prose only (the
    handoff description, a GitHub Actions example, a sample package name); the other terms were not found.
    Searched: workflow, pipeline, state machine, DAG, orchestrat, declarative.'
  combined: 'A catalog enters an SA runtime only as data carried by definition code: embedded in a handler
    or function-tool module together with the ontology and every schema it references (the thread file
    system is per-thread storage, and packaging.md describes no file access for definition code). Nothing
    in SA validates it, so validation runs before packaging (`python tools/validate_workflows.py`) or
    in-process once a JavaScript-callable validator exists (wf-25).'
- id: wf-02
  relation: sa_only
  acs:
    concept: None. A run is a sequence of steps driven by a host; ACS defines no conversational turn,
      side or prompt
    refs:
    - spec/STANDARD-v1.1.0.md §2 Terms (line 56)
    - schemas/capability_ontology.yaml nodes `receive` (line 212), `send` (line 1133), `inquire` (line
      1645)
    - 'spec/STANDARD-v1.1.0.md §5.14 Approval (line 820: `mode` `in_session`)'
    - schemas/workflow_catalog.yaml clarify_intent (line 196; input `conversation_context`, line 305)
    - spec/STANDARD-v1.1.0.md §5.12 Recovery and Escalation (lines 638-649) and §5.16 Quorum (lines 942-1005)
    quote: '| **Workflow** | An ordered, conditional, or parallel composition of capabilities |'
  sa:
    concept: Agent = exactly two sides, each backed by a human, a prompt or a handler; all behaviour is
      derived from the backings; prompt x prompt agents alternate until a stop binding or `maxSessionTurns`
    refs:
    - content/0.2.0/specification/agents.md intro (line 3)
    - content/0.2.0/specification/agents.md §1.3 Derivations (line 66)
    - 'content/0.2.0/specification/agents.md §8 Definition-Time Errors (lines 197 and 199: items 1 and
      3)'
    - content/0.2.0/specification/agents.md §9.2 Worker / Reviewer (line 221)
    - 'content/0.2.0/specification/threads/messages.md §4 Queueing Messages (line 166: turn forcing is
      stated for queueing)'
    quote: 'An agent has **exactly two sides**, and each side is **backed** by exactly one of three things:
      a human, a prompt, or a handler.'
  explanation: 'ACS defines no conversation, turn, side or prompt. Constructs that touch a conversation
    exist (`receive`, `send`, `inquire`; approval `mode: in_session`; the reference workflow `clarify_intent`
    with an input `conversation_context`), but none defines turns or sides. By inference, the nearest
    ACS constructs to an SA worker/reviewer exchange are a recovery loop (`goto_step`, `max_loops`) and
    a `delegate` reviewer under a `quorum` that loops; both are declared and bounded rather than conversational.
    In spec/STANDARD-v1.1.0.md and schemas/capability_ontology.yaml the only hit is the identifier `chat_user_id`
    (§5.17). Searched: conversation, turn, dialog, chat, prompt.'
  combined: 'An ACS run does not replace an SA agent; it occupies one side of one. Attended: `sideA: {
    handler: <runner> }`, `sideB: { human: true }`. Unattended: `sideB: { handler: <no-op> }`, started
    by a `user`-role message queued by an endpoint, an effect or a parent. A handler x handler agent is
    not among the §8 errors and the published `validateAgentDefinition` reports no issue for it, but 0.2.0
    shows no such agent and does not say whether a message injected in the `assistant` role invokes the
    side B handler, so the runner must not depend on side B being invoked. A prompt x prompt agent can
    implement one ACS step only behind the host''s result adapter (wf-07).'
  see_also:
  - published-api-extension-points#agent-01
  - safety-enforcement#appr-02
  - approval-human#approval-11
  - approval-human#approval-12
  - approval-human#identity-04
- id: wf-03
  relation: fits
  acs:
    concept: 'Capability implementation is left to the host: the executor names a capability and passes
      resolved inputs; how the work is done is not specified'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (line 85; informative guide)
    - spec/STANDARD-v1.1.0.md §4.1 Capability Definition (lines 109-127)
    - core/src/exec/machine.rs output() (lines 1399-1427)
    quote: '| `InvokeCapability` | runs `capability` with `inputs` (a waiting `delegate` that delegates
      again names the delegation it replaces in `replaces`)'
  sa:
    concept: 'Prompt definition: system instructions, model reference, tools, `requiredSchema`, `toolChoice`;
      usable as a side backing or as a sub-prompt tool. Function-tool `args` are validated by the runtime'
    refs:
    - content/0.2.0/specification/prompts.md intro (line 3) and §1 Prompt Definition (lines 5-38)
    - content/0.2.0/specification/prompts.md §3.3 Sub-Prompt Tool Configuration (line 131)
    - content/0.2.0/specification/prompts.md §4.2 Tool Choice Behavior (lines 192-194) and §5.2 Schema
      Usage (lines 216-218)
    - content/0.2.0/specification/tools.md §9 Conformance Notes (line 152)
    - 'content/0.2.0/specification/providers.md §2 Request Format (line 237: `responseFormat`)'
    - content/0.2.0/specification/subagents.md §6.1 Parent → Child (lines 188-191)
    - '@standardagents/spec 0.45.10 index.d.ts lines 4309-4456 (PromptDefinition; `providerOptions` at
      lines 4430-4444), line 3837 (`structuredOutputs`), line 263 (ToolArgsNode)'
    quote: A prompt defines how each request to an LLM is crafted. It specifies system instructions, a
      model reference, available tools, and behavioral configuration that shapes how the agent responds.
  explanation: 'The two meet at the capability boundary: an SA prompt with its model and tools is one
    way a host can carry out a capability such as `plan`, `critique` or `generate`. `requiredSchema` (inputs
    MUST be validated against it, prompts.md §5.2) corresponds to a capability''s `input_schema`, `toolDescription`
    to its `description`. No result schema on prompts, sub-prompts or tools was found: a sub-prompt''s
    result is one text string, and the nearest surfaces, the provider-request `responseFormat` and (published
    types only) prompt-level `providerOptions`, are not checked by the runtime against a declared contract.
    Searched: outputSchema, resultSchema, responseSchema, returnSchema, output_schema, json_schema, responseFormat,
    structuredOutputs.'
  combined: 'One child agent per model-backed capability: a side A prompt whose `requiredSchema` is generated
    from the ontology''s `input_schema` (`type: any` becomes `z.unknown()`; `z.any()` does not compile
    against the published argument types), `toolChoice: ''required''`, and one function tool `submit_<capability>`
    whose `args` schema is generated from `output_schema`. The runtime then validates the model''s output
    as tool arguments (tools.md §9, MUST) before code sees it. Not guaranteed: that the model calls the
    tool (retry is a SHOULD, prompts.md §4.2), so a session that ends without a submission is answered
    R402. The relationship needs `initUserMessageProperty`, and the child a way to end its session. Invoking
    a prompt by name from handler code is implied but its semantics are unspecified (see the Standard
    Agent Specification findings).'
- id: wf-04
  relation: fits
  acs:
    concept: 'Reference executor and Host protocol: an I/O-free state machine; the host performs each
      action and submits a response (hosting option a: a handler is the Host)'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md intro (lines 10-14) and 'Driving a run yourself' (lines 258-288)
    - core/src/exec/mod.rs module doc (lines 1-5) and Run::next, Run::submit, Run::tick (lines 637-660)
    - grounded_agency/workflows/runner.py class Host (lines 44-131)
    - schemas/workflow_catalog.yaml debug_code_change (lines 310-527)
    quote: '//! The reference executor (design-114 §16): a deterministic, sans-IO state'
  sa:
    concept: 'Handler-backed side: the runtime calls `execute(state, message)` once per inbound message
      with the full `ThreadState`'
    refs:
    - content/0.2.0/specification/handlers.md §1 Handler Definition (lines 7-28), §3 Execution Model (lines
      44-55), §4 Delivery Semantics (lines 57-67), §5 Error Semantics (lines 69-77), §6 Capabilities (line
      81)
    - content/0.2.0/specification/agents.md §1.2 SideConfig, HandlerSide (lines 49-57)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14),
      item 1 (line 350)
    - content/0.2.0/distribution/packaging.md intro (line 5)
    quote: 'A handler receives the full [`ThreadState`](/0.2.0/specification/threads) and may do anything
      tools can do:'
  explanation: 'A handler turn is the natural place to drive the executor: each inbound message wakes
    the handler, which answers the pending action if it can, asks for the next, and either performs it
    inline or arranges a later wake-up and returns. Sequencing, conditions, gates, bindings, retries,
    failure modes, recovery loops, deferral and quorums are computed by the executor and need nothing
    from SA. Guaranteed by MUST: one invocation per inbound message, in order, never concurrent (handlers.md
    §4), and durable per-thread key-value storage. Not guaranteed: effect durability and timing (wf-11),
    redelivery after a lost execution (wf-06), prompts invoked from a handler, and packaging of the tools
    a handler names only in code. The blocking `WorkflowRunner.drive` loop cannot be used.'
  combined: '`defineAgent({ name, sideA: { handler: ''acs_runner'', subagents: [...] }, sideB: { human:
    true } })` compiles against the published types. Each turn: restore the snapshot from `state.getValue`,
    `tick(Date.now())`, read decisions, events and child results from key-value records written by code
    (the inbound message is only a wake-up, wf-30), then loop on `next()`. Persist the snapshot after
    every `submit`, before the next action is performed: a failed turn is not redelivered and nothing
    it wrote is rolled back. Only the handler writes run keys. Desk-checked on `debug_code_change`: six
    read or reason steps, a `checkpoint` step, an approved `execute` under a 5-minute deadline with rollback
    on R401 or R402, and `verify` retries that arrive as `Sleep`. Needs a JavaScript-callable executor
    (wf-25).'
  see_also:
  - published-api-extension-points#handler-01
  - safety-enforcement#exec-01
  - checkpoint-rollback-state#state-15
  - evidence-audit-observability#audit-03
  - multi-agent#coord-26
  - packaging-conformance-governance#pkg-06
- id: wf-05
  relation: fits
  acs:
    concept: 'Run snapshot and resume: canonical JSON of the whole run state with SHA-256 and optional
      HMAC; restores only against the same catalog and ontology contracts'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'Driving a run yourself' (lines 264-279)
    - core/src/exec/mod.rs State (lines 494-517), Snapshot (lines 538-545), snapshot and restore (lines
      670-723), check_state comment (lines 726-727)
    - core/src/exec/program.rs Program.digest (lines 114-120)
    quote: A snapshot only restores against the catalog (and ontology) it was taken
  sa:
    concept: Durable per-thread key-value store (`getValue` / `setValue`); thread file system; persisted
      run status
    refs:
    - content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-445)
    - content/0.2.0/infrastructure/runtime.md 'Durable Key-Value Store' (the second section numbered 14,
      lines 344-362)
    - 'content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 227-234: `instanceEnv`)'
    - content/0.2.0/specification/threads/filesystem.md intro (line 3)
    - content/0.2.0/specification/threads/client-api.md §14 Reading a File (lines 383-395)
    quote: Values **MUST** be persisted to durable per-thread storage that survives execution boundaries,
      process restarts, and runtime redeploys.
  explanation: 'By inference, SA persists conversations but has no resumable program counter for code;
    ACS has exactly that and nowhere to keep it. `setValue` MUST survive restarts and redeploys and round-trip
    JSON-equivalent structure, which is all a snapshot (`state`, `sha256` and, with a key, `hmac`) needs.
    Limits: runtimes MAY cap value size, while a snapshot holds the trace, the action records and every
    stored step output; a write is only SHOULD-durable before its promise resolves. Over the 175 runtime
    fixtures, whose outputs are tiny, the final snapshot measures 1.3 kB to 41 kB (median 3.3 kB), about
    half of it trace. The file system is a weaker home: it ''survives execution cycles'' with no restart
    rule, and thread files are readable through the client API.'
  combined: '`await state.setValue(''acs.run'', run.snapshot(key))` after every `submit`, and `Run.restore(...)`
    at the start of each turn. Take the HMAC key from `state.instanceEnv?.(''ACS_SNAPSHOT_KEY'')` where
    the runtime offers that optional capability, so thread-level environment values cannot replace it;
    a snapshot without an HMAC is only self-consistent. If a runtime''s value cap forces the file system,
    require the HMAC key and refuse to run when `instanceEnv` is absent (threads.md §2.3: feature-detect
    and fail closed), keep model-driven work in child threads, whose file systems are separate, and state
    that the run state becomes readable to anyone with thread access.'
  see_also:
  - published-api-extension-points#handler-01
  - published-api-extension-points#options-01
  - published-api-extension-points#thread-07
  - safety-enforcement#exec-01
  - checkpoint-rollback-state#state-15
  - approval-human#approval-12
  - approval-human#approval-21
  - approval-human#users-01
  - evidence-audit-observability#audit-02
  - evidence-audit-observability#audit-03
  - multi-agent#coord-19
  - multi-agent#coord-26
  - packaging-conformance-governance#pkg-06
  - packaging-conformance-governance#ver-04
  - models-context-memory-security#portability-01
  - models-context-memory-security#profile-01
- id: wf-06
  relation: fits
  acs:
    concept: 'Single pending action: a response that does not answer the pending action id is refused;
      the same inputs, responses and times give the same actions. A single writer per run is an assumption
      of the reference executor that no ACS text states'
    refs:
    - core/src/exec/mod.rs Action (lines 93-99), SubmitError::WrongAction (lines 283-288), State.pending
      (line 505)
    - 'core/src/exec/machine.rs emit() (lines 240-247: action ids)'
    - docs/guides/RUNNING_WORKFLOWS.md (lines 10-14, 266, 278-279)
    quote: 'pub pending: Option<Pending>,'
  sa:
    concept: Per-thread serial execution; handler delivery exactly once per message, in order, never concurrent,
      never automatically redelivered
    refs:
    - content/0.2.0/specification/handlers.md §4 Delivery Semantics (lines 59-63) and §5 Error Semantics
      (lines 71-75)
    - content/0.2.0/infrastructure/runtime.md §1 Overview (line 10), §11 Concurrency (line 239)
    - content/0.2.0/specification/threads/execution-state.md §4.3 Requirements (line 120)
    - 'content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-433: `getValue` and
      `setValue` only)'
    - content/0.2.0/specification/threads/endpoints.md §5 Endpoint Context (line 109)
    quote: The runtime **MUST NOT** invoke a handler concurrently for the same thread.
  explanation: 'SA gives a handler-backed side the discipline the executor assumes: no concurrent invocation,
    in-order delivery, later messages wait. That holds between handler turns only: endpoints and effects
    receive the same `ThreadState` and can write the key-value store, which has no compare-and-set. The
    mismatch is at failure. SA never redelivers a message whose handler invocation failed, and a lost
    execution settles `failed` (`execution_lost`) without saying whether the interrupted message is delivered
    again. ACS does not state what a host must do when it performed an action and crashed before submitting;
    a restored run returns the same pending action (checked on the reference executor). Searched (ACS
    specification, guides, executor and runner; not found): single writer, one writer, concurren, idempot,
    exactly once, at least once, crash.'
  combined: 'Before performing an action write `{ action id, started }`; after it store the response,
    `submit`, then write the snapshot. `Action.id` is unique within a run and survives snapshot and restore,
    so the host''s run id plus `action.id` is the idempotency key (the run id is not on the action). `invokeTool`
    has no idempotency parameter, so the target tool must accept the key as a declared argument. On restore,
    an action marked started with no stored response is run again only when the capability''s effective
    `mutation` is false; otherwise answer `Error` (R402) so failure modes and rollback apply. Result:
    at-least-once for non-mutating steps, at-most-once for mutating ones. Schedule a watchdog effect before
    a turn''s first side effect; its survival across restarts is unspecified (wf-11).'
  see_also:
  - published-api-extension-points#consume-01
  - published-api-extension-points#thread-01
  - safety-enforcement#ckpt-02
  - safety-enforcement#edge-02
  - checkpoint-rollback-state#state-09
  - approval-human#approval-04
  - approval-human#approval-10
- id: wf-07
  relation: partial
  acs:
    concept: '`InvokeCapability{step, capability, store_as, domain, inputs, deadline, attempt, replaces}`
      answered by `Output{value}` or `Error{code, message}`'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (line 85), I-JSON limits (lines 114-116),
      output contract (lines 118-120)
    - core/src/exec/mod.rs ijson (lines 35-40), Body::InvokeCapability (lines 104-116), Response (lines
      205-238)
    - core/src/exec/machine.rs output() (lines 1399-1427), approval() shown values (line 721)
    - spec/STANDARD-v1.1.0.md §5.5 Consumer Contract Checking (lines 350-354)
    quote: root first. A capability's output must be an object with the fields its
  sa:
    concept: '`state.invokeTool(name, args)` on a function tool; child agents; `state.decide()` for typed
      model judgements'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods (line 120) and §3.2 Direct Invocation (lines
      260-272)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 38, 44) and §9 Conformance Notes
      (lines 150-156)
    - content/0.2.0/specification/hooks.md §6.3 HookToolResult (lines 478-488)
    - content/0.2.0/specification/threads/decisions.md §4.1 Answer Semantics (lines 165-167)
    - content/0.2.0/specification/providers.md §2 Request Format (line 237)
    - '@standardagents/spec 0.45.10 index.d.ts lines 211-249 (ToolResult; `result?: string` at line 221)'
    quote: '| `invokeTool(toolName, args)` | `Promise<ToolResult>` | Invoke tool and wait for result |'
  explanation: 'Mapping: `Output{value}` from a result with `status: ''success''` whose `result` text
    parses as a JSON object carrying the contract''s required fields (all 36 capabilities require `evidence_anchors`);
    `Error{code: ''R402''}` from `status: ''error''`, a thrown error or an unusable result; `Error{code:
    ''R401''}` only when the host itself measures a timeout. The impedance is typing: SA results are text
    (`result?: string` on `HookToolResult` in the text and on the published `ToolResult`, a type the 0.2.0
    text uses without defining). SA validates tool arguments (MUST), but no result schema for tool, sub-prompt
    or session results was found. Submitted values must also be I-JSON, or the executor refuses the response.
    Searched: outputSchema, resultSchema, responseSchema, returnSchema, output_schema, json_schema.'
  combined: 'Keep a build-time table from capability (plus domain) to an SA target and fail the build
    when a capability the catalog uses has none: `ThreadState` has no tool lookup, and an action with
    no target would stay pending. Per action: `const r = await state.invokeTool(target, inputs)`; `if
    (r.status === ''success'' && r.result !== undefined)` parse, check required fields and I-JSON limits,
    and `submit` an `Output`; otherwise `Error` R402. An `x-` key in `input_bindings` reaches the host
    inside `inputs` (checked on the reference executor) and can carry the route; strip it before the call,
    and note that without `approval.shows` it is part of the shown values and the digest. Prefer a submit
    tool with typed `args` to parsing text (wf-03).'
  see_also:
  - published-api-extension-points#shown-01
  - safety-enforcement#appr-01
  - approval-human#approval-06
  - evidence-audit-observability#collect-02
- id: wf-08
  relation: acs_only
  acs:
    concept: '`CreateCheckpoint{step}` -> `Checkpoint{checkpoint_id}` and `Rollback{step, checkpoint_id}`
      -> `RolledBack` (an `Error` to a step''s `CreateCheckpoint` fails the step F501; an `Error` to the
      `CreateCheckpoint` of `pause_and_checkpoint`, or to `Rollback`, ends the run F501 or F503)'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 86-87) and 'Checkpoints' (lines
      145-148)
    - spec/STANDARD-v1.1.0.md §3.3 Safety by Construction (lines 84-93), §5.12 runtime table (lines 678-683)
    - core/src/exec/machine.rs rollback() (lines 645-661), checkpoint() (lines 665-677), accepted responses
      (lines 1948-1954)
    quote: '- **Checkpoints.** One checkpoint authorises one step that requires one,'
  sa:
    concept: None
    refs:
    - content/0.2.0/specification/handlers.md §5 Error Semantics (line 74)
    - 'content/0.2.0/specification/threads.md §7 Durable Key-Value Store (lines 408-433: no key listing)'
    - content/0.2.0/specification/threads/messages.md §5 Updating Messages and §6 Deleting Messages (lines
      169-186)
    - content/0.2.0/specification/threads/client-api.md §13 Deleting a Message, item 4 (line 381)
    - content/0.2.0/specification/threads/filesystem.md (file operations only)
    quote: The inbound message stays persisted. Nothing is rolled back.
  explanation: 'The SA text defines no checkpoint, capture of state, undo or rollback for a thread''s
    messages, files, key-value store or external effects. The only hits are ''undocumented'' (packaging.md
    and the published types) and handlers.md §5, which states that a failed handler turn rolls nothing
    back; related words lead to request-context snapshots, the restoring of creation arguments, stream
    status snapshots and user-scope atomicity. An `Error` answer to either action is accepted: to a step''s
    `CreateCheckpoint` it fails the step F501, so a failure mode with `on_error: F501` can handle it;
    to the `CreateCheckpoint` of `pause_and_checkpoint`, or to `Rollback`, it ends the run F501 or F503.
    Searched (content/0.2.0 and the published types): checkpoint, rollback, roll back, undo, revert, restore,
    savepoint, snapshot, backup, transaction, atomic.'
  combined: 'Cannot be delegated to an SA runtime; the host implements both actions for a scope it controls.
    Checkpoint scope: an explicit list of thread file paths and key-value keys (the store cannot list
    keys, so only known keys can be captured) plus the id of the last message; restore copies those back
    and leaves later messages in place, tagged as superseded where wanted (checkpoint-rollback-state#state-26).
    Alternatively record a git ref or a database savepoint in an external system. Name the scope in the
    checkpoint''s `evidence_anchors`. Not restored: what a model or a client has already read, child threads,
    third-party APIs. A host that cannot restore answers `Error`, so the run ends F503, rather than report
    `RolledBack`.'
  see_also:
  - published-api-extension-points#thread-03
  - safety-enforcement#ckpt-03
  - safety-enforcement#err-01
  - checkpoint-rollback-state#state-06
  - checkpoint-rollback-state#state-16
  - checkpoint-rollback-state#state-23
  - checkpoint-rollback-state#state-26
- id: wf-09
  relation: partial
  acs:
    concept: '`RequestApproval{approver, mode, shown, digest, expires_at}` -> `Decision{decision_id, decision,
      approvers, digest}`; `RecheckSource{source, compare}` -> `Current{value}`; unattended plans `fail`,
      `skip`, `defer_to_queue`'
    refs:
