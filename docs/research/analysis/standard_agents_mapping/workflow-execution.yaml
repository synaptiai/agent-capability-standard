- id: wf-27
  relation: sa_only
  acs:
    concept: None. The Host protocol has no cancel or abort for a run or a pending action; the only cancellation
      mentioned is of a replaced delegation, which the host may perform
    refs:
    - core/src/exec/mod.rs Body::InvokeCapability `replaces` (lines 112-115), Response (lines 205-238)
    - core/src/exec/machine.rs submit() accepted responses (lines 1943-1963)
    - spec/STANDARD-v1.1.0.md §5.13 Waiting for Events (lines 762-764)
    - docs/guides/RUNNING_WORKFLOWS.md 'Actions and responses' (lines 83-92)
    quote: names the delegation it replaces (`replaces`, its `task_id`) so the host
  sa:
    concept: 'Three ways to stop work: `terminate()` (soft shutdown of the thread), the client stop route
      (aborts the execution in flight), and `state.execution.stop()` / `abortSignal`. Thread deletion
      discards queued messages, scheduled effects and stored values'
    refs:
    - content/0.2.0/specification/threads.md §8 Lifecycle (lines 467-478)
    - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread (lines 290-300), §15 Stopping
      Execution (lines 397-407)
    - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (line 31), §3 Controlling
      Execution (lines 57-70)
    - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (lines 227-235)
    quote: 2. The runtime **MUST** abort the execution in flight on the thread, if one exists. That run
      **MUST** settle as `idle` with reason `aborted_by_user`.
  explanation: 'SA lets a client or code stop a thread''s work at any moment; ACS has no message for it.
    A stop request MUST abort the execution in flight, which on a handler-backed runner can fall between
    a side effect and its `submit`; `terminate()` rejects future queued messages and executions, so the
    tick that would advance the run never arrives; thread deletion MUST discard queued messages, scheduled
    effects and stored values, so a run can disappear without a terminal action. The run''s record then
    ends without `Completed` or `Failed`, and nothing says what a host should answer for the pending action.
    Not found in core/src/exec, runner.py, RUNNING_WORKFLOWS.md or the Standard, apart from the replaced
    delegation. Searched: cancel, abort.'
  combined: 'Treat an abort like a crash (wf-06): on the next turn the per-action started marker decides
    whether the action is repeated or answered `Error` R402. Before a deliberate `terminate()`, answer
    the pending action so the step''s failure modes and any rollback run, then persist the terminal action:
    `Error` is accepted for every action except `RequestApproval`, which takes only a `Decision` (answer
    `rejected`), and `Sleep`, which takes none. A run whose thread was deleted leaves no record in SA;
    a host that needs an audit trail writes action records to an external store as they are produced.'
  see_also:
  - checkpoint-rollback-state#state-17
  - evidence-audit-observability#retention-01
  - models-context-memory-security#context-02
- id: wf-28
  relation: partial
  acs:
    concept: 'An action may be answered long after it was issued: `next()` returns the same pending action
      until it is answered, so a host may start work, return, and submit the response on a later invocation'
    refs:
    - docs/guides/RUNNING_WORKFLOWS.md 'Driving a run yourself' (lines 260-268)
    - core/src/exec/mod.rs Run::next (lines 637-644)
    quote: driving it. Use it to run actions asynchronously, across processes, or
  sa:
    concept: '`state.queueTool(toolName, args)`: queues a tool for asynchronous execution and returns
      `void`; starts an execution when the thread is idle'
    refs:
    - content/0.2.0/specification/threads.md §1.2.2 Methods (line 119), §3.1 Queuing Tools (lines 246-258),
      §12 TypeScript Reference (line 670)
    - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (line 35)
    - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 44)
    - 'content/0.2.0/specification/handlers.md §4 Delivery Semantics (line 65: warning on long-running
      handlers)'
    - '@standardagents/spec 0.45.10 index.d.ts lines 3011-3020 (`queueTool`)'
    quote: If the thread is currently executing, the tool is added to the queue. Otherwise, a new execution
      is started.
  explanation: 'ACS lets a host start work, return, and answer later. `queueTool` is SA''s non-blocking
    dispatch: it returns `void`, and the text says only that the tool joins the queue or starts an execution.
    It does not say where the queued tool''s result goes when the queuing side is handler-backed (no model
    reads the tool-result message, and whether that message reaches the handler as an inbound message
    is not stated), nor how a queued tool is ordered against queued messages. A handler that uses `invokeTool`
    instead holds its thread''s delivery slot for the duration (handlers.md §4, warning). No statement
    of result delivery for `queueTool` was found in threads.md, tools.md, runtime.md, handlers.md or the
    published types. Searched: queueTool.'
  combined: Do not rely on `queueTool` for capability dispatch from a handler-backed runner until result
    delivery is specified. For long work use a non-blocking child agent whose submit tool ends its session
    with the result and wakes the parent, which reads the result from the child's own thread (wf-10, wf-20);
    for short work call `invokeTool` inline. If `queueTool` is used, the queued tool itself must record
    `{ action id, value }` in the key-value store and queue the wake-up message, so that nothing depends
    on how the runtime routes its result.
  see_also:
