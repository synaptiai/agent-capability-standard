      'should')
    - content/0.2.0/specification/threads/execution-state.md §2.3 Handler turns (line 55), §4.2 Reasons
      (lines 107-113)
    - content/0.2.0/specification/threads.md §9.3 Parent Messaging (line 540)
    - content/0.2.0/specification/subagents.md §4.1 Persistence Is Universal (line 120), §6.2 Completion
      and Failure (lines 197-205)
    quote: 4. safety limits (`maxSteps`, `maxSessionTurns`, runtime hard caps)
  explanation: 'Different things are bounded. ACS bounds the workflow''s control flow; SA bounds model
    steps per side turn and exchanges per session. Neither bounds what the other does: ACS has no budget
    for the model steps a capability spends, and SA has no bound on a code-driven loop inside a handler
    turn. Handler turns add no steps but count toward `maxSessionTurns`. A cap ends the session, not the
    thread (''a later message starts a new session with history intact''), so a top-level runner resumes
    on the next tick; the cap matters when the runner is itself a child, whose parent sees a session end
    mid-run. The phrase ''runtime hard caps'' occurs once and is not defined. Searched (ACS Standard,
    ontology, profiles): budget, token, cost, max_steps.'
  combined: 'Leave `maxSessionTurns` unset on the runner agent. On agents that implement capabilities
    set `maxSteps` and `maxSessionTurns` as safety valves. Do not wait for a message after a cap: the
    implicit completion message is specified for `sessionStop` and `sessionFail`, and for a cap or an
    error the text gives only the registry transition. On a tick, a child whose `status()` has settled
    with no stored result, and whose `reason` is not `awaiting_human`, is answered `Error` R402, citing
