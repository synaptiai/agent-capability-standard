    target and ends the run `escalated` (§5.11); an SA handler is the function that takes a side''s turns.
    They are unrelated. By inference, SA''s handoff (same thread, different agent) and human-in-the-loop
    children are natural implementations of the workflow an ACS escalation handler invokes.'
