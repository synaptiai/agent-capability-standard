      semantics), read thread with run status, read messages and files, WebSocket stream, stop'
    refs:
    - content/0.2.0/specification/threads/client-api.md §1 Scope (lines 9-11), §2 Routes (lines 18-35),
      §6 Creating a Thread (lines 140-163), §8 Reading a Thread (lines 225-248), §12 Sending a Message
      (lines 334-370), §14 Reading a File (lines 383-395), §15 Stopping Execution (lines 397-407), §16.2
      Delivery (lines 447-455)
    - content/0.2.0/infrastructure/runtime.md §15 Thread Client API (line 366)
    - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 107-114), §4.3 Requirements
      (line 121), §4.4 Client delivery (lines 126-137)
    - content/0.2.0/getting-started/examples.md §9 Remote Trigger (line 1532; example text)
    quote: 5. The runtime **MUST** accept the message durably and return `202` with a `SendMessageResponse`
      without waiting for the resulting execution.
  explanation: 'Works with both specifications as published, with no port: the executor stays in Python
    and treats a whole SA agent as the implementation of one capability. The limits come from the client
    API, which a runtime only SHOULD expose. `CreateThreadRequest` carries `agent_id`, `tags` and `env`
    but no arguments, so inputs travel as message text. `ThreadRead` has `status` but no session result.
    The send route answers 202 without waiting, so a read made straight afterwards can still show the
    earlier `idle`; clients SHOULD NOT poll for run status, which the stream pushes (at most once); reason
    codes are SHOULD-level. ACS checkpoints cannot cover what the SA agent''s tools did, so such a step
    should carry the safety flags of the strongest thing that agent can do.'
  combined: 'Key thread creation and sending by (run id, action id): under `WorkflowRunner.drive` a host
    method that returns `None` is called again on every poll, and never again once the executor has timed
    the action out. Record `status.since` before sending; the run has settled when `since` has changed
    and `state` is not `running`. Follow `thread_status` frames on the stream and read the thread once
    after each (re)connect. Have the SA agent''s submit tool write the validated output to a known thread
    file and fetch it with `GET .../fs/{path}` (404 until it exists): a typed result without parsing the
    last message or reading reason codes. Stop threads whose action is no longer pending when the host
    is next called. `failed` maps to `Error` R402.'
  see_also:
  - tools-contracts#io-07
  - multi-agent#coord-27
- id: wf-25
