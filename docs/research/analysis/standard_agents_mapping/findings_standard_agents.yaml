- id: SA-42
  title: '`ThreadUser` is referenced by frozen pages but defined only in the Draft and types'
  priority: minor
  category: messages_and_identity
  summary: Threads §1.2.2 types `user()` as `ThreadUser | null` and Thread Endpoints §4 types `auth.caller`
    the same way; no frozen page defines the interface, and Threads §12 omits `user()`. The fields appear
    in one table cell. The Draft Users page defines `UserIdentity` with optional `username` and `role`
    and has `UserHandle` extend it; the published types require both fields on `ThreadUser`, have `UserHandle`
    extend `ThreadUser`, and return `UserHandle` from `user()`. The runtime-defined `role` has no stated
    vocabulary, so endpoint code has no portable test that tells a person from an automated caller.
  refs:
  - content/0.2.0/specification/threads.md §1.2.2 Methods, User identity (line 159), §12 TypeScript Reference
    (lines 611-741)
  - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 100-105)
  - content/0.2.0/specification/users.md status (line 3), §1 Identity (lines 14-25), §5 UserHandle (lines
    167-170)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 1418-1421 (UserIdentity), 1561 (UserHandle), 1892-1905
    (ThreadUser; `role` comment at line 1895), 3231 (user())'
  quote: '`caller` uses the same `ThreadUser` identity shape as `state.user()` — identity fields only,
    never credentials.'
  searched: 'content/0.2.0 for ''ThreadUser'', ''UserIdentity'', ''UserHandle'', ''user()'': `ThreadUser`
    at specification/threads.md line 159 and specification/threads/endpoints.md lines 100 and 103 only;
    no ''interface ThreadUser''. Threads §12 (lines 611-741) for ''user()'': no match.'
  proposed_change: Define `interface ThreadUser` on the Threads page, say which fields are required, add
    `user()` to the §12 reference, and give `user()` one return type across the Threads page, the Users
    draft and the types. Say whether the vocabulary of the runtime-defined `role` will be specified.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The definition is an editorial matter and does not affect grounding: the reference
    binding uses `id` and `roles` of `auth.caller`, both named on the frozen Threads page and typed in
    the package. The three statements of the `user()` return type are an inconsistency of the kind issue
    06 collects and could be added there. That no member tells a person from a service follows from a
    choice the text states, that the authentication mechanism is implementation-defined; `approver.kind:
    human` therefore remains a deployment assertion (approval-human#approval-22), and a `role` vocabulary
    is an open question, not a defect.'
  concerns:
  - approval-human
- id: SA-43
  title: '`CreateThreadRequest` accepts no creation arguments'
  priority: minor
  category: endpoints_and_auth
  summary: 'Threads §1.2.1 describes `ThreadState.arguments` as ''Arguments supplied when this thread
    was created or invoked'', and subagent creation validates and persists arguments. The Thread Client
    API''s `CreateThreadRequest` has `agent_id`, `tags` and `env` only. An external caller has no specified
    way to start a top-level thread with arguments: the options are the first message, the string-valued
    `env`, or a runtime-specific request field, which Client API §1 item 3 permits. None is specified
    to reach `ThreadState.arguments`.'
  refs:
  - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (lines 140-163)
  - content/0.2.0/specification/threads/client-api.md §1 Scope, item 3 (line 11)
  - content/0.2.0/specification/threads.md §1.2.1 Properties (line 46), §6.1 Thread Arguments (lines 354-360)
  quote: Arguments supplied when this thread was created or invoked. Subagent initial arguments appear
    here.
  searched: 'content/0.2.0/specification/threads/client-api.md for arguments, args and input: no match.'
  proposed_change: 'Add `arguments?: Record<string, unknown>` to `CreateThreadRequest`: validated against
    the side A prompt''s `requiredSchema` where one is declared, with `400` on failure, and exposed as
    `ThreadState.arguments`.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound: an authenticated thread endpoint in the package validates
    the inputs and stores them on the thread, or the first message carries them. No grounding rule depends
    on `ThreadState.arguments` of a top-level thread.'
  concerns:
  - workflow-execution
- id: SA-44
  title: Decisions §5 cites a credential-isolation rule the Provider pages do not contain
  priority: minor
  category: endpoints_and_auth
  summary: Decisions §5 says transport overrides and credential isolation follow the Provider specification,
    and adds that user- or thread-scoped destination overrides MUST NOT redirect inherited credentials.
    Neither Provider page states a credential-isolation rule. For conversational providers a config slot
    takes its value from `providerEnv(name)`, described as an environment variable source; the layer it
    reads is not stated, and an extension that overrides only `baseUrl` keeps the base provider's key.
    Whether a thread creator's `env` can change a destination while an inherited key is still sent is
    unspecified.
  refs:
  - content/0.2.0/specification/threads/decisions.md §5 Provider Interface (lines 194-198)
  - content/0.2.0/specification/providers.md §1.3 Config Slots (lines 142-159)
  - content/0.2.0/infrastructure/providers.md Provider Configuration (lines 100-110), API Key Management
    (line 205)
  - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-225)
  - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (lines 147-151)
  quote: credential isolation follow the [Provider specification](/0.2.0/specification/providers).
  searched: 'isolation, redirect in specification/providers.md and infrastructure/providers.md (case-insensitive):
    not found. credential on both pages: an extension''s ''credential source'' and the rule that keys
    are declared as secret slots. providerEnv on both pages: an environment variable source with metadata;
    no statement of the layer it resolves from.'
  proposed_change: 'State in the Provider specification the rule Decisions §5 points to: which layers
    a provider config source reads, and that a user- or thread-scoped value for a destination slot such
    as `baseUrl` MUST NOT be combined with a credential inherited from a broader scope. If the sentence
    in Decisions §5 is the whole rule, repeat it for conversational providers.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: no rule of the binding depends on provider credentials.
    It is a cross-reference to a rule that is not there, the kind of defect issue 06 collects, but resolving
    it means writing a security rule, not correcting a reference, so it is not added to that issue.'
  concerns:
  - models-context-memory-security
- id: SA-45
  title: Whether a thread creator may set undeclared environment names is not stated
  priority: minor
  category: endpoints_and_auth
  summary: '`env()` resolves thread values before agent and prompt defaults, and `POST {runtime_prefix}/threads`
    accepts an `env` object of which only the shape is validated. A value set in `agent.env` is therefore
    a default, and two conforming runtimes can differ on whether a caller can set names no definition
    declares. `optional` subagent relationships are enabled by an environment flag, and the published
    types have a prompt part that inserts a thread variable into the system prompt, so the thread creator
    can set both unless the runtime restricts them.'
  refs:
  - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-234)
  - content/0.2.0/specification/threads/client-api.md §6 Creating a Thread (lines 147-151, 162)
  - content/0.2.0/specification/subagents.md §1 SubagentRelationship, `optional` (line 44)
  - content/0.2.0/specification/tools.md §3 Variable Declarations (lines 50-64)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 4086-4094 (PromptEnvPart)'
  quote: 4. The runtime **MUST** return `400` when `agent_id` is absent or is not a string, when `tags`
    is present and is not an array of strings, or when `env` is present and is not a JSON object whose
    values are all strings.
  searched: 'overridable in content/0.2.0: provider config slots only. threads.md §2.3, client-api.md
    §6 and tools.md §3 read in full: item 4 of §6 validates the shape of `env` only, and `VariableDefinition`
    has `scoped` and no control over caller-supplied values.'
  proposed_change: 'In Thread Client API §6, say whether `env` can carry names that no definition in the
    agent graph declares as a variable, and allow a runtime to reject such names with `400`. Add a security
    note: env flags that gate `optional` relationships, and env values inserted into prompts, are settable
    by the thread creator unless the runtime restricts them.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'An open question about a design choice, not a defect, and the workaround is sound:
    a guard reads its settings from package code, or from `instanceEnv` where the runtime offers it, never
    from `state.env()`. The reference binding fixes the role, the number of approvers and the expiry in
    the tool''s definition for this reason.'
  concerns:
  - models-context-memory-security
- id: SA-46
  title: Thread endpoint routes lack precedence between local and packed endpoints and agent scoping
  priority: minor
  category: endpoints_and_auth
  summary: 'Thread Endpoints §2 gives precedence among static, dynamic and catch-all routes and says packed
    endpoints share the local route namespace, without a package prefix. No rule covers a local and a
    packed endpoint, or two packed endpoints, that define the same route. Nothing limits a packed endpoint
    to threads of its own package''s agents: the handler receives a `ThreadState` for whichever thread
    the URL names and has to check `state.agentId` itself. The published `EndpointOptions` has one member,
    `access`. The Draft Users page recommends a directory per package for user endpoints.'
  refs:
  - content/0.2.0/specification/threads/endpoints.md §2 File-Based Routing (lines 24-28, 44, 48-54)
  - content/0.2.0/specification/threads/endpoints.md §3 Handler Signature (line 63), §4 Access and Authentication
    (line 94)
  - content/0.2.0/distribution/packaging.md 'Packed Thread Endpoints' (lines 268-278)
  - content/0.2.0/specification/threads/client-api.md §2 Routes, item 2 (line 35)
  - content/0.2.0/specification/users.md §3.2 File-Based Routing (line 140; Draft)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 5338-5343 (EndpointOptions)'
  quote: 'Packed thread endpoints use the same route namespace as local thread endpoints. They are still
    addressed beneath the runtime''s thread ID prefix, not beneath a package-specific URL prefix:'
  searched: 'specification/threads/endpoints.md, specification/threads/client-api.md, distribution/packaging.md
    and specification/users.md for ''precedence'', ''collision'', ''conflict'', ''collide'', ''duplicate'':
    endpoints.md line 44 (static, dynamic, catch-all), packaging.md line 219 (definition names), and two
    unrelated uses of ''duplicate'' (packaging.md line 183, users.md line 405). endpoints.md for ''agent'':
    `state.agentId` in one example (line 162).'
  proposed_change: 'State what happens when a local and a packed endpoint, or two packed endpoints, define
    the same route: a precedence rule or a definition-time error. Recommend a per-package directory for
    thread endpoints, as the Users draft does for user endpoints. Optionally let `defineThreadEndpoint`
    options name the agents an endpoint serves.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: The workaround is sound. The reference binding roots its two endpoints in an `acs/`
    directory, its decision endpoint answers 404 for a thread that holds no matching approval request,
    and a handler can compare `state.agentId`. A collision rule is a packaging matter for runtime authors
    and does not change what a grounded agent can enforce.
  concerns:
  - approval-human
- id: SA-47
  title: The thread key-value store cannot be enumerated
  priority: minor
  category: state_and_storage
  summary: '`ThreadState` exposes `getValue` and `setValue` for the thread store and nothing that lists
    keys; a stored value carries no write time. The Draft Users page gives `UserState` a `listValues`
    with prefix, limit and offset, and the published `ThreadState` has `listUserValues`, `getUserValue`
    and `setUserValue`, which the 0.2.0 Threads text does not document. Code that keeps many records must
    maintain an index key or a counter, itself a read-modify-write, and cannot export or clean up the
    keys under a prefix.'
  refs:
  - content/0.2.0/specification/threads.md §1.2.2 Methods, Durable Key-Value Store table (lines 136-141),
    §7.3 Comparison With Other Storage (line 441), §12 TypeScript Reference (lines 693-694)
  - content/0.2.0/specification/users.md §2 UserState (lines 54-57; Draft page)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 3152-3167 (getValue, setValue), 3179-3211 (getUserValue,
    setUserValue, listUserValues), 1441-1446 (UserValueEntry)'
  - examples/standard_agents/src/acs/records.ts (ACS repository; the counter workaround)
  quote: 'listValues(options?: { prefix?: string; limit?: number; offset?: number }):'
  searched: 'listValues, listKeys, deleteValue, getUserValue, setUserValue, listUserValues in content/0.2.0:
    `listValues` occurs in users.md only, and the three user-value methods do not occur. In the published
    index.d.ts `listValues` is a member of `UserState` only.'
  proposed_change: 'Add an optional, feature-detected `ThreadState.listValues(options?: { prefix?, limit?,
    offset? })` with the result shape of `UserState.listValues`, and document the three published user-value
    methods in Threads. Settle the unit of `updated_at` with it: the published `UserValueEntry` comment
    says milliseconds, and thread timestamps such as `createdAt` are in microseconds.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound where execution is serialized: the reference binding keeps
    each list as a counter plus one key per entry. Its weakness is the question of SA-22, which is the
    one to raise. The signature to copy is on a Draft page, and Threads §7.3 describes the store as for
    ''Small structured state scoped to the thread''.'
  concerns:
  - checkpoint-rollback-state
  - evidence-audit-observability
  related:
  - SA-04
  - SA-07
  - SA-28
  - SA-29
  - SA-67
  - SA-74
- id: SA-48
  title: No naming convention separates packages that share a thread's keys, files or events
  priority: minor
  category: state_and_storage
  summary: Package namespace isolation covers definition names. Thread key-value keys, file paths and
    event names are one flat space per thread, shared by host code, every packaged tool, an agent from
    another package after a handoff, and hooks a child package contributes to its parent, which receive
    the parent's `ThreadState`. The text gives no prefix guidance for keys or paths, and for thread event
    names only 'lowercase with underscores'. The Draft Users page already says 'Packages SHOULD namespace
    event names.' Two packages can overwrite each other's values without either being wrong.
  refs:
  - content/0.2.0/distribution/packaging.md Namespace Isolation (lines 217-236)
  - content/0.2.0/specification/agents.md §6 Required Parent Hooks (line 163)
  - content/0.2.0/specification/threads.md §1.1 Agent Assignment (line 26), §5.2 Event Guidelines (lines
    344-348), §7 Durable Key-Value Store (line 410)
  - content/0.2.0/specification/users.md §3.2 (line 140), §4 item 4 (line 163), §7.1 `valuePrefix` (lines
    284-286) (Draft page)
  - content/0.2.0/specification/threads/client-api.md §2 item 2 (line 35)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 239-247 (ToolResult.attachments comment naming
    /attachments/)'
  quote: 4. Event names are package-defined. Packages SHOULD namespace event names.
  searched: 'namespac, prefix, reserv in content/0.2.0, and valuePrefix in the published index.d.ts: the
    hits concern definition, tool and module namespaces, `{runtime_prefix}` and endpoint URL prefixes,
    reserved endpoint paths and tool names, bracket-tag prefixes in message text, a provider request prefix,
    and the Draft user scope; none concerns thread keys, thread file paths or `state.emit` event names.'
  proposed_change: 'Add guidance, with no runtime change: packed code SHOULD prefix the thread key-value
    keys it owns with its package ID and root its files in a directory named for it. For events, add a
    derived prefix to Threads §5.2 or relax the name guideline, since a package ID is not lowercase with
    underscores. Name the directory runtimes use for attachments.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound: a package prefixes its own keys, as the reference binding
    does with `acs:`. A SHOULD-level convention prevents accidental collisions and gives no protection
    against other code on the thread, so it does not change what a grounded agent can guarantee.'
  concerns:
  - checkpoint-rollback-state
  - evidence-audit-observability
  - packaging-conformance-governance
- id: SA-49
  title: Per-key atomicity and durability at resolution of `setValue` are not stated
  priority: minor
  category: state_and_storage
  summary: 'A value written by `setValue` MUST be kept in durable storage and MUST be visible to later
    reads, but item 7 is a SHOULD: ''Writes **SHOULD** be durable before the promise returned by `setValue`
    resolves.'' No passage says that a single write is all-or-nothing if the runtime fails during it.
    A tool that records an intent and then acts cannot say what survives a failure between the two.'
  refs:
  - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store (the second section numbered 14) §14.1
    items 1, 2 and 7 (lines 350, 351, 356)
  - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store (the second section numbered 14) §14.2
    Capacity and Errors (line 362)
  - content/0.2.0/specification/threads.md §7.1 Reading and Writing Values (lines 416-418)
  quote: 7. Writes **SHOULD** be durable before the promise returned by `setValue` resolves.
  searched: 'atomic, transaction, all-or-nothing, partial write, crash in content/0.2.0: ''atomic'' occurs
    for the Draft user scope and in `Atomics`, which the sandbox rejects; ''crash'' occurs for the execution
    loop and for lost executions; no statement on a single `setValue`.'
  proposed_change: 'In the key-value runtime section, state that a single `setValue` is all-or-nothing
    per key: a reader observes the old value or the new one. Keep item 7 as SHOULD and add that a runtime
    which resolves before the write is durable SHOULD document that.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'A clarification with no ACS requirement behind it: the Standard does not say what
    a host does after a failure between an action and its record. The reference binding writes a `started`
    trace entry before a tool''s own code runs; that entry is as durable as item 7 makes it, and the requested
    wording leaves item 7 a SHOULD.'
  concerns:
  - checkpoint-rollback-state
- id: SA-50
  title: Attachment references and file records carry no content digest
  priority: minor
  category: state_and_storage
  summary: Attachments are copied when traffic crosses a thread boundary, and the destination receives
    new, local paths. `AttachmentRef` and `FileRecord` have no digest member, so a file cannot be recognised
    as the same content after a copy, and integrity after transfer cannot be checked without reading both
    files. `FileRecord.metadata` can hold a writer's own digest, but `AttachmentRef` has no such member,
    and the text does not say that a cross-thread copy keeps it.
  refs:
  - content/0.2.0/specification/threads/messages.md §1.2 Attachment References (lines 56-66)
  - content/0.2.0/specification/threads/filesystem.md §1 File Record (lines 11-21)
  - content/0.2.0/specification/subagents.md §7 Attachment Copying (lines 232-237)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 188-207 (AttachmentRef), 2253-2274 (FileRecord)'
  quote: The destination thread **MUST** receive destination-local attachment paths.
  searched: 'hash, digest, checksum, sha256, sha-256, etag in content/0.2.0 and the published index.d.ts
    (case-insensitive): only the effect name `send_digest`.'
  proposed_change: 'Add an optional `digest?: string` of the form `sha256:<hex>` to `AttachmentRef` and
    `FileRecord`. A runtime that computes it MUST preserve it when copying a file across threads and recompute
    it when the content changes.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'A feature request with a sound workaround: code that needs a digest reads the bytes
    and computes it, at the cost of one read per file, and keeps it in its own record. The reference binding
    does this for the files it anchors as evidence, and its approval digest is computed over tool arguments,
    not over files.'
  concerns:
  - models-context-memory-security
- id: SA-51
  title: Stop reason codes are listed without definitions
  priority: minor
  category: execution_and_lifecycle
  summary: Execution State §4.2 lists eighteen stop reason codes in one table and says runtimes SHOULD
    use them 'where they apply'. Four of them, `forced_human_turn`, `hook_blocked`, `handler_idle` and
    `repeated_tool_error`, occur nowhere else in content/0.2.0, and no passage says when a runtime uses
    them. A tool that returns error results by design (validation, quota, a declined call) cannot know
    whether, or after how many such results, a runtime settles the run as `failed` with `repeated_tool_error`.
  refs:
  - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 105-114; quote at line
    114)
  - content/0.2.0/specification/tools.md §9 Conformance Notes (line 155)
  - content/0.2.0/infrastructure/runtime.md §5.2 Error Handling (line 92)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2229-2236 (`ThreadStatus.reason` comment)'
  quote: '| `failed` | `step_error`, `repeated_tool_error`, `session_fail`, `fatal_error`, `execution_lost`
    |'
  searched: 'content/0.2.0 for each of the eighteen codes: `forced_human_turn`, `hook_blocked`, `handler_idle`
    and `repeated_tool_error` occur only at execution-state.md lines 113-114. dist/index.d.ts: `hook_blocked`
    at line 2232; the other three do not occur. content/0.2.0 for repeated, consecutive: no rule about
    repeated tool errors.'
  proposed_change: Add one line per code in Execution State §4.2 saying when a runtime uses it. For `repeated_tool_error`,
    say what counts as repetition (the same tool, the same arguments, consecutive results), or state that
    the threshold is runtime-defined and should be documented.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not limit a grounded agent: a run that settles as `failed` after repeated declined
    calls has still not performed the declined action, and the codes are SHOULD-level. It is an editorial
    completeness point; issue 06 lists passages that disagree with each other, which this is not. The
    meaning of `hook_blocked` is raised in issue 01.'
  concerns:
  - approval-human
  related:
  - SA-31
- id: SA-52
  title: Semantics of `invokeTool` on a prompt or agent target from code are unspecified
  priority: minor
  category: execution_and_lifecycle
  summary: Tools §2.1 lets a function tool invoke 'tools, prompts, or agents' by name through `state.invokeTool()`,
    and a handler 'may do anything tools can do'. The result-shaping options (`includeTextResponse`, `includeToolCalls`,
    `includeErrors`) exist only on a calling prompt's `tools` entry. For a prompt invoked from code the
    text does not say which of them apply, where its messages are persisted, whether its model steps advance
    `stepCount`, or which hook set is active; for an agent target it does not say what the call resolves
    to.
  refs:
  - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 38; quote); §4 Prompt Tool Configuration
    (lines 66-79)
  - content/0.2.0/specification/prompts.md §3.3 Sub-Prompt Tool Configuration (lines 127-162)
  - content/0.2.0/specification/threads.md §1.1 Agent Assignment (lines 20-30); §3.2 Direct Invocation
    (lines 260-272)
  - content/0.2.0/specification/handlers.md §3 Execution Model (line 52); §6 Capabilities (line 81)
  - content/0.2.0/specification/threads/execution-state.md §2.3 Handler turns (line 55); content/0.2.0/specification/hooks.md
    §1.3 (lines 99-100)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 3022-3033 (`invokeTool`)'
  quote: A function tool **MAY** declare `uses` as an array of names of tools, prompts, or agents it may
    invoke by name through `state.invokeTool()` or `state.queueTool()`.
  searched: 'invokeTool in content/0.2.0: tools.md lines 38 and 44, threads.md lines 120, 265 and 671,
    subagents.md line 93 and runtime.md line 143. None describes the result shaping, message placement,
    step accounting or hook set for a prompt target, or what the call resolves to for an agent target.'
  proposed_change: 'State in Threads §3.2, for a prompt invoked by name from a tool, handler, effect or
    endpoint: which `SubpromptConfig` defaults apply, where its messages are persisted (`parent_id`, `depth`),
    whether its steps count toward `stepCount` and caps, and which hooks are active. State what `invokeTool`
    and `queueTool` resolve to for an agent target.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'An open question, not a defect, and the workaround is sound: grounded code that needs
    a model-backed step composes a child agent, whose semantics the Subagents page specifies. The integration
    document maps the executor''s `InvokeCapability` to `state.invokeTool(name, inputs)`, or a child agent
    for `delegate`, and the handler-hosted arrangement that would raise the question needs an executor
    build that does not exist yet. The hook-set part is in SA-03.'
  concerns:
  - tools-contracts
  - workflow-execution
- id: SA-53
  title: '`invokeTool` accepts no abort signal'
  priority: minor
  category: execution_and_lifecycle
  summary: '`invokeTool(toolName, args)` takes no options. `decide()` accepts `signal?: AbortSignal`,
    file streaming accepts `signal`, and a `runCode` handle has `terminate()`. Code that calls a slow
    tool, a sub-prompt or a blocking child can stop waiting by racing the promise against a timer, but
    cannot cancel the call; `state.execution.abortSignal` covers the whole execution. Handlers §4 warns
    that a handler awaiting a blocking child holds its thread''s delivery slot for that session''s duration.'
  refs:
  - content/0.2.0/specification/threads.md §12 TypeScript Reference (line 671; quote); §1.2.2 Methods
    (line 120)
  - 'content/0.2.0/specification/threads/decisions.md §2 Request Types (line 52, `signal?: AbortSignal`)'
  - content/0.2.0/specification/threads/filesystem.md §9.2 Options (line 161, `signal`)
  - content/0.2.0/infrastructure/runtime.md §14.4 Resource Enforcement (line 289)
  - content/0.2.0/specification/handlers.md §4 Delivery Semantics (line 65)
  - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (line 31, `abortSignal`)
  quote: 'invokeTool(toolName: string, args: Record<string, unknown>): Promise<ToolResult>;'
  searched: 'specification/threads.md, specification/threads/ and specification/tools.md for signal, AbortSignal:
    `signal` on the decision request (decisions.md line 52) and on file streaming (filesystem.md line
    161), `abortSignal` on `ExecutionState` (execution-state.md line 31); nothing on `invokeTool` or `queueTool`.
    dist/index.d.ts lines 3021 and 3033: both take `(toolName, args)` only.'
  proposed_change: 'Add `options?: { signal?: AbortSignal }` to `invokeTool`. When the signal aborts,
    the returned promise settles with an error result and the invoked tool can observe the abort; the
    text states that the tool''s effects may already have happened and that a blocking child is not terminated.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: the ACS executor treats a result that arrives after a
    step''s deadline as a timeout (R401; core/src/exec/machine.rs lines 2004-2014), so a host does not
    need to cancel the call. It is an asymmetry in the API and a feature request.'
  concerns:
  - workflow-execution
- id: SA-54
  title: '`ExecutionState` does not say what started the execution'
  priority: minor
  category: execution_and_lifecycle
  summary: 'Runtime §2 lists four invocation triggers: a user message, a queued message, a queued tool
    and a scheduled effect. Neither Execution State §2 nor the published `ExecutionState` exposes which
    one started the current execution. Tool code cannot tell a run that a client''s message started from
    one started by queued work, which matters to a tool that confirms, notifies or spends differently
    when nobody is waiting.'
  refs:
  - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (lines 27-38; quote at line 38)
  - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (lines 19-32), §5 TypeScript
    Reference (lines 139-156)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2578-2634 (ExecutionState)'
  quote: If a thread is already executing, new work is queued. If idle, the runtime starts a new execution.
  searched: '`startedBy`, `started_by`, `triggeredBy`, `triggered_by`, `initiator` and ''invocation trigger''
    in content/0.2.0: only the heading of Runtime §2 (runtime.md line 27); in index.d.ts: no match. The
    Execution State page and `ExecutionState` (index.d.ts lines 2578-2634) read in full. `state.execution?.trigger`
    is TS2339 with tsc 6.0.3 against 0.45.10.'
  proposed_change: 'Add an optional read-only member to `ExecutionState` that names the Runtime §2 trigger
    that started the execution, for example `trigger: ''message'' | ''queued_message'' | ''queued_tool''
    | ''effect''` (names illustrative).'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'No issue asks for it. It does not affect grounding: no ACS rule depends on what started
    an execution, and the reference binding does not read it; its checks are scoped by `flowId` and by
    recorded approvals. One record raises it, as a convenience for tool authors.'
  concerns:
  - safety-enforcement
- id: SA-55
  title: What `messageProperty` and `stopToolResponseProperty` forward is under-specified
  priority: minor
  category: execution_and_lifecycle
  summary: '`messageProperty` is described in one line, with no rule for an omitted property, an absent
    field or a value that is not a string. `stopToolResponseProperty` is described as ''Extracted property
    for stop tool outcomes''; the published types say it is extracted from the stop tool''s result, a
    string, and define no extraction. Subagents §3.3 says a blocking `subagent_create` returns the child''s
    ''result payload'' without saying whether that is the bare payload or the §6.2 template around it.'
  refs:
  - content/0.2.0/specification/agents.md §1.2 SideConfig, PromptSide (line 43)
  - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113)
  - content/0.2.0/specification/subagents.md §3.3 Blocking and Create-or-Continue (line 108), §6.2 (lines
    197-205)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 4738-4752 (SessionToolConfig), lines 4826-4836
    (stopTool, stopToolResponseProperty)'
  quote: '| `stopToolResponseProperty` | `string` | - | Extracted property for stop tool outcomes |'
  searched: content/0.2.0 for messageProperty (the interface, its one-line description and examples; no
    default and no rule for a value that is not a string), stopToolResponseProperty (agents.md lines 43
    and 289 only) and 'result payload' (subagents.md line 108 only).
  proposed_change: 'Clarify, without adding fields: what is forwarded when `messageProperty` is omitted,
    names an absent field, or names a value that is not a string; what `stopToolResponseProperty` extracts,
    and from what; and whether a blocking `subagent_create` returns the bare payload or the §6.2 template
    around it.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: a grounded child returns its result from code with `state.stopSession({
    result })` and depends on neither property. The third point, what a blocking `subagent_create` returns,
    belongs with SA-27 if that is filed.'
  concerns:
  - tools-contracts
- id: SA-56
  title: A parked human turn has no portable time bound
  priority: minor
  category: execution_and_lifecycle
  summary: 'Runtime §3 says a human-backed side''s turn ''parks execution until the human''s inbound message
    arrives''. No option bounds the wait and no stop reason reports a lapse; `maxSessionTurns` caps exchanges,
    not time. A bound can be built today: a scheduled effect runs later with the thread''s `ThreadState`
    and can `terminate()` the parked thread and notify the parent, though no timing requirement is stated
    for effects. What is missing is a declarative form and a portable report of the lapse.'
  refs:
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (line 52), §6 Stop Conditions (line 109)
  - content/0.2.0/specification/subagents.md §4.1 Persistence Is Universal (line 124), §4.3 (line 153)
  - content/0.2.0/specification/agents.md §1.2 SideConfig, HumanSide (line 32), §1.3 Derivations (line
    66)
  - content/0.2.0/specification/threads.md §4.1 Scheduling Effects (lines 284-300)
  - content/0.2.0/specification/effects.md §3 Execution Semantics (lines 81-90)
  quote: A **human-backed** side's turn parks execution until the human's inbound message arrives.
  searched: 'content/0.2.0 for timeout, deadline, expir, ttl, ''time limit'', elapse and wall-clock: the
    hits concern provider and model requests, hook execution, code execution, stream tickets, runtime-stream
    opening and the Draft Users page; none bounds a human turn.'
  proposed_change: 'Add a non-normative example of the effect-based pattern: schedule on park, cancel
    on answer, terminate and notify on lapse. Optionally add a relationship-level bound (for example `humanTurnTimeoutMs`)
    that ends the session as failed, with a new reason code, when it elapses in `awaiting_human`.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound for grounding: the binding keeps an absolute expiry in the
    acting thread''s own record, and the tool refuses a decision that arrives after it, so no parked turn
    has to end on time. The integration document lists the point among those not written up.'
  concerns:
  - approval-human
  related:
  - SA-27
- id: SA-57
  title: Child results have no structured data member
  priority: minor
  category: subagents_and_composition
  summary: 'A child''s result is one text string plus optional file attachments. `SessionToolBinding.messageProperty`
    forwards one tool-call argument as text, `stopSession({ result })` takes a string, and the published
    `ToolResult` that a blocking caller receives has `result?: string`. A parent that branches on an outcome
    parses text, and with `sessionStop` a model wrote that text. JSON in the string works today, and attachments
    cross the boundary under a MUST, so the gap is one of convenience.'
  refs:
  - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113)
  - 'content/0.2.0/specification/subagents.md §6.2 Child → Parent: Completion and Failure (lines 195-205)'
  - content/0.2.0/infrastructure/runtime.md §8.2 Child -> Parent (lines 197-202)
  - content/0.2.0/specification/threads.md §12 TypeScript Reference (lines 661-665)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 211-249 (ToolResult), lines 2659-2680 (StopSessionOptions),
    lines 4738-4752 (SessionToolConfig)'
  quote: '`messageProperty`: which arg field becomes lifecycle message text'
  searched: 'content/0.2.0 for messageProperty, attachmentsProperty, ''result payload'', stopSession and
    ''structured'' (the hits for ''structured'' concern creation arguments and error results); the published
    index.d.ts for StopSessionOptions, SessionToolConfig and ToolResult; dataProperty and resultProperty
    in both: no match.'
  proposed_change: 'State in Subagents §6.2 that structured results travel as JSON text or as an attachment.
    If a structured member is wanted, specify it end to end: on `StopSessionOptions`, on `SessionToolBinding`,
    on the `ToolResult` a blocking caller receives, and on the implicit completion message.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound: deterministic child code serialises the result as JSON and
    returns it through `state.stopSession({ result })`, or as a file attachment, which is copied to the
    parent under a MUST. The integration document lists the point among those not written up, and no issue
    is needed for grounding.'
  concerns:
  - approval-human
- id: SA-58
  title: The 'parent teardown policy' is named but not defined
  priority: minor
  category: subagents_and_composition
  summary: 'Subagents §4.1 lists ''a parent teardown policy'' among the three ways an instance is destroyed;
    the term occurs once and is not defined. `terminate()` is described for the thread it is called on
    and for that thread''s entry in its parent''s registry; what terminating a parent does to running
    children is not stated. Only deletion through the Client API has a defined cascade. Also unstated:
    what happens to a completion queued toward a terminated parent, and whether a terminated instance
    counts toward `maxInstances`.'
  refs:
  - content/0.2.0/specification/subagents.md §4.1 Persistence Is Universal (lines 116-124), §8 Queue and
    Termination (lines 239-244)
  - content/0.2.0/specification/threads.md §8 Lifecycle (lines 467-478)
  - content/0.2.0/infrastructure/runtime.md §10 Termination Semantics (lines 227-235)
  - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread (lines 275-299)
  quote: '**Only explicit termination destroys an instance**: `state.terminate()`, operator action, or
    a parent teardown policy.'
  searched: 'content/0.2.0 and the published index.d.ts for teardown (one hit: subagents.md line 121),
    descendant (environment propagation, scoped variables, file paths and the Client API deletion set),
    orphan (subagents.md line 120) and cascad (message deletion only); terminate in subagents.md, threads.md
    and runtime.md.'
  proposed_change: Define the term in Subagents §4.1 and state in Threads §8 and Runtime §10 what `terminate()`
    on a thread does to its descendants; the minimal form requires a runtime to document whether termination
    cascades. State what happens to messages queued toward a terminated parent and whether a terminated
    instance counts toward `maxInstances`.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: each child applies its own rules in its own thread, ACS
    §5.13 describes a host ending a run''s delegations without a MUST, and a host that wants them ended
    calls `terminate()` on each child it recorded. The record rated it important; minor is used because
    no ACS requirement depends on a cascade. The undefined term is an editorial point; issue 06 lists
    disagreements between passages and does not include it.'
  concerns:
  - multi-agent
- id: SA-59
  title: Nothing rejects or bounds a cycle of `immediate` relationships
  priority: minor
  category: subagents_and_composition
  summary: Subagents §3.2 says immediate spawning is recursive through the child graph. No rule rejects
    or bounds a cycle among `immediate` relationships (an agent whose immediate child, directly or through
    further immediate children, instantiates the first agent again). That such a definition spawns without
    bound is an inference from the text, not a statement in it. The definition-time errors of Agents §8
    are checks on one definition, and the published validator has no cycle code; Prompts §2.4 rejects
    the analogous case for includes.
  refs:
  - content/0.2.0/specification/subagents.md §3.2 Immediate Spawning (lines 96-104)
  - content/0.2.0/specification/agents.md §8 Definition-Time Errors (lines 193-205)
  - content/0.2.0/specification/prompts.md §2.4 Include Resolution (lines 88-89)
  - content/0.2.0/infrastructure/runtime.md §7.3 Optional + Immediate + Hidden Branches (line 145)
  - '@standardagents/spec 0.45.10 dist/index.d.ts line 6477 (`DEFINITION_ISSUE_CODES`)'
  quote: 'Immediate spawning is recursive: if an immediate child''s own sides declare immediate relationships,
    those spawn as the child thread activates.'
  searched: 'content/0.2.0 for cycle, circular, recursi, infinite and depth: the include rule (prompts.md
    lines 88-89), recursive immediate spawning (subagents.md line 98, runtime.md line 145), message depth
    and code-execution safety caps. `DEFINITION_ISSUE_CODES` in the published index.d.ts: no cycle code.'
  proposed_change: Require a runtime to reject, when definitions are loaded, a cycle of `immediate` relationships
    none of which is `optional`, and to bound immediate-spawn depth with a diagnosable error for a cycle
    that passes through an `optional` relationship. Relationships that are not immediate are unaffected.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: an author controls the `immediate` relationships of the
    definitions it writes, and the unbounded spawn is inferred, not stated. It is a short defect report
    on general grounds; issue 06 does not include it.'
  concerns:
  - multi-agent
- id: SA-60
  title: Packages have no `annotations` slot that is readable without importing code
  priority: minor
  category: packaging_and_versions
  summary: 'Owner-keyed metadata exists only on function tools (Tools §8), and a tool''s annotations sit
    behind the package''s loaders. Packaging treats that as a problem for one fact: `parentHooks` is duplicated
    into `package.json` ''so a marketplace or installer can show composition effects''. The `standardagent`
    field has four sub-fields and `PackedMeta` six members, none of them an owner-keyed slot for display
    hints, provenance or data-handling labels.'
  refs:
  - content/0.2.0/distribution/packaging.md 'package.json Requirements' (lines 178-187; quote at line
    184)
  - content/0.2.0/distribution/packaging.md 'PackedMeta' (lines 189-215)
  - content/0.2.0/specification/tools.md §8 Annotations (lines 123-146)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 412, 424, 532 (annotations on tool types only),
    5778-5795 (PackedMeta)'
  quote: entry agent so a marketplace or installer can show composition effects
  searched: '''annotation'' (case-insensitive) in content/0.2.0: specification/tools.md only. ''annotation'',
    ''additional'', ''unknown'', ''extension'', ''extra'' and ''custom'' in distribution/packaging.md:
    no match. ''annotations'' in index.d.ts: lines 424 and 532, both on tool types. An `annotations` key
    on a `PackedMeta` literal is TS2353.'
  proposed_change: Add an optional JSON-serializable `annotations` member to `PackedMeta` and to `package.json.standardagent`,
    under the four rules of Tools §8, reproduced by the packer in both places as `parentHooks` is. Leave
    out a per-tool map, which would publish the names of internal tools.
  backwards_compatible: true
  disposition: proposal
  proposal: 05-annotations.md
  coverage: partial
  disposition_note: Part 1 of issue 05 has the packer copy each entry agent's annotations into `PackedMeta`
    and the `standardagent` field, which gives installers owner-keyed metadata without importing code,
    keyed by entry agent. It adds no member for the package as a whole, and tool annotations stay behind
    the loaders.
  concerns:
  - packaging-conformance-governance
  related:
  - SA-10
- id: SA-61
  title: Whether unknown `package.json` and `__meta` members are permitted and preserved is unstated
  priority: minor
  category: packaging_and_versions
  summary: 'Packaging defines four `standardagent` sub-fields and six `PackedMeta` members and says nothing
    about others: whether a reader may reject a package that carries an unknown sub-field or `__meta`
    key, and whether a packer that writes `package.json` keeps author-supplied members. The published
    `PackedMeta` has no index signature, so a typed literal rejects an extra key. The Thread Client API
    has such a rule for clients (Client API §1, item 4); Packaging has none.'
  refs:
  - content/0.2.0/distribution/packaging.md 'Entry Point Exports' (line 29)
  - content/0.2.0/distribution/packaging.md 'package.json Requirements' (lines 149-187; quote at line
    178)
  - content/0.2.0/distribution/packaging.md 'PackedMeta' (lines 189-215)
  - content/0.2.0/specification/threads/client-api.md §1 Scope, item 4 (line 12)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 5778-5795 (PackedMeta)'
  quote: 'The `standardagent` field marks this as a Standard Agent package. Its sub-fields:'
  searched: '''additional'', ''unknown'', ''extension'', ''extra'', ''custom'', ''ignore'', ''unrecogni''
    and ''preserve'' in distribution/packaging.md: no match. ''unknown field'', ''unknown member'', ''unknown
    key'', ''additional propert'', ''unrecogni'' and ''not recognize'' in content/0.2.0: client-api.md
    line 12 (clients ignore unknown response fields and frame types) and code-execution.md line 121 (unknown
    `runCode` option keys are rejected). An extra key on a `PackedMeta` literal is TS2353.'
  proposed_change: 'Add to Packaging: readers of `package.json.standardagent` and of `__meta` MUST ignore
    members they do not recognise, and packers MUST NOT remove author-supplied members of `package.json`.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'No issue asks for it. It does not limit a grounded agent: the binding''s classification
    travels in tool annotations, not in package metadata. It bears on part 1 of issue 05, which calls
    its packer copy into `PackedMeta` and `standardagent` additive; whether a reader tolerates a member
    it does not know is the point this finding shows to be unstated.'
  concerns:
  - packaging-conformance-governance
  - models-context-memory-security
- id: SA-62
  title: A handler cannot declare the targets it invokes by name
  priority: minor
  category: packaging_and_versions
  summary: Packaging says 'Packers discover a tool's named invocation dependencies from its `uses` declaration',
    and Tools §2.1 says a packed tool MUST declare the targets it invokes by name. `uses` exists on function
    tools only. Handlers §6 says a handler 'may do anything tools can do', which includes `state.invokeTool()`,
    but `defineHandler` accepts `description` and `execute` only. A packer has no declared source for
    the targets a packed handler invokes by name, and no rule rejects an undeclared one.
  refs:
  - content/0.2.0/distribution/packaging.md introduction (lines 3-5), Visibility Rules (lines 221-230)
  - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (lines 36-44)
  - content/0.2.0/specification/handlers.md §6 Capabilities (line 81), §10 TypeScript Reference (lines
    142-147)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 5233-5264 (HandlerDefinition, DefineHandlerOptions),
    lines 484 and 568 (`uses` on tool definitions)'
  quote: Packers discover a tool's named invocation dependencies from its `uses` declaration.
  searched: 'packaging.md, handlers.md, tools.md, effects.md, hooks.md and threads/endpoints.md for uses,
    depend and discover; the published index.d.ts for `uses`: declared on tool definitions only (lines
    484 and 568).'
  proposed_change: 'Add an optional `uses` to `defineHandler` with the meaning it has on `defineTool`:
    the names of tools, prompts or agents the handler may invoke. A packed handler declares them, packers
    include them, and a runtime rejects an invocation outside a supplied list. Say whether effect names
    scheduled by code belong in the list.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: a grounded tool applies its rules inside `execute` however
    it is invoked, the reference binding has no handler-backed side, and its package entry point lists
    every tool in the `tools` registry directly. The gap concerns what a packer can discover; the record
    rated it important, and minor is used because no grounding rule depends on packer discovery. It would
    matter for a packed agent whose handler is the only caller of its tools, a shape the integration document
    describes and the binding does not yet use.'
  concerns:
  - workflow-execution
- id: SA-63
  title: The platform globals available to definition code are not defined
  priority: minor
  category: packaging_and_versions
  summary: 'The text lists the globals of the `runCode` sandbox in detail and says nothing about the environment
    in which tools, hooks, handlers, effects and endpoints run. Its own text presumes several: `Request`
    and `Response` in the endpoint signature, `AbortSignal`, `setTimeout` for a caller''s deadline, and
    `fetch` and `TextDecoder` in examples. `crypto` and `WebAssembly` are mentioned only as absent from
    the sandbox. A package cannot tell whether `crypto.subtle`, timers or `WebAssembly` exist, although
    Packaging requires packed behaviour to be expressible through surfaces the specification defines.'
  refs:
  - content/0.2.0/specification/threads/code-execution.md introduction (line 18), §6.1 No Host Capabilities
    on `globalThis` (lines 385-391), §11 Security Considerations (line 553)
  - content/0.2.0/infrastructure/runtime.md §14.1 Isolation (line 262)
  - content/0.2.0/specification/threads/endpoints.md §3 Handler Signature (lines 62, 69)
  - content/0.2.0/specification/threads/execution-state.md §3 Controlling Execution (line 67)
  - content/0.2.0/specification/threads/filesystem.md §3 Reading Files (line 48)
  - content/0.2.0/distribution/packaging.md Portability requirements (lines 9-19)
  quote: Host APIs (`fetch`, `setTimeout`, `console`, `process`, `require`, etc.) **MUST NOT** be present
    unless the caller installed them via `options.globals`.
  searched: 'globalThis, globals, subtle, crypto, webassembly, wasm, WinterCG, WinterTC, ''web standard'',
