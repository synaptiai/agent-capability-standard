  - content/0.2.0/specification/threads/client-api.md §10 item 5 (line 296), §14 Reading a File (lines
    391-395)
  quote: Each thread has an isolated file system for storing files, images, and other binary data. It
    is addressable through `ThreadState` and survives execution cycles — two separate invocations of the
    same thread see the same file tree.
  searched: 'MUST, SHOULD, MAY in filesystem.md: one hit (line 178). ''file system'', ''filesystem'',
    ''files'' in runtime.md: the attachment-copy rules and the Thread Client API summary only. overwrit,
    already exists, parent director, recursive, glob in filesystem.md, threads.md and runtime.md: `moveFile`
    ''does not overwrite'' and ''Find files by glob'' only. moveFile, renameFile in threads.md: not found.'
  proposed_change: 'Add a ''Thread File System'' section to Runtime mirroring the key-value wording: files
    persist across executions, restarts and redeploys for the thread''s lifetime; a completed write, delete,
