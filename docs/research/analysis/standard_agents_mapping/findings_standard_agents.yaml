  searched: '`subagent_id`, `status_kind`, `subagent_event`, `forwarded_from` and ''outcome'' in threads/messages.md,
    subagents.md, runtime.md, threads.md and index.d.ts: no sentence says when the runtime sets `subagent_id`,
    no values are given for `status_kind`, and no rule keeps a request body or a hook from setting either.
