  quote: 4. This section defines no stream frame for a deletion.
  searched: '''delet'' in hooks.md: no match. `before_delete`, `after_delete` and `message_deleted` in
    content/0.2.0 and index.d.ts: no match. The `ThreadStreamFrame` union (client-api.md lines 428-434):
    five members, none for a deletion. A hook named `before_delete_message` is rejected by the published
    `defineHook` types (TS2820).'
  proposed_change: 'Add a stream frame `{ type: ''message_deleted''; message_id: string; depth: number
    }`, sent for the deleted message and each cascaded tool-result message; clients already ignore unknown
