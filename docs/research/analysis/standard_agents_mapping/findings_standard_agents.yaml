- id: SA-82
  title: hooks.md calls `state.execution` always present in hooks, although it is null at rest
  priority: minor
  category: editorial
  summary: Hooks §2.1 types `execution` as `ExecutionState` with the description 'Always present in hooks',
    and §2.2 says `state.execution` 'is always available'. Hooks §1.3 has lifecycle hooks run for at-rest
    operations, Messages §3.1 applies the message hooks to `injectMessage()` at rest, and Threads §1.2.1
    says the property is null at rest. The published type is `ExecutionState | null`. The examples in
    §2.3, §8.2 and §8.6 dereference `state.execution` without a check; the §8.6 example is a `before_create_message`
    hook, which throws when a message is injected at rest.
  refs:
  - content/0.2.0/specification/hooks.md §2.1 (line 136), §2.2 (line 140), §2.3 (line 161), §8.2 (line
    673), §8.6 (lines 755-757)
  - content/0.2.0/specification/hooks.md introduction (lines 7-10), §1.3 (lines 99-100)
  - content/0.2.0/specification/threads.md §1.2.1 Properties (line 49), §1.3 Access Contexts (lines 182-186)
  - content/0.2.0/specification/threads/execution-state.md §1 Availability (lines 9-11)
  - content/0.2.0/specification/threads/messages.md §3.1 Persistence and lifecycle (line 117), §7 Conformance
    Scenarios (line 195)
  - '@standardagents/spec 0.45.10 dist/index.d.ts line 3410 (`execution: ExecutionState | null`)'
  quote: '| `execution` | `ExecutionState` | Always present in hooks |'
  proposed_change: In Hooks §2.1 and §2.2, type `execution` as `ExecutionState | null` and say that it
    is null when a lifecycle hook runs for an at-rest operation; guard the examples in §2.3, §8.2 and
    §8.6 with `state.execution?.`.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Not among the nine items of issue 06. It is an inconsistency of the kind that issue
    collects and could be added to it as one more item. It does not affect grounding: the reference binding
    reads `state.execution?.flowId` and treats a null execution as no execution.'
  concerns:
  - evidence-audit-observability
- id: SA-83
  title: The published package links to a migration page the repository does not contain
  priority: minor
  category: editorial
  summary: '`@standardagents/spec` 0.45.10 points to `https://standardagentspec.com/0.2.0/getting-started/changelog`:
    eight JSDoc references in index.d.ts and the `MIGRATION_URL` constant in index.js, which the validation
    helper appends to its messages for removed 0.1.0 fields. At faccc8b `content/0.2.0/getting-started/`
    holds only `examples.md`, `public/_redirects` has no rule for the path, and the contributor notes
    say ''Do not add per-version changelog pages.'' By those notes an unknown URL is served the 404 page,
    so a reader who follows the link from an error message finds no migration guide.'
  refs:
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 1973, 2090, 4235, 4666, 4675, 4682, 4704, 4977'
  - '@standardagents/spec 0.45.10 dist/index.js line 375 (MIGRATION_URL)'
  - content/0.2.0/getting-started/ (contains only examples.md)
  - public/_redirects (five rules); astro.config.mjs (line 12)
  - AGENTS.md 'Content Collections' (lines 109-110), 'Search, Sharing, and Unknown URLs' (lines 258, 272-274)
  quote: https://standardagentspec.com/0.2.0/getting-started/changelog
  searched: '''changelog'' and ''migration'' across content/0.2.0, src/, public/, scripts/ and README.md:
    no matches; AGENTS.md line 109 only. public/_redirects: no rule for /0.2.0/getting-started/changelog.
    Whether the URL resolves on the live site was not checked (no network access).'
  proposed_change: 'Report the link and leave the remedy to the maintainers. One fix that keeps the rule
    against per-version changelog pages: a line in `public/_redirects` that sends the path to the pages
    documenting the 0.2.0 shapes. Ask whether a single version-independent history page would be accepted.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Does not affect grounding: the binding targets 0.2.0 and uses none of the removed
    0.1.0 shapes. The defect is established against the repository at faccc8b, not against the live site,
    and should be checked there before anything is filed. The links are in the package, whose source is
    not among the repository''s tracked files.'
  concerns:
  - packaging-conformance-governance
questions:
- id: SA-Q01
  question: 'What does a runtime do with a model-issued tool call whose name was not in the tool list
    of the request that produced it, or that was made under `toolChoice: ''none''`, or that names a `hidden`
    relationship: execute it, or store an error result?'
  refs:
  - content/0.2.0/specification/prompts.md §4.2 Tool Choice Behavior (line 197)
  - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 44)
  - content/0.2.0/specification/subagents.md §5 Lifecycle Tools (line 163)
  - content/0.2.0/infrastructure/runtime.md §7.3 Optional + Immediate + Hidden Branches (line 143)
  depends: Whether a prompt's `tools` list and `hidden` are boundaries. If they are, a read-only prompt,
    a guard tool or a handler-only caller can rely on omission; if not, every tool refuses in its own
    `execute`.
  finding: SA-02
  outcome: 'Asked by 07-unoffered-tool-call.md: its proposed rule covers a call whose name was not
    offered, a call under `toolChoice: ''none''` and a model''s lifecycle call that targets a hidden
    relationship.'
- id: SA-Q02
  question: Are effect handlers, thread endpoint handlers and `invokeTool` calls that code starts together
    serialized with a running execution of the same thread, or may they interleave with it and with each
    other? Is `state.execution` present inside an effect?
  refs:
  - content/0.2.0/infrastructure/runtime.md §2 Invocation Triggers (lines 36-38)
  - content/0.2.0/infrastructure/runtime.md §11 Concurrency (line 239)
  - content/0.2.0/specification/threads.md §1.3 Access Contexts (lines 182-186)
  - content/0.2.0/specification/threads.md §4 Effect Scheduling (line 277)
  - content/0.2.0/specification/threads/endpoints.md §5 Endpoint Context (line 109)
  depends: Whether a read-modify-write on the thread store (a counter, a single-use approval, a checkpoint
    list) is safe as written, or needs one writer or a lock outside the thread.
  finding: SA-22
  outcome: 'Asked by 09-execution-concurrency-and-flow-id.md: part 1 asks what is serialized with a
    running execution (effects, endpoints, code-started `invokeTool` calls), and its table asks whether
    `state.execution` is present in an effect.'
- id: SA-Q03
  question: May code that holds another thread's `ThreadState` (from `getParentThread()`, `getChildThread()`
    or the `childState` argument of `after_subagent_created`) read and write that thread's key-value store
    and files, and call `stopSession()`, `execution.stop()` or `terminate()` on it?
  refs:
  - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store (the second section numbered 14) §14.1
    item 3 (line 352)
  - 'content/0.2.0/specification/subagents.md §6.4 Child → Parent: Explicit Escalation (line 219)'
  - content/0.2.0/specification/threads.md §9 (lines 485-486)
  - content/0.2.0/specification/hooks.md §7 TypeScript Reference (lines 525-529)
  depends: Whether a child hands structured records to its parent through the parent's store, or only
    through messages and attachments; and whether a parent can end a child's session from code.
  finding: SA-15
  outcome: 'Asked by 06-editorial-inconsistencies.md, item 6: whether a `ThreadState` for another thread
    may read and write its key-value store and files, and whether `stopSession()`, `execution.stop()` and
    `terminate()` on it end that thread''s session.'
- id: SA-Q04
  question: Where the 0.2.0 text and `@standardagents/spec` (which declares `SPEC_VERSION = "0.2.0"`)
    differ, which governs? Are members found only in the types, such as `historyLimit`, `runAgent`, `QueueMessageInput.metadata`
    and the user-value methods, part of 0.2.0?
  refs:
  - README.md (line 16)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 6513-6521 (package comment), line 6528 (`SPEC_VERSION`),
    lines 4416-4428 (`historyLimit`), lines 3078-3097 (`runAgent`)'
  - content/0.2.0/specification/threads/execution-state.md §2.2 Live execution history (line 45)
  depends: Whether a portable package may use a types-only member and a runtime built from the text must
    provide it. With `historyLimit`, whether `execution.messageHistory` may be a window of the history.
  finding: SA-28
  outcome: 'Asked by 11-text-and-published-types.md: which source governs, and the status of each member
    found only in the types, `historyLimit` with its effect on `execution.messageHistory` among them.'
- id: SA-Q05
  question: 'Do lowercase ''must'', ''should'' and ''may'' carry requirement force? Examples: ''Stop evaluation
    order should be:'' (Runtime §6), ''`subagent_create` must receive a non-empty `name` argument'' (Runtime
    §7.4), ''Implementations should treat this as a successful terminal child run'' (Runtime §8.3).'
  refs:
  - content/0.2.0/infrastructure/runtime.md §6 Stop Conditions (line 104)
  - content/0.2.0/infrastructure/runtime.md §7.4 Initial Payload Mapping (lines 172, 174)
  - content/0.2.0/infrastructure/runtime.md §8.3 Status Updates (line 217)
  depends: Whether a binding may rely on those sentences (the stop order, argument validation in Runtime
    §7.4, the outcome of `stopSession()`), or only on sentences that use the bold capitals.
  finding: SA-69
- id: SA-Q06
