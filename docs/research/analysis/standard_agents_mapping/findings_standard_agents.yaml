- id: SA-41
  title: Cross-thread provenance keys are ambiguously typed and duplicated
  priority: minor
  category: messages_and_identity
  summary: Messages §1 defines a top-level `subagent_id` and §1.1 a `metadata.subagent_id` convention,
    without saying which a consumer reads. `metadata.forwarded_from` is 'The origin thread or message
