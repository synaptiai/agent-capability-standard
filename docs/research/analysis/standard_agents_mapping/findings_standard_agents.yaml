  - safety-enforcement
  - workflow-execution
  - packaging-conformance-governance
  related:
  - SA-80
- id: SA-19
  title: Whether stop and session bindings apply when the bound tool errors is unstated
  priority: important
  category: execution_and_lifecycle
  summary: 'Agents §1.2 describes `stopTool` as ''Stop side turn when this tool is called'', §3 says a
    session binding names the ''tool that controls the lifecycle action'', and §4 gives the evaluation
    order. No sentence says whether a binding takes effect when the bound tool''s result has `status:
    ''error''`. Two conforming runtimes can differ: on one, a tool that declines still ends the turn or
    the session and passes its model-supplied argument to a parent as the result; on the other it does
    not.'
  refs:
  - content/0.2.0/specification/agents.md §1.2 SideConfig, PromptSide (lines 42-47)
  - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 97-113)
  - content/0.2.0/specification/agents.md §4 Stop Semantics (lines 117-122)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50), §6 Stop Conditions (lines 104-109)
  - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 19, `tool_status`)
  quote: '| `stopTool` | `string` | - | Stop side turn when this tool is called |'
  searched: 'agents.md, subagents.md and runtime.md for stopTool, sessionStop, sessionFail, sessionStatus,
    messageProperty, tool_status and `status: ''error''`: no sentence relates a binding to the status
    of the bound tool''s result.'
  proposed_change: 'State in Agents §3 and §4 whether `stopTool`, `sessionStop`, `sessionFail` and `sessionStatus`
    take effect when the bound tool returns `status: ''error''` (suggested: they do not, so that a tool
    can decline).'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound and in the author''s hands: a tool that can decline is never
    named in a binding, and a separate tool, or `state.stopSession()` called after the action has run,
    ends the turn or the session. The same question arises under issue 01, whose hook can decline a call
    to a bound tool: its rule says the returned result is persisted ''as an executed tool''s result is''
    and its open questions do not mention bindings. One open question added there covers this finding
    without a separate issue.'
  concerns:
  - approval-human
- id: SA-20
  title: Fate of a handler turn whose execution is lost is not stated
  priority: important
  category: execution_and_lifecycle
  summary: Handlers §4 requires delivery exactly once per message and forbids automatic redelivery of
    a message 'whose handler invocation failed'; §5 describes failure only for a handler that throws.
    Execution State §4.3 settles a lost execution (eviction, deploy, crash) as `failed` with reason `execution_lost`
    and mentions 'a later recovery run', a term that occurs once and is not defined. The text does not
    say whether the interrupted message is delivered again. A handler author cannot tell whether a turn
    must be idempotent, or whether the thread waits for a new message.
  refs:
  - content/0.2.0/specification/handlers.md §4 Delivery Semantics (lines 59-63)
  - content/0.2.0/specification/handlers.md §5 Error Semantics (lines 71-75)
  - content/0.2.0/specification/threads/execution-state.md §4.3 Requirements (line 120)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (line 52)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2204-2206 (ThreadRunState comment), 5221-5224
    (HandlerDefinition comment)'
  quote: A lost execution settles to `failed` with reason `execution_lost`; a later recovery run sets
    `running` again.
  searched: 'recovery run, recover, execution_lost, redeliver, exactly-once, exactly once, crash, evict
    in content/0.2.0 and the published index.d.ts: ''recovery run'' occurs once (execution-state.md line
    120) and is not defined; no passage addresses redelivery after a lost execution.'
  proposed_change: 'State in Handlers §4 which holds for a handler invocation interrupted by loss of its
    executor: the message is redelivered on recovery, and handlers are to be idempotent, or it is not
    redelivered and the turn is failed as for a throw. Align the ''exactly-once'' wording with the answer,
    and define ''recovery run'': what starts it and what it executes.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'An open question, not a defect: the rule against redelivering a message ''whose handler
    invocation failed'' can be read to cover a lost invocation, and the request is for one of two answers
    to be written down. It bears on a handler that hosts an ACS workflow run, an arrangement the integration
    document says needs the executor in JavaScript; the tool-calling binding defines no handler. It can
    be asked alongside SA-21, which raises the same loss-of-executor case for effects.'
  concerns:
  - workflow-execution
- id: SA-21
  title: Durability, timing and delivery guarantees of scheduled effects are not stated
  priority: important
  category: execution_and_lifecycle
  summary: Effects §3 requires only that runtimes enqueue effects asynchronously and preserve `args` until
    execution. No passage says that a scheduled effect survives a restart or redeploy, that it never runs
    early, how many times a handler may run, or what follows a throw. The idempotency bullet is addressed
    to runtimes, not to effect authors. The cases in which `removeScheduledEffect` returns `false` are
    stated only in a published type comment. A scheduled effect is the only time-based trigger, so a timeout,
    reminder or watchdog built on one is not portable.
  refs:
  - content/0.2.0/specification/effects.md §3 Execution Semantics (lines 83-90)
  - content/0.2.0/specification/threads.md §4 Effect Scheduling (lines 276-280), §4.3 Managing Scheduled
