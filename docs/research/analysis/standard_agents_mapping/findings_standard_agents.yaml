- id: SA-38
  title: Annotation keys have no naming rule that prevents collisions
  priority: minor
  category: annotations_and_metadata
  summary: Tools §8 says a key's 'meaning belongs to whoever owns the key' and gives no way to choose
    a key that another owner will not also choose; its own example uses a bare product name, `agentbuilder`.
