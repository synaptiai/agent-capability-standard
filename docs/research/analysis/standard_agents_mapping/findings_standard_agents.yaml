  - content/0.2.0/specification/users.md §2.1 Serialization (lines 79-80; Draft page)
  - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store (the second section numbered 14) §14.1
    item 2 (line 351)
  quote: A single thread **MUST NOT** execute multiple concurrent flows. Cross-thread concurrency is allowed.
  searched: 'serializ, concurren, atomic, transaction, compare-and, mutex, lease in content/0.2.0 and
    the published index.d.ts: apart from Runtime §11 and its line in the conformance summary, a serialization
    rule is stated for handler delivery and for the Draft user scope only. threads.md, effects.md, execution-state.md
    and endpoints.md for a statement of `state.execution` inside an effect: not found.'
  proposed_change: 'One sentence in Runtime §11: are effect handlers, thread endpoint handlers and code-initiated
    `invokeTool` calls serialized with a running execution of the same thread, or may they interleave
    with it? If they may, say so in the key-value section. Add effects and handler turns to the access-context
