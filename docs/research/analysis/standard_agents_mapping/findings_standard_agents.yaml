- id: SA-29
  title: '''Eligible persisted history'' is used normatively but not defined'
  priority: important
  category: models_and_context
  summary: Runtime §4 and Hooks §3 require a snapshot of 'eligible persisted history'. The text fixes
    eligibility by time of persistence and says silent messages remain eligible; it does not define it
    in terms of `includeChat`, `includePastTools`, depth, side or message status. What the two flags exclude
