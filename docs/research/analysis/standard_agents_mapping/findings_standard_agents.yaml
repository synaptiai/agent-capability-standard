- id: SA-18
  title: Code cannot end a session as failed
  priority: important
  category: execution_and_lifecycle
  summary: '`sessionFail` is a tool binding that only a prompt-backed side may declare (Agents §8 item
    6) and that a model''s tool call triggers. A handler side ends a session through `state.stopSession()`,
    which Runtime §8.3 treats as a successful terminal child run and whose reason `state_stop_session`
    settles `idle`; its published options are `result`, `notifyParent` and `status`. Handlers §5 nevertheless
    names session failure as something a handler ''must invoke explicitly''. A handler-backed child, or
    tool code, can report failure to a parent only inside result text.'
  refs:
  - content/0.2.0/specification/handlers.md §5 Error Semantics (line 77)
  - content/0.2.0/specification/agents.md §1.2 SideConfig (line 57), §8 Definition-Time Errors, item 6
    (line 202)
  - content/0.2.0/infrastructure/runtime.md §8.3 Status Updates (line 217)
  - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 113-114)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2659-2680 (StopSessionOptions), line 2997 (stopSession
    comment), line 4922 (`sessionFail?: never` on HandlerSide)'
  quote: This is deliberately unlike hooks (whose failures are non-fatal to the turn they decorate) and
    unlike session failure (`sessionFail` / `stopSession`), which a handler must invoke explicitly if
    an error should end the session.
  searched: 'content/0.2.0 and the published index.d.ts for failSession and fail_session: no match. sessionFail
    in both: every occurrence is a prompt-side binding, its effect, or a `never` member on HumanSide and
    HandlerSide. StopSessionOptions in the published types has `result`, `notifyParent` and `status` only.'
  proposed_change: 'Add one code path with the semantics of the `sessionFail` binding: `state.failSession(options)`
    or a failure option on `stopSession()`, settling the run `failed` with reason `session_fail` and delivering
    the failure payload to the parent. Otherwise state that failure from code is unavailable. Correct
    the sentence in Handlers §5 either way.'
  backwards_compatible: true
  disposition: proposal
  proposal: 10-child-session-outcomes.md
  coverage: full
  disposition_note: 'Issue 10 asks for a failure option on `stopSession()` that settles the run `failed`
    with reason `session_fail` and delivers the failure message, and for the Handlers §5 sentence to be
    corrected either way, within its table of what a parent receives for each way a child session ends.
    Until then a grounded workflow hosted in a handler ends a failed run as a successful stop whose
    `result` carries the code, as the integration document''s handler-host table says.'
