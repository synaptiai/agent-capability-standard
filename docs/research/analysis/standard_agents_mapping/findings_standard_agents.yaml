  - content/0.2.0/infrastructure/runtime.md Durable Key-Value Store (the second section numbered 14) §14.1
    items 3 and 8 (lines 352, 357)
  - content/0.2.0/specification/threads.md §7.2 Semantics (line 428), §9 (lines 484-487)
  - 'content/0.2.0/specification/subagents.md §6.1 Parent → Child (line 189), §6.4 Child → Parent: Explicit
    Escalation (line 219)'
  - content/0.2.0/specification/hooks.md §7 TypeScript Reference (lines 525-529)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2913-2919 (getChildThread, getParentThread), 6034-6044
    (after_subagent_created)'
  quote: 3. Each thread **MUST** maintain its own isolated key space. Values **MUST NOT** be readable
    by any other thread, including parent, child, or sibling threads.
  searched: 'getParentThread, getChildThread, childState, "parent''s key-value", ''not shared'' in content/0.2.0
    and the published index.d.ts: no sentence reconciles the isolation rule with a `ThreadState` held
    for another thread.'
  proposed_change: 'Reword item 3 to say what is isolated: a thread''s own `getValue` and `setValue` never
    resolve another thread''s keys, and nothing is inherited or copied. State whether a `ThreadState`
    obtained through `getParentThread()`, `getChildThread()` or a hook''s `childState` may read and write
    that thread''s store and files; if not, replace the example channel in Subagents §6.4.'
  backwards_compatible: true
  disposition: proposal
  proposal: 06-editorial-inconsistencies.md
  coverage: full
  disposition_note: 'Item 6 of issue 06 quotes the three passages, asks for item 3 to be reworded and
    for a statement on a `ThreadState` obtained through `getParentThread()` or `getChildThread()`, and
