    §1.3 Reasoning, item 4 (line 76)
  - content/0.2.0/specification/models.md §1.2 Optional Properties (line 27), §3.1 Fallback Behavior (lines
    42-48)
  - content/0.2.0/specification/providers.md §5 Response Format (lines 362-367), §9.3 ResponseSummary
    Structure (lines 533-549), §9.5 Implementation Notes (line 566)
  - content/0.2.0/specification/threads/decisions.md §4 Result Types (line 148)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2006-2097 (Message), 2067-2072 (comment on `prompt`)'
  quote: '| `prompt` | `string \| null` | Name of the prompt that produced the message |'
  searched: 'A model member in the Messages §1 table and in `interface Message` (index.d.ts lines 2006-2097):
    none; `message.model` is TS2339. ''model'' in threads/messages.md: reasoning and model-context text
    only. ''log record'' in content/0.2.0: providers.md line 566 only, with no definition.'
  proposed_change: 'Add an optional `model` field to the message record: the `name` of the model definition
    that produced an assistant message, the fallback when one answered. Runtimes SHOULD set it; consumers
    tolerate its absence. A second optional field for the provider-reported identifier is left to the
    maintainers.'
  backwards_compatible: true
  disposition: not_proposed
