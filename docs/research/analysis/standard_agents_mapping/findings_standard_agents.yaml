  priority: minor
  category: models_and_context
  summary: A model definition may list `fallbacks`, so the model that answers can differ from the one
    the prompt names. The message record has `prompt` and no model field. Provider code can see the answering
    model (`ProviderResponse.metadata.model`, `ResponseSummary.model`), but nothing requires it to be
    stored, and Providers §9.5 refers to 'log records' that no page defines. Messages §1.3 makes reasoning
    replay depend on what the selected model accepts; once a fallback answers, `prompt` no longer identifies
    the model that wrote a message.
