- id: SA-11
  title: A message accepted through the Thread Client API records no authenticated caller
  priority: important
  category: messages_and_identity
  summary: 'The send route requires an authenticated caller and thread endpoints receive `auth.caller`,
    but the message record has no field for who sent it, and `role` is a perspective, not a sender. A
    handler, tool or hook that reads a `role: ''user''` message cannot tell a client''s message from one
    queued by a parent, by package code or by the runtime. A sign-off taken as a message, the approval
    gate of Agents §7, carries no approver. Outside the Draft Users page, only a thread endpoint gives
    package code the caller.'
  refs:
  - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 11-38), §1.1 Provenance
    Metadata Conventions (lines 40-49), §4 Queueing Messages (lines 157-162)
  - content/0.2.0/specification/threads/client-api.md §3.1 Authentication and access (lines 41-46), §6
    Creating a Thread, item 1 (line 159), §12 Sending a Message (lines 334-370)
  - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 96-105)
  - content/0.2.0/specification/agents.md §1.1 The Three Backings (line 19), §7 Human-in-the-Loop Composition
    (lines 169-191)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2006-2097 (Message), 2101-2139 (InjectMessageInput,
    QueueMessageInput, MessageUpdates)'
  quote: The specification deliberately does **not** define who the person is or how their input arrives
    — identity, notification, and reply surfaces are runtime and interface concerns.
  searched: '`sender`, `sent_by`, `sentBy`, `created_by`, `author`, `principal`, `approver` and `from_user`
    in content/0.2.0 and index.d.ts: no message field (the hits are principals of skills and of the Draft
    Users page, the packaging `author`, and the comment ''the approver'' in agents.md line 185). `user_id`
    in content/0.2.0: thread records only (client-api.md lines 187, 229, 265). `user_id` and `sender`
    on `Message` are TS2339.'
  proposed_change: For a message accepted through the send route (Client API §12), have the runtime set
    a read-only `user_id` on the message record to the authenticated caller's id, `null` on every other
    message. No input type and no message hook can set it. A reserved `metadata` key serves equally if
    the runtime overwrites supplied values.
  backwards_compatible: true
  disposition: proposal
  proposal: 02-message-sender.md
  coverage: full
  disposition_note: Issue 02 proposes the read-only top-level `user_id` of the approval-human mapping,
