  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 3788-3846 (ModelCapabilities)'
  quote: If a model does not support vision, runtimes may filter image parts at request time while preserving
    stored message attachments.
  searched: 'audio, supportsFiles, supportsAudio, supportsVideo in content/0.2.0: not found; the word
    ''vision'': runtime.md line 82 only. Members named supports* of `ModelCapabilities` in the published
    index.d.ts: `supportsImages`, `supportsToolCalls`, `supportsStreaming` and `supportsJsonMode`, with
    deprecated aliases.'
  proposed_change: 'Add an optional capability for file inputs, for example `supportsFiles?: boolean |
    string[]` listing accepted media types. When a runtime filters an attachment part because the model
    cannot accept it, it SHOULD leave a short text placeholder naming the file, as `recentImageThreshold`
    replaces older images with text descriptions.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'The workaround is sound for the one modality SA declares: a host can read `capabilities.supportsImages`
    before it dispatches an image step and fail the step otherwise, and the stored message keeps its attachments.
    The ACS side is a lowercase ''should'' in a guide, not a requirement of the Standard. A feature request
    for authors of document-processing agents.'
  concerns:
  - models-context-memory-security
- id: SA-76
  title: The text does not say how a function tool gets its name
  priority: minor
  category: editorial
  summary: A function tool definition carries no `name` (the published `defineTool` options reject one),
    yet hooks, `uses`, prompt `tools` and the stored result message identify a tool by name. Tools §2
    gives no rule. Effects §1.3 has one for effects, the Packaging example keys the `tools` export by
    name, and Type Registry §4.1 tells generators to extract 'the `name` property from each definition',
    which a tool definition lacks. Only a comment in the published types says tools 'get the filename'.
  refs:
  - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 15-34)
  - content/0.2.0/specification/type-registry.md §4.1 Build-Time Generation (lines 224-230; quote at line
    229)
  - content/0.2.0/specification/effects.md §1.3 Naming (lines 51-55)
  - content/0.2.0/distribution/packaging.md 'Entry Point Exports' (lines 66-74), 'Naming Conventions'
    (line 264)
  - content/0.2.0/getting-started/examples.md introduction (line 11)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 638-643 (comment on validateToolName)'
  quote: 2. Extracting the `name` property from each definition
  searched: '''file-based'', ''filename'', ''file name'', ''tool name'', "tool''s name", ''name of the
    tool'' and ''tool names'' (case-insensitive) in content/0.2.0: effect names (effects.md line 53),
    endpoint routing (threads/endpoints.md, users.md), relationship names (subagents.md lines 47, 78;
    agents.md line 201), `PromptToolConfig.name` (prompts.md line 121), the reserved lifecycle names (prompts.md
    line 176; tools.md line 85), the message `name` field (threads/messages.md line 16) and registry comments
    (type-registry.md lines 353, 374); none states how a function tool is named. `name` on a `defineTool`
    literal is TS2353.'
  proposed_change: 'In Tools §2, state that a function tool''s name is the key under which it is registered:
    the key of a package''s `tools` export, and for an unpacked project the name the runtime assigns.
    Correct Type Registry §4.1 step 2 for definitions that have no `name` property.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'No issue asks for it. Issue 03 states the fact in passing (''`defineTool` takes no
    name'') and asks, in its open question 3, whether a packed tool''s `name` is local or qualified. The
    gap does not limit a grounded agent: a package''s tools are named by the keys of its `tools` export.
    Type Registry §4.1 step 2 contradicts the tool definition in the way the items of issue 06 do and
    could be added there as an item; a separate issue is not warranted.'
  concerns:
  - tools-contracts
  - published-api-extension-points
- id: SA-77
  title: The approval-gate example is incomplete and does not say what the parent receives
  priority: minor
  category: editorial
  summary: 'Agents §7 calls the approval gate ''The canonical use'' of a human-backed child and shows
    a few lines of configuration: a presenter prompt whose `record_decision` tool ends the session with
    a `decision` argument. The text does not say that what the parent receives through `messageProperty`
    is an argument written by the side A model, not the person''s own message. None of the nine examples
    on the getting-started page has a human-backed child, so the pattern is not shown end to end.'
  refs:
  - content/0.2.0/specification/agents.md §7 Human-in-the-Loop Composition (lines 173-191)
  - content/0.2.0/specification/agents.md §3 SessionToolBinding (lines 109-111)
  - content/0.2.0/specification/subagents.md §9 Example (line 259)
  - content/0.2.0/getting-started/examples.md (line 3; sections 1 to 9)
  quote: 'sessionStop: { name: ''record_decision'', messageProperty: ''decision'' },'
  searched: 'content/0.2.0 for approval_gate, record_decision, approval_presenter and awaiting_human:
    agents.md §7, subagents.md §4.2, §4.3 and §9 and execution-state.md §4 only. The agent definitions
    of the nine examples: every composed child has a prompt on side A and a prompt or a handler on side
    B.'
  proposed_change: 'Non-normative: add an example with a human-backed child end to end (request arguments
    through `requiredSchema`, how the person''s message arrives, what the parent receives), and one sentence
    in Agents §7 saying that the text returned through `messageProperty` is the side A model''s account
    of the person''s answer.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'A documentation request, not a defect: Agents §7 limits its claim to ''only the waiting
    state and its fulfillment''. It does not affect grounding, because the binding records a decision
    through an authenticated thread endpoint and never takes one from a `sessionStop` argument. Issue
    02 cites the approval gate in its Problem section and does not ask for an example.'
  concerns:
  - approval-human
- id: SA-78
  title: Handlers §5 requires a 'request/execution log' the specification does not define
  priority: minor
  category: editorial
  summary: Handlers §5 says of a throwing handler that 'The error **MUST** be surfaced on the runtime's
    request/execution log as a runtime-origin failure'. Other passages presuppose a runtime log (Providers
    §7 and §9.5, Threads §9.3, Runtime §8.2, the 'UI/log label' cells of Agents §1.2), but none defines
    one, and the repository's contributor guide calls application logging an implementation concern. The
    requirement cannot be tested against the specification, and package code has no specified way to read
    the error.
  refs:
  - content/0.2.0/specification/handlers.md §5 Error Semantics (line 73)
  - content/0.2.0/specification/providers.md §7 Error Handling (lines 425-426), §9.5 Implementation Notes
    (line 566)
  - content/0.2.0/specification/threads.md §9.3 Parent Messaging (line 542); content/0.2.0/infrastructure/runtime.md
    §8.2 Child -> Parent (line 209)
  - content/0.2.0/specification/agents.md §1.2 SideConfig (lines 30, 39, 54)
  - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (lines 113-114)
  - AGENTS.md (root of the standardagents/spec repository) lines 112-114
  quote: The turn is marked failed. The error **MUST** be surfaced on the runtime's request/execution
    log as a runtime-origin failure — a throwing handler never silently swallows a message.
  searched: 'content/0.2.0 (examples page aside) for log, logs, logged and logging: `console.log` in examples,
    the `logs` of code execution, redaction notes and the passages cited; no definition of a request or
    execution log. The published index.d.ts for getLogs and listLogs: no match.'
  proposed_change: 'Reword Handlers §5 so that the MUST is testable without a log: state the observable
    outcome of a throwing handler in terms the specification defines (the run status and its `reason`),
    and say that how the error is shown to operators is implementation-defined.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'Editorial, and it does not affect grounding: handler code that needs a record of
    its own failure catches the error and writes the record itself. Issue 06 lists disagreements between
    passages and does not include this undefined term; it fits there as a further item.'
  concerns:
  - evidence-audit-observability
- id: SA-79
  title: '`parallelToolCalls` is described as parallel execution although tool calls execute sequentially'
  priority: minor
  category: editorial
  summary: Prompts §1.2 describes `parallelToolCalls` as 'Allow parallel tool execution', and the published
    type comment says 'Allow parallel execution of multiple tool calls.' Runtime §5.1 requires tool calls
    to execute sequentially in the returned order; Tools §9 states the rule for 'local tools'. The sentence
    after the Prompts table says an explicit value 'controls the provider option'. The default changed
    from `false` in 0.1.0 to 'Provider default' in 0.2.0. The description does not tell a reader whether
    tools can overlap.
  refs:
  - content/0.2.0/specification/prompts.md §1.2 Optional Properties (lines 28, 38)
  - content/0.2.0/infrastructure/runtime.md §5.1 Ordering (line 88)
  - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153)
  - content/0.1.0/specification/prompts.md §1.2 Optional Properties (line 28)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 4341-4346 (PromptDefinition.parallelToolCalls)'
  quote: '| `parallelToolCalls` | `boolean` | Provider default | Allow parallel tool execution |'
  proposed_change: Describe the property as allowing the model to return more than one tool call in one
    response, a provider option, and state that the runtime still executes the returned calls sequentially,
    in order (Runtime §5.1). Reword the published type comment the same way.
  backwards_compatible: true
  disposition: proposal
  proposal: 06-editorial-inconsistencies.md
  coverage: full
  disposition_note: Item 9 of issue 06 quotes Prompts §1.2 and Runtime §5.1 and proposes the rewording.
    It does not mention the published type comment, which repeats the wording, the change of default since
    0.1.0, or that Tools §9 states the sequential rule for 'local tools'.
  concerns:
  - safety-enforcement
- id: SA-80
  title: Passages of the 0.2.0 text contradict each other or the published types
  priority: minor
  category: editorial
  summary: 'Passages disagree with each other or with the published types: `maxInstances` is a SHOULD
    in Subagents §1 and a MUST in Runtime §7.2; argument validation, recursive immediate spawning and
    the `name` argument differ in level between Subagents and Runtime §7; Agents §6 lets a handoff activate
    `parentHooks`, while Hooks §1.3 requires a direct subagent relationship; the types exclude a `hidden`
    relationship from the registry snapshot, the text only from the tool list; `HookMessage` in Hooks
    §6.1 lacks `metadata`; two examples do not type-check. An implementer cannot tell which to follow.'
  refs:
  - content/0.2.0/specification/agents.md §6 Required Parent Hooks (line 155); content/0.2.0/specification/hooks.md
    §1.3 Hook Scoping (lines 88-90); content/0.2.0/infrastructure/runtime.md §7.3.1 (lines 149-163)
  - content/0.2.0/specification/subagents.md §1 (line 38), §3.2 (line 98), §5 (line 160), §5.1 (line 173);
    content/0.2.0/infrastructure/runtime.md §7.2 (line 131), §7.3 (line 145), §7.4 (lines 172-174)
  - content/0.2.0/specification/subagents.md §1 (line 45), §4.2 (line 142), §5 (line 159), §6.3 (line
    209); @standardagents/spec 0.45.10 dist/index.d.ts lines 4654-4662 (hidden), 1962-1967 (status)
  - content/0.2.0/specification/hooks.md §6.1 HookMessage (lines 448-463), §8.6 (lines 743-762); @standardagents/spec
    0.45.10 dist/index.d.ts line 5947 (HookMessage)
  - content/0.2.0/specification/handlers.md §5 Error Semantics (line 77); content/0.2.0/specification/agents.md
    §8, item 6 (line 202)
  - content/0.2.0/distribution/packaging.md 'Type Definitions' (line 320); @standardagents/spec 0.45.10
    dist/index.d.ts line 6397 (HookDefinitionResult)
  quote: Declaring a `SubagentRelationship` targeting the agent (or adding it to an enabled parent prompt
    as a handoff) is what composes it, and composing it **MUST** activate every `parentHooks` requirement
    automatically.
  proposed_change: Give one requirement level to each rule stated twice (argument validation, recursive
    immediate spawning, the `name` argument); state whether a handoff activates `parentHooks` and whether
    they apply on handler-backed sides; align `hidden`, registry `status` and `HookMessage` with the published
    types; correct the Handlers §5 parenthesis and the two examples that do not type-check.
  backwards_compatible: true
  disposition: proposal
  proposal: 06-editorial-inconsistencies.md
  coverage: partial
  disposition_note: 'Issue 06 items 4 to 8 cover `maxInstances`, the order of child-required hooks, key-value
    isolation against a parent''s or child''s `ThreadState`, the endpoint mount path and the thread-creation
    sentence of Examples §9; items 1 to 3 cover the numbering. It leaves out: `parentHooks` activated
    by a handoff (Agents §6 against Hooks §1.3, Runtime §7.3.1 and Packaging); ''For each active prompt''
    in Runtime §7.3.1 for a handler-backed owning side; the level mismatches on argument validation, recursive
    immediate spawning and the `name` argument; `hidden` and the registry snapshot; registry `status`
    as lifecycle value or label; `HookMessage`; the Handlers §5 parenthesis, which names `sessionFail`
    and `stopSession` as session failure; the hooks.md §8.6 example and the packaging.md type block, which
    do not type-check; and the omissions of Threads §12.'
  concerns:
  - published-api-extension-points
  - safety-enforcement
  - approval-human
  - multi-agent
  related:
  - SA-18
  - SA-26
  - SA-39
  - SA-69
- id: SA-81
