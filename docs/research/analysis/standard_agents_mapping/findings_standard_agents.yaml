  - content/0.2.0/specification/threads/client-api.md §10 Deleting a Thread, item 3 (line 294)
  - content/0.2.0/getting-started/examples.md §4 Effects (line 554; example prompt, non-normative)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 3058-3077 (getScheduledEffects, removeScheduledEffect)'
  quote: '- **MUST** enqueue effects asynchronously for execution.'
  searched: 'effects.md for durab, restart, redeploy, evict, persist, surviv, terminat, retr, at-least,
    at-most, exactly: no hits. content/0.2.0 for at-least-once, at least once, at-most-once, at most once,
    idempot: delivery wording exists for handler messages, stream frames and events only; ''idempotent''
    at effects.md line 88. The published `ScheduledEffect` (index.d.ts line 1368) has no status member.'
  proposed_change: In Effects §3 state that a scheduled effect is persisted with the durability required
    of the key-value store, that it does not run before its scheduled time, the delivery guarantee (at-least-once
    or at-most-once), what follows a throw, and that an effect may schedule effects. Address the idempotency
    advice to effect authors. Move the return values of `removeScheduledEffect` into Threads §4.3.
  backwards_compatible: true
  disposition: proposal
  proposal: 12-persistence-and-delivery.md
  coverage: full
  disposition_note: 'Issue 12 asks Effects §3 to state that a scheduled effect is persisted with the
    key-value store''s durability and never runs early, its delivery guarantee, what follows a throw and
    whether an effect may schedule effects, to address the idempotency advice to effect authors, and to
    move the return values of `removeScheduledEffect` into Threads §4.3. A handler-hosted workflow''s
    timeouts depend on it; the integration document calls `run.tick(now)` on every inbound message
