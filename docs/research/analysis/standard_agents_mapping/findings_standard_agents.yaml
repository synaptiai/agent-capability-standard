  - content/0.2.0/specification/threads.md §1.2.1 Properties (line 42), §2.3 Environment Variable Resolution
    (lines 220-225)
  - content/0.2.0/specification/threads/endpoints.md §4 Access and Authentication (lines 91, 101)
  - content/0.2.0/specification/subagents.md §4 Instance Lifecycle (lines 114-153; no statement about
    a child thread's user)
  - content/0.2.0/specification/users.md §2.2 Reaching Threads, item 1 (line 86; Draft)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 1906-1915 (ThreadMetadata)'
  quote: The runtime **MUST** set the owner of the new thread from the authenticated caller. The request
    **MUST NOT** be able to name a different owner.
  searched: 'content/0.2.0 and the published index.d.ts for owner, userId, user_id, ''same user'', inherit
    and ''belongs to'' on any line that also names a child, a subagent or a descendant: the hits concern
    relationship ownership, key-value isolation and environment propagation; none states a child thread''s
    user.'
  proposed_change: 'Add one sentence to Subagents §4: a child thread''s user is its parent''s user, and
    `ThreadState.userId` on the child reports it; or state the intended rule if it differs.'
  backwards_compatible: true
