- id: SA-12
  title: Parking and fulfilment of a human-backed turn have no normative statement
  priority: important
  category: messages_and_identity
  summary: Agents §1.1 says a human-backed turn 'is fulfilled by an inbound message on that side's perspective',
    and Subagents §6.1 says parent traffic enters a child on the side B perspective. Read together, a
    parent's `subagent_message`, or `queueMessage` from code, ends the wait as a person's reply does.
    No page says so, and Agents §7 and Subagents §4.3 use no MUST or SHOULD for parking or resuming. The
    parent model that requested an approval can therefore end the wait itself.
  refs:
  - content/0.2.0/specification/agents.md §1.1 The Three Backings (line 19)
  - content/0.2.0/specification/agents.md §7 Human-in-the-Loop Composition (lines 169-191)
  - content/0.2.0/specification/subagents.md §4.3 Human-in-the-Loop Children (lines 151-153)
  - content/0.2.0/specification/subagents.md §6.1 Parent → Child (lines 188-191)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (line 52)
  quote: 'For a **human** backing, the specification defines only the waiting state: when it is a human-backed
    side''s turn, the session parks awaiting human input, and the turn is fulfilled by an inbound message
    on that side''s perspective.'
  searched: 'MUST, SHOULD and MAY within agents.md §7 (lines 169-191) and subagents.md §4.3 (lines 151-153):
    none. agents.md, subagents.md, runtime.md, messages.md and client-api.md for awaiting_human, fulfil,
    resume and ''human input'': no sentence says which senders'' messages fulfil the turn.'
  proposed_change: Say in Agents §7 and Subagents §4.3 that any message on the human side's perspective
    fulfils the turn, a parent's `subagent_message` and `queueMessage` from code included, or state the
    intended rule if it differs. State with MUST that the registry status becomes `awaiting_human` and
    that the session resumes on such a message.
  backwards_compatible: true
  disposition: proposal
  proposal: 02-message-sender.md
  coverage: partial
  disposition_note: 'Issue 02, under ''A related clarification'', asks that Agents §1.1 say which messages
    fulfil a human-backed side''s turn: any message on that side''s perspective, with code that needs
    a client''s answer checking `user_id`. Its Problem section states the consequence for the approval
    gate. It leaves out the MUST-level park and resume rules for Agents §7 and Subagents §4.3.'
  concerns:
  - published-api-extension-points
  - approval-human
- id: SA-13
