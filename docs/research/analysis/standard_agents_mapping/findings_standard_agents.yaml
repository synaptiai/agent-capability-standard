    runtime-set origin from a label a package wrote. The keys are SHOULD-level conventions whose absence
    consumers must tolerate.
  refs:
  - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 30)
  - content/0.2.0/specification/threads/messages.md §1.1 Provenance Metadata Conventions (lines 40-49;
    quote at line 47)
  - content/0.2.0/specification/subagents.md §6.5 Provenance Metadata (lines 221-228)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2035-2040 (metadata comment), 2073-2074 (Message.subagent_id),
    2979-2980 (notifyParent comment)'
  quote: '| `metadata.forwarded_from` | The origin thread or message of forwarded content |'
  searched: '`forwarded_from` and `subagent_id` in content/0.2.0: threads/messages.md lines 30, 46 and
    47, subagents.md lines 225 and 226. In index.d.ts: lines 2035-2040, 2074 and 2979-2980. No sentence
    relates the two `subagent_id` forms or limits who may write the keys.'
  proposed_change: In Messages §1.1, give `forwarded_from` one value format (the published types use a
    thread id), say which of the top-level `subagent_id` and `metadata.subagent_id` a consumer reads when
    both exist, and say that package code may write these keys, so consumers do not treat them as attested.
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'No issue asks for it. The keys are optional conventions that the binding does not
    rely on: it identifies a child by the registry reference and reads the child''s thread. The relation
