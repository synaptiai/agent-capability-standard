- id: SA-14
  title: '`state.env(name)` is not limited to the variables a definition declares'
  priority: important
  category: endpoints_and_auth
  summary: '`variables` on tools and prompts declare the names a definition needs. No rule limits `state.env(name)`
    to declared names, and resolution continues to user-account and instance values; the Examples page
    shows a handler, which ''declares no variables'', reading `GITHUB_TOKEN`. Code of any installed package
    can therefore read a user-account or instance value whose name it knows. `scoped` governs inheritance
    between threads only. The Draft credential grants restrict callers with `allow` lists; the non-draft
    env surface has no counterpart, and namespace isolation covers definitions, not environment names.'
  refs:
  - content/0.2.0/specification/tools.md §3 Variable Declarations (lines 46-64)
  - content/0.2.0/specification/threads.md §2.3 Environment Variable Resolution (lines 220-236)
  - content/0.2.0/getting-started/examples.md (line 733; non-normative)
  - content/0.2.0/specification/users.md §6 Credential Grants (lines 199-202; Draft page)
  - content/0.2.0/distribution/packaging.md Namespace Isolation (lines 217-230)
  quote: The handler reads a token with [`state.env`](agents/handlers/close_command.ts#state.env). A handler
    declares no variables.
  searched: 'undeclared, ''not declared'', and ''declare'' near ''variable'' in content/0.2.0: `uses`
    targets, relationships, the opening sentence of Tools §3 and two sentences of the Examples page. tools.md
    §3, threads.md §2.3 and the Namespace Isolation section of packaging.md contain no rule that restricts
    `env()` to declared variables.'
  proposed_change: 'Say whether `env(name)` is meant to resolve names the calling definition did not declare.
    If not, allow a runtime to refuse user-account and instance values for names the calling package''s
    definitions do not declare. If it is, add a security note to Packaging: an installed package can read
    any instance or user-account value whose name it knows.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'A design choice of SA to be confirmed, not a defect: the Examples page relies on
    the behaviour, and the Draft credential grants are the text''s own answer for secrets. The reference
    binding keeps no secret in env. The limit is for a binding that would: a key that anchors a signature
    check or a keyed audit chain is readable by every installed package, so such a check holds cooperatively.'
  concerns:
  - models-context-memory-security
- id: SA-15
  title: Key-value isolation rule contradicts access through a parent or child `ThreadState`
  priority: important
  category: state_and_storage
  summary: Item 3 of the Runtime key-value rules says 'Values **MUST NOT** be readable by any other thread,
    including parent, child, or sibling threads', and Threads §7.2 says the store is not shared with them.
    `getParentThread()` and `getChildThread()` return a `ThreadState`, which has `getValue` and `setValue`;
    the `after_subagent_created` hook receives the child's state; and Subagents §6.4 names 'the parent's
    key-value store' as a channel for explicit-mode children. A reader cannot tell whether `(await state.getParentThread())?.setValue(k,
    v)` is that channel or a violation. The same question applies to the file system.
