  - content/0.2.0/specification/threads/client-api.md §16.1 Server frames (lines 428-434), §16.2 Delivery,
    item 3 (line 449)
  - content/0.2.0/specification/threads/client-api.md §1 Scope, item 4 (line 12), §10 Deleting a Thread,
