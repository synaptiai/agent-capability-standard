# Findings about the Standard Agent Specification
# Part of the Standard Agent Specification mapping; index.yaml explains the fields.
about: standard_agent_specification
findings:
- id: SA-01
  title: No hook can refuse or replace a tool call before it executes
  priority: important
  category: tool_calls_and_hooks
  summary: 'Hooks §5.1 makes `tool_call_started` the only tool hook before execution: its return value
    MUST be ignored and its arguments MAY be incomplete. The other four run after execution, and Runtime
    §3 goes from persisting the assistant response to executing tool calls. No hook in the text or the
    published `HookSignatures` can decline a call. A rule that must hold before a side effect is written
    inside each tool''s `execute`; the indirect routes (a provider override, a handler-backed side, a
    guard tool) reshape the agent or rest on unstated behaviour.'
  refs:
  - content/0.2.0/specification/hooks.md §5.1 tool_call_started (lines 367-384; quote at line 382)
  - content/0.2.0/specification/hooks.md §1.1 Available Hooks (lines 21-36)
  - content/0.2.0/specification/hooks.md §4.1 before_create_message (lines 310-322); §3.3 Note (line 273)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 42-50)
  - content/0.2.0/specification/threads/execution-state.md §4.2 Reasons (line 113, `hook_blocked`)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 6023-6355 (HookSignatures; `tool_call_started`
    returns `Promise<void>` at line 6315)'
  quote: '- The return value **MUST** be ignored; the hook cannot modify the tool call.'
  searched: 'content/0.2.0, src/data, README.md, AGENTS.md and dist/index.d.ts, case-insensitive: before_tool,
    pre_tool, beforeTool, before_execute, veto, guardrail, PreToolUse (no match in any). `hook_blocked`:
    execution-state.md line 113 and index.d.ts line 2232 only. ''policy gate'': hooks.md line 273 only.
    deny, denied: models.md line 283 and threads/client-api.md line 61, both unrelated.'
  proposed_change: Add one thread hook, `before_tool_call(state, toolCall, context) => Promise<HookToolResult
    | null | undefined>`, called once per locally executed call after argument validation and before execution.
    A returned result replaces execution and is persisted; a throw or timeout prevents execution and stores
    an error result. State whether lifecycle tools and `invokeTool` or `queueTool` calls fire it.
  backwards_compatible: true
  disposition: proposal
  proposal: 01-before-tool-call-hook.md
  coverage: full
  disposition_note: 'Issue 01 asks for this hook with the `HookToolResult | null | undefined` return,
    a throw or timeout that prevents execution, the order of Hooks §1.3 and reach through `parentHooks`.
    Its open questions 1 to 3 carry the points on which the records differ: lifecycle tools, calls through
    `invokeTool` and `queueTool`, and the meaning of `hook_blocked`. The position relative to `before_create_message`,
    which the workflow-execution mapping asks for, follows from Runtime §3, which the issue cites: the
    assistant message is persisted before its tool calls execute.'
  concerns:
  - published-api-extension-points
  - safety-enforcement
  - checkpoint-rollback-state
  - approval-human
  - workflow-execution
- id: SA-02
  title: Handling of a model tool call the active prompt did not offer is unstated
  priority: important
  category: tool_calls_and_hooks
  summary: 'No passage says what a runtime does with a model-issued call to a tool the request did not
    offer: a project tool absent from the active prompt''s `tools`, an unknown name, or any call under
    `toolChoice: ''none''`, where Prompts §4.2 places the requirement on the LLM. The neighbouring rules
    cover other cases: `uses` limits what a tool may invoke (Tools §2.1), and lifecycle invocations of
    undeclared or disabled relationships are rejected (Subagents §5). A prompt''s tool list is therefore
    not stated to limit what a model can cause to execute.'
  refs:
  - content/0.2.0/specification/prompts.md §1.2 Optional Properties (line 31, `tools`); §3.1 Simple Tool
    References (lines 95-101)
  - content/0.2.0/specification/prompts.md §4.2 Tool Choice Behavior (lines 190-199; requirement on the
    LLM at line 197)
  - content/0.2.0/specification/tools.md §2.1 Tool Dependencies (line 44; quote); §9 Conformance Notes
    (lines 148-156)
  - content/0.2.0/specification/subagents.md §5 Lifecycle Tools (lines 155-163; rejection rule at line
    163)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-50); §5 Tool Execution (lines 84-100);
    §7.3 (line 143)
  quote: When a `uses` list is supplied, the runtime **MUST** reject an invocation of a target outside
    the list.
  searched: 'content/0.2.0, case-insensitive: ''unknown tool'', unlisted, hallucinat, undeclared, ''not
    offered'', ''not exposed'', ''no such tool'', unrecogni, ''invalid tool'', nonexistent, ''not declared'',
    ''tool list''. Matches: tools.md line 44 (`uses`), subagents.md line 163 (relationships), runtime.md
    line 143 (a hidden relationship''s tool must not appear in the tool list), threads/code-execution.md
    line 448 (unrelated). dist/index.d.ts for the same terms: lines 404, 456 and 559 (`uses`) and line
    4381 (relationships are not declared in a prompt''s `tools`). None concerns a model-issued call to
    a tool the prompt did not offer.'
  proposed_change: 'Add to Runtime §5: a tool call whose name was not in the tool list sent with the request
    that produced it, and any call made when that request''s tool choice was `none`, MUST NOT be executed
    and MUST be persisted as an error tool result. Extend the Subagents §5 rejection to model-issued lifecycle
    calls that target a hidden relationship.'
  backwards_compatible: true
  disposition: proposal
  proposal: 07-unoffered-tool-call.md
  coverage: full
  disposition_note: Issue 07 asks for the rule in Runtime §5 and for the Subagents §5 rejection to cover
    model-issued lifecycle calls that target a hidden relationship.
  concerns:
  - published-api-extension-points
  - safety-enforcement
- id: SA-03
  title: Which calls fire the tool hooks, and in what order, is unspecified
  priority: important
  category: tool_calls_and_hooks
  summary: Hooks §5 states a MUST to invoke only for `tool_call_started` and `tool_call_done`; §5.2 to
    §5.4 have none, and Runtime §3 and §5 name no hook. The text does not say whether the tool hooks fire
    for prompt tools, handoffs, lifecycle tools, provider-executed tools or calls made through `invokeTool`
    and `queueTool`, in what order the post-execution hooks run, or whether `tool_call_done` receives
    the result as returned or as stored. A redaction, audit or metering hook cannot state what it covers
    on a conforming runtime.
  refs:
  - content/0.2.0/specification/hooks.md §5 Tool Execution Hooks (lines 365-444; a MUST to invoke at lines
    381 and 440 only)
  - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 76-100)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-52); §5 Tool Execution (lines 84-100)
  - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153, 'local tools'); content/0.2.0/specification/threads.md
    §3 Tool Invocation (lines 244-272)
  - content/0.2.0/getting-started/examples.md lines 546-547 (non-normative)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 3022-3033 (`invokeTool`), 6219-6331 (tool hook
    comments)'
  quote: '- Implementations **MUST** call this hook once per tool call, whether it succeeded or failed.'
  searched: 'hooks.md for invokeTool, queueTool, ''lifecycle tool'', subagent_create, provider-executed,
    executionMode: no match. content/0.2.0 outside hooks.md for after_tool_call_success, after_tool_call_failure,
    before_store_tool_result, tool_call_done, tool_call_started: tools.md §7 (`tool_call_started` only)
    and getting-started/examples.md lines 308, 492 and 546 (non-normative); no match under content/0.2.0/infrastructure
    or in specification/threads.md and specification/threads/.'
  proposed_change: Add to Hooks §5 a table of call origin (model-issued, `invokeTool`, `queueTool`, sub-prompt,
    handoff, lifecycle tool, provider-executed) by tool hook, and a paragraph giving the order of `after_tool_call_success`
    or `after_tool_call_failure`, `before_store_tool_result`, persistence and `tool_call_done`, the result
    each receives, and that `function.arguments` is complete in every hook except `tool_call_started`.
  backwards_compatible: true
  disposition: proposal
  proposal: 01-before-tool-call-hook.md
  coverage: full
  disposition_note: 'Issue 01, under ''The same questions for the existing tool hooks'', asks in point 1
    for a table of call origin (model-issued, `invokeTool`, `queueTool`, sub-prompt, handoff, lifecycle
    tool, provider-executed) by tool hook, and in point 3 for the order of the hooks after execution, the
    result each receives and complete arguments in every hook but `tool_call_started`. Its rule that a
    returned result passes through those hooks follows that order. The reference binding joins its audit
    records in a `tool_call_done` hook, so what that hook covers bounds the audit trail.'
  concerns:
  - tools-contracts
  - published-api-extension-points
  - safety-enforcement
  - evidence-audit-observability
  - multi-agent
  related:
  - SA-04
- id: SA-04
  title: 'Provider-executed tools: definition, persistence and hook coverage are not in the text'
  priority: important
  category: tool_calls_and_hooks
  summary: 'Providers §10 says provider tools ''execute server-side'' and gives one a placeholder `execute`;
    Tools §9 requires sequential execution of ''local tools'' without defining the term. The published
    0.45.10 types carry `executionMode: ''local'' | ''provider''`, `ProviderResponse.providerTools` (entries
    ''must not be re-executed locally'') and the stream chunks `web-search-done` and `provider-tool-done`;
    none is in the 0.2.0 text. Whether such a call and its result are persisted, and whether any tool
    hook fires for it, is not stated, so provider-side tool activity has no defined record.'
  refs:
  - content/0.2.0/specification/providers.md §10 Provider Tools (lines 598-653; quote at line 602; placeholder
    `execute` at line 625)
  - content/0.2.0/specification/providers.md §5 Response Format (lines 344-368); §6 Streaming (lines 377-392)
  - content/0.2.0/specification/models.md `providerTools` (lines 34, 184, 473)
  - content/0.2.0/specification/tools.md §9 Conformance Notes (line 153); content/0.2.0/specification/hooks.md
    §5.5 tool_call_done (line 442)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 443-448 (`executionMode`, `executionProvider`),
    1014-1021 (`ProviderResponse.providerTools`), 1096-1139 (`ProviderExecutedToolResult`), 1172-1178
    (stream chunks)'
  quote: Providers can embed built-in tools that leverage provider-specific capabilities. For example,
    OpenAI provides web search, file search, code interpreter, and image generation tools that execute
    server-side.
  searched: 'content/0.2.0 for executionMode, executionProvider, provider-tool-done, web-search-done,
    ProviderExecutedToolResult, ProviderWebSearchResult, ''provider-executed'', ''provider executed'':
    no match. `providerTools` in content/0.2.0: models.md lines 34, 184 and 473 only (the model property).
    ''server-side'': providers.md line 602 and an unrelated use at threads.md line 453. hooks.md §5: no
    statement about provider-executed tools.'
  proposed_change: Document in Providers §5, §6 and §10 the members the published types already have;
    define a provider-executed tool on the Tools page and state that its `execute` is not invoked. Then
    state whether a runtime persists such a call and its result, and which tool hooks, if any, fire for
    it.
  backwards_compatible: true
  disposition: proposal
  proposal: 01-before-tool-call-hook.md
  coverage: full
  disposition_note: 'Issue 01, point 2 of ''The same questions for the existing tool hooks'', asks for a
    definition of a provider-executed tool whose `execute` is not invoked, for the members the published
    types already have in Providers §5, §6 and §10, and for such calls'' row in the table of point 1,
    which states whether they are persisted and which hooks fire. A grounded agent avoids the gap
    meanwhile by leaving provider tools off its models.'
  concerns:
  - tools-contracts
  - evidence-audit-observability
  - models-context-memory-security
  related:
  - SA-03
  - SA-07
  - SA-28
  - SA-29
  - SA-47
  - SA-67
  - SA-74
- id: SA-05
  title: Hook failure and timeout outcomes are stated for the message hooks only
  priority: important
  category: tool_calls_and_hooks
  summary: The Hooks introduction says a hook's failures are non-fatal to the decorated turn, and §4.1
    to §4.4 give SHOULD-level outcomes for the four message hooks. For the five tool hooks and the three
    request-context hooks no outcome of a throw or timeout is stated; §1.2 only says runtimes SHOULD enforce
    a timeout. The published type comments add that after a throwing `before_create_message` a runtime
    can still insert a model-step or tool-result message 'with the last good message'. Whether an unredacted
    result is stored when a redaction hook throws is undefined.
  refs:
  - content/0.2.0/specification/hooks.md introduction (line 5; quote); §1.2 Hook Definition (lines 65-67)
  - content/0.2.0/specification/hooks.md §4.1 to §4.4 (failure sentences at lines 322, 335, 350, 363)
  - content/0.2.0/specification/hooks.md §3 Request Context Hooks (lines 198-306); §5.2 to §5.5 (lines
    386-444)
  - content/0.2.0/getting-started/examples.md line 550 (non-normative)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 6109-6112 and 6161-6164 (failure sentences), 1198
    (`ErrorOrigin`)'
  - content/0.2.0/specification/providers.md §7 Error Handling (lines 399-404, `ErrorOrigin`)
  quote: A hook **decorates turns owned by something else** — it runs around steps and messages, its failures
    are non-fatal to the decorated turn, and it may not own a side.
  searched: 'hooks.md for ''Failures'': lines 322, 335, 350 and 363 (the four message hooks) only. hooks.md
    for timeout: §1.2 lines 66-67 only. hooks.md for throw: no match. ''non-fatal'' in content/0.2.0:
    hooks.md line 5 and handlers.md lines 5 and 77. No failure rule for a hook in infrastructure/runtime.md,
    specification/threads.md or specification/threads/messages.md. dist/index.d.ts hook comments: failure
    sentences at lines 6109-6112 and 6161-6164 only.'
  proposed_change: Add a table to Hooks §1 stating, for each hook, what the runtime uses and whether the
    operation proceeds when `execute` throws or times out. Move the two failure sentences that exist only
    in the published type comments into §4.1 and §4.3. Attribute a reported hook failure as `hook:<id>`,
    the `ErrorOrigin` form of Providers §7.
  backwards_compatible: true
  disposition: proposal
  proposal: 01-before-tool-call-hook.md
  coverage: full
  disposition_note: 'Issue 01, point 4 of ''The same questions for the existing tool hooks'', asks for a
    table of each hook''s outcome on a throw or a timeout, for the failure sentences that exist only in
    the type comments to move into Hooks §4.1 and §4.3, and for a reported failure attributed as
    `hook:<id>`. Its own hook already fails closed. Until the table exists, a check placed in a tool hook
    or a request-context hook fails open or closed at the runtime''s choice, and the integration document
    calls the binding''s audit hook best effort.'
  concerns:
  - safety-enforcement
  - evidence-audit-observability
  - models-context-memory-security
  related:
  - SA-31
- id: SA-06
  title: A running tool is not told the id or name of its call
  priority: important
  category: tool_calls_and_hooks
  summary: '`execute(state, args)` receives no call id or name, and `ExecutionState` has no member for
    the current call, although tool hooks receive `HookToolCall.id` and the result message stores `tool_call_id`.
    A tool can search the last assistant message''s `tool_calls` on `execution.messageHistory`; that fails
    for two identical calls in one response and for `invokeTool` or `queueTool` calls, and a definition
    does not contain its own name. A tool''s own records (idempotency keys, audit entries, evidence) cannot
    be tied reliably to the stored result.'
  refs:
  - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 15-34; quote at line 21)
  - content/0.2.0/specification/threads/execution-state.md §2 Execution Properties (lines 19-32), §2.2
    Live execution history (lines 43-49), §5 TypeScript Reference (lines 139-156)
  - content/0.2.0/specification/hooks.md §6.2 HookToolCall (lines 465-476)
  - content/0.2.0/infrastructure/runtime.md §3 Step Cycle (lines 40-50)
  - content/0.2.0/specification/threads/messages.md §1 Message Structure (lines 17-18)
  - '@standardagents/spec 0.45.10 dist/index.d.ts line 349 (Tool), lines 2578-2634 (ExecutionState)'
  quote: 'execute: async (state, args) => {'
  searched: '`toolCallId`, `tool_call_id`, `currentTool`, `activeTool`, `toolName` and `toolCall` in content/0.2.0:
    the message-record field (threads/messages.md line 18; hooks.md lines 457, 499), provider message
    fields (providers.md lines 295-296, 842-843) and the parameter name of `queueTool` and `invokeTool`
    (threads.md lines 119-120, 670-671); nothing on `ThreadState` or `ExecutionState`. In index.d.ts:
    `toolCallId` at line 928 (a provider message), `tool_call_id` at lines 2018 and 6000, and hook parameters.
    `state.execution?.toolCall` is TS2339 with tsc 6.0.3 against 0.45.10.'
  proposed_change: 'Add an optional read-only `toolCall?: { id: string; name: string }` to `ExecutionState`,
    present while a tool''s `execute` runs for a model-issued call, with `id` equal to `HookToolCall.id`
    and to the result message''s `tool_call_id`. State what a call made through `invokeTool` or `queueTool`
    sees, and whether `name` is local or qualified.'
  backwards_compatible: true
  disposition: proposal
  proposal: 03-tool-call-identity.md
  coverage: full
  disposition_note: 'Issue 03 proposes the same optional `toolCall` property on `ExecutionState` with
    the same identity rule for `id`, and lists as open questions the points on which the records differ:
    a call made through `invokeTool` or `queueTool`, nested calls, and the local or qualified name. It
    does not expose the property during the tool hooks, which the safety-enforcement mapping also asked
    for; those hooks already receive `HookToolCall`.'
  concerns:
  - tools-contracts
  - published-api-extension-points
  - safety-enforcement
  - evidence-audit-observability
- id: SA-07
  title: '`ToolResult` is undefined in the text and its error code does not reach hooks'
  priority: important
  category: tool_results_and_contracts
  summary: The Tools page shows what `execute` returns only by example. `invokeTool` returns `Promise<ToolResult>`,
    a type content/0.2.0 names (Threads §1.2.2 and §12) and never defines; `ToolAttachment` is likewise
    only named. The published 0.45.10 type has `error_code` and `error_data`, which appear in the text
    once, in an example. Subagents §5.1 requires 'a structured `subagent_arguments_required` error' without
    a carrier. `HookToolResult` has neither member in the text or the types, and the message record has
    only `tool_status`, so a hook or a client cannot read a tool's machine-readable error.
  refs:
  - content/0.2.0/specification/tools.md §2 Function Tool Definition (lines 15-34; no result type); §9
    Conformance Notes (line 155)
  - content/0.2.0/specification/threads.md §1.2.2 Methods (line 120); §12 TypeScript Reference (line 671)
  - content/0.2.0/specification/hooks.md §6.3 HookToolResult (lines 478-490)
  - content/0.2.0/specification/subagents.md §5.1 (line 175; quote); §5.2 (line 179)
  - content/0.2.0/specification/threads/runtime-streams.md line 82 (`error_code` in an example); content/0.2.0/specification/threads/messages.md
    §1 (line 19, `tool_status`)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 173-187 (ToolAttachment), 211-249 (ToolResult),
    5967-5984 (HookToolResult)'
  quote: '- if required arguments are missing, runtimes **MUST** reject creation with a structured `subagent_arguments_required`
    error rather than spawning the child.'
  searched: 'content/0.2.0 for ''interface ToolResult'', ''type ToolResult'', ''interface ToolAttachment'':
    no match (`ToolResult` is named at threads.md lines 120 and 671 and as a type parameter in hooks.md
    §7; `ToolAttachment` at hooks.md lines 486 and 490). error_code: one match, the example at threads/runtime-streams.md
    line 82. error_data, errorCode: no match.'
  proposed_change: Define `ToolResult` and `ToolAttachment` on the Tools page as published; add optional
    `error_code` and `error_data` to `HookToolResult`; state what the stored tool message keeps and which
    field the model receives for an error result; say in Subagents §5.1 and §5.2 that a structured error
    is a `ToolResult` with that `error_code`.
  backwards_compatible: true
  disposition: proposal
  proposal: 04-tool-result-contract.md
  coverage: partial
  disposition_note: Parts 1 to 3 of issue 04 ask for the `ToolResult` definition in Tools §2, for `error_code`
    and `error_data` on `HookToolResult`, and for a rule that both are kept with the stored tool result
    message. The issue leaves out a definition of `ToolAttachment`, a statement of which field the model
    receives for an error result, and a sentence tying the structured errors of Subagents §5.1 and §5.2
    to `error_code`; its Problem section cites both passages.
  concerns:
  - tools-contracts
  - published-api-extension-points
  - safety-enforcement
  - evidence-audit-observability
  - packaging-conformance-governance
  related:
  - SA-04
  - SA-28
  - SA-29
  - SA-47
  - SA-67
  - SA-74
- id: SA-08
  title: Tool results have no metadata member although hooks.md lists adding metadata as a use
  priority: important
  category: tool_results_and_contracts
  summary: Hooks §5.2 lists 'Add metadata to tool results' as a use of `before_store_tool_result`, but
    `HookToolResult` (Hooks §6.3) has no metadata member, and neither has the published `ToolResult`.
    A result carries one `result` string, which is sent to the model, and file attachments. Data about
    a result that is not for the model (sources, cost, cache keys, evidence) has to go into the model-visible
    string, into a file, or through `state.context` and a `before_create_message` hook that writes the
    tool message's `metadata`.
  refs:
  - content/0.2.0/specification/hooks.md §5.2 before_store_tool_result (lines 386-398; quote at line 397)
  - content/0.2.0/specification/hooks.md §6.3 HookToolResult (lines 478-490)
  - content/0.2.0/specification/threads.md §6.2 Per-Execution Context (lines 372-379)
  - content/0.2.0/specification/threads/messages.md §1 Message Structure (line 29, `metadata`)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 211-249 (ToolResult), 5967-5984 (HookToolResult)'
  quote: '- Add metadata to tool results'
  searched: '''metadata'' in tools.md: no match. ''metadata'' in hooks.md: line 195 (unrelated prose),
    line 397 (the use case) and the §8.6 example (lines 743-754), which sets `metadata` on a message,
    not on a tool result; none in §6.3. dist/index.d.ts lines 211-249 and 5967-5984: no metadata member
    on either type.'
  proposed_change: 'Add optional `metadata?: Record<string, unknown>` to `ToolResult` and `HookToolResult`;
    the runtime merges it into the stored tool result message''s `metadata`, passes it to the result hooks
    and does not send it to the model. Alternatively, remove the bullet from Hooks §5.2.'
  backwards_compatible: true
  disposition: proposal
  proposal: 04-tool-result-contract.md
  coverage: full
  disposition_note: Part 4 of issue 04 asks for the member on both types, the merge into the `metadata`
    of the persisted tool result message, delivery to the result hooks and exclusion from what is sent
    to the model.
  concerns:
  - published-api-extension-points
  - evidence-audit-observability
- id: SA-09
  title: Hooks and other definition code cannot read a tool's descriptor or annotations
  priority: important
  category: annotations_and_metadata
  summary: Tools §8 calls annotations hints 'keyed by the runtime or tool that reads them', but code in
    a thread has no way to read another tool's. Tool hooks receive `HookToolCall` (id, name, JSON arguments);
    `ThreadState` loads models, prompts and agents by name and has no tool counterpart. Code can import
    a definition module or a package's `tools` loaders, but must know what a call's name resolves to,
    and cannot reach another package's internal tools. A telemetry, display or policy hook therefore keeps
    its own table of tool names.
  refs:
  - content/0.2.0/specification/threads.md §1.2.2 Methods, Resource Loading (lines 100-113; quote at line
    106), §2.1-§2.2 (lines 190-206)
  - content/0.2.0/specification/hooks.md §6.2 HookToolCall (lines 465-476)
  - content/0.2.0/specification/tools.md §8 Annotations (lines 125, 143-146)
  - content/0.2.0/distribution/packaging.md 'PackedExports Interface' (lines 121-147), 'Visibility Rules'
    (lines 221-230)
  - '@standardagents/spec 0.45.10 dist/index.d.ts lines 2872-2906 (loaders and name listings), 5938-5963
    (HookExecutionContext, HookToolCall)'
  quote: '| `loadAgent(name)` | `Promise<T>` | Load agent definition |'
  searched: '`loadTool`, `getToolNames`, `describeTool`, `getToolDefinition` and `getTool(` in content/0.2.0,
    src/data, README.md and AGENTS.md: no match. In index.d.ts: only the provider method `getTools(modelId)`
    (lines 786, 3532, 3697). `state.loadTool` and `state.getToolNames` are TS2339, and `HookToolCall`
    has no `annotations` member (tsc 6.0.3 against 0.45.10).'
  proposed_change: Add an optional read-only `annotations` member to `HookToolCall`, carrying unchanged
    the annotations of the function tool the call resolved to. A lookup by name on `ThreadState` that
