  - workflow-execution
- id: SA-22
  title: Serialization of effects, endpoints and code-issued calls with a running execution is unstated
  priority: important
  category: execution_and_lifecycle
  summary: Runtime §11 forbids 'multiple concurrent flows' in a thread, and Handlers §4 forbids concurrent
    handler invocations. Runtime §2 lists a scheduled effect among execution triggers and queues new work
    on an executing thread; Threads §4 says effects run independently of the conversation flow; endpoints
    run with `state.execution` null. No passage says whether an endpoint handler, an effect or concurrent
    `invokeTool` calls may run during an execution, and the access-context table omits effects and handler
