  searched: '''annotation'' (case-insensitive) in content/0.2.0: eight lines, all in specification/tools.md
    (lines 123-156); in src/data, README.md and AGENTS.md: no match; in index.d.ts: lines 412, 424 and
    532. No naming guidance in any of them.'
  proposed_change: 'Add one sentence of advice to Tools §8: an annotation key SHOULD be a name its owner
