    use anchors that match no heading: `#13-code-execution-runtime` in the Conformance Summary and on
    the Code Execution page, and `#15-durable-key-value-store`, labelled ''Runtime §15'', in Threads §7.3.
    The Models page links `providers#9-provider-tools`, while Provider Tools is section 10. Requirements
    in the two sections 14 cannot be cited by number without ambiguity.'
  refs:
  - content/0.2.0/infrastructure/runtime.md headings (lines 253, 344, 364, 382), subsection headings (lines
    257, 267, 348, 360)
  - content/0.2.0/infrastructure/runtime.md §16 Conformance Summary, links (lines 391, 392, 395)
  - content/0.2.0/specification/threads.md §7.3 (line 445)
  - content/0.2.0/specification/threads/code-execution.md introduction (line 5)
  - content/0.2.0/specification/models.md (line 481); content/0.2.0/specification/providers.md (line 598)
  quote: '- honor the [Code Execution](#13-code-execution-runtime) runtime contract when `ThreadState.runCode`
