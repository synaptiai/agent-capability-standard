- id: SA-32
  title: An agent cannot require a hook for every one of its prompts
  priority: minor
  category: tool_calls_and_hooks
  summary: 'A non-empty prompt `hooks` array replaces the agent-level array for that prompt (Hooks §1.3,
    Prompts §8), and at-rest operations use the agent-level array only. An agent therefore has no declaration
    that makes one hook run for every prompt: the hook must be listed at agent level and in every prompt
    that has its own list, and an omission produces no error. The one additive mechanism, `parentHooks`,
    lets a child require a hook of its direct parent. Prompts §8 presents the replace rule as intended.'
  refs:
  - content/0.2.0/specification/prompts.md §8 Hook Scoping (lines 258-277; quote at line 272)
  - content/0.2.0/specification/hooks.md §1.3 Hook Scoping (lines 70-100)
  - content/0.2.0/specification/agents.md §2.2 Optional (line 92, 'Fallback hook IDs'); §6 Required Parent
    Hooks (lines 132-167)
  - content/0.2.0/infrastructure/runtime.md §7.3.1 Required Parent-Hook Composition (lines 147-159)
  quote: '- When `hooks` is non-empty, only those hooks form the prompt base set'
  searched: 'content/0.2.0 and dist/index.d.ts for requiredHooks, required_hooks, ''always run'', ''global
    hook'': no field and no rule. The only related text is hooks.md lines 87-88 (installed packages ''are
    not global hook sources'').'
  proposed_change: 'State the consequence in Hooks §1.3: a hook that must run for every prompt and at
    rest is listed in the agent''s `hooks` and in every prompt that declares its own list. A possible
    addition is an optional `AgentDefinition.requiredHooks`, composed for every prompt and at rest and
    failing closed when missing, as `parentHooks` do.'
  backwards_compatible: true
  disposition: not_proposed
  disposition_note: 'A design choice of SA with a sound workaround: listing the hook in the agent''s `hooks`
    and in every prompt that has its own list gives the same coverage, and the lists can be checked from
    the definitions before a run. Issue 01 states the same scoping for its hook (an agent-level hook applies
    to prompts that list no hooks of their own) and asks for no change to it.'
  concerns:
  - published-api-extension-points
  - safety-enforcement
  - evidence-audit-observability
