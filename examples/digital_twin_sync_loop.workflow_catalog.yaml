# Standard version: 1.2.0
#
# Example: a catalog that invokes the reference catalog's digital twin
# workflows by qualified id (STANDARD v1.2 §5.1.1) instead of copying them.
#
# plant_twin_bootstrap builds a world model with
# acs.reference/world_model_build when no world state is given, then runs a
# first acs.reference/digital_twin_sync_loop: ingest signals, update the
# twin's state, detect drift, plan and apply a safe change behind a
# checkpoint, verify, roll back on failure, and audit.
#
# The qualified ids resolve only when the reference catalog is in the
# catalog set, so validate with it:
#   python tools/validate_workflows.py --catalog examples/digital_twin_sync_loop.workflow_catalog.yaml --with-catalog schemas/workflow_catalog.yaml --strict

catalog:
  id: acs.examples.twin
  version: 1.0.0
  ontology: "2.2"
  description: An example catalog that reuses the reference digital twin workflows.
  exports:
  - plant_twin_bootstrap

plant_twin_bootstrap:
  goal: Initialize a plant's digital twin with the reference workflows, then run a first sync loop.
  risk: high
  success:
  - World model built
  - First sync completed
  - Audit produced
  steps:
  - capability: invoke
    purpose: Build the initial world model with the reference workflow.
    workflow_id: acs.reference/world_model_build
    store_as: world_model_out
    condition: ${world_state_out} == null
    skip_if_false: true
    input_bindings:
      input:
        user_input: ${user_input}
    risk: medium
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    timeout: null
    retry: null
    failure_modes: []
  # The first sync starts from the baseline just built, or from the world
  # state passed in (in which case the build step was skipped and has no
  # output to read).
  - capability: invoke
    purpose: Run the reference sync loop from the baseline just built.
    workflow_id: acs.reference/digital_twin_sync_loop
    store_as: sync_out
    condition: ${world_state_out} == null
    skip_if_false: true
    input_bindings:
      input:
        user_input: ${user_input}
        # result holds the invoked workflow's stores; the state step's output
        # wraps the world state in its `state` field
        previous_world_state: '${world_model_out.result.state_out.state: object}'
    risk: medium
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    timeout: null
    retry: null
    failure_modes: []
  - capability: invoke
    purpose: Run the reference sync loop from the world state passed in.
    workflow_id: acs.reference/digital_twin_sync_loop
    store_as: sync_existing_out
    condition: ${world_state_out} != null
    skip_if_false: true
    input_bindings:
      input:
        user_input: ${user_input}
        previous_world_state: '${world_state_out: object}'
    risk: medium
    mutation: false
    requires_checkpoint: false
    requires_approval: false
    timeout: null
    retry: null
    failure_modes: []
  inputs:
    user_input:
      type: object
      properties:
        domain:
          type: string
        constraints:
          type: object
    world_state_out:
      type: object
      ref: schemas/world_state_schema.yaml#/world_state
