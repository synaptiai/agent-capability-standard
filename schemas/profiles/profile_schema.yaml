# Domain Profile Schema
# Defines configuration for domain-specific trust weights, risk thresholds,
# checkpoint policies, and evidence requirements.
#
# Status: a domain profile is informative data for hosts and workflow authors.
# Standard 1.1.0 mentions profiles twice: `profile` as a descriptive workflow
# field (section 5.1) and a `trust_weights` key `trust_class:<class>` that
# overrides a trust class weight (section 8.3). It does not say how a profile
# is applied, and no shipped component loads or selects one: the validator,
# the executor and the plugin hooks do not use a profile, and the Python
# package applies only a profile's trust_weights, when a caller passes them to
# grounded_agency/trust.py. tools/validate_profiles.py checks the shape
# described here (required fields, types, ranges, enumerations) and nothing
# else. Until the Standard says how a profile is applied, a setting such as
# block_autonomous, require_human, checkpoint_policy or minimum_confidence
# takes effect only where a host implements it or a workflow author writes it
# into the workflow. See "Status of Domain Profiles" in docs/domains/README.md.

profile_schema:
  type: object
  required:
    - domain
    - version
    - trust_weights
    - risk_thresholds
    - checkpoint_policy
    - evidence_policy
  properties:
    domain:
      type: string
      description: Domain identifier (kebab-case)
    version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      description: Semantic version of this profile
    description:
      type: string
      description: Human-readable domain description
    trust_weights:
      type: object
      description: |
        Source-specific trust weights (0.0 to 1.0).
        Higher values indicate more trusted sources.
        These weights affect how evidence is evaluated and conflicts resolved.
      additionalProperties:
        type: number
        minimum: 0.0
        maximum: 1.0
    risk_thresholds:
      type: object
      description: Risk tolerance levels for automated actions
      properties:
        auto_approve:
          type: string
          enum: [none, low, medium, high]
          description: Maximum risk level that can be auto-approved
        require_review:
          type: string
          enum: [low, medium, high]
          description: Minimum risk level requiring human review
        require_human:
          type: string
          enum: [low, medium, high, critical]
          description: Minimum risk level requiring human execution
        block_autonomous:
          type: array
          items:
            type: string
          description: Capability IDs that must never run autonomously
    checkpoint_policy:
      type: object
      description: When to create checkpoints
      additionalProperties:
        type: string
        enum: [always, high_risk, medium_risk, never]
    evidence_policy:
      type: object
      description: Evidence requirements for claims
      properties:
        required_anchor_types:
          type: array
          items:
            type: string
          description: Types of evidence anchors expected in this domain
        minimum_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Minimum confidence threshold for actions
        require_grounding:
          type: array
          items:
            type: string
          description: Capabilities that require explicit grounding
    domain_sources:
      type: array
      description: Expected data sources for this domain
      items:
        type: object
        properties:
          name:
            type: string
          type:
            type: string
            enum: [api, sensor, database, human, document, system_log]
          default_trust:
            type: number
            minimum: 0.0
            maximum: 1.0
    trust_model_reviewed:
      type: boolean
      description: |
        SEC-009: Whether the trust model has been explicitly reviewed and calibrated.
        When false or absent, the validator emits a warning that trust weights
        may not reflect intentional calibration decisions.
    trust_model_reviewed_at:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Date when trust model was last reviewed (YYYY-MM-DD format)
    workflows:
      type: array
      description: Recommended workflows for this domain
      items:
        type: string
        description: Workflow ID from workflow_catalog.yaml
