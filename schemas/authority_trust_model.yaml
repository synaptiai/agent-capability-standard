schema:
  name: authority_trust_model
  version: 1.2.0
  generated_at: '2026-01-24T02:55:14.291642Z'
  description: First-class source trust model for conflict resolution, identity resolution,
    and world-state updates. Standard v1.2 §8 gives its arithmetic (score, static
    weight, conflict strategies).
  principles:
  - Trust is contextual (by domain + entity type + field).
  - Trust decays over time unless refreshed.
  - Overrides are explicit and auditable.
  - Conflicts use trust + confidence + recency as a decision function.
source_ranking:
  default_order:
  - hardware_sensor
  - system_of_record
  - primary_api
  - observability_pipeline
  - derived_inference
  - human_note
  weights:
    hardware_sensor: 0.95
    system_of_record: 0.92
    primary_api: 0.88
    observability_pipeline: 0.8
    derived_inference: 0.65
    human_note: 0.55
# Default source weight for evidence an item contributes, by the trust_class
# of the identity that delivered it (agent_identity_schema.yaml; Standard v1.1
# §8.3, identity@1). A domain profile's trust_weights may override any class,
# as it may any source. The classes must be exactly agent_identity's
# trust_class values (validate_canonical_schemas.py checks this).
trust_classes:
  weights:
    owner: 0.95
    decision_person: 0.9
    system_of_record: 0.92
    own_subagent_report: 0.7
    colleague: 0.6
    peer_agent: 0.55
    external: 0.35
field_authority:
  description: For a field, the source types authoritative for it. Not a factor
    of the score; prefer_authoritative_sources and the tie-breaker
    prefer_authoritative_source rank them first (Standard v1.2 §8.2). fields is
    what they read; examples is illustrative (kept from 1.1) and not read.
  # The model's field authorities (Standard v1.2 §8.2). Each authority is a
  # source type of source_ranking.weights; a field appears once.
  fields:
  - field: serial_number
    authorities:
    - hardware_sensor
    - system_of_record
  - field: deployment_version
    authorities:
    - primary_api
    - system_of_record
  - field: error_rate_5m
    authorities:
    - observability_pipeline
  examples:
  - field: serial_number
    authorities:
    - hardware_sensor
    - system_of_record
  - field: deployment_version
    authorities:
    - primary_api
    - system_of_record
  - field: error_rate_5m
    authorities:
    - observability_pipeline
decay_model:
  # Time to lose half the trust weight. See conflict_resolution_function
  # for the curve. P10D reproduces the decay actually validated by the
  # benchmark suite; the former P14D label described an exponential time
  # constant, not a half-life (issue #105).
  half_life: P10D
  # Floor for recency_factor: age alone never drives an observation's weight to
  # zero, it only removes its recency advantage over fresher ones. With the
  # values above the floor is reached at exactly two half-lives (0.5**2 = 0.25).
  min_trust: 0.25
  refresh_events:
  - heartbeat
  - healthcheck
  - authoritative_update
conflict_resolution_function:
  # Standard v1.2 §8.1: score = weight × confidence × decay, in that order;
  # confidence 1 when the source reports none; an age below zero counts as 0.
  formula: score = trust_weight(source) * confidence * recency_factor
  # True half-life decay, floored at decay_model.min_trust:
  #   recency_factor(age = half_life) == 0.5
  #   recency_factor(age -> inf)      == min_trust
  recency_factor: max(0.5 ** (age/half_life), min_trust)
  # Applied in order to candidates the strategy leaves tied (§8.2). Allowed:
  # prefer_authoritative_source, prefer_high_confidence, prefer_recent,
  # escalate_to_human. Still tied after the list: escalated.
  tie_breakers:
  - prefer_authoritative_source
  - prefer_high_confidence
  - escalate_to_human
# Manual overrides (Standard v1.2 §8.4): a person or agent replacing a trust
# score or a conflict's winner by hand.
overrides:
  # When false, every override is refused.
  allow_manual_override: true
  # An override cites at least one evidence anchor for the value it sets.
  requires_anchors: true
  # An override is recorded as an audit record (§6.4) before it takes
  # effect; one whose record cannot be written does not take effect.
  audit_required: true
