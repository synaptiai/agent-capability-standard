name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # One Rust toolchain for every job, for the same reason constraints.txt pins
  # ruff: a newer rustc, rustfmt or clippy can turn a green build red with no
  # source change. RUSTUP_TOOLCHAIN makes the maturin builds behind
  # `pip install -e` use it too. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  RUSTUP_TOOLCHAIN: "1.99.1"
  # Oldest rustc the crate supports (core/Cargo.toml `rust-version`).
  RUST_MSRV: "1.88.0"

jobs:
  validate-schemas:
    name: Validate YAML schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: pip install -e "." -c constraints.txt

      - name: Validate ontology graph
        run: python tools/validate_ontology.py

      - name: Validate workflows
        run: python tools/validate_workflows.py --strict

      - name: Validate domain workflow catalogs and examples
        run: |
          for catalog in schemas/workflows/*.yaml examples/*.workflow_catalog.yaml; do
            echo "== $catalog"
            python tools/validate_workflows.py --catalog "$catalog" --strict
          done

      - name: Validate domain profiles
        run: python tools/validate_profiles.py

      - name: Validate skill references
        run: python tools/validate_skill_refs.py

      - name: Validate canonical schemas
        run: python tools/validate_canonical_schemas.py

      - name: Validate RFCs
        run: python tools/validate_rfcs.py

      - name: Validate constraints agree with pyproject
        run: python tools/validate_constraints.py

      - name: Validate documentation links
        run: python tools/validate_doc_links.py

      - name: Validate YAML utility sync
        run: python tools/validate_yaml_util_sync.py

      - name: Validate transform mapping references
        run: python tools/validate_transform_refs.py

      - name: Check generated skill files are in sync
        run: python tools/sync_skill_schemas.py --check

      # The generators below check every fixture against its JSON Schema with
      # jsonschema, a dev dependency. The steps above run on the package's
      # own dependencies alone, so they are installed only here.
      - name: Install the generators' dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Check runtime fixtures are generated
        run: python scripts/gen_runtime_fixtures.py --check

      - name: Check call-sequence and binding fixtures are generated
        run: python scripts/gen_call_fixtures.py --check

      - name: Check trigger vectors are generated
        run: python scripts/gen_trigger_vectors.py --check

      - name: Check Standard Agents binding files are generated
        run: python scripts/gen_standard_agents_binding.py --check

      - name: Check capability contract JSON Schemas are generated
        run: python scripts/gen_capability_json_schemas.py --check

  rust-core:
    name: Rust core (fmt, clippy, tests, MSRV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      # pyo3's build script needs a Python at least as new as the abi3
      # floor (3.14) for the `--features python` steps below.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Rustfmt
        run: cargo +"$RUST_TOOLCHAIN" fmt --check

      - name: Clippy (library and CLI)
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings

      - name: Clippy (Python extension)
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets --features python -- -D warnings

      - name: Clippy (WebAssembly interface)
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets --features wasm -- -D warnings

      - name: Tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked

      # The WebAssembly interface's exports and dispatcher, driven natively.
      - name: Tests (WebAssembly interface)
        run: cargo +"$RUST_TOOLCHAIN" test --locked --features wasm --test wasm

      - name: Builds on the minimum supported Rust version
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          cargo +"$RUST_MSRV" check --locked --all-targets --features python

  cel-differential:
    name: Expressions stay a CEL-compatible profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/cel_differential/go.mod
          cache-dependency-path: tools/cel_differential/go.sum

      - name: Compare ACS evaluation fixtures with cel-go
        working-directory: tools/cel_differential
        run: go run . ../../tests/conformance/expressions/eval.json ../../tests/conformance/expressions/check.json

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -c constraints.txt

      - name: Ruff check
        run: ruff check grounded_agency/ tests/ tools/ scripts/ benchmarks/

      - name: Ruff format check
        run: ruff format --check grounded_agency/ tests/ tools/ benchmarks/ scripts/gen_runtime_fixtures.py scripts/runtime_fixtures/ scripts/gen_trigger_vectors.py scripts/gen_standard_agents_binding.py scripts/gen_capability_json_schemas.py scripts/gen_call_fixtures.py

      - name: Mypy type check
        run: mypy grounded_agency/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  hooks-macos:
    # The plugin's hooks run on users' Macs: BSD tools, and either the
    # /bin/bash 3.2 macOS ships or a newer one on PATH (#134).
    name: Tests on macOS (${{ matrix.bash }} bash)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ["system", "homebrew"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Put the chosen bash first on PATH
        env:
          WHICH_BASH: ${{ matrix.bash }}
        run: |
          command -v jq > /dev/null || brew install jq
          mkdir -p "$RUNNER_TEMP/bash-bin"
          if [ "$WHICH_BASH" = homebrew ]; then
            brew install bash
            ln -sf "$(brew --prefix)/bin/bash" "$RUNNER_TEMP/bash-bin/bash"
          else
            ln -sf /bin/bash "$RUNNER_TEMP/bash-bin/bash"
          fi
          echo "$RUNNER_TEMP/bash-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bash-bin/bash" --version | head -1

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Run the tests
        run: pytest tests/ --tb=short -rs

  # Attacks on the sandbox boundary under the sandbox runtime's own srt
  # command, with the settings the setup command computes. The suite needs
  # no compiled extension, so it runs without the Rust build and without
  # tests/conftest.py. ACS_BOUNDARY_REQUIRED=1 makes a missing srt or bwrap,
  # or a sandbox that cannot start, a failure rather than a skip.
  sandbox-boundary:
    name: Sandbox boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite took 8 to 13.5 minutes on macOS and about 2 on Linux, locally.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ACS_BOUNDARY_REQUIRED: "1"
      SANDBOX_RUNTIME_VERSION: "0.0.82"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc

      - name: Install what srt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep

      - name: Install the sandbox runtime
        run: |
          npm install -g --ignore-scripts "@anthropic-ai/sandbox-runtime@$SANDBOX_RUNTIME_VERSION"
          srt --version

      # On Linux this lifts Ubuntu's AppArmor restrictions on the user
      # namespaces srt makes; on both systems it runs srt once and fails
      # with srt's own message when it cannot start a sandbox.
      - name: Check that srt can start a sandbox
        run: bash .github/scripts/sandbox-runner-setup.sh

      - name: Install pytest
        run: pip install "pytest>=8.4.2,<10" "pytest-asyncio>=1.0,<2"

      # The metadata route can be tested only where 169.254.169.254
      # answers without the sandbox. Where it answers here, a skip of that
      # route becomes a failure.
      - name: Check whether the metadata address answers
        run: |
          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H 'Metadata: true' http://169.254.169.254/ || true)
          echo "169.254.169.254 answers with HTTP status: ${code:-none}"
          if [ -n "$code" ] && [ "$code" != 000 ]; then
            echo ACS_BOUNDARY_METADATA_REQUIRED=1 >> "$GITHUB_ENV"
          else
            echo "::warning::169.254.169.254 does not answer on this runner, so the metadata route is not tested"
          fi

      - name: Run the boundary suite
        run: pytest --noconftest -p no:cacheprovider -rs --tb=short tests/test_sandbox_boundary.py

  # The suite's Claude Code tests: headless claude -p runs of a few routes
  # in the default, acceptEdits and bypassPermissions modes. They need an
  # Anthropic credential, so the job runs its steps only when the
  # repository secret ANTHROPIC_API_KEY is set, and passes without them
  # otherwise (as on a pull request from a fork).
  sandbox-boundary-claude:
    name: Sandbox boundary through Claude Code
    runs-on: ubuntu-latest
    # The Claude Code tests took about 5 minutes locally, plus the install.
    timeout-minutes: 20
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      CLAUDE_CODE_VERSION: "2.1.332"
      SANDBOX_RUNTIME_VERSION: "0.0.82"
    steps:
      - name: Say why nothing runs
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "The repository secret ANTHROPIC_API_KEY is not set, so Claude Code is not run."

      - uses: actions/checkout@v7
        if: env.HAS_ANTHROPIC_KEY == 'true'

      - name: Set up Python
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc

      - name: Install Claude Code and what its sandbox needs
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          # The package's bin/claude.exe is a placeholder until its install
          # script copies the native binary over it; the script runs here
          # by name rather than as an npm lifecycle script.
          npm install -g --ignore-scripts "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
          pip install "pytest>=8.4.2,<10" "pytest-asyncio>=1.0,<2"

      # Claude Code's sandbox on Linux is the same runtime: srt here shows
      # whether the runner lets it start, with srt's own message if not.
      - name: Check that the sandbox can start
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          npm install -g --ignore-scripts "@anthropic-ai/sandbox-runtime@$SANDBOX_RUNTIME_VERSION"
          bash .github/scripts/sandbox-runner-setup.sh

      # A test skips when the model makes no Bash call; a run in which none
      # passed tested nothing, and fails.
      - name: Run the Claude Code routes
        if: env.HAS_ANTHROPIC_KEY == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACS_BOUNDARY_CLAUDE: "1"
        run: |
          pytest --noconftest -p no:cacheprovider -rs --tb=short -k claude_code \
            tests/test_sandbox_boundary.py | tee "$RUNNER_TEMP/claude-routes.log"
          grep -Eq '[1-9][0-9]* passed' "$RUNNER_TEMP/claude-routes.log"

  benchmarks:
    name: Benchmark validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Run benchmark tests
        run: pytest benchmarks/tests/ -v --tb=short

      - name: Run benchmark suite
        run: python benchmarks/runner.py --report --format json --output benchmarks/results/benchmark_results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/benchmark_results.json

      - name: Validate benchmark deps against ontology
        run: python tools/validate_benchmark_deps.py

  conformance:
    name: Conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: pip install -e "." -c constraints.txt

      - name: Run conformance tests
        run: python scripts/run_conformance.py

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: build/conformance_results.json
          if-no-files-found: warn

  typescript-package:
    name: TypeScript package (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/acs-core
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: packages/acs-core/package-lock.json

      # The ./wasm entry is the core built for wasm32-unknown-unknown
      # (core/src/wasm.rs). RUSTUP_TOOLCHAIN (set for every job above) makes
      # build-wasm.mjs's cargo use the toolchain installed here with the
      # target.
      - name: Install Rust with the wasm32 target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-wasm-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the WebAssembly module
        run: npm run build:wasm

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run check

      # The tests read the conformance vectors in tests/conformance/ in
      # place, and replay the validator, runtime and expression fixtures and
      # the profile vectors through the WebAssembly core; package.test.ts
      # checks `npm pack --dry-run`.
      - name: Tests
        run: npm test

  standard-agents-binding:
    name: Standard Agents binding (type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/standard_agents
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: |
            packages/acs-core/package-lock.json
            examples/standard_agents/package-lock.json

      # The binding imports the package's built dist/ (file: dependency);
      # it uses the plain-TypeScript entry only, so no WebAssembly build.
      - name: Build the TypeScript package
        working-directory: packages/acs-core
        run: |
          npm ci --ignore-scripts
          npm run build:ts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Compiles the binding and the example agent against the published
      # @standardagents/spec types, so a change there that breaks them shows.
      - name: Type-check
        run: npm run check

      - name: Tests
        run: npm test
